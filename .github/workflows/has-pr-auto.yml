# has-pr Auto-Labeler — #2490: automatically adds 'has-pr' label to issues
# when a PR is opened that references them. Eliminates the need for agents
# to manually run `gh issue edit --add-label has-pr`.
name: has-pr Auto-Labeler

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  issues: write
  pull-requests: read

jobs:
  auto-label:
    name: Auto-add has-pr to linked issues
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Add has-pr label to linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # বাংলা মন্তব্য: PR title এবং body থেকে issue number extract করো
          # Pattern: #1234 বা "Closes #1234" বা "fixes #1234" ইত্যাদি
          ISSUES=$(echo "$PR_TITLE $PR_BODY" | grep -oE '#[0-9]+' | sort -u || true)
          
          if [ -z "$ISSUES" ]; then
            echo "No issue references found in PR."
            exit 0
          fi
          
          for ISSUE_REF in $ISSUES; do
            ISSUE_NUM="${ISSUE_REF#\#}"
            echo "Adding 'has-pr' label to issue #$ISSUE_NUM..."
            gh issue edit "$ISSUE_NUM" --add-label "has-pr" || echo "::warning::Could not add has-pr to #$ISSUE_NUM"
          done
          
          echo "Done — has-pr auto-labeling complete."
