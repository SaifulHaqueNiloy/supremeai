name: "🧹 Cache Janitor (Auto Cleanup)"
on:
  schedule:
    - cron: '30 3 * * *'   # প্রতিদিন রাত ৩:৩০ UTC, main pipeline-এর পরে
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # বাংলা মন্তব্য: ৭ দিনের বেশি পুরনো বা বাতিল করা ব্রাঞ্চের ক্যাশ ডিলিট করার অটোমেশন
      - name: Delete caches older than 7 days or orphaned from closed/merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "বর্তমান cache তালিকা:"
          gh cache list --repo "$REPO" --limit 100 --json id,ref,key,createdAt,sizeInBytes \
            > caches.json

          # ৭ দিনের পুরনো cache মুছে ফেলুন
          CUTOFF=$(date -d '7 days ago' +%s)
          jq -c '.[]' caches.json | while read -r c; do
            created=$(echo "$c" | jq -r '.createdAt')
            created_ts=$(date -d "$created" +%s)
            id=$(echo "$c" | jq -r '.id')
            if [ "$created_ts" -lt "$CUTOFF" ]; then
              echo "🗑️ Deleting stale cache id=$id (created $created)"
              gh cache delete "$id" --repo "$REPO" || true
            fi
          done

      # বাংলা মন্তব্য: 8GB soft-cap — GitHub এর নিজস্ব 10GB hard eviction-এর আগেই পুরনো cache সরিয়ে Poetry/pnpm cache রক্ষা করা হচ্ছে
      - name: Enforce 8GB soft cap (proactive, before GitHub's own hard eviction)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          SOFT_CAP_BYTES=$((8 * 1024 * 1024 * 1024))
          gh cache list --repo "$REPO" --limit 100 --json id,key,createdAt,sizeInBytes \
            --jq 'sort_by(.createdAt)' > sorted_caches.json
          TOTAL=$(jq '[.[].sizeInBytes] | add // 0' sorted_caches.json)
          echo "বর্তমান মোট cache: $((TOTAL / 1048576)) MB"
          jq -c '.[]' sorted_caches.json | while read -r c; do
            if [ "$TOTAL" -le "$SOFT_CAP_BYTES" ]; then break; fi
            id=$(echo "$c" | jq -r '.id')
            size=$(echo "$c" | jq -r '.sizeInBytes')
            echo "🗑️ 8GB soft cap ছাড়িয়েছে — পুরনো cache id=$id মুছে ফেলা হচ্ছে"
            gh cache delete "$id" --repo "$REPO" || true
            TOTAL=$((TOTAL - size))
          done

      - name: Report total cache usage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache list --repo "${{ github.repository }}" --json sizeInBytes --jq '[.[].sizeInBytes] | add // 0 | . / 1048576 | tostring + " MB total"'

