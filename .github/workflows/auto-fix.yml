name: Auto-Fix CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # Run daily cleanup at 2 AM UTC
    - cron: '0 2 * * *'
env:
  PYTHONPATH: backend

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'

      - name: Install safety
        working-directory: backend
        run: poetry run pip install safety

      - name: Run isort
        working-directory: backend
        run: |
          poetry run isort --check-only --diff . || true
          poetry run isort .

      - name: Run black
        working-directory: backend
        run: |
          poetry run black --check . || true
          poetry run black .

      - name: Run ruff linting
        working-directory: backend
        run: |
          poetry run ruff check . --output-format=github || true
          poetry run ruff check . --fix || true

      - name: Security scan
        working-directory: backend
        run: |
          poetry run safety scan --json > ../safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json

      - name: Auto-commit fixes
        run: |
          git config user.name "SupremeAI Bot"
          git config user.email "bot@supremeai.dev"
          git add backend
          git commit -m "🤖 Auto-fix: CI linting fixes" || exit 0
          git push

  vulnerability-scan:
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'

      - name: Run vulnerability scan
        working-directory: backend
        run: |
          poetry run python -c "
          import asyncio
          from agents.vulnerability_prophet import VulnerabilityProphet
          prophet = VulnerabilityProphet()
          asyncio.run(prophet.analyze_project('..'))
          "

  performance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'

      - name: Check performance metrics
        working-directory: backend
        run: |
          poetry run python -c "
          import asyncio
          from agents.performance_guardian import PerformanceGuardian
          guardian = PerformanceGuardian()
          asyncio.run(guardian.check_health())
          "

  churn-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'

      - name: Run churn analysis
        working-directory: backend
        run: |
          poetry run python -c "
          import asyncio
          from agents.churn_prophet import ChurnProphet
          print('Churn Prophet ready for analysis')
          "

  report:
    needs: [auto-fix, vulnerability-scan, performance-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI report
        run: |
          echo "# CI Report" > ci-report.md
          echo "" >> ci-report.md
          echo "## Auto-Fix Results" >> ci-report.md
          echo "- ✅ Linting and formatting applied" >> ci-report.md
          echo "" >> ci-report.md
          echo "## Security Scan" >> ci-report.md
          echo "- Run vulnerability-prophet for details" >> ci-report.md
          echo "" >> ci-report.md
          echo "## Performance" >> ci-report.md
          echo "- Check performance-guardian metrics" >> ci-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.md
