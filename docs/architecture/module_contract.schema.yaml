$schema: https://json-schema.org/draft/2020-12/schema
$id: https://supremeai.dev/schemas/module-contract.schema.yaml
title: SupremeAI Module Contract
type: object
required: [domain, owner, lifecycle, public_entrypoints, permitted_dependencies, persistence, security, compatibility, tests]
additionalProperties: false
properties:
  domain: {type: string, minLength: 1}
  owner: {type: string, minLength: 1}
  lifecycle: {enum: [planned, owner-review, operational, deprecated, retired]}
  public_entrypoints:
    type: array
    items:
      type: object
      required: [name, kind, version]
      additionalProperties: false
      properties:
        name: {type: string}
        kind: {enum: [http, python, typescript, event, mcp, cli]}
        version: {type: string}
        input_schema: {type: [object, string]}
        output_schema: {type: [object, string]}
  permitted_dependencies:
    type: array
    items: {type: string}
  persistence:
    type: object
    required: [owner, writes]
    additionalProperties: false
    properties:
      owner: {type: string}
      writes: {type: array, items: {type: string}}
      reads: {type: array, items: {type: string}}
  security:
    type: object
    required: [requires_actor_context, requires_tenant_context, authorization_policy]
    additionalProperties: false
    properties:
      requires_actor_context: {type: boolean}
      requires_tenant_context: {type: boolean}
      authorization_policy: {type: string}
  error_model: {type: array, items: {type: string}}
  health_signals: {type: array, items: {type: string}}
  compatibility:
    type: object
    required: [version_policy, preserved_callers]
    additionalProperties: false
    properties:
      version_policy: {type: string}
      preserved_callers: {type: array, items: {type: string}}
  tests:
    type: object
    required: [unit, contract, integration]
    additionalProperties: false
    properties:
      unit: {type: array, items: {type: string}}
      contract: {type: array, items: {type: string}}
      integration: {type: array, items: {type: string}}
