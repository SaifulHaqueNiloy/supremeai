name: Slot Registry Drift

on:
  pull_request:
    paths:
      - backend/core/agent_registry.json
      - docs/master_docs/AGENT_SLOT_REGISTRY.yaml
      - scripts/agents/**
      - docs/agents/heartbeat-integration.md

permissions:
  contents: read

concurrency:
  group: slot-registry-drift-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check slot registry drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --quiet pyyaml python-dotenv

      - name: Run slot registry drift check
        run: python3 scripts/agents/check_slot_registry_drift.py
