# Operator utility — set one repository Actions variable (issue #472 enabler)
#
# বাংলা: এজেন্ট/ফাইন-গ্রেইন্ড PAT-এ Variables:write নেই; কিন্তু রিপোর
# built-in GITHUB_TOKEN-এর `variables: write` permission থাকলে সেটি সেট করতে
# পারে। Guarded experiments (যেমন #472 pytest-xdist) চালানোর জন্য
# operator-variable টগল করার লিটিল অডিটেবল ইউটিলিটি।
#
# English: workflow_dispatch utility that sets ONE repository variable per run.
# Every invocation is audit-logged (who/when); the value itself is masked in
# run logs (issue #709 item 5). NOTE: repository variables are NOT secrets —
# they are visible to anyone with repo read access and recorded with the
# workflow_dispatch inputs, so never paste secret values into this utility.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Variable name"
        required: true
        type: string
      value:
        description: "Variable value"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: repo-variable-set-${{ github.event.inputs.name }}
  cancel-in-progress: false

jobs:
  set-variable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warning — variables are not secrets
        run: |
          echo "::warning::Repository variables are NOT secrets — they are readable by anyone with repo access and recorded with the workflow_dispatch inputs. Do not paste secret values."

      - name: Set repository variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VAR_NAME: ${{ github.event.inputs.name }}
          VAR_VALUE: ${{ github.event.inputs.value }}
        run: |
          # Issue #709 (item 5): mask the value so it can never leak into run
          # logs (e.g. via gh error output), and never print variable values.
          echo "::add-mask::$VAR_VALUE"
          case "$VAR_NAME" in
            *[!A-Za-z0-9_]*) echo "::error::Invalid variable name"; exit 1 ;;
          esac
          gh variable set "$VAR_NAME" --body "$VAR_VALUE"
          echo "Set $VAR_NAME (value masked)."
