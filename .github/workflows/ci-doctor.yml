# CI Doctor — CI ব্যর্থতার স্বয়ংক্রিয় সৎ-প্রতিক্রিয়া (V8)
#
# বাংলা মন্তব্য: এই workflow দুটি কাজ করে —
#   ১) main-এ CI লাল হলে একটি tracking issue খোলে/আপডেট করে (কোন job কেন ফেল —
#      লাইভ jobs API থেকে, কোনো অনুমান নয়) — আগে অনুপস্থিত "নীরব লাল" ফাঁক বন্ধ করে।
#   ২) ব্যর্থতার কারণ যদি শুধু generated evidence drift হয় (V7-এ ২ বার ঘটেছে),
#      তবে ৫টি generator চালিয়ে শুধুমাত্র docs/generated/ ফাইল সহ একটি
#      "[skip ci]" কমিট দিয়ে push করে — মানুষের হাত লাগে না, লুপ-নিরাপদ।
#   সব সবুজ হলে ট্র্যাকড ইস্যুগুলো অটো-বন্ধ হয়।
#
# দর্শন: zero cost (GitHub-native gh CLI), lightweight (এক job), zero-hardcode
# (failed job তালিকা live API থেকে; drift শুধু generator-এর প্রকৃত আউটপুট থেকে)।

name: CI Doctor

on:
  workflow_call:
    inputs:
      run_id:
        description: "The GitHub Actions workflow run ID to diagnose (defaults to caller's run_id)"
        required: false
        type: string
        default: ""
      run_url:
        description: "Direct URL to the run being diagnosed"
        required: false
        type: string
        default: ""
      workflow_name:
        description: "Name of the caller workflow"
        required: false
        type: string
        default: ""
      conclusion:
        description: "Execution status of the caller run (success | failure)"
        required: false
        type: string
        default: ""
  workflow_run:
    # বাংলা: workflow_run-এর জন্য হুবহু name ম্যাচ বাধ্যতামূলক — তাই তালিকার প্রতিটি
    # নাম সংশ্লিষ্ট ফাইলের `name:` ফিল্ডের সাথে অক্ষরে-অক্ষরে মিলতে হবে (V10 Task-14-e)।
    # শিডিউল-চালিত workflow-গুলোর ব্যর্থতা আগে সম্পূর্ণ নীরব ছিল — কেউ দেখতই না।
    # সতর্কতা: "Scheduled Deep Audit" নামটি আগে কখনোই ম্যাচ করত না — প্রকৃত নাম
    # "🔧 Scheduled Deep Audit & Maintenance" (নীরব-ব্যর্থতা বাগ, এখানেই সংশোধিত)।
    workflows:
      # বাংলা: "CI Pipeline" এখানে নেই — ci.yml নিজেই শেষে workflow_call দিয়ে
      # ci-doctor invoke করে। এখানে রাখলে double-run হতো (resource waste)।
      - "🔧 Scheduled Deep Audit & Maintenance"
      - "🤖 Manual Maintenance & Auto-Fix"
      - "DB Retention Prune"
      - "Audit & Official Release Center"
      - "QA — E2E Customer Suite"
      - "Constitution Governance"
      - "DAST Gate (OWASP ZAP)"
      # বাংলা: লাইভ প্রোডাকশন প্রোব — এটি লাল হলে প্রোডাকশন পাথ ভাঙা/অযাচাইকৃত,
      # নীরব থাকা প্রশ্রয় দেওয়া যাবে না (V10 doc-truth রাউন্ড)।
      - "QA — Live Production Smoke"
      # বাংলা: post-deploy canary এখন workflow_dispatch দিয়েও চলে — ব্যর্থতা নীরব থাকবে না।
      - "QA — Post-Deploy Smoke"
    types: [completed]

permissions:
  contents: write
  issues: write
  actions: read
  checks: read

concurrency:
  group: ci-doctor-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    if: ${{ github.event_name == 'workflow_call' || github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: "Resolve execution context (dual-mode: workflow_call & workflow_run)"
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_RUN_URL: ${{ inputs.run_url }}
          INPUT_WF_NAME: ${{ inputs.workflow_name }}
          INPUT_CONCLUSION: ${{ inputs.conclusion }}
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            TARGET_RUN_ID="${INPUT_RUN_ID:-$GITHUB_RUN_ID}"
            RUN_DATA=$(gh api "repos/${{ github.repository }}/actions/runs/${TARGET_RUN_ID}" 2>/dev/null || echo '{}')
            TARGET_URL="${INPUT_RUN_URL:-$(echo "$RUN_DATA" | jq -r '.html_url // empty')}"
            [ -z "$TARGET_URL" ] && TARGET_URL="https://github.com/${{ github.repository }}/actions/runs/${TARGET_RUN_ID}"
            TARGET_NAME="${INPUT_WF_NAME:-$(echo "$RUN_DATA" | jq -r '.name // empty')}"
            [ -z "$TARGET_NAME" ] && TARGET_NAME="${{ github.workflow }}"
            TARGET_CONC="${INPUT_CONCLUSION:-$(echo "$RUN_DATA" | jq -r '.conclusion // empty')}"
            # If still unset/in_progress, inspect jobs to determine if any failed
            if [ -z "$TARGET_CONC" ] || [ "$TARGET_CONC" = "null" ]; then
              FAIL_COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${TARGET_RUN_ID}/jobs" \
                --jq '[.jobs[] | select(.conclusion=="failure")] | length' 2>/dev/null || echo "0")
              if [ "$FAIL_COUNT" -gt 0 ]; then
                TARGET_CONC="failure"
              else
                TARGET_CONC="success"
              fi
            fi
          else
            TARGET_RUN_ID="${{ github.event.workflow_run.id }}"
            TARGET_URL="${{ github.event.workflow_run.html_url }}"
            TARGET_NAME="${{ github.event.workflow_run.name }}"
            TARGET_CONC="${{ github.event.workflow_run.conclusion }}"
          fi
          echo "run_id=${TARGET_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "run_url=${TARGET_URL}" >> "$GITHUB_OUTPUT"
          echo "wf_name=${TARGET_NAME}" >> "$GITHUB_OUTPUT"
          echo "conclusion=${TARGET_CONC}" >> "$GITHUB_OUTPUT"
          echo "event_name=${EVENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved Context: ID=$TARGET_RUN_ID, URL=$TARGET_URL, Name=$TARGET_NAME, Conclusion=$TARGET_CONC, Event=$EVENT_NAME"

      - name: Collect failure facts (live jobs API — অনুমান নয়, প্রমাণ)
        id: facts
        if: ${{ steps.ctx.outputs.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          {
            echo 'failed_jobs<<EOF'
            gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
              --jq '.jobs[] | select(.conclusion=="failure") | "- \(.name)"' || echo "- (jobs API unreachable)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open/update honest tracking issue on failure
        if: ${{ steps.ctx.outputs.conclusion == 'failure' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = "🔴 CI failed on main — auto-tracked by CI Doctor";
            const runUrl = "${{ steps.ctx.outputs.run_url }}";
            const wfName = "${{ steps.ctx.outputs.wf_name }}";
            const runDate = new Date().toISOString();
            const runId = parseInt("${{ steps.ctx.outputs.run_id }}", 10);

            // Fetch failed jobs with step-level errors if available
            const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const jobs = jobsResp.data.jobs || [];
            const failedJobList = jobs.filter(j => j.conclusion === "failure");

            const newFailures = failedJobList.map(j => {
              const failedStep = (j.steps || []).find(s => s.conclusion === "failure");
              const stepName = failedStep ? ` (ধাপ: ${failedStep.name})` : "";
              return `- \`${j.name}\`${stepName}`;
            });

            if (newFailures.length === 0) {
              newFailures.push(`${{ steps.facts.outputs.failed_jobs }}`.trim() || "- (অজ্ঞাত ব্যর্থতা)");
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci-doctor",
            });
            const match = existing.data.find(i => i.title === title);

            let cumulativeJobs = new Set(newFailures);
            let previousHistory = "";

            if (match && match.body) {
              // Extract previous unresolved failures
              const lines = match.body.split("\n");
              let capturing = false;
              for (const line of lines) {
                if (line.startsWith("**ব্যর্থ job:**") || line.startsWith("### 🚨 ব্যর্থ Job-এর সম্মিলিত তালিকা")) {
                  capturing = true;
                  continue;
                }
                if (capturing && (line.startsWith("---") || line.startsWith("**রান/লগ:**") || line.startsWith("### "))) {
                  capturing = false;
                }
                if (capturing && line.trim().startsWith("- ")) {
                  cumulativeJobs.add(line.trim());
                }
              }
              previousHistory = `\n\n> ⚠️ **অমীমাংসিত সমস্যা সতর্কতা:** পূর্ববর্তী ব্যর্থতাগুলো এখনও ঠিক করা হয়নি! নতুন রানের ত্রুটি পূর্বের তালিকার সাথে যুক্ত করা হয়েছে।\n`;
            }

            const body = [
              "## 🔴 CI Failure Tracker (Auto-Tracked by CI Doctor)",
              "",
              "স্বয়ংক্রিয়ভাবে তৈরি — `main` ব্রাঞ্চে CI ব্যর্থ হয়েছে (live jobs API থেকে সংগৃহীত):",
              previousHistory,
              `**সর্বশেষ ব্যর্থ workflow:** ${wfName}`,
              `**সর্বশেষ ব্যর্থ রান:** [${runUrl}](${runUrl})`,
              `**শনাক্তের সময়:** ${runDate}`,
              "",
              "### 🚨 ব্যর্থ Job-এর সম্মিলিত তালিকা (পূর্বের ও নতুন অমীমাংসিত ত্রুটি):",
              Array.from(cumulativeJobs).join("\n"),
              "",
              "---",
              "",
              "#### 🛠️ এআই এজেন্ট ও ডেভেলপারদের করণীয়:",
              "1. উল্লেখিত Job ও ধাপগুলো বিশ্লেষণ করে ত্রুটি সংশোধন করুন।",
              "2. নতুন পুশ বা পিআর মার্জের পর `main` ব্রাঞ্চে পরবর্তী সিআই রান ১০০% সবুজ হলে এই ইস্যুটি স্বয়ংক্রিয়ভাবে ক্লোজ হবে।",
            ].join("\n");

            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              // Post comment update for visibility
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `🔄 **CI Doctor Update:** \`main\`-এ নতুন রান ব্যর্থ হয়েছে। পূর্বের অমীমাংসিত ত্রুটির সাথে নতুন ত্রুটি আপডেট করা হলো।\n\nরান: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ci-doctor", "maintenance"],
              });
            }

      - name: Regenerate evidence (drift-only auto-fix)
        id: regen
        # বাংলা: শুধুমাত্র workflow_run ইভেন্টে স্বয়ংক্রিয় auto-fix পুশ করা নিরাপদ (runner conflict এড়াতে)
        if: ${{ steps.ctx.outputs.event_name == 'workflow_run' && steps.ctx.outputs.conclusion == 'failure' }}
        run: |
          set -uo pipefail
          python scripts/ci/generate_route_inventory.py
          python scripts/ci/generate_route_graph.py
          python scripts/ci/generate_topology_mermaid.py
          python scripts/ci/generate_module_capability_matrix.py
          python scripts/ci/generate_domain_dependency_graph.py
          # বাংলা: STATUS.md দাবি-যাচাইকারী generator — ব্যর্থ হলে auto-fix হবে না
          # (দাবি সংশোধন মানুষের কাজ), কিন্তু ::error দিয়ে দৃশ্যমান হবে — নীরব নয়।
          python scripts/ci/generate_status_proof.py || echo "::error::generate_status_proof FAILED — STATUS.md claim drift; not auto-fixable (human fix required)"
          # বাংলা: শুধু docs/generated/ বদলেছে তখনই auto-fix — অন্য কিছু বদলালে মানুষের হাতে
          if git diff --quiet -- docs/generated/; then
            echo "drift=none" >> "$GITHUB_OUTPUT"
            echo "কোনো evidence drift নেই — ব্যর্থতার কারণ অন্য (ইস্যুতে ট্র্যাকড)"
          else
            OTHER=$(git status --porcelain | grep -v "^ M docs/generated/" | grep -v "^M  docs/generated/" | grep -v "^?? docs/generated/" || true)
            if [ -n "$OTHER" ]; then
              echo "drift=mixed" >> "$GITHUB_OUTPUT"
              echo "::warning::docs/generated ছাড়াও অন্য পরিবর্তন আছে — নিরাপত্তার্থে auto-push বাদ"
            else
              echo "drift=clean" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Push regenerated evidence ([skip ci] — লুপ-নিরাপদ)
        if: ${{ steps.regen.outputs.drift == 'clean' }}
        # Issue #474: auto-regen কমিট নয়েজ ক্যাপ — শেষ auto-regen কমিটের পর
        # ন্যূনতম CI_DOCTOR_REGEN_THROTTLE_SECONDS (default 21600 = ৬ ঘণ্টা)
        # না গেলে push থ্রটল হয়। drift হারায় না: পরের scheduled doctor রান
        # উইন্ডো খুললেই সেটাই কমিট করে। [skip ci] থাকায় কোনো লুপ-চাপ নেই।
        run: |
          git config user.name "SupremeAI-CIDoctor"
          git config user.email "cidoctor@supremeai.dev"
          THROTTLE="${CI_DOCTOR_REGEN_THROTTLE_SECONDS:-21600}"
          LAST=$(git log --grep='auto-regen' -1 --format=%ct || echo 0)
          NOW=$(date +%s)
          AGE=$((NOW - ${LAST:-0}))
          if [ "${LAST:-0}" -gt 0 ] && [ "$AGE" -lt "$THROTTLE" ]; then
            REMAIN=$(( (THROTTLE - AGE) / 60 + 1 ))
            echo "⏳ evidence drift শনাক্ত হয়েছে কিন্তু auto-regen থ্রটল হয়েছে (শেষ regen মাত্র ${AGE}s আগে; উইন্ডো ${THROTTLE}s) — ~${REMAIN} মিনিট পরের scheduled doctor রান এটি পিক-আপ করবে (issue #474 commit-noise cap)।"
            echo "::notice::CI Doctor evidence regen throttled — drift stays visible in the next scheduled window (issue #474)"
            exit 0
          fi
          git add docs/generated/
          git commit -m "[skip ci] chore(ci-evidence): auto-regen — drift detected by CI Doctor"
          git pull --rebase origin main
          git push origin main
          echo "✅ evidence auto-fixed; CI নতুন রান ট্রিগার হবে না ([skip ci])"

      - name: Auto-close tracked failure issues on green
        if: ${{ steps.ctx.outputs.conclusion == 'success' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-doctor",
            });
            for (const issue of existing.data) {
              if (issue.title.includes("🔴 CI failed on main")) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "✅ পরবর্তী CI রান সবুজ হয়েছে — স্বয়ংক্রিয়ভাবে বন্ধ করা হলো।",
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: "closed",
                });
              }
            }

      - name: Sync Active Warning Ledger (live annotations API)
        if: ${{ always() }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const runId = parseInt("${{ steps.ctx.outputs.run_id }}", 10);
            const runUrl = "${{ steps.ctx.outputs.run_url }}";
            const wfName = "${{ steps.ctx.outputs.wf_name }}";
            const ledgerTitle = "⚠️ Active CI & Codebase Warning Ledger — Auto-Tracked by CI Doctor";
            const ledgerLabels = ["ci-doctor", "warning-ledger", "maintenance"];

            // 1. Fetch all jobs for this workflow run
            const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const jobs = jobsResp.data.jobs || [];

            // 2. Extract warning annotations from all completed jobs
            const codeWarnings = [];
            const runnerWarnings = [];

            for (const job of jobs) {
              if (job.conclusion === "skipped") continue;
              try {
                const annResp = await github.rest.checks.listAnnotations({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: job.id,
                });
                const annotations = annResp.data || [];
                for (const ann of annotations) {
                  if (ann.annotation_level === "warning") {
                    const item = {
                      job: job.name,
                      path: ann.path || "(unknown)",
                      line: ann.start_line || 1,
                      message: (ann.message || "").trim().replace(/\r?\n|\r/g, " "),
                    };
                    if (item.path.startsWith(".github") || item.message.toLowerCase().includes("deprecated") || item.message.toLowerCase().includes("node.js")) {
                      runnerWarnings.push(item);
                    } else {
                      codeWarnings.push(item);
                    }
                  }
                }
              } catch (err) {
                console.log(`Failed to fetch annotations for job ${job.id} (${job.name}):`, err.message);
              }
            }

            const extractedTotalWarnings = codeWarnings.length + runnerWarnings.length;
            console.log(`Extracted total warnings: ${extractedTotalWarnings} (Code: ${codeWarnings.length}, Runner: ${runnerWarnings.length})`);

            // 3. Search for existing warning ledger issue
            const allIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              labels: "warning-ledger",
            });
            const ledgerIssue = allIssues.data.find(i => i.title === ledgerTitle);

            // 4. Merge previous unresolved warnings with newly found warnings
            const codeWarningMap = new Map();
            const runnerWarningMap = new Map();

            // Populate from existing open issue if available to preserve history
            if (ledgerIssue && ledgerIssue.state === "open" && ledgerIssue.body) {
              const lines = ledgerIssue.body.split("\n");
              let section = null;
              for (const line of lines) {
                if (line.includes("Linter & Test Warnings")) {
                  section = "code";
                  continue;
                } else if (line.includes("Runner & Infra Deprecations")) {
                  section = "runner";
                  continue;
                } else if (line.startsWith("---") || line.startsWith("#### ")) {
                  section = null;
                }

                if (section && line.startsWith("| `") && !line.includes("| ফাইল ও লাইন |")) {
                  const parts = line.split("|").map(p => p.trim()).filter(Boolean);
                  if (parts.length >= 3) {
                    const rawKey = parts[0].replace(/`/g, "");
                    const msg = parts[1];
                    const job = parts[2];
                    const [path, lineNum] = rawKey.split(":");
                    const key = `${rawKey}::${msg}`;
                    const item = {
                      job,
                      path: path || "(unknown)",
                      line: parseInt(lineNum, 10) || 1,
                      message: msg,
                    };
                    if (section === "code") {
                      codeWarningMap.set(key, item);
                    } else if (section === "runner") {
                      runnerWarningMap.set(key, item);
                    }
                  }
                }
              }
            }

            // Merge current run's warnings
            for (const item of codeWarnings) {
              const key = `${item.path}:${item.line}::${item.message.slice(0, 140)}`;
              codeWarningMap.set(key, item);
            }
            for (const item of runnerWarnings) {
              const key = `${item.path}:${item.line}::${item.message.slice(0, 140)}`;
              runnerWarningMap.set(key, item);
            }

            const cumulativeCodeWarnings = Array.from(codeWarningMap.values());
            const cumulativeRunnerWarnings = Array.from(runnerWarningMap.values());
            const totalWarnings = cumulativeCodeWarnings.length + cumulativeRunnerWarnings.length;

            console.log(`Cumulative active warnings: ${totalWarnings} (Code: ${cumulativeCodeWarnings.length}, Runner: ${cumulativeRunnerWarnings.length})`);

            // 5. If total warnings is 0, auto-close if open
            if (totalWarnings === 0) {
              if (ledgerIssue && ledgerIssue.state === "open") {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: ledgerIssue.number,
                  body: `🎉 **All Warnings Cleared!** ${wfName} রানে কোডবেস এবং সিআই পাইপলাইনে কোনো সক্রিয় সতর্কবার্তা অবশিষ্ট নেই (Zero warnings remaining)।\n\nRun: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: ledgerIssue.number,
                  state: "closed",
                });
                console.log(`Closed warning ledger issue #${ledgerIssue.number} as clean.`);
              }
              return;
            }

            // 5. Build clean markdown report
            let body = [
              "## ⚠️ Active CI & Codebase Warning Ledger",
              "",
              "> **স্বয়ংক্রিয় অডিট (CI Doctor):** পাইপলাইনে তৈরি হওয়া সকল অদৃশ্য সতর্কবার্তা (invisible warnings) এক নজরে ট্র্যাক করার জন্য এই লাইভ লেজারটি স্বয়ংক্রিয়ভাবে হালনাগাদ করা হয়।",
              "",
              `**উৎস Workflow:** ${wfName}`,
              `**সর্বশেষ রান:** [${runUrl}](${runUrl})`,
              `**মোট সতর্কবার্তা:** ${totalWarnings} টি (কোডবেস: ${cumulativeCodeWarnings.length}, রানার/ইনফ্রা: ${cumulativeRunnerWarnings.length})`,
              `**তারিখ ও সময়:** ${new Date().toISOString()}`,
              "",
              "---",
              "",
              "### 🧩 কোডবেস ও টেস্ট সংক্রান্ত সতর্কতা (Linter & Test Warnings)",
              cumulativeCodeWarnings.length === 0 ? "*(কোনো কোডবেস সতর্কতা নেই — চমৎকার!)*" : [
                "| ফাইল ও লাইন | ত্রুটি / সতর্কবার্তা | সংশ্লিষ্ট Job |",
                "| :--- | :--- | :--- |",
                ...cumulativeCodeWarnings.map(w => `| \`${w.path}:${w.line}\` | ${w.message.replace(/\|/g, "\\|").slice(0, 140)} | ${w.job} |`),
              ].join("\n"),
              "",
              "---",
              "",
              "### ⚙️ GitHub Actions রানার ও ডিপেনডেন্সি অবলুপ্তি (Runner & Infra Deprecations)",
              cumulativeRunnerWarnings.length === 0 ? "*(কোনো রানার সতর্কতা নেই)*" : [
                "| পাথ / মডিউল | অবলুপ্তি বার্তা | সংশ্লিষ্ট Job |",
                "| :--- | :--- | :--- |",
                ...cumulativeRunnerWarnings.map(w => `| \`${w.path}:${w.line}\` | ${w.message.replace(/\|/g, "\\|").slice(0, 140)} | ${w.job} |`),
              ].join("\n"),
              "",
              "---",
              "",
              "#### 🛠️ এআই এজেন্ট ও ডেভেলপারদের করণীয়:",
              "1. আপনি যখন কোনো সম্পর্কিত ফাইলে কাজ করবেন বা নতুন ফিচার যোগ করবেন, তখন উল্লেখিত ফাইলের Warning-গুলো ঠিক করে ফেলুন।",
              "2. Warning ফিক্স করে PR মার্জ বা main-এ পুশ করলে পরবর্তী রানে এই তালিকা নিজে থেকেই আপডেট বা ক্লোজ হবে।",
            ].join("\n");

            // 6. Create or update ledger issue
            if (ledgerIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ledgerIssue.number,
                title: ledgerTitle,
                body: body,
                state: "open",
              });
              console.log(`Updated existing warning ledger issue #${ledgerIssue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: ledgerTitle,
                body: body,
                labels: ledgerLabels,
              });
              console.log(`Created new warning ledger issue #${created.data.number}`);
            }
