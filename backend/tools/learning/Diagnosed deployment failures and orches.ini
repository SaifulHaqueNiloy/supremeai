Render/GitHub PAT দুটোই এখন rotate করা জরুরি — দুটোই এই চ্যাটে plaintext-এ ছিল। GitHub-এ Settings → Developer settings → Personal access tokens থেকে এই টোকেন revoke করে নতুন একটা বানান।
