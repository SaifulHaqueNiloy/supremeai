name: 'Playwright Browser Setup'
description: 'Standardized Playwright browser caching and installation for Chromium'
inputs:
  browser:
    description: 'Browser name to install (default: chromium)'
    required: false
    default: 'chromium'
runs:
  using: 'composite'
  steps:
    - name: Get Playwright Version
      id: pw-version
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright Browsers
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-${{ inputs.browser }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-

    - name: Install Playwright Browsers & Deps
      shell: bash
      run: |
        if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
          pnpm exec playwright install --with-deps ${{ inputs.browser }}
        else
          pnpm exec playwright install-deps ${{ inputs.browser }}
        fi
