# SupremeAI 2.0 — Microservices Blueprint (Zero Cost Edition)
# Phase 1: Main backend + Scraper service on Render (free tier, quota-aware)
# Phase 2: Media processing on Cloud Run (free tier)
# Phase 3: Edge gateway on Cloudflare Worker (free tier)
services:

  # ── MAIN BACKEND SERVICE (CRITICAL - was missing) ───────────────────
  # This is the primary backend API service that powers both admin and user portals
  - type: web
    name: supremeai-backend-docker
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: false  # CI pipeline is the single deploy authority
    envVars:
      - key: PORT
        value: "8080"
      - key: ENV
        value: production
      - key: SERVICE_ROLE
        value: "admin"
      - key: CORS_ORIGINS
        value: '["https://supremeai-admin.web.app","https://supremeai-a.web.app","https://supremeai-studio-client.onrender.com"]'
      - key: ALLOWED_HOSTS
        value: "supremeai-backend-docker.onrender.com,supremeai-admin.web.app,supremeai-a.web.app"
    # Disk and instance settings for free tier optimization
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

  # Phase 1: Scraper/Browser Automation Service (decoupled from main backend)
  # Docker runtime: the Python buildpack runs non-root and `playwright install
  # --with-deps` fails with `su: Authentication failure`. The Dockerfile installs
  # Playwright + system deps as root, so chromium launches correctly.
  - type: web
    name: supremeai-scraper
    env: docker
    rootDir: backend/services/scraper
    dockerfilePath: Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: false  # CI pipeline is the single deploy authority
    envVars:
      - key: PORT
        value: "8080"
      - key: ENV
        value: production
      - key: SCRAPER_MAX_CONCURRENCY
        value: "3"
      - key: SCRAPER_TIMEOUT_SECONDS
        value: "45"

  - type: web
    name: supremeai-frontend
    env: static
    rootDir: .
    buildCommand: "bash scripts/render_build_frontend.sh"
    staticPublishPath: "./frontend/dist-user"
    autoDeploy: false  # CI pipeline is the single deploy authority (see ci.yml deploy-backend job)
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: CI
        value: "false"
      - key: PNPM_FLAGS
        value: "--no-frozen-lockfile"
      - key: VITE_ADMIN_BACKEND
        value: "https://supremeai-backend-docker.onrender.com"
      - key: VITE_USER_BACKEND
        value: "https://supremeai-backend-docker.onrender.com"
      - key: VITE_API_URL
        value: "https://supremeai-backend-docker.onrender.com"
      - key: VITE_PORTAL_TYPE
        value: "user"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: cross-origin
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: unsafe-none
