### Phase 2: Performance & Efficiency (Priority: HIGH)

#### ২.১ Multi-Layer Cache — Add Local LRU Cache
**কী করবেন**: Redis-এর আগে in-memory LRU cache যোগ করুন (১০০MB limit) — যাতে একই রিকুয়েস্টে Redis call কমে।

**বাস্তবায়ন**:
```python
# backend/core/cache/multi_layer_cache.py
from cachetools import TTLCache

class MultiLayerCache:
    def __init__(self):
        self.l1_cache = TTLCache(maxsize=1000, ttl=60)  # 1 minute local
        self.redis = redis_manager

    async def get(self, key: str):
        # L1 check
        if key in self.l1_cache:
            return {"source": "l1_memory", "value": self.l1_cache[key]}

        # L2 Redis check
        val = await self.redis.get_cache(key)
        if val:
            self.l1_cache[key] = val  # Backfill L1
            return {"source": "l2_redis", "value": val}
        return None
```

#### ২.২ LLM Gateway — Smart Token Budget & Circuit Breaker
**কী করবেন**: `free_tier_tracker.py` কে আরও strict করুন এবং circuit breaker যোগ করুন।

**বাস্তবায়ন**:
```python
# backend/core/llm/circuit_breaker.py
from pybreaker import CircuitBreaker

class LLMCircuitBreaker:
    def __init__(self):
        self.breakers = {
            "groq": CircuitBreaker(fail_max=5, reset_timeout=60),
            "google": CircuitBreaker(fail_max=3, reset_timeout=120),
            "together": CircuitBreaker(fail_max=5, reset_timeout=60),
        }

    async def call(self, provider: str, fn, *args, **kwargs):
        breaker = self.breakers.get(provider)
        if breaker and breaker.current_state == "open":
            logger.warning(f"Circuit OPEN for {provider}, falling back...")
            return await self._fallback_call(*args, **kwargs)
        try:
            return await fn(*args, **kwargs)
        except Exception:
            if breaker:
                breaker.record_failure()
            raise
```

#### ২.৩ Database Connection Consolidation
**কী করবেন**: `asyncpg` pool-কে global singleton বানান এবং সব জায়গায় সেটি ব্যবহার করুন।

**বাস্তবায়ন**:
```python
# backend/database/session.py
import asyncpg

class DatabasePool:
    _instance = None

    @classmethod
    async def get_pool(cls):
        if cls._instance is None:
            cls._instance = await asyncpg.create_pool(
                dsn=settings.database_url,
                min_size=2,
                max_size=10,  # Render free tier limit is 25
                command_timeout=60,
                server_settings={'jit': 'off'}
            )
        return cls._instance
```

