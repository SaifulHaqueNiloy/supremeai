name: "🧹 Cache Janitor (Auto Cleanup)"
on:
  schedule:
    - cron: '30 3 * * *'   # প্রতিদিন রাত ৩:৩০ UTC, main pipeline-এর পরে
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # বাংলা মন্তব্য: প্রতিটি cache-এর key prefix দেখে আলাদা TTL (Time-To-Live) প্রয়োগ করা হচ্ছে।
      # - turbo/* (build cache): ৩ দিন — প্রতিটি build-এ এগুলো নতুন হয়
      # - playwright/*: ৭ দিন — browser binary বড় কিন্তু কম পরিবর্তন হয়
      # - venv/pycache/pnpm: ১৪ দিন — dependency cache দীর্ঘ সময় কার্যকর থাকে
      - name: Priority TTL Eviction (turbo=3d, playwright=7d, deps=14d)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "## 🧹 Cache Janitor Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "বর্তমান cache তালিকা লোড করা হচ্ছে..."
          gh cache list --repo "$REPO" --limit 100 --json id,ref,key,createdAt,sizeInBytes \
            > caches.json

          DELETED=0
          KEPT=0

          jq -c '.[]' caches.json | while read -r c; do
            key=$(echo "$c" | jq -r '.key')
            created=$(echo "$c" | jq -r '.createdAt')
            created_ts=$(date -d "$created" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$created" +%s 2>/dev/null || echo "0")
            id=$(echo "$c" | jq -r '.id')
            size_mb=$(echo "$c" | jq -r '.sizeInBytes // 0 | . / 1048576 | floor')

            # বাংলা মন্তব্য: key prefix দেখে TTL নির্ধারণ করা হচ্ছে
            if [[ "$key" == *"turbo"* ]]; then
              TTL_DAYS=3
              CATEGORY="build/turbo"
            elif [[ "$key" == *"playwright"* ]]; then
              TTL_DAYS=7
              CATEGORY="playwright"
            else
              TTL_DAYS=14
              CATEGORY="deps"
            fi

            CUTOFF=$(date -d "${TTL_DAYS} days ago" +%s)
            if [ "$created_ts" -lt "$CUTOFF" ]; then
              echo "🗑️ TTL expired (${TTL_DAYS}d) [$CATEGORY] ${size_mb}MB: $key"
              gh cache delete "$id" --repo "$REPO" || true
            else
              echo "✅ Keeping [$CATEGORY] ${size_mb}MB: $key"
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ TTL-based eviction সম্পন্ন।" >> $GITHUB_STEP_SUMMARY

      # বাংলা মন্তব্য: 8GB soft-cap — GitHub এর নিজস্ব 10GB hard eviction-এর আগেই সক্রিয়।
      # Size cap-এর সময় eviction priority: turbo (আগে মুছবে) → playwright → venv → pypoetry/pnpm (শেষে মুছবে)
      # এইভাবে dependency cache সবচেয়ে দীর্ঘ সময় টিকে থাকে।
      - name: Enforce 8GB soft cap (priority-ordered eviction)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          SOFT_CAP_BYTES=$((8 * 1024 * 1024 * 1024))

          # বাংলা মন্তব্য: key prefix দেখে priority score নির্ধারণ — ছোট score = আগে মুছবে
          # 1=turbo (build), 2=playwright, 3=venv/pnpm (deps সবশেষে)
          gh cache list --repo "$REPO" --limit 100 --json id,key,createdAt,sizeInBytes \
            --jq 'sort_by(.createdAt)' > sorted_caches.json

          TOTAL=$(jq '[.[].sizeInBytes] | add // 0' sorted_caches.json)
          echo "বর্তমান মোট cache: $((TOTAL / 1048576)) MB" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -le "$SOFT_CAP_BYTES" ]; then
            echo "✅ 8GB soft cap-এর মধ্যে আছে — কোনো eviction দরকার নেই।" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "⚠️ 8GB soft cap ছাড়িয়েছে — priority-based eviction শুরু হচ্ছে..." >> $GITHUB_STEP_SUMMARY

          # Priority 1: turbo/build cache (আগে মুছবে)
          for PATTERN in "turbo" "playwright" "venv" "pycache" "pnpm"; do
            jq -c '.[]' sorted_caches.json | while read -r c; do
              if [ "$TOTAL" -le "$SOFT_CAP_BYTES" ]; then break; fi
              key=$(echo "$c" | jq -r '.key')
              id=$(echo "$c" | jq -r '.id')
              size=$(echo "$c" | jq -r '.sizeInBytes')
              if [[ "$key" == *"$PATTERN"* ]]; then
                echo "🗑️ Size cap [$PATTERN]: id=$id ($((size/1048576))MB) মুছে ফেলা হচ্ছে"
                gh cache delete "$id" --repo "$REPO" || true
                TOTAL=$((TOTAL - size))
              fi
            done
          done

      - name: Report total cache usage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(gh cache list --repo "${{ github.repository }}" --json sizeInBytes --jq '[.[].sizeInBytes] | add // 0 | . / 1048576 | floor | tostring + " MB total"')
          echo "### 📊 Cache Usage After Cleanup: $RESULT" >> $GITHUB_STEP_SUMMARY
          gh cache list --repo "${{ github.repository }}" --json key,sizeInBytes \
            --jq '.[] | "- " + .key + " (" + (.sizeInBytes/1048576|floor|tostring) + "MB)"' >> $GITHUB_STEP_SUMMARY || true
