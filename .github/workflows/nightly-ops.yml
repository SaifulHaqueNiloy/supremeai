    env:
      ZAP_TARGET: ${{ inputs.dast_base_url || vars.STAGING_BASE_URL }}
    timeout-minutes: 45
    steps:
      - name: Require scan target
        if: env.ZAP_TARGET == ''
        run: |
          echo "::error::STAGING_BASE_URL repo variable (or base_url input) is required."
          echo "::error::Refusing to scan without an explicit environment."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ZAP Full scan (baseline)
        uses: zaproxy/action-full-scan@4f7523a09110bc63d6b349713de6aa697ec7fbe9
        with:
          target: '${{ env.ZAP_TARGET }}'
          allow_404_warnings: true
