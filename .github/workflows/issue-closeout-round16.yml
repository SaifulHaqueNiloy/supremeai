# Round 16 Issue Closeout (2026-09-19)
#
# বাংলা: Round 16 ফিক্স (#439 #440 #441 #442 #443 #446 #447 #450 #452 — commits
# 0a132a44..0fcd0f4f) ল্যান্ড করার পর সংশ্লিষ্ট issue-গুলোতে বাংলা+ইংরেজি
# প্রমাণ-কমেন্ট পোস্ট করে ফিক্স হওয়া গুলো বন্ধ করে। এজেন্ট-টোকেনে Issues:write
# নেই (403), তাই built-in GITHUB_TOKEN — Round 14 closeout-এর প্রমাণিত প্যাটার্ন।
#
# English: Posts per-issue bilingual evidence comments from
# docs/audit_reports/round16_comments/ and closes the issues fixed in Round 16.
# Idempotent: closing an already-closed issue fails harmlessly.
# Trigger: workflow_dispatch or push touching the fix log / comments dir.

name: Round 16 Issue Closeout

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/audit_reports/FIX_LOG_2026-09-19_round16.md"
      - "docs/audit_reports/round16_comments/**"

concurrency:
  group: issue-closeout-round16-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post evidence comments and close fixed issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Issues fixed in Round 16 — post evidence, then close.
          CLOSE_LIST="439 440 442 443 446 447 450 452"
          # Issues with status updates only — comment, keep open.
          COMMENT_ONLY="434 441 456"

          for issue in $CLOSE_LIST $COMMENT_ONLY; do
            body_file="docs/audit_reports/round16_comments/${issue}.md"
            if [ -f "$body_file" ]; then
              gh issue comment "$issue" --body-file "$body_file" || \
                echo "::warning::comment on #$issue failed"
            else
              echo "::warning::missing comment body for #$issue"
            fi
          done

          for issue in $CLOSE_LIST; do
            state="$(gh issue view "$issue" --json state --jq .state || echo unknown)"
            # gh returns "OPEN"/"CLOSED" (uppercase) — compare case-insensitively.
            if [ "${state,,}" = "open" ]; then
              gh issue close "$issue" --reason completed \
                --comment "✅ Fixed in Round 16 (commit range 0a132a44..0fcd0f4f) — see evidence comment above. ফিক্স সম্পন্ন — প্রমাণ উপরের কমেন্টে।" || \
                echo "::warning::close #$issue failed"
            else
              echo "#$issue already $state — skip"
            fi
          done

          echo "Round 16 closeout complete."
