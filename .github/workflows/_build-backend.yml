name: 🐳 Build Backend

on:
  workflow_call:
    inputs:
      docker_build_changed:
        description: 'Whether docker build files changed'
        type: boolean
        required: false
        default: false
    outputs:
      image_digest:
        description: 'Docker image digest'
        value: ${{ jobs.docker-build.outputs.image_digest }}
      image_url:
        description: 'Docker image URL'
        value: ${{ jobs.docker-build.outputs.image_url }}

jobs:
  docker-build:
    name: 🐳 Build Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build-and-push.outputs.digest }}
      image_url: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./backend/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/backend-ci-base:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/backend-ci-base:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/backend-ci-base:buildcache,mode=max
          build-args: |
            CACHEBUST=${{ hashFiles('backend/Dockerfile.ci') }}

  build-backend-image:
    name: 🐳 Build & Push Backend Image
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/supremeai-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/supremeai-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/supremeai-backend:buildcache,mode=max
          build-args: |
            CACHEBUST=${{ hashFiles('backend/Dockerfile', 'backend/poetry.lock') }}