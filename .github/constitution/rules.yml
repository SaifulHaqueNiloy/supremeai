      - "hard_rules.clarify_and_converge_lifecycle"
    prohibited_actions:
      - "কোনো কোড এডিট বা ডিলিট"
      - "কোনো PR তৈরি বা মার্জ"
      - "ক্লেইম লক নেওয়া"
    auto_inject: true

  pr_helper:
