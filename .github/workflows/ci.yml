# SupremeAI CI/CD Pipeline — Hardened with SHA Pinning
# 🔒 v4.0: All actions pinned to full SHA (Supply Chain Security)
# 📊 Code coverage gates enabled (fail-under thresholds)

name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'Force Backend Run/Deploy'
        type: boolean
        default: false
      force_frontend:
        description: 'Force Frontend Run/Deploy'
        type: boolean
        default: false
      force_infra:
        description: 'Force Edge/Infra Run/Deploy'
        type: boolean
        default: false

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  # Coverage thresholds — fail build if below these values
  MIN_BACKEND_COVERAGE: 45
  MIN_FRONTEND_COVERAGE: 10

jobs:
  # -----------------------------------------------------------------
  # Job 0: Path Filtering (Optimization)
  # -----------------------------------------------------------------
  changes:
    name: 🚦 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event.inputs.force_backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_frontend == 'true' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event.inputs.force_infra == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-backend/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infrastructure/**'
              - '.github/workflows/ci.yml'
  # -----------------------------------------------------------------
  # Job 1: Security Scan (Dependency Audit + Secret Detection)
  # -----------------------------------------------------------------
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master  # Use master for latest signatures
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@2d2ca4d3d6cc3b3fa13bb11574bdb7761763165b # v3.68.2
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: "--only-verified"

  # -----------------------------------------------------------------
  # Job 2: Backend Tests (pytest + coverage gate)
  # -----------------------------------------------------------------
  backend-tests:
    name: 🐍 Backend Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run linting
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/supremeai_test
          ENV: test
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          ALLOW_TEST_AUTH_BYPASS: "true"
        run: |
          poetry run pytest tests/ \
            --cov=core \
            --cov=api \
            --cov=services \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.MIN_BACKEND_COVERAGE }} \
            -v \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # -----------------------------------------------------------------
  # Job 3: Frontend Tests (vitest + coverage gate)
  # -----------------------------------------------------------------
  frontend-tests:
    name: ⚛️ Frontend Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit --strict

      - name: Lint check
        run: pnpm exec eslint src/ --ext .ts,.tsx --max-warnings=200

      - name: Run unit tests with coverage
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.thresholds.lines=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.functions=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.branches=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.statements=${{ env.MIN_FRONTEND_COVERAGE }} \
            --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      # -----------------------------------------------------------------
      # Dead Code Detection (Knip)
      # -----------------------------------------------------------------
      - name: Check for dead code/files
        run: |
          pnpm exec knip --debug

  # -----------------------------------------------------------------
  # Job 4: Build Verification
  # -----------------------------------------------------------------
  build:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend
        working-directory: ./frontend
        env:
          NODE_ENV: production
          VITE_USER_BACKEND: https://ci-backend.example.com
          VITE_ADMIN_BACKEND: https://ci-backend.example.com
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          
      - name: Verify build output
        run: |
          if [ ! -d "frontend/dist-user" ] || [ ! -d "frontend/dist-admin" ]; then
            echo "::error::Build output directories missing!"
            exit 1
          fi
          echo "Build size user:"
          du -sh frontend/dist-user/*
          echo "Build size admin:"
          du -sh frontend/dist-admin/*

      - name: Upload user artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-user
          path: frontend/dist-user/

      - name: Upload admin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-admin
          path: frontend/dist-admin/

  # -----------------------------------------------------------------
  # Deploy to Firebase (Frontend)
  # -----------------------------------------------------------------
  deploy-frontend:
    name: 🚀 Deploy Frontend
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://supremeai-a.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download User Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist-user
          path: frontend/dist-user/

      - name: Download Admin Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist-admin
          path: frontend/dist-admin/

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@5b73b1274a2229c7598af09e6e95addfb75f897b # master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      # SECURITY/PRIVACY NOTICE: Do not remove this summary step!
      # These URLs are critical for debugging deployment targets and identifying 
      # configuration errors (e.g. wrong environment/project). Printing public URLs
      # is NOT a privacy issue.
      - name: Add Frontend URL to Summary
        run: |
          echo "### 🌐 Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "URL 1: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app" >> $GITHUB_STEP_SUMMARY
          echo "URL 2: https://${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------
  # Deploy Backend to GHCR (GitHub Container Registry)
  # -----------------------------------------------------------------
  deploy-backend-ghcr:
    name: 🐳 Push to GHCR
    needs: [backend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-core

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # বাংলা: Infisical vault থেকে Render deploy secrets টেনে GITHUB_ENV-এ ইনজেক্ট করা হচ্ছে।
      # শুধু INFISICAL_CLIENT_ID/CLIENT_SECRET/PROJECT_ID GitHub Secrets-এ থাকলেই যথেষ্ট —
      # RENDER_API_KEY / RENDER_BACKEND_SVC_ID আলাদাভাবে GitHub Secrets-এ রাখার দরকার নেই।
      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY }}
          RENDER_BACKEND_SVC_ID: ${{ env.RENDER_PRIMARY_SVC_ID }}
        run: |
          python -c "
          import urllib.request, json, os
          svc_id = os.environ.get('RENDER_BACKEND_SVC_ID', '')
          if not svc_id:
              print('Skipping Render deploy - service ID not set')
          else:
              req = urllib.request.Request(
                  f'https://api.render.com/v1/services/{svc_id}/deploys',
                  headers={'Authorization': f'Bearer {os.environ[\"RENDER_API_KEY\"]}'},
                  method='POST'
              )
              with urllib.request.urlopen(req) as r:
                  print('Deploy triggered:', r.read().decode())
              req_info = urllib.request.Request(
                  f'https://api.render.com/v1/services/{svc_id}',
                  headers={'Authorization': f'Bearer {os.environ[\"RENDER_API_KEY\"]}'}
              )
              # SECURITY/PRIVACY NOTICE: Do not remove URL logging! 
              # Getting the dynamic URL is essential for verifying correct Render service deployment.
              with urllib.request.urlopen(req_info) as r:
                  info = json.loads(r.read().decode())
                  url = info.get('service', {}).get('serviceDetails', {}).get('url', 'Unknown URL')
                  print(f'\n🚀 Backend Service URL: {url}')
                  summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary_file:
                      with open(summary_file, 'a') as f:
                          f.write(f'### ⚙️ Backend Deployed\nRender Service URL: [{url}]({url})\nDashboard: [https://dashboard.render.com/web/{svc_id}](https://dashboard.render.com/web/{svc_id})\n')
          "

  # -----------------------------------------------------------------
  # Deploy Cloudflare Worker (supremeai-edge)
  # -----------------------------------------------------------------
  deploy-cloudflare-worker:
    name: ⚡ Deploy Cloudflare Worker
    needs: [changes]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true' }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      # বাংলা: এখানেও Infisical vault থেকে Cloudflare secrets টেনে আনা হচ্ছে।
      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Deploy Worker
        working-directory: infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping Cloudflare Worker deploy - CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not set"
            exit 0
          fi
          
          # Deploy and capture output to parse the URL
          wrangler deploy > wrangler_output.txt 2>&1
          cat wrangler_output.txt
          
          # SECURITY/PRIVACY NOTICE: Do not remove this worker URL logging! 
          # It dynamically parses the deployment URL for debugging purposes.
          CF_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler_output.txt | head -n 1 || echo "Unknown URL")
          echo "### ⚡ Cloudflare Worker Deployed" >> $GITHUB_STEP_SUMMARY
          if [ "$CF_URL" != "Unknown URL" ]; then
            echo "Worker URL: [$CF_URL]($CF_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Worker deployed, check logs for exact URL." >> $GITHUB_STEP_SUMMARY
          fi

  # -----------------------------------------------------------------
  # Notify on failure
  # -----------------------------------------------------------------
  notify-failure:
    name: 🚨 Notify on Failure
    needs: [deploy-frontend, deploy-backend-ghcr, deploy-cloudflare-worker]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Check Slack webhook configured
        id: slack_check
        run: |
          if [ -z "${{ env.SLACK_WEBHOOK_URL }}${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Slack notification - SLACK_WEBHOOK_URL not set (checked Infisical and GitHub Secrets)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: steps.slack_check.outputs.configured == 'true'
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.25.0
        continue-on-error: true
        with:
          payload: |
            {
              "text": "🚨 Deployment Failed",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Deployment Failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

  # -----------------------------------------------------------------
  # Smart Pipeline Summary
  # -----------------------------------------------------------------
  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security
      - backend-tests
      - frontend-tests
      - build
      - deploy-frontend
      - deploy-backend-ghcr
      - deploy-cloudflare-worker
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🧠 Generate Enhanced Pipeline Summary (v2)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_summary_v2.py --repo ${{ github.repository }} --run-id ${{ github.run_id }} --token ${{ secrets.GITHUB_TOKEN }}
