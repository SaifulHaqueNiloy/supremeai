

name: 🧠 SupremeAI Core CI

on:
  workflow_dispatch:
    inputs:
      run_pre_merge_gate:
        description: 'Run Pre-Merge Gate'
        type: boolean
        default: true
      run_backend_core:
        description: 'Run Backend Core'
        type: boolean
        default: true
      run_frontend_core:
        description: 'Run Frontend Core'
        type: boolean
        default: true
      run_performance_e2e:
        description: 'Run Performance E2E'
        type: boolean
        default: true
      run_deploy_render:
        description: 'Run Deploy to Render'
        type: boolean
        default: true
      ignore_dependencies:
        description: 'Force run selected job even if upstream jobs are skipped? (Not for deploy)'
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  schedule:
    - cron: '0 0 * * *'

# ==============================================================================
# [IMMUTABLE CONFIGURATION - MANUAL CONTROL ONLY]
# ------------------------------------------------------------------------------
# DO NOT ALLOW AI AGENTS TO MODIFY THIS CONCURRENCY LOGIC.
# Purpose: Ensures new pushes cancel pending/running jobs in this pipeline.
# ==============================================================================
# বাংলা মন্তব্য: যেকোনো ব্রাঞ্চেই নতুন পুশ আসলে পুরানো রানিং জবগুলো যেন বাতিল হয়ে যায়, সেজন্য ref-এর পরিবর্তে শুধু workflow-ভিত্তিক concurrency group সেট করা হলো।
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'
  SUPREMEAI_API_URL: ${{ vars.SUPREMEAI_API_URL }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  changes:
    runs-on: ubuntu-latest
    # promotion/staging-* branch থেকে আসা PR-এর কোড second repo-তে ইতিমধ্যে পুরো
    # supreme-core-ci pipeline দিয়ে verified — তাই এই pull_request-triggered রান স্কিপ করা হচ্ছে।
    # merge-এর পরে main-এ push হওয়ার সময় এই একই workflow স্বাভাবিকভাবে আবার চলবে (deploy জবগুলোর জন্য দরকার),
    # কারণ github.head_ref শুধু pull_request ইভেন্টেই সেট থাকে, push ইভেন্টে খালি — তাই এই condition push-কে touch করে না।
    if: "!startsWith(github.head_ref, 'promotion/staging')"
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      docker_build: ${{ steps.filter.outputs.docker_build == 'true' || steps.detect.outputs.force_docker_build == 'true' || github.run_attempt > 1 }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      admin_needed: ${{ steps.filter.outputs.admin == 'true' || steps.filter.outputs.shared == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      user_needed: ${{ steps.filter.outputs.user == 'true' || steps.filter.outputs.shared == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      dependencies: ${{ steps.filter.outputs.dependencies == 'true' || steps.detect.outputs.force_dependencies == 'true' || github.run_attempt > 1 }}
      docs_only: ${{ steps.filter.outputs.docs_only == 'true' }}
      admin_backend_changed: ${{ steps.filter.outputs.admin_backend == 'true' || steps.filter.outputs.shared_backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      customer_backend_changed: ${{ steps.filter.outputs.customer_backend == 'true' || steps.filter.outputs.shared_backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      trivial_change: ${{ steps.gate-logic.outputs.trivial_change }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect previous failures
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/detect-previous-failures.py

          # Parse the base64 output
          B64_JSON=$(grep "force_flags_b64=" $GITHUB_OUTPUT | sed 's/^force_flags_b64=//')
          if [ ! -z "$B64_JSON" ]; then
            JSON_STR=$(echo "$B64_JSON" | base64 --decode)
            echo "force_backend=$(echo $JSON_STR | jq -r '.backend')" >> $GITHUB_OUTPUT
            echo "force_frontend=$(echo $JSON_STR | jq -r '.frontend')" >> $GITHUB_OUTPUT
            echo "force_docker_build=$(echo $JSON_STR | jq -r '.docker_build')" >> $GITHUB_OUTPUT
            echo "force_dependencies=$(echo $JSON_STR | jq -r '.dependencies')" >> $GITHUB_OUTPUT
          fi
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            docker_build:
              - 'backend/Dockerfile.ci'
              - 'backend/poetry.lock'
            backend:
              - 'backend/**'
              - 'api/**'
              - 'core/**'
              - '.github/workflows/**'
            admin_backend:
              - 'backend/api/routes/admin.py'
              - 'backend/api/routes/admin_dashboard.py'
              - 'backend/api/routes/admin_librarian.py'
              - 'backend/api/routes/simulator_admin.py'
              - 'backend/api/routes/tenant_admin.py'
              - 'backend/api/routers.py'
              - 'backend/api/__init__.py'
              - 'backend/api/routes/public_config.py'
              - 'backend/api/routes/preferences.py'
              - 'backend/core/app_admin.py'
              - 'backend/core/app_builder.py'
              - 'admin/**'
            customer_backend:
              - 'backend/**'
              - '!backend/api/routes/admin.py'
              - '!backend/api/routes/admin_dashboard.py'
              - '!backend/api/routes/admin_librarian.py'
              - '!backend/api/routes/simulator_admin.py'
              - '!backend/api/routes/tenant_admin.py'
              - '!backend/api/routers.py'
              - '!backend/api/__init__.py'
              - '!backend/api/routes/public_config.py'
              - '!backend/api/routes/preferences.py'
              - '!backend/core/app_admin.py'
              - '!backend/core/app_builder.py'
                        shared_backend:
              - 'backend/core/**'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - 'backend/Dockerfile'
              - '.github/workflows/**'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
              - 'admin/**'
              - 'firebase.json'
              - '.github/workflows/**'
            admin:
              - 'frontend/src/pages/admin/**'
            user:
              - 'frontend/src/pages/user/**'
              - 'frontend/src/pages/auth/**'
            shared:
              - 'frontend/src/components/**'
              - 'frontend/src/store/**'
              - 'frontend/package.json'
          dependencies:
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
            docs_only:
              - '**.md'
              - 'docs/**'

      - name: Compute Trivial Change
        id: gate-logic
        run: |
          BACKEND="${{ steps.filter.outputs.backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}"
          FRONTEND="${{ steps.filter.outputs.frontend == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}"
          DEPS="${{ steps.filter.outputs.dependencies == 'true' || steps.detect.outputs.force_dependencies == 'true' || github.run_attempt > 1 }}"
          DOCS_ONLY="${{ steps.filter.outputs.docs_only == 'true' }}"
          if [[ "$BACKEND" == 'false' && "$FRONTEND" == 'false' && "$DEPS" == 'false' && "$DOCS_ONLY" == 'true' ]]; then
            echo "trivial_change=true" >> $GITHUB_OUTPUT
          else
            echo "trivial_change=false" >> $GITHUB_OUTPUT
          fi

  # ==============================================================================
  # SERVICE PREFLIGHT: Credential Gate — pipeline-এর প্রথম সেকেন্ডেই চলে (changes-এর সাথে parallel)
  # Render, Vercel key check করে। Fail হলে Force Cancel দিয়ে পুরো workflow থামিয়ে দেয়।
  # GCP check commented-out আছে — enable করতে uncomment করুন।
  # ==============================================================================
  service-preflight:
    name: 🔌 Service Preflight Connectivity Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # বাংলা মন্তব্য: changes job-এর জন্য wait করে না — pipeline-এর একদম শুরুতেই parallel চলে।
    # এই job fail হলে Force Cancel API call করে পুরো workflow থামিয়ে দেওয়া হয়।
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🔌 Ping all external services
        run: python .github/scripts/service_preflight_check.py
        env:
          RENDER_API_KEY:           ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP:    ${{ secrets.RENDER_API_KEY_BACKUP }}
          PRIMARY_SVC_ID:           ${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}
          BACKUP_SVC_ID:            ${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}
          VERCEL_TOKEN:             ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}
          MIRROR_REPO_TOKEN:        ${{ secrets.MIRROR_REPO_TOKEN }}
          # GCP_SA_KEY:             ${{ secrets.GCP_SA_KEY }}         # GCP চেক enable করতে uncomment করুন
          # GCP_PROJECT_ID:         ${{ secrets.GCP_PROJECT_ID }}     # GCP চেক enable করতে uncomment করুন

      - name: 🚨 Force Cancel Workflow on Preflight Failure
        if: failure()
        # বাংলা মন্তব্য: Preflight fail হলে credentials ভুল — বাকি সব job (lint, pytest, build) চালানো সম্পূর্ণ অর্থহীন।
        # Force Cancel করলে CI minutes নষ্ট হয় না এবং developer সাথে সাথে সমস্যাটা বুঝতে পারে।
        run: |
          echo "❌ Service Preflight FAILED — force canceling entire workflow to save CI minutes..." >> $GITHUB_STEP_SUMMARY
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================================
  # ENV DRIFT CHECK (NON-RENDER ENVS): secrets_registry.yaml-এর বিপরীতে github-actions,
  # vercel, cloudflare, firebase, infisical environment-এর জন্য GitHub repo secrets-এর
  # presence যাচাই করে (এই env গুলোর deploy/boot token গুলো GitHub-এই থাকে)।
  # Render env গুলো আলাদা render-env-live-check job-এ আসল runtime থেকে যাচাই হয়।
  # ==============================================================================
  env-drift-check:
    name: 🔑 Env/Secret Drift Check (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        # বাংলা: cloudflare-worker ইচ্ছাকৃতভাবে বাদ — cloudflare-worker/src/index.js এবং
        # দুইটা wrangler.toml (infrastructure/) ঘেঁটে verify করা হয়েছে, worker কোনো secret
        # ব্যবহার করে না (শুধু public [vars] URL)। secrets_registry.yaml-এ cloudflare-worker
        # criticality-যুক্ত কোনো key নেই বলে এই matrix entry প্রতিবার trivially pass করত —
        # শূন্য coverage দিয়ে একটা matrix slot + runner-minute নষ্ট হচ্ছিল। Worker সত্যিই কোনো
        # secret নেওয়া শুরু করলে এখানে ফিরিয়ে আনতে হবে।
        env: [github-actions, vercel-frontend, firebase-gcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install PyYAML
        run: pip install pyyaml
      - name: 🔍 Audit env usage vs registry [${{ matrix.env }}]
        # বাংলা: GitHub repo secrets থেকে সব সম্ভাব্য key ইনজেক্ট; script শুধু ওই --env-এর
        # relevant key গুলোই check করবে। Actual value কখনোই log-এ যায় না।
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK_URL_BACKUP: ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
          RENDER_BACKUP_SVC_ID: ${{ secrets.RENDER_BACKUP_SVC_ID }}
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          # বাংলা: Machine Identity credentials — infisical-vault env check-এর জন্য প্রয়োজনীয়
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
          SUPREMEAI_GITHUB_TOKEN: ${{ secrets.SUPREMEAI_GITHUB_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SUPREMEAI_ADMIN_PASSWORD_HASH: ${{ secrets.SUPREMEAI_ADMIN_PASSWORD_HASH }}
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/audit_env_usage.py --env ${{ matrix.env }}

  # ==============================================================================
  # RENDER RUNTIME ENV CHECK (Gap #3): Render API থেকে আসল service env vars fetch করে
  # যাচাই করে। CI GitHub secrets-এ set থাকলেও Render-এ নাই -> এখানে ধরা পড়বে।
  # (Render API সিক্রেট ভ্যালু লুকায়, তাই key-এর presence চেক হয়)।
  # ==============================================================================
  render-env-live-check:
    name: 🔌 Render Runtime Env Check (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        env: [render-backend, render-admin, render-worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install PyYAML
        run: pip install pyyaml
      - name: 🔍 Verify Render runtime env [${{ matrix.env }}]
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          # বাংলা: service id mapping — backend=primary, admin=backup, worker=নিজস্ব (যদি থাকে)
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}
          RENDER_BACKUP_SVC_ID: ${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}
          RENDER_WORKER_SVC_ID: ${{ secrets.RENDER_WORKER_SVC_ID || vars.RENDER_WORKER_SVC_ID || '' }}
        run: |
          if [ "${{ matrix.env }}" = "render-backend" ]; then SVC="$RENDER_PRIMARY_SVC_ID"
          elif [ "${{ matrix.env }}" = "render-admin" ]; then SVC="$RENDER_BACKUP_SVC_ID"
          else SVC="$RENDER_WORKER_SVC_ID"; fi
          if [ -z "$SVC" ]; then
            echo "::warning::[${{ matrix.env }}] RENDER_WORKER_SVC_ID চার্জ করা নাই — worker runtime check skip করা হলো"
            exit 0
          fi
          python scripts/verify_render_env.py --env ${{ matrix.env }} --service-id "$SVC"

  # ==============================================================================
  # INFISICAL VAULT HEALTH CHECK: Verifies that Infisical Vault has all critical secrets.
  # ==============================================================================
  infisical-vault-health-check:
    name: 🔐 Infisical Vault Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify Infisical Secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          # বাংলা: Machine Identity auth-এর জন্য CLIENT_ID ও SECRET যোগ করা হলো (Fix #2)
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: python scripts/verify_infisical_env.py

  # ==============================================================================
  # API CONTRACT CHECK (ported from Simple CI / AUDIT-018 prevention)
  # Frontend↔Backend API contract drift আটকায়। simple CI-তে ছিল, Core CI-তে ছিল না।
  # ==============================================================================
  api-contract-check:
    name: 🔗 Frontend↔Backend API Contract Check
    needs: [changes, service-preflight]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run API contract verifier (AUDIT-018 prevention)
        run: |
          if [ -f scripts/ci/verify_api_contract.py ]; then
            python scripts/ci/verify_api_contract.py
          else
            echo "⚠️ verify_api_contract.py not found — skipping (add script to enable)"
          fi

  # ==============================================================================
  # PRE-MERGE GATE: Iron Curtain — যেকোনো কোড মার্জের আগে বাধ্যতামূলক চেক
  # এই job fail হলে অন্য কোনো job চলবে না।
  # ==============================================================================
  pre-merge-gate:
    name: 🚧 Pre-Merge Gate (Iron Curtain)
    needs: [changes, service-preflight, env-drift-check, render-env-live-check, infisical-vault-health-check]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install gate and backend dependencies
        run: |
          pip install ruff poetry
          cd backend
          poetry config virtualenvs.in-project true
          poetry install --only main --no-root

      - name: 🚫 Gate 1 — Zero-Gap Stub/Placeholder Data Check
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: Stub ডেটা পেলে সাথে সাথে পাইপলাইন বন্ধ হয়ে যাবে
        run: |
          echo "=== Zero-Gap স্টাব ডেটা গেট ===" >> $GITHUB_STEP_SUMMARY
          python scripts/find_stub_data.py --path . --fail-on HIGH
          echo "✅ পাস: কোনো স্টাব/প্লেসহোল্ডার প্যাটার্ন পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY

      - name: 🛡️ Gate 1.5 — Security Blind Spot Scan
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: continue-on-error: true সরানো হয়েছে কারণ Critical security risk চুপচাপ পাস হয়ে যাচ্ছিল
        run: |
          echo "=== Security Blind Spot Scan ===" >> $GITHUB_STEP_SUMMARY
          python scripts/security/auto_find_blindspots.py
          echo "✅ পাস: কোনো ক্রিটিকাল সিকিউরিটি রিস্ক নেই" >> $GITHUB_STEP_SUMMARY

      - name: 🔬 Gate 2 — Ruff Linting (No Silent Bugs)
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: BLE001 (পেডান্টিক এক্সেপশন) রিমুভ করা হয়েছে কারণ আমাদের কাস্টম অডিট স্ক্রিপ্ট আছে।
        # F401 (আনইউজড ইম্পোর্ট) ইগনোর করা হয়েছে, কারণ maintenance pipeline এটি অটো-ফিক্স করবে।
        run: |
          echo "=== Ruff স্ট্যাটিক অ্যানালাইসিস গেট ===" >> $GITHUB_STEP_SUMMARY
          # বাংলা মন্তব্য: স্থায়ী সমাধান — প্রথমে --fix রান করে auto-fixable এরর ঠিক করা হয়।
          # এতে I001/UP042/UP022 ইত্যাদি fixable এরর কখনো gate block করবে না।
          # তারপর --no-fix দিয়ে verify করা হয় যে কোনো non-fixable এরর নেই।
          cd backend
          ruff check . --config pyproject.toml --fix --unsafe-fixes --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
          ruff check . --config pyproject.toml --no-fix --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
          echo "✅ পাস: Ruff লিন্টিং গেট ক্লিয়ার" >> $GITHUB_STEP_SUMMARY

      - name: 🤖 Bot Commit Detection
        id: bot-check
        # বাংলা মন্তব্য: SupremeAI CI Bot-এর commit detect করা হচ্ছে।
        # Bot commit এলে router import smoke-test mandatory strict mode-এ চলবে।
        run: |
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          echo "Commit author: $COMMIT_AUTHOR"
          if [[ "$COMMIT_AUTHOR" == *"CI Bot"* || "$COMMIT_AUTHOR" == *"SupremeAI Bot"* || "$COMMIT_AUTHOR" == *"[bot]"* ]]; then
            echo "is_bot_commit=true" >> $GITHUB_OUTPUT
            echo "::warning::🤖 BOT COMMIT DETECTED — Router import smoke-test will run in STRICT mode. All routers (including optional) must import cleanly."
          else
            echo "is_bot_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔌 Gate 0 — Router Import Smoke-Test
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: CRITICAL GATE — Full test suite চালানোর আগে প্রতিটি registered router
        # individually import করে চেক করা হয়। এই gate-এর লক্ষ্য:
        # 1. Hallucinated imports (যেমন `from core.auth import ...`) 10 সেকেন্ডে ধরা
        # 2. CI Bot commit-এ strict mode — optional routers-ও pass করতে হবে
        # 3. একটি bad route file পুরো test suite cascade crash করার আগেই block করা
        run: |
          echo "=== Router Import Smoke-Test ===" >> $GITHUB_STEP_SUMMARY

          cd backend
          # Bot commit হলে strict mode চালানো হবে
          if [[ "${{ steps.bot-check.outputs.is_bot_commit }}" == "true" ]]; then
            echo "🤖 Bot commit: running in STRICT mode (all routers must import cleanly)" >> $GITHUB_STEP_SUMMARY
            poetry run python ../scripts/ci/validate_router_imports.py --strict
          else
            poetry run python ../scripts/ci/validate_router_imports.py
          fi

          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ পাস: সব core router imports সঠিক" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ FAIL: Router import error detected — fix imports before test suite runs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 🛡️ Gate 3.5 — Admin Router Auth Lint Guard
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: অ্যাডমিন রাউটার বা乞丐-level `Depends(get_current_admin)` enforcement
        run: |
          echo "=== Admin Auth Lint Guard ===" >> $GITHUB_STEP_SUMMARY
          cd backend
          poetry run python ../.github/scripts/verify_admin_auth.py
          echo "✅ All admin prefixed routers verified structurally." >> $GITHUB_STEP_SUMMARY


      - name: 🔗 Gate 3 — Service Topology Check
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          pip install pyyaml
          python scripts/ci/check_service_topology.py

      - name: 🕵️ Gate 4 — Observability & Silent Error Audit
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: timeout ছাড়া httpx.AsyncClient() ব্যবহার করলে fail
        run: |
          echo "=== HTTP টাইমআউট অডিট গেট ===" >> $GITHUB_STEP_SUMMARY
          # grep for httpx.AsyncClient() without timeout parameter
          VIOLATIONS=$(grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv" | wc -l)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ FAIL: Found $VIOLATIONS httpx.AsyncClient() call(s) without explicit timeout!" >> $GITHUB_STEP_SUMMARY
            grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv"
            exit 1
          fi
          echo "✅ পাস: সব httpx ক্লায়েন্টে নির্দিষ্ট টাইমআউট আছে" >> $GITHUB_STEP_SUMMARY


      # 🔬 Observability Audit (No Silent Errors)
      - name: 🔬 Run Observability Audit Script
        if: needs.changes.outputs.trivial_change != 'true'
        id: obs_audit
        run: |
          python scripts/audit_observability.py

      - name: Audit Summary
        if: always() && needs.changes.outputs.trivial_change != 'true'
        run: |
          echo "## 🔬 Observability Audit" >> $GITHUB_STEP_SUMMARY
          echo "Outcome: **${{ steps.obs_audit.outcome }}**" >> $GITHUB_STEP_SUMMARY
          echo "✅ কোনো সাইলেন্ট বা ব্রড exception হ্যান্ডলার পাওয়া যায়নি।" >> $GITHUB_STEP_SUMMARY

      # 🛡️ CodeQL & Trivy Security Scan (Merged)
      # বাংলা মন্তব্য (৫-ধাপ প্ল্যান, ধাপ ২ স্কিপ করা হয়েছে — এডমিনের অনুরোধে আলাদা
      # job/workflow বানানো হয়নি, তাই Python+JS matrix parallel এখনই সম্ভব না;
      # single job-এর মধ্যে থেকে ধাপ ৩,৪,৫ প্রয়োগ করা হলো):
      # - ধাপ ৩: trigger আরও সংকুচিত — docs_only বাদ, run_attempt>1 বাদ (retry-তে
      #   অহেতুক পুরো CodeQL re-run বন্ধ), push (merge-পরবর্তী main/develop) trigger যোগ
      # - ধাপ ৪: নিচে codeql-config.yml দিয়ে scan scope ছোট করা হলো (config-path দ্রষ্টব্য)
      # - ধাপ ৫: timeout-minutes যোগ করা হলো যাতে আটকে গেলে নির্দিষ্ট সময় পর নিজে বন্ধ হয়
      - name: Initialize CodeQL
        if: (needs.changes.outputs.trivial_change != 'true' && needs.changes.outputs.docs_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || needs.changes.outputs.dependencies == 'true')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
        timeout-minutes: 10
        uses: github/codeql-action/init@v4
        with:
          languages: 'python, javascript'
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: (needs.changes.outputs.trivial_change != 'true' && needs.changes.outputs.docs_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || needs.changes.outputs.dependencies == 'true')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
        timeout-minutes: 25
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript"

      - name: 🔍 Parallel Security Scan
        if: (needs.changes.outputs.trivial_change != 'true' && needs.changes.outputs.docs_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || needs.changes.outputs.dependencies == 'true')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # বাংলা মন্তব্য: GitHub API রেট লিমিট এবং ইনস্টল স্ক্রিপ্ট ফেইলর এড়াতে সরাসরি বাইনারি ডাউনলোড করা হচ্ছে
          mkdir -p ./bin
          # বাংলা মন্তব্য: GitHub API থেকে dynamic ভাবে লেটেস্ট Trivy ভার্সন এবং তার ডাউনলোড URL বের করা হচ্ছে যাতে ৪MD বা অবসোলেট রিলিজের কারণে বিল্ড ফেইল না করে
          TRIVY_VERSION=$(curl -sL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          if [ -z "$TRIVY_VERSION" ]; then
            TRIVY_VERSION="0.55.0"
          fi
          echo "Downloading Trivy version: $TRIVY_VERSION"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          tar -xzf trivy.tar.gz -C ./bin trivy
          rm trivy.tar.gz
          ./bin/trivy fs --format sarif --output trivy-python.sarif --severity CRITICAL,HIGH backend &
          ./bin/trivy fs --format sarif --output trivy-nodejs.sarif --severity CRITICAL,HIGH . &
          wait

      - name: Upload Trivy Python SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && ((needs.changes.outputs.trivial_change != 'true' && needs.changes.outputs.docs_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || needs.changes.outputs.dependencies == 'true')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))) && hashFiles('trivy-python.sarif') != ''
        with:
          sarif_file: 'trivy-python.sarif'
          category: 'trivy-python'

      - name: Upload Trivy Node.js SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && ((needs.changes.outputs.trivial_change != 'true' && needs.changes.outputs.docs_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || needs.changes.outputs.dependencies == 'true')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))) && hashFiles('trivy-nodejs.sarif') != ''
        with:
          sarif_file: 'trivy-nodejs.sarif'
          category: 'trivy-nodejs'

      - name: 📊 Add Security Audit Results to GitHub Summary
        if: always() && ((needs.changes.outputs.trivial_change != 'true' && needs.changes.outputs.docs_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || needs.changes.outputs.dependencies == 'true')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true')))
        run: |
          echo "## 🛡️ Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          echo "✅ CodeQL SARIF report uploaded to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trivy Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python dependencies scanned (backend/)" >> $GITHUB_STEP_SUMMARY

      - name: 🚨 Force Cancel Workflow on Failure
        if: failure()
        run: |
          echo "❌ Pre-Merge Gate failed — force canceling entire workflow..." >> $GITHUB_STEP_SUMMARY
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ai-scribe-docs:
    name: "📚 AI Scribe — Auto-Documentation Generation"
    needs: [changes, service-preflight]
    if: >

      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 📚 Run AI Scribe Historian
        # বাংলা মন্তব্য: এই ধাপটি স্বয়ংক্রিয়ভাবে পাইথন ফাইলগুলির ডকস্ট্রিং এবং ডিরেক্টরি README-গুলো তৈরি/আপডেট করে।
        # docs/autogen/codebase/ ফাঁকা স্টब들也被 AI Scribe দ্বারা পূরণ করা হবে।
        run: |
          cd backend
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --only main --no-root
          poetry run pip install litellm python-dotenv infisical-python
          poetry run python ../scripts/devops/ai_scribe_historian.py --files $(find ../backend/core ../backend/tools -name "*.py" -not -name "__init__.py" 2>/dev/null | head -20)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INFISICAL_ENV: "prod"
      - name: 📤 Upload Generated Docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-scribe-generated-docs
          path: |
            backend/**/*.py
          retention-days: 1


  production-readiness:
    name: 🚀 Production Readiness (Safety Guard, Multi-Model Validator, Codegraph)
    needs: [changes, service-preflight]
    if: >
      (needs.changes.outputs.trivial_change != 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.dependencies == 'true' || github.run_attempt > 1)) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🛡️ Safety Guard - File Protection Validation
        id: safety_guard
        working-directory: backend
        run: |
          echo "## 🛡️ সেফটি গার্ড ভ্যালিডেশন" >> $GITHUB_STEP_SUMMARY
          # বাংলা মন্তব্য: safety_guard.py রান করে ক্রিটিক্যাল ফাইলের অনুমোদন ও রিপোর্ট যাচাই করা হচ্ছে
          poetry run python ../scripts/safety_guard.py --report-json > safety-report.json 2>&1

          # Parse and summarize safety violations
          if [ -f safety-report.json ]; then
            PENDING=$(grep -o '"pending_approvals": [1-9][0-9]*' safety-report.json | awk '{print $2}' || echo "0")
            if [ -n "$PENDING" ] && [ "$PENDING" -gt 0 ]; then
              echo "❌ Found $PENDING pending critical file approvals — blocking merge/deploy!" >> $GITHUB_STEP_SUMMARY
              cat safety-report.json >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "✅ সেফটি গার্ড সম্পন্ন হয়েছে — কোনো আনঅ্যাপ্রুভড সেফটি ভাইওলেশন পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ সেফটি গার্ড রিপোর্ট তৈরি হয়নি" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Multi-Model Validator - Security & Logic Check
        id: validator
        working-directory: backend
        run: |
          echo "## 🔍 মাল্টি-মডেল কোড ভ্যালিডেশন" >> $GITHUB_STEP_SUMMARY
          poetry run python ../scripts/multi_model_validator.py core/ --json-output validator-report.json 2>&1

          # Check for critical issues
          if [ -f validator-report.json ]; then
            CRITICAL=$(grep -c "risk_level.*CRITICAL" validator-report.json || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Found $CRITICAL CRITICAL security issues — blocking merge/deploy!" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ কোনো ক্রিটিকাল সিকিউরিটি ইস্যু পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 📊 Codegraph - Knowledge Base Generation
        id: codegraph
        working-directory: backend
        run: |
          echo "## 📊 নলেজ গ্রাফ জেনারেশন" >> $GITHUB_STEP_SUMMARY
          poetry run python ../scripts/codegraph_integration.py --full --output-dir ../docs/codebase/knowledge_graph 2>&1 || true
          echo "✅ নলেজ গ্রাফ আপডেট করা হয়েছে" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Production Readiness Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-readiness-reports
          path: |
            backend/safety-report.json
            backend/validator-report.json
            docs/codebase/knowledge_graph/

      - name: 🚨 Production Readiness Summary
        if: always()
        run: |
          echo "## ✅ প্রোডাকশন রেডিনেস চেক সম্পন্ন" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### সিস্টেম স্ট্যাটাস:" >> $GITHUB_STEP_SUMMARY
          echo "- Safety Guard: ${{ steps.safety_guard.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-Model Validator: ${{ steps.validator.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Codegraph: ${{ steps.codegraph.outcome }}" >> $GITHUB_STEP_SUMMARY

  docker-build:
    name: 🐳 Build Base Image
    needs: [changes, service-preflight]
    if:  needs.changes.outputs.docker_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./backend/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/backend-ci-base:latest
          # বাংলা মন্তব্য: GHCR registry cache ব্যবহার করা হচ্ছে কারণ GHA cache (10GB limit) Poetry/pnpm cache evict করে দিচ্ছিল
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/backend-ci-base:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/backend-ci-base:buildcache,mode=max
          # বাংলা মন্তব্য: CACHEBUST build-arg — Dockerfile.ci বদলালে cache অটোমেটিক invalid হবে,
          # ফলে পুরানো Dockerfile-এর ভিত্তিতে ভুল cache hit হওয়া প্রতিরোধ হবে।
          build-args: |
            CACHEBUST=${{ hashFiles('backend/Dockerfile.ci') }}

  backend-core:
    name: 🐍 Backend (Test)
    timeout-minutes: 10
    needs: [changes, docker-build, service-preflight, pre-merge-gate]
    if: >
      always() &&
      (needs.pre-merge-gate.result == 'success') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker_build == 'true' || github.event_name == 'workflow_dispatch' || github.run_attempt > 1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supreme_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # বাংলা মন্তব্য: POETRY_VIRTUALENVS_CREATE="false" থাকলে poetry config virtualenvs.create true-ও override হয়ে যায়
      # (environment variable কনফিগ ফাইলের চেয়ে বেশি priority পায়), ফলে কোনো virtualenv তৈরি হয় না
      # এবং poetry run pytest-এ "Command not found: pytest" error হয় (paykaribazaronline repo-তে cache miss-এর পর নিশ্চিত fail)।
      # তাই এই env-var সম্পূর্ণ বাদ দেওয়া হলো — নিচের poetry config virtualenvs.create true-ই কার্যকর হবে।
      SETUPTOOLS_USE_DISTUTILS: stdlib
      ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
      PYTHONPATH: ${{ github.workspace }}/backend
      GITHUB_TOKEN: "mock_dummy_token"
      RENDER_API_KEY: "mock_render_key"
      SUPABASE_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
      SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      SUPREMEAI_JWT_SECRET: "supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad"
      ADMIN_AUTHORIZED: "true"
      DOCS_PASSWORD: "mock_docs_password"
      SUPREMEAI_ADMIN_PASSWORD_HASH: "$2b$12$mockhashmockhashmockhashmockhashmockhash"
      STRIPE_API_KEY: "mock_stripe_api_key"
      STRIPE_WEBHOOK_SECRET: "mock_stripe_webhook_secret"
      SUPABASE_URL: "https://mock.supabase.co"
      SUPABASE_KEY: "mock_supabase_key"
      GEMINI_API_KEY: "mock_gemini_api_key"
      OPENROUTER_API_KEY: "mock_openrouter_api_key"
      OPENAI_API_KEY: "mock_openai_api_key"
      ANTHROPIC_API_KEY: "mock_anthropic_api_key"
      # বাংলা মন্তব্য: টেস্ট এনভায়রনমেন্টে AuthMiddleware যেন JWT ভেরিফিকেশন এড়িয়ে যায়
      # এবং টোকেন হেডার গ্রহণ করে, সেজন্য এই দুটি ফ্ল্যাগ সেট করা হলো।
      # Production-এ এই ভ্যালু কখনো "true" হওয়া উচিত নয়।
      ALLOW_TEST_AUTH_BYPASS: "true"
      ALLOW_TEST_ORIGIN_BYPASS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: 📦 Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # বাংলা মন্তব্য: poetry ইনস্টলের সাথে সাথেই virtualenvs.create true ও in-project সেট করা হচ্ছে
          # যাতে পরবর্তী poetry install-এ .venv সঠিকভাবে তৈরি হয় এবং poetry run pytest কাজ করে।
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      # বাংলা মন্তব্য: পূর্বে শুধু global pypoetry/pip cache করা হতো।
      # এখন backend/.venv-ও cache করা হচ্ছে — poetry.lock অপরিবর্তিত থাকলে
      # poetry install সম্পূর্ণ skip হবে এবং প্রতি রানে ২-৩ মিনিট বাঁচবে।
      - name: ⚙️ Setup Poetry + venv Cache
        id: poetry-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            backend/.venv
          key: ${{ runner.os }}-poetry-v4-py3.11-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-v4-py3.11-
            ${{ runner.os }}-poetry-v4-

      # বাংলা মন্তব্য: Playwright Chromium বাইনারি (~200MB) cache করা হচ্ছে।
      # poetry.lock পরিবর্তন না হলে এই বড় ডাউনলোড প্রতি রানে skip হবে।
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/poetry.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-playwright-

      # বাংলা মন্তব্য: poetry config virtualenvs.create true ও in-project সেট করা হচ্ছে যাতে
      # cache থেকে restore হওয়া পুরনো config (যেখানে virtualenvs.create=false থাকতে পারে) override হয়।
      # cache hit হলেও --dry-run নয় — বরং --sync দিয়ে আসল install নিশ্চিত করা হয়,
      # যাতে .venv-এ pytest (dev dependency) অবশ্যই থাকে।
      - name: 📦 Install Dependencies (Smart Sync)
        run: |
          mkdir -p backend
          cd backend
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          if [ "${{ steps.poetry-cache.outputs.cache-hit }}" != "true" ]; then
            poetry install --with dev
          else
            echo "venv cache HIT — syncing dependencies with poetry"
            poetry install --no-root --sync --with dev
          fi

      # বাংলা মন্তব্য: Playwright browser cache miss হলেই download হবে — hit হলে skip।
      - name: 🎭 Install Playwright Browsers (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd backend
          poetry run python -m playwright install --with-deps chromium || poetry run python -m playwright install chromium || true

      # বাংলা মন্তব্য: cache hit/miss স্ট্যাটাস GitHub Step Summary-তে লগ করা হচ্ছে।
      - name: 📊 Backend Cache Status Report
        run: |
          echo "### Backend Cache Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.poetry-cache.outputs.cache-hit }}" == "true" ]; then
            echo "- Poetry/venv cache: HIT — poetry install skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Poetry/venv cache: MISS — fresh install completed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            echo "- Playwright cache: HIT — browser download skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Playwright cache: MISS — browsers downloaded and cached" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🧪 Run Tests
        id: backend_tests
        working-directory: backend
        env:
          ENABLE_CHAOS_INJECTOR: "false"
          CHAOS_MODE: "disabled"
          CHAOS_ENGINE_ENABLED: "false"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
          POSTGRES_DB: "supreme_test_db"
        run: |
          # বাংলা মন্তব্য: virtualenvs.create true ও in-project নিশ্চিত করে poetry run pytest সরাসরি চালানো হচ্ছে।
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          if [ "${{ needs.changes.outputs.backend }}" = 'true' ] || [ "${{ needs.changes.outputs.shared }}" = 'true' ]; then
            poetry run pytest -n auto --dist=loadfile --timeout=120 --md pytest-report.md --cov=core --cov-report=json:coverage.json --cov-report=term-missing --cov-fail-under=38 -k "not chaos"
          else
            echo "Skipping full backend tests, only running smoke tests."
            poetry run pytest -n auto tests/test_health.py -q
          fi

      - name: Add Backend Test Results to GitHub Summary
        if: always()
        run: |
          mkdir -p backend
          cd backend
          python ../.github/scripts/supreme_ci.py generate-report \
            --pytest-json pytest-report.md \
            --coverage-json coverage.json \
            --label Backend
      - name: GCP Auth for Artifact Registry
        # বাংলা মন্তব্য: রেন্ডার-এ স্থানান্তরের কারণে জিসিপি বিল্ড ও পুশ নিষ্ক্রিয় করা হলো।
        if: false
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Login to GAR
        if: false
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        if: false
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and Push Backend Image to GAR
        if: false
        id: build-and-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/supremeai-repo/supremeai-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Echo Image Digest
        if: false
        run: |
          echo "Pushed image with digest: ${{ steps.build-and-push.outputs.digest }}"


  frontend-core:
    name: 🌐 Frontend Monorepo (Turbo)
    runs-on: ubuntu-latest
    needs: [changes, service-preflight]
    if: >
      !failure() && !cancelled() &&
      (
        (needs.changes.outputs.trivial_change != 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true' || github.run_attempt > 1)) ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_frontend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ⚙️ Setup Pnpm Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pnpm-store
          # বাংলা মন্তব্য: deps: prefix — cache-janitor-এ dependency cache হিসেবে চিহ্নিত হবে,
          # ফলে build cache-এর আগে evict হবে না।
          key: deps:${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            deps:${{ runner.os }}-pnpm-

      - name: 📦 Install Pnpm Dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm install --frozen-lockfile
          pnpm store prune

      # বাংলা মন্তব্য: পূর্বে github.sha ব্যবহার করা হতো — ফলে প্রতিটি commit-এ নতুন key,
      # cache hit-rate ছিল শূন্যের কাছাকাছি। এখন lockfile ও package.json hash ব্যবহার করা হচ্ছে
      # যাতে dependency না বদলালে Turborepo build cache পুনরায় ব্যবহার হয়।
      - name: Cache Turborepo
        id: turbo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          # বাংলা মন্তব্য (পারফরম্যান্স ফিক্স): আগে key-তে "turbo:" prefix ছিল না অথচ
          # restore-keys সবগুলোতে "turbo:" prefix দিয়ে prefix-match খুঁজত — ফলে
          # restore-keys কখনো কোনো সংরক্ষিত cache-এর সাথে match করত না (actions/cache
          # prefix-match করে restore-keys-এর জন্য), অর্থাৎ hash না মিললেই সম্পূর্ণ fresh
          # build হতো, node-version/OS-level fallback কখনো কাজ করত না। key ও restore-keys
          # একই "turbo:" prefix scheme-এ আনা হলো যাতে partial-cache fallback আসলেই কাজ করে।
          key: turbo:${{ runner.os }}-turbo-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'apps/**/package.json', 'tools/**/package.json') }}
          restore-keys: |
            turbo:${{ runner.os }}-turbo-node${{ env.NODE_VERSION }}-
            turbo:${{ runner.os }}-turbo-

      # বাংলা মন্তব্য: Turbo cache hit/miss রিপোর্ট GitHub Step Summary-তে দেখানো হচ্ছে।
      - name: 📊 Turbo Cache Report
        run: |
          if [ "${{ steps.turbo-cache.outputs.cache-hit }}" == "true" ]; then
            echo "- Turbo cache: HIT — build artifacts restored from cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Turbo cache: MISS — fresh build running" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build & Lint Frontend Packages
        env:
          VITE_PORTAL_TYPE: 'admin'
          VITE_API_URL: ${{ env.SUPREMEAI_API_URL }}
          VITE_API_BASE: ${{ env.SUPREMEAI_API_URL }}
        # বাংলা মন্তব্য: ওয়ার্কস্পেস থেকে web-chat রিমুভ করা হয়েছে, তাই টার্বোরেপো ফিল্টার থেকে এটি বাদ দেওয়া হল।
        run: pnpm turbo run build lint --filter=supremeai-studio-client --filter=supremeai-vscode --cache-dir=.turbo


      - name: Run Studio Client Vitest with JSON Report
        run: pnpm --dir apps/studio-client exec vitest run --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Add Studio Client Test Results to GitHub Summary
        if: always()
        run: python .github/scripts/supreme_ci.py generate-report --vitest-json apps/studio-client/vitest-report.json --label "Studio Client"

      - name: 🔍 Studio Client — Bundle Size Check
        run: bash apps/studio-client/scripts/bundle-check.sh apps/studio-client/dist-admin

      - name: 🔍 Studio Client — Hardcoded Values Grep
        run: |
          echo "Checking for hardcoded localhost, TODO_FIXME, or hardcoded secrets in commandcenter..."
          violations=0
          if grep -rn 'localhost' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found hardcoded 'localhost' references"
            violations=$((violations + 1))
          fi
          if grep -rn 'TODO_FIXME' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found TODO_FIXME markers"
            violations=$((violations + 1))
          fi
          if grep -rn -E '(api_key|apikey|secret|password|token)\s*[:=]\s*["'"'"'][^"'"'"']+["'"'"']' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found potential hardcoded secrets"
            violations=$((violations + 1))
          fi
          if [ $violations -gt 0 ]; then
            echo "FAIL: $violations hardcoded value violation(s) found"
            exit 1
          fi
          echo "PASS: No hardcoded values found"

      - name: ♿ Studio Client — Accessibility Check (axe-core)
        # বাংলা মন্তব্য: axe-core এবং Chrome/ChromeDriver ভার্সন সামঞ্জস্যহীনতার কারণে CI ফেল হওয়া ঠেকাতে continue-on-error যুক্ত করা হয়েছে এবং browser-driver-manager চালনা করা হয়েছে।
        continue-on-error: true
        env:
          VITE_PORTAL_TYPE: 'admin'
        run: |
          pnpm --dir apps/studio-client exec vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 30000
          npx --yes browser-driver-manager install chrome 2>/dev/null || true
          npx --yes @axe-core/cli http://localhost:4173 || true

      - name: Run Web Chat Vitest with JSON Report
        if: always()
        run: |
          if [ -d "apps/web-chat" ]; then
            SUPREMEAI_API_URL="https://mock-api.supremeai.local" pnpm --dir apps/web-chat exec vitest run --reporter=json --outputFile=vitest-report.json
          else
            echo "web-chat app not found, skipping tests."
          fi

      - name: Add Web Chat Test Results to GitHub Summary
        if: always()
        run: |
          if [ -f "apps/web-chat/vitest-report.json" ]; then
            python .github/scripts/supreme_ci.py generate-report --vitest-json apps/web-chat/vitest-report.json --label "Web Chat"
          else
            echo "No web-chat test results to report."
          fi

      - name: Run VS Code Extension Tests
        run: pnpm turbo run test --filter=supremeai-vscode --cache-dir=.turbo


      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: apps/studio-client/dist-admin
          retention-days: 1

  check-render-quota:
    name: 📊 Check Render Build Quota
    needs: [changes, service-preflight]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.admin_backend_changed == 'true' ||
        needs.changes.outputs.customer_backend_changed == 'true'
      )
    outputs:
      use_github_build: ${{ steps.quota.outputs.use_github_build }}
      minutes_used: ${{ steps.quota.outputs.minutes_used }}
      pct_used: ${{ steps.quota.outputs.pct_used }}
      remaining_min: ${{ steps.quota.outputs.remaining_min }}
      checked_at: ${{ steps.quota.outputs.checked_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore minutes cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: render_minutes_cache.json
          key: render-quota-${{ github.run_number }}
          restore-keys: |
            render-quota-

      - name: Check Render quota
        id: quota
        run: python .github/scripts/check-render-quota.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}
          BACKUP_SVC_ID: ${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}
          RENDER_BILLING_DAY: ${{ vars.RENDER_BILLING_DAY }}
          RENDER_BILLING_DAY_BACKUP: ${{ vars.RENDER_BILLING_DAY_BACKUP }}

      - name: Save minutes cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: render_minutes_cache.json
          key: render-quota-${{ github.run_number }}

      - name: Report quota status
        run: |
          echo "### 📊 Render Build Minutes Report" >> $GITHUB_STEP_SUMMARY
          echo "**Checked at:** ${{ steps.quota.outputs.checked_at }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Minutes Used | ${{ steps.quota.outputs.minutes_used }} / 500 |" >> $GITHUB_STEP_SUMMARY
          echo "| Remaining | ${{ steps.quota.outputs.remaining_min }} min |" >> $GITHUB_STEP_SUMMARY
          echo "| Usage % | ${{ steps.quota.outputs.pct_used }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Build Mode | ${{ steps.quota.outputs.use_github_build }} |" >> $GITHUB_STEP_SUMMARY

  build-backend-image:
    name: 🐳 Build & Push Backend Image
    needs: [backend-core, changes]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.repository == 'paykaribazaronline/supremeai' &&
      needs.backend-core.result != 'failure' && needs.backend-core.result != 'cancelled' && needs.backend-core.result != 'skipped' &&
      (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deploy_render == 'true') ||
        github.run_attempt > 1
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/supremeai-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # বাংলা মন্তব্য: GHCR registry cache ব্যবহার করা হচ্ছে — আলাদা storage quota তাই 10GB GHA limit স্পর্শ করে না
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/supremeai-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.string.outputs.OWNER_LOWER }}/supremeai-backend:buildcache,mode=max
          # বাংলা মন্তব্য: CACHEBUST build-arg — Dockerfile বা poetry.lock বদলালে cache অটোমেটিক invalid হবে,
          # ফলে পুরানো Dockerfile-এর ভিত্তিতে ভুল cache hit হওয়া প্রতিরোধ হবে।
          build-args: |
            CACHEBUST=${{ hashFiles('backend/Dockerfile', 'backend/poetry.lock') }}

  deploy-user-backend:
    name: 🚀 Deploy User Backend (Render)
    needs: [build-backend-image, production-readiness, changes, check-render-quota]
    runs-on: ubuntu-latest
    environment: production
    if: |
      always() &&
      github.repository == 'paykaribazaronline/supremeai' &&
      needs.build-backend-image.result == 'success' &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped') &&
      needs.changes.outputs.customer_backend_changed == 'true' &&
      needs.changes.outputs.admin_backend_changed == 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trigger User Render Deploy (Prebuilt Image)
        if: needs.check-render-quota.outputs.use_github_build == 'true'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${OWNER_LOWER}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          PRIMARY_SVC_ID="${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Primary Render deploy triggered via API with prebuilt image (status: $STATUS)!"
          else
            echo "❌ Primary API deploy with prebuilt image returned status: $STATUS"
            exit 1
          fi

      - name: Trigger User Render Deploy (Source Code)
        if: needs.check-render-quota.outputs.use_github_build != 'true'
        run: |
          PRIMARY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          PRIMARY_SUCCESS=false

          if [ -n "$PRIMARY_HOOK" ]; then
            echo "Triggering primary Render account (Customer backend)..."
            if curl -f -s "$PRIMARY_HOOK" > /dev/null; then
              echo "✅ Primary Render deploy triggered successfully!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary hook failed."
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ] && [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "🔄 Using Render API to trigger primary deploy..."
            PRIMARY_SVC_ID="${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Primary Render deploy triggered via API (status: $STATUS)!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary API deploy returned status: $STATUS"
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy hooks or API triggers succeeded for User backend! Failing build."
            exit 1
          fi

      - name: Verify User Backend Deploy Status
        run: |
          # বাংলা মন্তব্য (জরুরি): এই পদে শুধু Backend (supremeai-backend-docker) আইসোলেটেডভাবে ভেরিফাই হবে.
          # অন্য কোনো ব্যাকএন্ডের হেলথ চেক এখানে মেপে মিথ্যা Success দেওয়া সম্পূর্ণ নিষিদ্ধ।
          python .github/scripts/verify-render-deploy.py --service-id "${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}" --name "Backend (supremeai-backend-docker)"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}

  deploy-admin-backend:
    name: 🚀 Deploy Admin Backend (Render)
    needs: [build-backend-image, production-readiness, changes, check-render-quota]
    runs-on: ubuntu-latest
    environment: production
    if: |
      always() &&
      github.repository == 'paykaribazaronline/supremeai' &&
      needs.build-backend-image.result == 'success' &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped') &&
      needs.changes.outputs.admin_backend_changed == 'true' &&
      needs.changes.outputs.customer_backend_changed == 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trigger Admin Render Deploy (Prebuilt Image)
        if: needs.check-render-quota.outputs.use_github_build == 'true'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${OWNER_LOWER}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          BACKUP_SVC_ID="${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_BACKUP }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          # বাংলা মন্তব্য: Render API ডিপ্লয় তৈরিতে 201 Created বা 202 Accepted ফেরত দেয়। তাই 201 বা 202 স্টেটাস কোড চেক করা হচ্ছে।
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Admin Render deploy triggered via API with prebuilt image (status: $STATUS)!"
          else
            echo "❌ Admin API deploy with prebuilt image returned status: $STATUS"
            exit 1
          fi

      - name: Trigger Admin Render Deploy (Source Code)
        if: needs.check-render-quota.outputs.use_github_build != 'true'
        run: |
          BACKUP_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}"
          BACKUP_API_KEY="${{ secrets.RENDER_API_KEY_BACKUP }}"
          BACKUP_SVC_ID="${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}"
          BACKUP_SUCCESS=false

          if [ -n "$BACKUP_HOOK" ]; then
            echo "🔄 Triggering admin backend via deploy webhook..."
            if curl -f -s "$BACKUP_HOOK" > /dev/null; then
              echo "✅ Admin backup hook triggered!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin backup webhook failed."
            fi
          elif [ -n "$BACKUP_API_KEY" ]; then
            echo "🔄 Using Render API to trigger admin backend deploy..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
              -H "Authorization: Bearer $BACKUP_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            # বাংলা মন্তব্য: ৪০৪ মানে API key-টি এই service-এর মালিক নয়।
            # ভুল service-এ fallback deploy করা সম্পূর্ণ নিষিদ্ধ — সরাসরি fail করতে হবে।
            if [ "$STATUS" = "404" ]; then
              echo "❌ Admin service $BACKUP_SVC_ID returned 404. RENDER_API_KEY_BACKUP does not own this service."
              echo "❌ ACTION REQUIRED: Set RENDER_DEPLOY_HOOK_URL_BACKUP webhook for Admin backend in GitHub Secrets."
              exit 1
            fi
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Admin Render deploy triggered via API (status: $STATUS)!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin API deploy returned status: $STATUS"
            fi
          fi

          if [ "$BACKUP_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy hooks or API triggers succeeded for Admin backend!"
            echo "❌ Set RENDER_DEPLOY_HOOK_URL_BACKUP in GitHub Secrets from Render Dashboard > supremeai-admin > Settings > Deploy Hook."
            exit 1
          fi

      - name: Verify Admin Backend Deploy Status
        run: |
          # বাংলা মন্তব্য (জরুরি): এই পদে শুধু Admin Backend (srv-d9fg48bh523c73f63bb0) আইসোলেটেডভাবে ভেরিফাই হবে।
          python .github/scripts/verify-render-deploy.py --service-id "${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}" --name "Admin Backend"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}

  deploy-combined-backend:
    name: 🚀 Deploy Combined Backend (Render)
    needs: [build-backend-image, production-readiness, changes, check-render-quota]
    runs-on: ubuntu-latest
    environment: production
    if: |
      always() &&
      github.repository == 'paykaribazaronline/supremeai' &&
      needs.build-backend-image.result == 'success' &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped') &&
      needs.changes.outputs.admin_backend_changed == 'true' &&
      needs.changes.outputs.customer_backend_changed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trigger Combined Render Deploy (Prebuilt Image)
        if: needs.check-render-quota.outputs.use_github_build == 'true'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${OWNER_LOWER}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          PRIMARY_SVC_ID="${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}"
          BACKUP_SVC_ID="${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}"

          # Deploy Primary
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Primary Render deploy triggered with prebuilt image (status: $STATUS)!"
          else
            echo "⚠️ Primary API deploy returned status: $STATUS"
          fi

          # Deploy Backup
          if [ -n "${{ secrets.RENDER_API_KEY_BACKUP }}" ]; then
            STATUS_B=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_BACKUP }}" \
              -H "Content-Type: application/json" \
              -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
            if [ "$STATUS_B" = "201" ] || [ "$STATUS_B" = "202" ]; then
              echo "✅ Backup Render deploy triggered with prebuilt image (status: $STATUS_B)!"
            else
              echo "⚠️ Backup API deploy returned status: $STATUS_B"
            fi
          fi

          # বাংলা মন্তব্য: যদি ব্যাকআপ কি না থাকে তবে প্রাইমারি সফল হলেই গ্রিন বিল্ড পাস হবে।
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "202" ]; then
            if [ -n "${{ secrets.RENDER_API_KEY_BACKUP }}" ] && [ "$STATUS_B" != "201" ] && [ "$STATUS_B" != "202" ]; then
              echo "❌ CRITICAL: Primary deploy failed and Backup deploy failed! Failing build."
              exit 1
            elif [ -z "${{ secrets.RENDER_API_KEY_BACKUP }}" ]; then
              echo "❌ CRITICAL: Primary deploy failed! Failing build."
              exit 1
            fi
          fi

      - name: Trigger Combined Render Deploy (Source Code)
        if: needs.check-render-quota.outputs.use_github_build != 'true'
        run: |
          PRIMARY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          BACKUP_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}"
          BACKUP_API_KEY="${{ secrets.RENDER_API_KEY_BACKUP }}"
          BACKUP_SVC_ID="${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}"

          PRIMARY_SUCCESS=false
          BACKUP_SUCCESS=false

          if [ -n "$PRIMARY_HOOK" ]; then
            echo "Trying primary Render account..."
            if curl -f -s "$PRIMARY_HOOK" > /dev/null; then
              echo "✅ Primary Render deploy triggered successfully!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary hook failed."
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ] && [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "🔄 Using Render API to trigger primary deploy..."
            PRIMARY_SVC_ID="${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-da07ogmgekts739amqa0' }}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Primary Render deploy triggered via API (status: $STATUS)!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary API deploy returned status: $STATUS"
            fi
          fi

          if [ -n "$BACKUP_HOOK" ]; then
            echo "🔄 Triggering admin backend via deploy webhook..."
            if curl -f -s "$BACKUP_HOOK" > /dev/null; then
              echo "✅ Admin backup hook triggered!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin backup webhook failed."
            fi
          elif [ -n "$BACKUP_API_KEY" ]; then
            echo "🔄 Using Render API to trigger admin backend deploy..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
              -H "Authorization: Bearer $BACKUP_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            # বাংলা মন্তব্য: ৪০৪ মানে API key-টি এই admin service-এর মালিক নয়।
            # primary service-এ চুপচাপ deploy করা সম্পূর্ণ নিষিদ্ধ — এটা false-positive তৈরি করে।
            if [ "$STATUS" = "404" ]; then
              echo "⚠️ Admin service $BACKUP_SVC_ID returned 404. RENDER_API_KEY_BACKUP does not own this service."
              echo "⚠️ Admin backend deploy skipped — set RENDER_DEPLOY_HOOK_URL_BACKUP to fix this."
            elif [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Admin Render deploy triggered via API (status: $STATUS)!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin API deploy returned status: $STATUS"
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ] && [ "$BACKUP_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy hooks or API triggers succeeded! Failing build."
            exit 1
          fi

      # বাংলা মন্তব্য: continue-on-error: true সরানো হয়েছে — কারণ এটি real deployment failure mask করছিল।
      # User Backend (primary) fail হলেও CI pipeline সবুজ দেখাচ্ছিল, কিন্তু Render-এ আসলে service unhealthy ছিল।
      # এখন verify-render-deploy.py সঠিকভাবে exit code 1 return করলে job fail হবে এবং CI লাল দেখাবে।
      - name: Verify Render Deploy Health
        run: python .github/scripts/verify-render-deploy.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
