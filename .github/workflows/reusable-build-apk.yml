name: 🏗️ Reusable Build APK

on:
  workflow_call:

env:
  FLUTTER_VERSION: '3.29.0'

jobs:
  build-apk:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle & Pub Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Build APK (Arm64 for Latest Devices)
        working-directory: apps/mobile
        run: |
          flutter pub get
          # বাংলা মন্তব্য: এএবি ফাইলের বদলে সরাসরি এপিকে ফাইল বিল্ড করা হচ্ছে যা লেটেস্ট আর্কিটেকচার (arm64-v8a) সাপোর্ট করবে এবং সাইজও অপটিমাইজড থাকবে।
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supremeai-mobile-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
