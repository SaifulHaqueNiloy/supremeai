name: ⚡ Auto-Sync Staging to Production Main

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: auto-sync-production-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  auto-promote-to-main-repo:
    name: 🚀 Push to paykaribazaronline/supremeai
    runs-on: ubuntu-latest
    # Only run in the staging repository to avoid loops
    if: github.repository == 'SaifulHaqueNiloy/supremeai' && contains(github.event.head_commit.message, '[NO-SYNC]') == false
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "SupremeAI Continuous Sync Bot"
          git config --global user.email "sync-bot@supremeai.dev"

      - name: Push to Target Main Repository
        env:
          TARGET_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo "⚠️ MAIN_REPO_TOKEN is missing in staging secrets! Skipping auto-push."
            exit 0
          fi
          
          echo "🔄 Syncing commit to paykaribazaronline/supremeai:${{ github.ref_name }}..."
          git remote add target "https://x-access-token:${TARGET_TOKEN}@github.com/paykaribazaronline/supremeai.git" || true
          git push target ${{ github.ref_name }}:${{ github.ref_name }} --force-with-lease || git push target ${{ github.ref_name }}:${{ github.ref_name }}
          echo "✅ Successfully synced to production repository!"
