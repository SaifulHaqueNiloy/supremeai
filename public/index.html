<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/supreme-ai-icon.svg">
    <title>SupremeAI - Unified Intelligence</title>
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/*": "https://www.gstatic.com/firebasejs/10.7.1/*"
        }
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            z-index: 1;
        }

        .glass-box {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .logo { 
            font-family: 'Outfit', sans-serif;
            font-size: 36px; 
            font-weight: 800; 
            text-align: center; 
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle { 
            color: var(--text-muted); 
            font-size: 16px; 
            text-align: center; 
            margin-bottom: 40px; 
            font-weight: 300;
        }

        .guest-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .btn-guest {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-guest:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.5);
            filter: brightness(1.1);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .divider span {
            padding: 0 15px;
        }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--text-muted); 
            font-weight: 500; 
            font-size: 14px; 
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 15px;
            color: white;
            transition: all 0.3s;
        }

        input:focus { 
            outline: none; 
            border-color: var(--primary); 
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }

        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

        .error { 
            color: #ef4444; 
            background: rgba(220, 38, 38, 0.1); 
            padding: 12px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: none; 
            border: 1px solid rgba(220, 38, 38, 0.2);
            font-size: 14px;
            text-align: center;
        }
        .error.show { display: block; }

        .loading { display: none; text-align: center; margin-bottom: 10px; }
        .spinner { 
            border: 2px solid rgba(255,255,255,0.1); 
            border-top: 2px solid var(--secondary); 
            border-radius: 50%; 
            width: 24px; 
            height: 24px; 
            animation: spin 0.8s linear infinite; 
            margin: 0 auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading.show { display: block; }

        .toggle-auth {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .toggle-auth a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .toggle-auth a:hover { text-decoration: underline; }

        /* Floating particles effect */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="glass-box">
            <div class="logo">SupremeAI</div>
            <div class="subtitle" id="subtitle">The Future of Multi-Agent Systems</div>
            
            <div class="error" id="error"></div>
            <div class="loading" id="loading"><div class="spinner"></div></div>

            <div class="guest-section">
                <button class="btn-guest" id="btn-guest">
                    <span>Get Started as Guest</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">Instant access with daily quota limits</p>
            </div>

            <div class="divider">
                <span>OR LOGIN FOR FULL ACCESS</span>
            </div>

            <form id="form">
                <div class="form-group" id="name-group" style="display: none;">
                    <label for="display-name">Full Name</label>
                    <input type="text" id="display-name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="btn" disabled>Sign In</button>
            </form>

            <div class="toggle-auth">
                <span id="toggle-text">New to SupremeAI?</span>
                <a href="#" id="toggle-link">Create Account</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, connectAuthEmulator } from 'firebase/auth';

        let auth = null;
        let firebaseReady = false;
        let isLogin = true;

        const errorEl = document.getElementById('error');
        const loadingEl = document.getElementById('loading');
        const btn = document.getElementById('btn');
        const btnGuest = document.getElementById('btn-guest');
        const form = document.getElementById('form');
        const subtitleEl = document.getElementById('subtitle');
        const nameGroup = document.getElementById('name-group');
        const toggleText = document.getElementById('toggle-text');
        const toggleLink = document.getElementById('toggle-link');

        function showError(msg) { 
            errorEl.textContent = msg; 
            errorEl.classList.add('show'); 
        }
        
        function hideError() { 
            errorEl.classList.remove('show'); 
        }
        
        function setLoading(loading) { 
            loadingEl.classList.toggle('show', loading); 
            btn.disabled = loading || !firebaseReady; 
            btnGuest.disabled = loading;
        }

        // Guest Access Handler
        btnGuest.addEventListener('click', () => {
            console.log('Entering Guest Mode...');
            sessionStorage.setItem('supremeai_token', 'GUEST_MODE');
            sessionStorage.setItem('supremeai_user', JSON.stringify({
                email: 'guest@supremeai.internal',
                uid: 'guest_' + Math.random().toString(36).substr(2, 9),
                displayName: 'Guest User',
                isGuest: true
            }));
            window.location.href = '/admin';
        });

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            subtitleEl.textContent = isLogin ? 'The Future of Multi-Agent Systems' : 'Join the SupremeAI Revolution';
            btn.textContent = isLogin ? 'Sign In' : 'Sign Up';
            toggleText.textContent = isLogin ? "New to SupremeAI?" : "Already have an account?";
            toggleLink.textContent = isLogin ? "Create Account" : "Sign In";
            nameGroup.style.display = isLogin ? 'none' : 'block';
            hideError();
        });

        async function initializeFirebase() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyCib1UPogwLoAshIWm9YQJB_RR0UxC07i8",
                    authDomain: "supremeai-a.firebaseapp.com",
                    projectId: "supremeai-a",
                    storageBucket: "supremeai-a.firebasestorage.app",
                    messagingSenderId: "565236080752",
                    appId: "1:565236080752:web:572bb9313db9afb355d4b5"
                };

                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                
                if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                    try {
                        connectAuthEmulator(auth, 'http://localhost:9099', { disableWarnings: true });
                    } catch (e) {}
                }

                firebaseReady = true;
                btn.disabled = false;
            } catch (err) {
                console.error('Firebase init error:', err);
                showError('Auth system offline. Guest mode still available.');
            }
        }

        initializeFirebase();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('display-name').value.trim();

            if (!email || !password) { showError('Enter credentials'); return; }
            if (!isLogin && !displayName) { showError('Name required'); return; }
            
            setLoading(true);
            
            try {
                let userCredential;
                if (isLogin) {
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                } else {
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                }

                const token = await userCredential.user.getIdToken();
                sessionStorage.setItem('supremeai_token', token);
                sessionStorage.setItem('supremeai_user', JSON.stringify({
                    email: userCredential.user.email,
                    uid: userCredential.user.uid,
                    displayName: userCredential.user.displayName || displayName || email.split('@')[0]
                }));
                
                window.location.href = '/admin';
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        });

        // Background Particles
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.getElementById('particles').appendChild(canvas);

        let w, h, particles = [];
        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles = Array.from({length: 30}, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                s: Math.random() * 2,
                v: Math.random() * 0.5 + 0.1
            }));
        }
        function draw() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.v;
                if (p.y < -10) p.y = h + 10;
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', init);
        init(); draw();
    </script>
</body>
</html>
