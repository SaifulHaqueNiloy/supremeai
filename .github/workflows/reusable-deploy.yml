name: 🚀 Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      repository_owner:
        required: true
        type: string
      ref:
        required: true
        type: string
      sha:
        required: true
        type: string
      event_name:
        required: true
        type: string
      deploy_target:
        required: false
        type: string
      run_deploy_render:
        required: false
        type: string
      ignore_dependencies:
        required: false
        type: string
        default: 'false'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 🐳 Backend: Docker Build + Render Deploy
  # ─────────────────────────────────────────────────────────────
  backend-deploy:
    name: 🐳 Backend Deploy
    uses: ./.github/workflows/reusable-deploy-backend.yml
    with:
      repository: ${{ inputs.repository }}
      repository_owner: ${{ inputs.repository_owner }}
      ref: ${{ inputs.ref }}
      sha: ${{ inputs.sha }}
      event_name: ${{ inputs.event_name }}
      deploy_target: ${{ inputs.deploy_target }}
      run_deploy_render: ${{ inputs.run_deploy_render }}
      ignore_dependencies: ${{ inputs.ignore_dependencies }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # 🌐 Frontend: Vercel + Firebase Deploy
  # ─────────────────────────────────────────────────────────────
  frontend-deploy:
    name: 🌐 Frontend Deploy
    uses: ./.github/workflows/reusable-deploy-frontend.yml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      event_name: ${{ inputs.event_name }}
      deploy_target: ${{ inputs.deploy_target }}
      ignore_dependencies: ${{ inputs.ignore_dependencies }}
    secrets: inherit
