# ─────────────────────────────────────────────────────────────────────────────
# EDGES — Domain-to-Domain meaningful relationships (অর্থপূর্ণ সম্পর্ক)
# ─────────────────────────────────────────────────────────────────────────────
# type semantics: depends_on (কাঠামোগত নির্ভরতা) · queries (রানটাইম পড়া)
# · writes (রানটাইম লেখা) · enforces (নিয়ম প্রয়োগ) · feeds (ডেটা প্রবাহ)
# · verifies (যাচাই) · deploys (স্থাপন)
edges:
  - from: agent-center
    to: infrastructure-center
    type: depends_on
    via: node.mcp-tower-client → node.mcp-control-plane
    why: "এজেন্ট টাওয়ার ছাড়া অনলাইন হতে পারে না (heartbeat + lease)।"
  - from: agent-center
    to: memory-learning-center
    type: queries
    via: bootstrap handshake → node.solution-memory-cli
    why: "কাজ শুরুর আগে অতীত সমাধান খোঁজা (Search Before Solving)।"
  - from: agent-center
    to: memory-learning-center
    type: writes
    via: node.solution-memory-cli → node.episodic-memory
    why: "কাজ শেষে শেখা record (Pave Before Leaving)।"
  - from: agent-center
    to: git-delivery-center
    type: feeds
    via: PR + queue:hold
    why: "এজেন্ট কাজের ফল PR আকারে delivery pipeline-এ দেয়।"
  - from: capability-center
    to: memory-learning-center
    type: queries
    via: RAG pipeline → node.memory-repository
    why: "AI capability স্মৃতি-নির্ভর (context enrichment)।"
  - from: capability-center
    to: ux-center
    type: feeds
    via: node.api-surface
    why: "ফিচার API contract হয়ে ব্যবহারকারীর কাছে পৌঁছায়।"
  - from: governance-center
    to: git-delivery-center
    type: enforces
    via: node.rules-yml → node.pr-gate
    why: "সংবিধান gate হয়ে PR-এ প্রয়োগ হয়।"
  - from: governance-center
    to: agent-center
    type: enforces
    via: node.rules-yml → AGENTS.md → agent bootstrap
    why: "এজেন্ট নিয়ম মানে কারণ সংবিধান তা চায়।"
  - from: execution-center
    to: infrastructure-center
    type: depends_on
    via: worker deploy → Render/Supabase
    why: "রানটাইম compute/data ইনফ্রায় চলে।"
  - from: execution-center
    to: capability-center
    type: feeds
    via: pipeline execution results
    why: "Execution ফলাফল capability-র ইনপুট হয়।"
  - from: git-delivery-center
    to: infrastructure-center
    type: deploys
    via: deploy workflows → Render/Cloudflare/Firebase
    why: "ডেলিভারির শেষ ধাপ ইনফ্রায় স্থাপন।"
  - from: security-center
    to: git-delivery-center
    type: enforces
    via: Security Scan + topology check jobs
    why: "লিক-সহ PR main-এ যেতে পারে না।"
  - from: audit-center
    to: governance-center
    type: feeds
    via: sentinel findings → rule updates
    why: "অডিট ফাইন্ডিং থেকে নতুন নিয়ম জন্মায়।"
  - from: audit-center
    to: capability-center
    type: verifies
    via: node.parity-sentinel route attribution
    why: "Declared capability বনাম বাস্তব route মেলানো।"
  - from: audit-center
    to: agent-center
    type: verifies
    via: node.graph-health-auditor → registry integrity
    why: "গ্রাফ-সত্য নিজেই অডিটেড থাকে।"
  - from: ux-center
    to: capability-center
    type: depends_on
    via: node.api-surface → services
    why: "UI ফিচারের জন্য capability service ডাকে।"
  - from: infrastructure-center
    to: agent-center
    type: feeds
    via: node.mcp-control-plane heartbeat status
    why: "টাওয়ার ফ্লিট-অবস্থা এজেন্ট সিস্টেমে জানায়।"
  - from: memory-learning-center
    to: audit-center
    type: feeds
    via: execution telemetry → trend reports
    why: "শেখার উপাত্ত অডিট insight হয়।"

# ─────────────────────────────────────────────────────────────────────────────
# GROUP BOUNDARIES — গ্রুপ বাউন্ডারি (কোন গ্রুপ কোথায় পর্যন্ত কাজ করবে)
# ─────────────────────────────────────────────────────────────────────────────
# বাংলা মন্তব্য: Flexible Group Branching (#2378) অনুযায়ী গ্রুপগুলোর file-scope
# বাউন্ডারি। atomic_claim + Scope Gate এই তালিকার সাথে মিলিয়ে চলে। একটি গ্রুপের
# allowed_paths অন্য সক্রিয় গ্রুপের allowed_paths-এর সাথে overlap করবে না।
group_boundaries:
  - group: arch-foundation
    label: group:arch-foundation
    issues: [2399, 2377]
    branch_prefix: "group/arch-foundation (naming-guard অনুমোদনের আগপর্যন্ত agent-*-namespace)"
    allowed_paths:
      - docs/architecture/ECOSYSTEM_GRAPH_REGISTRY.yaml
      - scripts/agents/mcp_tower_client.py
      - scripts/ci/graph_health_audit.py
    notes: "seq:1 #2399 (graph registry), seq:2 #2377 (DB as operational truth — পরে)।"

  - group: pipeline-governance
    label: group:pipeline-governance
    issues: [2378, 2397, 2396]
    branch_prefix: "group/pipeline-governance (naming-guard অনুমোদনের আগপর্যন্ত agent-*-namespace)"
    allowed_paths:
      - .github/workflows
      - .github/constitution/rules.yml
      - .github/scripts
      - docs/architecture/ARCH-LIVING-PIPELINE-01.md
    notes: "Flexible Group Branching protocol + living pipeline + rules.yml sync।"

# ─────────────────────────────────────────────────────────────────────────────
# GRAPH HEALTH INVARIANTS — auditor যা যাচাই করে (scripts/ci/graph_health_audit.py)
# ─────────────────────────────────────────────────────────────────────────────
health_invariants:
  - id: REG-01
    check: unique-node-ids
    severity: HIGH
    rule: "প্রতিটি node.id অবশ্যই অনন্য হবে (duplicate = গ্রাফে প্রতারণা)।"
  - id: REG-02
    check: no-duplicate-node-paths
    severity: HIGH
    rule: "একই canonical path দুই node-এ থাকতে পারবে না।"
  - id: REG-03
    check: node-domain-valid
    severity: HIGH
    rule: "প্রতিটি node.domain অবশ্যই domains-এ declared একটি id হবে।"
  - id: REG-04
    check: node-path-exists
    severity: MEDIUM
    rule: "প্রতিটি node.path ও domain owning_path ডিস্কে থাকবে (planned node হলে MEDIUM)।"
  - id: REG-05
    check: edge-endpoints-valid
    severity: HIGH
    rule: "প্রতিটি edge এর from/to অবশ্যই বৈধ domain বা node id হবে (missing edge endpoint নিষিদ্ধ)।"
  - id: REG-06
    check: no-dangling-centers
    severity: HIGH
    rule: "প্রতিটি domain-এর অন্তত ১টি node ও ১টি বাস্তবে-থাকা owning_path থাকবে।"
  - id: REG-07
    check: db-map-full-coverage
    severity: HIGH
    rule: "backend/models/*.py (base/__init__ বাদে) প্রতিটি ফাইল db_model_domain_map-এ থাকবে।"
  - id: REG-08
    check: db-map-no-stale-entries
    severity: HIGH
    rule: "db_model_domain_map-এ এমন ফাইল থাকবে না যা ডিস্কে নেই (stale = মৃত নোড)।"
  - id: REG-09
    check: db-map-domain-valid
    severity: HIGH
    rule: "db_model_domain_map-এর প্রতিটি value বৈধ domain id হবে।"
  - id: REG-10
    check: eight-questions-complete
    severity: HIGH
    rule: "core_truths, domains ও nodes প্রতিটিতে ৮টি প্রশ্নের সব উত্তর অ-খালি থাকবে।"
  - id: REG-11
    check: group-boundary-paths-exist
    severity: MEDIUM
    rule: "প্রতিটি গ্রুপের allowed_paths ডিস্কে থাকবে।"
  - id: REG-12
    check: no-group-boundary-overlap
    severity: HIGH
    rule: "দুই সক্রিয় গ্রুপের allowed_paths direct overlap করবে না (নীতি: 1 পথ = 1 মালিক)।"
