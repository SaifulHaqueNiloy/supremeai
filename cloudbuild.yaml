steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/supremeai-repo/backend:latest', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/supremeai-repo/backend:latest']
  
  # Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'supremeai-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/supremeai-repo/backend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=cloud,FIREBASE_PROJECT_ID=$PROJECT_ID,supremeai.cache.enabled=false'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/supremeai-repo/backend:latest'