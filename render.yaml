# render.yaml - SupremeAI 2.0 Master Blueprint (Zero Cost Edition)
services:
  # ১. ব্যাকএন্ড (GHCR Image - Zero Render Build Minutes)
  - type: web
    name: supremeai-backend
    env: image
    image:
      url: ghcr.io/paykaribazaronline/supremeai/supremeai-backend:latest
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      # বাকি সিক্রেটগুলো ড্যাশবোর্ড থেকে সিঙ্ক হবে (Upstash & Supabase)
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: SUPREMEAI_ADMIN_PASSWORD_HASH
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CI_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["https://supremeai-studio-client.onrender.com", "https://tiny-stroopwafel-2d981c.netlify.app", "https://supremeai-lac.vercel.app"]'

  # ২. ফ্রন্টএন্ড (Render 100% Free Static Hosting)
  - type: web
    name: supremeai-studio-client
    env: static
    buildCommand: "cd apps/studio-client && pnpm install && pnpm run build"
    staticPublishPath: "./apps/studio-client/dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
