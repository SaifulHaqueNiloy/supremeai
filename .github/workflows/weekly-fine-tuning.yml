# SupremeAI 2.0 - Automated Weekly Fine-Tuning Pipeline

name: 🎓 Weekly HF Auto Fine-Tuning Pipeline

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  generate-and-train:
    name: 🧠 Synthetic Data Export & HF Training Trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.11"
      - name: Generate Synthetic Fine-Tuning Dataset
        working-directory: backend
        run: |
          poetry run python -c "import asyncio; from pipelines.synthetic_data_pipeline import SyntheticDataPipeline; asyncio.run(SyntheticDataPipeline().generate_dataset())"
      - name: Report Dataset Summary
        run: |
          echo "✅ Synthetic Fine-Tuning Dataset generated successfully for HuggingFace model training." >> $GITHUB_STEP_SUMMARY
