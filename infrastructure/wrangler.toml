# SupremeAI 2.0 — Cloudflare Worker Configuration
# Target: Zero Cold Start for Render Backend (8-minute Cron Ping Interval)

name = "supremeai-worker"
main = "cloudflare_worker.js"
compatibility_date = "2026-07-01"
account_id = "9d13b864a51306efc2f50c331ba2afac"

[triggers]
crons = ["*/8 6-23 * * *"]  # Pings every 8 minutes only during business hours (6AM - 11:59PM UTC) to save Render hours

[vars]
# বাংলা মন্তব্ত: মেইন ব্যাকএন্ড ইউআরএল
USER_BACKEND_URL = "https://supremeai-backend-v2.onrender.com"
GCP_CLOUD_RUN_URL = "https://supremeai-backend-v2.onrender.com"
GCP_REGION = "us-central1"
GCP_WEIGHT = "100"
# 🆕 Scraper Microservice URL — proxy for /api/scraper/* via edge gateway
SCRAPER_SERVICE_URL = "https://supremeai-scraper-6nwi.onrender.com"
