services:
  - type: web
    name: supremeai-backend
    env: python
    rootDir: backend
    buildCommand: "bash ../scripts/render_build_backend.sh"
    startCommand: "poetry run uvicorn core.app:app --host 0.0.0.0 --port $PORT"
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CARGO_HOME
        value: /opt/render/project/src/.cargo

  - type: web
    name: supremeai-frontend
    env: static
    rootDir: .
    buildCommand: "bash scripts/render_build_frontend.sh"
    staticPublishPath: "./frontend/dist-user"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: CI
        value: "false"
      - key: PNPM_FLAGS
        value: "--no-frozen-lockfile"
      - key: VITE_ADMIN_BACKEND
        value: "https://supremeai-backend-6nwi.onrender.com"
      - key: VITE_USER_BACKEND
        value: "https://supremeai-backend-6nwi.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
