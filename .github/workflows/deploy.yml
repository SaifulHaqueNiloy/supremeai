# SupremeAI Deployment Pipeline — Production Ready
# 🔒 v4.0: Environment protection, approval gates, rollback capability

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/supremeai

jobs:
  # -----------------------------------------------------------------
  # Pre-deploy checks
  # -----------------------------------------------------------------
  pre-deploy:
    name: ✅ Pre-Deploy Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Ensure no secrets committed
        run: |
          echo "Checking for potential secrets..."
          if grep -rE "(password|secret|api_key|token)\s*[:=]\s*['\"]" --include="*.py" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.git | grep -v "test\|mock\|example\|env("; then
            echo "::warning::Potential hardcoded secret found!"
          fi

      - name: Check environment files
        run: |
          if [ -f ".env.production" ]; then
            echo "::error::.env.production should not be committed!"
            exit 1
          fi

  # -----------------------------------------------------------------
  # Deploy to Firebase (Frontend)
  # -----------------------------------------------------------------
  deploy-frontend:
    name: 🚀 Deploy Frontend
    needs: pre-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://supremeai-a.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@1127042a98f79fbc959141075ffebda8bc14d6df # master
        with:
          args: deploy --only hosting:user
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  # -----------------------------------------------------------------
  # Deploy Backend to GHCR (GitHub Container Registry)
  # -----------------------------------------------------------------
  deploy-backend-ghcr:
    name: 🐳 Push to GHCR
    needs: pre-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-core

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6dea928373d6e5a4 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -----------------------------------------------------------------
  # Notify on failure
  # -----------------------------------------------------------------
  notify-failure:
    name: 📢 Notify on Failure
    needs: [deploy-frontend, deploy-backend-ghcr]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.25.0
        with:
          payload: |
            {
              "text": "❌ Deployment Failed",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Deployment Failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
