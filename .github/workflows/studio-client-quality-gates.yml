name: Studio Client — Quality Gates

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/studio-client/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/studio-client/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bundle-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/studio-client/package-lock.json'

      - name: Install dependencies
        working-directory: apps/studio-client
        run: npm ci

      - name: Build studio-client
        working-directory: apps/studio-client
        run: npm run build

      - name: Run bundle size check
        working-directory: apps/studio-client
        run: bash scripts/bundle-check.sh dist

  hardcoded-values-check:
    name: Hardcoded Values Grep
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for hardcoded values
        run: |
          echo "Checking for hardcoded localhost, TODO_FIXME, or hardcoded secrets in commandcenter..."
          
          violations=0
          
          # Check for localhost hardcoding
          if grep -rn 'localhost' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found hardcoded 'localhost' references"
            violations=$((violations + 1))
          fi
          
          # Check for TODO_FIXME
          if grep -rn 'TODO_FIXME' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found TODO_FIXME markers"
            violations=$((violations + 1))
          fi
          
          # Check for common secret patterns
          if grep -rn -E '(api_key|apikey|secret|password|token)\s*[:=]\s*["'"'"'][^"'"'"']+["'"'"']' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found potential hardcoded secrets"
            violations=$((violations + 1))
          fi
          
          if [ $violations -gt 0 ]; then
            echo "FAIL: $violations hardcoded value violation(s) found"
            exit 1
          fi
          
          echo "PASS: No hardcoded values found"

  accessibility-check:
    name: Accessibility Check (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/studio-client/package-lock.json'

      - name: Install dependencies
        working-directory: apps/studio-client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/studio-client
        run: npx playwright install --with-deps chromium

      - name: Build studio-client
        working-directory: apps/studio-client
        run: npm run build

      - name: Start preview server
        working-directory: apps/studio-client
        run: npm run preview -- --port 4173 &
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Wait for server
        run: npx wait-on http://localhost:4173

      - name: Run axe-core accessibility scan
        run: npx --yes @axe-core/cli http://localhost:4173

  playwright-smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/studio-client/package-lock.json'

      - name: Install dependencies
        working-directory: apps/studio-client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/studio-client
        run: npx playwright install --with-deps chromium

      - name: Build studio-client
        working-directory: apps/studio-client
        run: npm run build

      - name: Start preview server
        working-directory: apps/studio-client
        run: npm run preview -- --port 4173 &
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Wait for server
        run: npx wait-on http://localhost:4173

      - name: Run Playwright smoke tests
        working-directory: apps/studio-client
        run: npx playwright test e2e/commandcenter.spec.ts --reporter=line
        env:
          BASE_URL: http://localhost:4173
        continue-on-error: true

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/studio-client/package-lock.json'

      - name: Install dependencies
        working-directory: apps/studio-client
        run: npm ci

      - name: TypeScript check
        working-directory: apps/studio-client
        run: npx tsc --noEmit

  quality-summary:
    name: 🎯 Quality Gates Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - bundle-check
      - hardcoded-values-check
      - accessibility-check
      - playwright-smoke
      - typescript-check

    steps:
      - name: Summary
        run: |
          echo "# Studio Client Quality Gates Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          
          if [ "${{ needs.bundle-check.result }}" == "success" ]; then
            echo "| Bundle Size | ✅ PASS |"
          else
            echo "| Bundle Size | ❌ FAIL |"
          fi
          
          if [ "${{ needs.hardcoded-values-check.result }}" == "success" ]; then
            echo "| Hardcoded Values | ✅ PASS |"
          else
            echo "| Hardcoded Values | ❌ FAIL |"
          fi
          
          if [ "${{ needs.accessibility-check.result }}" == "success" ]; then
            echo "| Accessibility | ✅ PASS |"
          else
            echo "| Accessibility | ❌ FAIL |"
          fi
          
          if [ "${{ needs.playwright-smoke.result }}" == "success" ]; then
            echo "| Smoke Tests | ✅ PASS |"
          else
            echo "| Smoke Tests | ❌ FAIL |"
          fi
          
          if [ "${{ needs.typescript-check.result }}" == "success" ]; then
            echo "| TypeScript | ✅ PASS |"
          else
            echo "| TypeScript | ❌ FAIL |"
          fi