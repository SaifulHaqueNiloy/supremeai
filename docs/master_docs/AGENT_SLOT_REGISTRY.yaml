validation_rules:
- 'slot MUST match pattern: agent-[0-9]+'
- tool MUST be a non-empty string
- maintainer MUST be a GitHub username (starts with @)
- expires_on MUST be <= 7 days from assigned_on
- Only one active assignment per slot at a time
- Active slots MUST be <= 10 (Max Concurrent Agent Policy — OPS-06 Safeguard 5)
- 'Auto-expiry: assignments past expires_on are auto-deactivated'
usage:
- Maintainer edits this file directly via PR (protected scope per SECURITY_GUARDIAN.md)
- 'PR title: ''chore(agents): assign agent-N to <tool>'''
- Previous slot holder MUST be notified via @mention in PR description
- If slot is being transferred, old assignment's expires_on MUST be set to today
