spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/supremeai}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # ✅ প্রোডাকশনে স্কিমা অটো-মডিফাই বন্ধ করার জন্য ডিফল্ট 'validate' সেট করা হলো
      # লোকাল ডেভেলপমেন্টে চাইলে SPRING_JPA_HIBERNATE_DDL_AUTO=update করে ওভাররাইড করা যাবে
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

grpc:
  server:
    port: 9090
    security:
      # ✅ প্রোডাকশনে ইন্টারনাল API সুরক্ষিত রাখতে gRPC সিকিউরিটি এনাবল করা হলো
      enabled: ${GRPC_SERVER_SECURITY_ENABLED:true}

server:
  port: 8080 # For health checks and metrics via standard HTTP
