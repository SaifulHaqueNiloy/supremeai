# =============================================================================
# SupremeAI PR Gate (Pipeline 1 of Canonical 3-Pipeline Architecture)
# =============================================================================
# Constitutional Reference: Protocol 14 & Hard Rule 6 (Rules v2.6)
# One single pipeline for PR-side validation:
#   1. resolve-context: Resolve author, slot & bot exemptions
#   2. branch-guard: Validate branch name against standard pattern
#   3. safety-gates: Lease, Scope, Verification, Sync, Guard, Predecessor, Collisions
#   4. tests: Path-filtered test runner
#   5. pr-contract: Unified PR Decision Contract (Pass / Block)
# =============================================================================

name: PR Gate (Unified Pipeline)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate"
        required: true
        type: string

concurrency:
  group: pr-gate-pipeline-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve PR Context & Exemptions
  # ---------------------------------------------------------------------------
  context:
    name: "🔍 Resolve PR Context"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      branch: ${{ steps.ctx.outputs.branch }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      skip: ${{ steps.ctx.outputs.skip }}
      reason: ${{ steps.ctx.outputs.reason }}
    steps:
      - name: Resolve PR metadata
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUM" ]]; then
            echo "pr_number=0" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no PR context" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AUTHOR="$(gh pr view "$PR_NUM" --json author -q .author.login 2>/dev/null || echo '')"
          BRANCH="$(gh pr view "$PR_NUM" --json headRefName -q .headRefName 2>/dev/null || echo '')"
          HEAD_SHA="$(gh pr view "$PR_NUM" --json headRefOid -q .headRefOid 2>/dev/null || echo '')"

          # বাংলা মন্তব্য: app/dependabot বা অন্যান্য bot ভ্যারিয়েন্টকে স্কিপ করে যাতে মিথ্যা গেট ফেইলিওর না ঘটে
          case "$AUTHOR" in
            *dependabot*|*github-actions*|*renovate*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "reason=exempt bot author: $AUTHOR" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "reason=author: ${AUTHOR:-unknown}" >> "$GITHUB_OUTPUT"
              ;;
          esac

          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUM on branch '$BRANCH' ($HEAD_SHA) — ${{ steps.ctx.outputs.reason }}"

  # ---------------------------------------------------------------------------
  # 2. Branch Naming Guard
  # ---------------------------------------------------------------------------
  branch-guard:
    name: "Branch Naming Guard"
    needs: context
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate branch name pattern
        env:
          BRANCH: ${{ needs.context.outputs.branch }}
        run: |
          set -euo pipefail
          VALID_PATTERN='^((planner|coder|pr-helper|ci|platform|browser|super)-[0-9]+(-[a-zA-Z0-9_-]+)?|agent-[a-zA-Z0-9_-]+/issue-[0-9]+-.+|agent-[0-9]+(-[a-zA-Z0-9_-]+)?|feat/.+|fix/.+|hotfix/.+|perf/.+|chore/.+|test/.+|docs/.+|refactor/.+|ci/.+|group/[a-z0-9][a-z0-9._-]*|dependabot/.+|github-actions/.+|renovate/.+|pr-helper/.+|develop|main)$'
          if [[ "$BRANCH" =~ $VALID_PATTERN ]]; then
            echo "✅ Branch '$BRANCH' matches constitutional pattern."
          else
            echo "❌ Branch '$BRANCH' does not match naming convention."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 3. Constitutional System Gates (Single Unified Runner)
  # ---------------------------------------------------------------------------
  system-gates:
    name: "🛡️ Constitutional System Gates"
    needs: [context, branch-guard]
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.context.outputs.pr_number }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Gate Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: 🛡️ Constitutional Gates Execution (All Gates)
        env:
          PYTHONPATH: .github/scripts
        run: |
          set -euo pipefail
          python -m constitution.gates all --pr "$PR_NUMBER"
          python scripts/ci/generate_agents_md.py --check

      - name: 💥 Cross-PR File Collision Check
        run: |
          if [ -f scripts/git/cross_pr_collision_detector.py ]; then
            python scripts/git/cross_pr_collision_detector.py --pr "$PR_NUMBER" --strict || echo "::warning::Collision check non-fatal advisory"
          fi

  # ---------------------------------------------------------------------------
  # 4. Path-Filtered Test Verification
  # RESTORED (#2421 seq:1, 2026-09-28): PR সরলীকরণ (#2416)-এ আসল কোড টেস্ট ও
  # ফ্রন্টএন্ড গার্ড হারিয়ে গিয়েছিল — PR-এ ভাঙা backend/frontend কোড অদেখা
  # পড়ে যেত। এখন path-filtered targeted pytest + ruff + frontend typecheck/build
  # ফিরিয়ে আনা হলো (3-Pipeline Law: এটাই PR Gate-এর একমাত্র টেস্ট স্টেশন;
  # coverage/aggregate gate ci.yml-এর dispatch-only ম্যাট্রিক্সে থেকে যাবে)।
  # ---------------------------------------------------------------------------
  tests:
    name: "🧪 Test & Build Verification"
    needs: [context, system-gates]
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest ruff pytest-asyncio anyio httpx pytest-cov

      - name: Constitution & Gates Self-Test
        run: |
          pytest .github/scripts/constitution/tests/ -q

      - name: Silent Exception Swallows Invariant Test
        run: |
          pytest -o addopts="" --confcutdir=backend/tests/core backend/tests/core/test_no_silent_exception_swallow.py -q

      # বাংলা মন্তব্য (#2421): merge-base diff থেকে সিদ্ধান্ত — backend/frontend
      # পরিবর্তন হলেই শুধু সংশ্লিষ্ট গার্ড চলবে (docs-only PR দ্রুত পাস)।
      - name: Detect changed paths (merge-base diff)
        id: paths
        run: |
          set -euo pipefail
          git fetch origin main --quiet || true
          BASE="$(git merge-base origin/main HEAD)"
          CHANGED="$(git diff --name-only "$BASE"...HEAD || git diff --name-only "$BASE")"
          backend=false; frontend=false
          if echo "$CHANGED" | grep -qE '^(backend/|tests/)'; then backend=true; fi
          if echo "$CHANGED" | grep -qE '^frontend/'; then frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "✅ changed-path verdict: backend=$backend frontend=$frontend"

      # ── আসল ব্যাকএন্ড কোড টেস্ট (targeted, coverage ছাড়া — coverage gate ci.yml-এর) ──
      - name: Setup Backend (poetry, cached)
        if: steps.paths.outputs.backend == 'true'
        uses: ./.github/actions/setup-backend

      - name: Select backend test targets (#2421)
        id: select
        if: steps.paths.outputs.backend == 'true'
        working-directory: backend
        run: python ../scripts/ci/detect_changed_tests.py --base origin/main

      - name: Real backend code tests (targeted pytest)
        if: steps.paths.outputs.backend == 'true'
        working-directory: backend
        env:
          # বাংলা মন্তব্য (#2465 gate run): backend/tests/scripts রিপো-রুটের scripts
          # প্যাকেজ ইমপোর্ট করে — PYTHONPATH-এ রিপো-রুট না থাকলে poetry venv-এর
          # site-packages-এর shadow হলে 'No module named scripts.agents' হয়।
          PYTHONPATH: ..
        run: |
          set -euo pipefail
          # বাংলা মন্তব্য: targeted=false দুই কারণে হয় — (a) backend source বদলেছে
          # → full tier (ci.yml coverage-matrix চুক্তি, PR Gate-এও চলবে), (b) কোনো
          # backend ফাইল নেই (docs/infra-only PR) → mapped টেস্টই নেই — ফাস্ট সুইট
          # যথেষ্ট, ভারী fallback এখানে অপ্রয়োজনীয় (3-Pipeline DRY)।
          if [ "${{ steps.select.outputs.test_targeted }}" != "true" ]; then
            if git diff --name-only "$(git merge-base origin/main HEAD)"...HEAD | grep -q '^backend/'; then
              echo "backend source পরিবর্তন → full critical/important tier"
            else
              echo "কোনো backend ফাইল ম্যাপ/পরিবর্তিত নয় — fast guard suites যথেষ্ট, pytest স্কিপ"
              exit 0
            fi
          fi
          # বাংলা মন্তব্য: -x = প্রথম ফেইলে থামো (দ্রুত ফিডব্যাক), --no-cov = coverage
          # মাপা হয় না (PR Gate ফাস্ট; coverage গেট ci.yml dispatch ম্যাট্রিক্সে)।
          poetry run pytest ${{ steps.select.outputs.test_targets }} \
            -m "${{ steps.select.outputs.test_markers }}" \
            -x --no-cov -q -p no:cacheprovider

      - name: Ruff lint (incremental — changed .py files)
        if: steps.paths.outputs.backend == 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/main HEAD)"
          # বাংলা মন্তব্য: incremental gate — শুধু বদলানো .py ফাইল (ডিলিট হওয়া
          # ফাইল বাদ); পুরনো ফাইলের pre-existing লিন্ট noise PR-কে মিথ্যা লাল করবে না।
          CHANGED_PY="$(git diff --name-only "$BASE"...HEAD -- '*.py' | sed 's|^backend/||' | while IFS= read -r f; do [ -f "$f" ] && echo "$f"; done || true)"
          if [ -n "$CHANGED_PY" ]; then
            echo "$CHANGED_PY" | xargs poetry run ruff check
          else
            echo "কোনো .py পরিবর্তন নেই — ruff স্কিপ"
          fi

      # ── ফ্রন্টএন্ড সেফটি গার্ড (typecheck + build) ──
      - name: Setup Frontend Environment
        if: steps.paths.outputs.frontend == 'true'
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "24"
          working-directory: ./frontend
          install-deps: "true"

      - name: Frontend typecheck (tsc)
        if: steps.paths.outputs.frontend == 'true'
        working-directory: ./frontend
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

      - name: Frontend build guard (vite)
        if: steps.paths.outputs.frontend == 'true'
        working-directory: ./frontend
        env:
          NODE_ENV: production
          # বাংলা মন্তব্য: PR Gate-এ secrets হার্ড-ডিপেন্ডেন্সি নয় — build সাফল্যই মূল;
          # প্রোডাকশন URL চুক্তি verify_frontend_build_contract.py প্রোডাকশন পাইপলাইনে যায়।
          VITE_API_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
        run: pnpm run build

      - name: Verify frontend build output
        if: steps.paths.outputs.frontend == 'true'
        run: |
          test -d frontend/dist || { echo "::error::frontend/dist নেই — build ব্যর্থ"; exit 1; }
          du -sh frontend/dist

  # ---------------------------------------------------------------------------
  # 5. Unified PR Decision Contract
  # ---------------------------------------------------------------------------
  contract:
    name: "🚦 Unified PR Gate (Security, Scope & Policy Orchestrator)"
    needs: [context, system-gates, tests]
    if: always() && needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Synthesize PR Gate Outcome
        env:
          GATES_RESULT: ${{ needs.system-gates.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "System Gates Result: $GATES_RESULT"
          echo "Tests Result: $TESTS_RESULT"
          if [[ "$GATES_RESULT" == "success" && "$TESTS_RESULT" == "success" ]]; then
            echo "✅ PR Gate Decision: PASS — all constitutional gates & tests green."
          else
            echo "❌ PR Gate Decision: BLOCK — one or more gates/tests failed."
            exit 1
          fi
