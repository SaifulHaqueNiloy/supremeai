name: supremeai_mobile
description: A new Flutter project for SupremeAI Mobile App.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.0.5
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # বাংলা মন্তব্য: অ্যাপে ব্যবহৃত i18n লোনালাইজেশন ফাইলগুলো বান্ডিল করার জন্য assets-এ যুক্ত করা হলো।
  # Added all required asset directories to prevent build failures
  assets:
    - assets/i18n/
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/icon/
    - assets/fonts/

  # fonts:
  #   - family: Inter
