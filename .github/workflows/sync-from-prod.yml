name: 🔄 Sync from Production

on:
  workflow_dispatch:
  # main-repo/.github/workflows/notify-staging.yml admin push হলে এই event পাঠায়
  repository_dispatch:
    types: [production-changed]

jobs:
  sync-code:
    name: ↔️ Sync Code from Production
    runs-on: ubuntu-latest
    # Condition to avoid infinite loops: only run if the commit is not from the bot
    # (head_commit only exists on push events; guard with fromJSON fallback for dispatch events)
    if: "!contains(github.event.head_commit.message || '', '[CI-SYNC]')"

    steps:
      - name: Resolve target branch
        id: resolve
        run: |
          # repository_dispatch payload থেকে ref আসে (main repo যে branch-এ push হয়েছিল),
          # workflow_dispatch হলে যে branch থেকে manually ট্রিগার করা হয়েছে সেটাই ব্যবহার হয়
          REF="${{ github.event.client_payload.ref }}"
          if [ -z "$REF" ]; then REF="${{ github.ref_name }}"; fi
          echo "branch=$REF" >> "$GITHUB_OUTPUT"

      - name: checkout staging repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'SupremeAI Sync Bot'
          git config --global user.email 'sync-bot@supremeai.dev'

      - name: Add production repo as remote
        run: |
          git remote add production https://x-access-token:${{ secrets.MAIN_REPO_TOKEN }}@github.com/paykaribazaronline/supremeai.git

      - name: Fetch and merge from production
        run: |
          BRANCH="${{ steps.resolve.outputs.branch }}"
          git fetch production "$BRANCH"
          # Use a merge strategy that prefers production changes in case of conflict
          git merge --strategy-option theirs "production/$BRANCH" -m "Merge remote-tracking branch 'production/$BRANCH' [CI-SYNC]"

      - name: Push changes to staging
        run: git push origin "${{ steps.resolve.outputs.branch }}"
