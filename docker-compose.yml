version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    profiles:
      - default
      - full

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - local
      - full

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=supremeai
    ports:
      - "5432:5432"
    profiles:
      - local
      - full
