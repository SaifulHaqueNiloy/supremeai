# Issue management helper for the SupremeAI issue agent.
# The main PAT has contents/pull_requests write but no issues:write, so
# issue labels / comments / closes are routed through this workflow, which
# runs with the Actions GITHUB_TOKEN (issues: write).
# Dispatch-only (no scheduled/auto triggers) and auditable via Actions history.

name: Issue Agent Helper

on:
  pull_request:
    types: [opened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to act on"
        required: true
        type: string
      action:
        description: "One of: label | comment | close | reopen"
        required: true
        type: string
      value:
        description: "Labels (comma-separated) for label action, or comment body for comment/close"
        required: false
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read

# Concurrency scoped to issue or PR number to prevent race conditions
concurrency:
  group: issue-labeler-${{ github.event.inputs.issue_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply issue action
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          ACTION: ${{ github.event.inputs.action }}
          VALUE: ${{ github.event.inputs.value }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventName = process.env.EVENT_NAME;

            // Helper: extract issue numbers from text like "Fixes #123", "Closes #45", "#789"
            function extractIssueNumbers(text) {
              if (!text) return [];
              const regex = /(?:close[sd]?|fixe?[sd]?|resolve[sd]?|issue)?\s*#(\d+)/gi;
              const matches = [];
              let match;
              while ((match = regex.exec(text)) !== null) {
                const id = parseInt(match[1], 10);
                if (!matches.includes(id)) matches.push(id);
              }
              return matches;
            }

            // --- 1. Automated PR Events ---
            if (eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const prAction = context.payload.action;
              const prNumber = pr.number;
              const prTitle = pr.title || '';
              const prBody = pr.body || '';
              const combinedText = `${prTitle} ${prBody}`;
              const linkedIssues = extractIssueNumbers(combinedText);

              if (linkedIssues.length === 0) {
                console.log(`No linked issue numbers found in PR #${prNumber}`);
                return;
              }

              console.log(`Found linked issues: ${linkedIssues.join(', ')} for PR #${prNumber}`);

              if (prAction === 'opened') {
                for (const issueNum of linkedIssues) {
                  try {
                    // Add in-progress label to claimed issue
                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: issueNum,
                      labels: ['in-progress']
                    });
                    // Post reference comment
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issueNum,
                      body: `🤖 **SupremeAI Agent Helper:** Claimed by PR #${prNumber} (\`${pr.head.ref}\`). Status: \`in-progress\`.`
                    });
                    console.log(`Successfully linked and labeled issue #${issueNum}`);
                  } catch (err) {
                    console.warn(`Could not update issue #${issueNum}: ${err.message}`);
                  }
                }
              } else if (prAction === 'closed' && pr.merged) {
                for (const issueNum of linkedIssues) {
                  try {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issueNum,
                      body: `✅ **SupremeAI Agent Helper:** Resolved and closed automatically via merged PR #${prNumber}.`
                    });
                    await github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: issueNum,
                      state: 'closed',
                      state_reason: 'completed'
                    });
                    console.log(`Successfully closed issue #${issueNum}`);
                  } catch (err) {
                    console.warn(`Could not close issue #${issueNum}: ${err.message}`);
                  }
                }
              }
              return;
            }

            // --- 2. Manual workflow_dispatch Events ---
            const num = parseInt(process.env.ISSUE_NUMBER, 10);
            const action = process.env.ACTION;
            const value = process.env.VALUE || '';
            if (!Number.isInteger(num) || num <= 0) {
              core.setFailed(`Invalid issue_number: ${process.env.ISSUE_NUMBER}`);
              return;
            }

            switch (action) {
              case 'label': {
                const labels = value.split(',').map(s => s.trim()).filter(Boolean);
                if (labels.length === 0) { core.setFailed('No labels provided'); return; }
                await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels });
                break;
              }
              case 'comment': {
                if (!value) { core.setFailed('Empty comment'); return; }
                await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                break;
              }
              case 'close': {
                if (value) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                }
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: 'completed' });
                break;
              }
              case 'reopen': {
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'open', state_reason: 'reopened' });
                break;
              }
              default:
                core.setFailed(`Unknown action: ${action}`);
            }
