# বাংলা মন্তব্য: torch/sentence-transformers আগে মূল [tool.poetry.dependencies]-এ ছিল,
# ফলে CI-এর backend-core জব `poetry install --with dev` চালালেই torch-এর সাথে
# nvidia-nccl-cu12 *এবং* cu13 দুটো ভিন্ন CUDA স্ট্যাক ডাউনলোড হয়ে যেত -- CPU-only
# GitHub-hosted রানারে সম্পূর্ণ অপ্রয়োজনীয়, এবং এটাই ডিস্ক ফুরিয়ে দিয়ে
# `poetry install`/audit-sandbox ফেইল করাচ্ছিল (Zero-Operating-Cost নীতির বিপরীত)।
# grep দিয়ে যাচাই করা হয়েছে: torch-নির্ভর evolution/* মডিউলগুলো কোথাও import করা হয় না
# (dead/scaffold code, memory-note অনুযায়ী), আর sentence-transformers-এর ৪টা caller
# (experience_db.py, memory_service.py, knowledge_extractor.py, error_remediation.py)
# আগে থেকেই try/except ImportError দিয়ে গ্রেসফুলি ফলব্যাক করে -- তাই এই গ্রুপ বাদ
# দিলে backend-core-এর কোনো টেস্ট ভাঙে না।
# পরবর্তী ধাপ (এই sandbox-এ download.pytorch.org অ্যাক্সেস না থাকায় এখানে verify করা
# যায়নি বলে এখনই যোগ করা হয়নি): কেউ সত্যিকার এই গ্রুপ ইনস্টল করলে যেন GPU wheel না
# নামে, তার জন্য torch-কে explicit `https://download.pytorch.org/whl/cpu` source-এ
# পিন করে `poetry lock` রিজেনারেট করা।
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = "^2.5.0"
sentence-transformers = "^3.3.0"

[tool.poetry.group.dev.dependencies]
# বাংলা মন্তব্য: pre-commit ও CI শুধুমাত্র ruff (linter + formatter) এবং mypy চালায় --
# black/isort এখানে ছিল কিন্তু কোথাও invoke হতো না (dead dev dependency), সরানো হলো।
ruff = "^0.4.8"
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.3.0"
pytest-xdist = "^3.6.1"
respx = "^0.21.1"
pytest-md = "^0.2.0"
typeguard = "^4.2"
playwright = "^1.49.0"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
# বাংলা: core/ ফোল্ডারেই coverage মাপা হয় — CI এর সাথে consistent।
# পুরো backend/ স্ক্যান করলে pytest অনেক ধীর হয়ে যায়।
source = ["core"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    ".venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
# বাংলা মন্তব্ব্য: টেস্ট কভারেজ থ্রেশহোল্ড 75% এ বাড়ানো হয়েছে সিকিউরিটি এবং কোয়ালিটি বাড়াতে
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib --cov=core --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=75"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests"
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = [
    "pydantic.mypy"
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

# বাংলা মন্তব্য: pylint এর disable তালিকা আগে 80+ রুল ছিল (অনেক W07xx ডুপ্লিকেট),
# এখন শুধু প্রয়োজনীয় রুলগুলো রাখা হয়েছে — বাকি সব সরানো হয়েছে
[tool.pylint]
max-line-length = 120
disable = [
    "C0301",  # Line too long
    "W0613",  # Unused argument
    "R0903",  # Too few public methods
    "R0902",  # Too many instance attributes
    "R0913",  # Too many arguments
    "C0415",  # Import outside toplevel
    "W0212",  # Access to protected member
    "W0622",  # Redefining built-in
    "R0914",  # Too many local variables
    "R0801",  # Similar lines in files
    "C0103",  # Invalid variable name
    "W0703",  # Catching too general exception
    "R0912",  # Too many branches
    "R0915",  # Too many statements
    "R0911",  # Too many return statements
    "R1702",  # Too many nested blocks
    "W0621",  # Redefining name from outer scope
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "W0237",  # Arguments renamed in subclass
    "W0221",  # Arguments differ from overridden method
    "W0236",  # Removed incompatibility
    "R1705",  # Unnecessary "else" after "return"
    "C0209",  # Formatting with % or .format
    "W0102",  # Dangerous default value arg
    "W0107",  # Unnecessary pass
    "C0411",  # Wrong import order
    "W0612",  # Unused variable
    "R1725",  # super() call style
    "W0404",  # Reimported
    "R0205",  # Class inherits from object
    "C0104",  # Disallowed name
    "W0707",  # Re-raising via 'raise ... from ...'
    "R1710",  # Inconsistent return
    "R1711",  # Useless return
    "C2801",  # Unnecessary dunder call
    "R0402",  # from import recommended
    "C0303",  # Trailing whitespace
    "C0304",  # Final newline
    "C0413",  # Wrong import position
    "R0916",  # Too many boolean exprs
    "W0631",  # Undefined loop variable
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "UP",    # pyupgrade
]
ignore = [
    "E501",     # Line too long
    "E402",     # Module level import not at top of file
    "BLE001",   # Blind exception catch
    "RUF012",   # ClassVar mutable attribute
    "RUF001",   # Ambiguous unicode strings
    "RUF002",   # Ambiguous unicode docstrings
    "RUF003",   # Ambiguous unicode comments
    "TRY002",   # Create own exception
    "TRY004",   # Prefer TypeError
    "DTZ005",   # Datetime tz
    "B008",     # Default args call
    "I001",     # Unsorted imports
]
