# SupremeAI CI/CD Pipeline — Hardened with SHA Pinning
# 🔒 v4.0: All actions pinned to full SHA (Supply Chain Security)
# 📊 Code coverage gates enabled (fail-under thresholds)

name: CI Pipeline

concurrency:
  group: supremeai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'Force Backend Run/Deploy'
        type: boolean
        default: false
      force_frontend:
        description: 'Force Frontend Run/Deploy'
        type: boolean
        default: false
      force_infra:
        description: 'Force Edge/Infra Run/Deploy'
        type: boolean
        default: false
      run_backend_overall:
        description: 'Run full backend test suite'
        type: boolean
        default: false

# বাংলা মন্তব্য (#6 fix): কোনো top-level permissions: না থাকলে GITHUB_TOKEN
# রিপো/অর্গ ডিফল্ট অনুযায়ী পারমিশন পায় -- fork থেকে আসা PR-এও এটা প্রযোজ্য,
# যা least-privilege নীতির বিরুদ্ধে। এখন ডিফল্ট শুধু read-only; যেসব job-এর
# বাড়তি দরকার (deploy-backend-ghcr: packages:write, smart-summary:
# pull-requests:write) তারা নিজেদের job-level permissions: ব্লকে সেটা
# ওভাররাইড করে -- এই top-level ব্লক তাদের ভাঙে না।
permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  # Coverage thresholds — fail build if below these values
  MIN_BACKEND_COVERAGE: 35
  MIN_FRONTEND_COVERAGE: 9

jobs:
  # -----------------------------------------------------------------
  # Job 0: Path Filtering (Optimization)
  # -----------------------------------------------------------------
  changes:
    name: 🚦 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event.inputs.force_backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_frontend == 'true' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event.inputs.force_infra == 'true' }}
      scraper: ${{ steps.filter.outputs.scraper == 'true' || github.event.inputs.force_backend == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-backend/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infrastructure/**'
              - '.github/workflows/ci.yml'
            scraper:
              - 'backend/services/scraper/**'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - '.github/workflows/ci.yml'
  # -----------------------------------------------------------------
  # Job 1: Security Scan (Dependency Audit + Secret Detection)
  # -----------------------------------------------------------------
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          # বাংলা মন্তব্য (ROOT-CAUSE FIX): `github.event.before` শুধু `push` ইভেন্টে
          # পাওয়া যায় -- `pull_request` ইভেন্টে এটা খালি থাকে, ফলে trufflehog
          # BASE খালি পেয়ে পুরো git history স্ক্যান করত (এবং আগে rotate করা,
          # এখন dead credential-গুলোর কারণে বারবার fail দেখাত)। এখন event type
          # অনুযায়ী সঠিক base SHA বেছে নেওয়া হচ্ছে, যাতে প্রতিটা run শুধু নতুন
          # commit-গুলোই স্ক্যান করে -- future leak এখনো ধরা পড়বে, পুরনো
          # rotated secret বারবার flag হবে না।
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'HEAD~1' || github.event.before) }}
          head: HEAD
          extra_args: "--only-verified"

  # -----------------------------------------------------------------
  # Job 1.5: Advanced Pre-Merge Checks (Fast Fail)
  # -----------------------------------------------------------------
  advanced-checks:
    name: 🛡️ Advanced Pre-Merge Checks
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Verify Core GitHub Secrets
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/ci/check_required_secrets.py pre_check

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astroid loguru requests httpx pyyaml
          
      - name: API Contract Diff Checker
        run: python scripts/advanced_analysis/api_contract_diff.py --fail-on-critical
        
      - name: DB Model Drift Checker
        run: python scripts/advanced_analysis/db_model_drift_checker.py --fail-on-critical
        
      - name: Migration Safety Diff
        run: python scripts/advanced_analysis/migration_safety_diff.py --fail-on-critical

      - name: Duplicate Logic Detector
        run: python scripts/advanced_analysis/duplicate_detector.py --fail-on-critical --max-findings 50 --engine file_level import

      - name: Environment Variable Reconciler
        run: python scripts/advanced_analysis/env_var_reconciler.py --fail-on-critical
        
      - name: Hardcode Configuration Scanner
        run: python scripts/advanced_analysis/hardcode_config_scanner.py
        
      - name: Secrets Vault Validation (Drift Check)
        run: python scripts/audit_env_usage.py --env .env.example
        
      - name: Frontend Secret Leakage Scan
        run: python scripts/ci/check_frontend_secrets.py

      - name: Install Vulnerability Scanner Deps
        run: pip install pip-audit bandit[sarif] httpx loguru pydantic

      - name: Auto Vulnerability Scanner
        run: python scripts/security/auto_vulnerability_scanner.py --scan-deps --scan-code --generate-sbom
        
      - name: Mutation Testing
        run: python scripts/testing/mutation_testing.py --target backend/core/health_check.py --threshold 0
      
      - name: Performance Benchmark
        run: python scripts/testing/performance_benchmark.py --target api

      - name: Project Health Check
        run: python scripts/ci/project_health_check.py
        
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Audit Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint curl
          python -m pip install poetry
          npm install -g pnpm
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /tmp
          sudo mv /tmp/trufflehog /usr/local/bin/
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run SupremeAI full CI audit
        shell: bash
        env:
          SUPREMEAI_JWT_SECRET: "dummy-secret-32-chars-long-123456"
          SUPABASE_DATABASE_URL_WRITER: "postgresql://dummy:pass@localhost:5432/db"
          SUPABASE_URL: "https://dummy.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
          REDIS_URL: "redis://localhost:6379/0"
          SUPREMEAI_BASE_URL: ${{ secrets.SUPREMEAI_BASE_URL }}
        run: |
          chmod +x scripts/ci-full-audit.sh
          ./scripts/ci-full-audit.sh

      - name: Upload CI audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supremeai-ci-audit-reports
          path: ci-reports/
          
      - name: Generate Smart Audit Summary
        if: always()
        run: python scripts/ci/generate_audit_summary.py
        
      - name: Security Pattern Validator
        # বাংলা: scripts/advanced_analysis/security_pattern_validator.py repo-তে
        # কখনোই তৈরি হয়নি -- এই স্টেপ CI-তে প্রতিবার "file not found" দিয়ে fail
        # করত। scripts/quality/regression_scanner.py ইতিমধ্যে একই ধরনের security
        # pattern চেক করে (auth-fallback-bypass, ssl-verify-bypass,
        # hardcoded-secret, cors-wildcard) এবং প্রতি push/PR-এ regression-scan.yml
        # দিয়ে আলাদাভাবে চলে -- তাই এখানে ডুপ্লিকেট না করে সরাসরি সেটাই কল করা হচ্ছে।
        run: |
          python scripts/quality/regression_scanner.py \
            --path backend \
            --json regression_report.json \
            --fail-on critical,high

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-report
          path: regression_report.json
          retention-days: 30

  # -----------------------------------------------------------------
  # Job 1.6: Configuration Control
  # -----------------------------------------------------------------
  registry:
    name: Canonical Configuration Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate registry structure
        run: python scripts/ci/validate_config_registry.py

      - name: Validate runtime-to-registry contract
        run: python scripts/ci/check_config_contract.py

      - name: Validate deployment hardcode policy
        run: python scripts/ci/check_hardcoded_deployment_config.py

  # -----------------------------------------------------------------
  # Job 2: Backend Tests (pytest + coverage gate)
  # -----------------------------------------------------------------
  backend-tests:
    name: 🐍 Backend Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"

      - name: Run linting
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/supremeai_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars-padding-for-length
          SUPREMEAI_JWT_SECRET: test-supremeai-jwt-secret-key-for-ci-minimum-64-chars-padding-1234
          ALLOW_TEST_AUTH_BYPASS: "true"
          USER_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
          ADMIN_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
          MARKERS: ${{ (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true') && 'not requires_network and not e2e and not chaos' || '(critical or important) and not requires_network and not e2e and not chaos' }}
        run: |
          poetry run pytest tests/ \
            --cov=core --cov=api --cov=services --cov=tools \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "$MARKERS" \
            -v --tb=short --timeout=30 --timeout-method=thread

      - name: Validate OpenAPI Schema
        run: |
          PYTHONPATH="." poetry run python scripts/validate_openapi.py

      - name: Quality Gate Multi-Layer Coverage
        env:
          TIERS: ${{ (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true') && 'overall,critical,important' || 'critical,important' }}
        run: |
          pip install pyyaml loguru
          python ../scripts/ci/coverage_quality_gate.py coverage.json ../scripts/ci/coverage_policy.yaml --tiers "$TIERS"

      - name: Import secrets from Infisical (Staging)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "staging"
          secret-path: "/"
          export-type: "env"

      - name: Verify Canonical Startup Command (AUD-1.1)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/supremeai_test
          SUPABASE_DATABASE_URL_POOLER: postgresql://test_user:test_password@localhost:5432/supremeai_test
          SUPABASE_URL: "https://mock-supabase.co"
          SUPABASE_KEY: "mock-supabase-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-supabase-service-role-key"
          OPENAI_API_KEY: "sk-mock-openai-api-key"
          ENV: test
          BACKEND_URL: ${{ env.BACKEND_URL || secrets.BACKEND_URL || 'https://supremeai-backend.onrender.com' }}
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars-padding-for-length
          SUPREMEAI_JWT_SECRET: test-supremeai-jwt-secret-key-for-ci-minimum-64-chars-padding-1234
        run: |
          echo "Starting the canonical entrypoint in test environment..."
          poetry run python main.py &
          SERVER_PID=$!
          
          echo "Waiting 10 seconds for initialization..."
          sleep 10
          
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ Server crashed during startup!"
            exit 1
          fi
          echo "✅ Server process is running."

          BASE="http://127.0.0.1:${PORT:-8080}"
          echo "Probing ${BASE}/api/v1/health/live ..."
          HEALTH_OK=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BASE}/api/v1/health/live" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ /api/v1/health/live returned 200 (attempt $i)"
              HEALTH_OK=1
              break
            fi
            echo "attempt $i: HTTP ${HTTP_CODE}; retrying in 2s..."
            sleep 2
          done

          if [ "$HEALTH_OK" != "1" ]; then
            echo "❌ /api/v1/health/live did not return 200 within 60s — startup verification FAILED"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Probing ${BASE}/api/v1/health/ready ..."
          READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BASE}/api/v1/health/ready" || echo "000")
          if [ "$READY_CODE" != "200" ]; then
            echo "⚠️ /api/v1/health/ready returned HTTP ${READY_CODE} (service dependencies not fully warm, non-blocking in CI test mode)"
          else
            echo "✅ /api/v1/health/ready returned 200"
          fi

          kill $SERVER_PID 2>/dev/null || true
          echo "✅ Canonical startup + health endpoint verification PASSED"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # -----------------------------------------------------------------
  # Job 2.5: Integration Tests
  # -----------------------------------------------------------------
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' && (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true') }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: supremeai_test
          POSTGRES_PASSWORD: supremeai_test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supremeai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://supremeai_test:supremeai_test_password@localhost:5432/supremeai_test
      REDIS_URL: redis://localhost:6379/0
      TESTING: "true"
      INTEGRATION_TEST: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"

      - name: Run integration tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/integration/ \
            -v \
            --tb=long \
            -m integration \
            --html=integration-test-report.html

      - name: Upload integration test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: backend/integration-test-report.html

  # -----------------------------------------------------------------
  # Job 3: Frontend Tests (vitest + coverage gate)
  # -----------------------------------------------------------------
  frontend-tests:
    name: ⚛️ Frontend Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Single-frontend gates (A/D) — portal-split regression check
        run: python3 ../scripts/ci/check_single_frontend.py

      - name: Type check
        run: pnpm exec tsc --noEmit --strict

      - name: Lint check
        run: pnpm exec eslint src/ --ext .ts,.tsx --max-warnings=200

      - name: Run unit tests with coverage
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.thresholds.lines=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.functions=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.branches=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.statements=${{ env.MIN_FRONTEND_COVERAGE }} \
            --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      # -----------------------------------------------------------------
      # Dead Code Detection (Knip)
      # -----------------------------------------------------------------
      - name: Check for dead code/files
        run: |
          pnpm exec knip --debug

  # -----------------------------------------------------------------
  # Job 4: Build Verification
  # -----------------------------------------------------------------
  build:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: "Build frontend (unified SupremeAI Studio: User + Admin)"
        working-directory: ./frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || env.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || env.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          
      # single-frontend migration: ONE unified build artifact (User + Admin in one bundle)
      - name: Verify build output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "::error::Build output directory (frontend/dist) missing!"
            exit 1
          fi
          echo "Build size:"
          du -sh frontend/dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/

  # -----------------------------------------------------------------
  # Deploy to Firebase (Frontend)
  # -----------------------------------------------------------------
  deploy-frontend:
    name: 🚀 Deploy Frontend
    needs: [build, frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://supremeai-a.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # single-frontend migration: one unified artifact
      - name: Download Frontend Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Debug backend URL secrets (masked)
        run: |
          echo "BACKEND_URL set via secrets: ${{ secrets.BACKEND_URL != '' }}"
          echo "BACKEND_URL set via vars:    ${{ vars.BACKEND_URL != '' }}"
          echo "USER_BACKEND_URL fallback set: ${{ secrets.USER_BACKEND_URL != '' || vars.USER_BACKEND_URL != '' }}"
          echo "environment: production (this job's secrets/vars must be added under Settings > Environments > production, or as repository-level secrets/vars)"

      - name: Generate firebase.json from template
        run: python3 scripts/deploy/generate_firebase_config.py
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@5b73b1274a2229c7598af09e6e95addfb75f897b # master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      # SECURITY/PRIVACY NOTICE: Do not remove this summary step!
      # These URLs are critical for debugging deployment targets and identifying 
      # configuration errors (e.g. wrong environment/project). Printing public URLs
      # is NOT a privacy issue.
      - name: Add Frontend URL to Summary
        run: |
          echo "### 🌐 Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "URL 1: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app" >> $GITHUB_STEP_SUMMARY
          echo "URL 2: https://${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com" >> $GITHUB_STEP_SUMMARY
  # -----------------------------------------------------------------
  # Publish Images to GHCR
  # -----------------------------------------------------------------
  publish-core-image:
    name: 🚀 Publish Core Image
    needs: [changes, backend-tests, integration-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless signing
    outputs:
      core-digest: ${{ steps.core-digest.outputs.digest }}
      core-tags: ${{ steps.core-digest.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-core
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long,prefix=

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=supremeai-core
          cache-to: type=gha,mode=max,scope=supremeai-core

      - name: Expose Core digest for worker alias job
        id: core-digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ steps.meta.outputs.tags }}" | tr '\n' ' ' >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=""
          for tag in $TAGS; do
            images="$images $tag@$DIGEST"
          done
          cosign sign --yes $images

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.16.0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  publish-scraper-image:
    name: 🚀 Publish Scraper Image
    needs: [changes, backend-tests, integration-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.scraper == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-scraper
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long,prefix=

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/services/scraper/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=supremeai-scraper
          cache-to: type=gha,mode=max,scope=supremeai-scraper

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=""
          for tag in $TAGS; do
            images="$images $tag@$DIGEST"
          done
          cosign sign --yes $images

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.16.0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  publish-worker-alias:
    name: 🚀 Publish Worker Image (alias of Core)
    needs: [publish-core-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Worker metadata (same version scheme as Core)
        id: meta-worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-worker
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long,prefix=

      - name: Copy Core digest into supremeai-worker repo (no rebuild)
        env:
          CORE_DIGEST: ${{ needs.publish-core-image.outputs.core-digest }}
          CORE_TAGS: ${{ needs.publish-core-image.outputs.core-tags }}
          WORKER_TAGS: ${{ steps.meta-worker.outputs.tags }}
        run: |
          core_ref=""
          for t in ${CORE_TAGS}; do core_ref="${t}@${CORE_DIGEST}"; break; done
          if [ -z "$core_ref" ]; then
            echo "::error::Could not resolve Core image reference to alias for Worker"
            exit 1
          fi
          args=()
          for t in ${WORKER_TAGS}; do args+=(--tag "$t"); done
          docker buildx imagetools create "${args[@]}" "$core_ref"

  # -----------------------------------------------------------------
  # 🛡️ Render Build Budget Guard (Zero-Cost 450m Cap Enforcement)
  # -----------------------------------------------------------------
  render-budget-guard:
    name: 🛡️ Render Build Budget Guard
    needs: [publish-core-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Enforce 450m Cap Across 4 Render Nodes
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_API_KEY_1: ${{ env.RENDER_API_KEY_1 || secrets.RENDER_API_KEY_1 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ env.RENDER_API_KEY_2 || secrets.RENDER_API_KEY_2 || env.RENDER_API_KEY_BACKUP || secrets.RENDER_API_KEY_BACKUP }}
          RENDER_API_KEY_3: ${{ env.RENDER_API_KEY_3 || secrets.RENDER_API_KEY_3 || env.RENDER_BACKUP_API_KEY_2 || secrets.RENDER_BACKUP_API_KEY_2 }}
          RENDER_API_KEY_4: ${{ env.RENDER_API_KEY_4 || secrets.RENDER_API_KEY_4 }}
          RENDER_PRIMARY_SVC_ID: ${{ env.RENDER_PRIMARY_SVC_ID || secrets.RENDER_PRIMARY_SVC_ID }}
          RENDER_WORKER_SVC_ID: ${{ env.RENDER_WORKER_SVC_ID || secrets.RENDER_WORKER_SVC_ID }}
          RENDER_SCRAPER_SVC_ID: ${{ env.RENDER_SCRAPER_SVC_ID || secrets.RENDER_SCRAPER_SVC_ID }}
          RENDER_MCP_SVC_ID: ${{ env.RENDER_MCP_SVC_ID || secrets.RENDER_MCP_SVC_ID }}
        run: python scripts/ci/render_build_budget_guard.py

  # -----------------------------------------------------------------
  # Deploy Core to Render
  # -----------------------------------------------------------------
  deploy-core:
    name: 🚀 Deploy Core
    needs: [publish-core-image, render-budget-guard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Trigger Render Deploy (Core)
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ env.RENDER_PRIMARY_SVC_ID || secrets.RENDER_PRIMARY_SVC_ID }}
        run: python scripts/ci/render_trigger_deploy.py

  # -----------------------------------------------------------------
  # Deploy Worker to Render
  # -----------------------------------------------------------------
  deploy-worker:
    name: 🚀 Deploy Worker
    needs: [publish-core-image, publish-worker-alias, render-budget-guard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Trigger Render Deploy (Worker)
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY_2 || secrets.RENDER_API_KEY_2 || env.RENDER_API_KEY_BACKUP || secrets.RENDER_API_KEY_BACKUP || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ env.RENDER_WORKER_SVC_ID || secrets.RENDER_WORKER_SVC_ID || env.RENDER_BACKUP_SVC_ID || secrets.RENDER_BACKUP_SVC_ID }}
        run: python scripts/ci/render_trigger_deploy.py

  # -----------------------------------------------------------------
  # Deploy Scraper to Render
  # -----------------------------------------------------------------
  deploy-scraper:
    name: 🚀 Deploy Scraper
    needs: [changes, publish-scraper-image, render-budget-guard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.scraper == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Trigger Render Deploy (Scraper)
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY_3 || secrets.RENDER_API_KEY_3 || env.RENDER_BACKUP_API_KEY_2 || secrets.RENDER_BACKUP_API_KEY_2 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ env.RENDER_SCRAPER_SVC_ID || secrets.RENDER_SCRAPER_SVC_ID }}
        run: python scripts/ci/render_trigger_deploy.py

  # -----------------------------------------------------------------
  # Deploy MCP Control Tower to Render
  # -----------------------------------------------------------------
  deploy-mcp:
    name: 🚀 Deploy MCP Control Tower
    needs: [changes, build-mcp, render-budget-guard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Trigger Render Deploy (MCP Control Tower)
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY_4 || secrets.RENDER_API_KEY_4 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ env.RENDER_MCP_SVC_ID || secrets.RENDER_MCP_SVC_ID }}
        run: python scripts/ci/render_trigger_deploy.py

  # -----------------------------------------------------------------
  # 🗄️ Post-deploy: Database Schema Contract Check
  # বাংলা: main-এ deploy হওয়ার পর সরাসরি real production DB (read-only)
  # চেক করে backend/database/contracts/schema_contract.yaml-এর সাথে মিলায়।
  # কোনো required table/column/index মিসিং পেলে এই job ❌ FAIL করবে,
  # ফলে pipeline থেকেই সাথে সাথে বোঝা যাবে DB-তে কোনো সমস্যা আছে কিনা —
  # deploy-এর পরে আলাদা করে manual audit চালানো লাগবে না।
  # -----------------------------------------------------------------
  db-schema-check:
    name: 🗄️ DB Schema Contract Check
    needs: [deploy-core]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install checker dependencies
        run: pip install --no-cache-dir --disable-pip-version-check psycopg2-binary pyyaml

      - name: Check live production database against schema contract
        env:
          DB_SCHEMA_CHECK_URL: ${{ secrets.DB_SCHEMA_CHECK_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL_POOLER || secrets.DATABASE_URL }}
        run: python scripts/ci/check_database_schema.py

      - name: Surface failure clearly
        if: failure()
        run: echo "::error::Production database does not match schema_contract.yaml — see step summary for exact diff. Fix via an Alembic migration, then update the contract file."

  # -----------------------------------------------------------------
  # Deploy Cloudflare Worker (supremeai-edge)
  # -----------------------------------------------------------------
  deploy-cloudflare-worker:
    name: ⚡ Deploy Cloudflare Worker
    needs: [changes, advanced-checks]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install -g wrangler

      # বাংলা: এখানেও Infisical vault থেকে Cloudflare secrets টেনে আনা হচ্ছে।
      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Verify Cloudflare Secrets Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/ci/check_required_secrets.py post_check_cloudflare

      - name: Deploy Worker
        working-directory: infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping Cloudflare Worker deploy - CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not set"
            exit 0
          fi
          
          if [ -f "package.json" ]; then
            echo "Found package.json, installing dependencies..."
            npm install
          fi
          
          # Deploy and capture output to parse the URL
          wrangler deploy > wrangler_output.txt 2>&1
          cat wrangler_output.txt
          
          # SECURITY/PRIVACY NOTICE: Do not remove this worker URL logging! 
          # It dynamically parses the deployment URL for debugging purposes.
          CF_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler_output.txt | head -n 1 || echo "Unknown URL")
          echo "### ⚡ Cloudflare Worker Deployed" >> $GITHUB_STEP_SUMMARY
          if [ "$CF_URL" != "Unknown URL" ]; then
            echo "Worker URL: [$CF_URL]($CF_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Worker deployed, check logs for exact URL." >> $GITHUB_STEP_SUMMARY
          fi

  # -----------------------------------------------------------------
  # Notify on failure
  # -----------------------------------------------------------------
  notify-failure:
    name: 🚨 Notify on Failure
    needs: [deploy-frontend, deploy-core, deploy-worker, deploy-scraper, deploy-mcp, deploy-cloudflare-worker]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Check Slack webhook configured
        id: slack_check
        run: |
          if [ -z "${{ env.SLACK_WEBHOOK_URL }}${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Slack notification - SLACK_WEBHOOK_URL not set (checked Infisical and GitHub Secrets)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: steps.slack_check.outputs.configured == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v1.25.0
        continue-on-error: true
        with:
          payload: |
            {
              "text": "🚨 Deployment Failed",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Deployment Failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

  # -----------------------------------------------------------------
  # Smart Pipeline Summary
  # -----------------------------------------------------------------
  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security
      - changes
      - registry
      - advanced-checks
      - backend-tests
      - integration-test
      - frontend-tests
      - build
      - deploy-frontend
      - publish-core-image
      - publish-scraper-image
      - publish-worker-alias
      - render-budget-guard
      - deploy-core
      - deploy-worker
      - deploy-scraper
      - deploy-mcp
      - deploy-cloudflare-worker
      - notify-failure
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧠 Generate Enhanced Pipeline Summary (v2)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python ../.github/scripts/ci_summary_v2.py --repo ${{ github.repository }} --run-id ${{ github.run_id }} --token ${{ secrets.GITHUB_TOKEN }}

      # Surface the detailed Advanced Pre-Merge audit in the SAME final
      # GitHub Step Summary. The advanced-checks job already uploads
      # `supremeai-ci-audit-reports`; this downloads that artifact and
      # renders the useful findings here instead of hiding them in logs.
      - name: 🛡️ Surface Advanced Pre-Merge Audit Details
        if: always() && needs.advanced-checks.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supremeai-ci-audit-reports
          path: ci-reports
          merge-multiple: true

      - name: 📋 Add Advanced Audit to Smart Summary
        if: always()
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
          CI_AUDIT_REPORT_DIR: ci-reports
        run: python .github/scripts/surface_advanced_audit_summary.py

  # -----------------------------------------------------------------
  # Job: Build & Verify MCP Control Tower
  # -----------------------------------------------------------------
  build-mcp:
    name: 🏗️ Build & Verify MCP
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: infrastructure/mcp-control-plane
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: infrastructure/mcp-control-plane/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Security Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --debug --only-verified
