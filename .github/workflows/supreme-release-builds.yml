name: 📦 SupremeAI Release Builder

on:
  push:
    tags: ['v*'] # শুধুমাত্র v1.0.0, v2.1.0 ইত্যাদি ট্যাগ পুশ করলে
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Select Target Platform to Build'
        type: choice
        options:
          - 'ALL'
          - 'VSIX'
          - 'APK'
          - 'EXE'
        default: 'ALL'
      publish_release:
        description: 'Publish to GitHub Releases?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # 📱 1. FLUTTER APK BUILD (Android Arm64)
  # ----------------------------------------------------
  build-apk:
    name: 🏗️ Build APK
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target_platform == 'ALL' || github.event.inputs.target_platform == 'APK'))
    uses: ./.github/workflows/reusable-build-apk.yml
    secrets: inherit

  # ----------------------------------------------------
  # 🧩 2. VS CODE EXTENSION BUILD (VSIX)
  # ----------------------------------------------------
  build-vsix:
    name: 🧩 Build VSIX
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target_platform == 'ALL' || github.event.inputs.target_platform == 'VSIX'))
    uses: ./.github/workflows/reusable-build-vsix.yml
    secrets: inherit

  # ----------------------------------------------------
  # 🪟 3. WINDOWS DESKTOP BUILD (Tauri — apps/desktop)
  # ----------------------------------------------------
  build-exe:
    name: 🪟 Build EXE
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target_platform == 'ALL' || github.event.inputs.target_platform == 'EXE'))
    uses: ./.github/workflows/reusable-build-exe.yml
    secrets: inherit

  # ----------------------------------------------------
  # 🚀 CREATE GITHUB RELEASE
  # ----------------------------------------------------
  create-release:
    name: 🎉 Publish GitHub Release
    needs: [build-apk, build-vsix, build-exe]
    if: |
      always() &&
      needs.build-apk.result != 'failure' && needs.build-apk.result != 'cancelled' &&
      needs.build-vsix.result != 'failure' && needs.build-vsix.result != 'cancelled' &&
      needs.build-exe.result != 'failure' && needs.build-exe.result != 'cancelled' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v-manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          files: release-artifacts/**/*
          generate_release_notes: true

  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-apk
      - build-vsix
      - build-exe
      - create-release
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'
      - name: 🧠 Generate Smart Pipeline Summary (API Key Free)
        if: always()
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_smart_summary.py
      - name: 🚨 Generate Detailed Error Report (Bangla Diagnosis)
        if: always()
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_error_report.py
