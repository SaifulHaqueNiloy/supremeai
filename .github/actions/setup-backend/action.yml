name: 'Setup Backend'
description: 'Setup Python, Poetry, and cached virtualenv for backend'
inputs:
  python-version:
    description: 'Python version to setup'
    required: false
    default: '3.11'
  working-directory:
    description: 'Working directory for poetry'
    required: false
    default: 'backend'
  poetry-version:
    description: 'Poetry version'
    required: false
    default: 'latest'
  install-media-deps:
    description: 'Install ffmpeg for media processing'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: 📦 Install System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential
        if [ "${{ inputs.install-media-deps }}" = "true" ]; then
          sudo apt-get install -y ffmpeg
        fi

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - uses: snok/install-poetry@v1
      with:
        version: ${{ inputs.poetry-version }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        plugins: poetry-plugin-export

    # বাংলা মন্তব্য: পূর্বে শুধু ~/.cache/pypoetry ও ~/.cache/pip cache করা হতো।
    # এখন backend/.venv-ও cache করা হচ্ছে — ফলে poetry.lock অপরিবর্তিত থাকলে
    # poetry install সম্পূর্ণ skip হবে এবং প্রতি রানে ২-৩ মিনিট বাঁচবে।
    # Key: OS + python-version + poetry.lock hash → platform mismatch সম্ভব নয়।
    - name: 🗂️ Restore Virtualenv Cache
      id: venv-cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
          ${{ inputs.working-directory }}/.venv
        key: venv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory)) }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ inputs.python-version }}-
          venv-${{ runner.os }}-

    # বাংলা মন্তব্য: cache hit হলে build tool আপগ্রেড যথেষ্ট — full install দরকার নেই।
    # cache miss হলেই শুধু পুরো poetry install চলবে।
    - name: ⚙️ Install Build Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        poetry run pip install --upgrade pip "setuptools>=77.0.3" wheel || true
        poetry run pip install openai-whisper==20240930 --no-build-isolation || true

    - name: 📥 Poetry Install (backend deps)
      shell: bash
      if: steps.venv-cache.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.working-directory }}
      run: |
        poetry run pip install "setuptools>=77.0.3" wheel
        poetry install --no-root --with dev

    # বাংলা মন্তব্য: cache hit হলে venv ইতিমধ্যে restore হয়েছে।
    # তবে pip/setuptools হয়তো stale থাকতে পারে — একটি quick sync চালানো হচ্ছে।
    - name: 🔄 Sync deps (cache hit fast-path)
      shell: bash
      if: steps.venv-cache.outputs.cache-hit == 'true'
      working-directory: ${{ inputs.working-directory }}
      run: |
        poetry install --no-root --sync --with dev --dry-run 2>&1 | head -5 || true

    # বাংলা মন্তব্য: প্রতিটি রানে cache hit/miss স্ট্যাটাস GitHub Step Summary-তে দেখানো হচ্ছে।
    # এতে সহজেই বোঝা যাবে কোন রানে cache কাজ করছে আর কোনটায় fresh install হচ্ছে।
    - name: 📊 Virtualenv Cache Report
      shell: bash
      run: |
        if [ "${{ steps.venv-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✅ **venv cache HIT** — \`poetry install\` skipped, deps restored from cache." >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **venv cache MISS** — installing dependencies fresh & saving to cache." >> $GITHUB_STEP_SUMMARY
        fi
