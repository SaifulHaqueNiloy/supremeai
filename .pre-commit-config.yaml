# SupremeAI 2.0 — Git Pre-commit Hooks (Iron Curtain Local Defense)
# ================================================================
# বাংলা মন্তব্য: এই ফাইলটি git commit করার আগে স্বয়ংক্রিয়ভাবে
# ভাঙা JSON/TOML, মার্জ মার্কার, এবং debug statements লোকালি ব্লক করে।

repos:
  # ══════════════════════════════════════════════════════════════
  # ১. বেসিক ফাইল হেলথ চেক (File Integrity Gate & Gatekeepers)
  # ══════════════════════════════════════════════════════════════
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: 📄 YAML Syntactical Validator
        args: [--allow-multiple-documents]
        exclude: ^(docs/.*\.yml|_archive/.*)$
      - id: check-json
        name: 🧱 JSON Gatekeeper (Validates Structural JSON)
        description: ভাঙা বা ম্যালফর্মড JSON ফাইলের কমিট ব্লক করে।
      - id: check-toml
        name: ⚙️ TOML Gatekeeper (Validates Structural TOML)
        description: pyproject.toml বা কনফিগ TOML ফাইলের সিনট্যাক্স লক করে।
      - id: check-merge-conflict
        name: ⚔️ Merge Conflict Shield
        description: কোডের ভেতর ভুল করে '<<<<<<< HEAD' মার্কার থাকলে কমিট ড্রপ করায়।
      - id: debug-statements
        name: 🕵️‍♂️ Debug Tracer Blocker
        description: পাইথন কোডে pdb.set_trace(), breakpoint() কল লোকালি আটকায়।
      - id: end-of-file-fixer
        name: 🏁 End of File Enforcer
      - id: trailing-whitespace
        name: 🧹 Trailing Whitespace Remover
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
        name: 🔑 SSH/SSL Private Key Blocker
        exclude: ^backend/tests/(byoc/test_cloud_connector\.py|test_byoc_endpoints\.py)$
      # বাংলা (V8 ফরেনসিক ফিক্স): আগে এখানে `id: gitleaks` ছিল — কিন্তু gitleaks
      # হুকটি pre-commit/pre-commit-hooks রিপোতেই নেই (আলাদা gitleaks/gitleaks
      # রিপো) → pre-commit-এর পুরো environment init ব্যর্থ হতো = সবার pre-commit
      # কার্যত ভাঙা ছিল। সিক্রেট-কভারেজ অটুট: detect-private-key (উপরে) +
      # secret-hunter (local hook) + CI-র gitleaks/gitleaks scan।
      - id: check-ast
        name: 🐍 Python Syntax Gatekeeper (Check AST)
        description: পাইথন কোডে কোনো সিনট্যাক্স এরর (Syntax Error) থাকলে কমিট ব্লক করে।

  # Gitleaks scans staged content before every commit. This catches credentials
  # accidentally pasted from AI chats, terminals, or local environment files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: 🔐 Gitleaks Secret Leak Prevention
        args: [--config=.gitleaks.toml]

  - repo: local
    hooks:
      - id: secret-hunter
        name: 🔍 SecretHunter (AI & Pattern Secret Scanner)
        # AUDIT-2026-08: আগের entry backend/scripts/devops/secret_scan_ci.py ফাইলটি
        # রিপো-তে ছিলই না (নিখোঁজ) — তাই hook নীরবে কাজ করছিল না এবং রিয়েল
        # RENDER_API_KEY / Infisical token কমিট হয়ে যায়। এখন কাজ করা
        # packages/scripts/security_guard.py (stdlib-only, cross-platform) পয়েন্ট করা হলো।
        entry: python packages/scripts/security_guard.py
        language: system
        pass_filenames: false
        always_run: true

      - id: api-contract-check
        name: "🔗 Frontend–Backend API Contract Check"
        description: frontend-এর প্রতিটি /api কল backend-এ নিবন্ধিত আছে কিনা যাচাই করে (AUDIT-018 prevention)। stdlib-only, ~220ms।
        entry: python scripts/ci/verify_api_contract.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ══════════════════════════════════════════════════════════════
  # ৩. Python কোড কোয়ালিটি এবং আনসেফ ফিক্স (Ruff Engine + Unsafe-fixes)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: ruff
        name: ⚡ Ruff Linter (Matching CI Iron Curtain Gate)
        entry: python scripts/git/optional_poetry.py poetry -C backend run python -m ruff check backend --config=backend/pyproject.toml --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: ruff-format
        name: 🎨 Ruff Formatter (PEP 8 Enforcer)
        entry: python scripts/git/optional_poetry.py poetry -C backend run python -m ruff format backend --config=backend/pyproject.toml
        language: system
        pass_filenames: false

  # ══════════════════════════════════════════════════════════════
  # ৪. Python টাইপ চেকিং (Mypy Static Analyzer)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: mypy
        name: 🔍 Mypy Static Analyzer
        # বাংলা মন্তব্য: follow-imports=skip না দিলে mypy পুরো backend ট্রি ট্রাভার্স করে,
        # ফলে এই single-file gate কখনোই পাস করত না।
        entry: python scripts/git/optional_poetry.py poetry -C backend run mypy --config-file backend/pyproject.toml --ignore-missing-imports --follow-imports=skip backend/core/security/secret_hunter.py
        language: system
        types: [python]
        pass_filenames: false









  # ══════════════════════════════════════════════════════════════
  # ৫. TypeScript / Frontend কোয়ালিটি (Strict ESLint Import Gate)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: eslint-frontend
        name: "🔍 ESLint Frontend Check (Strict Import Guard)"
        description: "TypeScript/TSX ফাইলে ESLint রান করে import order ও type error ধরে।"
        entry: pnpm -C frontend exec eslint --max-warnings=9999 src/ --ext .ts,.tsx
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-commit]

  # ══════════════════════════════════════════════════════════════
  # ৬. SupremeAI Security Guard & Router Smoke-Test (Local Defense)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      # বাংলা মন্তব্য: SupremeAI-এর নিজস্ব security scanner — commit করার আগে
      # hardcoded secrets, SQL injection, .env committed চেক করে।
      # Critical পেলে commit block হবে।
      - id: supremeai-blindspot-scan
        name: "🔐 SupremeAI Blind Spot Security Scanner"
        # বাংলা মন্তব্য: auto_find_blindspots.py নিজেই sys.stdout.reconfigure(utf-8) করে
        # তাই Windows-এ আলাদা encoding wrapper দরকার নেই
        entry: python scripts/git/optional_poetry.py poetry -C backend run python scripts/security/auto_find_blindspots.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: plan-governance-warn
        name: "📋 Plan Governance Linter (warn-only — CANONICAL_…PLAN.md Decision 2 Stage 1)"
        entry: python scripts/governance/lint_plans.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: stub-data-check
        name: "🚫 Gate 1 — Stub & Placeholder Data Blocker"
        entry: python scripts/git/optional_poetry.py poetry -C backend run python scripts/find_stub_data.py --path . --fail-on HIGH
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: router-smoke-test
        name: "🔌 Router Import Smoke-Test (Gate 0 Local)"
        # বাংলা মন্তব্য: PRE_COMMIT=1 script-এ সেট হয়, timeout=60s দেওয়া আছে।
        # dependencies-এর জন্য poetry -C backend run দিয়ে চালানো হচ্ছে।
        entry: python scripts/git/optional_poetry.py poetry -C backend run python scripts/ci/validate_router_imports.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ══════════════════════════════════════════════════════════════
  # ৬.৫. Phase 1 & Audit Gates (Production Guard)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: import-budget-check
        name: "⏱️ Import Budget Gate (<5s)"
        # NOTE: check_import_budget.py itself always exits 0 (audit mode — it
        # logs [WARN] lines and returns 0). The old value here also appended
        # `|| echo "Warning: ..."` inside an unquoted YAML plain scalar, and the
        # ": " inside that text broke YAML parsing (yamllint syntax error).
        entry: python scripts/ci/check_import_budget.py
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: env-mode-guard
        name: "🌍 ENV=production Local Blocker"
        entry: python scripts/ci/env_mode_guard.py
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: actions-pin-checker
        name: "📌 GitHub Actions SHA Pin Enforcer"
        entry: python scripts/ci/check_actions_pinning.py
        language: system
        stages: [pre-commit]
        files: ^\.github/workflows/.*\.yml$

      - id: truthy-env-checker
        name: "🔍 Truthy ENV Trap Detector"
        entry: python scripts/ci/check_truthy_env_var.py
        language: system
        stages: [pre-commit]
        types: [python]

      - id: react-cleanup-lint
        name: "🧹 React useEffect Cleanup Guard"
        entry: 'python scripts/ci/check_react_cleanup.py || echo "Warning: React cleanup issue"'
        language: system
        stages: [pre-commit]
        files: ^frontend/src/.*\.(ts|tsx)$

      - id: singleton-guard
        name: "🔒 Singleton Re-Init Detector"
        entry: 'python scripts/ci/check_singleton_inits.py || echo "Warning: Singleton issue"'
        language: system
        stages: [pre-commit]
        types: [python]

  # ══════════════════════════════════════════════════════════════
  # ৭. Free-Tier Size Guard (Render / GitHub / Vercel / Firebase)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      # বাংলা মন্তব্য: প্রতিটি commit-এর আগে free-tier পরিবেশের সাইজ লিমিট চেক করে।
      # 80% → warning, 95% → commit block
      # Covered: Render(500MB), GitHub Actions(8GB), Vercel(100MB), Firebase(1GB)
      - id: free-tier-size-guard
        name: "📏 Free-Tier Size Guard (Render/GitHub/Vercel/Firebase)"
        entry: python scripts/ci/check_free_tier_limits.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ══════════════════════════════════════════════════════════════
  # ৮. CI Parity Gates — GitHub-এ আছে কিন্তু আগে এখানে ছিল না
  #    (pre-merge-gate job-এর Gate 3, 3.5 ও Observability Audit)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: admin-auth-lint-guard
        name: "🛡️ Gate 3.5 — Admin Router Auth Lint Guard"
        description: "admin prefix router-এ dependencies=[Depends(get_current_admin)] না থাকলে কমিট ব্লক করে।"
        entry: python scripts/git/optional_poetry.py poetry -C backend run python .github/scripts/verify_admin_auth.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: httpx-timeout-audit
        name: "⏱️ Gate 3 — HTTP Timeout Audit (httpx.AsyncClient without timeout)"
        description: "timeout parameter ছাড়া httpx.AsyncClient() থাকলে কমিট ব্লক করে (production hang risk)."
        entry: bash -c 'V=$(grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv" | wc -l); if [ "$V" -gt 0 ]; then grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv"; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: observability-audit
        name: "🔬 Observability Audit (silent excepts / stray print())"
        description: "except Exception: pass এর মতো সাইলেন্ট এরর হ্যান্ডলার বা print() থাকলে কমিট ব্লক করে।"
        # বাংলা (V8): baseline ratchet — ৮৭৩টি ঐতিহাসিক violation-এর জন্য গেট
        # সবসময় লাল ছিল (= সবার pre-commit অকেজো); এখন শুধু নতুন violation ব্লক
        entry: python scripts/audit_observability.py --baseline scripts/observability_baseline.json
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: check-hardcoded-deployment-config
        name: "🌐 Hardcoded Deployment Config Scanner (Advisory)"
        description: "Scans for hardcoded production hostnames in runtime paths."
        entry: python scripts/ci/check_hardcoded_deployment_config.py --advisory
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ══════════════════════════════════════════════════════════════
  # ইস্যু #476 — ক্রিটিকাল ইনভেরিয়েন্ট গার্ড (pre-push)
  # রিবেস/মার্জে ক্রিটিকাল কোড (Lua rate limiter, schema gate, টেন্যান্ট
  # স্কোপিং) নীরবে ড্রপ হলে পুশ ব্লক হয়।
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: critical-invariant-guard
        name: "🛡️ Critical Invariant Guard (Lua limiter / schema gate / tenant scoping)"
        description: "রিবেস কনফ্লিক্ট রেজলিউশনে ক্রিটিকাল কোর মডিউল সাইলেন্টলি ড্রপ হলে পুশ ব্লক করে (issue #476)।"
        entry: python scripts/ci/check_critical_invariants.py
        language: system
        pass_filenames: false
        stages: [pre-push]
