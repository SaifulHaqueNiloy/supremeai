# ==============================================================================
# SupremeAI — ECOSYSTEM GRAPH REGISTRY (সংযুক্ত ইকোসিস্টেম গ্রাফ রেজিস্ট্রি)
# ==============================================================================
# Issue #2399 — Connected Ecosystem Graph: 3-Layer Model (Core ➔ 10 Domains ➔ Nodes)
#
# বাংলা মন্তব্য: এই ফাইলটি হলো SupremeAI-এর "সব কাজের MAP" — কে কার সাথে যুক্ত,
# কোন DB মডেল কোন domain-এর, কোন গ্রুপের বাউন্ডারি কোথা পর্যন্ত। এটি একটি
# meaning-relationship graph, all-to-all mesh নয় (issue #2399 §1: "প্রতিটি নোডের
# ইকোসিস্টেমের সাথে অর্থপূর্ণ সম্পর্ক থাকবে — হয় প্রত্যক্ষ, নয়তো পরোক্ষ")।
#
# Layer 1: core_truths        — কেন্দ্রীয় একক সত্য (Identity, Ledger, Capability, Policy, State)
# Layer 2: domains            — ১০টি সক্রিয় কেন্দ্র (Center) ও তাদের বাউন্ডারি
# Layer 3: nodes              — আণবিক উপাদান (Agents, Tools, Rules, Workflows, Docs)
#        + edges              — domain/nodes-এর মধ্যে অর্থপূর্ণ সম্পর্ক
#
# এই রেজিস্ট্রি machine-readable: scripts/agents/mcp_tower_client.py এটি পড়ে
# agent bootstrap handshake চালায়, আর scripts/ci/graph_health_audit.py এটি
# প্রতিটি PR-এ যাচাই করে (missing edge, duplicate node, dangling center ধরার জন্য)।
#
# Governance: docs/architecture/ECOSYSTEM_GRAPH_REGISTRY.yaml একমাত্র source of
# truth। কোনো domain/node/edge যোগ-বিয়োগ হলে অবশ্যই এই ফাইলে করতে হবে —
# অন্য কোথাও ডুপ্লিকেট তালিকা রাখা নিষিদ্ধ (Capability Ledger-এর মতোই)।
# ==============================================================================

schema_version: "1.0.0"

meta:
  id: ecosystem-graph-registry
  issue: 2399
  group: arch-foundation
  sequence: 1
  created: "2026-09-29"
  philosophy: >-
    SupremeAI is a connected ecosystem, not a collection of independent
    subsystems. জটিল রিজিড হায়ারার্কি নয় — অর্থপূর্ণ নেটওয়ার্ক গ্রাফ।
  layers:
    - "L1: core_truths  (SupremeAI Core — Common Truth Backbone)"
    - "L2: domains      (10 Centers — সক্রিয় কেন্দ্র)"
    - "L3: nodes+edges  (Atomic Nodes — আণবিক উপাদান ও সম্পর্ক)"

# ─────────────────────────────────────────────────────────────────────────────
# THE 8 GOLDEN QUESTIONS — Node Declaration Standard (৮টি গোল্ডেন প্রশ্ন)
# ─────────────────────────────────────────────────────────────────────────────
# বাংলা মন্তব্য: গ্রাফে নোড থাকাই যথেষ্ট নয় — প্রতিটি নোড/ডোমেইনের এজ (সম্পর্ক)
# সুস্থ ও স্পষ্ট হতে হবে। নিচের ৮টি key-ই হলো ডিক্লারেশন স্ট্যান্ডার্ড; core_truths,
# domains ও nodes — সবাইকেই এই ৮টির উত্তর দিতে হবে (graph health auditor
# খালি উত্তর ধরলে HIGH severity finding দেবে)।
eight_questions_spec:
  identity:        "আমি কে? (Node Identity — অনন্য id ও প্রকৃতি)"
  responsibility:  "আমার কাজ কী? (Specific Responsibility)"
  upstream:        "আমি কার ওপর নির্ভর করি? (Upstream Dependencies — list)"
  downstream:      "কে আমার ওপর নির্ভর করে? (Downstream Consumers — list)"
  side_effects:    "আমি কাকে প্রভাবিত করি? (Side Effects & Impact)"
  verification:    "আমাকে কে verify করে? (Assigned Verification Gate / Tests)"
  blast_radius:    "আমার পরিবর্তনে আর কী কী বদলাতে পারে? (Ripple Effects)"
  ultimate_value:  "আমার চূড়ান্ত অবদান SupremeAI-এর কোন outcome-এ? (Ultimate Value)"

# ─────────────────────────────────────────────────────────────────────────────
# LAYER 1: SUPREMEAI CORE — কেন্দ্রীয় একক সত্য (Common Truth Backbone)
# ─────────────────────────────────────────────────────────────────────────────
core_truths:
  - id: core.identity
    name: "Identity & Authentication"
    mission: "কার পরিচয় কী — user, agent, bot, tenant সবার একক পরিচয়-সত্য।"
    canonical_paths:
      - backend/core/accessibility  # identity-adjacent core surface
      - backend/models/admin.py
      - backend/models/api_key.py
    eight_questions:
      identity: "সিস্টেমের প্রতিটি actor-এর (user/agent/bot/tenant) একক identity truth।"
      responsibility: "Authentication, actor resolution, API key ও session identity প্রদান।"
      upstream: ["infrastructure-center (Supabase/Firebase auth infra)"]
      downstream: ["সব ১০টি domain — প্রতিটি রিকোয়েস্ট identity ছাড়া অচল"]
      side_effects: "Auth ভাঙলে পুরো ইকোসিস্টেম locked; token leak হলে security incident।"
      verification: "Backend tests (security), Security Scan gate, api_key model tests।"
      blast_radius: "Session handling, rate-limit keying, audit-chain actor ফিল্ড, RLS boundary।"
      ultimate_value: "বিশ্বস্ত multi-actor ইকোসিস্টেম — কে কী করছে তা প্রমাণযোগ্য।"

  - id: core.task-run-ledger
    name: "Task & Run Ledger"
    mission: "কী চলছে, কী সম্পন্ন হয়েছে — প্রতিটি কাজ ও রানের হিসাব।"
    canonical_paths:
      - backend/models/task_record.py
      - backend/models/execution_log.py
      - backend/models/pending_tasks.py
      - backend/runs
    eight_questions:
      identity: "Task/run-এর অবস্থা ও ইতিহাসের একক ledger (issue #2377-এর অপারেশনাল truth-এর ভিত্তি)।"
      responsibility: "Task lifecycle ট্র্যাক করা: claimed → running → verified → completed।"
      upstream: ["execution-center (worker রান চালায়)", "agent-center (এজেন্ট claim করে)"]
      downstream: ["audit-center (trend report)", "governance-center (merge সিদ্ধান্ত)", "ux-center (ড্যাশবোর্ড)"]
      side_effects: "Ledger ভুল হলে duplicate কাজ বা হারানো কাজ — উভয়ই সম্ভব।"
      verification: "Backend tests (core), execution log assertions, CI failure-trend report।"
      blast_radius: "Slot lease, issue queue, merge train sequencing, analytics।"
      ultimate_value: "Zero-duplicate, zero-lost work — প্রতিটি কাজের গণনাযোগ্য পরিণতি।"

  - id: core.capability-registry
    name: "Canonical Capability Registry"
    mission: "সিস্টেম আসলে কী পারে — capability-র জীবন্ত তালিকা ও অবস্থা।"
    canonical_paths:
      - docs/architecture/CAPABILITY_LEDGER.md
      - backend/core/llm/llm_gateway
      - infrastructure/mcp-control-plane/src/registry/capability.registry.ts
    eight_questions:
      identity: "Capability-র (VERIFIED→DEPRECATED) একক ক্যাননিকাল সত্য — code নয়, সক্ষমতা।"
      responsibility: "কোন capability canonical কোথায়, কোনটা duplicate, কোনটা retired তা ঘোষণা।"
      upstream: ["capability-center (implementation থেকে সত্য সংগ্রহ)"]
      downstream: ["agent-center (এজেন্ট জানবে কোন tool ব্যবহারযোগ্য)", "audit-center (dead-code detection)"]
      side_effects: "Ledger-এ ভুল এন্ট্রি থাকলে এজেন্ট dead path-এ কাজ করবে।"
      verification: "Capability integration gate (scripts/ci/capability_integration_gate.py), human review।"
      blast_radius: "Refactor decision, Step-3 consolidation, MCP tool exposure।"
      ultimate_value: "জিরো ক্যাপাবিলিটি লস — কোড কমলেও সক্ষমতা হারায় না (১০১% লাভ নীতি)।"

  - id: core.policy-engine
    name: "Unified Policy Engine"
    mission: "কী অনুমোদিত, কী নিষিদ্ধ — সব নিয়মের একক সত্য ও enforcement।"
    canonical_paths:
      - .github/constitution/rules.yml
      - .github/scripts/constitution/engine.py
      - infrastructure/mcp-control-plane/src/policy/mcp-access.ts
    eight_questions:
      identity: "Constitution + MCP policy-র machine-readable একক সত্য।"
      responsibility: "Rule evaluate (ALLOW/REQUIRE_APPROVAL/BLOCK) — CI gate ও MCP tool call উভয় জায়গায়।"
      upstream: ["governance-center (rule লেখা ও রক্ষণাবেক্ষণ)"]
      downstream: ["git-delivery-center (pr-gate enforcement)", "agent-center (MCP policy check)"]
      side_effects: "Rule ভুল হলে ভুল PR block বা বিপজ্জনক PR পাশ — দুটোই ক্ষতিকর।"
      verification: "Constitution audit (weekly + PR), gate unit tests (.github/scripts/constitution/tests)।"
      blast_radius: "AGENTS.md (generated), সব CI gate, MCP tool access সিদ্ধান্ত।"
      ultimate_value: "সংবিধান কাগজে নয় — প্রতিটি action-এ প্রয়োগকৃত আইন।"

  - id: core.state-verification
    name: "State & Verification Ground"
    mission: "প্রমাণিত সত্য ও গেট — কী verified, তার প্রমাণভিত্তিক ভিত্তি।"
    canonical_paths:
      - docs/generated/STATUS_PROOF.md
      - backend/verification
      - scripts/ci/build_status_proof.py
    eight_questions:
      identity: "'Verified' দাবির প্রমাণ-ভূমি — রেজিস্টার্ড route বনাম বাস্তব route-এর মিল।"
      responsibility: "STATUS_PROOF, parity sentinel, route registry যাচাই — দাবি বনাম বাস্তবতা মেলানো।"
      upstream: ["audit-center (sentinel চালায়)", "git-delivery-center (CI artifact দেয়)"]
      downstream: ["governance-center (merge সিদ্ধান্তে প্রমাণ)", "stakeholder status report"]
      side_effects: "প্রমাণ কাটাকাটি হলে false-confidence merge হয়ে যায়।"
      verification: "নিজেই verification gate — cross-check করে route tree বনাম declaration।"
      blast_radius: "Merge trust, docs/generated artifact, roadmap সিদ্ধান্ত।"
      ultimate_value: "যা বলা হয় তা প্রমাণ থাকে — 'trust but verify' স্বয়ংক্রিয়।"

# ─────────────────────────────────────────────────────────────────────────────
# LAYER 2: 10 CENTERS / DOMAINS — ১০টি সক্রিয় কেন্দ্র ও তাদের বাউন্ডারি
# ─────────────────────────────────────────────────────────────────────────────
# প্রতিটি domain-এর থাকে: mission (কেন আছে), owning_paths (কোথায় বাসে),
# boundaries (কোথায় পর্যন্ত তার এখতিয়ার), edges (কার সাথে সম্পর্ক) ও
# ৮টি গোল্ডেন প্রশ্নের উত্তর। এগুলো বিচ্ছিন্ন রাজ্য নয় — কোর-এর সাথে যুক্ত।
domains:
  - id: agent-center
    name: "Agent Center"
    name_bn: "এজেন্ট কেন্দ্র"
    mission: "ফ্লিট কোঅর্ডিনেশন, স্লট লিজ, ডুয়াল-স্টেট (Solver/Reviewer) — ঘুড়ি আকাশে, নাটাই টাওয়ারে।"
    owning_paths:
      - backend/agents
      - backend/core/agents
      - backend/core/agent_registry.py
      - backend/core/agent_registry.json
      - backend/core/agent_heartbeat.py
      - backend/core/agent_supervisor.py
      - backend/external_agents
      - backend/p2p
      - scripts/agents
    boundaries:
      may_touch: ["নিজের owning_paths", "backend/models/agent_*.py", "backend/models/shared_workspace.py"]
      must_not_touch: ["frontend/**", "infrastructure/**", ".github/workflows/** (bot lanes ছাড়া)"]
    eight_questions:
      identity: "১০+ AI এজেন্টের ফ্লিট পরিচালনার কেন্দ্র — কে অনলাইন, কে কোন কাজে, কার লিজ কতদিন।"
      responsibility: "Slot lease, heartbeat presence, dual-state (Solver/Reviewer) coordination।"
      upstream: ["core.identity (এজেন্ট পরিচয়)", "infrastructure-center (MCP Tower, Redis mesh)"]
      downstream: ["execution-center (এজেন্ট রান চালায়)", "git-delivery-center (এজেন্ট PR দেয়)"]
      side_effects: "Slot leak হলে duplicate এজেন্ট একই কাজ করে; heartbeat miss হলে ghost slot।"
      verification: "Slot-registry drift check, heartbeat TTL contract (300s), agent tools unit tests।"
      blast_radius: "Mesh lease, issue claiming, PR authorship, dashboard agent status।"
      ultimate_value: "শৃঙ্খলাবদ্ধ স্বায়ত্তশাসিত ফ্লিট — স্বাধীনতা অথচ শূন্য সংঘর্ষ।"

  - id: capability-center
    name: "Capability Center"
    name_bn: "সক্ষমতা কেন্দ্র"
    mission: "আসল বিজনেস ফিচার, এআই ব্রেন ও ইউজার টুলস — সিস্টেমের মূল্য এখানেই তৈরি।"
    owning_paths:
      - backend/brain
      - backend/skills
      - backend/engine
      - backend/missions
      - backend/scout
      - backend/evolution
      - backend/adaptive_engine
      - backend/context_engine
      - backend/browser
      - backend/tools
      - docs/architecture/CAPABILITY_LEDGER.md
    boundaries:
      may_touch: ["নিজের owning_paths", "সংশ্লিষ্ট backend/models/*.py (db_model_domain_map অনুযায়ী)"]
      must_not_touch: [".github/**", "infrastructure/**", "scripts/agents/** (tool contract অপরিবর্তিত রাখা)"]
    eight_questions:
      identity: "ব্যবহারকারীর কাছে আসল মূল্য দেয় এমন সকল সক্ষমতার বাসস্থান — AI brain থেকে browser পর্যন্ত।"
      responsibility: "ফিচার implement ও রক্ষণাবেক্ষণ; capability lifecycle (IDEA➔LIVE) মানা।"
      upstream: ["core.capability-registry (canonical ঘোষণা)", "memory-learning-center (শেখা প্রয়োগ)"]
      downstream: ["ux-center (ইউজার এগুলো ব্যবহার করে)", "core.capability-registry (অবস্থা রিপোর্ট)"]
      side_effects: "Capability ভাঙলে user-facing ফিচার সরাসরি ভাঙে; duplicate হলে রক্ষণাবেক্ষণ দ্বিগুণ।"
      verification: "Backend tests (services/api), capability integration gate, coverage threshold।"
      blast_radius: "API contract, frontend behavior, MCP tool exposure, Step-3 consolidation।"
      ultimate_value: "SupremeAI-এর বিক্রয়যোগ্য সক্ষমতা — ব্যবহারকারীর সমস্যার সমাধান।"

  - id: governance-center
    name: "Governance Center"
    name_bn: "গভর্নেন্স কেন্দ্র"
    mission: "সংবিধান (rules.yml), গেটওয়ে এনফোর্সমেন্ট, লিমিট গার্ড — আইন ও তার প্রয়োগ।"
    owning_paths:
      - .github/constitution
      - .github/scripts/constitution
      - backend/core/action_policy.py
      - backend/core/agent_review_workflow.py
      - backend/models/execution_policy.py
      - backend/models/system_config.py
    boundaries:
      may_touch: ["নিজের owning_paths", "AGENTS.md regeneration (generate_agents_md.py দিয়েই, হাতে নয়)"]
      must_not_touch: ["backend/api/**", "frontend/**", "infrastructure/mcp-control-plane/src/policy/** নয় — সেটি infrastructure-এর mirror"]
    eight_questions:
      identity: "সংবিধানের লেখক ও রক্ষক — নিয়ম লেখা, ব্যাখ্যা ও gate-এ wire করা।"
      responsibility: "rules.yml single-source-of-truth রাখা; AGENTS.md generated sync; gate policy tune করা।"
      upstream: ["core.policy-engine (আইনের প্রয়োগ-যন্ত্র)"]
      downstream: ["git-delivery-center (gate চালায়)", "agent-center (এজেন্ট নিয়ম মানে)"]
      side_effects: "অতি-কঠোর নিয়মে velocity বন্ধ; ঢিলা নিয়মে বিশৃঙ্খলা — balance জরুরি।"
      verification: "Constitution audit workflow, gate tests, weekly rule-review।"
      blast_radius: "AGENTS.md, সব PR gate, MCP policy, bot lanes।"
      ultimate_value: "স্বয়ংক্রিয় আইন-শৃঙ্খলা — মানুষ না দেখেও নিয়ম ভাঙা অসম্ভব।"

  - id: memory-learning-center
    name: "Memory & Learning Center"
    name_bn: "মেমরি ও শিক্ষা কেন্দ্র"
    mission: "কালেক্টিভ ডাটাবেস মেমরি, ভেক্টর স্টোর, লেসনস লার্নড — জ্ঞান মানে memory, কাজের অবস্থা মানে issue।"
    owning_paths:
      - backend/memory
      - backend/learning
      - backend/core/ai_memory
      - backend/data
      - LESSONS_LEARNED.md
    boundaries:
      may_touch: ["নিজের owning_paths", "backend/models/ai_memory.py"]
      must_not_touch: ["backend/api/**", ".github/**", "frontend/**"]
    eight_questions:
