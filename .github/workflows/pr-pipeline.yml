name: PR Pipeline (Unified Orchestrator)
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
    - develop
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to analyze (manual test)
        required: true
        type: string
concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: write
env:
  PYTHON_VERSION: '3.11'
jobs:
  validate-branch-name:
    name: 🔤 Validate Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Validate branch name against OPS-06 regex
        id: validate
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          BRANCH="${BRANCH_NAME:-}"
          if [[ -z "$BRANCH" && -n "${{ inputs.pr_number }}" ]]; then
            BRANCH="$(gh pr view "${{ inputs.pr_number }}" --json headRefName -q .headRefName 2>/dev/null || echo '')"
            PR_NUMBER="${{ inputs.pr_number }}"
          fi
          echo "Branch: $BRANCH"

          VALID_PATTERN='^(agent-[0-9]+/issue-[0-9]+-.+|feat/.+|fix/.+|hotfix/.+|perf/.+|chore/.+|test/.+|docs/.+|refactor/.+|ci/.+|develop|main)$'

          if [[ "$BRANCH" =~ $VALID_PATTERN ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ Branch name '$BRANCH' matches OPS-06 pattern"
            gh pr edit "$PR_NUMBER" --remove-label "branch:invalid" 2>/dev/null || true
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "❌ Branch name '$BRANCH' does NOT match OPS-06 pattern"
            echo "Expected one of: agent-N/issue-N-slug, feat/, fix/, hotfix/, perf/, chore/, test/, docs/, refactor/, ci/"

            gh label create "branch:invalid" --color "D93F0B" \
              --description "Branch name does not match OPS-06 regex" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "branch:invalid" 2>/dev/null || true

            cat > /tmp/branch-error.md << 'MD'
          ## ❌ Branch Naming Violation (GAP-05 / OPS-06 Safeguard 4)

          এই PR-এর branch name OPS-06 স্ট্যান্ডার্ড প্যাটার্নে মেলে না।

          **Valid patterns:**
          - `agent-N/issue-N-<slug>` (agent slots, e.g., `agent-1/issue-900-fix-login`)
          - `feat/<slug>` (feature work)
          - `fix/<slug>` (bug fixes)
          - `hotfix/<slug>` (urgent production fixes)
          - `perf/<slug>` (performance improvements)
          - `chore/<slug>` (maintenance)
          - `test/<slug>` (test branches)
          - `docs/<slug>` (documentation)
          - `refactor/<slug>` (refactoring)
          - `ci/<slug>` (CI/CD changes)

          **Action required:** branch rename করুন অথবা maintainer-এর অনুমতি নিন।
          MD
            gh pr comment "$PR_NUMBER" --body-file /tmp/branch-error.md 2>/dev/null || true
            echo "::error::Branch name '$BRANCH' violates OPS-06 naming convention"
            exit 1
          fi

  detect-scope:
    name: 🧭 Detect Scope & Risk
    needs: validate-branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      risk_class: ${{ steps.classify.outputs.risk_class }}
      security_changed: ${{ steps.classify.outputs.security_changed }}
      auth_changed: ${{ steps.classify.outputs.auth_changed }}
      hitl_changed: ${{ steps.classify.outputs.hitl_changed }}
      workflows_changed: ${{ steps.classify.outputs.workflows_changed }}
      code_changed: ${{ steps.classify.outputs.code_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      constitution_changed: ${{ steps.classify.outputs.constitution_changed }}
      protected_scope_touched: ${{ steps.classify.outputs.protected_scope_touched }}
      self_modification_detected: ${{ steps.classify.outputs.self_modification_detected }}
      protected_scope_paths: ${{ steps.classify.outputs.protected_scope_paths }}
      changed_files_count: ${{ steps.classify.outputs.changed_files_count }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
    steps:
    - name: Checkout (full history for merge-base)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve PR metadata
      id: meta
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        if [[ -n "${{ github.event.pull_request.number }}" ]]; then
          PR="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
        else
          # workflow_dispatch or workflow_call — use the input
          PR="${INPUT_PR_NUMBER}"
          HEAD_SHA="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
          BASE_REF="$(gh pr view "$PR" --json baseRefName -q .baseRefName)"
        fi
        BASE_SHA="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")"
        {
          echo "pr_number=$PR"
          echo "head_sha=$HEAD_SHA"
          echo "base_sha=$BASE_SHA"
        } >> "$GITHUB_OUTPUT"
        echo "PR=$PR head=$HEAD_SHA base=$BASE_SHA"

    - name: Classify scope & risk (reads security/policies/protected-scopes.yml)
      id: classify
      env:
        BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nimport os\nimport re\nimport subprocess\nimport sys\n\nimport yaml\n\nbase_sha = os.environ.get('BASE_SHA', '')\nhead_sha = os.environ.get('HEAD_SHA',\
        \ '')\nif not base_sha or not head_sha:\n    print('::error::BASE_SHA/HEAD_SHA missing — cannot classify scope')\n    sys.exit(2)\n\n# git diff against merge-base (handles rebases correctly)\nchanged\
        \ = subprocess.check_output(\n    ['git', 'diff', '--name-only', f'{base_sha}...{head_sha}'],\n    text=True,\n).strip().split('\\n')\nchanged = [c for c in changed if c]\n\n# Load protected scopes\
        \ policy\nwith open('security/policies/protected-scopes.yml', encoding='utf-8') as f:\n    policy = yaml.safe_load(f)\nprotected_entries = policy.get('protected_scopes', []) or []\nprotected_patterns\
        \ = [p['path'] for p in protected_entries]\n\n# Match changed files against protected path patterns.\n# Patterns use gitignore-style globs: \"path/**\" matches recursively.\ndef matches_pattern(path:\
        \ str, pattern: str) -> bool:\n    if pattern.endswith('/**'):\n        prefix = pattern[:-3]\n        return path == prefix or path.startswith(prefix + '/')\n    if pattern.endswith('**'):\n  \
        \      return path.startswith(pattern[:-2])\n    return path == pattern\n\ntouched_patterns = []\nfor pattern in protected_patterns:\n    if any(matches_pattern(p, pattern) for p in changed):\n\
        \        touched_patterns.append(pattern)\n\nprotected_touched = len(touched_patterns) > 0\n\n# Scope-flag regex tests\ndef any_match(regex: str) -> bool:\n    pat = re.compile(regex)\n    return\
        \ any(pat.search(p) for p in changed)\n\nsecurity_changed     = any_match(r'^(backend/core/security/|security/|docs/security/)')\nauth_changed         = any_match(r'^(backend/api/routes/.*auth.*\\.py|backend/core/firebase_auth\\.py)$')\nhitl_changed\
        \         = any_match(r'^backend/services/hitl/')\nworkflows_changed    = any_match(r'^\\.github/workflows/')\ncode_changed         = any_match(r'^(backend/|services/|scripts/)')\nfrontend_changed     =\
        \ any_match(r'^frontend/')\nconstitution_changed = any_match(\n    r'^(docs/security/SECURITY_GUARDIAN\\.md|security/policies/|'\n    r'\\.github/workflows/pr-pipeline\\.yml|\\.github/workflows/pr-helper\\\
        .yml|'\n    r'\\.github/scripts/pr_helper/)'\n)\n\n# SG-11 Bootstrap Trust — self-modification of Guardian/PR-Helper logic\nself_mod_patterns = [\n    r'^\\.github/workflows/pr-helper\\.yml$',\n\
        \    r'^\\.github/workflows/pr-pipeline\\.yml$',\n    r'^\\.github/scripts/pr_helper/',\n    r'^docs/security/SECURITY_GUARDIAN\\.md$',\n    r'^security/policies/',\n]\nself_mod = any(any_match(p)\
        \ for p in self_mod_patterns)\n\n# Risk classification (per protected-scopes.yml risk_classification_rules)\nif protected_touched:\n    risk_class = 'CRITICAL'\nelif auth_changed or hitl_changed\
        \ or workflows_changed:\n    risk_class = 'HIGH'\nelif security_changed:\n    risk_class = 'HIGH'\nelif code_changed:\n    risk_class = 'MEDIUM'\nelse:\n    risk_class = 'LOW'\n\nout = os.environ.get('GITHUB_OUTPUT',\
        \ '')\nwith open(out, 'a', encoding='utf-8') as f:\n    f.write(f'risk_class={risk_class}\\n')\n    f.write(f'security_changed={\"true\" if security_changed else \"false\"}\\n')\n    f.write(f'auth_changed={\"\
        true\" if auth_changed else \"false\"}\\n')\n    f.write(f'hitl_changed={\"true\" if hitl_changed else \"false\"}\\n')\n    f.write(f'workflows_changed={\"true\" if workflows_changed else \"false\"\
        }\\n')\n    f.write(f'code_changed={\"true\" if code_changed else \"false\"}\\n')\n    f.write(f'frontend_changed={\"true\" if frontend_changed else \"false\"}\\n')\n    f.write(f'constitution_changed={\"\
        true\" if constitution_changed else \"false\"}\\n')\n    f.write(f'protected_scope_touched={\"true\" if protected_touched else \"false\"}\\n')\n    f.write(f'self_modification_detected={\"true\"\
        \ if self_mod else \"false\"}\\n')\n    f.write(f'protected_scope_paths={json.dumps(touched_patterns)}\\n')\n    f.write(f'changed_files_count={len(changed)}\\n')\n\nprint(f'risk_class={risk_class}')\n\
        print(f'protected_scope_touched={protected_touched} paths={touched_patterns}')\nprint(f'self_modification_detected={self_mod}')\nprint(f'changed_files_count={len(changed)}')\nif protected_touched:\n\
        \    print('::warning::Protected scope touched — Guardian-Deep + mandatory human review will be required (SG-11/SG-12)')\nif self_mod:\n    print('::warning::Self-modification of Guardian/PR-Helper\
        \ logic detected (SG-11) — status will be REVIEW, auto-merge disabled')\nPY\n"
    - name: Job summary
      if: always()
      run: "{\n  echo \"## \U0001F9ED Scope & Risk Detection\"\n  echo \"\"\n  echo \"| Signal | Value |\"\n  echo \"|---|---|\"\n  echo \"| Risk class | **${{ steps.classify.outputs.risk_class }}** |\"\
        \n  echo \"| Protected scope touched | ${{ steps.classify.outputs.protected_scope_touched }} |\"\n  echo \"| Self-modification detected | ${{ steps.classify.outputs.self_modification_detected }}\
        \ |\"\n  echo \"| Code changed | ${{ steps.classify.outputs.code_changed }} |\"\n  echo \"| Workflows changed | ${{ steps.classify.outputs.workflows_changed }} |\"\n  echo \"| Auth changed | ${{\
        \ steps.classify.outputs.auth_changed }} |\"\n  echo \"| HITL changed | ${{ steps.classify.outputs.hitl_changed }} |\"\n  echo \"| Frontend changed | ${{ steps.classify.outputs.frontend_changed\
        \ }} |\"\n  echo \"| Constitution changed | ${{ steps.classify.outputs.constitution_changed }} |\"\n  echo \"| Changed files | ${{ steps.classify.outputs.changed_files_count }} |\"\n  echo \"\"\n\
        \  echo \"Protected paths touched: ${{ steps.classify.outputs.protected_scope_paths }}\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
  guardian-lite:
    name: 🛡️ Guardian-Lite (Fast Security Scan)
    needs: detect-scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      violations_found: ${{ steps.scan.outputs.violations_found }}
      violations_count: ${{ steps.scan.outputs.violations_count }}
      secret_leaks_count: ${{ steps.scan.outputs.secret_leaks_count }}
      dangerous_shell_count: ${{ steps.scan.outputs.dangerous_shell_count }}
      workflow_perms_count: ${{ steps.scan.outputs.workflow_perms_count }}
    steps:
    - name: Checkout HEAD (full history)
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.detect-scope.outputs.head_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Ensure ripgrep available (install if missing)
      run: |
        if ! command -v rg &> /dev/null; then
          echo "ripgrep not found — installing via apt"
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
        fi
        rg --version | head -1
    - name: Guardian-Lite scan (secret leaks + dangerous shell + workflow perms)
      id: scan
      env:
        BASE_SHA: ${{ needs.detect-scope.outputs.base_sha }}
        HEAD_SHA: ${{ needs.detect-scope.outputs.head_sha }}
      run: "set -uo pipefail\nBASE=\"$BASE_SHA\"\nHEAD=\"$HEAD_SHA\"\n\nVIOLATIONS_FILE=/tmp/guardian-lite-violations.jsonl\n: > \"$VIOLATIONS_FILE\"\n\n# Changed files in this PR (any status: added/modified/renamed/deleted)\n\
        mapfile -t CHANGED_FILES < <(git diff --name-only \"${BASE}...${HEAD}\" 2>/dev/null || true)\n\n# Filter to text files that actually exist on HEAD\nSCAN_FILES=()\nfor f in \"${CHANGED_FILES[@]}\"\
        ; do\n  [[ -z \"$f\" ]] && continue\n  [[ -f \"$f\" ]] || continue\n  # Skip binary files (heuristic: file --mime-type)\n  mime=$(file --mime-type -b \"$f\" 2>/dev/null || echo 'application/octet-stream')\n\
        \  case \"$mime\" in\n    text/*) SCAN_FILES+=(\"$f\") ;;\n    application/json|application/yaml|application/x-yaml|application/xml|application/javascript) SCAN_FILES+=(\"$f\") ;;\n    *) continue\
        \ ;;\n  esac\ndone\n\nif [[ ${#SCAN_FILES[@]} -eq 0 ]]; then\n  echo \"::notice::No text files to scan (docs/binary-only PR)\"\n  {\n    echo \"violations_count=0\"\n    echo \"secret_leaks_count=0\"\
        \n    echo \"dangerous_shell_count=0\"\n    echo \"workflow_perms_count=0\"\n    echo \"violations_found=false\"\n  } >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\n# ---- Helper: scan a single pattern,\
        \ append JSONL findings ----\nscan_pattern() {\n  local name=\"$1\"\n  local pattern=\"$2\"\n  local severity=\"$3\"\n  local count=0\n  # rg returns non-zero if no matches; that's fine, we ignore\n\
        \  local matches\n  matches=$(rg -n --no-heading -e \"$pattern\" \"${SCAN_FILES[@]}\" 2>/dev/null || true)\n  if [[ -n \"$matches\" ]]; then\n    while IFS= read -r line; do\n      [[ -z \"$line\"\
        \ ]] && continue\n      # Extract file path (everything before first colon)\n      local file=\"${line%%:*}\"\n      # Truncate the line content for JSON safety; swap quotes\n      local short\n\
        \      short=$(printf '%s' \"$line\" | cut -c1-200 | tr '\"' \"'\")\n      printf '{\"category\":\"%s\",\"severity\":\"%s\",\"file\":\"%s\",\"line\":\"%s\"}\\n' \\\n        \"$name\" \"$severity\"\
        \ \"$file\" \"$short\" >> \"$VIOLATIONS_FILE\"\n      count=$((count + 1))\n    done <<< \"$matches\"\n  fi\n  echo \"$count\"\n}\n\n# ---- Pattern catalog ----\n# Format: scan_pattern <name> <regex>\
        \ <severity>\n# severity: BLOCK (hard fail) or REVIEW (human attention)\nSECRET_LEAKS=0\nDANGEROUS_SHELL=0\nWORKFLOW_PERMS=0\n\n# ----- Secret leak patterns -----\nSECRET_LEAKS=$((SECRET_LEAKS +\
        \ $(scan_pattern aws_access_key_id        'AKIA[0-9A-Z]{16}'                                                BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern aws_secret_access_key    '(?i)aws.{0,20}(?:secret|priv).{0,5}[\\\
        x27\"]?[A-Za-z0-9/+=]{40}'  BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern github_token             'gh[pousr]_[A-Za-z0-9]{36}'                                       BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS\
        \ + $(scan_pattern github_pat                'github_pat_[A-Za-z0-9_]{22,}'                                    BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern slack_token              'xox[baprs]-[A-Za-z0-9-]{10,}'\
        \                                    BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern stripe_secret_key        'sk_live_[A-Za-z0-9]{24,}'                                        BLOCK)))\n\
        SECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern private_key_block         '-----BEGIN [A-Z ]*PRIVATE KEY-----'                              BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern\
        \ google_api_key            'AIza[0-9A-Za-z_-]{35}'                                           BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern jwt_secret_hardcoded     '(?i)(jwt[_-]?secret|jwt[_-]?key).{0,5}[\\\
        x27\"][A-Za-z0-9]{16,}[\\x27\"]'  BLOCK)))\nSECRET_LEAKS=$((SECRET_LEAKS + $(scan_pattern generic_password_assign '(?i)(password|passwd|pwd).{0,3}[=:].{0,5}[\\x27\"][^\\x27\"]{8,}[\\x27\"]'   REVIEW)))\n\
        \n# ----- Dangerous shell patterns -----\nDANGEROUS_SHELL=$((DANGEROUS_SHELL + $(scan_pattern eval_dollar        'eval[[:space:]]+\\$'                                              BLOCK)))\nDANGEROUS_SHELL=$((DANGEROUS_SHELL\
        \ + $(scan_pattern curl_pipe_shell    'curl[[:space:]].*[|][[:space:]]*(sh|bash|zsh)'                   BLOCK)))\nDANGEROUS_SHELL=$((DANGEROUS_SHELL + $(scan_pattern wget_pipe_shell    'wget[[:space:]].*[|][[:space:]]*(sh|bash|zsh)'\
        \                   BLOCK)))\nDANGEROUS_SHELL=$((DANGEROUS_SHELL + $(scan_pattern sudo_curl_pipe_sh  'sudo[[:space:]].*curl.*[|].*(sh|bash)'                            BLOCK)))\nDANGEROUS_SHELL=$((DANGEROUS_SHELL\
        \ + $(scan_pattern chmod_777          'chmod[[:space:]]+777'                                            REVIEW)))\nDANGEROUS_SHELL=$((DANGEROUS_SHELL + $(scan_pattern disable_set_e     'set[[:space:]]+\\\
        +e'                                               REVIEW)))\n\n# ----- Workflow permission audit -----\nWORKFLOW_PERMS=$((WORKFLOW_PERMS + $(scan_pattern workflow_perm_write  'permissions:.*:.*write'\
        \                                          REVIEW)))\nWORKFLOW_PERMS=$((WORKFLOW_PERMS + $(scan_pattern pull_request_target 'pull_request_target:'                                            REVIEW)))\n\
        \nTOTAL=$((SECRET_LEAKS + DANGEROUS_SHELL + WORKFLOW_PERMS))\n\n{\n  echo \"violations_count=$TOTAL\"\n  echo \"secret_leaks_count=$SECRET_LEAKS\"\n  echo \"dangerous_shell_count=$DANGEROUS_SHELL\"\
        \n  echo \"workflow_perms_count=$WORKFLOW_PERMS\"\n  if [[ $TOTAL -gt 0 ]]; then\n    echo \"violations_found=true\"\n  else\n    echo \"violations_found=false\"\n  fi\n} >> \"$GITHUB_OUTPUT\"\n\
        \necho \"Guardian-Lite: $TOTAL findings (secrets=$SECRET_LEAKS shell=$DANGEROUS_SHELL perms=$WORKFLOW_PERMS)\"\nif [[ $TOTAL -gt 0 ]]; then\n  echo \"::warning::Guardian-Lite found $TOTAL potential\
        \ security findings — see artifact guardian-lite-violations.jsonl\"\n  head -20 \"$VIOLATIONS_FILE\" || true\nelse\n  echo \"::notice::Guardian-Lite: no findings\"\nfi\n"
    - name: Upload violations artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: guardian-lite-violations
        path: /tmp/guardian-lite-violations.jsonl
        retention-days: 14
        if-no-files-found: ignore
  guardian-deep:
    name: 🔬 Guardian-Deep (Deep Security Analysis)
    needs:
    - detect-scope
    - guardian-lite
    if: "${{\n  needs.detect-scope.outputs.risk_class == 'HIGH'\n  || needs.detect-scope.outputs.risk_class == 'CRITICAL'\n  || needs.detect-scope.outputs.protected_scope_touched == 'true'\n}}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deep_violations: ${{ steps.deep.outputs.deep_violations }}
      deep_violations_count: ${{ steps.deep.outputs.deep_violations_count }}
      auth_boundary_regression: ${{ steps.deep.outputs.auth_boundary_regression }}
      hitl_bypass: ${{ steps.deep.outputs.hitl_bypass }}
      dependency_delta: ${{ steps.deep.outputs.dependency_delta }}
      workflow_call_target_missing: ${{ steps.deep.outputs.workflow_call_target_missing }}
    steps:
    - name: Checkout HEAD (full history)
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.detect-scope.outputs.head_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Deep security analysis (auth boundary / HITL bypass / dep delta / workflow_call integrity)
      id: deep
      env:
        BASE_SHA: ${{ needs.detect-scope.outputs.base_sha }}
        HEAD_SHA: ${{ needs.detect-scope.outputs.head_sha }}
      run: "set -uo pipefail\nBASE=\"$BASE_SHA\"\nHEAD=\"$HEAD_SHA\"\n\nDEEP_FILE=/tmp/guardian-deep-findings.jsonl\n: > \"$DEEP_FILE\"\nAUTH_BOUNDARY=\"false\"\nHITL_BYPASS=\"false\"\nDEP_DELTA=\"false\"\
        \nWORKFLOW_TARGET_MISSING=\"false\"\n\n# ---- Check 1: Auth boundary regression (BLOCK) ----\n# Look for REMOVED auth decorators / tenant boundary checks in\n# modified auth/security files. Removals\
        \ signal bypass (SG-07).\nAUTH_REMOVED=$(git diff \"${BASE}...${HEAD}\" -- 'backend/api/routes/auth.py' 'backend/api/routes/admin_auth.py' 'backend/core/firebase_auth.py' 'backend/api/dependencies.py' 'backend/core/security/' 2>/dev/null \\\n  | grep -E '^-' | grep -v '^---' \\\n  | grep -E '(@requires_auth|@require_auth|@admin_only|require_admin|get_current_user|verify_jwt|check_permission|tenant_id|verify_tenant)'\
        \ \\\n  || true)\nif [[ -n \"$AUTH_REMOVED\" ]]; then\n  printf '{\"category\":\"auth_boundary_regression\",\"severity\":\"BLOCK\",\"evidence\":\"authentication/authorization protections removed\
        \ in diff\"}\\n' >> \"$DEEP_FILE\"\n  AUTH_BOUNDARY=\"true\"\n  echo \"::error::Auth boundary regression detected — protections removed (SG-07)\"\nfi\n\n# ---- Check 2: HITL bypass (BLOCK) ----\n\
        # Look for changes in backend/services/hitl/** that disable review enforcement\nHITL_DIFF=$(git diff \"${BASE}...${HEAD}\" -- 'backend/services/hitl/' 2>/dev/null \\\n  | grep -E '^[+-]' | grep -v '^+++' | grep\
        \ -v '^---' \\\n  | grep -iE '(auto.?approve|skip.?review|bypass|disable.?review|always.?allow|force.?approve|review_required.{0,5}=.{0,5}false)' \\\n  || true)\nif [[ -n \"$HITL_DIFF\" ]]; then\n\
        \  printf '{\"category\":\"hitl_bypass\",\"severity\":\"BLOCK\",\"evidence\":\"HITL enforcement weakening pattern detected\"}\\n' >> \"$DEEP_FILE\"\n  HITL_BYPASS=\"true\"\n  echo \"::error::HITL\
        \ bypass pattern detected (SG-09/SG-12)\"\nfi\n\n# ---- Check 3: Dependency delta (REVIEW) ----\n# Detect changes to lockfiles / dependency manifests — supply-chain risk\nDEP_FILES=$(git diff --name-only\
        \ \"${BASE}...${HEAD}\" 2>/dev/null \\\n  | grep -E '(poetry\\.lock|package-lock\\.json|pnpm-lock\\.yaml|requirements.*\\.txt|pyproject\\.toml|package\\.json)$' \\\n  || true)\nif [[ -n \"$DEP_FILES\"\
        \ ]]; then\n  printf '{\"category\":\"dependency_delta\",\"severity\":\"REVIEW\",\"evidence\":\"Dependency manifest changed — review for supply-chain risk\"}\\n' >> \"$DEEP_FILE\"\n  DEP_DELTA=\"\
        true\"\n  echo \"::notice::Dependency delta detected: $DEP_FILES\"\nfi\n\n# ---- Check 4: workflow_call target integrity (REVIEW/BLOCK) ----\n# If a workflow uses `reusable workflow`,\
        \ verify\n# foo.yml exists AND exposes workflow_call: trigger (SG-11 Bootstrap Trust).\nWORKFLOW_DIFF=$(git diff --name-only \"${BASE}...${HEAD}\" 2>/dev/null \\\n  | grep -E '^\\.github/workflows/.*\\\
        .ya?ml$' || true)\nif [[ -n \"$WORKFLOW_DIFF\" ]]; then\n  while IFS= read -r wf; do\n    [[ -z \"$wf\" ]] && continue\n    [[ -f \"$wf\" ]] || continue\n    # Find `reusable workflow`\
        \ references in this file\n    while IFS=: read -r ln content; do\n      [[ -z \"$content\" ]] && continue\n      target=$(echo \"$content\" | sed -E 's/.*uses:[[:space:]]*(\\S+).*/\\1/' | sed 's|@.*||')\n\
        \      if [[ \"$target\" == ./.github/workflows/* ]]; then\n        full_path=\"${target#./}\"\n        if [[ ! -f \"$full_path\" ]]; then\n          printf '{\"category\":\"workflow_call_target_missing\"\
        ,\"severity\":\"BLOCK\",\"file\":\"%s\",\"line\":%s,\"target\":\"%s\",\"evidence\":\"workflow_call target does not exist\"}\\n' \"$wf\" \"$ln\" \"$target\" >> \"$DEEP_FILE\"\n          WORKFLOW_TARGET_MISSING=\"\
        true\"\n          echo \"::error::workflow_call target missing: $wf → $target\"\n        else\n          # Check that target has workflow_call: trigger\n          if ! grep -qE '^[[:space:]]*workflow_call:'\
        \ \"$full_path\" 2>/dev/null; then\n            printf '{\"category\":\"workflow_call_no_trigger\",\"severity\":\"REVIEW\",\"file\":\"%s\",\"line\":%s,\"target\":\"%s\",\"evidence\":\"target lacks\
        \ workflow_call: trigger\"}\\n' \"$wf\" \"$ln\" \"$target\" >> \"$DEEP_FILE\"\n            WORKFLOW_TARGET_MISSING=\"true\"\n            echo \"::warning::workflow_call target lacks trigger: $wf\
        \ → $target\"\n          fi\n        fi\n      fi\n    done < <(grep -nE '^[[:space:]]*uses:[[:space:]]*\\./\\.github/workflows/' \"$wf\" 2>/dev/null || true)\n  done <<< \"$WORKFLOW_DIFF\"\nfi\n\nDEEP_COUNT=$(wc\
        \ -l < \"$DEEP_FILE\" 2>/dev/null || echo 0)\nDEEP_COUNT=${DEEP_COUNT// /}\n\n{\n  echo \"deep_violations_count=$DEEP_COUNT\"\n  echo \"auth_boundary_regression=$AUTH_BOUNDARY\"\n  echo \"hitl_bypass=$HITL_BYPASS\"\
        \n  echo \"dependency_delta=$DEP_DELTA\"\n  echo \"workflow_call_target_missing=$WORKFLOW_TARGET_MISSING\"\n  if [[ $DEEP_COUNT -gt 0 ]]; then\n    echo \"deep_violations=true\"\n  else\n    echo\
        \ \"deep_violations=false\"\n  fi\n} >> \"$GITHUB_OUTPUT\"\n\necho \"Guardian-Deep: $DEEP_COUNT findings\"\nif [[ -s \"$DEEP_FILE\" ]]; then\n  cat \"$DEEP_FILE\"\nelse\n  echo \"::notice::Guardian-Deep:\
        \ no findings\"\nfi\n"
    - name: Upload deep findings artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: guardian-deep-findings
        path: /tmp/guardian-deep-findings.jsonl
        retention-days: 14
        if-no-files-found: ignore
  pr-agent-helper:
    name: 🔗 PR Agent Helper (Issue Link + Preservation Guard)
    needs: detect-scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      issue_linked: ${{ steps.check.outputs.issue_linked }}
      preservation_guard_ok: ${{ steps.check.outputs.preservation_guard_ok }}
      issue_refs: ${{ steps.check.outputs.issue_refs }}
      deleted_protected_count: ${{ steps.check.outputs.deleted_protected_count }}
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-scope.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Issue link + preservation guard (non-fatal)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.detect-scope.outputs.pr_number }}
          BASE_SHA: ${{ needs.detect-scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect-scope.outputs.head_sha }}
        run: |
          # Non-fatal: this step outputs signals, pr-gate synthesizes final decision.
          set +o errexit  # CRITICAL: do not exit on error
          
          PR_BODY="$(gh pr view "$PR" --json body -q .body 2>/dev/null || echo '')"
          PR_TITLE="$(gh pr view "$PR" --json title -q .title 2>/dev/null || echo '')"
          
          # Issue link check (Refs #N, Closes #N, etc.)
          ISSUE_REFS=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -oE '(close[sd]?|fix(es|ed)?|resolve[sd]?|refs?|see)[[:space:]]+#[0-9]+' \
            | grep -oE '#[0-9]+' | sort -u | tr '\n' ' ' | sed 's/ $//')
          
          if [[ -n "$ISSUE_REFS" ]]; then
            echo "issue_linked=true" >> "$GITHUB_OUTPUT"
            echo "issue_refs=$ISSUE_REFS" >> "$GITHUB_OUTPUT"
            echo "::notice::PR linked to issue(s): $ISSUE_REFS"
          else
            echo "issue_linked=false" >> "$GITHUB_OUTPUT"
            echo "issue_refs=" >> "$GITHUB_OUTPUT"
            echo "::warning::No issue reference found in PR title/body — recommend 'Closes #N' or 'Refs #N'"
          fi
          
          # Preservation guard: check if protected files were DELETED
          DELETED_FILES=$(git diff --name-only --diff-filter=D "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null || echo "")
          DELETED_PROTECTED_COUNT=0
          PRESERVATION_OK=true
          
          if [[ -n "$DELETED_FILES" ]] && [[ -f security/policies/protected-scopes.yml ]]; then
            # Use python to match deleted files against protected-scopes patterns
            DELETED_PROTECTED_COUNT=$(printf '%s\n' "$DELETED_FILES" | python3 -c "
          import sys, yaml
          deleted = [l.strip() for l in sys.stdin if l.strip()]
          with open('security/policies/protected-scopes.yml') as f:
              policy = yaml.safe_load(f)
          patterns = [p['path'] for p in (policy.get('protected_scopes') or [])]
          hits = 0
          for path in deleted:
              for pat in patterns:
                  if pat.endswith('/**'):
                      if path.startswith(pat[:-3]):
                          hits += 1; break
                  elif path == pat:
                      hits += 1; break
          print(hits)
          " 2>/dev/null || echo 0)
            
            if [[ "$DELETED_PROTECTED_COUNT" -gt 0 ]]; then
              PRESERVATION_OK=false
              echo "::warning::Protected file deletion detected ($DELETED_PROTECTED_COUNT files) — pr-gate will BLOCK"
            fi
          fi
          
          echo "preservation_guard_ok=$PRESERVATION_OK" >> "$GITHUB_OUTPUT"
          echo "deleted_protected_count=$DELETED_PROTECTED_COUNT" >> "$GITHUB_OUTPUT"
          
          if [[ "$PRESERVATION_OK" == "true" ]]; then
            echo "::notice::Preservation guard passed — no protected files deleted"
          fi
          # ALWAYS exit 0 — pr-gate makes the final BLOCK/PASS decision
          exit 0

  pr-gate:
    name: 🚦 Unified PR Gate (Security Decision Contract)
    needs:
    - detect-scope
    - guardian-lite
    - guardian-deep
    - pr-agent-helper
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      status: ${{ steps.contract.outputs.status }}
      risk_class: ${{ steps.contract.outputs.risk_class }}
      evidence_summary: ${{ steps.contract.outputs.evidence_summary }}
    steps:
    - name: Synthesize Security Decision Contract
      id: contract
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ needs.detect-scope.outputs.pr_number }}
        RISK_CLASS: ${{ needs.detect-scope.outputs.risk_class }}
        PROTECTED_SCOPE: ${{ needs.detect-scope.outputs.protected_scope_touched }}
        SELF_MOD: ${{ needs.detect-scope.outputs.self_modification_detected }}
        PROTECTED_PATHS: ${{ needs.detect-scope.outputs.protected_scope_paths }}
        CHANGED_FILES_COUNT: ${{ needs.detect-scope.outputs.changed_files_count }}
        LITE_VIOLATIONS: ${{ needs.guardian-lite.outputs.violations_found }}
        LITE_COUNT: ${{ needs.guardian-lite.outputs.violations_count }}
        SECRET_LEAKS: ${{ needs.guardian-lite.outputs.secret_leaks_count }}
        SHELL_VIOLATIONS: ${{ needs.guardian-lite.outputs.dangerous_shell_count }}
        PERMS_VIOLATIONS: ${{ needs.guardian-lite.outputs.workflow_perms_count }}
        DEEP_RESULT: ${{ needs.guardian-deep.result }}
        DEEP_VIOLATIONS: ${{ needs.guardian-deep.outputs.deep_violations }}
        DEEP_COUNT: ${{ needs.guardian-deep.outputs.deep_violations_count }}
        AUTH_BOUNDARY: ${{ needs.guardian-deep.outputs.auth_boundary_regression }}
        HITL_BYPASS: ${{ needs.guardian-deep.outputs.hitl_bypass }}
        ISSUE_LINKED: ${{ needs.pr-agent-helper.outputs.issue_linked }}
        ISSUE_REFS: ${{ needs.pr-agent-helper.outputs.issue_refs }}
        PRESERVATION_OK: ${{ needs.pr-agent-helper.outputs.preservation_guard_ok }}
        DELETED_PROTECTED_COUNT: ${{ needs.pr-agent-helper.outputs.deleted_protected_count }}
        LIFECYCLE_RESULT: ${{ needs.pr-lifecycle.result }}
      run: "set -uo pipefail\n\n# ----- Helper: default empty/null → 'false' or '0' for safe arithmetic -----\nto_bool() {\n  local v=\"$1\"\n  [[ -z \"$v\" || \"$v\" == \"null\" ]] && echo \"false\" ||\
        \ echo \"$v\"\n}\nto_int() {\n  local v=\"$1\"\n  [[ -z \"$v\" || \"$v\" == \"null\" || \"$v\" == \"false\" ]] && echo 0 || echo \"$v\"\n}\n\n# Normalize all inputs\nLITE_COUNT_INT=$(to_int \"$LITE_COUNT\"\
        )\nDEEP_COUNT_INT=$(to_int \"$DEEP_COUNT\")\nSECRET_LEAKS_INT=$(to_int \"$SECRET_LEAKS\")\nSHELL_VIOLATIONS_INT=$(to_int \"$SHELL_VIOLATIONS\")\nPERMS_VIOLATIONS_INT=$(to_int \"$PERMS_VIOLATIONS\"\
        )\nDELETED_PROTECTED_INT=$(to_int \"$DELETED_PROTECTED_COUNT\")\nAUTH_BOUNDARY_B=$(to_bool \"$AUTH_BOUNDARY\")\nHITL_BYPASS_B=$(to_bool \"$HITL_BYPASS\")\nPRESERVATION_OK_B=$(to_bool \"$PRESERVATION_OK\"\
        )\nSELF_MOD_B=$(to_bool \"$SELF_MOD\")\nPROTECTED_SCOPE_B=$(to_bool \"$PROTECTED_SCOPE\")\nLITE_VIOLATIONS_B=$(to_bool \"$LITE_VIOLATIONS\")\nDEEP_VIOLATIONS_B=$(to_bool \"$DEEP_VIOLATIONS\")\n\
        ISSUE_LINKED_B=$(to_bool \"$ISSUE_LINKED\")\n\n# ---------------------------------------------------------\n# Decision synthesis (per docs/security/SECURITY_GUARDIAN.md)\n#   BLOCK  → new evidence-backed\
        \ violations (SG-10)\n#   REVIEW → self-modification detected (SG-11 Bootstrap Trust)\n#   WARN   → info-only findings (no hard violations)\n#   PASS   → clean (no new findings; baseline debt tolerated)\n\
        # ---------------------------------------------------------\nSTATUS=\"PASS\"\nREASON=\"No new findings introduced\"\n\n# Count BLOCK-severity findings: secret leaks + dangerous shell +\n# auth boundary\
        \ removal + HITL bypass + protected file deletion\nBLOCK_COUNT=0\nBLOCK_COUNT=$((BLOCK_COUNT + SECRET_LEAKS_INT))\nBLOCK_COUNT=$((BLOCK_COUNT + SHELL_VIOLATIONS_INT))\n[[ \"$AUTH_BOUNDARY_B\" ==\
        \ \"true\" ]] && BLOCK_COUNT=$((BLOCK_COUNT + 1))\n[[ \"$HITL_BYPASS_B\" == \"true\" ]] && BLOCK_COUNT=$((BLOCK_COUNT + 1))\n[[ \"$PRESERVATION_OK_B\" != \"true\" ]] && BLOCK_COUNT=$((BLOCK_COUNT\
        \ + DELETED_PROTECTED_INT))\n\nif [[ $BLOCK_COUNT -gt 0 ]]; then\n  STATUS=\"BLOCK\"\n  REASON=\"New evidence-backed violations: secrets=$SECRET_LEAKS_INT, dangerous_shell=$SHELL_VIOLATIONS_INT,\
        \ auth_boundary_regression=$AUTH_BOUNDARY_B, hitl_bypass=$HITL_BYPASS_B, protected_deletions=$DELETED_PROTECTED_INT (SG-01/SG-04/SG-07/SG-09)\"\nelif [[ \"$SELF_MOD_B\" == \"true\" ]]; then\n  STATUS=\"\
        REVIEW\"\n  REASON=\"Self-modification of Guardian/PR-Helper logic detected (SG-11 Bootstrap Trust) — mandatory human review, auto-merge disabled\"\nelif [[ \"$DEEP_COUNT_INT\" -gt 0 ]]; then\n\
        \  STATUS=\"REVIEW\"\n  REASON=\"Guardian-Deep findings require human review (dependency_delta / workflow_call target integrity)\"\nelif [[ \"$PERMS_VIOLATIONS_INT\" -gt 0 ]]; then\n  STATUS=\"\
        WARN\"\n  REASON=\"Info-only findings: workflow permissions review / pull_request_target usage\"\nelif [[ \"$LITE_COUNT_INT\" -gt 0 ]]; then\n  STATUS=\"WARN\"\n  REASON=\"Info-only findings (REVIEW-severity\
        \ patterns)\"\nfi\n\n# ----- Write Security Decision Contract to file via Python -----\n# Using Python avoids bash heredoc indentation pitfalls inside the\n# YAML literal block. Python writes the\
        \ contract directly to disk\n# with canonical (column-0) indentation.\nexport STATUS REASON RISK_CLASS PROTECTED_SCOPE_B SELF_MOD_B PROTECTED_PATHS\nexport LITE_VIOLATIONS_B LITE_COUNT_INT SECRET_LEAKS_INT\
        \ SHELL_VIOLATIONS_INT PERMS_VIOLATIONS_INT\nexport DEEP_RESULT DEEP_VIOLATIONS_B DEEP_COUNT_INT AUTH_BOUNDARY_B HITL_BYPASS_B\nexport ISSUE_LINKED_B ISSUE_REFS PRESERVATION_OK_B DELETED_PROTECTED_INT\
        \ LIFECYCLE_RESULT\nexport CHANGED_FILES_COUNT BLOCK_COUNT PR TIMESTAMP\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\nexport TIMESTAMP\nexport GITHUB_REPOSITORY=\"${{ github.repository }}\"\nexport\
        \ GITHUB_RUN_ID=\"${{ github.run_id }}\"\n\nCONTRACT_FILE=/tmp/security-decision-contract.yaml\npython3 - <<'PY'\nimport json\nimport os\n\ndef esc(s):\n    if s is None:\n        return '\"\"'\n\
        \    s = str(s).replace('\"', \"'\")\n    return f'\"{s}\"'\n\nprotected_paths_raw = os.environ.get('PROTECTED_PATHS', '[]')\ntry:\n    protected_paths = json.loads(protected_paths_raw) if protected_paths_raw\
        \ else []\nexcept Exception:\n    protected_paths = []\n\nlines = [\n    f\"# Security Decision Contract — synthesized by pr-pipeline.yml (pr-gate)\",\n    f\"# Generated: {os.environ.get('TIMESTAMP',\
        \ '')}\",\n    f\"# PR: #{os.environ.get('PR', '')}\",\n    f\"# Repository: {os.environ.get('GITHUB_REPOSITORY', '')}\",\n    f\"# Run: {os.environ.get('GITHUB_RUN_ID', '')}\",\n    \"\",\n   \
        \ \"guardian_decision:\",\n    f\"  status: {esc(os.environ.get('STATUS', 'PASS'))}\",\n    f\"  risk_class: {esc(os.environ.get('RISK_CLASS', 'LOW'))}\",\n    f\"  protected_scope_touched: {os.environ.get('PROTECTED_SCOPE_B',\
        \ 'false')}\",\n    f\"  self_modification_detected: {os.environ.get('SELF_MOD_B', 'false')}\",\n    f\"  protected_scope_paths: {json.dumps(protected_paths)}\",\n    \"\",\n    \"  evidence_summary:\"\
        ,\n    f\"    decision_reason: {esc(os.environ.get('REASON', ''))}\",\n    \"\",\n    \"    guardian_lite:\",\n    \"      ran: true\",\n    f\"      violations_found: {os.environ.get('LITE_VIOLATIONS_B',\
        \ 'false')}\",\n    f\"      violations_count: {os.environ.get('LITE_COUNT_INT', 0)}\",\n    f\"      secret_leaks: {os.environ.get('SECRET_LEAKS_INT', 0)}\",\n    f\"      dangerous_shell: {os.environ.get('SHELL_VIOLATIONS_INT',\
        \ 0)}\",\n    f\"      workflow_perms_review: {os.environ.get('PERMS_VIOLATIONS_INT', 0)}\",\n    \"\",\n    \"    guardian_deep:\",\n    f\"      ran: {str(os.environ.get('DEEP_RESULT') == 'success').lower()}\"\
        ,\n    f\"      result: {esc(os.environ.get('DEEP_RESULT', 'skipped'))}\",\n    f\"      deep_violations: {os.environ.get('DEEP_VIOLATIONS_B', 'false')}\",\n    f\"      deep_violations_count: {os.environ.get('DEEP_COUNT_INT',\
        \ 0)}\",\n    f\"      auth_boundary_regression: {os.environ.get('AUTH_BOUNDARY_B', 'false')}\",\n    f\"      hitl_bypass: {os.environ.get('HITL_BYPASS_B', 'false')}\",\n    \"\",\n    \"    pr_agent_helper:\"\
        ,\n    \"      ran: true\",\n    f\"      issue_linked: {os.environ.get('ISSUE_LINKED_B', 'false')}\",\n    f\"      issue_refs: {esc(os.environ.get('ISSUE_REFS', ''))}\",\n    f\"      preservation_guard_ok:\
        \ {os.environ.get('PRESERVATION_OK_B', 'false')}\",\n    f\"      deleted_protected_count: {os.environ.get('DELETED_PROTECTED_INT', 0)}\",\n    \"\",\n    \"    pr_lifecycle:\",\n    f\"      result:\
        \ {esc(os.environ.get('LIFECYCLE_RESULT', 'skipped'))}\",\n    \"\",\n    f\"  block_count: {os.environ.get('BLOCK_COUNT', 0)}\",\n    f\"  changed_files_count: {os.environ.get('CHANGED_FILES_COUNT',\
        \ 0)}\",\n    \"\",\n]\n\ncontract_text = \"\\n\".join(lines)\ncontract_path = \"/tmp/security-decision-contract.yaml\"\nwith open(contract_path, \"w\", encoding=\"utf-8\") as f:\n    f.write(contract_text)\n\
        print(contract_text)\nPY\n\necho \"----- Security Decision Contract (above) -----\"\n\n# ----- Build the PR comment (Markdown) -----\nCOMMENT_FILE=/tmp/pr-gate-comment.md\n{\n  printf '%s\\n' \"\
        ## \U0001F6A6 Unified PR Gate — Security Decision Contract\" ''\n  printf '%s\\n' \"| Field | Value |\" \"|---|---|\"\n  printf '| **Status** | **`%s`** |\\n' \"$STATUS\"\n  printf '| Risk class\
        \ | `%s` |\\n' \"$RISK_CLASS\"\n  printf '| Protected scope touched | `%s` |\\n' \"$PROTECTED_SCOPE_B\"\n  printf '| Self-modification detected | `%s` |\\n' \"$SELF_MOD_B\"\n  printf '| Issue link\
        \ | `%s` %s |\\n' \"$ISSUE_LINKED_B\" \"${ISSUE_REFS:+($ISSUE_REFS)}\"\n  printf '| Preservation guard | `%s` (deleted protected: %s) |\\n' \"$PRESERVATION_OK_B\" \"$DELETED_PROTECTED_INT\"\n  printf\
        \ '| Guardian-Lite findings | `%s` (secrets=%s, shell=%s, perms=%s) |\\n' \"$LITE_COUNT_INT\" \"$SECRET_LEAKS_INT\" \"$SHELL_VIOLATIONS_INT\" \"$PERMS_VIOLATIONS_INT\"\n  printf '| Guardian-Deep\
        \ findings | `%s` (auth=%s, hitl=%s) |\\n' \"$DEEP_COUNT_INT\" \"$AUTH_BOUNDARY_B\" \"$HITL_BYPASS_B\"\n  printf '| Guardian-Deep ran | `%s` (%s) |\\n' \"$([[ \"$DEEP_RESULT\" == \"success\" ]]\
        \ && echo true || echo false)\" \"${DEEP_RESULT:-skipped}\"\n  printf '| PR Lifecycle | `%s` |\\n' \"${LIFECYCLE_RESULT:-skipped}\"\n  printf '| Changed files | `%s` |\\n' \"${CHANGED_FILES_COUNT:-0}\"\
        \n  printf '\\n**Decision:** %s\\n' \"$REASON\"\n  printf '\\n<details><summary>\U0001F4C4 Full Security Decision Contract (YAML)</summary>\\n\\n```yaml\\n'\n  cat \"$CONTRACT_FILE\"\n  printf '\\\
        n```\\n\\n</details>\\n'\n  printf '\\n---\\n_Auto-generated by `pr-pipeline.yml` (Phase 2 of `implementation_plan.md`). Edit this comment and it will be overwritten on the next run._\\n'\n} > \"\
        $COMMENT_FILE\"\n\n# ----- Post comment (deduped — edit existing if present) -----\nEXISTING_COMMENT_ID=$(gh pr view \"$PR\" --json comments \\\n  -q '[.comments[] | select(.body | contains(\"\U0001F6A6\
        \ Unified PR Gate — Security Decision Contract\"))][0].databaseId' \\\n  2>/dev/null || true)\nif [[ -n \"$EXISTING_COMMENT_ID\" && \"$EXISTING_COMMENT_ID\" != \"null\" ]]; then\n  gh pr comment\
        \ \"$PR\" --edit-comment \"$EXISTING_COMMENT_ID\" --body-file \"$COMMENT_FILE\" \\\n    || gh pr comment \"$PR\" --body-file \"$COMMENT_FILE\"\nelse\n  gh pr comment \"$PR\" --body-file \"$COMMENT_FILE\"\
        \nfi\n\n# ----- Output contract fields to job outputs -----\n{\n  echo \"status=$STATUS\"\n  echo \"risk_class=$RISK_CLASS\"\n  echo \"evidence_summary<<PR_GATE_CONTRACT_EOF\"\n  cat \"$CONTRACT_FILE\"\
        \n  echo \"PR_GATE_CONTRACT_EOF\"\n} >> \"$GITHUB_OUTPUT\"\n\n# ----- Apply labels based on decision -----\ncase \"$STATUS\" in\n  BLOCK)\n    gh label create \"pr-gate:blocked\" --color B60205\
        \ \\\n      --description \"PR Gate: BLOCKED by Security Guardian (new violations)\" --force 2>/dev/null || true\n    gh pr edit \"$PR\" --add-label \"pr-gate:blocked\" 2>/dev/null || true\n   \
        \ ;;\n  REVIEW)\n    gh label create \"pr-gate:needs-review\" --color FBCA04 \\\n      --description \"PR Gate: mandatory human review (self-mod / deep findings)\" --force 2>/dev/null || true\n\
        \    gh pr edit \"$PR\" --add-label \"pr-gate:needs-review\" 2>/dev/null || true\n    ;;\n  WARN)\n    gh label create \"pr-gate:warning\" --color FBCA04 \\\n      --description \"PR Gate: info-only\
        \ findings\" --force 2>/dev/null || true\n    gh pr edit \"$PR\" --add-label \"pr-gate:warning\" 2>/dev/null || true\n    ;;\n  PASS)\n    gh label create \"pr-gate:passed\" --color 0E8A16 \\\n\
        \      --description \"PR Gate: passed Security Guardian\" --force 2>/dev/null || true\n    gh pr edit \"$PR\" --add-label \"pr-gate:passed\" 2>/dev/null || true\n    ;;\nesac\n\n# ----- Set final\
        \ exit code (status check) -----\nif [[ \"$STATUS\" == \"BLOCK\" ]]; then\n  echo \"::error::PR Gate decision: BLOCK — $REASON\"\n  exit 1\nelif [[ \"$STATUS\" == \"REVIEW\" ]]; then\n  echo \"\
        ::warning::PR Gate decision: REVIEW — $REASON (auto-merge disabled; human review required)\"\n  exit 0\nelse\n  echo \"::notice::PR Gate decision: $STATUS — $REASON\"\n  exit 0\nfi\n"
    - name: Job summary
      if: always()
      run: "{\n  echo \"## \U0001F6A6 Unified PR Gate\"\n  echo \"\"\n  echo \"Final status: **${{ steps.contract.outputs.status }}**\"\n  echo \"Risk class: ${{ steps.contract.outputs.risk_class }}\"\n\
        \  echo \"\"\n  echo \"Security Decision Contract posted as PR comment.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"

  pr-lifecycle:
    name: 🤖 PR Lifecycle (PR Helper)
    needs:
      - detect-scope
      - pr-gate
    if: needs.pr-gate.outputs.status != 'BLOCK'
    uses: ./.github/workflows/pr-helper.yml
    with:
      pr_number: ${{ needs.detect-scope.outputs.pr_number }}
    secrets: inherit
