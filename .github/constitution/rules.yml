# SupremeAI Constitution Audit — Stable Rule Definitions
# This is the canonical list of all constitutional rules. Categories and IDs are immutable.
# Severity can change only with explicit governance approval.

meta:
  rule_000:
    title: "The Auditor Must Comply"
    description: "The Constitution Audit Engine itself must not violate architectural principles."
    severity: BLOCK
    category: meta

architecture:
  rule_001:
    title: "No Local-Machine Dependency"
    description: "Production code must not reference localhost, 127.0.0.1, or Windows-specific paths."
    severity: BLOCK
    fixable: true
    category: arch

  rule_002:
    title: "Reuse Before Create"
    description: "Existing capabilities must be composed before introducing new isolated modules."
    severity: WARN
    fixable: false
    category: arch

  rule_003:
    title: "Capability Before Module"
    description: "Module growth must follow capability reuse; building complete circles, not isolated features."
    severity: WARN
    fixable: false
    category: arch

  rule_004:
    title: "No Unnecessary Duplication"
    description: "Isolated code fragmentation and duplicate implementations are prohibited."
    severity: WARN
    fixable: false
    category: arch

  rule_005:
    title: "Architecture Preservation & DRY 3-Pipeline Principle"
    description: "Existing architecture must remain intact unless a change is strictly required. CI pipelines must follow the DRY, reusable 3-pipeline model: 1 Gate for PR, 1 Gate for Merge Train, 1 Pipeline for Main."
    severity: BLOCK
    fixable: false
    category: arch

  rule_006:
    title: "Topological Layering Order"
    description: "UI/API-এর কাজ (Layer 4/5) নিচের লেয়ারের (Schemas/Tools/Workers/Core) grounding ছাড়া বা Reflection Evidence (why + alternatives_rejected) ছাড়া করা নিষিদ্ধ — Capability Before Construction।"
    severity: BLOCK
    fixable: false
    category: arch

security:
  rule_001:
    title: "Backend Authorization Is Final"
    description: "Authorization decisions must be enforced on the backend; client-side checks are insufficient."
    severity: WARN
    fixable: false
    category: sec

  rule_002:
    title: "No Secret Hardcoding"
    description: "Code must not contain hardcoded API keys, tokens, passwords, or private credentials."
    severity: BLOCK
    fixable: false
    category: sec

  rule_003:
    title: "No Unsafe Privilege Elevation"
    description: "Principle of least privilege must be enforced; no elevation without explicit authorization."
    severity: BLOCK
    fixable: false
    category: sec

configuration:
  rule_001:
    title: "Configuration/Policy Over Hardcoding"
    description: "Business logic and runtime decisions must be dynamic, not hardcoded."
    severity: WARN
    fixable: false
    category: cfg
  rule_002:
    title: "User Behavior Must Be Data-Driven"
    description: "Feature flags and policy decisions must be observable and configurable."
    severity: INFO
    fixable: false
    category: cfg

mcp_integration:
  rule_001:
    title: "MCP Is Infrastructure, Not Customer UX"
    description: "MCP complexity must be hidden from end users; only stable capabilities exposed."
    severity: WARN
    fixable: false
    category: mcp

  rule_002:
    title: "Unified Capability Contract"
    description: "Every capability must follow a consistent interface."
    severity: WARN
    fixable: false
    category: mcp

  rule_003:
    title: "Connection Must Be Environment-Agnostic"
    description: "Integrations must work identically across development, staging, production."
    severity: WARN
    fixable: false
    category: mcp

reliability:
  rule_001:
    title: "No Silent Failure"
    description: "Exception handlers must not silently swallow errors; they must log or re-raise."
    severity: BLOCK
    fixable: false
    category: rel

  rule_002:
    title: "Errors Must Be Observable"
    description: "Logging and telemetry are mandatory for production-critical paths."
    severity: WARN
    fixable: false
    category: rel

  rule_003:
    title: "New Features Must Be Testable"
    description: "New code must include test coverage; untestable features are not production-ready."
    severity: WARN
    fixable: false
    category: rel

cost:
  rule_001:
    title: "No Unapproved Paid Infrastructure"
    description: "Paid cloud services must be explicitly approved; free-tier limits protected."
    severity: BLOCK
    fixable: false
    category: cost

  rule_002:
    title: "Resource Usage Must Be Observable"
    description: "Infrastructure cost and resource consumption must be monitored."
    severity: INFO
    fixable: false
    category: cost

performance:
  rule_001:
    title: "Lightweight Dependencies"
    description: "Unnecessary heavy libraries are prohibited; impact on bundle size must be justified."
    severity: WARN
    fixable: false
    category: perf

  rule_002:
    title: "Bundle/Memory Limits"
    description: "Browser console errors and memory leaks must be prevented."
    severity: WARN
    fixable: false
    category: perf

customer_ux:
  rule_001:
    title: "Zero / Near-Zero Complexity"
    description: "User workflows must be single-click or near-single-click execution."
    severity: INFO
    fixable: false
    category: ux

  rule_002:
    title: "Progressive Disclosure"
    description: "Advanced options must be hidden by default; discovery is intentional."
    severity: INFO
    fixable: false
    category: ux

  rule_003:
    title: "Technical Infrastructure Hidden by Default"
    description: "MCP, APIs, integrations must be transparent to end users."
    severity: INFO
    fixable: false
    category: ux

# ============================================================================
# AGENTS.md v2 — Machine-Readable Governance Registry (Issue #2251, Phase 5)
# ============================================================================
# This section is the single source of truth for:
#   1. AGENTS.md generation  -> scripts/ci/generate_agents_md.py (CI drift-checked)
#   2. Automated System Gates -> .github/scripts/constitution/gates.py
#
# Edit rules HERE. Never edit generated AGENTS.md by hand.
# Rule IDs below the tree are immutable; severities change only with
# explicit governance approval (see header note above).

constitution:
  name: "SupremeAI — AGENTS.md (Universal Operating Constitution & Agent Bootstrap — Unified v3.1)"
  rules_version: "3.1"
  model: "kite-and-spool"
  philosophy_quote: "যতই ঘুড়ি উড়াও রাতে, নাটাই তো আমার হাতে।"
  philosophy_line: "Agent-কে ঘুড়ির মতো স্বাধীনভাবে উড়তে দাও; কিন্তু নাটাই সবসময় SupremeAI Admin / Control Plane-এর হাতে থাকবে।"

living_protocols:
  shared_group_branch:
    title: "1. Shared Group Branch & Sequential Agent Collaboration (শেয়ার্ড গ্রুপ ব্রাঞ্চ ও সিকোয়েনশিয়াল এজেন্ট কোলাবোরেশন)"
    rule: "একই গ্রুপের (`group:<name>`) একাধিক ইস্যুতে ক্রমানুসারে একাধিক এজেন্ট কাজ করতে পারবে। তবে কঠোর নিয়ম: ১ম ইস্যুর কাজ সম্পূর্ণ শেষ হওয়ার পর ২য় ইস্যুর কাজ শুরু হবে। ১ম এজেন্ট কাজ শেষ করে সরাসরি শেয়ার্ড গ্রুপ ব্রাঞ্চে (`group/<name>`) পুশ করবে (মাঝপথে কোনো পৃথক PR তৈরি করবে না)। ২য় এজেন্ট পূর্ববর্তী এজেন্টের কাজ শেষ হওয়া সেই একই গ্রুপ ব্রাঞ্চটি পুল করে পরবর্তী ইস্যুর কাজ চালিয়ে যাবে। সম্পূর্ণ গ্রুপের সব ইস্যুর কাজ শেষ হলেই কেবল ১টি সমন্বিত একক PR তৈরি হবে।"
  atomic_claim:
    title: "2. Atomic Claim Lock & File Declaration"
    rule: "গ্রুপ সিকোয়েন্সের (GSPQ) প্রথম আনক্লেইমড ইস্যুটি ক্লেইম করো (`atomic_claim.sh`)। ক্লেইম কমেন্টে 'Touching files: file1, file2' ঘোষণা করো। নো ক্লেইম, নো কোড।"
  verify_first:
    title: "3. Verify First (3-Tier Verification)"
    rule: "অনুমানে ফাইল ডিলিট বা এডিট নিষিদ্ধ। পরিবর্তনের আগে ও পরে ৩ স্তর যাচাই আবশ্যক: (১) Reflection check (grep), (২) Boot smoke test (python -c 'import main'), (৩) Pytest। টেস্ট ম্যানিপুলেশন (delete/skip/fake assertion) কঠোরভাবে নিষিদ্ধ।"
  group_single_pr:
    title: "4. Full Group Unified PR & Scope (সম্পূর্ণ গ্রুপের একক PR ও সমন্বিত স্কোপ)"
    rule: "প্রতিটি ইস্যুতে সর্বোচ্চ ১–২ ফাইলের কৃত্রিম বাধ্যবাধকতা রহিত করা হলো। সম্পূর্ণ গ্রুপের সমস্ত সিকোয়েনশিয়াল ইস্যু মিলে কেবল ১টি সমন্বিত গ্রুপ PR (Full Group = 1 PR) তৈরি হবে। গ্রুপের প্রতিটি এজেন্ট ক্লেইমের সময় নিজের ইস্যুর ফাইল ঘোষণা করবে এবং গ্রুপ শেষে সম্পূর্ণ গ্রুপ স্কোপ একত্রিতভাবে অডিট ও ভেরিফাই হবে। অঘোষিত স্কোপের বাইরে ড্রাইভ-বাই রিফ্যাক্টরিং নিষিদ্ধ থাকবে, তবে গ্রুপের বৈধ কাজের প্রয়োজনে ফাইলের সংখ্যা সীমিত রাখা হবে না।"
  has_pr_mandate:
    title: "5. Mandatory 'has-pr' Label"
    rule: "PR খোলার সাথে সাথেই gh issue edit <id> --add-label 'has-pr' চালাতে হবে। এটি ডুপ্লিকেট PR তৈরি হওয়া রুট থেকে বন্ধ করে।"
  automated_guard_and_solver:
    title: "6. Automated CI Guard & Pure Solver Lane"
    rule: "কোডারদের ম্যানুয়াল PR রিভিউ লেখার কোনো প্রয়োজন নেই — PR নিরাপত্তা, টেস্ট ও রিগ্রেশন স্বয়ংক্রিয় CI Gates (Lease, Verification, Scope, Collision) এবং PR Helper পরিচালনা করে। কোডার এজেন্টের ১০০% ফোকাস থাকবে ইস্যু সমাধান, ৩-স্তর যাচাই ও পরমাণু PR তৈরিতে।"
  control_tower_heartbeat:
    title: "7. Control Plane Heartbeat (MCP Fleet Presence)"
    rule: "সেশনে কাজ শুরুর আগে এজেন্ট Control Tower-এ (mcp.json) হার্টবিট পাঠাবে (`python scripts/agents/mcp_tower_client.py heartbeat --slot agent-<N> --name <id>` বা MCP `agent_heartbeat` টুল)। এটি সেন্ট্রাল মেশে এজেন্টের উপস্থিতি ও লিজ সক্রিয় রাখে।"
  group_closeout_harvest:
    title: "8. Group Closeout Harvest & Benefit Gate (Zero Loss Invariant)"
    rule: "সম্পূর্ণ গ্রুপের কাজ শেষ হলেই কেবল আসল চিত্র পরিষ্কার বোঝা যায়। তাই যেকোনো গ্রুপ সিকোয়েন্সের (GSPQ) সব কাজ শেষ হওয়ার পর শেষ ফেজটি হবে 'Capability Harvest & Benefit Audit'। দায়িত্বপ্রাপ্ত এক্সিকিউটর: Planner Agent / SuperAgent (Admin বা SupremeAI) অথবা PR Helper। পুরো গ্রুপের সমস্ত diff একসাথে অডিট করো: কাজের কোনো দরকারি লজিক বা ক্ষমতা কি হারিয়ে গেছে? যদি হ্যাঁ, তবে ক্যানোনিকাল মডিউলে তা রিকভার করো। জিরো ক্যাপাবিলিটি লস ও ১০১% বাস্তব লাভ নিশ্চিত হলে তবেই গ্রুপ PR মার্জ হবে এবং পরবর্তী গ্রুপ শুরু হবে।"
  group_issue_template_standard:
    title: "9. Standard Group Issue Creation Protocol (পরবর্তী ইস্যু তৈরির নিয়ম)"
    rule: "ভবিষ্যতে যখনই নতুন গ্রুপ বা সিকোয়েন্স ইস্যু তৈরি করা হবে, তা অবশ্যই স্ট্যান্ডার্ড টেমপ্লেট (`scripts/ci/create_group_issue.py` বা GitHub issue form) অনুযায়ী তৈরি করতে হবে। প্রতিটি ইস্যুতে স্পষ্টভাবে থাকতে হবে: (১) Group ও Sequence ট্যাগ (`group:step-X`, `seq:Y`), (২) Predecessor নির্ভরতা, (৩) 'Touching files' ও পরমাণু ব্লাস্ট রেডিয়াস ঘোষণা, (৪) ৩-স্তর ভেরিফিকেশন নির্দেশাবলী, (৫) বাধ্যতামূলক বাংলা/বাংলিশ কোড কমেন্টস (`# বাংলা মন্তব্য:`), এবং (৬) স্পষ্ট স্ট্রেজিং নোটিশ: 'গ্রুপ সম্পূর্ণ শেষ হওয়ার পর ১টি একক PR হবে — মাঝপথে কোনো বিচ্ছিন্ন PR নয়'।"
  docs_issue_and_teledrive_backup:
    title: "10. Issues as Live Operational Truth & TelDrive Backup (ডকুমেন্টেশন Issues-এ সংরক্ষণ ও TelDrive ব্যাকআপ নীতি)"
    rule: "রিপোজিটরির ভেতরে নতুন কোনো বিচ্ছিন্ন .md ফাইল তৈরি করে ফাইল স্প্রল বা সাইজ বাড়ানো নিষিদ্ধ। এজেন্টের সমস্ত নতুন আর্কিটেকচারাল সিদ্ধান্ত, গাইড, প্ল্যান ও অপারেশনাল ট্রুথ সরাসরি সংশ্লিষ্ট GitHub Issue-তে কমেন্ট বা বডিতে যুক্ত করতে হবে (GitHub Issues as Live Operational Truth)। আর বিদ্যমান কোনো দীর্ঘ ডক্স বা রেফারেন্স ফাইল কোডবেসে না জমিয়ে সরাসরি TelDrive (টেলিগ্রাম ব্যাকআপ ক্লাউড)-এ সংরক্ষণ ও ব্যাকআপ করতে হবে। এর ফলে রিপোর সাইজ হালকা থাকবে এবং সমস্ত সিদ্ধান্ত ট্র্যাকেবল থাকবে।"
  mandatory_pr_push:
    title: "11. Mandatory Agent Push-as-PR Protocol (বাধ্যতামূলক PR পুশ)"
    rule: "এজেন্ট কোনো কাজ শুধু লোকাল ব্রাঞ্চে ফেলে রাখতে পারবে না। কাজ শেষ হওয়ার সাথে সাথে: (১) রিমোট গ্রুপ ব্রাঞ্চে পুশ করতে হবে (`git push origin <group-branch>`), (২) স্বাধীন কাজের ক্ষেত্রে অবিলম্বে PR খুলবে এবং গ্রুপ কাজের ক্ষেত্রে সম্পূর্ণ গ্রুপ শেষ হলে একক সমন্বিত PR খোলা হবে, (৩) সাথে সাথে সংশ্লিষ্ট ইস্যুতে `gh issue edit <id> --add-label 'has-pr'` দিতে হবে। প্রতিটি কাজের অগ্রগতি GitHub-এ দৃশ্যমান ও অডিটেবল হতে হবে।"
  unified_three_pipeline:
    title: "12. Architecture Preservation & DRY 3-Pipeline Law (একক ৩-পাইপলাইন ও রিইউজিবিলিটি নীতি)"
    rule: "সিস্টেমের বিদ্যমান আর্কিটেকচার যেমন আছে হুবহু তেমন অক্ষত ও অপরিবর্তিত থাকবে যদি না পরিবর্তন একান্তই অপরিহার্য (Preserve architecture intact until it is must)। সিআই/সিডি ফ্র্যাগমেন্টেশন ও ফাইল স্প্রল বন্ধ করে DRY (Don't Repeat Yourself) ও Reusable কাঠামোর ৩টি একক পাইপলাইন বলবৎ থাকবে: (১) PR-এ থাকবে ১টি গেট (PR Gate — স্কোপ, লিজ, ভেরিফিকেশন ও পলিসি গার্ড), (২) Merge Train-এ থাকবে ১টি (Train Gate — ব্যাচ রোলআপ, সিকোয়েন্স ও ডিপেন্ডেন্সি হোল্ড), এবং (৩) Main-এ মার্জের পর থাকবে ১টি (Main CI/CD — টেস্ট, বিল্ড, পোস্ট-মার্জ রিলিজ ও জানিটর)। ডুপ্লিকেট রান বা বিক্ষিপ্ত ট্রিগার সম্পূর্ণ নিষিদ্ধ।"
  strict_sequential_priority:
    title: "13. Strict Sequential Priority Resolution (অগ্রাধিকার অনুযায়ী একক-PR ফিক্স ও মার্জ নীতি — সম্পূর্ণ বাস্তবভিত্তিক)"
    rule: "গ্রুপ বা স্বাধীন যেকোনো কাজের ক্ষেত্রে সমান্তরাল একাধিক PR নিয়ে টানাটানি এবং মাঝপথে `queue:hold`-এ PR জমিয়ে রাখা সম্পূর্ণ নিষিদ্ধ। একই গ্রুপের সব ইস্যু একই গ্রুপ ব্রাঞ্চে ক্রমানুসারে একের পর এক এজেন্ট সম্পন্ন করে গ্রুপ শেষে মাত্র ১টি একক PR তৈরি করবে। আর কিউতে থাকা সমস্ত ওপেন PR সর্বদা সর্বোচ্চ প্রায়োরিটি (Rank 1 / P0) অনুযায়ী এক-একটি করে মূল্যায়ন করা হবে: লোকাল ও CI টেস্ট ১০০% গ্রিন নিশ্চিত করে সরাসরি `main`-এ মার্জ সম্পন্ন করতে হবে এবং তারপরই কেবল পরবর্তী অধস্তন PR-এ হাত দেওয়া যাবে (Strict Sequential Priority Resolution)। এটি সিআই জ্যাম, ব্রাঞ্চ ড্রিফট, ডেডলক ও ক্রস-PR কনফ্লিক্ট চিরতরে নির্মূল করে সর্বোচ্চ গতি ও কার্যকারিতা নিশ্চিত করে।"

bootstrap:
  - step: "git fetch origin --prune && cat AGENTS.md"
    note: "সেশন শুরুতে সর্বদা main sync ও AGENTS.md পড়ো — rules পরিবর্তন হয়েছে কিনা দেখো"
  - step: "cat docs/architecture/ARCH-LIVING-PIPELINE-01.md"
    note: "Living Pipeline canon পড়ো — পূর্ণ প্রেক্ষাপট ও গেট-ম্যাপ"
  - step: "python scripts/agents/acquire_role_slot.py --role <lane>"
    note: "অটো-ডিসকভারি: পরবর্তী প্রায়োরিটি ইস্যু নিজে খুঁজে স্লট ও ব্রাঞ্চ তৈরি করে। নির্দিষ্ট ইস্যুর জন্য: --issue <id>"
  - step: "./scripts/ci/atomic_claim.sh <issue#> <agent>"
    note: "ইস্যু ক্লেইম ও 'Touching files:' ঘোষণা করো (GH_TOKEN অটো-fallback: gh auth login)"
  - step: "python scripts/agents/mcp_tower_client.py heartbeat --slot agent-<N> --name <id>"
    note: "Control Tower Heartbeat: MCP মেশে নিজেকে 'state=online' রেজিস্টার করো"
  - step: "3-Tier Verification (Reflection → Boot Smoke → Pytest)"
    note: "কোনো টেস্ট ভাঙা বা ডিলিট করা নিষিদ্ধ"
  - step: "gh pr create ... && gh issue edit <issue#> --add-label 'has-pr'"
    note: "স্বাধীন কাজের ক্ষেত্রে বা সম্পূর্ণ গ্রুপের কাজ শেষ হলে একক PR খোলো এবং অবিলম্বে has-pr লেবেল দাও"

# Automated System Gates — system enforcement (Rule 22, #2251).
# wired=true  → an active CI job BLOCKS on violation today.
# wired=false → registered contract; enforcement lands in a follow-up issue.
gates:
  lease_gate:
    title: "Lease Gate"
    blocks_when: "PR head branch লেখকের leased slot-এর বাইরে (bot slot-mismatch), বা mesh lease মেয়াদ শেষ"
    wired: true
    workflow: "pr.yml"
  verification_gate:
    title: "Verification Gate"
    blocks_when: "PR description-এ Test Evidence সেকশন নেই (টেস্ট লগ/কমান্ড আউটপুট ছাড়া PR BLOCK)"
    wired: true
    workflow: "pr.yml"
  scope_gate:
    title: "Scope Gate"
    blocks_when: "claim-এ declare করা 'Touching files:'-এর বাইরের ফাইল PR-এ বদলালে BLOCK"
    wired: true
    workflow: "pr.yml"
  collision_gate:
    title: "Collision Gate"
    blocks_when: "অন্য open PR-এর ফাইলের সাথে direct overlap হলে BLOCK"
    wired: true
    workflow: "pr.yml"
  self_merge_gate:
    title: "Self-Merge Gate"
    blocks_when: "নিজের PR নিজে approve/merge করলে BLOCK"
    wired: true
    workflow: "pr.yml"
    enforced_by: "gates.py run_self_merge_gate (#2397) — self-approval + merged_by==author অডিট"
  test_guard_gate:
    title: "Test Guard"
    blocks_when: "test delete/skip/threshold-নামানো হলে BLOCK"
    wired: true
    workflow: "pr.yml"
    enforced_by: "gates.py run_test_guard_gate (#2397) — টেস্ট-ফাইল ডিলিট + skip/xfail যোগ ডিটেকশন; threshold-নামানো follow-up"
  post_merge_watch:
    title: "Post-Merge Watch"
    blocks_when: "merge-এর ১৫ মিনিটের মধ্যে main লাল হলে (watchdog admin-alert — কোনো অন্ধ auto-revert নয়, revert সিদ্ধান্ত অ্যাডমিনের নাটাইয়ে)"
    wired: true
    workflow: "main.yml"
    enforced_by: "main.yml post-merge watchdog job — ১৫-মিনিট watchdog, লাল হলে admin-alert; auto-revert অ্যাডমিনের নাটাইয়ে"
  predecessor_gate:
    title: "Predecessor Group Merge Hold Gate"
    blocks_when: "পূর্ববর্তী গ্রুপ (Predecessor Group) সম্পূর্ণ না হলে পরবর্তী গ্রুপের PR queue:hold ছাড়া মার্জ করা নিষিদ্ধ"
    wired: true
    workflow: "pr.yml"
    enforced_by: "gates.py run_predecessor_gate (#2408) — cross-group dependency & hold enforcement"
  claim_gate:
    title: "Claim Gate (claim-before-work)"
    blocks_when: "PR লেখকের linked issue-এ valid claim (assignee / Atomic Claim comment / group participation) নেই — claim ছাড়া PR BLOCK। supremeai-* এজেন্ট-লেখক কখনো exempt নয় (OWNER association-ও বট-অ্যাকাউন্টকে বাইপাস দেয় না); মানুষ (OWNER/MEMBER/COLLABORATOR) advisory"
    wired: true
    workflow: "pr.yml"
    enforced_by: "gates.py run_claim_gate (#2644) — atomic_claim.sh এর audit-trail comment + assignees + group:<name> sibling claims থেকে claim-evidence যাচাই"
  discovery_gate:
    title: "Discovery Disclosure Gate (Charter Rule #7 flywheel)"
    blocks_when: "PR body-তে discovery-মার্কার (discovered/found/পাওয়া গেছে + bug/vulnerability/root-cause) থাকলে 'Discovery issue: #N' রেফারেন্স বাধ্যতামূলক — মার্কার ছাড়া ফাইল করা discovery কমেন্টেই মরে যেত"
    wired: true
    workflow: "pr.yml"
    enforced_by: "gates.py run_discovery_gate (#2528) — scripts/agents/create_issue.py --type discovery ফাইল করে 'paste into your PR body: Discovery issue: #N' লাইন প্রিন্ট করে; gate-ই সেই চুক্তি এনফোর্স করে (zero-caller স্ক্রিপ্টটির প্লাগ)"


  topological_sequence_gate:
    title: "Topological Sequence Gate (#2682)"
    blocks_when: "PR শুধু Layer 4/5 (API/Frontend) ফাইল বদলায় অথচ নিচের কোনো লেয়ারের (Schemas/Tools/Workers/Core) ফাইল স্পর্শ না করে এবং PR body-তে '## Reflection Evidence' (why + alternatives_rejected) না থাকলে BLOCK — অন্ধ UI/API-প্রথম কোডিং নিষিদ্ধ"
    wired: true
    workflow: "pr.yml"
    enforced_by: "scripts/ci/audit_suite.py audit_topological_sequence (#2682) — topological dependency checker; PR Gate-এ পৃথক স্টেপ"

self_merge_policy:
  block_self_approval: true
  block_self_merge: true

# Discovery Gate policy (#2528 — Charter Rule #7 enforcement)
discovery_policy:
  undisclosed_discovery: block     # block | warn — মার্কার আছে, রেফারেন্স নেই

# Admin-Approval Gate policy (#2745 — 99.99/0.01 আইনের ০.০১% শাসন-স্তর)।
# বাংলা: gate:admin-approval লেবেলযুক্ত সংবেদনশীল ইস্যু (প্রোডাকশন DB ড্রপ,
# বিলিং-টিয়ার বদল, সিক্রেট রোটেশন) — অ্যাডমিন-অনুমোদন (approved-by:admin
# লেবেল বা OWNER/MEMBER-এর /approve কমেন্ট) ছাড়া ক্লেইম ও মার্জ উভয়ই নিষিদ্ধ।
admin_approval_policy:
  gate_label: gate:admin-approval
  approved_label: approved-by:admin
  approve_comment_patterns:
    - "/approve"
    - "approved-by:admin"
  admin_associations:
    - OWNER
    - MEMBER
  unapproved_sensitive_issue: block  # block | warn — fail-closed শাসন

# Claim Gate policy (#2644 — claim-before-work, "No Claim, No PR").
# বাংলা: claim সফল না হওয়া পর্যন্ত কাজ শুরু নিষিদ্ধ; claim ছাড়া খোলা PR গেটেই
# BLOCK। 8-PRs-in-flight root cause: OWNER-associated অ্যাপ-বট scope gate-এর
# advisory_authors ফাঁক গলে unclaimed issue-এ PR চালিয়ে দিত — এখন এজেন্ট-লেখক
# (supremeai-*) কখনো advisory পাবে না, association যা-ই হোক।
claim_policy:
  unclaimed_pr: block              # block | warn — author-এর claim নেই
  missing_issue_ref: block         # title/body-তে issue pointer-ই নেই
  agent_author_prefixes: ["supremeai-", "app/supremeai-"]   # এজেন্ট = সর্বদা enforced
  advisory_authors: [OWNER, MEMBER, COLLABORATOR]           # শুধু মানুষের জন্য
  exempt_authors: ["dependabot[bot]", "app/dependabot", "github-actions[bot]", "renovate[bot]"]
  claim_comment_marker: "Atomic Claim"
  agent_field_regex: '\*\*Agent:\*\*\s*`([^`]+)`'
  in_progress_label: "status:in-progress"
  group_branch_prefix: "group/"

test_guard_policy:
  deleted_test_files: block
  added_skip_markers: block
  allow_deleted_paths: []

# Zero-Garbage Docs Guard (#2450, 2026-09-28): 'GitHub Issues as Live Operational
# Truth' দর্শন — docs/-এ নতুন .md শুধু অনুমোদিত ক্যানোনিকাল জায়গায়। allowlist-এর
# বাইরের নতুন (added/copied) docs/*.md হলে PR BLOCK। আপডেট (modified) ফাইল গার্ডের
# বাইরে — শুধু স্প্রল-বৃদ্ধি আটকানো এই গেটের কাজ।
docs_garbage_policy:
  non_allowlisted_new_docs: block
  allowed_patterns:
    - "docs/master_docs/**"
    - "docs/agents/**"
    - "docs/architecture/**"
    - "docs/governance/**"
    - "docs/INDEX.md"
    - "docs/ROADMAP.md"
    - "docs/DOCUMENTATION_MASTER_INDEX.md"
    - "docs/SECRETS_OPERATIONS.md"
    - "docs/SKIPPED_TESTS.md"
    - "docs/CAPABILITY_INVENTORY.md"

predecessor_policy:
  group_dependencies:
    foundation-closeout: pipeline-governance
  hold_label: "queue:hold"
  group_branch_prefix: "group/"

review_protocol:
  title: "Group Closeout Audit Protocol (The 4-Pillar Rubric)"
  rubric:
    - pillar: "1. System Stability"
      check: "সিস্টেম বা আর্কিটেকচারে কোনো ব্রেকিং পরিবর্তন বা অঘোষিত সাইড-ইফেক্ট আছে কি না?"
    - pillar: "2. Real Benefit"
      check: "বাস্তব উন্নতি হয়েছে কি না? (LOC হ্রাস / ডেড-কোড ছাঁটাই / বাগ ফিক্স / নির্ভরযোগ্যতা বৃদ্ধি)"
    - pillar: "3. Zero Regression"
      check: "সব টেস্ট সফল কি না? কোনো টেস্ট ডিলিট, স্কিপ বা ফেইক অ্যাসারশন করা হয়নি তো?"
    - pillar: "4. Scope Narrowness"
      check: "ঘোষিত ফাইলের বাইরে ড্রাইভ-বাই রিফ্যাক্টরিং বা অনাকাঙ্ক্ষিত কোড ঢুকেছে কি না?"

# The 3 hard rules that remain agent-facing (everything else is system's burden).
hard_rules:
  honesty: "সততা ও নির্ভরযোগ্যতা: কোড ও টেস্ট ১০০% খাঁটি হতে হবে; টেস্ট ম্যানিপুলেশন (delete/skip/fake assertion) সর্বোচ্চ অপরাধ।"
  atomicity: "সম্পূর্ণ গ্রুপের একক PR (Full Group = 1 Unified PR): গ্রুপের প্রতিটি ইস্যুর জন্য পৃথক পৃথক PR খোলার প্রয়োজন নেই। ১ম ইস্যু শেষ হলে সরাসরি গ্রুপ ব্রাঞ্চে পুশ হবে, ২য় এজেন্ট সেই ব্রাঞ্চ থেকেই ২য় ইস্যুর কাজ করবে, এবং সম্পূর্ণ গ্রুপের সমস্ত কাজ শেষ হলে পুরো গ্রুপের জন্য মাত্র ১টি একক ও সমন্বিত PR তৈরি হবে।"
  continuity: "অবিরাম সক্রিয়তা: কিউ থেকে ক্রমানুসারে পরবর্তী কাজ তুলে নাও, কোনো কাজে ব্লকার পেলে সাথে সাথে ব্লকার ইস্যু ফাইল করে এগিয়ে যাও।"
  language_mandate: "বাংলা/বাংলিশ ব্যবহারের বাধ্যবাধকতা: আমাদের পুরো টেক টিম বাংলাদেশি — তাই যেখানেই সম্ভব বাংলা (বা প্রাঞ্জল বাংলিশ) ব্যবহার করতে হবে। (১) কোডের ভেতরের সমস্ত মন্তব্য ও সিদ্ধান্তের ব্যাখ্যা (code comments — e.g. '# বাংলা মন্তব্য:'), (২) অ্যাডমিনের যেকোনো প্রশ্নের উত্তর, বার্তা ও স্ট্যাটাস রিপোর্ট, এবং (৩) PR সামারি, ডেসক্রিপশন ও ইস্যু ডিসকাশনে বাংলা বা বাংলিশ ১০০% বাধ্যতামূলক (Mandatory Bengali/Banglish)। কেবল কোড সিনট্যাক্স, ভ্যারিয়েবল নেম ও শেল কমান্ড ব্যতীত সমস্ত যোগাযোগ ও ব্যাখ্যা বাংলায় হতে হবে।"
  architecture_preservation: "আর্কিটেকচার স্থায়িত্ব ও ৩-পাইপলাইন নীতি (Architecture Preservation & DRY 3-Pipeline Law): আর্কিটেকচার যেমন আছে হুবহু তেমন অক্ষত থাকবে যদি না কোনো পরিবর্তন একান্তই অপরিহার্য (until it is must)। সিআই/সিডি-তে কোনো ওয়ার্কফ্লো স্প্রল বা ডুপ্লিকেট রান থাকবে না — প্রতিটি অ্যাকশনে মাত্র ৩টি একক, DRY ও Reusable পাইপলাইন কাজ করবে: (১) PR-এ ১টি গেট (PR Gate), (২) Merge Train-এ ১টি (Train Gate), এবং (৩) Main-এ ১টি (Main CI/CD)।"
  priority_sequential_resolution: "অগ্রাধিকার অনুযায়ী এক-একটি করে ফিক্স ও মার্জ নীতি (Fast & Effective Sequential Law): সিআই এবং ডেভেলপার সময়ের অপচয় রোধে সর্বদা সর্বোচ্চ অগ্রাধিকার (Rank 1 / P0) PR-টি আগে শতভাগ গ্রিন ও মার্জ করতে হবে, তারপর ক্রমানুসারে পরবর্তী PR-এ যেতে হবে। সমান্তরালভাবে একাধিক ইন্টার-ডিপেন্ডেন্ট PR নিয়ে টানাটানি নিষিদ্ধ।"
  zero_garbage_docs_and_backup: "ডকুমেন্টেশন Issues-এ সংরক্ষণ ও TelDrive ব্যাকআপ নীতি (Issues as Operational Truth & TelDrive Backup): রিপোতে অপ্রয়োজনীয় .md তৈরি সম্পূর্ণ নিষিদ্ধ। সমস্ত নতুন স্থাপত্য সিদ্ধান্ত, গাইড ও প্ল্যান সরাসরি GitHub Issue-তে নথিভুক্ত হবে এবং দীর্ঘস্থায়ী ডক্স TelDrive-এ ব্যাকআপ রাখা হবে।"
  peer_autonomy_and_synthesis: "সমকক্ষ এজেন্টের স্বাধীনতা ও যৌথ যাচাই (Peer Autonomy & Synthesis): ১ম এজেন্ট ও কোডার উভয়েই সমকক্ষ বুদ্ধিমত্তার অধিকারী। ১ম এজেন্ট সমস্যা ও একাধিক সমাধানের সাজেশন দেবে ('আমার সাজেশন এটি, তোমার মতামত কি?'), কিন্তু কোডারকে পূর্ণ স্বাধীনতা দিতে হবে। কোডার ১ম এজেন্টের সাজেশন ও নিজের কোডবেস অ্যানালাইসিস ক্রস-ভেরিফাই করে যেটি বাস্তবিক বিচারে সেরা কেবল সেটাই বাস্তবায়ন করবে।"
  conciseness_and_zero_bloat: "সংক্ষিপ্ততা ও জিরো-ব্লোট নীতি (Conciseness & Zero Doc Bloat): অ্যাডমিনের সুনির্দিষ্ট রিকোয়ারমেন্ট ছাড়া কোনো দীর্ঘ নথি, ভারী ডকস বা অপ্রয়োজনীয় ফাইল তৈরি নিষিদ্ধ। সমস্ত রুলস, যুক্তি ও লার্নিং পয়েন্ট-টু-পয়েন্ট সর্বোচ্চ ২-৩ লাইনে সীমাবদ্ধ থাকবে।"
  dynamic_tools_first_sequencing: "ডায়নামিক কিউ ও টুলস-ফার্স্ট ক্রম (Dynamic Tools-First Ordering): রুট কজ সমাধান ও টুলস/ওয়ার্কার সবার আগে প্রস্তুত করতে হবে। কিউতে নতুন কোনো জরুরি সমস্যা এলে পূর্বের কাজের সাথে বুদ্ধিমত্তার সাথে তুলনা করে কিউ ডায়নামিকালি রি-অর্ডার করতে হবে।"
  clarify_and_converge_lifecycle: "ক্ল্যারিফাই ও কনভার্জেন্স চক্র (Clarify & Converge Lifecycle): প্ল্যানার/অডিটর এজেন্টের জন্য কোড লেখার পূর্বেই সম্ভাব্য অস্পষ্টতা ও এজ-কেস (Clarify) টাস্কে চিহ্নিত করা বাধ্যতামূলক। একইভাবে কোডার এজেন্টের কাজ শেষ করে PR খোলার পূর্বে ইস্যুর প্রতিটি রিকোয়ারমেন্ট এবং কোড ডিফের শতভাগ মিল (Convergence) যাচাই করা বাধ্যতামূলক — কোনো অসম্পূর্ণ কাজ বা আনহ্যান্ডেলড TODO রেখে PR খোলা যাবে না।"
  source_legitimacy_and_peer_veto: "সার্বজনীন উৎস প্রামাণ্যতা ও সমকক্ষ এজেন্টের ভেটো ক্ষমতা (Universal Source Legitimacy & Peer Veto): এটি সকল এজেন্টের জন্য বাধ্যতামূলক সার্বজনীন নিয়ম। কোনো অবস্থাতেই এমন কোনো সোর্স (রিপোজিটরি, লাইব্রেরি, এপিআই বা কোড) থেকে কিছু গ্রহণ করা যাবে না যার প্রামাণ্যতা নিয়ে বিন্দুমাত্র সন্দেহ বা প্রশ্ন রয়েছে। যেকোনো টাস্কে এক্সটার্নাল সোর্স যুক্ত থাকলে, যেকোনো এজেন্ট (Auditor, Coder, Planner, PR Helper) যদি সেই সোর্সকে শতভাগ লেজিট (Legit) ও নিরাপদ মনে না করে, তবে সাথে সাথে সেই সোর্স ব্যবহারে বাধা (Object/Block/Veto) দেওয়ার পূর্ণ অধিকার ও বাধ্যবাধকতা তার রয়েছে।"

freedoms:
  - "সমাধানের বাস্তবসম্মত অ্যাপ্রোচ ও ডিজাইন প্যাটার্ন নিজে বেছে নাও।"
  - "১ম এজেন্টের সাজেশনের সাথে নিজের কোড অ্যানালাইসিস মিলিয়ে সবচেয়ে সেরা সমাধান বেছে নেওয়ার পূর্ণ স্বাধীনতা কোডারের রয়েছে।"
  - "এজ-কেস মোকাবিলায় এবং শতভাগ কনভার্জেন্স অর্জনে প্রয়োজনে অতিরিক্ত অভ্যন্তরীণ টেস্ট বা ডিফেন্সিভ গার্ড যোগ করার স্বাধীনতা রয়েছে।"
  - "যেকোনো সন্দেহজনক বা অযাচাইকৃত সোর্স দেখলে সরাসরি ভেটো (Veto/বাধা) দিয়ে নিরাপদ বিকল্প প্রস্তাব করার পূর্ণ অধিকার প্রতিটি এজেন্টের রয়েছে।"

# ============================================================================
# Agent Role → Rules Mapping (8 Agent Types)
# ============================================================================
# Each agent type has applicable rules from the canonical registry above.
# These are automatically injected into issue bodies and task instructions.
agent_rules:
  auditor:
    description: "কোডবেস অডিট, নিয়ম লঙ্ঘন শনাক্তকরণ, আর্কিটেকচারাল গ্যাপ খোঁজা এবং ইস্যু তৈরি করা (কোড এডিট করে না, ক্লেইম-ফ্রি)।"
    applicable_rules:
      - "meta.rule_000"
      - "architecture.rule_002"
      - "architecture.rule_003"
      - "architecture.rule_004"
      - "security.rule_002"
      - "gates.docs_garbage"
      # বাংলা মন্তব্য (#2688): Clarify-দায়িত্ব — অডিটর নতুন সমস্যা চিহ্নিত করলে অস্পষ্টতা/এজ-কেস আগেই পরিষ্কার করবে।
      - "hard_rules.clarify_and_converge_lifecycle"
    prohibited_actions:
      - "কোনো কোড এডিট বা ডিলিট"
      - "কোনো PR তৈরি বা মার্জ"
      - "ক্লেইম লক নেওয়া"
    auto_inject: true

  coder:
    description: "ফাইল এডিট, বাগ ফিক্স, ফিচার ইমপ্লিমেন্টেশন এবং ইউনিট টেস্ট (No Claim, No Code)।"
    applicable_rules:
      - "architecture.rule_001"
      - "architecture.rule_002"
      - "security.rule_001"
      - "security.rule_002"
      - "configuration.rule_001"
      - "gates.claim_gate"
      - "gates.scope_gate"
      - "gates.verification_gate"
      - "gates.test_guard_gate"
      # বাংলা মন্তব্য (#2688): Converge-দায়িত্ব — PR-পূর্বে ইস্যুর প্রতিটি রিকোয়ারমেন্ট বনাম কোড-ডিফ ১০০% মিল, কোনো TODO রেখে PR নয়।
      - "hard_rules.clarify_and_converge_lifecycle"
    prohibited_actions:
      - "claim সফল না হওয়া পর্যন্ত কাজ শুরু করা (claim-before-work, #2644)"
      - "claim ছাড়া PR খোলা — Claim Gate সরাসরি BLOCK করবে"
      - "কোনো ম্যানুয়াল PR রিভিউ লিখা"
      - "নিজের PR নিজে মার্জ বা অ্যাপ্রুভ করা"
      - "main ব্রাঞ্চে সরাসরি পুশ"
    auto_inject: true

  ci_devops:
    description: "GitHub Actions ওয়ার্কফ্লো, গেটওয়ে ও বিল্ড পাইপলাইন রক্ষণাবেক্ষণ।"
    applicable_rules:
      - "architecture.rule_005"
      - "gates.claim_gate"
      - "gates.lease_gate"
      - "gates.collision_gate"
      - "gates.self_merge_gate"
      - "gates.post_merge_watch"
    prohibited_actions:
      - "claim সফল না হওয়া পর্যন্ত কাজ শুরু করা (claim-before-work, #2644)"
      - "claim ছাড়া PR খোলা — Claim Gate সরাসরি BLOCK করবে"
      - "কোনো অণনুমোদিত ওয়ার্কফ্লো পরিবর্তন"
      - "self-merge"
      - "main directly পুশ"
    auto_inject: true

  planner:
