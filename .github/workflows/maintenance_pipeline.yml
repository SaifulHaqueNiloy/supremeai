# SupremeAI - Manual Maintenance & Auto-Fixing Pipeline
# বাংলা মন্তব্য: এই পাইপলাইনটি ম্যানুয়ালি ট্রিগার করা যাবে এবং বিভিন্ন রক্ষণাবেক্ষণ কাজ চালানো যাবে। (সংস্করণ ২.০)

name: "🤖 Manual Maintenance & Auto-Fix"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which maintenance task to run?"
        type: choice
        required: true
        default: "health-check"
        options:
          - "health-check"
          - "auto-lint-fix"
          - "dependency-vulnerability-scan"
          - "auto-remediate-security-issues"
          - "auto-generate-deploy-docs"

# বাংলা মন্তব্য: প্রতিটি টাস্ককে আলাদা জব-এ ভাগ করা হয়েছে স্বচ্ছতা এবং নির্ভরযোগ্যতার জন্য।
jobs:
  # এই জবটি শুধুমাত্র একবার রান হবে এবং সব downstream জব এটি ব্যবহার করবে।
  setup:
    runs-on: ubuntu-latest
    outputs:
      requirements-cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: "🐍 Setup Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "🔑 Generate Cache Key"
        id: cache-key
        run: echo "key=py-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/requirements.txt') }}" >> $GITHUB_OUTPUT

      - name: "♻️ Cache and Install Dependencies"
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: ~/.cache/pip
          key: ${{ steps.cache-key.outputs.key }}

      - name: "⚙️ Install Dependencies if Cache Miss"
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          pip install black isort pip-audit ruff

  health-check:
    needs: setup
    if: github.event.inputs.task == 'health-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.requirements-cache-key }}
      - name: "⚙️ Install Dependencies"
        run: pip install -r requirements.txt
      - name: "🩺 Run Health Check"
        run: |
          python -m backend.tools.health_checker

  auto-lint-fix:
    needs: setup
    if: github.event.inputs.task == 'auto-lint-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.requirements-cache-key }}
      - name: "⚙️ Install Formatters"
        run: pip install black isort ruff
      - name: "💅 Run Auto-Lint & Format Fix"
        run: |
          ruff --fix .
          black .
          isort .
      - name: "🤖 Create Pull Request"
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-lint and format with ruff, black, isort"
          title: "🤖 Auto-Lint & Format Fix (Ruff)"
          body: |
            This PR was automatically generated by the 'auto-lint-fix' maintenance task.
            It contains automated code formatting changes.
          branch: "chore/auto-lint-fix-${{ github.run_id }}"
          labels: "maintenance, automated"

  dependency-vulnerability-scan:
    needs: setup
    if: github.event.inputs.task == 'dependency-vulnerability-scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.requirements-cache-key }}
      - name: "⚙️ Install Scanner"
        run: pip install pip-audit
      - name: "📦 Run Vulnerability Scan"
        run: |
          pip-audit --format json > vulnerability-report.json || true
      - name: "📤 Upload Vulnerability Report"
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: vulnerability-report.json

  # auto-remediate-security-issues জবটি এখানে যোগ করা যেতে পারে
  # ...
  generate-codebase-docs:
    name: 📝 Auto-Generate & Deploy Docs
    # বাংলা মন্তব্য: মেইন বা ডেভেলপ ব্রাঞ্চে পুশ করা হলে স্বয়ংক্রিয়ভাবে কোডবেসের মার্কডাউন ফাইল ও ড্যাশবোর্ড জেনারেট এবং ডিপ্লয় হবে
    runs-on: ubuntu-latest
    if: github.event.inputs.task == 'auto-generate-deploy-docs'
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Poetry
        uses: snok/install-poetry@v1
        with:
          plugins: poetry-plugin-export

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies via Poetry Export
        working-directory: backend
        run: |
          poetry config virtualenvs.create false
          pip install -r <(poetry export --with dev --without ml,tools --format requirements.txt)
          
      - name: 🤖 Generate AI Architecture Docs (ADR, DFD, OpenAPI)
        env:
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # বাংলা মন্তব্য: প্রোডাকশন-রেডি সিকিউরিটি মোডে Settings ইনিশিয়ালাইজ করার সময় ভ্যালিডেশন এরর এড়াতে এটি ইনজেক্ট করা হয়েছে
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY || 'sk_test_dummy' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_dummy' }}
          DOCS_PASSWORD: ${{ secrets.DOCS_PASSWORD || 'dummy_docs_password' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-v1-dummy' }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET || 'dummy_ci_secret' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '9llmzMU2XSRhbAS-R__JMW1XLZzc0ll7obD_RqaVwno=' }}
        run: |
          VENV_PYTHON=$(cd backend && poetry env info --path)/bin/python
          $VENV_PYTHON scripts/generate_openapi.py
          $VENV_PYTHON scripts/auto_generate_architecture_docs.py
          $VENV_PYTHON scripts/generate_push_summary.py

      - name: Generate Smart Docs & Dashboard
        run: |
          VENV_PYTHON=$(cd backend && poetry env info --path)/bin/python
          $VENV_PYTHON scripts/generate_smart_docs.py
        
      - name: Commit and Push Docs to Repo
        id: push_docs
        run: |
          git config --global user.name "SupremeAI-DocBot"
          git config --global user.email "docbot@supremeai.dev"
          git add -f docs/autogen/ || true
          git add -f ADR-*.md || true
          git add -f DIAGRAM-*.md || true
          git add -f THREAT-MODEL-*.md || true
          git add -f backend/API-swagger.yaml || true
          git add -f API-swagger.yaml || true
          git diff-index --quiet HEAD || (git commit -m "docs: [auto-docs] Automated ADR, Codebase Docs & Dashboard [skip ci]" && git push) || echo "No changes to commit"
      - name: Setup GitHub Pages Environment
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true # বাংলা মন্তব্য: রিপোজিটরিতে যদি পেজেস কনফিগার করা না থাকে, তবে এটি স্বয়ংক্রিয়ভাবে অ্যাকশনস সোর্স দিয়ে চালু করবে।
      - name: Prepare Pages Content (exclude large files)
        if: github.ref == 'refs/heads/main'
        run: |
          # বাংলা মন্তব্য: codebase_full.md ফাইলটি ১৩MB+ বড় হওয়ায় GitHub Pages limit অতিক্রম করে, তাই বাদ দেওয়া হচ্ছে
          find docs/autogen -name "codebase_full.md"

