name: Issue Auto-Router

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write

jobs:
  auto-route:
    name: Auto-label + auto-prioritize
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Route issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/ci/issue_router.py --issue ${{ github.event.issue.number }}
