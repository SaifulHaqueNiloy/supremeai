# =============================================================================
# SupremeAI Train Gate (Pipeline 2 of Canonical 3-Pipeline Architecture)
# =============================================================================
# Constitutional Reference: Protocol 14, Protocol 7 & Hard Rule 5 (Rules v2.6)
# One single pipeline for merge train & batch rollup:
#   1. preflight: Predecessor group dependency hold & sequence verification
#   2. batch-rollup: Intra-batch collision validation & atomic main landing
# =============================================================================

name: Train Gate (Merge Train)

on:
  workflow_dispatch:
    inputs:
      group_name:
        description: "Group sequence to evaluate for merge train landing"
        required: false
        default: ""
      limit:
        description: "মার্জ করার সর্বোচ্চ PR সংখ্যা"
        required: false
        default: "5"
      min_prs:
        description: "ন্যূনতম কয়টি PR জমা হলে চলবে"
        required: false
        default: "1"
      release_holds:
        description: "queue:hold থাকা প্রস্তুত PR মার্জ করবে কি না"
        type: boolean
        default: true
  pull_request:
    types: [labeled]
  # বাংলা মন্তব্য: #2630 — মূল ফাঁক বন্ধ: PR-এর চেক সবুজ হওয়ার সাথে সাথেই
  # re-evaluation হবে (আগে label-ইভেন্টে in-progress দেখে skip করে আর কখনো
  # ফিরে আসত না — তাই সব PR অ্যাডমিনের হাতে আটকে থাকত)।
  check_suite:
    types: [completed]
  schedule:
    # বাংলা মন্তব্য: প্রতি ৩০ মিনিট অন্তর চেক করবে ৫+ PR জমা হয়েছে কি না
    - cron: "*/30 * * * *"

concurrency:
  group: train-gate-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Predecessor & Sequence Preflight Check
  # ---------------------------------------------------------------------------
  preflight:
    name: "🚂 Train Preflight (Predecessor & Sequence Check)"
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'queue:train')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Verify Predecessor Group Status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Evaluating group sequence completeness before merge train takeoff..."
          python - <<'PY'
          import json, subprocess
          res = subprocess.run(["gh", "pr", "list", "--state", "open", "--json", "number,labels,title"], capture_output=True, text=True)
          if res.returncode == 0:
              prs = json.loads(res.stdout)
              print(f"Open PRs in queue: {len(prs)}")
          PY

      - name: Constitution & Gates Self-Test
        run: |
          pytest .github/scripts/constitution/tests/ -q

  # ---------------------------------------------------------------------------
  # 2. Smart Priority Merge Queue (Merged from smart-merge-queue.yml)
  # ---------------------------------------------------------------------------
  auto-merge-queue:
    name: "🚀 Smart Sequential Merge Runner"
    needs: [preflight]
    # বাংলা মন্তব্য: #2630 — MERGE_TRAIN_AUTO_LAND কিল-সুইচ ওয়্যারিং (আগে এই
    # ভেরিয়েবলের কোনো consumer-ই ছিল না)। 'false' সেট করলে অ্যাডমিন এক লাইনে
    # অটো-মার্জ বন্ধ করতে পারেন — ডিফল্ট true বা unset = স্বয়ংক্রিয়।
    if: always() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') && vars.MERGE_TRAIN_AUTO_LAND != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install CLI & Cryptography Dependencies
        run: |
          pip install pyjwt cryptography requests pyyaml

      - name: 🚦 Run Smart Priority Sequential Merger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.AGENT_PR_HELPER_APP_ID || secrets.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.AGENT_PR_HELPER_INSTALLATION_ID || secrets.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.AGENT_PR_HELPER_PRIVATE_KEY || secrets.GITHUB_APP_PRIVATE_KEY }}
        run: |
          # If scheduled, default min_prs=5; if dispatch or PR label, default min_prs=1
          DEFAULT_MIN="${{ github.event_name == 'schedule' && '5' || '1' }}"
          MIN_PRS="${{ inputs.min_prs || '' }}"
          MIN_PRS="${MIN_PRS:-$DEFAULT_MIN}"
          LIMIT="${{ inputs.limit || '5' }}"
          # বাংলা মন্তব্য: #2630 — HOLD_FLAG বাগ-সংস্কার: pull_request/check_suite
          # ইভেন্টে inputs.release_holds = null → পুরনো `!= false` এক্সপ্রেশনে
          # HOLD_FLAG="" হয়ে যেত (লাইভ-প্রমাণ: run 36699484649) — ফলে
          # --release-holds কখনো পাস হতো না এবং প্রতিটি queue:hold PR স্কিপ।
          # এখন: স্পষ্টভাবে false নিষিদ্ধ করলেই কেবল hold থাকবে (input default true)।
          HOLD_FLAG="${{ inputs.release_holds == false && '' || '--release-holds' }}"

          python scripts/ci/smart_priority_merger.py \
            --execute \
            --limit "$LIMIT" \
            --min-prs "$MIN_PRS" \
            $HOLD_FLAG \
            --app-auth
