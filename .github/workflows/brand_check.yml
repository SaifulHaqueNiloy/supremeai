name: 🛡️ Brand Compliance Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  brand-scan:
    name: 🔍 Scan for Brand Leaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Check for brand leaks in responses
        run: |
          python -c "
          import re
          import os
          
          # Forbidden patterns that indicate brand leakage
          FORBIDDEN_PATTERNS = [
              r'powered by\s*openai',
              r'powered by\s*groq', 
              r'powered by\s*anthropic',
              r'powered by\s*claude',
              r'built with\s*(?:gpt|claude|gemini)',
              r'(?:i am|i\'m)\s+(?:gpt|chatgpt|claude|gemini)',
              r'made by\s*openai',
              r'an\s*openai',
              r'a\s*groq',
              r'using\s*(?:gpt-|claude-)',
          ]
          
          violations = []
          
          # Scan Python files
          for root, dirs, files in os.walk('backend'):
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r', encoding='utf-8') as f:
                          content = f.read()
                          for pattern in FORBIDDEN_PATTERNS:
                              matches = re.findall(pattern, content, re.IGNORECASE)
                              if matches:
                                  violations.append(f'{filepath}: Found {pattern} -> {matches}')
          
          # Scan frontend files  
          for root, dirs, files in os.walk('frontend'):
              for file in files:
                  if file.endswith(('.tsx', '.ts', '.jsx', '.js')):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r', encoding='utf-8') as f:
                          content = f.read()
                          if any(keyword in content.lower() for keyword in ['powered by openai', 'made by openai']):
                              violations.append(f'{filepath}: Possible brand reference')
          
          if violations:
              print('❌ BRAND COMPLIANCE VIOLATIONS:')
              for v in violations:
                  print(f'  - {v}')
              exit(1)
          else:
              print('✅ No brand leaks detected')
          "

      - name: Generate Report
        if: always()
        run: |
          echo "## 🛡️ Brand Compliance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All user-facing code scanned for brand leaks" >> $GITHUB_STEP_SUMMARY
