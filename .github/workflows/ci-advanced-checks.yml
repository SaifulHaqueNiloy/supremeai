# Reusable workflow: Advanced Pre-Merge Checks
# Called by ci.yml when backend/frontend/infra changes are detected.
name: Advanced Pre-Merge Checks

on:
  workflow_call:
    inputs:
      changed:
        description: 'Whether any relevant changes were detected (backend|frontend|infra)'
        required: true
        type: boolean
    secrets:
      INFISICAL_CLIENT_ID:
        required: false
      INFISICAL_CLIENT_SECRET:
        required: false
      INFISICAL_PROJECT_ID:
        required: false
      INFISICAL_PROJECT_SLUG:
        required: false

permissions:
  contents: read

jobs:
  # =================================================================
  # বাংলা মন্তব্য (PERF-TRICK-2 & TRICK-3):
  # পূর্বে ৩টি সম্পূর্ণ পৃথক উবুন্টু ভিএম চালানো হতো:
  # (১) advanced-repository-checks
  # (২) advanced-security-checks
  # (৩) advanced-contract-checks
  # এবং অতিরিক্ত ১টি গেট জব ছিল। প্রতিটি জবে আলাদা গিট চেকআউট ও সেটআপে রানার মিনিট অপচয় হচ্ছিল।
  # তাছাড়া ci.yml-এ থাকা স্বতন্ত্র ৩টি রেজিস্ট্রি স্ক্রিপ্টও এখানে কনসোলিডেট করা হলো।
  # এখন একটি একক দ্রুতগতির পাইথন রানার ভিএম-এ পর্যায়ক্রমে সকল চেক সম্পন্ন হয়।
  # এতে প্রতি সিআই রানে ২টি অতিরিক্ত উবুন্টু ভিএম ও রানার মিনিট সাশ্রয় হয়।
  # =================================================================
  advanced-checks:
    name: Advanced Repository, Security & Contract Checks
    if: inputs.changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet astroid loguru requests httpx pyyaml

      # --- Section 1: Canonical Configuration Registry Checks (Trick 3) ---
      - name: Validate configuration registry structure
        run: python scripts/ci/validate_config_registry.py

      - name: Validate runtime-to-registry contract
        run: python scripts/ci/check_config_contract.py

      - name: Validate deployment hardcode policy
        run: python scripts/ci/check_hardcoded_deployment_config.py

      # --- Section 2: Repository & Contract Integrity ---
      - name: Validate intelligence baseline registry
        run: python scripts/ai/baseline_commands.py

      - name: Validate governance and dependency policy
        run: |
          test -f docs/architecture/SUPREMEAI_CORE_CONSTITUTION.md
          python scripts/ci/validate_dependency_policy.py

      - name: Route and capability drift checks
        env:
          TESTING: "1"
          ENV: test
          PRE_COMMIT: "1"
          # CI-12: ENCRYPTION_KEY generated at runtime below — no committed
          # secret-shaped literal to trip trufflehog/gitleaks.
        run: |
          export ENCRYPTION_KEY="$(openssl rand -base64 32)"
          python scripts/ci/validate_route_registry.py
          python -m unittest discover -s tests -p 'test_route_inventory.py' -v
          python -m unittest discover -s tests -p 'test_route_graph.py' -v
          python -m unittest discover -s tests -p 'test_route_graph_query.py' -v
          python -m unittest discover -s tests -p 'test_route_impact_report.py' -v
          python scripts/ci/generate_route_inventory.py
          python scripts/ci/generate_route_graph.py
          python scripts/ci/generate_topology_mermaid.py
          git diff --exit-code -- docs/generated/route_inventory.json docs/generated/route_knowledge_graph.json docs/generated/route_topology.mmd
          python -m unittest discover -s tests -p 'test_module_capability_matrix.py' -v
          python scripts/ci/generate_module_capability_matrix.py
          python scripts/ci/generate_domain_dependency_graph.py
          python scripts/ci/validate_domain_boundaries.py
          git diff --exit-code -- docs/generated/module_capability_matrix.json docs/generated/domain_dependency_graph.json docs/generated/domain_dependency_graph.mmd
          # বাংলা: ডকুমেন্টেশন সত্যতা গেট — STATUS.md-এর মেশিন-চেকেবল দাবি tree-বাস্তবের
          # সাথে না মিললে generator exit 1 + proof diff লাল (মিথ্যা দাবি CI পাস করতে পারে না)।
          python scripts/ci/generate_status_proof.py
          git diff --exit-code -- docs/generated/STATUS_PROOF.md
          python -c "
          import json, sys
          data = json.load(open('docs/generated/module_capability_matrix.json'))
          count_key = 'source_file_count' if 'source_file_count' in data else 'module_count'
          assert 'modules' in data and count_key in data, 'Matrix missing required keys'
          assert data[count_key] == len(data['modules']), f'{count_key} mismatch'
          assert data[count_key] > 0, 'Matrix is empty — generator may have failed'
          print(f'Matrix OK: {data[count_key]} modules/files validated')
          "

      - name: Build local release evidence bundle
        run: python scripts/ci/build_release_evidence.py --output ci-reports/release-evidence.json

      # বাংলা (V8): নীরব "No files were found" warning-এর বদলে সৎ, দিকনির্দেশক বার্তা —
      # artifact না থাকলে কেন নেই (আগের ধাপ ফেল) তা লগেই স্পষ্ট হয়; নীরব গ্যাপ নয়
      - name: Evidence artifact honest guard
        if: always()
        run: |
          if [ -f ci-reports/release-evidence.json ]; then
            echo "✅ release-evidence.json present"
          else
            echo "::warning::release-evidence.json তৈরি হয়নি — build_release_evidence.py বা তার আগের কোনো ধাপ ব্যর্থ হয়েছে; উপরের ধাপগুলো দেখুন (if-no-files-found: error ইচ্ছাকৃত কঠোর)"
          fi

      - name: Upload release evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: ci-reports/release-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Workflow and release contract gates
        run: |
          python -m unittest discover -s tests -p 'test_release_acceptance_gate.py' -v
          python scripts/ci/release_acceptance_gate.py ci-reports/release-acceptance.local.json
          python .github/scripts/validate_workflow_contracts.py --json workflow-contract-report.json
          python .github/scripts/validate_knowledge_manifest.py backend/data/supremeai_long_term_knowledge_v1.json

      - name: Upload workflow contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-contract-report
          path: workflow-contract-report.json
          retention-days: 7
          if-no-files-found: warn

      # --- Section 3: Security & Static Analysis ---
      - name: Security and abuse-pattern checks
        run: |
          python scripts/ci/check_dockerfile_security.py
          python scripts/ci/security_headers_checker.py
          python scripts/ci/check_frontend_secrets.py
          python scripts/ci/project_health_check.py
          python scripts/quality/regression_scanner.py --path backend --json regression_report.json --fail-on critical,high

      - name: Audit broad exception handlers
        run: python scripts/ci/audit_broad_exceptions.py --output broad-exceptions.json backend scripts

      - name: Audit resilience boundaries
        run: python scripts/ci/audit_resilience_boundaries.py --output resilience-boundaries.json backend

      # Ratchet gate (mirrors coverage_policy.yaml): fails only on definition
      # shadows NOT covered by scripts/ci/definition_shadowing_baseline.json.
      # Baseline includes owner-preserved duplicates (_tasks.py docstring) —
      # wire-first: never delete owner code without approval.
      - name: Audit definition shadowing (ratchet gate)
        run: python scripts/ci/audit_definition_shadowing.py --output definition-shadowing.json --baseline scripts/ci/definition_shadowing_baseline.json backend tools scripts

      - name: Build backup and observability evidence
        run: python scripts/ci/verify_operational_evidence.py --output operational-evidence.json

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-static-analysis-${{ github.sha }}
          path: |
            regression_report.json
            broad-exceptions.json
            resilience-boundaries.json
            definition-shadowing.json
            operational-evidence.json
          retention-days: 14
          if-no-files-found: warn

      # --- Section 4: Environment, Schema Drift & Deployment Pre-Flight ---
      - name: Contract and configuration gates
        run: |
          python scripts/ci/production_mismatch_gate.py --critical-only --summary "$GITHUB_STEP_SUMMARY"
          python scripts/advanced_analysis/api_contract_diff.py --fail-on-critical
          python scripts/advanced_analysis/db_model_drift_checker.py --fail-on-critical
          python scripts/advanced_analysis/migration_safety_diff.py --fail-on-critical
          python scripts/advanced_analysis/env_var_reconciler.py --fail-on-critical
          python scripts/advanced_analysis/hardcode_config_scanner.py
          python scripts/audit_env_usage.py --env .env.example

      - name: Validate production secret inventory
        continue-on-error: true
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV: prod
        run: |
          python scripts/ci/infisical_loader.py
          python scripts/verify_infisical_env.py --strict

      - name: Record advanced-check summary
        run: |
          {
            echo "## Advanced Checks Suite"
            echo "- Result: passed"
            echo "- Consolidated: repository, security, registry & contracts"
            echo "- Run: ${{ github.run_id }} | SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
