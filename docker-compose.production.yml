# ============================================================
# SupremeAI - Production Docker Compose Configuration
# Multi-service orchestration for production deployment
# ============================================================

version: '3.8'

services:
  # ----------------------------------------------------------
  # SUPREMAI BACKEND (FastAPI)
  # ----------------------------------------------------------
  supremeai-backend:
    build:
      # AUD/0.5 fix: this file previously referenced context ../../ with a root
      # "Dockerfile" target=production — neither exists, so the build could
      # never succeed. The canonical backend image lives at backend/Dockerfile
      # (multi-stage, runtime stage = what production runs).
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: supremeai/backend:${VERSION:-latest}
    container_name: supremeai-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - ENV=production
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; use python (same as backend/Dockerfile HEALTHCHECK).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "prometheus.job=supremeai-backend"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"

  # ----------------------------------------------------------
  # POSTGRESQL DATABASE (with pgvector)
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: supremeai-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_statement=ddl"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ----------------------------------------------------------
  # REDIS (Cache & Session Store)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: supremeai-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --save 300 100
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # PROMETHEUS (Metrics Collection)
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: supremeai-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=20GB'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - supremeai-backend
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # GRAFANA (Visualization Dashboards)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.3
    container_name: supremeai-grafana
    profiles: ["observability"]
    restart: unless-stopped
    env_file:
      - .env.grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # OPENTELEMETRY COLLECTOR (Observability)
  # ----------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.88.0
    container_name: supremeai-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./monitoring/opentelemetry/otel-collector-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus exporter metrics
      - "13133:13133" # Health check extension
    depends_on:
      - prometheus
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # ALERTMANAGER (Alert Routing)
  # ----------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: supremeai-alertmanager
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    depends_on:
      - prometheus
    networks:
      - supremeai-network

# ----------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------
networks:
  supremeai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ----------------------------------------------------------
# VOLUMES (Persistent Data)
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/postgresql
  
  redis_data:
    driver: local
  
  prometheus_data:
    driver: local
  
  grafana_data:
    driver: local
  
  alertmanager_data:
    driver: local
