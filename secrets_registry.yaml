# SupremeAI 2.0 — Secret/Env Registry (MACHINE-GENERATED from scripts/generate_registry.py)
# বাংলা: এই ফাইলটি auto-generate করা হয়েছে — হাতে এডিট নয়, generate_registry.py-এর _REG আপডেট করুন।
# প্রতিটা environment-এর জন্য আলাদা criticality (একই key এক env-এ critical, অন্য env-এ optional)।
#
# critical = না থাকলে boot crash -> CI fail
# important = না থাকলে degraded -> CI warning
# optional = না থাকলে শুধু feature বন্ধ -> log
keys:
  - name: ENV
    criticality: {render-backend: important, render-admin: important, vercel-frontend: optional, infisical-vault: important}
    note: "Environment name (production/staging)"
  - name: SUPREMEAI_JWT_SECRET
    min_length: 64
    criticality: {render-backend: critical, render-admin: critical, render-worker: critical, infisical-vault: critical}
    note: "JWT secret; <64 bytes হলে RuntimeError (config.py)"
  - name: ENCRYPTION_KEY
    min_length: 16
    criticality: {render-backend: critical, render-admin: critical, render-worker: critical, infisical-vault: critical}
    note: "Data encryption key (canonical)"
  - name: ENCRYPTION_KEY
    min_length: 16
    criticality: {render-backend: critical, render-admin: critical, render-worker: critical, infisical-vault: critical}
    note: "Payload encryption key (duplicate of ENCRYPTION_KEY)"
  - name: SUPREMEAI_ADMIN_PASSWORD_HASH
    criticality: {render-backend: critical, render-admin: critical, infisical-vault: critical}
    note: "Hashed admin password (config.py required)"
  - name: SUPREMEAI_ADMIN_TOTP_SECRET
    criticality: {render-backend: important, render-admin: important, infisical-vault: important}
    note: "Admin 2FA TOTP secret"
  - name: SUPREMEAI_API_KEY
    criticality: {render-backend: important, render-admin: important, infisical-vault: important}
    note: "Primary API authentication token"
