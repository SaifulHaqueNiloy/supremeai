services:
  - type: web
    name: supremeai-backend
    env: python
    buildCommand: "cd backend && pip install poetry && poetry config virtualenvs.create false && poetry install --only main"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CARGO_HOME
        value: /opt/render/project/src/.cargo

  - type: web
    name: supremeai-frontend
    env: static
    buildCommand: "npm install -g pnpm@9 && pnpm install --no-frozen-lockfile && cd frontend && pnpm run build:user"
    staticPublishPath: "./frontend/dist-user"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
