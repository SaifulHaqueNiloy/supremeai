# SupremeAI Configuration Control Plane
# No secret values are fetched or printed.
name: Configuration Control

on:
  push:
    branches: [main, develop, 'feature/*', 'fix/*']
    paths:
      - 'backend/core/**'
      - 'scripts/ci/**'
      - 'scripts/audit_env_usage.py'
      - 'secrets_registry.yaml'
      - '.env.example'
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/core/**'
      - 'scripts/ci/**'
      - 'scripts/audit_env_usage.py'
      - 'secrets_registry.yaml'
      - '.env.example'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Canonical Configuration Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate registry structure
        run: python scripts/ci/validate_config_registry.py

      - name: Validate runtime-to-registry contract
        run: python scripts/ci/check_config_contract.py

      - name: Validate deployment hardcode policy
        run: python scripts/ci/check_hardcoded_deployment_config.py
