name: Learned-Regression Scan (Offline, Zero-Cost)

# বাংলা মন্তব্য: scripts/quality/self_audit_scan.py generic bug pattern খোঁজে
# (mutable default arg, silent except:pass, ইত্যাদি) — এই workflow টা আলাদা,
# শুধু এই প্রজেক্টে বাস্তবে বারবার ফিরে আসা bug class গুলো (auth-bypass fallback,
# unguarded localhost, dual-module-identity, ইত্যাদি — regression_scanner.py-এর
# docstring দেখুন পুরো তালিকার জন্য) target করে খোঁজে। কোনো external dependency
# বা network call ছাড়াই stdlib দিয়ে চলে (Zero Cost নীতি)।
#
# critical/high severity finding পেলে PR ব্লক করে; medium/low শুধু report করে,
# ব্লক করে না (noise কমানোর জন্য)।

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  regression-scan:
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'promotion/staging')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run learned-regression scan
        run: |
          python3 scripts/quality/regression_scanner.py \
            --path backend \
            --json regression_report.json \
            --fail-on critical,high

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-report
          path: regression_report.json
          retention-days: 30
