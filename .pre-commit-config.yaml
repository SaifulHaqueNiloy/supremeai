# SupremeAI - Git Pre-commit Hooks Configuration
# =============================================
# এই ফাইলটি git commit করার আগে স্বয়ংক্রিয়ভাবে বিভিন্ন কোয়ালিটি চেক চালায়।

repos:
  # Python কোডের বেসিক ফরম্যাটিং এবং কোয়ালিটি চেক
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500'] # ৫০০ KB এর বড় ফাইল হলে কমিট আটকে দেবে
      - id: detect-private-key # ভুলে SSH বা SSL প্রাইভেট কী স্টেজ করলে ব্লক করবে

  # Secret Scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        exclude: package.json

  # 🚀 Ruff Linter & Formatter (Iron Curtain লোকাল ডিফেন্স লেয়ার)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [ --fix ] # কোডের বাগ এবং অব্যবহৃত ইম্পোর্ট নিজে থেকেই ফিক্স করে দেবে
      - id: ruff-format # সম্পূর্ণ কোডবেসকে স্ট্যান্ডার্ড ফরম্যাটে রাখবে

  # 🚀 টাইপ এরর লোকালি ব্লক করার জন্য (Mypy Static Type Checker)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-requests] # আপনার প্রোজেক্ট ডিপেনডেন্সি অনুযায়ী

  # Local Hooks Registry
  - repo: local
    hooks:
      # SupremeAI Security Guard - হার্ডকোডেড সিক্রেট ব্লকার
      - id: security-guard
        name: "🛡️ SupremeAI Security Guard"
        description: "স্টেজ করা ফাইলে হার্ডকোডেড API Key / সিক্রেট থাকলে কমিট ব্লক করে।"
        entry: python3 packages/scripts/security_guard.py
        language: system
        pass_filenames: false
        stages: [commit]
