# Branch Naming Guard (OPS-06 Safeguard 4 enforcement)
# ====================================================
# Phase 3: এই workflow একটি explicit "Branch Naming Guard" check-run তৈরি করে যা
# branch protection-এর required_status_checks দ্বারা block করা যায়।
# pr-pipeline.yml-এ validate-branch-name job (যা exit 1 করে) ছাড়াও এই standalone
# check-run দেয় আরও explicit gate — maintainer-দের জন্য দেখতে সুবিধা।
#
# Triggers:
#   - pull_request (opened/reopened/synchronize/ready_for_review)
#   - workflow_dispatch (manual test)
#
# Output: "Branch Naming Guard" check-run with conclusion:
#   - success: branch name matches OPS-06 pattern
#   - failure: branch name violates OPS-06 pattern (blocks merge via required_status_checks)

name: Branch Naming Guard

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to manually validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: branch-naming-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  branch-naming-guard:
    name: Branch Naming Guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve PR + branch metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)"
            BRANCH_NAME="$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)"
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "branch_name=$BRANCH_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "PR=$PR_NUMBER branch=$BRANCH_NAME sha=$HEAD_SHA"

      - name: Validate branch name + emit check-run (PASS or FAIL)
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch_name }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
        run: |
          set -euo pipefail

          # OPS-06 Safeguard 4 regex (kept in sync with pr-pipeline.yml).
          # AGENTS.md Sec 4 (persistent agent branch model, 90841db) defines bare
          # slots agent-1..agent-9 as the workspaces - PRs originate from the
          # assigned slot, so bare agent-N must pass. The legacy agent-X/issue-N-slug
          # form stays for back-compat (cannot coexist as git refs with bare slots).
          # Bot prefixes (dependabot/github-actions/renovate/pr-helper) are EXEMPT:
          # এরা human developer নয়, নিজেদের convention-মানা branch বানায় — naming
          # gate এদের block করলে dependency PR কখনোই auto-merge হতে পারে না।
          VALID_PATTERN='^(agent-[a-zA-Z0-9_-]+/issue-[0-9]+-.+|agent-[0-9]+(-[a-zA-Z0-9_-]+)?|feat/.+|fix/.+|hotfix/.+|perf/.+|chore/.+|test/.+|docs/.+|refactor/.+|ci/.+|dependabot/.+|github-actions/.+|renovate/.+|pr-helper/.+|develop|main)$'

          if [[ "$BRANCH_NAME" =~ $VALID_PATTERN ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ Branch name '$BRANCH_NAME' matches OPS-06 pattern"

            # Create a PASSING check-run so required_status_checks sees green
            gh api "repos/$GH_REPO/check-runs" \
              --method POST \
              -f name="Branch Naming Guard" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="success" \
              -f "output[title]=Branch name matches OPS-06 convention" \
              -f "output[summary]=Branch \`$BRANCH_NAME\` matches required pattern ✅" \
              -f "details_url=https://github.com/$GH_REPO/actions/runs/${{ github.run_id }}"

          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "❌ Branch name '$BRANCH_NAME' does NOT match OPS-06 pattern"

            # Create a FAILING check-run so required_status_checks blocks the merge
            gh api "repos/$GH_REPO/check-runs" \
              --method POST \
              -f name="Branch Naming Guard" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="failure" \
              -f "output[title]=Branch name violates OPS-06 convention" \
              -f "output[summary]=Branch '$BRANCH_NAME' doesn't match required pattern. Valid: agent-N (persistent slot, AGENTS.md Sec 4), agent-N/issue-N-<slug>, feat/, fix/, hotfix/, perf/, chore/, test/, docs/, refactor/, ci/ + bot prefixes (dependabot/, github-actions/, renovate/, pr-helper/)" \
              -f "details_url=https://github.com/$GH_REPO/actions/runs/${{ github.run_id }}"

            # Optional: ensure branch:invalid label exists (idempotent, non-fatal)
            gh label create "branch:invalid" --color "D93F0B" \
              --description "Branch name does not match OPS-06 regex" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "branch:invalid" 2>/dev/null || true

            echo "::error::Branch name '$BRANCH_NAME' violates OPS-06 naming convention"
            exit 1
          fi
