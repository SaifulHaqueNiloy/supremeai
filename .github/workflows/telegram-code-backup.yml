name: 📦 Telegram Codebase Backup Vault

on:
  push:
    branches: [main]
  schedule:
    # 🗓️ Weekly Full Codebase Backup (Every Sunday at 00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Backup Mode (auto, diff, full, all)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - diff
          - full
          - all

jobs:
  telegram_code_backup:
    name: 🚀 Archive & Push to Telegram Vault
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.x
        with:
          fetch-depth: 5

      - name: 🐍 Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.x
        with:
          python-version: '3.11'

      - name: 📦 Install Requirements
        run: |
          pip install httpx python-dotenv

      - name: 📤 Run Codebase Vault Backup & Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKUP_MODE: ${{ inputs.mode || 'auto' }}
        run: |
          python scripts/backup/telegram_code_backup.py --mode "$BACKUP_MODE"
