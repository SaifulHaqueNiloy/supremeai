# QA Engine — Post-Deploy Smoke (Part 7.5 of the QA engine plan, adapted)
# বাংলা: এই canary আগে workflow_run দিয়ে "Production Deploy"-এর স্বতন্ত্র run-এর
# অপেক্ষায় ছিল — কিন্তু Production Deploy একটি reusable (workflow_call) workflow,
# যা কখনোই স্বতন্ত্র run তৈরি করে না → ট্রিগার স্থাপত্যগতভাবে মৃত ছিল (০ run, চিরকাল)।
# এখন দুইভাবে চলে:
#   1. workflow_call — ci.yml সরাসরি production-deploy সফল হলে ডাকে (প্রধান পথ)
#   2. workflow_dispatch — ম্যানুয়াল যাচাই
# সততা চুক্তি: PRODUCTION_URL অনুপস্থিত → job সফল কিন্তু ::warning + summary-তে
# বড় করে UNVERIFIED (নীরব ভুয়া পাস নয়); URL থাকলে Playwright ব্যর্থতা = কঠোর লাল।
name: QA — Post-Deploy Smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supremeai-post-deploy-smoke
  cancel-in-progress: false

jobs:
  canary-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_BASE_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Report UNVERIFIED when no production target (loud, not silent)
        if: ${{ env.QA_BASE_URL == '' }}
        run: |
          echo "::warning::PRODUCTION_URL secret is not configured — post-deploy canary CANNOT verify the live path. Honest state: production E2E is UNVERIFIED."
          echo "### 🎭 Post-Deploy Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "**UNVERIFIED** — \`PRODUCTION_URL\` secret not configured; canary did not run (fail-closed would block every deploy for a capability that was never set up). Set the secret, then the next deploy gets a real canary." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browsers (Chromium)
        if: ${{ env.QA_BASE_URL != '' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for deployment to stabilize
        if: ${{ env.QA_BASE_URL != '' }}
        run: sleep 60

      - name: Run production guest canary (@smoke)
        if: ${{ env.QA_BASE_URL != '' }}
        run: pnpm exec playwright test -c qa/playwright.config.qa.ts --project=guest --grep=@smoke

      - name: Alert on failure (rollback decision needed)
        if: failure()
        run: |
          echo "::error::Post-deploy canary FAILED against production. Rollback decision required (see runbooks: scripts/deploy + docs/runbooks)."
          echo "### 🎭 Post-Deploy Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "**FAILED against production** — rollback decision required (runbooks: \`scripts/deploy\` + \`docs/runbooks\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.QA_BASE_URL != ''
        with:
          name: qa-postdeploy-results
          path: qa/results/results.json
          retention-days: 7
