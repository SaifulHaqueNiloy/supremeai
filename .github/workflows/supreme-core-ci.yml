name: 🧠 SupremeAI Core CI

on:
  workflow_dispatch:
    inputs:
      run_pre_merge_gate:
        description: 'Run Pre-Merge Gate'
        type: boolean
        default: true
      run_backend_core:
        description: 'Run Backend Core'
        type: boolean
        default: true
      run_frontend_core:
        description: 'Run Frontend Core'
        type: boolean
        default: true
      run_performance_e2e:
        description: 'Run Performance E2E'
        type: boolean
        default: true
      deploy_target:
        description: 'Select Deploy Target (Render/Cloud)'
        type: choice
        options:
          - 'AUTO'
          - 'ALL_SERVICES'
          - 'RENDER_BACKEND_ONLY'
          - 'VERCEL_FRONTEND_ONLY'
          - 'FIREBASE_ADMIN_ONLY'
          - 'NONE'
        default: 'AUTO'
      run_deploy_render:
        description: 'Run Deploy to Render'
        type: boolean
        default: true
      run_health_audit:
        description: 'Run Environment Health & Secret Drift Audit'
        type: boolean
        default: true
      ignore_dependencies:
        description: 'Force run selected job even if upstream jobs are skipped?'
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'
  SUPREMEAI_API_URL: ${{ vars.SUPREMEAI_API_URL }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==============================================================================
  # ⚡ 1. PREFLIGHT & CHANGE DETECTION (Fast Gate)
  # ==============================================================================
  changes:
    name: ⚡ Change Detection & Path Filter
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'promotion/staging')"
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.detect.outputs.force_backend == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'ALL_SERVICES' || github.event.inputs.deploy_target == 'RENDER_BACKEND_ONLY' || github.event.inputs.run_backend_core == true || github.event.inputs.ignore_dependencies == true)) || github.run_attempt > 1 }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.detect.outputs.force_frontend == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'ALL_SERVICES' || github.event.inputs.deploy_target == 'VERCEL_FRONTEND_ONLY' || github.event.inputs.deploy_target == 'FIREBASE_ADMIN_ONLY' || github.event.inputs.run_frontend_core == true || github.event.inputs.ignore_dependencies == true)) || github.run_attempt > 1 }}
      dependencies: ${{ steps.filter.outputs.dependencies == 'true' || steps.detect.outputs.force_dependencies == 'true' || github.run_attempt > 1 }}
      docs_only: ${{ steps.filter.outputs.docs_only == 'true' }}
      trivial_change: ${{ steps.gate-logic.outputs.trivial_change }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect previous failures
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/detect-previous-failures.py

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'poetry.lock'
            frontend:
              - 'frontend/**'
              - 'packages/**'
              - 'apps/**'
              - 'tools/vscode-extension/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            dependencies:
              - 'poetry.lock'
              - 'pnpm-lock.yaml'
              - 'backend/pyproject.toml'
              - 'package.json'
            docs_only:
              - 'README.md'
              - 'docs/**'
              - '*.md'
              - '!.github/**'

      - name: Evaluate Trivial Changes
        id: gate-logic
        run: |
          if [ "${{ steps.filter.outputs.docs_only }}" == "true" ] && [ "${{ steps.filter.outputs.backend }}" != "true" ] && [ "${{ steps.filter.outputs.frontend }}" != "true" ]; then
            echo "trivial_change=true" >> $GITHUB_OUTPUT
          else
            echo "trivial_change=false" >> $GITHUB_OUTPUT
          fi

  # ==============================================================================
  # 🔐 2. CALL REUSABLE WORKFLOWS
  # ==============================================================================
  audit:
    name: 🔍 Audit & Preflight
    needs: [changes]
    uses: ./.github/workflows/reusable-audit.yml
    with:
      trivial_change: ${{ needs.changes.outputs.trivial_change }}
    secrets: inherit

  backend:
    name: 🐍 Backend Pipeline
    needs: [changes, audit]
    uses: ./.github/workflows/reusable-backend.yml
    with:
      backend_changed: ${{ needs.changes.outputs.backend }}
      dependencies_changed: ${{ needs.changes.outputs.dependencies }}
      run_backend_core: ${{ github.event.inputs.run_backend_core }}
      run_attempt: ${{ github.run_attempt }}
      is_workflow_dispatch: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  frontend:
    name: 🌐 Frontend Pipeline
    needs: [changes, audit]
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      frontend_changed: ${{ needs.changes.outputs.frontend }}
      dependencies_changed: ${{ needs.changes.outputs.dependencies }}
      docs_only_changed: ${{ needs.changes.outputs.docs_only }}
      run_frontend_core: ${{ github.event.inputs.run_frontend_core }}
      run_attempt: ${{ github.run_attempt }}
      is_workflow_dispatch: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  deploy:
    name: 🚀 Deployment Matrix
    needs: [backend, frontend]
    if: always() && needs.backend.result != 'failure' && needs.frontend.result != 'failure' && needs.backend.result != 'cancelled' && needs.frontend.result != 'cancelled'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      repository: ${{ github.repository }}
      repository_owner: ${{ github.repository_owner }}
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      event_name: ${{ github.event_name }}
      deploy_target: ${{ github.event.inputs.deploy_target }}
      run_deploy_render: ${{ github.event.inputs.run_deploy_render }}
      ignore_dependencies: ${{ github.event.inputs.ignore_dependencies }}
    secrets: inherit

  staging-pr-promotion:
    name: 🟢 Auto Promotion PR (Staging → Main)
    needs: [deploy]
    if: always() && github.repository == 'SaifulHaqueNiloy/supremeai' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true  # Advisory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create Promotion PR
        env:
          GH_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "✅ Staging tests passed. Ready for production promotion."

  # ==============================================================================
  # 🧠 7. SMART PIPELINE SUMMARY FINALIZER (Always Runs)
  # ==============================================================================
  smart-summary:
    name: 🧠 Smart Pipeline Summary
    needs:
      - changes
      - audit
      - backend
      - frontend
      - deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Generate Pipeline Telemetry & Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 .github/scripts/ci_smart_summary.py || true
          python3 .github/scripts/ci_error_report.py || true
