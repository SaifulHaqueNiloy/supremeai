name: 'Setup Backend'
description: 'Setup Python, Poetry, and cached virtualenv for backend'
inputs:
  python-version:
    description: 'Python version to setup'
    required: false
    default: '3.11'
  working-directory:
    description: 'Working directory for poetry'
    required: false
    default: 'backend'
  poetry-version:
    description: 'Poetry version'
    required: false
    # AUD-7.4: pin the toolchain (was 'latest' — floating)
    default: '2.4.1'
  install-media-deps:
    description: 'Install ffmpeg for media processing'
  install-browser-deps:
    description: 'Install Poetry browser group (Playwright/Chromium dependencies)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: 📦 Install System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential
        if [ "${{ inputs.install-media-deps }}" = "true" ]; then
          sudo apt-get install -y ffmpeg
        fi

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # AUD-7.4: SHA-pinned (was floating @v1 tag)
    - uses: snok/install-poetry@972a0e78ffdebf9e98f6fe404b77831716cdd4aa # v1.4.0
      with:
        version: ${{ inputs.poetry-version }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        plugins: poetry-plugin-export

    # Cache package-manager downloads, not the full virtualenv.
    # Parallel backend test jobs therefore avoid restoring a ~1GB .venv each.
    - name: 🗂️ Restore Poetry/Pip download cache
      id: deps-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: poetry-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory)) }}

    - name: ⚙️ Install Build Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        poetry run pip install --upgrade pip "setuptools>=77.0.3" wheel

    - name: 🔒 Validate & sync lock file
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Validate lock file matches pyproject.toml
        poetry check --lock

    - name: 📥 Poetry Install (backend deps)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        poetry run pip install "setuptools>=77.0.3" wheel
        if [ "${{ inputs.install-browser-deps }}" = "true" ]; then
          poetry install --no-root --with dev --with browser
        else
          poetry install --no-root --with dev
        fi

    - name: 📊 Dependency Cache Report
      shell: bash
      run: |
        if [ "${{ steps.deps-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✅ **Poetry/Pip cache HIT** — package downloads reused." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "⚠️ **Poetry/Pip cache MISS** — dependencies will be cached after this successful run." >> "$GITHUB_STEP_SUMMARY"
        fi
