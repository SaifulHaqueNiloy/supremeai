# =============================================================================
# SupremeAI Task Engine — Automatic Task Detection, Routing & Execution
# =============================================================================
# Event-driven task pipeline:
#   1. Detect: Watch GitHub events, CI, schedules → emit Task objects
#   2. Route: Match tasks to agents by priority, capability, dependencies
#   3. Execute: Assign tasks, trigger agents, chain workflows
#   4. Verify: Check task completion, trigger next in chain
# =============================================================================

name: Task Engine

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, merged, ready_for_review]
  workflow_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"  # Every 30 minutes
  workflow_dispatch:
    inputs:
      action:
        description: "detect | route | workflow"
        required: true
        default: "detect"
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Task Detection — Emit tasks from GitHub events
  # ---------------------------------------------------------------------------
  detect:
    name: "🔍 Detect Tasks"
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'detect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Detect tasks from events
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/ci/task_detector.py --format json > /tmp/detected_tasks.json || true
          if [ -s /tmp/detected_tasks.json ]; then
            echo "detected_tasks<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/detected_tasks.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # 2. Task Routing — Match tasks to available agents
  # ---------------------------------------------------------------------------
  route:
    name: "🔀 Route Tasks"
    needs: detect
    if: always() && needs.detect.outputs.detected_tasks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Route tasks to agents
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/ci/task_router.py --format json

  # ---------------------------------------------------------------------------
  # 3. Workflow Orchestration — Chain tasks automatically
  # ---------------------------------------------------------------------------
  orchestrate:
    name: "🔗 Orchestrate Workflows"
    needs: [detect, route]
    if: always() && (needs.detect.outputs.detected_tasks != '' || needs.route.outputs.routed_tasks != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Orchestrate workflows
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/ci/workflow_orchestrator.py --list
