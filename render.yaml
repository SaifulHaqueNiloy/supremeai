# SupremeAI 2.0 — Modular Monolith Blueprint (Zero Cost Edition)
# Phase 1: Consolidated Backend + Scraper on Render (free tier)
services:
  - type: web
    name: supremeai-backend-v2
    env: image
    image:
      url: ghcr.io/saifulhaqueniloy/supremeai/supremeai-core:main
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health/live
    autoDeploy: false  # CI pipeline is the single deploy authority
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: ALLOWED_HOSTS
        value: .onrender.com,onrender.com
      - key: USER_CORS_ORIGINS
        value: https://*.vercel.app
      - key: ADMIN_CORS_ORIGINS
        value: https://*.vercel.app
      - key: SCRAPER_MAX_CONCURRENCY
        value: "3"
      - key: SCRAPER_TIMEOUT_SECONDS
        value: "45"
      - key: WORKERS_COUNT
        value: "1"
