# PR & Issue management helper for SupremeAI autonomous agents.
# Automatically tracks issues, labels in-progress, and manages issue lifecycles
# via manual or automated workflow_dispatch events.

name: Issue Labeler & Agent Automation

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to act on"
        required: true
        type: string
      action:
        description: "One of: label | comment | close | reopen"
        required: true
        type: string
      value:
        description: "Labels (comma-separated) for label action, or comment body for comment/close"
        required: false
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read

# Concurrency scoped to issue number to prevent race conditions
concurrency:
  group: issue-labeler-${{ github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply issue action
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          ACTION: ${{ github.event.inputs.action }}
          VALUE: ${{ github.event.inputs.value }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const num = parseInt(process.env.ISSUE_NUMBER, 10);
            const action = process.env.ACTION;
            const value = process.env.VALUE || '';

            if (!Number.isInteger(num) || num <= 0) {
              core.setFailed(`Invalid issue_number: ${process.env.ISSUE_NUMBER}`);
              return;
            }

            switch (action) {
              case 'label': {
                const labels = value.split(',').map(s => s.trim()).filter(Boolean);
                if (labels.length === 0) { core.setFailed('No labels provided'); return; }
                await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels });
                console.log(`Added labels [${labels.join(', ')}] to issue #${num}`);
                break;
              }
              case 'comment': {
                if (!value) { core.setFailed('Empty comment'); return; }
                await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                console.log(`Posted comment to issue #${num}`);
                break;
              }
              case 'close': {
                if (value) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                }
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: 'completed' });
                console.log(`Closed issue #${num}`);
                break;
              }
              case 'reopen': {
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'open', state_reason: 'reopened' });
                console.log(`Reopened issue #${num}`);
                break;
              }
              default:
                core.setFailed(`Unknown action: ${action}`);
            }
