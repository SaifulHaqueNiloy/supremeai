name: Silent Error Scan (Automatic)

# বাংলা মন্তব্য: এই workflow টি সাপ্তাহিক + প্রতিটি PR-এ scripts/detect_silent_errors.py
# চালায় — codebase-এ কোনো NEW সাইলেন্ট এরর (except:pass, create_task fire-and-forget,
# empty catch, unguarded JSON.parse, ইত্যাদি) যুক্ত হলে CI fail করায়। baseline
# (scripts/silent_errors_baseline.json) এর সাথে তুলনা করে তাই শুধু *নতুন* সাইলেন্ট
# এরর গেটে আটকে — পুরাতন পরিচিতগুলো রিপোর্ট হিসেবে থেকে যায়। Shipped-এর সাথে
# matching করার জন্য zero-dependency (stdlib only) — কোনো pip/network লাগে না।

on:
  schedule:
    - cron: '0 4 * * 1'  # প্রতি সোমবার ৪টা UTC (সাপ্তাহিক報告)
  workflow_dispatch: {}
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  silent-error-scan:
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'promotion/staging')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run silent error detector (regression gate)
        run: |
          python3 scripts/detect_silent_errors.py \
            --scan-dirs backend frontend/src apps packages shared tools config configs scripts migrations \
            --baseline scripts/silent_errors_baseline.json \
            --fail-on high \
            --json silent_errors_report.json \
            --markdown silent_errors_summary.md

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-errors-report
          path: |
            silent_errors_report.json
            silent_errors_summary.md
          if-no-files-found: ignore
