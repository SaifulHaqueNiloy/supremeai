name: Build CI Base Image
on:
  push:
    paths: ['backend/Dockerfile.ci', 'backend/poetry.lock']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ github.repository }}/backend-ci-base:latest
