name: 🧠 SupremeAI Core CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore', 'logs/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'Force backend tests to run'
        required: false
        default: false
        type: boolean
      force_frontend:
        description: 'Force frontend tests to run'
        required: false
        default: false
        type: boolean
      force_security:
        description: 'Force security scan to run'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'
  SUPREMEAI_API_URL: ${{ vars.SUPREMEAI_API_URL }}

jobs:
  circuit-breaker:
    name: 🛑 Detect Previous Failure
    runs-on: ubuntu-latest
    outputs:
      previous_failed: ${{ steps.check.outputs.previous_failed }}
    steps:
      - name: Check Last Completed Run Status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_FILENAME="supreme-core-ci.yml"
          
          # GitHub REST API দিয়ে সর্বশেষ 'completed' হওয়া পাইপলাইনের স্ট্যাটাস বের করা
          LAST_CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILENAME/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo "null")
          
          echo "Previous run conclusion: $LAST_CONCLUSION"
          
          # Check if the commit message contains [bypass-breaker]
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[bypass-breaker]"* ]]; then
            echo "⚠️ Bypass flag detected in commit message. Skipping circuit breaker check!"
            echo "previous_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ "$LAST_CONCLUSION" == "failure" ]; then
            echo "❌ Previous run FAILED - Force running all tests"
            echo "previous_failed=true" >> $GITHUB_OUTPUT
          elif [ "$LAST_CONCLUSION" == "null" ]; then
            echo "⏭️ No previous completed runs found - First run detected"
            echo "previous_failed=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Previous run succeeded"
            echo "previous_failed=false" >> $GITHUB_OUTPUT
          fi
          
          # Debug output
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Circuit Breaker Status" >> $GITHUB_STEP_SUMMARY
          echo "- Last Conclusion: $LAST_CONCLUSION" >> $GITHUB_STEP_SUMMARY
          echo "- Will Force Tests: $(grep 'previous_failed' $GITHUB_OUTPUT | cut -d= -f2)" >> $GITHUB_STEP_SUMMARY

  detect-changes:
    name: 🔍 Smart Router
    needs: circuit-breaker
    runs-on: ubuntu-latest
    outputs:
      # বাংলা মন্তব্য: প্রতিটি পুশে সকল জব সচল রাখার জন্য ডাইনামিক চেঞ্জ ডিটেকশন সাময়িকভাবে ডিজেবল করে হার্ডকোডেড 'true' করা হলো
      backend: 'true'
      frontend: 'true'
      any_changed: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**', 'packages/shared-types/**', 'Dockerfile', 'pyproject.toml', 'poetry.lock']
            frontend: ['apps/**', 'tools/vscode-extension/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/**', '.github/scripts/**']
            changes: ['**']
      
      - name: 📋 Log Change Detection
        run: |
          echo "## 🔍 Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Changed: ${{ steps.filter.outputs.backend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Changed: ${{ steps.filter.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Any Files Changed: ${{ steps.filter.outputs.changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- Circuit Breaker (Previous Failed): ${{ needs.circuit-breaker.outputs.previous_failed }}" >> $GITHUB_STEP_SUMMARY

  production-readiness:
    name: 🚀 Production Readiness (Safety Guard, Multi-Model Validator, Codegraph)
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        working-directory: backend
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --sync --with dev --without ml

      - name: 🛡️ Safety Guard - File Protection Validation
        id: safety_guard
        working-directory: backend
        continue-on-error: true
        run: |
          echo "## 🛡️ Safety Guard Validation" >> $GITHUB_STEP_SUMMARY
          python ../scripts/safety_guard.py --check-only --report-json > safety-report.json 2>&1 || true
          
          # Parse and summarize
          if [ -f safety-report.json ]; then
            echo "✅ Safety Guard completed - see report" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Safety Guard validation passed" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 🔍 Multi-Model Validator - Security & Logic Check
        id: validator
        working-directory: backend
        continue-on-error: true
        run: |
          echo "## 🔍 Multi-Model Code Validation" >> $GITHUB_STEP_SUMMARY
          python ../scripts/multi_model_validator.py ../backend/core/ --json-output validator-report.json 2>&1 || true
          
          # Check for critical issues
          if [ -f validator-report.json ]; then
            CRITICAL=$(grep -c "risk_level.*CRITICAL" validator-report.json || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "⚠️ Found $CRITICAL critical issues - review required" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No critical security issues detected" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 📊 Codegraph - Knowledge Base Generation
        id: codegraph
        working-directory: backend
        continue-on-error: true
        run: |
          echo "## 📊 Knowledge Graph Generation" >> $GITHUB_STEP_SUMMARY
          python ../scripts/codegraph_integration.py --full --output-dir ../docs/codebase/knowledge_graph 2>&1 || true
          echo "✅ Knowledge graph updated" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Production Readiness Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-reports
          path: |
            backend/safety-report.json
            backend/validator-report.json
            docs/codebase/knowledge_graph/

      - name: 🚨 Production Readiness Summary
        if: always()
        run: |
          echo "## ✅ Production Readiness Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Systems Status:" >> $GITHUB_STEP_SUMMARY
          echo "- Safety Guard: ${{ steps.safety_guard.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-Model Validator: ${{ steps.validator.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Codegraph: ${{ steps.codegraph.outcome }}" >> $GITHUB_STEP_SUMMARY

  backend-core:
    name: 🐍 Backend (Test & Auto-Fix)
    needs: production-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Dependencies
        working-directory: backend
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --sync --with dev --without ml
      
      - name: 🧹 Lint Code (Auto-Fix & Warning Mode)
        working-directory: backend
        run: |
          poetry run ruff check . --fix
          poetry run ruff format .
 
      - name: 🧪 Run Tests
        id: backend_tests
        working-directory: backend
        env:
          SUPREMEAI_ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
          PYTHONPATH: ${{ github.workspace }}/backend
          GITHUB_TOKEN: "mock_dummy_token"
          RENDER_API_KEY: "mock_render_key"
          SUPABASE_DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
          ADMIN_AUTHORIZED: "true"
        run: |
          poetry run pytest --md pytest-report.md \
            --cov=core --cov-report=json:coverage.json --cov-report=term-missing --cov-fail-under=25 -q || true

      - name: Add Backend Test Results to GitHub Summary
        if: always()
        working-directory: backend
        run: |
          python ../.github/scripts/generate-ci-report.py \
            --pytest-json pytest-report.md \
            --coverage-json coverage.json \
            --label Backend

      - name: 🔧 SupremeAI Auto-Fix Engine
        if: failure() && steps.backend_tests.outcome == 'failure'
        working-directory: backend
        env:
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
        run: poetry run python ../.github/scripts/ci-auto-fix-v3.py --job backend-test --mode fix

  security-audit:
    name: 🛡️ CodeQL & Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'python, javascript'
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript"

      - name: 🔍 Trivy Scan - Python Dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'sarif'
          output: 'trivy-python.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: 🔍 Trivy Scan - Node.js Dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps,tools'
          format: 'sarif'
          output: 'trivy-nodejs.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy Python SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-python.sarif'
          category: 'trivy-python'
        continue-on-error: true

      - name: Upload Trivy Node.js SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-nodejs.sarif'
          category: 'trivy-nodejs'
        continue-on-error: true

      - name: 📊 Add Security Audit Results to GitHub Summary
        if: always()
        run: |
          echo "## 🛡️ Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          echo "✅ CodeQL SARIF report uploaded to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trivy Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python dependencies scanned (backend/)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js dependencies scanned (apps/, tools/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View full results in the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)**" >> $GITHUB_STEP_SUMMARY

  frontend-core:
    name: 🌐 Frontend Monorepo (Turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      
      - name: Install Frontend Dependencies
        env:
          VITE_API_URL: ${{ env.SUPREMEAI_API_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm store prune

      - name: Build & Lint Frontend Packages
        run: pnpm turbo run build lint --filter=supremeai-studio-client --filter=@supremeai/web-chat --filter=supremeai-vscode

      - name: Run Studio Client Vitest with JSON Report
        run: pnpm --dir apps/studio-client exec vitest run --reporter=json > apps/studio-client/vitest-report.json

      - name: Add Studio Client Test Results to GitHub Summary
        if: always()
        continue-on-error: true
        run: python .github/scripts/generate-ci-report.py --vitest-json apps/studio-client/vitest-report.json --label "Studio Client"

      - name: Run Web Chat Vitest with JSON Report
        run: pnpm --dir apps/web-chat exec vitest run --reporter=json > apps/web-chat/vitest-report.json

      - name: Add Web Chat Test Results to GitHub Summary
        if: always()
        continue-on-error: true
        run: python .github/scripts/generate-ci-report.py --vitest-json apps/web-chat/vitest-report.json --label "Web Chat"

      - name: Run VS Code Extension Tests
        run: pnpm turbo run test --filter=supremeai-vscode

      - name: Playwright Install & Test
        continue-on-error: true
        run: |
          pnpm exec playwright install --with-deps
          pnpm exec playwright test

      - name: 🔧 SupremeAI Auto-Fix Engine (Frontend)
        if: failure()
        env:
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install litellm
          python .github/scripts/ci-auto-fix-v3.py --job frontend --mode fix

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            apps/studio-client/dist
            apps/web-chat/dist
          retention-days: 1

  performance-e2e-test:
    name: 🧪 Human Simulation & Load Tests
    needs: [backend-core, frontend-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Start Frontend Preview Server
        run: |
          cd apps/studio-client && pnpm exec vite preview --port 5173 &
          sleep 5
        env:
          CI: true
      - name: Run Human Simulation & Load Tests
        run: pnpm exec playwright test --reporter=html
        env:
          CI: true
      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-human-test-report
          path: playwright-report/
          retention-days: 7

  deploy-backend:
    name: 🚀 Deploy Backend (Cloud Run)
    needs: backend-core
    if: |
      always() && 
      github.ref == 'refs/heads/main' &&
      needs.backend-core.result != 'failure' && needs.backend-core.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: GCP Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate Docker to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      
      - uses: docker/setup-buildx-action@v3
      
      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/supremeai-repo/supremeai-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 🚀 Deploy API to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: python .github/scripts/deploy-backend.py

  load-test:
    name: ⏱️ Load Test (k6)
    needs: [backend-core, frontend-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start Backend for Testing
        working-directory: backend
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --sync --without ml
          
          # Create credentials file for Google Cloud/Firestore
          echo "$GCP_SA_KEY" > $HOME/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcp_key.json"
          
          poetry run python main.py &
          sleep 12
      # বাংলা মন্তব্য: k6io/setup-k6 রিপোজিটরি অপসারিত হওয়ায় grafana/setup-k6-action@v1 ব্যবহার করা হলো
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 load test
        env:
          SUPREMEAI_URL: "http://127.0.0.1:8000"
        run: |
          echo "Running k6 load test against ${SUPREMEAI_URL}"
          k6 run --out json=load-test-output.json scripts/k6/load_test.js
      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test
          path: load-test-output.json

  deploy-frontend:
    name: 🌐 Deploy Frontend (Firebase)
    needs: frontend-core
    if: |
      always() && 
      github.ref == 'refs/heads/main' &&
      needs.frontend-core.result != 'failure' && needs.frontend-core.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: 📥 Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps

      - name: 🌐 Deploy to Firebase
        run: |
          npx -y firebase-tools deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}" || true

  sync-mirror:
    name: 📤 Sync to Secondary Repo
    needs: [deploy-backend, deploy-frontend, security-audit]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-backend.result != 'failure' && needs.deploy-backend.result != 'cancelled' &&
      needs.deploy-frontend.result != 'failure' && needs.deploy-frontend.result != 'cancelled' &&
      needs.security-audit.result != 'failure' && needs.security-audit.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📤 Sync to Secondary Repo (Staging Dispatch)
        if: env.MIRROR_REPO_TOKEN != ''
        env:
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          git remote add mirror https://x-access-token:${MIRROR_REPO_TOKEN}@github.com/SaifulHaqueNiloy/supremeai.git
          git push mirror main:refs/heads/main

  generate-codebase-docs:
    name: 📝 Auto-Generate & Deploy Docs
    # বাংলা মন্তব্য: মেইন বা ডেভেলপ ব্রাঞ্চে পুশ করা হলে স্বয়ংক্রিয়ভাবে কোডবেসের মার্কডাউন ফাইল ও ড্যাশবোর্ড জেনারেট এবং ডিপ্লয় হবে
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Smart Docs & Dashboard
        run: python scripts/generate_smart_docs.py
        
      - name: Commit and Push Docs to Repo
        id: push_docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/autogen/
          git diff-index --quiet HEAD || (git commit -m "docs: auto-update codebase docs & dashboard [skip ci]" && git push) || echo "No changes to commit"
      - name: Setup GitHub Pages Environment
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true # বাংলা মন্তব্য: রিপোজিটরিতে যদি পেজেস কনফিগার করা না থাকে, তবে এটি স্বয়ংক্রিয়ভাবে অ্যাকশনস সোর্স দিয়ে চালু করবে।
      - name: Prepare Pages Content (exclude large files)
        if: github.ref == 'refs/heads/main'
        run: |
          # বাংলা মন্তব্য: codebase_full.md ফাইলটি ১৩MB+ বড় হওয়ায় GitHub Pages limit অতিক্রম করে, তাই বাদ দেওয়া হচ্ছে
          find docs/autogen -name "codebase_full.md" -delete || true
          # বাংলা মন্তব্য: ১ MB-র বেশি সাইজের চেঞ্জলগ ফাইলগুলো বাদ দেওয়া হচ্ছে — বড় কমিট ডিফ পেজেস ডিপ্লয়মেন্ট ব্যর্থ করে
          find docs/autogen/changes -name "change_*.md" -size +1M -delete || true
          # বাংলা মন্তব্য: ফাইনাল সাইজ দেখানো হচ্ছে যাতে ডিবাগ করা সহজ হয়
          echo "📦 Final docs/autogen size for Pages:"
          du -sh docs/autogen/ || true
          echo "✅ Large files excluded from Pages deployment"
      - name: Upload Artifact to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/autogen'
      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4


  ci-report:
    name: 📊 Generate Smart CI Report
    needs: [deploy-backend, deploy-frontend, sync-mirror, generate-codebase-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Report
        run: python .github/scripts/generate-ci-report.py --type core
