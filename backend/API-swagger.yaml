        \u0996\u09BE\u09A8\u09C7 \u09AD\u09CD\u09AF\u09BE\u09B2\u09BF\u09A1\u09C7\u099F\
        \ \u09B9\u09AF\u09BC \u098F\u09AC\u0982 \u09B8\u09AB\u09B2 \u09B9\u09B2\u09C7\
        \ Redis-\u098F\n\u099F\u09CD\u09B0\u09BE\u09B8\u09CD\u099F\u09C7\u09A1 \u0995\
        \u09A8\u099F\u09C7\u0995\u09CD\u09B8\u099F (last_context) \u0986\u09AA\u09A1\
        \u09C7\u099F \u09B9\u09AF\u09BC\u09C7 \u09AF\u09BE\u09AF\u09BC\u0964"
      operationId: verify_otp_api_admin_verify_otp_post
