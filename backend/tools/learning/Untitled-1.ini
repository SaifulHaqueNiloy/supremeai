// Bangla language toggle with auto-detection
const useBanglaMode = () => {
  const [isBangla, setIsBangla] = useState(() => {
    return navigator.language.startsWith('bn') ||
           localStorage.getItem('lang') === 'bn';
  });

  useEffect(() => {
    document.documentElement.lang = isBangla ? 'bn' : 'en';
    localStorage.setItem('lang', isBangla ? 'bn' : 'en');
  }, [isBangla]);

  return { isBangla, setIsBangla };
};
