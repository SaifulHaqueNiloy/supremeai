# Reusable workflow: Docker Image Build, Sign & Publish + Budget Guard
# Called by ci.yml after backend tests pass on main branch.
name: Docker Publish

on:
  workflow_call:
    inputs:
      publish-core:
        description: 'Whether to publish the core image (backend changed)'
        required: true
        type: boolean
      publish-scraper:
        description: 'Whether to publish the scraper image (scraper changed)'
        required: true
        type: boolean
      build-allowed:
        description: 'Whether Render preflight allows the build (quota check passed)'
        required: true
        type: boolean
    outputs:
      core-digest:
        description: 'Digest of the published core image'
        value: ${{ jobs.publish-core-image.outputs.core-digest }}
      core-tags:
        description: 'Tags of the published core image'
        value: ${{ jobs.publish-core-image.outputs.core-tags }}
    secrets:
      INFISICAL_CLIENT_ID:
        required: false
      INFISICAL_CLIENT_SECRET:
        required: false
      INFISICAL_PROJECT_SLUG:
        required: false
      RENDER_API_KEY:
        required: false
      RENDER_API_KEY_1:
        required: false
      RENDER_API_KEY_2:
        required: false
      RENDER_API_KEY_3:
        required: false
      RENDER_API_KEY_4:
        required: false
      RENDER_API_KEY_BACKUP:
        required: false
      RENDER_BACKUP_API_KEY_2:
        required: false
      RENDER_PRIMARY_SVC_ID:
        required: false
      RENDER_WORKER_SVC_ID:
        required: false
      RENDER_SCRAPER_SVC_ID:
        required: false
      RENDER_MCP_SVC_ID:
        required: false

permissions:
  contents: read

jobs:
  publish-core-image:
    name: 🚀 Publish Core Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' && inputs.publish-core && inputs.build-allowed
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless signing
    outputs:
      core-digest: ${{ steps.core-digest.outputs.digest }}
      core-tags: ${{ steps.core-digest.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and Sign Core Image
        id: build-image
        uses: ./.github/actions/build-sign-image
        with:
          image-name: supremeai-core
          dockerfile: ./backend/Dockerfile
          context: ./backend
          cache-scope: supremeai-core
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose Core digest for worker alias job
        id: core-digest
        run: |
          echo "digest=${{ steps.build-image.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ steps.build-image.outputs.tags }}" | tr '\n' ' ' >> "$GITHUB_OUTPUT"

  publish-scraper-image:
    name: 🚀 Publish Scraper Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && inputs.publish-scraper && inputs.build-allowed
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and Sign Scraper Image
        uses: ./.github/actions/build-sign-image
        with:
          image-name: supremeai-scraper
          dockerfile: ./backend/services/scraper/Dockerfile
          context: ./backend
          cache-scope: supremeai-scraper
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-worker-alias:
    name: 🚀 Publish Worker Image (alias of Core)
    needs: [publish-core-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Worker metadata (same version scheme as Core)
        id: meta-worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-worker
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long,prefix=

      - name: Copy Core digest into supremeai-worker repo (no rebuild)
        env:
          CORE_DIGEST: ${{ needs.publish-core-image.outputs.core-digest }}
          CORE_TAGS: ${{ needs.publish-core-image.outputs.core-tags }}
          WORKER_TAGS: ${{ steps.meta-worker.outputs.tags }}
        run: |
          core_ref=""
          for t in ${CORE_TAGS}; do core_ref="${t}@${CORE_DIGEST}"; break; done
          if [ -z "$core_ref" ]; then
            echo "::error::Could not resolve Core image reference to alias for Worker"
            exit 1
          fi
          args=()
          for t in ${WORKER_TAGS}; do args+=(--tag "$t"); done
          docker buildx imagetools create "${args[@]}" "$core_ref"

  render-budget-guard:
    name: 🛡️ Render Build Budget Guard
    needs: [publish-core-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Enforce 450m Cap Across 4 Render Nodes
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_API_KEY_1: ${{ env.RENDER_API_KEY_1 || secrets.RENDER_API_KEY_1 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_API_KEY_2: ${{ env.RENDER_API_KEY_2 || secrets.RENDER_API_KEY_2 || env.RENDER_API_KEY_BACKUP || secrets.RENDER_API_KEY_BACKUP }}
          RENDER_API_KEY_3: ${{ env.RENDER_API_KEY_3 || secrets.RENDER_API_KEY_3 || env.RENDER_BACKUP_API_KEY_2 || secrets.RENDER_BACKUP_API_KEY_2 }}
          RENDER_API_KEY_4: ${{ env.RENDER_API_KEY_4 || secrets.RENDER_API_KEY_4 }}
          RENDER_PRIMARY_SVC_ID: ${{ env.RENDER_PRIMARY_SVC_ID || secrets.RENDER_PRIMARY_SVC_ID }}
          RENDER_WORKER_SVC_ID: ${{ env.RENDER_WORKER_SVC_ID || secrets.RENDER_WORKER_SVC_ID }}
          RENDER_SCRAPER_SVC_ID: ${{ env.RENDER_SCRAPER_SVC_ID || secrets.RENDER_SCRAPER_SVC_ID }}
          RENDER_MCP_SVC_ID: ${{ env.RENDER_MCP_SVC_ID || secrets.RENDER_MCP_SVC_ID }}
        run: python scripts/ci/render_build_budget_guard.py
