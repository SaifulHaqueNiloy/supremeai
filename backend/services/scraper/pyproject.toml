[tool.poetry]
name = "supremeai-scraper"
version = "1.0.0"
description = "Standalone browser automation and web scraping microservice"
authors = ["SupremeAI <noreply@supremeai.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"
httpx = ">=0.27.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=5.0.0"
playwright = ">=1.45.0"
loguru = ">=0.7.0"
pydantic = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
