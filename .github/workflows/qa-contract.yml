name: QA Contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate QA contract & Parity Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate QA checklist format
        run: pnpm qa:validate
      - name: Run Feature Parity Sentinel (Fail on New High Blockers)
        run: |
          python scripts/feature_parity_sentinel.py --fail-on high

  # বাংলা মন্তব্য (PERF-TRICK-1): ডুপ্লিকেট ফ্রন্টএন্ড বিল্ড প্রতিরোধ
  # পূর্বে এখানে নতুন করে `pnpm run build` চালানো হতো (~১-১.৫ মিনিট অপচয়)।
  # এখন প্রথমে চেক করা হয় `frontend/dist` অলরেডি এক্সিস্ট করে কি না, না থাকলে
  # বিল্ড চালায়। এতে অপ্রয়োজনীয় বিল্ড সময় পুরোপুরি সাশ্রয় হয়।
  e2e-smoke:
    name: 🎭 Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # E2E smoke targets the local preview server: a relative API base is the
    # correct build contract here (FE-07 gate throws without one of these).
    # Job-level so BOTH the build step and the playwright webServer's
    # `vite preview` (which re-loads vite.config.ts) satisfy the gate.
    env:
      VITE_USE_RELATIVE_PATH: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
          working-directory: ./frontend
          install-deps: 'true'

      - name: Install Playwright Browsers (Chromium only for fast smoke)
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure Frontend Build Exists
        working-directory: ./frontend
        # E2E smoke targets the local preview server: a relative API base is the
        # correct build contract here (FE-07 gate throws without one of these).
        env:
          VITE_USE_RELATIVE_PATH: 'true'
        run: |
          if [ ! -d "dist" ]; then
            echo "Building frontend preview bundle..."
            pnpm run build
          else
            echo "Reusing existing frontend build in dist/"
          fi

      - name: Run E2E Smoke Tests
        working-directory: ./frontend
        run: pnpm exec playwright test -c playwright.config.ts
      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-smoke-report
          path: frontend/playwright-report/
          retention-days: 7


