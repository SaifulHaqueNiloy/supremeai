name: 📦 SupremeAI Release Builder

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.29.0'

jobs:
  build-artifacts:
    name: 🏗️ Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'APK'
            os: ubuntu-latest
          - target: 'VSIX'
            os: ubuntu-latest
          - target: 'EXE'
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ----------------------------------------------------
      # 📱 1. FLUTTER APK BUILD (Android Arm64)
      # ----------------------------------------------------
      - name: Setup Java
        if: matrix.target == 'APK'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        if: matrix.target == 'APK'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build APK (Arm64 for Latest Devices)
        if: matrix.target == 'APK'
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        if: matrix.target == 'APK'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supremeai-mobile-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      # ----------------------------------------------------
      # 🧩 2. VS CODE EXTENSION BUILD (VSIX)
      # ----------------------------------------------------
      - name: Setup pnpm
        if: matrix.target == 'VSIX'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.0.0

      - name: Setup Node caching
        if: matrix.target == 'VSIX'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Build VSIX
        if: matrix.target == 'VSIX'
        working-directory: tools/vscode-extension
        run: |
          pnpm install --frozen-lockfile
          npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX Artifact
        if: matrix.target == 'VSIX'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supremeai-vscode-vsix
          path: tools/vscode-extension/*.vsix
          retention-days: 7

      # ----------------------------------------------------
      # 💻 3. NATIVE DESKTOP BUILD (Tauri EXE)
      # ----------------------------------------------------
      - name: Setup Node for Desktop
        if: matrix.target == 'EXE'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm for Desktop
        if: matrix.target == 'EXE'
        run: npm install -g pnpm@9.0.0

      - name: Setup Rust
        if: matrix.target == 'EXE'
        uses: dtolnay/rust-toolchain@stable

      - name: Build Desktop EXE
        if: matrix.target == 'EXE'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run tauri build

      - name: Upload EXE Artifact
        if: matrix.target == 'EXE'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supremeai-desktop-exe
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  # ----------------------------------------------------
  # 🚀 CREATE GITHUB RELEASE
  # ----------------------------------------------------
  create-release:
    name: 🎉 Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v-manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          files: release-artifacts/**/*
          generate_release_notes: true
