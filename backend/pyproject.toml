[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyerrorfix"
version = "1.0.0"
description = "Reusable Python error-detection & auto-fix engine for CI pipelines. Covers core Python, imports, files, asyncio, database/ORM, web/API, concurrency, typing, security, resource, deprecation & logging errors."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SupremeAI" }]
keywords = ["lint", "autofix", "static-analysis", "ci", "fastapi", "sqlalchemy", "asyncio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
sarif = []
dev = ["pytest>=8"]

[project.scripts]
pyerrorfix = "pyerrorfix.cli:main"

[tool.setuptools.packages.find]
include = ["pyerrorfix*"]

[tool.setuptools.package-data]
pyerrorfix = ["rules/*.json", "rules/*.yaml"]
