    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "🤖 Run Dependency Upgrade Agent"
        id: upgrade_agent
        env:
