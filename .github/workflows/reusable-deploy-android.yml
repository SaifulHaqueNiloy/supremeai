name: Reusable Deploy Android

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      PLAY_STORE_CONFIG_JSON:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true

jobs:
  deploy-android:
    name: 🤖 Build & Deploy Android (Play Store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 🔧 Clean Android Gradle Cache & Dependencies
        run: |
          cd apps/mobile/android
          ./gradlew clean --stacktrace || true
          rm -rf .gradle/caches

      - name: 📦 Get Flutter Dependencies
        working-directory: apps/mobile
        run: |
          flutter clean
          flutter pub get

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Setup Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p apps/mobile/android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/keystore.jks
            echo "✅ Keystore setup successful"
          else
            echo "⚠️ Skipping keystore setup (secret not found)"
          fi

      - name: Decode Google Play Config JSON
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        run: |
          if [ -n "$PLAY_STORE_CONFIG_JSON" ]; then
            mkdir -p apps/mobile/android/fastlane
            echo "$PLAY_STORE_CONFIG_JSON" > apps/mobile/android/fastlane/play-store-credentials.json
            echo "✅ Play Store credentials setup successful"
          else
            echo "⚠️ Skipping Play Store credentials (secret not found)"
          fi

      - name: Fastlane Deploy to Play Store
        working-directory: apps/mobile/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: fastlane deploy
