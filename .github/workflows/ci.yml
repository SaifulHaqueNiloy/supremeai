# SupremeAI CI/CD Pipeline — Hardened with SHA Pinning
# 🔒 v5.0: Modularised — heavy job-groups extracted to reusable workflows
# 📊 Code coverage gates enabled (fail-under thresholds)

name: CI Pipeline

concurrency:
  group: supremeai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'Force Backend Run/Deploy'
        type: boolean
        default: false
      force_frontend:
        description: 'Force Frontend Run/Deploy'
        type: boolean
        default: false
      force_infra:
        description: 'Force Edge/Infra Run/Deploy'
        type: boolean
        default: false
      run_backend_overall:
        description: 'Run full backend test suite'
        type: boolean
        default: false
      enable_xdist_experiment:
        description: '#472: opt this dispatch run into the guarded core-unit xdist experiment'
        type: boolean
        default: false

# বাংলা মন্তব্য (#6 fix): ডিফল্ট শুধু read-only; job-level permissions: ব্লকে
# বাড়তি দরকার হলে ওভাররাইড করা হয় (e.g. packages:write, pull-requests:write)।
permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  # Coverage thresholds — fail build if below these values.
  MIN_BACKEND_COVERAGE: 30
  MIN_FRONTEND_COVERAGE: 16

jobs:
  # -----------------------------------------------------------------
  # ERR-M02 FIX (2026-09-16): the stub-blocker gate (scripts/
  # find_stub_data.py) existed but was never wired into CI — developers
  # without local pre-commit hooks could push stub/mock/fabricated-success
  # code without blocking. This job runs the hardened scanner and fails the
  # pipeline on HIGH+ findings (same threshold the register mandates).
  # -----------------------------------------------------------------
  stub-blocker:
    name: Stub Blocker (Zero-Gap Gate)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run stub/placeholder scanner (backend)
        run: python scripts/find_stub_data.py --path backend --fail-on HIGH

      - name: Run stub/placeholder scanner (frontend)
        run: python scripts/find_stub_data.py --path frontend/src --fail-on HIGH

      - name: Run stub/placeholder scanner (scripts)
        run: python scripts/find_stub_data.py --path scripts --fail-on HIGH

      # -----------------------------------------------------------------
      # ERR-M02 round 2 (2026-09-16): report-only stub trend so the count of
      # MEDIUM/LOW findings trends monotonically DOWNWARD without blocking CI
      # (register synergy note). The blocking HIGH+ gate above stays strict;
      # this job always succeeds and uploads the full findings list as an
      # artifact + step summary for visibility.
      # -----------------------------------------------------------------
      - name: Stub trend report (non-blocking, MEDIUM+)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "# Stub Trend Report (non-blocking)"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            python scripts/find_stub_data.py --path backend --exclude tests --fail-on LOW
            echo
            python scripts/find_stub_data.py --path frontend/src --exclude tests --fail-on LOW
            echo
            python scripts/find_stub_data.py --path scripts --fail-on LOW
          } > stub-trend-report.txt 2>&1 || true
          tail -n 40 stub-trend-report.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload stub trend report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stub-trend-report
          path: stub-trend-report.txt
          retention-days: 14
          if-no-files-found: ignore

  # -----------------------------------------------------------------
  # CANONICAL_PLANNING_RECONCILIATION_AND_GUARDRAILS_PLAN.md §7 Phase 6
  # (Decision 2 Stage 1 — REPORT-ONLY, non-blocking): the plan-governance
  # linter scans docs/plans/ frontmatter conformance, lineage-link
  # integrity, versioned-filename bans and unverified-claim patterns, and
  # refreshes the machine registry (plan_registry.json) as a PR artifact.
  # Promoting this job to --check blocking mode (Stage 2) is reserved
  # until drift reaches a zero false-positive rate.
  # -----------------------------------------------------------------
  plan-governance:
    name: Plan Governance (Report-Only)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Run plan-governance linter (report-only)
        run: |
          python scripts/governance/lint_plans.py \
            --json docs/plans/plan_registry.json \
            --report docs/plans/phases/plan_inventory_report.md

      - name: Upload governance artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: plan-governance-report
          path: |
            docs/plans/plan_registry.json
            docs/plans/phases/plan_inventory_report.md
          retention-days: 14

  # -----------------------------------------------------------------
  # Job 0: Path Filtering (Optimization)
  # -----------------------------------------------------------------
  changes:
    name: 🚦 Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      previous_backend_failed: ${{ steps.previous.outputs.backend || 'false' }}
      previous_frontend_failed: ${{ steps.previous.outputs.frontend || 'false' }}
      previous_infra_failed: ${{ steps.previous.outputs.infra || 'false' }}
      previous_scraper_failed: ${{ steps.previous.outputs.scraper || 'false' }}
      # Issue #470: per-group failure memory consumed by backend-test-planner.
      backend_group_fast: ${{ steps.previous.outputs.backend_group_fast || 'false' }}
      backend_group_core_unit: ${{ steps.previous.outputs.backend_group_core_unit || 'false' }}
      backend_group_core_support: ${{ steps.previous.outputs.backend_group_core_support || 'false' }}
      backend_group_services: ${{ steps.previous.outputs.backend_group_services || 'false' }}
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event.inputs.force_backend == 'true' || steps.previous.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.inputs.force_frontend == 'true' || steps.previous.outputs.frontend == 'true' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event.inputs.force_infra == 'true' || steps.previous.outputs.infra == 'true' }}
      scraper: ${{ steps.filter.outputs.scraper == 'true' || github.event.inputs.force_backend == 'true' || steps.previous.outputs.scraper == 'true' }}
      # Dedicated MCP filter — scoped to MCP control plane only.
      mcp: ${{ steps.filter.outputs.mcp == 'true' || github.event.inputs.force_infra == 'true' || steps.previous.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect failed or cancelled jobs from the previous CI run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/detect-previous-failures.py
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'scripts/**'
              - 'migrations/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-backend/**'
            frontend:
              - 'frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-backend/**'
            infra:
              - 'infrastructure/**'
              - 'backend/database/**'
              - 'migrations/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            mcp:
              - 'infrastructure/mcp-control-plane/**'
              - '.github/workflows/ci.yml'
            scraper:
              - 'backend/services/scraper/**'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - '.github/workflows/ci.yml'

  # -----------------------------------------------------------------
  # Job 1.5: Per-Group Backend Test Planner (issue #470)
  # -----------------------------------------------------------------
  # Lightweight (~10s, no Postgres/Redis) decision engine that maps the
  # push/PR diff to matrix groups and emits `strategy.matrix` as JSON.
  # ci.yml no longer holds a static matrix —
  # scripts/ci/plan_backend_test_groups.py is the SINGLE SOURCE OF TRUTH
  # for group paths (unit-tested in backend/tests/scripts/).
  #
  # CONTRACT (do not weaken silently): any backend source change → FULL
  # matrix, because the coverage gate is fail-closed and calibrated on the
  # combined full-suite numerator (incident PR #343,
  # detect_changed_tests.py:110). Group-level skipping only activates when
  # CI_COVERAGE_CACHE_ENABLED == 'true' AND the plan is scoped: skipped
  # groups' cached `.coverage.<group>` data (issue #471 persistence layer,
  # content-derived keys from scripts/ci/coverage_cache_keys.py) is
  # restored into backend-aggregate so the gate still sees the FULL
  # combined numerator — identical inputs → identical coverage, NOT
  # sampling. In full mode every entry runs force_run=true: pytest always
  # executes and the cache is only WARMED (saved), never consumed, because
  # full-mode diffs (scripts/**, non-measured backend files) can change
  # test behavior in ways the cache key does not capture. Per-group
  # failure memory (detect-previous-failures.py) forces a flaky group back
  # in (force_run=true) even on a cache hit. Planner failure = red
  # pipeline (never a silent skip): fail-safe full mode inside the script,
  # job failure visible through `needs`.
  backend-test-planner:
    name: 🧮 Backend Test Planner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
    outputs:
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
      plan_mode: ${{ steps.plan.outputs.plan_mode }}
      plan_reason: ${{ steps.plan.outputs.plan_reason }}
      run_fast: ${{ steps.plan.outputs.run_fast }}
      run_core_unit: ${{ steps.plan.outputs.run_core_unit }}
      run_core_support: ${{ steps.plan.outputs.run_core_support }}
      run_services: ${{ steps.plan.outputs.run_services }}
      cache_key_fast: ${{ steps.plan.outputs.cache_key_fast }}
      cache_key_core_unit: ${{ steps.plan.outputs.cache_key_core_unit }}
      cache_key_core_support: ${{ steps.plan.outputs.cache_key_core_support }}
      cache_key_services: ${{ steps.plan.outputs.cache_key_services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-queue/force-push bases may sit deep in history; measured
          # 2-4s at depth 0 for this repo (issue #470's "15s checkout" claim
          # did not reproduce), so keep depth 0 for diff correctness.
          fetch-depth: 0
          persist-credentials: false
      - name: Plan backend test groups
        id: plan
        env:
          BACKEND_TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # #471: repo variables are NOT auto-injected as env — they must be
          # wired explicitly or the planner can never enter scoped mode (first
          # live proof: PR #484 run 35419396409 classified FULL with
          # "test-only-coverage-cache-disabled-contract" while the variable
          # was already true).
          CI_COVERAGE_CACHE_ENABLED: ${{ vars.CI_COVERAGE_CACHE_ENABLED || '' }}
          PREV_FAIL_FAST: ${{ needs.changes.outputs.backend_group_fast }}
          PREV_FAIL_CORE_UNIT: ${{ needs.changes.outputs.backend_group_core_unit }}
          PREV_FAIL_CORE_SUPPORT: ${{ needs.changes.outputs.backend_group_core_support }}
          PREV_FAIL_SERVICES: ${{ needs.changes.outputs.backend_group_services }}
        run: |
          PREV_FAILED_GROUPS=$(python -c "
          import os
          keys = [
              ('fast', 'PREV_FAIL_FAST'),
              ('core_unit', 'PREV_FAIL_CORE_UNIT'),
              ('core_support', 'PREV_FAIL_CORE_SUPPORT'),
              ('services', 'PREV_FAIL_SERVICES'),
          ]
          print(','.join(k for k, env_key in keys if os.environ.get(env_key, '').strip().lower() == 'true'))
          ")
          python scripts/ci/plan_backend_test_groups.py \
            ${{ github.ref == 'refs/heads/main' && '--is-main' || '' }} \
            ${{ github.event.inputs.run_backend_overall == 'true' && '--force-overall' || '' }} \
            --base "$BACKEND_TEST_BASE" \
            --previous-group-failures "$PREV_FAILED_GROUPS"

  # -----------------------------------------------------------------
  # Constitution Audit: deterministic architecture and security gate
  # -----------------------------------------------------------------
  constitution-audit:
    name: Constitution Audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pyyaml

      - name: Run Constitution audit
        env:
          PYTHONPATH: .github/scripts
        run: |
          python -m constitution.engine \
            --pr-diff \
            --base-ref "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}" \
            --output ci-reports/constitution-findings.jsonl \
            --sarif ci-reports/constitution.sarif

      - name: Run Constitution rule tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts/constitution/tests -p 'test_*.py' -v

      - name: Upload Constitution SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: ci-reports/constitution.sarif

      - name: Upload Constitution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constitution-audit-${{ github.sha }}
          path: ci-reports/
          retention-days: 30
          if-no-files-found: warn

  # -----------------------------------------------------------------
  # Job 0.5: Operational Tooling Quality Gate
  # -----------------------------------------------------------------
  tooling-quality:
    name: Operational Tooling Quality Gate
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check --no-warn-script-location ruff==0.16.4

      - name: Gate operational tooling lint errors
        run: ruff check tools scripts packages .github/scripts --select E9,F821,F822,F823

      - name: Critical invariant guard (merge/rebase drop scanner — issue #476)
        run: python scripts/ci/check_critical_invariants.py

      - name: Commit sizing gate (reviewability cap — issue #475)
        env:
          COMMIT_SIZE_SOFT_LIMIT: ${{ vars.COMMIT_SIZE_SOFT_LIMIT || '2000' }}
          COMMIT_SIZE_HARD_LIMIT: ${{ vars.COMMIT_SIZE_HARD_LIMIT || '10000' }}
        run: python scripts/ci/check_commit_sizing.py

      - name: Route→client inventory freshness ratchet (issue #480)
        run: |
          python scripts/ci/generate_route_client_inventory.py
          if ! git diff --quiet -- docs/audit_reports/route_client_inventory.json docs/audit_reports/route_client_inventory.md; then
            echo "::error::route_client_inventory is stale — backend routes or frontend refs changed without regenerating the committed inventory (issue #480 fix #5). Run: python scripts/ci/generate_route_client_inventory.py and commit the diff."
            git diff --stat -- docs/audit_reports/route_client_inventory.json docs/audit_reports/route_client_inventory.md
            exit 1
          fi
          echo "✅ route→client inventory is fresh (checked-in artifact matches the scanned surface)."

      # বাংলা মন্তব্য (RUFF CENTRALIZATION):
      # পূর্বে backend-tests ম্যাট্রিক্সের ৪টি জবের প্রতিটিতে ruff check ও ruff format ৪ বার করে রান হতো।
      # সেটি বাদ দিয়ে এখানে একবার সেন্ট্রালাইজড ভাবে রান করা হচ্ছে।
      - name: Centralized Backend Lint & Format Gate
        run: |
          ruff check backend --select E,W,F,I,N,UP,B,SIM --ignore E501,E402,B008,B904,N803,N806,N815,N818,SIM102,SIM105,SIM108,SIM117,SIM112,SIM116,E741,B017,B007,N802,N811,N812,N813,N817,F811,F401,W291,W293,SIM103,SIM109,SIM110,SIM222,SIM401,B028
          ruff format --check backend

      # বাংলা (OWNER AUDIT P1 #6 ESCALATION LADDER): root-level lint এখন
      # fatal-only (E9,F821,F822,F823)। এই step টি NON-BLOCKING রিপোর্ট —
      # বৃহত্তর rule-set (F = unused imports/vars, W = whitespace) এর
      # বর্তমান violation সংখ্যা CI লগে দৃশ্যমান করে, যাতে batch-fix
      # রাউন্ডগুলো trend মেপে blocking gate-এ উন্নীত করা যায়।
      # Baseline: docs/audits/root_lint_baseline.md (1,837 @ 2026-09-15; batch 1 -> 254)।
      # ⚠️ F401 auto-fix নিষেধ — import-এর side effect আছে (module
      # registration patterns); প্রতিটি কেস manual review ছাড়া মোছা যাবে না।
      - name: Root-level lint drift report (non-blocking)
        continue-on-error: true
        run: |
          echo "## Root-level lint drift report (non-blocking, P1 #6)" | tee root_lint_report.md
          echo '```' | tee -a root_lint_report.md
          ruff check tools scripts packages .github/scripts --select E9,F,W \
            --statistics | tee -a root_lint_report.md
          echo '```' | tee -a root_lint_report.md
          TOTAL=$(ruff check tools scripts packages .github/scripts --select E9,F,W \
            --output-format=concise 2>/dev/null | grep -c ':' || true)
          echo "ROOT_LINT_TOTAL=$TOTAL (blocking gate remains E9,F821,F822,F823 = 0)" | tee -a root_lint_report.md

      - name: Upload root lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-lint-report-${{ github.sha }}
          path: root_lint_report.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Compile operational Python modules
        run: python -m compileall -q tools scripts packages .github/scripts

      # বাংলা মন্তব্য (M0-B / AUDIT F3): একসাথে ৩টা alembic head ছিল
      # (mcp_gw_0001, a7b8c9d0e1f2, k5l6m7n8o9p0) — merge revision দিয়ে এক
      # lineage-এ নামানো হয়েছে। এই guard নিশ্চিত করে drift আর ফিরে আসবে না।
      - name: Enforce single Alembic head
        run: python backend/scripts/check_single_alembic_head.py

      - name: Enforce VS Code thin-client boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path("tools/vscode-extension/src/services/SupremeAIService.ts")
          source = service.read_text(encoding="utf-8").lower()
          forbidden = ("openrouter", "openai", "anthropic", "groq", "gemini")
          violations = [name for name in forbidden if name in source]
          if violations:
              raise SystemExit(
                  f"Thin-client boundary violated in {service}: {', '.join(violations)}"
              )
          print(f"Thin-client boundary passed: {service}")
          PY

      - name: Build non-secret manual task report
        run: python scripts/ci/build_manual_task_report.py --output ci-reports/manual-task-report.json

      - name: Upload manual task report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-task-report-${{ github.sha }}
          path: ci-reports/manual-task-report.json
          retention-days: 30
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Job 1: Security Scan (Dependency Audit + Secret Detection)
  # -----------------------------------------------------------------
  security:
    name: 🔒 Security Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create reports directory
        run: mkdir -p ci-reports

      # Issue #703: keep internal infrastructure identifiers (Render service
      # URLs, Supabase project refs, Cloudflare 32-hex account/namespace IDs)
      # out of the public repo — grep gate with a shrinking baseline file.
      - name: Internal topology identifier gate
        run: bash scripts/security/check_internal_topology.sh

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'ci-reports/trivy-fs.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Enforce machine-readable vulnerability gate
        run: python scripts/ci/security_gate.py --trivy ci-reports/trivy-fs.json --output ci-reports/security-gate.json

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-${{ github.sha }}
          path: ci-reports/
          retention-days: 14
          if-no-files-found: error

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          # বাংলা: event type অনুযায়ী সঠিক base SHA — push/PR উভয়ের জন্য নতুন
          # commit-গুলোই স্ক্যান করে, পুরনো rotated secret বারবার flag হয় না।
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'HEAD~1' || github.event.before) }}
          head: HEAD
          extra_args: "--only-verified"

  # Required security aggregate gate — never path-filtered.
  security-gate:
    name: Security Aggregate Gate
    needs: [security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require security scan success
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          echo "Security scan result: ${SECURITY_RESULT}"
          test "${SECURITY_RESULT}" = "success"

  # -----------------------------------------------------------------
  # Jobs 1.5–1.8: Advanced Pre-Merge Checks (reusable workflow)
  # -----------------------------------------------------------------
  # বাংলা মন্তব্য (PERF-TRICK-2 & TRICK-3):
  # পূর্বে `registry` নামক আলাদা ৩ মিনিটের একটি উবুন্টু ভিএম জব এখানে স্বতন্ত্রভাবে চলত।
  # সেই রেজিস্ট্রি চেকগুলো (validate_config_registry, check_config_contract, check_hardcoded_deployment_config)
  # এখন সরাসরি `ci-advanced-checks.yml`-এর সাথে কনসোলিডেট করা হয়েছে������� ফলে আলাদা রানার বুট করার প্রয়োজন নেই।
  advanced-checks:
    name: Advanced Pre-Merge Checks
    needs: [changes]
    uses: ./.github/workflows/ci-advanced-checks.yml
    with:
      changed: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' }}
    secrets: inherit

  # -----------------------------------------------------------------
  # Phase 1: Deterministic backend preparation
  # -----------------------------------------------------------------
  backend-prepare:
    name: Backend Prepare (immutable dependency cache)
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare backend environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: prepare
      - name: Validate prepared dependency artifact
        working-directory: ./backend
        run: |
          test -x .venv/bin/python
          poetry run python -c "import pytest, fastapi, sqlalchemy; print('Backend dependency artifact is valid')"

      - name: Upload immutable backend dependency artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-venv-${{ github.sha }}
          path: backend/.venv
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Build release candidate manifest
        run: python scripts/ci/build_release_evidence.py --output ci-reports/release-manifest.json

      - name: Upload release candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ github.sha }}
          path: ci-reports/release-manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Lint and Format verification (early fail-fast)
        working-directory: ./backend
        run: |
          poetry run ruff check . --select E,W,F,I,N,UP,B,SIM --ignore E501,E402,B008,B904,N803,N806,N815,N818,SIM102,SIM105,SIM108,SIM117,SIM112,SIM116,E741,B017,B007,N802,N811,N812,N813,N817,F811,F401,W291,W293,SIM103,SIM109,SIM110,SIM222,SIM401,B028
          poetry run ruff format --check .

      - name: Enforce single Alembic head
        working-directory: ./backend
        run: poetry run python scripts/check_single_alembic_head.py

  # -----------------------------------------------------------------
  # Job 2: Backend Tests (parallel, disjoint pytest groups)
  # -----------------------------------------------------------------
  # বাংলা মন্তব্য (BACKEND MATRIX OPTIMIZATION, issue #470):
  # ১. ম্যাট্রিক্স এখন DYNAMIC — `backend-test-planner` জব থেকে matrix_json
  #    আসে (scripts/ci/plan_backend_test_groups.py = single source of truth)।
  # ২. core গ্রুপ দুই ভাগে ভাগ হয়েছে (core-unit ≈ ২১৫ ফাইল — bottleneck নিজের
  #    রানারে; core-support ≈ ৪২ ফাইল) — wall-clock কমে, ব্যালান্স ভালো হয়।
  # ৩. স্কিপ করা গ্রুপ ম্যাট্রিক্সেই emit হয় না → রানার ভুট হয় না (Layer-1)।
  #    আজ full-mode ডিফল্ট (coverage-gate চুক্তি — PR #343 incident), তাই
  #    আচরণ আগের মতোই; scoped mode শুধু CI_COVERAGE_CACHE_ENABLED=true হলে।
  # ৪. Postgres health fast-poll (interval 2s): পুরনো 10s interval-এ container
  #    init ~21-25s লাগত, এখন ~6-10s (প্রতি সার্ভিস জবে ~15s সাশ্রয়)।
  # ৫. Integration tests remain owned by integration-test below.
  backend-tests:
    name: 🐍 Backend Tests (${{ matrix.group }})
    needs: [changes, backend-prepare, backend-test-planner]
    if: ${{ needs.changes.outputs.backend == 'true' && needs.backend-prepare.result == 'success' && needs.backend-test-planner.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Dynamic matrix emitted by the planner (JSON). Group definitions live
      # in scripts/ci/plan_backend_test_groups.py — unit tests lock the
      # contract (backend/tests/scripts/test_plan_backend_test_groups.py).
      matrix: ${{ fromJSON(needs.backend-test-planner.outputs.matrix_json) }}

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: artifact
          dependency-artifact: backend-venv-${{ github.sha }}

      # #471: restore this group's cached `.coverage.<group>` data. Exact-key
      # restore only (no restore-keys prefix — a stale/related entry would
      # poison the gate's numerator; miss = run pytest fresh). Consumed only
      # in scoped mode with force_run=false; every run SAVES after green
      # (warming) so scoped restores always have data to find.
      - name: Restore per-group coverage cache (#471)
        id: coverage_cache
        if: ${{ matrix.cache_key != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.coverage-cache
          key: ${{ matrix.cache_key }}

      - name: Detect Changed and Previous Failed Tests
        id: select_tests
        env:
          PREVIOUS_BACKEND_FAILED: ${{ needs.changes.outputs.previous_backend_failed }}
          BACKEND_TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python ../scripts/ci/detect_changed_tests.py \
            ${{ github.ref == 'refs/heads/main' && '--is-main' || '' }} \
            --base "$BACKEND_TEST_BASE" \
            --previous-failed "$PREVIOUS_BACKEND_FAILED"

      - name: Filter targets for matrix group
        id: group_targets
        env:
          TARGETED: ${{ steps.select_tests.outputs.test_targeted }}
          RAW_TARGETS: ${{ steps.select_tests.outputs.test_targets }}
          MATRIX_PATHS: ${{ matrix.paths }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true' }}
          PLAN_MODE: ${{ needs.backend-test-planner.outputs.plan_mode }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          is_main = os.environ.get("IS_MAIN", "false").lower() == "true"
          is_targeted = os.environ.get("TARGETED", "false").lower() == "true"
          raw_targets = os.environ.get("RAW_TARGETS", "").strip()
          matrix_paths_raw = os.environ.get("MATRIX_PATHS", "").strip()
          plan_mode = os.environ.get("PLAN_MODE", "full").strip()

          github_output = os.environ.get("GITHUB_OUTPUT")

          # Scoped mode (#471): this group OWNS the changed tests, so it must
          # run its FULL group paths — a targeted subset would produce partial
          # coverage for its own scope and collapse the gate's numerator
          # (identical-inputs contract requires full-scope data).
          if is_main or not is_targeted or raw_targets in ("tests/", "") or plan_mode == "scoped":
              targets = matrix_paths_raw
              skip = "false"
          else:
              matrix_tokens = matrix_paths_raw.split()
              group_dirs = [tok for tok in matrix_tokens if not tok.startswith("--")]
              group_ignores = [tok for tok in matrix_tokens if tok.startswith("--ignore=")]

              candidate_tests = raw_targets.split()
              selected_for_group = []
              for t in candidate_tests:
                  matches_group = any(t.startswith(g_dir.rstrip("/") + "/") or t == g_dir for g_dir in group_dirs)
                  ignored = any(t == ign.removeprefix("--ignore=") for ign in group_ignores)
                  if matches_group and not ignored:
                      selected_for_group.append(t)

              if selected_for_group:
                  targets = " ".join(selected_for_group)
                  skip = "false"
              else:
                  targets = ""
                  skip = "true"

          print(f"Matrix group [${{ matrix.group }}] targets: '{targets}' (skip={skip})")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"targets={targets}\n")
                  f.write(f"skip={skip}\n")
          PY

      - name: Run Backend Tests
        # #471 cache-hit skip: only in scoped mode (force_run=false) with an
        # exact cache hit. Full mode / forced groups / missing key always run.
        if: steps.group_targets.outputs.skip != 'true' && (matrix.cache_key == '' || matrix.force_run == 'true' || steps.coverage_cache.outputs.cache-hit != 'true')
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/supremeai_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars-padding-for-length
          SUPREMEAI_JWT_SECRET: test-supremeai-jwt-secret-key-for-ci-minimum-64-chars-padding-1234
          ALLOW_TEST_AUTH_BYPASS: "true"
          USER_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
          ADMIN_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
          TEST_TARGETS: ${{ steps.group_targets.outputs.targets }}
          MARKERS: ${{ steps.select_tests.outputs.test_markers || 'not requires_network and not e2e and not chaos' }}
          # #472 guarded experiment: pytest-xdist ONLY on core-unit, ONLY on
          # pull_request or operator workflow_dispatch events while
          # ENABLE_CI_PYTEST_XDIST == 'true'. Main pushes stay serial until
          # the acceptance gate passes (identical outcomes, coverage within
          # ±0.5pt, wall < 130s, 3 green runs).
          # -n0 = explicit serial when the experiment is off.
          XDIST_FLAG: ${{ (matrix.group == 'core-unit' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (vars.ENABLE_CI_PYTEST_XDIST == 'true' || github.event.inputs.enable_xdist_experiment == 'true')) && '-n auto --dist loadgroup' || '-n0' }}
        # Coverage measurement contract: the --cov list MUST include every
        # package the coverage gate tiers (coverage_policy.yaml globs match
        # coverage.json keys; a missing package = measurement-blind gate, see
        # the runs/** precedent). memory added 2026-09-15: backend/memory/ was
        # invisible (16 files) despite its tests running in the core/services
        # matrix groups. NOTE: never put "#" comments inside this run block —
        # after a "\" line-continuation they truncate the pytest command.
        run: |
          echo "pytest parallelism flags: $XDIST_FLAG"
          poetry run pytest $TEST_TARGETS \
            $XDIST_FLAG \
            --cov=core --cov=api --cov=services --cov=tools --cov=runs --cov=memory \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=test-results.xml \
            -m "$MARKERS" \
            -v --tb=short --timeout=30 --timeout-method=thread

      - name: Test Failure Trend Report
        if: always() && (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true')
        run: |
          python ../scripts/ci/build_test_failure_trend.py \
            --junit test-results.xml \
            --out ../ci-reports/test-failure-trend.json \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --allow-missing

      - name: Publish skipped-test summary
        if: always() && (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true')
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("test-results.xml")
          if not report.is_file():
              print("Skipped-test summary unavailable: JUnit report was not created.")
              raise SystemExit(0)
          root = ET.parse(report).getroot()
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in root.iter("testsuite"))
          total = sum(int(suite.attrib.get("tests", "0")) for suite in root.iter("testsuite"))
          summary = f"Backend test run: {total} collected, {skipped} skipped. See docs/SKIPPED_TESTS.md for governance."
          print(summary)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write(f"### Skipped-test visibility\n\n{summary}\n")
          PY

      # সমান্তরাল কভারেজ মার্জ (coverage combine) প্রতিটি গ্রুপের ডেটা ফাইল
      # আলাদা নামে চায় (.coverage.<group>) — নাহলে চারটি আর্টিফ্যাক্টে একই নামের
      # .coverage থাকায় অ্যাগ্রিগেট জবে "No data to combine" হয়।
      # #471: scoped-mode cache hit → pytest was skipped; materialize the
      # cached data exactly as a fresh run would have left it, so the
      # rename/artifact steps below stay uniform. Regenerate xml/json from
      # the data file to keep the artifact schema identical (aggregate only
      # consumes .coverage*, but tooling reads the xml from artifacts).
      - name: Materialize cached coverage on scoped-mode hit (#471)
        if: matrix.cache_key != '' && matrix.force_run != 'true' && steps.coverage_cache.outputs.cache-hit == 'true' && steps.group_targets.outputs.skip != 'true'
        working-directory: ./backend
        run: |
          set -euo pipefail
          src=".coverage-cache/.coverage.${{ matrix.group }}"
          if [ ! -f "$src" ]; then
            echo "::error::Cache reported a hit but $src is missing — refusing to fake coverage (fail-closed)."
            exit 1
          fi
          cp "$src" .coverage
          poetry run coverage xml -o coverage.xml
          poetry run coverage json -o coverage.json
          echo "Materialized cached coverage for group ${{ matrix.group }} (key ${{ matrix.cache_key }})"

      - name: Rename coverage data for parallel merge
        if: always()
        working-directory: ./backend
        run: |
          if [ -f .coverage ]; then
            mv .coverage ".coverage.${{ matrix.group }}"
            echo "Coverage data renamed to .coverage.${{ matrix.group }}"
          else
            echo "No coverage data produced for group ${{ matrix.group }} (tests skipped or no --cov output)."
          fi

      # #471: stage the group's data file for the cache-save step. Runs on
      # BOTH fresh and cache-hit paths (hit = re-copy; save becomes a no-op).
      - name: Stage coverage data for cache (#471)
        if: success() && steps.group_targets.outputs.skip != 'true'
        working-directory: ./backend
        run: |
          mkdir -p .coverage-cache
          if [ -f ".coverage.${{ matrix.group }}" ]; then
            cp ".coverage.${{ matrix.group }}" ".coverage-cache/.coverage.${{ matrix.group }}"
            echo "Staged .coverage.${{ matrix.group }} for cache save (key ${{ matrix.cache_key }})"
          else
            echo "No coverage data to stage for group ${{ matrix.group }}."
          fi

      # #471: save under the content-derived key. Exact key already exists on
      # a cache-hit path → save is a harmless no-op; any save failure must
      # never red the pipeline (cache is an optimization, never a gate).
      - name: Save per-group coverage cache (#471)
        if: success() && matrix.cache_key != '' && steps.group_targets.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.coverage-cache
          key: ${{ matrix.cache_key }}

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage-${{ matrix.group }}
          path: |
            backend/coverage.xml
            backend/coverage.json
            backend/.coverage*
          include-hidden-files: true
          retention-days: 7

      - name: Upload test failure trend report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-failure-trend-${{ matrix.group }}
          path: ci-reports/test-failure-trend.json
          if-no-files-found: ignore

  # -----------------------------------------------------------------
  # Backend post-test stage — SPLIT into 3 parallel jobs (issue #470)
  # -----------------------------------------------------------------
  # বাংলা মন্তব্য (PERF-TRICK-4 → #470 AGGREGATE SPLIT):
  # পূর্বে backend-tests ম্যাট্রিক্সের ৪টি জবের প্রতিটিতে পোস্ট-টেস্ট স্টেপগুলো ৪ বার
  # ডুপ্লিকেট হতো — সেগুলো `backend-aggregate`-এ সেন্ট্রালাইজ করা হয়েছিল (PERF-TRICK-4)।
  # কিন্তু সেই একক জবে সবকিছু SERIAL ছিল: রিয়েল মাপ (run 35409132406):
  #   containers 25s + setup 43s + pass^k 101s + OpenAPI 12s + canonical 12s
  #   + coverage merge 11s = 220s — যার মধ্যে pass^k-এর ১০১ সেকেন্ডের জন্য
  #   coverage গেট অপেক্ষা করত (মূল critical path-এ ১০১s অপচয়)।
  # এখন ৩টি সমান্তরাল জব:
  #   • backend-aggregate  — শুধু coverage merge + gate (কোনো DB দরকার নেই →
  #     কোনো container নেই, ~65-70s)
  #   • backend-contract   — OpenAPI + Canonical Startup + pgvector (DB লাগে,
  #     ~95-100s) — docker ডিপ্লয় এর অপেক্ষা করবে
  #   • backend-passk      — Mission pass^k scoreboard (main-only, নন-গেটিং,
  #     continue-on-error) — সমান্তরালে চলে, downstream আটকায় না
  # Critical path লাভ (main): 220s → max(~95s) ≈ ১২৫ সেকেন্ড সাশ্রয়।
  backend-aggregate:
    name: Backend Coverage Gate
    needs: [backend-tests, backend-test-planner]
    if: ${{ always() && needs.backend-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: artifact
          dependency-artifact: backend-venv-${{ github.sha }}

      - name: Download parallel coverage reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: backend-coverage-*
          path: backend/coverage-parts
          merge-multiple: false

      # #471: scoped mode leaves non-owning groups OUT of the matrix — their
      # `.coverage.<group>` data must still reach the combine or the fail-
      # closed gate collapses (PR #343). Restore each skipped group's cache
      # entry (exact key from the planner; same path the matrix jobs save to).
      - name: Restore cached coverage — fast (planner-skipped) (#471)
        if: ${{ needs.backend-test-planner.outputs.run_fast != 'true' && needs.backend-test-planner.outputs.cache_key_fast != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.coverage-cache
          key: ${{ needs.backend-test-planner.outputs.cache_key_fast }}
      - name: Restore cached coverage — core-unit (planner-skipped) (#471)
        if: ${{ needs.backend-test-planner.outputs.run_core_unit != 'true' && needs.backend-test-planner.outputs.cache_key_core_unit != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.coverage-cache
          key: ${{ needs.backend-test-planner.outputs.cache_key_core_unit }}
      - name: Restore cached coverage — core-support (planner-skipped) (#471)
        if: ${{ needs.backend-test-planner.outputs.run_core_support != 'true' && needs.backend-test-planner.outputs.cache_key_core_support != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.coverage-cache
          key: ${{ needs.backend-test-planner.outputs.cache_key_core_support }}
      - name: Restore cached coverage — services (planner-skipped) (#471)
        if: ${{ needs.backend-test-planner.outputs.run_services != 'true' && needs.backend-test-planner.outputs.cache_key_services != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.coverage-cache
          key: ${{ needs.backend-test-planner.outputs.cache_key_services }}

      - name: Integrate skipped groups' cached coverage (fail-closed) (#471)
        working-directory: ./backend
        env:
          RUN_FAST: ${{ needs.backend-test-planner.outputs.run_fast }}
          RUN_CORE_UNIT: ${{ needs.backend-test-planner.outputs.run_core_unit }}
          RUN_CORE_SUPPORT: ${{ needs.backend-test-planner.outputs.run_core_support }}
          RUN_SERVICES: ${{ needs.backend-test-planner.outputs.run_services }}
          KEY_FAST: ${{ needs.backend-test-planner.outputs.cache_key_fast }}
          KEY_CORE_UNIT: ${{ needs.backend-test-planner.outputs.cache_key_core_unit }}
          KEY_CORE_SUPPORT: ${{ needs.backend-test-planner.outputs.cache_key_core_support }}
          KEY_SERVICES: ${{ needs.backend-test-planner.outputs.cache_key_services }}
        run: |
          set -euo pipefail
          missing=0
          # run_flag + cache_key → matrix group name (cache file suffix).
          # FAIL-CLOSED semantics: a group is treated as SKIPPED unless the
          # planner EXPLICITLY confirmed run_<group> == 'true'. An empty or
          # malformed run flag (output-wiring bug, PR #484 run 35419811271
          # precedent) must not silently skip the restore — redundant data
          # from an unnecessary restore is harmless (union of identical
          # inputs), but MISSING data collapses the gate numerator.
          check() {
            local run_flag="$1" cache_key="$2" gname="$3"
            if [ "$run_flag" != "true" ]; then
              if [ -z "$cache_key" ]; then
                echo "::error::Planner-skipped group $gname has no cache key (run flag '$run_flag') — cannot restore its coverage (fail-closed, #471)."
                missing=1
              elif [ ! -f ".coverage-cache/.coverage.$gname" ]; then
                echo "::error::Coverage cache MISS for planner-skipped group $gname (key $cache_key) — the honest full-suite numerator cannot be assembled. Fail-closed per #471/#343; re-run in full mode to warm the cache."
                missing=1
              else
                mv ".coverage-cache/.coverage.$gname" "coverage-parts/.coverage.$gname"
                echo "Restored cached coverage for planner-skipped group $gname (run flag '$run_flag')"
              fi
            fi
          }
          check "$RUN_FAST" "$KEY_FAST" fast
          check "$RUN_CORE_UNIT" "$KEY_CORE_UNIT" core-unit
          check "$RUN_CORE_SUPPORT" "$KEY_CORE_SUPPORT" core-support
          check "$RUN_SERVICES" "$KEY_SERVICES" services
          if [ "$missing" -ne 0 ]; then
            echo "::error::Coverage-cache integration incomplete — failing closed."
            exit 1
          fi

      - name: Merge coverage and enforce gate
        working-directory: ./backend
        env:
          TIERS: ${{ (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true') && 'overall,critical,important' || 'critical,important' }}
        run: |
          # download-artifact nests each artifact in its own subdirectory
          # (coverage-parts/backend-coverage-<group>/.coverage.<group>); coverage
          # combine cannot see them there, so flatten before merging.
          # NOTE: upload needs include-hidden-files: true or dotfiles never land
          # in the artifact at all. The gate is FAIL-CLOSED: no coverage data
          # must fail the build, never silently skip enforcement.
          find coverage-parts -mindepth 2 -type f -name '.coverage*' -exec mv {} coverage-parts/ \;
          ls -la coverage-parts/
          poetry run coverage combine coverage-parts
          poetry run coverage json -o coverage.json
          poetry run python ../scripts/ci/coverage_quality_gate.py coverage.json ../scripts/ci/coverage_policy.yaml --tiers "$TIERS"
      - name: Upload merged coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-merged
          path: backend/coverage.json
          retention-days: 7

  backend-contract:
    name: Backend Contract Gate
    needs: [backend-tests]
    if: ${{ always() && needs.backend-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: artifact
          dependency-artifact: backend-venv-${{ github.sha }}

      - name: Import secrets from Infisical (Staging)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "staging"
          secret-path: "/"
          export-type: "env"

      - name: Validate OpenAPI Schema
        working-directory: ./backend
        run: |
          PYTHONPATH="." poetry run python scripts/validate_openapi.py

      - name: Verify Canonical Startup Command (AUD-1.1)
        if: github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true'
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/supremeai_test
          SUPABASE_DATABASE_URL_POOLER: postgresql://test_user:test_password@localhost:5432/supremeai_test
          SUPABASE_URL: "https://mock-supabase.co"
          SUPABASE_KEY: "mock-supabase-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-supabase-service-role-key"
          OPENAI_API_KEY: "sk-mock-openai-api-key"
          ENV: test
          BACKEND_URL: ${{ env.BACKEND_URL || secrets.BACKEND_URL }}
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars-padding-for-length
          SUPREMEAI_JWT_SECRET: test-supremeai-jwt-secret-key-for-ci-minimum-64-chars-padding-1234
        run: poetry run python ../scripts/ci/verify_canonical_startup.py

      - name: Verify Supabase / PostgreSQL pgvector Extension
        working-directory: ./backend
        run: poetry run python ../scripts/db/verify_pgvector.py

  backend-passk:
    name: Backend Reliability Scoreboard (pass^k)
    # বাংলা: pass^k হলো পর্যবেক্ষণযোগ্য স্কোরবোর্ড (gate নয়) — নিজস্ব জবে
    # সমান্তরালে চলে যাতে coverage/contract গেট এর ১০১s-এর জন্য না দাঁড়ায়।
    # continue-on-error জব-লেভেলে: fail হলেও downstream (docker/summary)
    # আটকাবে না; ব্যর্থতা এখনো summary + run-এ দৃশ্যমান থাকবে।
    needs: [backend-tests]
    if: ${{ always() && needs.backend-tests.result == 'success' && (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: artifact
          dependency-artifact: backend-venv-${{ github.sha }}

      - name: Mission suite pass^k scoreboard
        if: always()
        working-directory: ./backend
        run: |
          poetry run python ../scripts/ci/mission_passk.py --k 3
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("../reports/mission_passk.json")
          if report.is_file():
              data = json.loads(report.read_text(encoding="utf-8"))
              line = f"Mission pass^{data['k']} = {data['pass_hat_k']} (n={data['n']})"
              print(line)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(f"### Reliability scoreboard\n\n{line}\n")
          PY

      - name: Upload pass^k report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mission-passk-${{ github.sha }}
          path: reports/mission_passk.json
          if-no-files-found: ignore
          retention-days: 14

  # -----------------------------------------------------------------
  # Job 2.5: Integration Tests
  # -----------------------------------------------------------------
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, backend-prepare]
    if: ${{ needs.changes.outputs.backend == 'true' && needs.backend-prepare.result == 'success' && (github.ref == 'refs/heads/main' || github.event.inputs.run_backend_overall == 'true') }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: supremeai_test
          POSTGRES_PASSWORD: supremeai_test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supremeai_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://supremeai_test:supremeai_test_password@localhost:5432/supremeai_test
      REDIS_URL: redis://localhost:6379/0
      TESTING: "true"
      INTEGRATION_TEST: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: "false"
          mode: artifact
          dependency-artifact: backend-venv-${{ github.sha }}

      - name: Run integration tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/integration/ \
            -v \
            --tb=long \
            -m integration \
            --html=integration-test-report.html

      - name: Upload integration test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: backend/integration-test-report.html

  # -----------------------------------------------------------------
  # Job 3: Frontend Tests (vitest + coverage gate)
  # -----------------------------------------------------------------
  frontend-tests:
    name: ⚛️ Frontend Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ./frontend

      # (Task 14-b) pnpm audit honesty gate — verified exit 0 today (0 high/critical;
      # 4 low + 16 moderate advisories exist in dompurify/qs but stay below the gate
      # threshold, reported in the Task-14-b work record). Any future high/critical
      # advisory in prod deps fails this job. No || true — CI is the authority.
      - name: Production dependency audit (fail on high/critical)
        run: pnpm audit --prod --audit-level high

      - name: Single-frontend gates (A/D) — portal-split regression check
        run: python3 ../scripts/ci/check_single_frontend.py

      - name: Type check
        run: pnpm exec tsc --noEmit --strict

      # বাংলা: প্রথমে auto-fix চালাও — যা যা স্বয়ংক্রিয় সমাধানযোগ্য তা নিজে ঠিক হবে।
      # auto-fix-এর পরেও যদি কোনো প্রকৃত unfixable সমস্যা বা অতিরিক্ত ওয়ার্নিং অবশিষ্ট থাকে, তবেই কেবল fail করবে।
      - name: Lint check (auto-fix first, fail only if unfixable)
        run: |
          pnpm exec eslint src/ --ext .ts,.tsx --fix || true
          pnpm exec eslint src/ --ext .ts,.tsx --max-warnings=5

      # বাংলা (V8): ': any' burn-down ratchet — baseline (any_budget.json) থেকে বাড়লেই লাল,
      # কমলে pass ও baseline-শক্ত করার পরামর্শ। কোনো কিছু হঠাৎ ভাঙে না, অথচ ডেট বাড়ে না
      - name: ': any burn-down ratchet'
        run: python3 ../scripts/ci/check_any_budget.py --src src --baseline any_budget.json

      - name: Build bounded quality and cost evidence
        run: python3 ../scripts/ci/build_quality_evidence.py --output ../ci-reports/quality-evidence.json

      - name: Run unit tests with coverage
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.thresholds.lines=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.functions=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.branches=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.statements=${{ env.MIN_FRONTEND_COVERAGE }} \
            --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
            ci-reports/quality-evidence.json
          retention-days: 7

      - name: Check for dead code/files
        run: pnpm exec knip --debug

  # -----------------------------------------------------------------
  # Job 4: Frontend Build Verification
  # -----------------------------------------------------------------
  # বাংলা মন্তব্য (FRONTEND OPTIMIZATION):
  # পূর্বে `build` জবে সেটআপ অ্যাকশনের মাধ্যমে একবার `pnpm install` করার পরও ম্যানুয়ালি আরেকটি ডুপ্লিকেট
  # `pnpm install --frozen-lockfile` চালানো হচ্ছিল। সেটি অপসারিত হওয়ায় প্রতিটি বিল্ডে রানার সময় ও ব্যান্ডউইথ সাশ্রয় হয়।
  build:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ./frontend
          install-deps: 'true'

      - name: Import secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Build frontend
        working-directory: ./frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || env.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || env.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
        run: pnpm run build

      - name: Verify build output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "::error::Build output directory (frontend/dist) missing!"
            exit 1
          fi
          echo "Build size:"
          du -sh frontend/dist

      # P0: production build-contract — prove the real backend URL is baked
      # into the bundle (no silent viewer/degraded mode, no localhost leak).
      # Evidence report: ci-reports/frontend-build-contract.json
      - name: Verify frontend build contract (VITE_* backend URLs)
        run: python3 scripts/ci/verify_frontend_build_contract.py --dist frontend/dist --report ci-reports/frontend-build-contract.json

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/

  # -----------------------------------------------------------------
  # Deploy to Firebase (Frontend)
  # -----------------------------------------------------------------
  deploy-frontend:
    name: 🚀 Deploy Frontend
    needs: [build, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://supremeai-a.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Frontend Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Debug backend URL secrets (masked, length+shape only)
        env:
          BACKEND_URL_VALUE: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
        run: |
          echo "BACKEND_URL set via secrets: ${{ secrets.BACKEND_URL != '' }}"
          echo "BACKEND_URL set via vars:    ${{ vars.BACKEND_URL != '' }}"
          echo "USER_BACKEND_URL fallback set: ${{ secrets.USER_BACKEND_URL != '' || vars.USER_BACKEND_URL != '' }}"
          # বাংলা: মান লিক করা নিষিদ্ধ — শুধু length ও shape প্রমাণ দেখানো হয়
          # (length/sha কোনোটিই secret নয়, কিন্তু কোন মান কার্যকর হয়েছে তা নির্ণয়
          # করা যায় — 2026-09-18 incident-এর ডায়াগনস্টিক)।
          echo "BACKEND_URL effective length: ${#BACKEND_URL_VALUE}"
          echo "BACKEND_URL has path component: $([[ "$BACKEND_URL_VALUE" =~ https://[^/]+/[^/]+ ]] && echo yes || echo no)"
          echo "BACKEND_URL sha256 prefix: $(printf '%s' "$BACKEND_URL_VALUE" | sha256sum | cut -c1-8)"

      - name: Generate firebase.json from template
        run: python3 scripts/deploy/generate_firebase_config.py
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@5b73b1274a2229c7598af09e6e95addfb75f897b # master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Add Frontend URL to Summary
        run: |
          echo "### 🌐 Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "URL 1: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app" >> $GITHUB_STEP_SUMMARY
          echo "URL 2: https://${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------
  # Render deploy preflight (quota-aware)
  # -----------------------------------------------------------------
  render-deploy-preflight:
    name: 🧠 Render Deploy Preflight
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    outputs:
      build_allowed: ${{ steps.preflight.outputs.build_allowed }}
      blocked_accounts: ${{ steps.preflight.outputs.blocked_accounts }}
      recheck_at: ${{ steps.preflight.outputs.recheck_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run capability-aware quota preflight
        id: preflight
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          RENDER_BACKUP_API_KEY_2: ${{ secrets.RENDER_BACKUP_API_KEY_2 }}
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
          RENDER_WORKER_SVC_ID: ${{ secrets.RENDER_WORKER_SVC_ID }}
          RENDER_SCRAPER_SVC_ID: ${{ secrets.RENDER_SCRAPER_SVC_ID }}
          RENDER_MCP_SVC_ID: ${{ secrets.RENDER_MCP_SVC_ID }}
          RENDER_PREFLIGHT_URL: ${{ secrets.RENDER_PREFLIGHT_URL }}
          RENDER_PREFLIGHT_TOKEN: ${{ secrets.RENDER_PREFLIGHT_TOKEN }}
          RENDER_ACCOUNTS_JSON: ${{ secrets.RENDER_ACCOUNTS_JSON }}
          RENDER_REQUIRED_ROLES: ${{ vars.RENDER_REQUIRED_ROLES }}
          PREFLIGHT_EVIDENCE_PATH: ci-reports/render-deploy-preflight.json
        run: python scripts/ci/render_deploy_preflight.py
      - name: Verify deployment preflight evidence
        if: always()
        run: |
          python -m unittest discover -s tests -p 'test_preflight_evidence.py' -v
          if test -f ci-reports/render-deploy-preflight.json; then
            python scripts/ci/verify_preflight_evidence.py ci-reports/render-deploy-preflight.json
          fi
      - name: Upload deployment preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-deploy-preflight-evidence
          path: ci-reports/render-deploy-preflight.json
          if-no-files-found: ignore
          retention-days: 14

  # -----------------------------------------------------------------
  # Vercel deploy preflight (quota & rolling rate-limit guard)
  # -----------------------------------------------------------------
  vercel-deploy-preflight:
    name: ⚡ Vercel Deploy Preflight
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    outputs:
      build_allowed: ${{ steps.preflight.outputs.build_allowed }}
      daily_count: ${{ steps.preflight.outputs.daily_count }}
      monthly_count: ${{ steps.preflight.outputs.monthly_count }}
      reason: ${{ steps.preflight.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run Vercel Quota & Rate-Limit Preflight
        id: preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_DAILY_DEPLOY_LIMIT: "85"
          VERCEL_MONTHLY_DEPLOY_LIMIT: "1500"
          PREFLIGHT_EVIDENCE_PATH: ci-reports/vercel-deploy-preflight.json
        run: python scripts/ci/vercel_deploy_preflight.py
      - name: Upload Vercel preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-deploy-preflight-evidence
          path: ci-reports/vercel-deploy-preflight.json
          if-no-files-found: ignore
          retention-days: 14

  # -----------------------------------------------------------------
  # Docker Publish: Core, Scraper, Worker alias + Budget Guard
  # -----------------------------------------------------------------
  docker:
    name: Docker Publish
    needs: [changes, backend-aggregate, backend-contract, integration-test, render-deploy-preflight]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/ci-docker.yml
    with:
      publish-core: ${{ needs.changes.outputs.backend == 'true' }}
      publish-scraper: ${{ needs.changes.outputs.scraper == 'true' }}
      build-allowed: ${{ needs.render-deploy-preflight.outputs.build_allowed == 'true' }}
    secrets: inherit

  # -----------------------------------------------------------------
  # MCP Control Tower Build & Verify
  # -----------------------------------------------------------------
  mcp-build:
    name: MCP Build
    needs: [changes, render-deploy-preflight]
    uses: ./.github/workflows/ci-mcp-build.yml
    with:
      mcp-changed: ${{ needs.changes.outputs.mcp == 'true' }}
      build-allowed: ${{ needs.render-deploy-preflight.outputs.build_allowed == 'true' }}

  # -----------------------------------------------------------------
  # Production Deploy (Render + Cloudflare + DB Schema + Notify)
  # -----------------------------------------------------------------
  production-deploy:
    name: Production Deploy
    needs: [changes, docker, mcp-build, advanced-checks]
    uses: ./.github/workflows/ci-deploy-production.yml
    with:
      deploy-scraper: ${{ needs.changes.outputs.scraper == 'true' }}
      deploy-mcp: ${{ needs.changes.outputs.infra == 'true' }}
      deploy-cloudflare: ${{ needs.changes.outputs.infra == 'true' }}
    # Issue #707 deploy-gate fix: no secrets were passed to this reusable
    # workflow call, so EVERY `secrets.*` reference inside
    # ci-deploy-production.yml (incl. INFISICAL_CLIENT_ID/SECRET/PROJECT_SLUG
    # and all Render/Cloudflare credentials) resolved to empty — the migration
    # gate could never see the vault-provided SUPABASE_DATABASE_URL_WRITER and
    # hard-failed every production deploy. `secrets: inherit` matches the
    # sibling ci-docker.yml call above; the reusable workflow still only
    # exposes the keys it declares in its own `secrets:` block, and Infisical
    # injection is scoped per job inside that workflow.
    secrets: inherit

  # -----------------------------------------------------------------
  # Smart Pipeline Summary
  # -----------------------------------------------------------------
  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - security
      - changes
      - advanced-checks
      - backend-aggregate
      - backend-contract
      - backend-passk
      - integration-test
      - frontend-tests
      - build
      - deploy-frontend
      - docker
      - mcp-build
      - production-deploy
      - post-deploy-smoke
      - staging-deploy
      - vercel-deploy-preflight
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import secrets from Infisical for Summary
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: 🧠 Generate Enhanced Pipeline Summary (v2)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
        run: |
          mkdir -p ../ci-reports
          python ../.github/scripts/ci_summary_v2.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --include-trends \
            --output-format both \
            --dashboard-api-url "${{ secrets.DASHBOARD_API_URL }}" \
            | tee ../ci-reports/pipeline-summary.txt

      - name: Upload pipeline summary (evidence)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-summary-trend
          path: |
            ci-reports/pipeline-summary.txt
            ci-reports/test-failure-trend.json
          if-no-files-found: ignore

      - name: 🚦 Deployment Truth (zero false-assurance)
        if: always()
        env:
          PROD_RESULT: ${{ needs.production-deploy.result }}
          POST_SMOKE_RESULT: ${{ needs.post-deploy-smoke.result }}
          STAGING_RESULT: ${{ needs.staging-deploy.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          MCP_RESULT: ${{ needs.mcp-build.result }}
        run: |
          # বাংলা: সবুজ pipeline ≠ প্রোডাকশন ডিপ্লয় হয়েছে — এই ব্লক সত্যটা
          # summary-তে স্পষ্ট লেখে (V10 doc-truth রাউন্ড; আগে skipped হলে নীরব ছিল)।
          {
            echo "### 🚦 Deployment Truth"
            echo "- Docker Publish: \`$DOCKER_RESULT\`"
            echo "- MCP Build: \`$MCP_RESULT\`"
            echo "- Production Deploy: \`$PROD_RESULT\`"
            echo "- Post-Deploy Canary: \`$POST_SMOKE_RESULT\`"
            echo "- Staging Deployment: \`$STAGING_RESULT\`"
            if [ "$PROD_RESULT" = "success" ]; then
              echo "- ➡️ Production services were deployed this run."
              if [ "$POST_SMOKE_RESULT" = "success" ]; then
                echo "- ✅ Post-deploy canary verified the live path."
              elif [ "$POST_SMOKE_RESULT" = "failure" ]; then
                echo "- ❌ Post-deploy canary FAILED against production — rollback decision required (runbooks: \`scripts/deploy\` + \`docs/runbooks\`)."
              else
                echo "- 🟡 Post-deploy canary \`$POST_SMOKE_RESULT\` — live path NOT verified by canary (PRODUCTION_URL unset → UNVERIFIED)."
              fi
            elif [ "$PROD_RESULT" = "failure" ]; then
              echo "- ❌ Production deploy FAILED — production was NOT updated. Runbooks: \`scripts/deploy\` + \`docs/runbooks\`."
            else
              echo "- 🟡 Production Deploy SKIPPED — live production path was NOT exercised by this run. A green pipeline does NOT mean production was deployed or verified."
              echo "- 🟡 Continuous live proof: scheduled \`QA — Live Production Smoke\` (fail-closed until \`vars.PRODUCTION_URL\` is configured)."
            fi
            if [ "$STAGING_RESULT" = "skipped" ] || [ -z "$STAGING_RESULT" ]; then
              echo "- 🟡 Staging SKIPPED — capability flag-gated (\`vars.STAGING_ENABLED\` unset); staging path UNVERIFIED by design until owner configures it."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🛡️ Surface Advanced Pre-Merge Audit Details
        if: always() && needs.advanced-checks.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supremeai-ci-audit-reports
          path: ci-reports
          merge-multiple: true

      - name: 📋 Add Advanced Audit to Smart Summary
        if: always()
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
          CI_AUDIT_REPORT_DIR: ci-reports
        run: python .github/scripts/surface_advanced_audit_summary.py

  # -----------------------------------------------------------------
  # Modular Reusable Workflows: QA Contract & Staging Deployment
  # -----------------------------------------------------------------
  qa-contract:
    name: 📋 QA Contract
    needs: [changes]
    uses: ./.github/workflows/qa-contract.yml

  staging-deploy:
    name: 🚀 Staging Deployment
    needs: [qa-contract, build, deploy-frontend, production-deploy]
    # বাংলা: staging ক্যাপাবিলিটি পতাকা-গেটেড — vars.STAGING_ENABLED না থাকলে skip
    # (staging service/secrets প্রতিষ্ঠিত না হওয়া পর্যন্ত স্থায়ী লাল নয়; summary-তে
    # Deployment Truth ব্লক UNVERIFIED স্পষ্ট বলবে — নীরব ভুয়া পাস নয়)।
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.STAGING_ENABLED == 'true'
    uses: ./.github/workflows/staging-deploy.yml
    secrets: inherit

  # -----------------------------------------------------------------
  # Post-deploy canary — প্রথমবার সত্যিকারে সংযুক্ত (আগে workflow_run ট্রিগার
  # "Production Deploy" নামের স্বতন্ত্র run-এর অপেক্ষায় ছিল, কিন্তু workflow_call
  # কখনোই স্বতন্ত্র run তৈরি করে না → canary স্থাপত্যগতভাবে মৃত ছিল, ০ run)।
  # -----------------------------------------------------------------
  post-deploy-smoke:
    name: QA — Post-Deploy Smoke
    needs: [production-deploy]
    if: always() && needs.production-deploy.result == 'success' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/09-post-deploy-smoke.yml
    secrets: inherit

