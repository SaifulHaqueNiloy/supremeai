# ============================================================
# SupremeAI - Production Docker Compose Configuration
# Multi-service orchestration for production deployment
# ============================================================

services:
  # ----------------------------------------------------------
  # SUPREMAI BACKEND (FastAPI)
  # ----------------------------------------------------------
  supremeai-backend:
    build:
      # AUD/0.5 fix: this file previously referenced context ../../ with a root
      # "Dockerfile" target=production — neither exists, so the build could
      # never succeed. The canonical backend image lives at backend/Dockerfile
      # (multi-stage, runtime stage = what production runs).
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: supremeai/backend:${VERSION:-latest}
    container_name: supremeai-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Set OTEL_EXPORTER_OTLP_ENDPOINT only when the observability profile is enabled.
      # The collector is profile-scoped and is intentionally absent from the base stack.
      - ENV=production
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; use python (same as backend/Dockerfile HEALTHCHECK).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      supremeai-network:
        # FE-02 fix (issue #501): frontend/nginx.conf proxies to
        # http://backend:8080. The service is named supremeai-backend, so
        # DNS for "backend" failed inside the production network -> every
        # /api, /admin-api, /auth and /ws request returned 502. The dev
        # compose already attaches the same alias; mirror it here.
        aliases:
          - backend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "prometheus.job=supremeai-backend"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"

  # ----------------------------------------------------------
  # POSTGRESQL DATABASE (with pgvector)
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: supremeai-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_statement=ddl"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ----------------------------------------------------------
  # REDIS (Cache & Session Store)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: supremeai-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --save 300 100
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # PROMETHEUS (Metrics Collection)
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: supremeai-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      - ./infrastructure/monitoring/prometheus/secrets/backend_metrics_token:/etc/prometheus/secrets/backend_metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=20GB'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - supremeai-backend
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # GRAFANA (Visualization Dashboards)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.3
    container_name: supremeai-grafana
    profiles: ["observability"]
    restart: unless-stopped
    env_file:
      - .env.grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Host 3000 is the app/frontend default port — binding Grafana there caused
      # a clash on any host also serving the web app. Loopback-only 3300 keeps the
      # same hardened posture as prometheus/postgres/redis; container port is
      # unchanged, so Grafana-internal links (provisioned dashboards/datasources)
      # are unaffected.
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # OPENTELEMETRY COLLECTOR (Observability)
  # ----------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.88.0
    container_name: supremeai-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./infrastructure/monitoring/opentelemetry/otel-collector-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus exporter metrics
      - "13133:13133" # Health check extension
    depends_on:
      - prometheus
      # INF-11 fix (issue #534): the traces pipeline exports to otlp/jaeger
      # (endpoint jaeger:4317) — start Jaeger before the collector so the
      # exporter resolves its target on first batch.
      - jaeger
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # JAEGER (Trace Backend — for otel-collector otlp/jaeger exporter)
  # ----------------------------------------------------------
  # INF-11 fix (issue #534): the collector's traces pipeline exported every
  # batch to jaeger:4317 while no jaeger service existed anywhere in the
  # stack — DNS-unresolvable target, continuous exporter errors, zero traces
  # reaching any backend. Added the issue's suggested all-in-one backend to
  # the same observability profile the collector runs in.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: supremeai-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # Accept OTLP gRPC on the container-native 4317 (matches the
      # otel-collector exporter endpoint jaeger:4317); OTLP HTTP on 4318.
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI (loopback-only, same posture as prometheus/grafana)
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


  # ----------------------------------------------------------
  # POSTGRES EXPORTER (Database Metrics — for prometheus job 'postgresql')
  # ----------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: supremeai-postgres-exporter
    profiles: ["observability"]
    restart: unless-stopped
    # Compose interpolates from the environment/.env; align credentials
    # with .env.production used by the postgres service.
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-supremeai}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supremeai}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # REDIS EXPORTER (Cache Metrics — for prometheus job 'redis')
  # ----------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: supremeai-redis-exporter
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # NODE EXPORTER (Host Metrics — for prometheus job 'node-exporter')
  # ----------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: supremeai-node-exporter
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------
  # CADVISOR (Container Metrics — for prometheus job 'cadvisor')
  # ----------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: supremeai-cadvisor
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - supremeai-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


# ----------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------
networks:
  supremeai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ----------------------------------------------------------
# VOLUMES (Persistent Data)
# ----------------------------------------------------------
volumes:
  # R-02 fix (issue #536): postgres_data previously bind-mounted a hardcoded
  # host path (driver_opts: {type: none, o: bind, device: /data/postgresql}).
  # /data/postgresql does not exist on fresh/non-GCP hosts, so named-volume
  # creation failed and postgres never started. A plain local named volume
  # (like redis_data below) is portable across deploy targets; Docker manages
  # the on-disk location.
  postgres_data:
    driver: local
  
  redis_data:
    driver: local
  
  prometheus_data:
    driver: local
  
  grafana_data:
    driver: local
