name: SupremeAI Simple CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "poetry"
          cache-dependency-path: "backend/poetry.lock"

      - name: Install backend dependencies
        run: |
          cd backend
          poetry config virtualenvs.create false
          poetry install

      - name: Backend Pre-flight Checks (Lint & Typecheck)
        run: |
          cd backend
          poetry run ruff check .
          poetry run mypy .

      - name: Run backend tests
        run: |
          cd backend
          poetry run pytest tests/ -q

      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/saifulhaqueniloy/supremeai-backend:latest
            ghcr.io/saifulhaqueniloy/supremeai-backend:${{ github.sha }}

  frontend-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Frontend Pre-flight Checks (Lint & Typecheck)
        run: |
          cd frontend
          pnpm run lint
          pnpm run typecheck

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Deploy PR Preview to Firebase Hosting
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}'
          projectId: supremeai-a
          target: admin

      - name: Deploy Live to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}'
          channelId: live
          projectId: supremeai-a
          target: admin

      - name: Auto-update Lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update pnpm-lock.yaml"
            git push
          fi

  api-contract-check:
    name: 🔗 Frontend↔Backend API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run API contract verifier (AUDIT-018 prevention)
        run: python scripts/ci/verify_api_contract.py

  security-scan:
    name: 🔍 Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,misconfig'
          skip-dirs: '_archive,.kilo,frontend/node_modules,backend/.venv'

  bridge-boot-check:
    name: 🔌 Bridge Boot Check (Backend + DB)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supreme_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "poetry"
          cache-dependency-path: "backend/poetry.lock"
      - name: Install & Run Backend
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
          SUPREMEAI_JWT_SECRET: "supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad"
        run: |
          cd backend
          poetry install
          poetry run alembic upgrade head || echo "Alembic migrations failed or skipped"
          poetry run python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 10
      - name: Probe Admin API
        run: |
          curl --retry 5 --retry-delay 2 --retry-connrefused -f --max-time 3 http://127.0.0.1:8000/api/v1/health || exit 1
          # Telemetry requires JWT auth, skipping in preflight
          # curl --retry 5 --retry-delay 2 --retry-connrefused -f --max-time 3 http://127.0.0.1:8000/api/v1/telemetry || exit 1

  check-render-quota:
    name: 📊 Check Render Build Quota
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      use_github_build: ${{ steps.quota.outputs.use_github_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Check Quota Usage
        id: quota
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-d9d3n58js32c738n79k0' }}
          BACKUP_SVC_ID: ${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}
        run: python .github/scripts/check-render-quota.py

  deploy-backend:
    name: 🚀 Trigger Render Deploy
    needs: [backend-ci, frontend-ci, security-scan, bridge-boot-check, check-render-quota]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Trigger Render Deploy (Backend)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          USE_GITHUB_BUILD: ${{ needs.check-render-quota.outputs.use_github_build }}
        run: |
          # Set IMAGE_URL if quota is exceeded
          if [ "$USE_GITHUB_BUILD" = "true" ]; then
            export IMAGE_URL="ghcr.io/saifulhaqueniloy/supremeai-backend:${{ github.sha }}"
            echo "⚠️ Render Free Limit reached! Deploying pre-built Docker Image: $IMAGE_URL"
          fi
          
          # Try primary API key first
          if [ -n "$RENDER_API_KEY" ]; then
            python .github/scripts/trigger_render_deploy.py
          fi
          
          # Try backup API key if present
          if [ -n "$RENDER_API_KEY_BACKUP" ]; then
            RENDER_API_KEY=$RENDER_API_KEY_BACKUP python .github/scripts/trigger_render_deploy.py
          fi

  health-check:
    name: 🩺 Environment Health Check
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Run Environment Health Check Script
        run: python scripts/check_env_health.py

      - name: Install AI Observability Dependencies
        if: always()
        run: pip install httpx loguru

      - name: Run AI Log Analyzer
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
        run: python backend/scripts/devops/ai_log_analyzer.py

      - name: Install pnpm
        if: always()
        run: npm install -g pnpm

      - name: Setup Node.js (For Browser Automation)
        if: always()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Playwright & Dependencies
        if: always()
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Active Monitor (Admin & User Dashboards)
        if: always()
        env:
          BASE_URL: ${{ secrets.MONITOR_BASE_URL || 'https://supremeai-admin.web.app' }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
        run: pnpm exec playwright test tests/e2e/active-monitor.spec.ts --project=chromium

  deploy-cloudflare:
    name: ⚡ Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'infrastructure/cloudflare'
