name: QA Contract

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: supremeai-qa-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate QA contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
      - run: pnpm qa:validate

