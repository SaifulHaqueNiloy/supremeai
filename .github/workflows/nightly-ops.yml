      - name: Upload ZAP reports (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: reports/
          if-no-files-found: ignore

      - name: Summarize gate result
        if: always()
        run: |
          echo "## DAST Gate (OWASP ZAP)"
          echo "- Target: ${{ env.ZAP_TARGET }}"
          echo "- Reports uploaded as artifact: zap-reports"
          echo "- Post-scan IDOR/business-logic rules: tracked in SECURITY_AUDIT_MATRIX.md P8"

  constitution:
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_constitution == true) ||
        (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1')
    concurrency:
      group: nightly-ops-constitution
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    name: Validate constitution governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate exceptions and expiry
        run: python scripts/ci/validate_constitution_governance.py
      - name: Run constitution unit tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts/constitution/tests -v

  self-audit:
    if: >-
        (github.event_name == 'workflow_dispatch' && inputs.run_self_audit == true) ||
        (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    name: 🔍 Weekly Self-Audit Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Run offline self-audit scan
      run: "python3 scripts/quality/self_audit_scan.py \\\n  --path . \\\n  --json self_audit_report.json \\\n  --fail-on-syntax-error\n"
    timeout-minutes: 30
