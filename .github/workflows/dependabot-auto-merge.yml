# =============================================================================
# Dependabot Safe Auto-Merge Pipeline (#2673, #2472)
# =============================================================================
# বাংলা মন্তব্য: এই ওয়ার্কফ্লোটি শুধুমাত্র ডিপেন্ডাবটের low-risk (patch ও minor)
# পুল রিকোয়েস্টগুলোকে স্বয়ংক্রিয়ভাবে Approve করে এবং Auto-Merge এনেবল করে।
# কোনো Major (ব্রেকিং) পরিবর্তন থাকলে তা কখনই অটো-মার্জ হবে না।
# গিটহাবের রিকোয়ার্ড সিআই গেট এবং টেস্ট পাস করলেই গিটহাব নিজে থেকেই PR মার্জ করবে।
# =============================================================================

name: 🤖 Dependabot Safe Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: "🚀 Auto-Approve & Auto-Merge Low-Risk Bumps"
    # বাংলা মন্তব্য: শুধুমাত্র ডিপেন্ডাবটের তৈরিকৃত PR-এর ক্ষেত্রে চলবে
    if: >-
      github.actor == 'dependabot[bot]' ||
      startsWith(github.event.pull_request.user.login, 'dependabot') ||
      startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # -------------------------------------------------------------------------
      # ১. Low-Risk (Patch & Minor) bumps — অটো অ্যাপ্রুভ ও অটো-মার্জ ফ্ল্যাগ সক্রিয়
      # -------------------------------------------------------------------------
      - name: Auto-Approve and enable auto-merge for patch/minor
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          set -euo pipefail
          echo "✅ Detected low-risk bump: ${{ steps.metadata.outputs.update-type }}"
          echo "🤖 Enabling auto-approve and squash auto-merge..."
          gh pr review "$PR_URL" --approve --body "🤖 **SupremeAI Safe Auto-Merge Gate:** Low-risk (\`${{ steps.metadata.outputs.update-type }}\`) dependency bump automatically approved. Merge will execute automatically once all required CI gates pass."
          gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------------
      # ২. High-Risk (Major) bumps — অটো-মার্জ স্কিপ ও অ্যালার্ট
      # -------------------------------------------------------------------------
      - name: Log major bump safety block
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "🛑 Major version bump detected (${{ steps.metadata.outputs.update-type }}). Auto-merge intentionally bypassed per AGENTS.md safety policy."
