version: 1

# FINAL-TEST P1 (staged coverage baseline, 2026-09-14):
# ladder 30 → 40 → 50 → 60 overall. This file is the AUTHORITATIVE backend
# gate (coverage_quality_gate.py); MIN_BACKEND_COVERAGE in ci.yml is enforced
# on top of it in the backend-aggregate job. Keep both in sync.
thresholds:
  overall:
    pr: 30
    # release: 70
  critical:
    pr: 80
    # release: 90
  important:
    pr: 60
    # release: 80
  changed:
    critical: 80
    standard: 60
  release_changed:
    critical: 90
    standard: 75
  critical_paths:
    pr: 95
    # release: 100

critical:
  - backend/core/llm/**
  - backend/core/orchestration/**
  - backend/core/security/**
  - backend/api/auth/**
  - backend/api/routes/agent*
  - backend/api/routes/api_keys*
  - backend/api/routes/billing*
  - backend/services/usage*
  - backend/services/memory*
  - backend/core/queue/**
  - backend/tools/checkpoint_manager*
  - backend/tools/parallel_agent_executor*
  - backend/core/microvm_sandbox*

important:
  - backend/services/**
  - backend/tools/**
  - backend/api/routes/**
  - backend/tools/knowledge/**
