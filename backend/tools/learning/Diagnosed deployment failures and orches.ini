১	Firebase/Vercel build-এ VITE_API_URL/VITE_API_BASE inject হয় না	Critical — frontend backend-এর সাথে কথাই বলতে পারে না	CI workflow-তে env var যোগ + repo variable সেট
২	Render API key দুটো চ্যাটে exposed হয়ে গেছে	Critical — security	এখনই rotate
৩	deploy-to-render শুধু trigger status দেখে, actual boot/health verify করে না	High — silent broken deploy সম্ভব	deploy-হুকের পর health-check polling যোগ
৪	README-এর পোর্টাল URL বনাম render.yaml-এর ALLOWED_HOSTS mismatch	Medium — confusion, ভুল domain-এ traffic পাঠানোর ঝুঁকি	Render dashboard-এ actual URL verify করে README sync
৫	autoDeploy: false + একাধিক manual trigger path (hook/API/primary/backup) — জটিল, fragile chain	Medium — future silent failure-এর সম্ভাবনা	সরল করে একক verified deploy path
প্রায়োরিটি ১-এর সমাধান (কোড রেডি)
.github/workflows/supreme-core-ci.yml-এ এই দুই জায়গায় env var যোগ করতে হবে:

yaml
  deploy-admin-firebase:
    ...
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Build Admin
        env:
          VITE_API_URL: ${{ vars.SUPREMEAI_ADMIN_API_URL }}
          VITE_API_BASE: ${{ vars.SUPREMEAI_ADMIN_API_URL }}
        run: VITE_PORTAL_TYPE=admin pnpm --dir apps/studio-client run build

  deploy-user-vercel:
    ...
    steps:
      - uses: actions/checkout@v4
      ...
      - name: Build User Portal
        env:
          VITE_API_URL: ${{ vars.SUPREMEAI_USER_API_URL }}
          VITE_API_BASE: ${{ vars.SUPREMEAI_USER_API_URL }}
        run: VITE_PORTAL_TYPE=user pnpm --dir apps/studio-client run build
যুক্তি (হার্ডকোড এড়ানোর জন্য): admin আর user portal ভিন্ন backend instance-এ কথা বলে (render.yaml-এ supremeai-admin বনাম supremeai-backend আলাদা সার্ভিস), তাই দুটো আলাদা GitHub repo variable (SUPREMEAI_ADMIN_API_URL, SUPREMEAI_USER_API_URL) — Settings → Secrets and variables → Actions → Variables-এ সেট করতে হবে — লাইভ Render URL দিয়ে। কোনো URL হার্ডকোড করা হয়নি, existing vars.SUPREMEAI_API_URL প্যাটার্নই অনুসরণ করা হয়েছে যা frontend-core জবে আগে থেকেই আছে।

🚧 এখন যা করতে হবে — push নিয়ে সীমাবদ্ধতা
আমার এই sandbox-এ এই মুহূর্তে আপনার GitHub repo-র push credentials সেট নেই (আগের সেশনগুলোতেও একই সীমাবদ্ধতা ছিল)। তাই আমি সরাসরি push করে দিতে পারছি না। দুটো অপশন:

আপনি নিজে উপরের diff-টা supreme-core-ci.yml-এ বসিয়ে commit/push করুন, আর GitHub repo variables-এ SUPREMEAI_ADMIN_API_URL / SUPREMEAI_USER_API_URL সেট করুন — কাজ এখনই শেষ।
আমাকে একটা সাময়িক GitHub PAT (repo scope) দিন এই চ্যাটে — আমি বাকি ৫টা প্রায়োরিটির কোড fix (health-check polling, README sync ইত্যাদি) লিখে সরাসরি main-এ push করে দিতে পারি, যেমনটা আগের সেশনে করেছিলাম।
