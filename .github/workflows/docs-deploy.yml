name: 📝 Docs Auto-Deploy

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore', 'logs/**']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  generate-codebase-docs:
    name: 📝 Auto-Generate & Deploy Docs
    # বাংলা মন্তব্য: মেইন বা ডেভেলপ ব্রাঞ্চে পুশ করা হলে স্বয়ংক্রিয়ভাবে কোডবেসের মার্কডাউন ফাইল ও ড্যাশবোর্ড জেনারেট এবং ডিপ্লয় হবে
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          pipx install poetry
          pip install litellm pyyaml httpx
          cd backend && poetry config virtualenvs.in-project true
      - name: Load Cached Virtualenv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install Dependencies (Only on Cache Miss)
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install --sync --with dev --without ml,tools
          
      - name: 🤖 Generate AI Architecture Docs (ADR, DFD, OpenAPI)
        env:
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd backend && poetry run python ../scripts/generate_openapi.py
          cd .. && python scripts/auto_generate_architecture_docs.py
          python scripts/generate_push_summary.py

      - name: Generate Smart Docs & Dashboard
        run: python scripts/generate_smart_docs.py
        
      - name: Commit and Push Docs to Repo
        id: push_docs
        run: |
          git config --global user.name "SupremeAI-DocBot"
          git config --global user.email "docbot@supremeai.dev"
          git add -f docs/autogen/ || true
          git add -f ADR-*.md || true
          git add -f DIAGRAM-*.md || true
          git add -f THREAT-MODEL-*.md || true
          git add -f backend/API-swagger.yaml || true
          git add -f API-swagger.yaml || true
          git diff-index --quiet HEAD || (git commit -m "docs: [auto-docs] Automated ADR, Codebase Docs & Dashboard [skip ci]" && git push) || echo "No changes to commit"
      - name: Force Purge Unnecessary Old Caches (Smartest Clean)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Initiating Force Cache Purge Engine..."
          gh cache list --repo ${{ github.repository }} --limit 100 | awk '{print $1}' | while read -r cache_key; do
            if [ ! -z "$cache_key" ]; then
              echo "🗑️ Force deleting stale cache key -> $cache_key"
              gh cache delete "$cache_key" --repo ${{ github.repository }} || true
            fi
          done
          echo "✅ Caches optimized successfully! runtime minutes saved."
      - name: Setup GitHub Pages Environment
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true # বাংলা মন্তব্য: রিপোজিটরিতে যদি পেজেস কনফিগার করা না থাকে, তবে এটি স্বয়ংক্রিয়ভাবে অ্যাকশনস সোর্স দিয়ে চালু করবে।
      - name: Prepare Pages Content (exclude large files)
        if: github.ref == 'refs/heads/main'
        run: |
          # বাংলা মন্তব্য: codebase_full.md ফাইলটি ১৩MB+ বড় হওয়ায় GitHub Pages limit অতিক্রম করে, তাই বাদ দেওয়া হচ্ছে
          find docs/autogen -name "codebase_full.md"

