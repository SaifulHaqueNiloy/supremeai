# Protected Scopes — paths that trigger Guardian-Deep + mandatory human review
# Touching any of these paths sets risk_class: CRITICAL
version: "1.0"

protected_scopes:
  - path: "services/hitl/**"
    description: "Human-in-the-Loop control logic"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-09", "SG-12"]

  - path: "backend/core/auth/**"
    description: "Authentication & session management"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-03", "SG-04", "SG-12"]

  - path: "backend/core/security/**"
    description: "Security primitives (crypto, validation, sanitization)"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-01", "SG-02", "SG-07"]

  - path: ".github/workflows/**"
    description: "CI/CD pipeline definitions"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-04", "SG-09", "SG-11"]

  - path: ".github/scripts/pr_helper/**"
    description: "PR Helper delta/hunk scripts (bootstrap-trust critical)"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-11"]
    note: "Self-modification of PR Helper logic — auto-merge MUST be disabled"

  - path: "docs/security/SECURITY_GUARDIAN.md"
    description: "This constitution itself"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-11"]

  - path: "security/policies/**"
    description: "Security policy definitions"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-11", "SG-14"]

  - path: "database/migrations/**"
    description: "Tenant isolation & data schema"
    risk_class: CRITICAL
    requires_human_review: true
    invariant_refs: ["SG-05", "SG-12"]

risk_classification_rules:
  - condition: "any protected_scope touched"
    risk_class: CRITICAL
  - condition: "auth_changed OR hitl_changed OR workflows_changed"
    risk_class: HIGH
  - condition: "security_changed"
    risk_class: HIGH
  - condition: "backend code_changed (non-protected)"
    risk_class: MEDIUM
  - condition: "frontend_changed OR docs_only"
    risk_class: LOW
