# ==============================================================================
# _backend-test.yml — Backend Tests (Pre-Merge Gate + Core Tests)
# ==============================================================================
# Extracted from supreme-core-ci.yml (lines 368-1011)
# Called via workflow_call from the orchestrator.
# ==============================================================================

name: 🐍 Backend Tests

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        type: string
        required: false
        default: '3.11'
      node_version:
        description: 'Node version to use'
        type: string
        required: false
        default: '24'
      backend_changed:
        description: 'Whether backend files changed'
        type: boolean
        required: false
        default: false
      docker_build_changed:
        description: 'Whether docker build files changed'
        type: boolean
        required: false
        default: false
      docs_only:
        description: 'Whether only docs changed'
        type: boolean
        required: false
        default: false
      trivial_change:
        description: 'Whether this is a trivial change'
        type: boolean
        required: false
        default: false
      run_attempt:
        description: 'Run attempt number'
        type: string
        required: false
        default: '1'

jobs:
  backend-core:
    name: 🐍 Backend Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_group_name: "API"
            test_paths: "tests/api"
          - test_group_name: "Core"
            test_paths: "tests/core"
          - test_group_name: "Agents & AI"
            test_paths: "tests/agents tests/ai tests/llm"
          - test_group_name: "Others"
            test_paths: "tests/byoc tests/engine tests/load tests/middleware tests/monitoring tests/p2p tests/rag tests/scout tests/test_*.py"
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supreme_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SETUPTOOLS_USE_DISTUTILS: stdlib
      ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
      PYTHONPATH: ${{ github.workspace }}/backend
      GITHUB_TOKEN: "mock_dummy_token"
      RENDER_API_KEY: "mock_render_key"
      SUPABASE_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
      SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      SUPREMEAI_JWT_SECRET: "supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad"
      ADMIN_AUTHORIZED: "true"
      DOCS_PASSWORD: "mock_docs_password"
      SUPREMEAI_ADMIN_PASSWORD_HASH: "$2b$12$mockhashmockhashmockhashmockhashmockhash"
      STRIPE_API_KEY: "mock_stripe_api_key"
      STRIPE_WEBHOOK_SECRET: "mock_stripe_webhook_secret"
      SUPABASE_URL: "https://mock.supabase.co"
      SUPABASE_KEY: "mock_supabase_key"
      GEMINI_API_KEY: "mock_gemini_api_key"
      OPENROUTER_API_KEY: "mock_openrouter_api_key"
      OPENAI_API_KEY: "mock_openai_api_key"
      ANTHROPIC_API_KEY: "mock_anthropic_api_key"
      ALLOW_TEST_AUTH_BYPASS: "true"
      ALLOW_TEST_ORIGIN_BYPASS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: 📦 Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: ⚙️ Setup Poetry + venv Cache
        id: poetry-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            backend/.venv
          key: ${{ runner.os }}-poetry-v4-py3.11-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-v4-py3.11-
            ${{ runner.os }}-poetry-v4-

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/poetry.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 📦 Install Dependencies (Smart Sync)
        run: |
          mkdir -p backend
          cd backend
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          if [ "${{ steps.poetry-cache.outputs.cache-hit }}" != "true" ]; then
            poetry install --with dev
          else
            echo "venv cache HIT — syncing dependencies with poetry"
            poetry install --no-root --sync --with dev
          fi

      - name: 🎭 Install Playwright Browsers (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd backend
          poetry run python -m playwright install --with-deps chromium || poetry run python -m playwright install chromium || true

      - name: 📊 Backend Cache Status Report
        run: |
          echo "### Backend Cache Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.poetry-cache.outputs.cache-hit }}" == "true" ]; then
            echo "- Poetry/venv cache: HIT — poetry install skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Poetry/venv cache: MISS — fresh install completed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            echo "- Playwright cache: HIT — browser download skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Playwright cache: MISS — browsers downloaded and cached" >> $GITHUB_STEP_SUMMARY
          fi


      - name: 🗄️ Create xdist worker databases
        run: |
          for i in {0..7}; do
            PGPASSWORD=test_password psql -h 127.0.0.1 -U test_user -d postgres -c "CREATE DATABASE supreme_test_db_gw$i;" 2>/dev/null || true
          done

      - name: 🚫 Gate 1 — Zero-Gap Stub/Placeholder Data Check
        if: inputs.docs_only != true
        run: |
          echo "=== Zero-Gap স্টাব ডেটা গেট ===" >> $GITHUB_STEP_SUMMARY
          python scripts/find_stub_data.py --path . --fail-on HIGH
          echo "✅ পাস: কোনো স্টাব/প্লেসহোল্ডার প্যাটার্ন পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY

      - name: 🛡️ Gate 1.5 — Security Blind Spot Scan
        if: inputs.docs_only != true
        run: |
          echo "=== Security Blind Spot Scan ===" >> $GITHUB_STEP_SUMMARY
          python scripts/security/auto_find_blindspots.py
          echo "✅ পাস: কোনো ক্রিটিকাল সিকিউরিটি রিস্ক নেই" >> $GITHUB_STEP_SUMMARY

      - name: 🔬 Gate 2 — Ruff Linting (No Silent Bugs)
        if: inputs.docs_only != true
        run: |
          echo "=== Ruff স্ট্যাটিক অ্যানালাইসিস গেট ===" >> $GITHUB_STEP_SUMMARY
          cd backend
          ruff check . --config pyproject.toml --fix --unsafe-fixes --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
          ruff check . --config pyproject.toml --no-fix --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
          echo "✅ পাস: Ruff লিন্টিং গেট ক্লিয়ার" >> $GITHUB_STEP_SUMMARY

      - name: 🤖 Bot Commit Detection
        id: bot-check
        run: |
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          echo "Commit author: $COMMIT_AUTHOR"
          if [[ "$COMMIT_AUTHOR" == *"CI Bot"* || "$COMMIT_AUTHOR" == *"SupremeAI Bot"* || "$COMMIT_AUTHOR" == *"[bot]"* ]]; then
            echo "is_bot_commit=true" >> $GITHUB_OUTPUT
            echo "::warning::🤖 BOT COMMIT DETECTED — Router import smoke-test will run in STRICT mode."
          else
            echo "is_bot_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔌 Gate 0 — Router Import Smoke-Test
        if: inputs.backend_changed == true || inputs.docs_only != true
        run: |
          echo "=== Router Import Smoke-Test ===" >> $GITHUB_STEP_SUMMARY
          cd backend
          if [[ "${{ steps.bot-check.outputs.is_bot_commit }}" == "true" ]]; then
            echo "🤖 Bot commit: running in STRICT mode (all routers must import cleanly)" >> $GITHUB_STEP_SUMMARY
            poetry run python ../scripts/ci/validate_router_imports.py --strict
          else
            poetry run python ../scripts/ci/validate_router_imports.py
          fi
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ পাস: সব core router imports সঠিক" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ FAIL: Router import error detected — fix imports before test suite runs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 🛡️ Gate 3.5 — Admin Router Auth Lint Guard
        if: inputs.docs_only != true
        run: |
          echo "=== Admin Auth Lint Guard ===" >> $GITHUB_STEP_SUMMARY
          cd backend
          poetry run python ../.github/scripts/verify_admin_auth.py
          echo "✅ All admin prefixed routers verified structurally." >> $GITHUB_STEP_SUMMARY

      - name: 🔗 Gate 3 — Service Topology Check
        if: inputs.docs_only != true
        run: |
          pip install pyyaml
          python scripts/ci/check_service_topology.py

      - name: 🕵️ Gate 4 — Observability & Silent Error Audit
        if: inputs.docs_only != true
        run: |
          echo "=== HTTP টাইমআউট অডিট গেট ===" >> $GITHUB_STEP_SUMMARY
          VIOLATIONS=$(grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv" | wc -l)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ FAIL: Found $VIOLATIONS httpx.AsyncClient() call(s) without explicit timeout!" >> $GITHUB_STEP_SUMMARY
            grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv"
            exit 1
          fi
          echo "✅ পাস: সব httpx ক্লায়েন্টে নির্দিষ্ট টাইমআউট আছে" >> $GITHUB_STEP_SUMMARY

      - name: 🔬 Run Observability Audit Script
        if: inputs.trivial_change != true
        id: obs_audit
        run: |
          python scripts/audit_observability.py

      - name: Audit Summary
        if: always() && inputs.trivial_change != true
        run: |
          echo "## 🔬 Observability Audit" >> $GITHUB_STEP_SUMMARY
          echo "Outcome: **${{ steps.obs_audit.outcome }}**" >> $GITHUB_STEP_SUMMARY
          echo "✅ কোনো সাইলেন্ট বা ব্রড exception হ্যান্ডলার পাওয়া যায়নি।" >> $GITHUB_STEP_SUMMARY

      - name: 🧪 Run Tests
        id: backend_tests
        working-directory: backend
        env:
          ENABLE_CHAOS_INJECTOR: "false"
          CHAOS_MODE: "disabled"
          CHAOS_ENGINE_ENABLED: "false"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
          POSTGRES_DB: "supreme_test_db"
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          if [ "${{ inputs.backend_changed }}" = "true" ] || [ "${{ inputs.docs_only }}" = "true" ]; then
            # xdist re-enabled with isolated DB and Redis configs per worker
            poetry run pytest tests/ -n auto --timeout=120 --md pytest-report.md --cov --cov-report=json:coverage.json --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=14 -k "not chaos"
          else
            echo "Skipping full backend tests, only running smoke tests."
            poetry run pytest tests/test_health.py -q
          fi

      - name: 🤖 Auto-Fix Engine (failure-only)
        # বাংলা মন্তব্য: backend test fail হলে ruff + isort + black দিয়ে auto-fix চেষ্টা করা হবে।
        # ci-auto-fix-v3.py আর নেই — auto-fix.yml-এর existing logic inline করা হলো।
        # এই fix শুধু local workspace-এ apply হয়, পরবর্তী commit-এ কার্যকর হবে।
        if: failure()
        working-directory: backend
        run: |
          echo "## 🤖 Auto-Fix Engine চালু হচ্ছে..." >> $GITHUB_STEP_SUMMARY
          pip install isort black || true
          poetry run isort . || true
          poetry run ruff check . --fix --unsafe-fixes \
            --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402 || true
          poetry run black . || true
          echo "✅ Auto-fix সম্পন্ন (ruff + isort + black) — review করে recommit করুন" >> $GITHUB_STEP_SUMMARY
          echo "::warning::Backend tests failed. Auto-fix applied (ruff + isort + black). Review and recommit."

      - name: Add Backend Test Results to GitHub Summary
        if: always()
        run: |
          mkdir -p backend
          cd backend
          python ../.github/scripts/supreme_ci.py generate-report \
            --pytest-json pytest-report-1.md \
            --coverage-json coverage-1.json \
            --label "Backend Tests"
      - name: 🛡️ Safety Guard - File Protection Validation
        id: safety_guard
        working-directory: backend
        run: |
          echo "## 🛡️ সেফটি গার্ড ভ্যালিডেশন" >> $GITHUB_STEP_SUMMARY
          poetry run python ../scripts/safety_guard.py --report-json > safety-report.json 2>&1

          if [ -f safety-report.json ]; then
            PENDING=$(grep -o '"pending_approvals": [1-9][0-9]*' safety-report.json | awk '{print $2}' || echo "0")
            if [ -n "$PENDING" ] && [ "$PENDING" -gt 0 ]; then
              echo "❌ Found $PENDING pending critical file approvals — blocking merge/deploy!" >> $GITHUB_STEP_SUMMARY
              cat safety-report.json >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "✅ সেফটি গার্ড সম্পন্ন হয়েছে — কোনো আনঅ্যাপ্রুভড সেফটি ভাইওলেশন পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ সেফটি গার্ড রিপোর্ট তৈরি হয়নি" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Multi-Model Validator - Security & Logic Check
        id: validator
        working-directory: backend
        run: |
          echo "## 🔍 মাল্টি-মডেল কোড ভ্যালিডেশন" >> $GITHUB_STEP_SUMMARY
          poetry run python ../scripts/multi_model_validator.py core/ --json-output validator-report.json 2>&1

          if [ -f validator-report.json ]; then
            CRITICAL=$(grep -c "risk_level.*CRITICAL" validator-report.json || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Found $CRITICAL CRITICAL security issues — blocking merge/deploy!" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ কোনো ক্রিটিকাল সিকিউরিটি ইস্যু পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 📊 Codegraph - Knowledge Base Generation
        id: codegraph
        working-directory: backend
        run: |
          echo "## 📊 নলেজ গ্রাফ জেনারেশন" >> $GITHUB_STEP_SUMMARY
          poetry run python ../scripts/codegraph_integration.py --full --output-dir ../docs/codebase/knowledge_graph 2>&1 || true
          echo "✅ নলেজ গ্রাফ আপডেট করা হয়েছে" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Production Readiness Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-readiness-reports
          path: |
            backend/safety-report.json
            backend/validator-report.json
            docs/codebase/knowledge_graph/

      - name: 🚨 Production Readiness Summary
        if: always()
        run: |
          echo "## ✅ প্রোডাকশন রেডিনেস চেক সম্পন্ন" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### সিস্টেম স্ট্যাটাস:" >> $GITHUB_STEP_SUMMARY
          echo "- Safety Guard: ${{ steps.safety_guard.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-Model Validator: ${{ steps.validator.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Codegraph: ${{ steps.codegraph.outcome }}" >> $GITHUB_STEP_SUMMARY
