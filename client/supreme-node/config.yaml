# SupremeAI Mesh Node — Configuration Template
# MESH-3 (issue #941)
# ============================================================
# PC-1 (Dev Rig) এর জন্য এই ফাইলটি /etc/supreme-node/config.yaml
# হিসেবে কপি করুন এবং node_id / role পরিবর্তন করুন।
#
# PC-2 (Headless Tester) এর জন্য node_id=pc-2-headless, role=tester
# করে আলাদা config তৈরি করুন।
# ============================================================

# Unique identifier — Mesh-এ প্রতিটি node-এর জন্য অদ্বিতীয় হতে হবে।
# Convention: <hostname>-<purpose>  (e.g. pc-1-dev-rig, pc-2-headless)
node_id: pc-1-dev-rig

# Node type — backend PresenceRegistry এই value গুলো accept করে:
#   local_pc | cloud_agent | web_ai | edge_device | external_mcp
# PC-1 এবং PC-2 — দুটোই local_pc।
node_type: local_pc

# Role — Mesh-এর মধ্যে এই node কোন কাজ করবে সেটা নির্দেশ করে।
# Valid values: planner | coder | tester | gate | observer
# PC-1: coder  |  PC-2: tester
role: coder

# Capabilities — কোন কোন executor সক্রিয়। এই list Tower-কে heartbeat-এ
# পাঠানো হয়, এবং Tower শুধু ঐ task-ই assign করবে যেগুলো এই list-এ আছে।
capabilities:
  - file_edit
  - pytest
  - git_push
  - bash
  - ollama

# Backend REST base URL — heartbeat POST করার endpoint-এর host।
# #2255: এই URL টা **Python backend**-এর (SupremeAI API)-এর base URL হতে হবে,
# MCP Tower-এর নয় — /api/v1/nodes/heartbeat route-টা backend/api/routes/mesh.py-তে
# আছে, Tower-এ নেই (Tower-এ দিলে out-of-the-box 404)।
# ${TOWER_URL} env var দিয়ে override হয় (set না থাকলে এই literal string-টাই থেকে যাবে —
# production-এ TOWER_URL=https://your-backend-host set করুন)।
tower_url: ${TOWER_URL}

# WebSocket task-receive channel — **এখনো কোনো peer-এ implement হয়নি**
# (#2255: তাই Tower-এও নেই, backend-এও নেই)।
# খালি ("") রাখলে daemon heartbeat-only mode-এ চলবে — presence register হবে,
# task listener বন্ধ থাকবে। ভবিষ্যতে /ws/node channel তৈরি হলে এখানে
# wss://<backend-host>/ws/node বসালেই full mode চালু হয়ে যাবে।
tower_ws_url: ""

# Backend REST heartbeat endpoint (backend/api/routes/mesh.py — MESH-1 #939)।
# Full URL = tower_url + heartbeat_path
heartbeat_path: /api/v1/nodes/heartbeat

# কত সেকেন্ড অন্তর heartbeat পাঠাবে — spec অনুযায়ী 60s।
heartbeat_interval: 60

# Reconnect backoff — exponential, base থেকে শুরু।
# 2 → 4 → 8 → 16 → 32 → 64 → 128 → 256 → 300 (capped)
reconnect_backoff_base: 2
reconnect_backoff_max: 300

# Ollama local server — PC-1 এ Ollama চললে 11434 port এ থাকে।
# PC-2 তে না থাকলে ollama_url বাদ দিলেও চলবে (capability থেকে "ollama" সরান)।
# Override chain: SUPREME_NODE_OLLAMA_URL env > এই মান (Constitution ARCH-001:
# .py কোডে কোনো localhost literal নেই — default শুধু এই template-এ)।
ollama_url: http://localhost:11434

# Optional — Tower-এর API auth token যদি প্রয়োজন হয়।
# Production-এ খালি রাখলেও চলবে (heartbeat pre-auth per MESH-1 spec)।
# Env var TOWER_AUTH_TOKEN সেট করলে সেটাই ব্যবহার হবে।
tower_auth_token: ""

# Task execution — প্রতিটি task timeout (সেকেন্ডে)।
# বড় কোন task এটার বেশি সময় নিলে kill করা হবে।
task_timeout_seconds: 600

# Working directory — Tower থেকে আসা file_edit / git task এই dir-এ চলবে।
# Default: current working directory থেকে daemon চালু করুন।
# Production-এ /opt/supreme-node/workspace রেকমেন্ড করা হয়।
workspace_dir: ./workspace

# Logging
log_level: INFO  # DEBUG | INFO | WARNING | ERROR
