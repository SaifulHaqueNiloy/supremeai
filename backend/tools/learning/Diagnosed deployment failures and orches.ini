Diagnosed deployment failures and orchestrated comprehensive Bangla remediation strategy
Diagnosed deployment failures and orchestrated comprehensive Bangla remediation strategy
আগে দুটো জরুরি বিষয় বলে নিই, তারপর পুরো অডিট রিপোর্ট দিচ্ছি।

⚠️ জরুরি নিরাপত্তা সতর্কতা
আপনি এই চ্যাটে সরাসরি আপনার আসল Render API key (primary + backup) পেস্ট করেছেন। এই চ্যাট হিস্ট্রি সংরক্ষিত থাকে, তাই এই key দুটো এখন থেকে compromised ধরে নেওয়া উচিত। আমার পরামর্শ:

Render Dashboard → Account Settings → API Keys থেকে এই দুটো key এখনই revoke/rotate করুন
নতুন key শুধু GitHub repo secrets-এ (RENDER_API_KEY, RENDER_API_KEY_BACKUP) রাখুন, কখনো চ্যাটে পেস্ট করবেন না
এছাড়া, আমার sandbox-এর network allowlist-এ api.render.com নেই (শুধু GitHub/npm/pypi-জাতীয় ডোমেইন খোলা) — তাই আমি সরাসরি Render API কল করে deploy status/logs টানতে পারিনি। তার বদলে আমি পুরো GitHub repo (workflows, render.yaml, Dockerfile, Actions run history) পড়ে root cause বের করেছি — যেটা আসলে বেশি নির্ভরযোগ্য, কারণ Render-এর deploy logic পুরোপুরি এই repo-র CI workflow-তেই লেখা আছে।

🔍 অডিট ফলাফল
বর্তমান CI/CD স্ট্যাটাস
GitHub Actions-এ গত ৩০+ রান (🧠 SupremeAI Core CI #1009–#1030, 📦 Release Builder #12–#19) সবগুলোই পাস করছে — কোনো active build failure নেই। কমিট মেসেজ দেখে বোঝা যাচ্ছে, আপনি (বা আগের সেশনে আমি) ইতিমধ্যে এই সমস্যাগুলো নিয়ে কাজ করেছেন:

Fix Render backup backend connection and update service IDs (#1026)
fix(deploy): map correct Render API keys to primary and backup services (#1009)
fix: resolve frontend async test error & render deploy API status 202 (#1023)
Fix: default UVICORN_WORKERS to 1 to prevent OOM errors on Render free tier (#1029)
অর্থাৎ, "deploy failed" সমস্যাটা সম্ভবত historical — পুরনো কমিটে ছিল (#116-121-এ কয়েকটা Failure দেখা যাচ্ছিল, sync-from-production জব সংক্রান্ত), যেগুলো এখন resolved।

আসল Root Cause — Frontend↔Backend সংযোগ না হওয়ার কারণ
.github/workflows/supreme-core-ci.yml পড়ে একটা নিশ্চিত bug পেয়েছি:

yaml
deploy-admin-firebase:
  steps:
    - name: Build Admin
      run: VITE_PORTAL_TYPE=admin pnpm --dir apps/studio-client run build
      # ⚠️ কোনো VITE_API_URL / VITE_API_BASE env var নেই!

deploy-user-vercel:
  steps:
    - name: Build User Portal
      run: VITE_PORTAL_TYPE=user pnpm --dir apps/studio-client run build
      # ⚠️ এখানেও নেই!
অথচ একই ফাইলে frontend-core (শুধু CI test/lint-এর জন্য, এটা deploy করে না) জবে ঠিকই আছে:

yaml
env:
  VITE_API_URL: ${{ env.SUPREMEAI_API_URL }}
  VITE_API_BASE: ${{ env.SUPREMEAI_API_URL }}
Vite build-time-এ env var bake করে দেয় (runtime-এ পড়ে না)। তাই Firebase (admin) আর Vercel (user)-এ যে ফ্রন্টএন্ড আসলে deploy হচ্ছে, সেটা backend URL না জেনেই build হচ্ছে — ফলে ব্রাউজারে গিয়ে API call fail করবে বা fallback/undefined URL-এ যাবে। এটাই আপনার "Firebase/Vercel/Render deploy pass করলেও backend-এর সাথে connect হচ্ছে না" সমস্যার সবচেয়ে সম্ভাব্য সরাসরি কারণ।

দ্বিতীয় সমস্যা — Deploy আর্কিটেকচারের ভঙ্গুরতা
render.yaml-এ ব্যাকএন্ড সার্ভিস env: image + autoDeploy: false — অর্থাৎ GHCR-এ নতুন image push হলেও Render নিজে থেকে deploy করে না। deploy ঘটানোর পুরো দায়িত্ব deploy-to-render job-এর একটা bash script-এর উপর, যেটা primary/backup হুক ও Render API-কে ধাপে ধাপে try করে, কোনোটাই কাজ না করলে শুধু trigger-call-এর HTTP status (201/202) দেখেই "সফল" ধরে নেয় — deploy আসলে সফলভাবে শেষ হয়েছে কিনা এবং সার্ভিস সুস্থভাবে বুট হয়েছে কিনা তা কখনো verify করে না। তাই কোনো এক সময় দুটো account-এর service ID / API key mismatch হলে (যেমনটা #1009 আর #1026-এ হয়েছিল), CI green দেখাবে কিন্তু আসল backend পুরনো/broken ভার্সনে আটকে থাকবে।

তৃতীয় সমস্যা — ডকুমেন্টেশন ড্রিফট
Repo-র README-এ পোর্টাল হিসেবে লেখা:

Render (Primary): supremeai-studio-client-qb34.onrender.com
Render (Backup): supremeai-studio-client.onrender.com
কিন্তু render.yaml-এর ভেতরের ALLOWED_HOSTS লেখা:

supremeai-backend.onrender.com, supremeai-backend-65hl.onrender.com
দুটো ভিন্ন hostname scheme — মানে হয় README পুরনো (fix দরকার), নয়তো Render dashboard-এ blueprint sync থেকে সরে গিয়ে ভিন্ন service তৈরি হয়ে আছে। এটা শুধু আমি রিপো পড়ে ধরতে পেরেছি; আসল লাইভ URL কী তা নিশ্চিত করতে আপনাকে Render dashboard-এ একবার নিজে চোখে দেখে নিতে হবে (আমি সেখানে পৌঁছাতে পারছি না)।

🎯 আজকের টপ ৫ অগ্রাধিকার (গ্যাপ অ্যানালাইসিস)
