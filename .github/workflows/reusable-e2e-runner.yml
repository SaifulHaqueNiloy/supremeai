# Reusable workflow: Unified QA & E2E Test Suite Runner
# Runs guest, customer, admin, or security Playwright test suites with zero duplication.
name: Reusable E2E Suite

on:
  workflow_call:
    inputs:
      project:
        description: 'Playwright project to execute (guest | customer | admin | security)'
        required: true
        type: string
      base_url:
        description: 'Base URL under test (defaults to QA_BASE_URL env or local preview)'
        required: false
        type: string
        default: ''
      grep:
        description: 'Optional grep pattern filter (e.g. @smoke)'
        required: false
        type: string
        default: ''
      use_staging:
        description: 'Run against remote staging instead of local preview'
        required: false
        type: boolean
        default: false
    secrets:
      QA_CUSTOMER_EMAIL:
        required: false
      QA_CUSTOMER_PASSWORD:
        required: false
      QA_ADMIN_EMAIL:
        required: false
      QA_ADMIN_PASSWORD:
        required: false
      QA_ADMIN_TOTP_SECRET:
        required: false
      STAGING_URL:
        required: false

permissions:
  contents: read

jobs:
  run-e2e:
    name: 🎭 E2E (${{ inputs.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_CUSTOMER_EMAIL: ${{ secrets.QA_CUSTOMER_EMAIL }}
      QA_CUSTOMER_PASSWORD: ${{ secrets.QA_CUSTOMER_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_ADMIN_TOTP_SECRET: ${{ secrets.QA_ADMIN_TOTP_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
          install-deps: 'true'

      - name: Setup Bun (native TS script runner)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Fast Gate (checklist schema + route audit)
        run: |
          bun qa/scripts/validate-checklist.ts
          bun qa/scripts/route-audit.ts

      - name: Setup Playwright Browsers (Chromium)
        uses: ./.github/actions/setup-playwright
        with:
          browser: chromium

      # Determine target URL or spin up local vite preview
      - name: Determine Target Base URL
        id: target
        run: |
          EXPLICIT_URL="${{ inputs.base_url }}"
          STAGING="${{ secrets.STAGING_URL }}"
          USE_STAGING="${{ inputs.use_staging }}"
          
          if [ -n "$EXPLICIT_URL" ]; then
            echo "base_url=$EXPLICIT_URL" >> "$GITHUB_OUTPUT"
            echo "mode=remote" >> "$GITHUB_OUTPUT"
          elif [ "$USE_STAGING" = "true" ] && [ -n "$STAGING" ]; then
            echo "base_url=$STAGING" >> "$GITHUB_OUTPUT"
            echo "mode=remote" >> "$GITHUB_OUTPUT"
          else
            echo "mode=local-preview" >> "$GITHUB_OUTPUT"
            export VITE_USE_RELATIVE_PATH=true
            pnpm --filter supremeai-studio-client build
            pnpm --filter supremeai-studio-client exec vite preview --host 127.0.0.1 --port 3000 --strictPort &
            pnpm exec wait-on http://127.0.0.1:3000 -t 120000
            echo "base_url=http://127.0.0.1:3000" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Credentials if Project Requires Auth
        id: auth_check
        run: |
          PROJECT="${{ inputs.project }}"
          if [ "$PROJECT" = "customer" ] && [ -z "$QA_CUSTOMER_EMAIL" ]; then
            echo "::warning::QA_CUSTOMER_EMAIL is unconfigured — credential-dependent steps skipped in scheduled runs."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Manual run requested without QA customer credentials — failing closed."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$PROJECT" = "admin" ] && [ -z "$QA_ADMIN_EMAIL" ]; then
            echo "::warning::QA_ADMIN_EMAIL is unconfigured — only credential-free checks can pass."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Playwright Suite
        if: steps.auth_check.outputs.skip != 'true'
        env:
          QA_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          PROJECT="${{ inputs.project }}"
          GREP_OPT=""
          if [ -n "${{ inputs.grep }}" ]; then
            GREP_OPT="--grep=${{ inputs.grep }}"
          fi
          
          # Include setup project dependency if customer or admin
          PROJECT_ARGS="--project=$PROJECT"
          if [ "$PROJECT" = "customer" ]; then
            PROJECT_ARGS="--project=setup-customer --project=customer"
          elif [ "$PROJECT" = "admin" ]; then
            PROJECT_ARGS="--project=setup-admin --project=admin"
          fi
          
          pnpm exec playwright test -c qa/playwright.config.qa.ts $PROJECT_ARGS $GREP_OPT

      - name: Generate QA Report + Release Gate
        if: always() && steps.auth_check.outputs.skip != 'true'
        run: bun qa/scripts/generate-report.ts --results qa/results/results.json --out qa/results/report.md

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.auth_check.outputs.skip != 'true'
        with:
          name: qa-${{ inputs.project }}-results
          path: |
            qa/results/results.json
            qa/results/report.md
            qa/results/html/
          retention-days: 7
