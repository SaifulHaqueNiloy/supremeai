# SupremeAI - Manual Maintenance & Auto-Fixing Pipeline
# বাংলা মন্তব্য: এই পাইপলাইনটি ম্যানুয়ালি ট্রিগার করা যাবে এবং বিভিন্ন রক্ষণাবেক্ষণ কাজ চালানো যাবে। (সংস্করণ ৩.০)

name: "🤖 Manual Maintenance & Auto-Fix"

# (Task 14-b honesty fix) এই workflow-এর trigger শুধু schedule (02:00 daily + 02:30 Monday)
# আর workflow_dispatch — push নেই। আগে cancel-in-progress: true ছিল, ফলে সোমবারের
# 02:30 hygiene cron চলন্ত 02:00 nightly-কে cancel করে দিত (একই workflow name +
# একই ref = একই concurrency group)। false = দ্বিতীয় run অপেক্ষা করবে, self-cancellation বন্ধ।
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

on:
  # বাংলা মন্তব্য: প্রতিদিন রাত ২টায় (UTC) স্বয়ংক্রিয়ভাবে Smart Summary চালাবে
  schedule:
    - cron: '0 2 * * *'
    # বাংলা (V8): সাপ্তাহিক hygiene (changelog + knip dead-file + i18n gap) — সোমবার
    - cron: '30 2 * * 1'
  workflow_dispatch:
    inputs:
      run_weekly_hygiene:
        description: '🧹 Weekly hygiene report (changelog + knip + i18n)'
        type: boolean
        default: false
      run_ci_failure_summary:
        description: '🧠 Smart CI Failure Summary (Core CI-এর ব্যর্থতা বিশ্লেষণ)'
        type: boolean
        default: true
      run_health_check:
        description: '🩺 Run Health Check'
        type: boolean
        default: false
      run_db_schema_check:
        description: '🗄️ Run Database Schema Contract Check (real prod DB, read-only)'
        type: boolean
        default: true
      run_render_cooldown_recheck:
        description: '🧠 Run Render Account Cooldown Recheck (recheck_at <= now)'
        type: boolean
        default: true
      run_auto_lint_fix:
        description: '🔧 Run Auto Lint Fix (PR তৈরি করবে)'
        type: boolean
        default: false
      run_auto_dependency_upgrade:
        description: '📦 Run Auto Dependency Upgrade (PR তৈরি করবে)'
        type: boolean
        default: false
      run_dependency_scan:
        description: '🔍 Run Dependency Vulnerability Scan'
        type: boolean
        default: false
      run_outdated_report:
        description: '📦 Run Outdated Dependency Report'
        type: boolean
        default: false
      run_changelog_generator:
        description: '📝 Generate Changelog (PR তৈরি করবে)'
        type: boolean
        default: false
      run_cache_purge:
        description: '🗑️ Purge Redis Cache (Upstash)'
        type: boolean
        default: false
      run_generate_docs:
        description: '📚 Generate & Deploy Docs'
        type: boolean
        default: false
      run_mlops_nightly_eval:
        description: '🧠 Run MLOps Nightly Evolution & Governance (Drift, Bias, Injection)'
        type: boolean
        default: true
      run_performance_e2e:
        description: '🧪 Run Performance E2E (Playwright)'
        type: boolean
        default: false
      run_telegram_backup:
        description: '🔒 Run Telegram Vault Backup'
        type: boolean
        default: false
      backup_mode:
        description: 'Backup Mode (full, config, db_only)'
        type: choice
        default: 'full'
        options:
          - 'full'
          - 'config'
          - 'db_only'
      run_performance_check:
        description: 'Run Performance Check'
        type: boolean
        default: false
      run_churn_analysis:
        description: 'Run Churn Analysis'
        type: boolean
        default: false

# বাংলা মন্তব্য: প্রতিটি টাস্ককে আলাদা জব-এ ভাগ করা হয়েছে স্বচ্ছতা এবং নির্ভরযোগ্যতার জন্য.

# বাংলা মন্তব্য: NODE_VERSION এবং PYTHON_VERSION এখানে define করা হয়েছে কারণ এটি
# maintenance pipeline-এর নিজস্ব env scope। supreme-core-ci থেকে inherit হয় না।
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'

jobs:
  # বাংলা মন্তব্য: gatekeeper জব সবার আগে রান হয়।
  # ২৪ ঘণ্টার মধ্যে আগে রান হলে should_run=false সেট করে বাকি সব জব গ্রেসফুলি স্কিপ করায়।
  gatekeeper:
    name: "🚦 Check 24h Gap"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_run: ${{ steps.check_gap.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Gap Check
        id: check_gap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/enforce_24h_gap.py

  # এই জবটি শুধুমাত্র একবার রান হবে এবং সব downstream জব এটি ব্যবহার করবে।
  setup:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      requirements-cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "🔑 Generate Cache Key"
        id: cache-key
        run: echo "key=py-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}" >> $GITHUB_OUTPUT

      - name: Setup Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          plugins: poetry-plugin-export

      - name: "♻️ Cache pip dependencies"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: "⚙️ Install Dependencies"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          poetry self add poetry-plugin-export
          poetry export --with dev --without ml --format requirements.txt --output requirements.txt
          pip install --no-cache-dir --disable-pip-version-check -r requirements.txt
          pip install pip-audit ruff==0.16.4

  health-check:
    needs: setup
    if: github.event.inputs.run_health_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "🩺 Run Health Check"
        working-directory: backend
        run: |
          poetry run python -m tools.health_checker

  # -----------------------------------------------------------------
  # 🗄️ Database Schema Contract Check
  # বাংলা: প্রতিদিন রাত ২টায় (cron) এবং ম্যানুয়ালি — আসল প্রোডাকশন ডাটাবেস
  # (read-only) স্ক্যান করে backend/database/contracts/schema_contract.yaml
  # এর সাথে মিলিয়ে দেখে। কোনো required column/table/index মিসিং থাকলে
  # job FAIL করবে (❌ লাল হয়ে দেখাবে GitHub Actions-এ + Slack/summary),
  # আর non-critical known drift থাকলে ⚠️ warning হিসেবে দেখাবে শুধু।
  # -----------------------------------------------------------------
  db-schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event.inputs.run_db_schema_check == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🐍 Setup Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "⚙️ Install checker dependencies"
        run: pip install --no-cache-dir --disable-pip-version-check psycopg2-binary pyyaml

      - name: "🗄️ Check live database against schema contract"
        env:
          # DB_SCHEMA_CHECK_URL should point to a READ-ONLY role against the
          # real production Postgres (Supabase project supremeai-sg-prod).
          # Falls back to DATABASE_URL/SUPABASE_DATABASE_URL if not set.
          DB_SCHEMA_CHECK_URL: ${{ secrets.DB_SCHEMA_CHECK_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL_POOLER || secrets.DATABASE_URL }}
        run: python scripts/ci/check_database_schema.py

      - name: "📣 Notify on failure"
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "::error::Production database schema drift detected — see job summary above for exact missing tables/columns/indexes."
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST -H 'Content-type: application/json' \
              --data '{"text":"🔴 SupremeAI: production DB schema contract check FAILED. See GitHub Actions run for details."}' \
              "$SLACK_WEBHOOK_URL" || true
          fi

  auto-lint-fix:
    needs: setup
    if: github.event.inputs.run_auto_lint_fix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.requirements-cache-key }}
      - name: "⚙️ Install Formatters"
        run: pip install ruff==0.16.4
      - name: "💅 Run Auto-Lint & Format Fix"
        run: |
          set -euo pipefail
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .
          echo "Auto-fix validation passed; a PR will be created only when the tree is clean." >> "$GITHUB_STEP_SUMMARY"
      - name: "🤖 Create Pull Request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          ACTIONS_ALLOW_UNSECURE_NODE_VERSION: 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-lint and format with ruff, black, isort"
          title: "🤖 Auto-Lint & Format Fix (Ruff)"
          body: |
            এই PR টি 'auto-lint-fix' মেইনটেন্যান্স টাস্ক দ্বারা স্বয়ংক্রিয়ভাবে তৈরি হয়েছে।
            এতে স্বয়ংক্রিয় কোড ফরম্যাটিং এর পরিবর্তন রয়েছে।
          branch: "chore/auto-lint-fix-${{ github.run_id }}"
          labels: "maintenance, automated"

  dependency-vulnerability-scan:
    needs: setup
    if: github.event.inputs.run_dependency_scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.requirements-cache-key }}
      - name: "⚙️ Install Scanner"
        run: pip install pip-audit
      # (Task 14-b honesty fix) || true সরানো হলো — audit ব্যর্থ হলে job-ও ব্যর্থ হবে
      # (CI-ই authority; masked false-green আর নয়)। pip-audit exit code = ভালনারেবিলিটি থাকলে non-zero।
      - name: "📦 Run Vulnerability Scan (Fast Requirements Audit)"
        working-directory: backend
        run: |
          poetry self add poetry-plugin-export
          poetry export --format requirements.txt --output reqs.txt --without ml
          pip-audit -r reqs.txt --format json > vulnerability-report.json
      - name: "📤 Upload Vulnerability Report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-report
          path: backend/vulnerability-report.json

  generate-codebase-docs:
    name: 📝 Auto-Generate & Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.run_generate_docs == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📄 Generate API Documentation (OpenAPI)
        env:
          PYTHONPATH: backend
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
        run: |
          VENV_PYTHON=$(cd backend && poetry env info --path)/bin/python
          $VENV_PYTHON scripts/generate_openapi.py

      - name: 📦 Commit and Push OpenAPI Spec
        id: push_docs
        run: |
          git config --global user.name "SupremeAI-DocBot"
          git config --global user.email "docbot@supremeai.dev"
          git add -f backend/API-swagger.yaml
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update API-swagger.yaml"
          else
            echo "No API documentation changes detected"
          fi

      # বাংলা (V8): Pydantic → TS/Dart টাইপ অটো-সিঙ্ক — generate_types.py আগে থেকেই
      # ছিল কিন্তু ম্যানুয়াল ছিল; এখন OpenAPI DocBot-এর পাশেই nightly স্বয়ংক্রিয়।
      # backend স্কিমা বদলালে shared-types নিজে নিজে আপডেট — zero-hardcode দর্শন।
      - name: 🧬 Regenerate shared types from Pydantic models
        run: $VENV_PYTHON scripts/generate_types.py

      - name: 📦 Commit and Push shared types
        run: |
          git config user.name "SupremeAI-DocBot"
          git config user.email "docbot@supremeai.dev"
          git add -f packages/shared-types/src/typescript packages/shared-types/src/dart 2>/dev/null || git add -f packages/shared-types/src/typescript
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update shared types (pydantic → ts/dart)"
          else
            echo "No shared-type changes detected"
          fi

      - name: 📦 Setup Node.js and pnpm for Docusaurus
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 🌐 Install Docusaurus Dependencies
        run: pnpm install --frozen-lockfile

      - name: 📚 Build Docusaurus Site
        working-directory: apps/docs
        run: pnpm build

      - name: 🚀 Upload Docusaurus Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/build

      - name: Setup GitHub Pages Environment
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Prepare Pages Content (exclude large files)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/autogen
          find docs/autogen -name "codebase_full.md"

  worker-test:
    name: ⚡ Cloudflare Worker (Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run Cloudflare Worker Tests
        id: worker_tests
        run: pnpm exec vitest run scripts/cloudflare_worker.test.mjs --reporter=json > infrastructure/vitest-report.json

      - name: Add Worker Test Results to GitHub Summary
        if: always()
        run: |
          python .github/scripts/supreme_ci.py generate-report \
            --vitest-json infrastructure/vitest-report.json \
            --label "Cloudflare Worker"

  generate-db-schema:
    name: 📊 Generate DB Schema Diagram
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Graphviz + erdantic
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          poetry run pip install erdantic

      - name: 📊 Generate ERD from Pydantic Models
        working-directory: backend
        # বাংলা মন্তব্য: PYTHONPATH=. সেট করা হলো যাতে erdantic সহজেই backend/models ইমপোর্ট করতে পারে
        env:
          PYTHONPATH: .
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
        run: |
          mkdir -p ../docs/autogen
          if poetry run erdantic models -o ../docs/autogen/db_schema.png || poetry run python -m erdantic models -o ../docs/autogen/db_schema.png; then
            echo "✅ Database schema diagram generated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Database schema diagram could not be generated; the optional report is unavailable." | tee -a "$GITHUB_STEP_SUMMARY"
            # বাংলা মন্তব্য (audit V3, C-V2-03 fix): এই স্টেপটি working-directory: backend
            # নিয়ে চলে, তাই `.github/scripts/...` পাথ কখনোই খুঁজে পেত না — ERD-fail
            # evidence কখনো লেখা হতো না এবং `|| true` ব্যর্থতা চাপা পড়ত। সঠিক relative পাথ।
            python ../.github/scripts/ci_policy.py --name "database-schema-diagram" --exit-code 1 --severity low --category reporting --confidence 0.95 --autofixable --remediation "Fix erdantic model imports or dependency compatibility." || true
          fi

      - name: 📤 Upload Schema Diagram Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-schema-diagram
          path: docs/autogen/db_schema.png

  performance-e2e-test:
    name: 🧪 Human Simulation & Load Tests
    runs-on: ubuntu-latest
    needs: gatekeeper
    # জব হ্যাং হওয়া প্রতিরোধে ২০ মিনিটের টাইমআউট প্রদান করা হয়েছে
    timeout-minutes: 20
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_performance_e2e == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Frontend Build (from latest CI Pipeline run)
        id: download-dist
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: ci.yml
          branch: main
          name: frontend-dist
          path: frontend/dist
        continue-on-error: true

      - name: 🩹 Fallback — Build Frontend Locally (if artifact unavailable)
        if: steps.download-dist.outcome == 'failure'
        run: pnpm --dir frontend run build

      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Start Backend Server
        working-directory: backend
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'CwE60g_bA67m-mock-encryption-key-padded-len=' }}
          SUPREMEAI_API_URL: http://127.0.0.1:8000
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}
        # ইউভিকর্ন সার্ভার লগে রিডাইরেক্ট করে ৬০ সেকেন্ডের টাইমআউট ফেইলসাফ যোগ করা হয়েছে
        run: |
          poetry run uvicorn main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
          echo $! > ../uvicorn.pid
          pnpm exec wait-on http://127.0.0.1:8000/health --timeout 60000 || {
            echo "❌ Backend did not become healthy within 60s — uvicorn log:"
            cat ../uvicorn.log
            exit 1
          }
      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps
      - name: 🩹 Ensure Frontend Build Exists
        # বাংলা মন্তব্য: ফ্রন্টএন্ড বিল্ড ফোল্ডার না থাকলে বিল্ড তৈরি করা এবং প্লেরাইট সার্ভার চালু করার সময় wait-on এর সাথে টাইমআউট ৩০ সেকেন্ড সেট করা হয়েছে।
        run: |
          if [ ! -d "frontend/dist-user" ] && [ ! -d "frontend/dist-admin" ] && [ ! -d "frontend/dist" ]; then
            pnpm --dir frontend run build
          fi

      - name: Start Frontend Preview Server
        run: |
          cd frontend && pnpm exec vite preview --port 5173 &
          pnpm exec wait-on http://127.0.0.1:5173 --timeout 30000
        env:
          CI: true
      - name: Create Report Directory & Execute Playwright Simulation
        run: |
          mkdir -p playwright-report
          pnpm exec playwright test tests/e2e/accessibility.spec.ts tests/e2e/chat.spec.ts
        env:
          CI: true
          SUPREMEAI_API_URL: http://127.0.0.1:8000
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}
      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supremeai-human-test-report
          path: playwright-report/
          retention-days: 7

  ci-failure-smart-summary:
    name: 🧠 Smart CI Failure Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gatekeeper
    if: >
      (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') &&
      (github.event_name == 'schedule' || github.event.inputs.run_ci_failure_summary == 'true')
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 🧠 Run Smart CI Failure Detector
        if: always()
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poetry run python ../.github/scripts/ci_smart_summary.py
      - name: 🚨 Generate Detailed Error Report (Bangla Diagnosis)
        if: always()
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_error_report.py

  outdated-dependency-report:
    name: 📦 Outdated Dependency Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gatekeeper
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_outdated_report == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 📦 Check Outdated Python Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # (Task 14-b) || true সরানো — পরের লাইনের poetry export যেভাবেই fail করত,
          # plugin install ব্যর্থ হলে এখানেই loudly ব্যর্থ হওয়াই সঠিক (report job হলেও)।
          poetry self add poetry-plugin-export
          poetry export --without ml --format requirements.txt --output requirements.txt
          pip install -r requirements.txt
          echo "## 📦 Outdated Python Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pip list --outdated --format=columns 2>/dev/null | tail -n +3 | \
            awk '{printf "| %s | %s | %s |\n", $1, $2, $3}' >> $GITHUB_STEP_SUMMARY || \
            echo "✅ সব Python প্যাকেজ আপ-টু-ডেট!" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Check Outdated Node.js Dependencies
        run: |
          pnpm install --frozen-lockfile
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Outdated Node.js Dependencies" >> $GITHUB_STEP_SUMMARY
          if ! pnpm outdated --recursive >> $GITHUB_STEP_SUMMARY 2>&1; then
            if [ ! -s $GITHUB_STEP_SUMMARY ] || ! grep -q "│" $GITHUB_STEP_SUMMARY; then
              echo "✅ সব Node প্যাকেজ আপ-টু-ডেট!" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  auto-dependency-upgrade:
    name: "📦 Auto Dependency Upgrade (PR)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gatekeeper, outdated-dependency-report]
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_auto_dependency_upgrade == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "🤖 Run Dependency Upgrade Agent"
        id: upgrade_agent
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV: "prod"
        run: |
          python .github/scripts/dependency_upgrader.py > upgrade_summary.md

      - name: "🤖 Create Dependency Upgrade Pull Request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): auto-upgrade non-major dependencies"
          title: "📦 Automated Dependency Upgrade"
          body: "AI Agent দ্বারা এই PR-টি স্বয়ংক্রিয়ভাবে তৈরি হয়েছে।"
          branch: "chore/auto-deps-upgrade-${{ github.run_id }}"
          labels: "dependencies, automated"

  changelog-generator:
    name: 📝 Changelog Generator (Auto PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gatekeeper
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_changelog_generator == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 📝 Generate CHANGELOG.md from Git History
        run: |
          SINCE_DATE=$(date -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -v-30d +%Y-%m-%d)
          echo "# 📋 CHANGELOG" > CHANGELOG_NEW.md
          echo "## 🗓️ Changes since \`${SINCE_DATE}\`" >> CHANGELOG_NEW.md
          if [ -f CHANGELOG.md ]; then cat CHANGELOG.md >> CHANGELOG_NEW.md; fi
          mv CHANGELOG_NEW.md CHANGELOG.md
      - name: 🤖 Create Changelog Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-generate CHANGELOG.md [skip ci]"
          title: "📝 Auto-Generated Changelog Update"
          branch: "chore/auto-changelog-${{ github.run_id }}"
          labels: "documentation, automated, changelog"

  cache-purge:
    name: 🗑️ Purge Redis Cache (Upstash)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gatekeeper
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_cache_purge == 'true'
    steps:
      - name: 🗑️ Flush Upstash Redis Cache
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          curl -s -X POST "$UPSTASH_REDIS_REST_URL/FLUSHDB" -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN"

  api-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
