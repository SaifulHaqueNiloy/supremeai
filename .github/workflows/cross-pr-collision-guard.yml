# ⚠️ DEPRECATED HUSK (epic #1850 Phase E, issue #1857)
# The live pipeline is pr-gate.yml (required-check job names preserved byte-identical).
# This file's triggers are stripped; the dispatch arm is a no-op tombstone. Physical
# deletion batches into the final cleanup phase for founder Tier-3 sign-off —
# `.github/workflows/**` is a protected scope and deletion auto-BLOCKs the gate
# by design (SG-04/SG-09/SG-11, protected-scopes.yml).
name: Cross-PR Collision Guard (Multi-Agent Conflict Prevention)

on:
  # husk: manual dispatch remains as a no-op tombstone (see header)
  workflow_dispatch:

# Workflow-contract requirement (.github/scripts/validate_workflow_contracts.py):
# every non-reusable workflow declares a concurrency group. Per-PR group so a
# new push to the same PR supersedes the previous collision evaluation, and
# manual dispatches of the same PR don't pile up.
concurrency:
  group: cross-pr-collision-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-collisions:
    if: github.event_name == 'husk:disabled'  # DEPRECATED HUSK — see header
    name: Check Cross-PR File Collisions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run Collision Detector
        id: collision_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          echo "🔍 Evaluating Cross-PR file collisions for PR #$PR_NUM (branch: $HEAD_REF)..."

          if [[ "$HEAD_REF" =~ ^(pr-helper-[0-9]+|agent-2(-pr-helper)?)$ ]]; then
            echo "🚂 Merge-train rollup batch on PR-Helper slot detected — intra-batch members are intentionally merged."
            echo '{"has_collision": false, "collisions": []}' > collision_output.json
            echo "### ✅ Merge-Train Batch PR — intra-batch member merges are expected and verified." > collision_report.md
            echo "has_collision=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # AUDIT-FIX (#2002): pass --strict flag so direct file collisions BLOCK the PR.
          python scripts/git/cross_pr_collision_detector.py --pr "$PR_NUM" --format json --strict > collision_output.json 2>&1 || true
          python scripts/git/cross_pr_collision_detector.py --pr "$PR_NUM" --format markdown > collision_report.md 2>/dev/null || true

          # AUDIT-FIX (#2002): check for has_direct_collision (strict mode exit code)
          HAS_DIRECT=$(python -c "import json; d=json.load(open('collision_output.json')); print('true' if d.get('has_direct_collision') or d.get('has_collision') else 'false')" 2>/dev/null || echo "false")
          HAS_COLLISION=$(python -c "import json; d=json.load(open('collision_output.json')); print('true' if d.get('has_collision') else 'false')" 2>/dev/null || echo "false")
          
          echo "has_collision=$HAS_COLLISION" >> "$GITHUB_OUTPUT"
          echo "has_direct_collision=$HAS_DIRECT" >> "$GITHUB_OUTPUT"
          
          echo "================ Collision Summary ================"
          cat collision_report.md
          echo "==================================================="
          
          # AUDIT-FIX (#2002): strict mode — direct collisions exit 1 (block PR)
          if [ "$HAS_DIRECT" = "true" ]; then
            echo "::error::Direct file collision detected with another open PR. PR is BLOCKED (Rule: cross-pr-collision strict mode, #2002)."
            echo "has_collision=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Update PR Status and Comments
        if: always() && steps.collision_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HAS_COLLISION: ${{ steps.collision_check.outputs.has_collision }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMENT_TAG="<!-- SUPREMEAI_COLLISION_GUARD -->"
          REPORT_BODY=$(cat collision_report.md)
          COMMENT_CONTENT="${COMMENT_TAG}\n${REPORT_BODY}"

          # Find existing collision guard comment if present
          EXISTING_COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUM/comments" --jq ".[] | select(.body | contains(\"$COMMENT_TAG\")) | .id" | head -n 1 || true)

          if [ "$HAS_COLLISION" = "true" ]; then
            echo "⚠️ Collision detected! Adding 'collision:warning' label..."
            gh pr edit "$PR_NUM" --add-label "collision:warning" || true
            gh pr edit "$PR_NUM" --add-label "collision:blocked" 2>/dev/null || true

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              echo "Updating existing comment $EXISTING_COMMENT_ID..."
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$EXISTING_COMMENT_ID" -f body="$COMMENT_CONTENT" || true
            else
              echo "Posting new collision warning comment..."
              gh pr comment "$PR_NUM" --body "$COMMENT_CONTENT" || true
            fi
          else
            echo "✅ No collision detected. Removing 'collision:warning' label if present..."
            gh pr edit "$PR_NUM" --remove-label "collision:warning" 2>/dev/null || true

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              echo "Updating existing comment to clean status..."
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$EXISTING_COMMENT_ID" -f body="$COMMENT_CONTENT" || true
            fi
          fi
