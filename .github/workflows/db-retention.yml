# Daily DB retention — bounds unbounded growth on the free-tier Supabase project.
#
# WHY: evolution_logs grew to 258K rows (~87% of the DB, ~600-800 rows/hour)
# with no retention policy (audit finding 2-c, 2026-09-02). The
# prune_evolution_logs(retention_days) SQL function (created by the master
# audit migration) deletes rows older than the retention window and returns
# the number of deleted rows.
#
# Auth: uses the encrypted SUPABASE_ACCESS_TOKEN repo secret (Supabase
# Management API personal access token). Secrets never appear in logs.

name: DB Retention Prune

on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Days of evolution_logs to keep"
        required: false
        default: "30"

concurrency:
  group: db-retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prune evolution_logs older than retention window
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: xtvkltzmberxekoamala
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}
        run: |
          set -euo pipefail
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] || { echo "retention_days must be a positive integer" >&2; exit 2; }
          (( RETENTION_DAYS >= 7 && RETENTION_DAYS <= 3650 )) || { echo "retention_days must be between 7 and 3650" >&2; exit 2; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "SUPABASE_ACCESS_TOKEN is required" >&2; exit 2; }
          body=$(printf '{"query":"SELECT public.prune_evolution_logs(%s::integer) AS deleted"}' "$RETENTION_DAYS")
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_code=$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" --connect-timeout 10 --max-time 120 \
            -o "$response_file" -w '%{http_code}')
          [[ "$http_code" == "200" ]] || { echo "Retention API returned HTTP $http_code" >&2; exit 1; }
          python - "$response_file" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          print("retention prune completed; deleted=", payload.get("result", payload.get("data", "redacted")))
          PY
          echo "${resp}" | grep -q '"deleted"' || {
            echo "::warning::prune response did not contain deleted count"; exit 1; }

      - name: Prune learning store tables (Sprint 2 learning_store.sql)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: xtvkltzmberxekoamala
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}
        run: |
          # prune_learning_data(retention_days) — created by
          # audit/migrations_out/learning_store.sql — prunes learning_events,
          # task_outcomes, feedback_events, fitness_snapshots, improvement_runs,
          # provider_metrics and skill_metrics (improvement_proposals and
          # prompt_candidates are kept). NOTE: if this function has not yet been
          # applied to prod (manual step: scripts/apply_sql.py pattern), this
          # step fails; that is intentional so the gap is visible.
          body=$(printf '{"query":"SELECT public.prune_learning_data(%s::integer) AS deleted"}' "$RETENTION_DAYS")
          resp=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" --max-time 120)
          echo "prune_learning_data result: ${resp}"
          echo "${resp}" | grep -q '"deleted"' || {
            echo "::warning::prune_learning_data response did not contain deleted count (is learning_store.sql applied?)"; exit 1; }
