name: 'Setup Node & PNPM'
description: 'Standardized Node.js and PNPM setup with frozen cache'
inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  pnpm-version:
    description: 'PNPM version'
    required: false
    default: '10.15.0'
  working-directory:
    description: 'Directory containing package.json / pnpm-lock.yaml'
    required: false
    default: '.'
  install-deps:
    description: 'Whether to run pnpm install'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup PNPM
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        # The monorepo has one lockfile at the repository root; frontend has no local lockfile.
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
