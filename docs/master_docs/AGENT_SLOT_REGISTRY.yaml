# ── Branch Slot Acquisition (15-minute activity rule — founder directive, issue #1439) ──
# Algorithm (CAS, race-safe; CLI: scripts/git/acquire_lane_slot.sh — issue tracked in #1439):
#   for n in 1..100:
#     if branch <pool>-n does not exist:
#         atomic create from origin/main HEAD (POST /git/refs; 422 = raced → next n)
#     elif last_commit_age(<pool>-n) <= 15 min:   # ACTIVE → skip
#         continue
#     else:                                       # STALE → reuse via fast-forward claim push
#         push '[slot-claim] pool=<P> agent=<id> ts=<ISO>' (non-FF = raced → next n)
#         reset branch to origin/main (--force-with-lease) → clean slate
#   Activity = latest commit timestamp on the branch (every push = heartbeat).
#   Lifecycle: FREE --create--> ACTIVE --idle>15min--> STALE --CAS claim--> ACTIVE(reset)
acquisition_rules:
  staleness_window_minutes: 15
  numeric_bound: 100
  claim_commit_format: '[slot-claim] pool=<pool> agent=<agent_id> ts=<ISO8601>'
  reuse_protocol: 'reset to origin/main with --force-with-lease after winning CAS claim'
  new_branch_only_if: 'all existing <pool>-{N} branches have commits within the last 15 minutes (name same, number +1)'
  same_app_same_rules_per_pool: true

