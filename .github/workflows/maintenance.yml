          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}
          CI: "true"
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
        run: poetry run python ../scripts/generate_api_health_report.py >> $GITHUB_STEP_SUMMARY

  infisical-vault-synthetic-check:
    name: "🔐 Infisical RAW vault contract check (#434 weekly)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Assert raw-path vault contract (login, ≥100 raw secrets, boot keys)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: python scripts/maintenance/check_infisical_vault_synth.py
        # বাংলা: raw-path ভাঙলে এই জব লাল — Sep-14 ধরনের crash-loop-এর আগেই সতর্ক (#434)।

  mlops-nightly-eval:
    name: 🧠 MLOps Nightly Evolution & Governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event.inputs.run_mlops_nightly_eval == 'true'
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run MLOps Nightly Suite
        working-directory: backend
        run: |
          mkdir -p ../reports
          poetry run python ../scripts/ai/model_drift_detector.py --model-id supremeai_core_model --export-promql ../reports/model_drift.prom
          poetry run python ../scripts/ai/bias_detector.py --report-json ../reports/bias_nightly.json
          poetry run python ../scripts/ai/prompt_injection_tester.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV: "prod"

          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}

  # (Task 14-b) vulnerability-scan job (VulnerabilityProphet) মুছে ফেলা হলো — false-green
  # by construction: analyze_project() findings শুধু in-memory list হিসেবে return করত যেটা
  # workflow discard করত (কোনো report file/artifact/exit-signal নেই) → বাস্তব ভালনারেবিলিটি
  # পেলেও job সবসময় green। Real gating scanner রয়েই গেছে: ci.yml Trivy + security_gate.py
  # (blocking) এবং নিচের dependency-vulnerability-scan (pip-audit, || true ছাড়া)।

  # =========================================================================
