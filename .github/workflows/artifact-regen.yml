# =============================================================================
# Artifact Regen — post-merge race control v2 (issue #1004)
# =============================================================================
# বাংলা: Parallel agent session একসাথে merge করলে drift artifacts
# (route inventories, capability matrix, dependency graph) বারবার stale হয়ে
# main RED হত — "artifacts whack-a-mole"। এই workflow সেই race শেষ করে:
#
# 1. SERIALIZATION: `concurrency.group: artifact-regen` +
#    `cancel-in-progress: false` → দ্রুত পরপর merge হলেও regen গুলো সারিবদ্ধভাবে
#    চলে; প্রতিটি run সর্বশেষ main দেখে regen করে।
# 2. SELF-HEALING v2 (GH006-সচেতন): main branch-protected — GITHUB_TOKEN দিয়ে
#    direct push নিষিদ্ধ। তাই bot আগে direct push চেষ্টা করে (unprotected হলে
#    তাৎক্ষণিক heal), ব্যর্থ হলে **self-heal PR** খোলে (chore/artifact-regen-*)
#    এবং auto-merge enable করার চেষ্টা করে।
# 3. HONESTY BOUNDARY: STATUS.md দাবি (human-owned) bot কখনো রিওয়াইট করে না;
#    claim drift হলে warning annotation দেয় (regen_all_artifacts.sh exit 2)।
#
# Recursion-proof:
#   - GITHUB_TOKEN push কোনো workflow trigger করে না (GitHub semantics)
#   - এছাড়া paths-ignore generated artifacts + এই ফাইলকেই skip করে
#
# Generators নিজেরা stdlib-only, তবে regen চেইনের গেট
# scripts/ci/circle_architecture_gate.py (architecture_check.py থেকে ডাকা)
# architecture-rules.yml পড়তে PyYAML ব্যবহার করে (lazy import, fail-closed) —
# তাই নিচে Setup Python-এর পরে pyyaml install বাধ্যতামূলক (issue #1203:
# runner-এ `No module named 'yaml'` → বট মরে যাওয়ায় main drift unhealed)।
# =============================================================================
name: Artifact Regen (post-merge race control)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/generated/**"
      - "docs/audit_reports/route_client_inventory.json"
      - "docs/audit_reports/route_client_inventory.md"
      - ".github/workflows/artifact-regen.yml"

# Race control core: rapid parallel merges → serialized regen runs,
# প্রতিটি queued run সর্বশেষ main-এর বিরুদ্ধে fresh regen করে।
concurrency:
  group: artifact-regen
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    name: Regen drift artifacts & self-heal main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (full history for safe rebase retry)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        # issue #1203: circle_architecture_gate.load_forbidden_rules() PyYAML
        # ছাড়া চলে না (ci-advanced-checks.yml একই জন্য pyyaml install করে)।
        run: |
          python -m pip install --upgrade pip
          pip install --quiet pyyaml

      - name: Run canonical regeneration
        id: regen
        # NOTE (Guardian-Lite SG-04): errexit-disable pattern নিষিদ্ধ — এর বদলে
        # tee-র কারণে pipeline exit = tee (সবসময় 0) → `bash -e`-এও থামে না,
        # আর PIPESTATUS[0] থেকে regen script-এর আসল rc পাওয়া যায়।
        # exit 2 = STATUS.md claim drift (mechanical artifacts তবুও লেখা হয়েছে)
        # → job থামবে না; নিচে warning annotation হবে।
        run: |
          bash scripts/ci/regen_all_artifacts.sh | tee regen_output.log
          rc=${PIPESTATUS[0]}
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          # শুধুমাত্র non-empty CHANGED ধরা হয় — no-drift ক্ষেত্রে CHANGED= (খালি)
          # থাকে; \S guard ছাড়া human-readable suffix ক্যাপচার হয়ে যায় (bug)।
          changed=$(grep -oP '^CHANGED=\K\S.*' regen_output.log | tail -1 || true)
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [[ $rc -eq 1 || $rc -eq 3 ]]; then
            echo "::error::Regeneration failed (rc=${rc}) — generator/validator broke; see log above"
            exit 1
          fi
          exit 0

      - name: Claim-drift warning (STATUS.md is human-owned)
        if: steps.regen.outputs.rc == '2'
        run: |
          echo "::warning::STATUS.md claim drift — mechanical artifacts self-healed, but STATUS.md দাবি মানুষের ঠিক করতে হবে (bot কখনো দাবি রিওয়াইট করে না)।"
          echo "### ⚠️ STATUS.md claim drift" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mechanical artifacts regenerated; STATUS.md claims (machine-checkable) no longer match tree reality. Human correction required — bot never rewrites claims (issue #1004 honesty boundary)." >> "$GITHUB_STEP_SUMMARY"

      - name: Self-heal main (direct push, then PR fallback on GH006)
        if: steps.regen.outputs.changed != ''
        env:
          TRIGGER_SHA: ${{ github.sha }}
          # Issue #1478 / #1629 — Use SELF_HEAL_PAT (maintainer PAT) so that:
          #   1. Self-heal branch pushes trigger CI (GITHUB_TOKEN pushes never
          #      trigger workflows — GitHub anti-recursion rule).
          #   2. Commits/PRs appear as supremeai-pr-helper[bot] (agent-2 lane)
          #      rather than the generic github-actions[bot].
          #   3. PR CI checks run and green-light the merge automatically.
          # Recursion stays impossible: paths-ignore covers generated artifacts
          # + this file; regen is deterministic (2nd run: CHANGED empty).
          # Fallback to github.token keeps workflow functional when secret unset.
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
        run: |
          # bash -e চলে; প্রতিটি ব্যর্থতা স্পষ্টভাবে হ্যান্ডল করা হয়
          # Bot identity: supremeai-pr-helper[bot] (agent-2 lane, AGENT_SLOT_REGISTRY)
          git config user.name "supremeai-pr-helper[bot]"
          git config user.email "supremeai-pr-helper[bot]@users.noreply.github.com"

          changed="${{ steps.regen.outputs.changed }}"
          echo "Self-healing artifacts: ${changed}"

          added=0
          for art in ${changed}; do
            git add -- "${art}"
            added=1
          done
          if [[ ${added} -eq 0 ]]; then
            echo "No artifact changes to commit (race won by another run) — done."
            exit 0
          fi

          heal_branch="chore/artifact-regen-latest"

          pr_fallback() {
            echo "Direct push to main rejected (protected branch) — updating single persistent self-heal PR..."
            if ! git push origin "HEAD:${heal_branch}" --force; then
              echo "::error::Could not push heal branch ${heal_branch} — manual intervention needed"
              exit 1
            fi

            existing_pr=$(gh pr list --head "${heal_branch}" --state open --json number -q '.[0].number' 2>/dev/null || true)
            if [[ -n "${existing_pr}" && "${existing_pr}" != "null" ]]; then
              echo "Existing self-heal PR #${existing_pr} found. Updating it with latest artifacts..."
              gh pr edit "${existing_pr}" \
                --title "chore(artifacts): post-merge auto-regen self-heal (latest)" \
                --body "Mechanical drift artifacts regenerated by **supremeai-pr-helper[bot]** (agent-2 lane, issue #1004). Canonical script: \`scripts/ci/regen_all_artifacts.sh\` (latest trigger \`${TRIGGER_SHA:0:7}\`). Merge to restore byte-fresh main." || true
              gh pr edit "${existing_pr}" --add-label "ci" --add-label "maintenance" 2>/dev/null || true
              echo "pr_url=https://github.com/${GITHUB_REPOSITORY}/pull/${existing_pr}" >> "$GITHUB_STEP_SUMMARY_FILE" 2>/dev/null || true
            else
              # Close any leftover legacy chore/artifact-regen-* PRs to prevent clutter
              legacy_prs=$(gh pr list --state open --search "chore(artifacts): post-merge auto-regen" --json number -q '.[].number' 2>/dev/null || true)
              for old_pr in ${legacy_prs}; do
                echo "Closing stale legacy artifact PR #${old_pr}..."
                gh pr close "${old_pr}" --comment "Superseded by single persistent self-heal PR on ${heal_branch}." || true
              done

              pr_url=$(gh pr create \
                --base main \
                --head "${heal_branch}" \
                --title "chore(artifacts): post-merge auto-regen self-heal (latest)" \
                --label "ci" \
                --label "maintenance" \
                --body "Mechanical drift artifacts regenerated by **supremeai-pr-helper[bot]** (agent-2 lane, issue #1004). Canonical script: \`scripts/ci/regen_all_artifacts.sh\` (latest trigger \`${TRIGGER_SHA:0:7}\`). Merge to restore byte-fresh main.")
              echo "Self-heal PR: ${pr_url}"
              echo "pr_url=${pr_url}" >> "$GITHUB_STEP_SUMMARY_FILE" 2>/dev/null || true
            fi
          }

          ok=0
          for attempt in 1 2; do
            if ! git commit -m "chore(artifacts): post-merge auto-regen (trigger ${TRIGGER_SHA:0:7})

            Canonical regen via scripts/ci/regen_all_artifacts.sh —
            serialized by artifact-regen.yml concurrency group (issue #1004)."; then
              echo "Nothing to commit (another run won the race) — done."
              exit 0
            fi

            push_out=$(git push origin HEAD:main 2>&1) && { echo "Direct push OK (attempt ${attempt})"; ok=1; break; }
            echo "${push_out}"

            if echo "${push_out}" | grep -qiE "GH006|protected branch|pull request"; then
              pr_fallback
              ok=1
              break
            fi

            echo "Transient push conflict (attempt ${attempt}) — moving to latest main and re-regenerating..."
            git fetch origin main
            git reset --hard FETCH_HEAD
            bash scripts/ci/regen_all_artifacts.sh || true
            changed_new=$(git diff --name-only -- docs/generated docs/audit_reports | tr '\n' ' ')
            if [[ -z "${changed_new// }" ]]; then
              echo "After reset, artifacts already fresh (upstream merge included its own regen) — done."
              exit 0
            fi
            git add -- docs/generated docs/audit_reports
          done

          if [[ ${ok} -ne 1 ]]; then
            pr_fallback || {
              echo "::error::Could not complete self-heal after retries — open a manual fix PR"
              exit 1
            }
          fi

      - name: Job summary
        if: always()
        run: |
          pr_note=""
          if [[ -f pr_url.txt ]]; then
            pr_note=$(cat pr_url.txt)
          fi
          {
            echo "### Artifact regen (race control) — issue #1004"
            echo ""
            if [[ -n "$pr_note" ]]; then
              echo "**Self-heal PR opened (main is protected):** ${pr_note}"
            elif [[ -n "${{ steps.regen.outputs.changed }}" ]]; then
              echo "**Self-healed artifacts (direct push):**"
              echo '```'
              echo "${{ steps.regen.outputs.changed }}" | tr ' ' '\n'
              echo '```'
            else
              echo "✅ No drift — all artifacts byte-fresh (no-op run)."
            fi
            echo ""
            echo "Serialized by \`concurrency.group: artifact-regen\` — parallel merges can no longer invalidate each other's regen."
          } >> "$GITHUB_STEP_SUMMARY"
