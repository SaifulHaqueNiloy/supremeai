name: 'Render Deploy Status (trigger + wait)'
description: >-
  Trigger a Render deployment and poll it to a terminal state
  (live / build_failed / deactivated) — replaces the fire-and-forget trigger
  that required the retired */5 deploy-doctor poller (epic #1850 Phase C, #1855).
inputs:
  service-name:
    description: 'Human readable name of service (Core, Worker, Scraper, MCP)'
    required: true
  api-key:
    description: 'Render API Key'
    required: true
  service-id:
    description: 'Render Service ID'
    required: true
  service-url:
    description: 'Optional live URL of the service for reporting'
    required: false
    default: ''
  wait-timeout-seconds:
    description: 'Max seconds to poll for a terminal deploy state (default 660 = 11 min, fits the 15-min job budget)'
    required: false
    default: '660'
runs:
  using: 'composite'
  steps:
    - name: Trigger Render Deploy & wait for terminal state
      shell: bash
      env:
        RENDER_API_KEY: ${{ inputs.api-key }}
        RENDER_SVC_ID: ${{ inputs.service-id }}
        RENDER_WAIT: '1'
        RENDER_WAIT_TIMEOUT_SECONDS: ${{ inputs.wait-timeout-seconds }}
      run: python scripts/ci/render_trigger_deploy.py

    - name: Add deployment URL to summary
      shell: bash
      env:
        SVC_NAME: ${{ inputs.service-name }}
        SVC_URL: ${{ inputs.service-url }}
      run: |
        echo "### 🚀 ${SVC_NAME} Deployed (terminal state reached)" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$SVC_URL" ]; then
          echo "URL: [$SVC_URL]($SVC_URL)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "URL: Service URL secret not set — deploy triggered, check Render dashboard." >> "$GITHUB_STEP_SUMMARY"
        fi
