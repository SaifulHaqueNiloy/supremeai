# QA Engine — E2E Admin suite (Part 7.3 of the QA engine plan, adapted)
# Deprecated: consolidated into e2e-suites.yml (Wave 3.5).
# Retained as a delegation wrapper for Preservation Guard compliance.
name: QA — E2E Admin Suite (Deprecated Shim)

on:
  workflow_call:
    inputs:
      base_url:
        description: 'App under test (defaults to QA_BASE_URL env or local vite preview)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      base_url:
        description: 'App under test (defaults to QA_BASE_URL env or local vite preview)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: supremeai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-admin-suite:
    name: 🎭 Admin Suite
    uses: ./.github/workflows/reusable-e2e-runner.yml
    with:
      project: admin
      base_url: ${{ inputs.base_url }}
    secrets: inherit
