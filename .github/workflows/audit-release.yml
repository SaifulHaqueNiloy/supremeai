name: Audit & Official Release Center

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 3 * * *'  # Deep audit (nightly)
    - cron: '0 3 * * 1'  # Self audit (weekly)
    - cron: '0 4 * * 1'  # Silent error scan (weekly)
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Fail the deep audit pipeline if any critical issues are found'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      run_deploy:
        description: 'Trigger Render Deploy (Scraper)'
        type: boolean
        default: false
      publish_release:
        description: 'Publish to GitHub Releases?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FLUTTER_VERSION: '3.29.0'

jobs:
  # =========================================================================
  # DEEP AUDIT (Nightly & Manual)
  # =========================================================================
  comprehensive-audit:
    name: 🛡️ Deep Audit Pipeline
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astroid loguru requests httpx

      # --- 1. CORE QUALITY & REGRESSIONS ---
      - name: Run Core Regression Scanner (Learned Bugs)
        run: |
          echo "Running regression_scanner.py..."
          python3 scripts/quality/regression_scanner.py --path backend --json regression_report.json --fail-on critical,high || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: Run Generic Audit Scan (Anti-patterns)
        run: |
          echo "Running self_audit_scan.py..."
          python3 scripts/quality/self_audit_scan.py --path backend || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: Check Docs Drift
        run: |
          echo "Running docs_drift_check.py..."
          python3 scripts/quality/docs_drift_check.py --path . || true

      - name: Suggest Code Refactoring
        run: |
          echo "Running auto_refactor_suggester.py..."
          python3 scripts/quality/auto_refactor_suggester.py || true

      # --- 2. SECURITY & VULNERABILITIES ---
      - name: Run Security Guard Scan
        run: |
          echo "Running safety_guard.py..."
          python3 scripts/safety_guard.py || true

      - name: Auto Vulnerability Scanner
        run: |
          echo "Running auto_vulnerability_scanner.py..."
          python3 scripts/security/auto_vulnerability_scanner.py || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: Check Dependencies Vulnerabilities
        run: |
          echo "Running check_dependencies.py..."
          python3 scripts/security/check_dependencies.py || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: DevOps Security Scan
        run: |
          echo "Running devops_security_scan.py..."
          python3 scripts/devops/devops_security_scan.py || true

      # --- 3. MAINTENANCE & CODE HEALTH ---
      - name: Find Dead Code
        run: |
          echo "Running find_dead_code.py..."
          python3 scripts/security/find_dead_code.py || true

      - name: Validate Router Imports
        run: |
          echo "Running validate_router_imports.py..."
          python3 scripts/ci/validate_router_imports.py || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: Check Backend Blocking Requests
        run: |
          echo "Running check_no_requests_in_backend.sh..."
          bash scripts/check_no_requests_in_backend.sh || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      # --- 4. API CONTRACT & LIMITS ---
      - name: Verify API Contract
        run: |
          echo "Running verify_api_contract.py..."
          python3 scripts/ci/verify_api_contract.py || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: 🧠 Check Free-Tier Limits & Runtime Memory Guard
        run: |
          echo "Running check_free_tier_limits.py (enforced)..."
          python3 scripts/ci/check_free_tier_limits.py

      - name: 🧹 Auto-Fix Caches & Artifacts (Nightly Cleanup)
        if: always()
        continue-on-error: true
        run: |
          echo "Running intelligent auto-fix cleanup..."
          python3 scripts/ci/check_free_tier_limits.py --auto-fix

      # --- 5. ADVANCED DEEP AUDIT ---
      - name: Find Orphan Routes & Dead API Calls
        run: |
          echo "Running orphan_route_finder.py..."
          python3 scripts/advanced_analysis/orphan_route_finder.py || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: Map Circular Imports
        run: |
          echo "Running circular_import_mapper.py..."
          python3 scripts/advanced_analysis/circular_import_mapper.py || true
        continue-on-error: ${{ inputs.force_fail == 'false' }}

      - name: Detect Duplicate Logic
        run: |
          echo "Running duplicate_logic_detector.py..."
          python3 scripts/advanced_analysis/duplicate_logic_detector.py || true

      - name: Map Test Coverage Gaps
        run: |
          echo "Running test_coverage_gap_mapper.py..."
          python3 scripts/advanced_analysis/test_coverage_gap_mapper.py || true

      - name: Project LLM Costs
        run: |
          echo "Running llm_cost_projector.py..."
          python3 scripts/advanced_analysis/llm_cost_projector.py || true

      - name: Remind Secret Rotations
        run: |
          echo "Running secret_rotation_reminder.py..."
          python3 scripts/advanced_analysis/secret_rotation_reminder.py || true

      - name: Check Dependency Freshness
        run: |
          echo "Running dependency_freshness_radar.py..."
          python3 scripts/advanced_analysis/dependency_freshness_radar.py || true

      - name: Enforce Single Source Config (No Hardcoding)
        run: |
          echo "Running config_single_source_enforcer.py..."
          python3 scripts/advanced_analysis/config_single_source_enforcer.py --output-format markdown > HARDCODED_AUDIT.md || true

      - name: Check Bengali i18n Completeness
        run: |
          echo "Running bengali_i18n_completeness_checker.py..."
          python3 scripts/advanced_analysis/bengali_i18n_completeness_checker.py || true

      - name: Upload Comprehensive Audit Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supreme-deep-audit-reports
          path: |
            regression_report.json
            *.log
            *.md
          retention-days: 14

  # =========================================================================
  # SELF AUDIT SCAN (Weekly & PR)
  # =========================================================================
  self-audit:
    name: 🔍 Weekly Self-Audit Scan
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'promotion/staging') && (github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1'))"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run offline self-audit scan
        run: |
          python3 scripts/quality/self_audit_scan.py \
            --path . \
            --json self_audit_report.json \
            --fail-on-syntax-error

  # =========================================================================
  # SILENT ERROR SCAN (Weekly & PR)
  # =========================================================================
  silent-error-scan:
    name: 🤫 Silent Error Scan
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'promotion/staging') && (github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1'))"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run silent error detector (regression gate)
        run: |
          python3 scripts/detect_silent_errors.py \
            --scan-dirs backend frontend/src apps packages shared tools config configs scripts migrations \
            --baseline scripts/silent_errors_baseline.json \
            --fail-on high \
            --json silent_errors_report.json \
            --markdown silent_errors_summary.md
      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silent-errors-report
          path: |
            silent_errors_report.json
            silent_errors_summary.md
          if-no-files-found: ignore

  # =========================================================================
  # SCRAPER CI & HEALTH CHECK
  # =========================================================================
  scraper-ci:
    name: 🕷️ Scraper Service Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend/services/scraper
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Lint & Type Check
        run: |
          pip install ruff==0.16.4 mypy==1.11.0
          ruff check backend/services/scraper/
          mypy backend/services/scraper/ --ignore-missing-imports
      - name: Run tests
        run: |
          pip install pytest==8.0.2 pytest-asyncio==0.23.5
          cd backend/services/scraper
          pytest tests/ -q
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend/services/scraper
          push: true
          tags: |
            ghcr.io/saifulhaqueniloy/supremeai-scraper:latest
            ghcr.io/saifulhaqueniloy/supremeai-scraper:${{ github.sha }}
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SCRAPER_SVC_ID: ${{ secrets.RENDER_SCRAPER_SVC_ID }}
        run: |
          python -c "
          import urllib.request, json, os
          svc_id = os.environ.get('RENDER_SCRAPER_SVC_ID', '')
          if not svc_id:
              print('Skipping Render deploy — service ID not set')
          else:
              req = urllib.request.Request(
                  f'https://api.render.com/v1/services/{svc_id}/deploys',
                  headers={'Authorization': f'Bearer {os.environ[\"RENDER_API_KEY\"]}'},
                  method='POST'
              )
              with urllib.request.urlopen(req) as r:
                  print('Deploy triggered:', r.read().decode())
          "

  health-check:
    name: 🩺 Scraper Service Health Check
    needs: scraper-ci
    runs-on: ubuntu-latest
    if: always() && !contains(needs.scraper-ci.result, 'failure') && github.event_name == 'workflow_dispatch'
    steps:
      - name: Wait for deploy
        run: sleep 60
      - name: Probe scraper health
        run: |
          curl --retry 8 --retry-delay 5 --retry-connrefused -f \
            --max-time 10 \
            https://supremeai-scraper-6nwi.onrender.com/health || exit 1
      - name: Probe real Chromium launch (browse)
        run: |
          RESP=$(curl -sS -m 120 -X POST \
            https://supremeai-scraper-6nwi.onrender.com/browse \
            -H "Content-Type: application/json" \
            -d '{"url":"https://example.com","action":"fetch"}')
          echo "browse response: $RESP"
          case "$RESP" in
            *"\"success\":true"*) echo "PASS: chromium launched and scraped" ;;
            *) echo "FAIL: chromium launch did not succeed after deploy"; exit 1 ;;
          esac

  # =========================================================================
  # RELEASE BUILDS
  # =========================================================================
  build-artifacts:
    name: 🏗️ Build ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'APK'
            os: ubuntu-latest
          - target: 'VSIX'
            os: ubuntu-latest
          - target: 'EXE'
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ----------------------------------------------------
      # 📱 1. FLUTTER APK BUILD (Android Arm64)
      # ----------------------------------------------------
      - name: Setup Java
        if: matrix.target == 'APK'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        if: matrix.target == 'APK'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build APK (Arm64 for Latest Devices)
        if: matrix.target == 'APK'
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
      - name: Upload APK Artifact
        if: matrix.target == 'APK'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supremeai-mobile-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      # ----------------------------------------------------
      # 🧩 2. VS CODE EXTENSION BUILD (VSIX)
      # ----------------------------------------------------
      - name: Setup pnpm
        if: matrix.target == 'VSIX'
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 9.0.0
      - name: Setup Node caching
        if: matrix.target == 'VSIX'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Build VSIX
        if: matrix.target == 'VSIX'
        working-directory: tools/vscode-extension
        run: |
          pnpm install --frozen-lockfile
          npx @vscode/vsce package --no-dependencies
      - name: Upload VSIX Artifact
        if: matrix.target == 'VSIX'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supremeai-vscode-vsix
          path: tools/vscode-extension/*.vsix
          retention-days: 7

      # ----------------------------------------------------
      # 💻 3. NATIVE DESKTOP BUILD (Tauri EXE)
      # ----------------------------------------------------
      - name: Setup Node for Desktop
        if: matrix.target == 'EXE'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm for Desktop
        if: matrix.target == 'EXE'
        run: npm install -g pnpm@9.0.0
      - name: Setup Rust
        if: matrix.target == 'EXE'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build Desktop EXE
        if: matrix.target == 'EXE'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run tauri build
      - name: Upload EXE Artifact
        if: matrix.target == 'EXE'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supremeai-desktop-exe
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  # ----------------------------------------------------
  # 🚀 CREATE GITHUB RELEASE
  # ----------------------------------------------------
  create-release:
    name: 🎉 Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v-manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          files: release-artifacts/**/*
          generate_release_notes: true
