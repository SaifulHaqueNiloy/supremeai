# ==============================================================================
# _final-summary.yml — Final CI Summary Aggregator
# ==============================================================================
# Called via workflow_call from the orchestrator.
# Aggregates all stage outcomes into a single summary.
# ==============================================================================

name: 📋 Final CI Summary

on:
  workflow_call:
    inputs:
      preflight_status:
        description: 'Preflight status'
        type: string
        required: false
        default: 'skipped'
      security_status:
        description: 'Security status'
        type: string
        required: false
        default: 'skipped'
      backend_test_status:
        description: 'Backend test status'
        type: string
        required: false
        default: 'skipped'
      frontend_test_status:
        description: 'Frontend test status'
        type: string
        required: false
        default: 'skipped'
      production_readiness_status:
        description: 'Production readiness status'
        type: string
        required: false
        default: 'skipped'
      build_status:
        description: 'Build status'
        type: string
        required: false
        default: 'skipped'
      deploy_status:
        description: 'Deploy status'
        type: string
        required: false
        default: 'skipped'
      verify_status:
        description: 'Verify status'
        type: string
        required: false
        default: 'skipped'

jobs:
  final-summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate Final Summary
        run: |
          echo "══════════════════════════════════════" >> $GITHUB_STEP_SUMMARY
          echo "       SUPREMEAI CORE CI SUMMARY      " >> $GITHUB_STEP_SUMMARY
          echo "══════════════════════════════════════" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A STAGES
          STAGES["Preflight"]="${{ inputs.preflight_status }}"
          STAGES["Security"]="${{ inputs.security_status }}"
          STAGES["Backend Test"]="${{ inputs.backend_test_status }}"
          STAGES["Frontend Test"]="${{ inputs.frontend_test_status }}"
          STAGES["Production Readiness"]="${{ inputs.production_readiness_status }}"
          STAGES["Build"]="${{ inputs.build_status }}"
          STAGES["Deploy"]="${{ inputs.deploy_status }}"
          STAGES["Verify"]="${{ inputs.verify_status }}"

          ALL_GREEN=true
          for STAGE in "${!STAGES[@]}"; do
            STATUS="${STAGES[$STAGE]}"
            if [ "$STATUS" = "success" ]; then
              echo "| $STAGE | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            elif [ "$STATUS" = "skipped" ]; then
              echo "| $STAGE | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $STAGE | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
              ALL_GREEN=false
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "══════════════════════════════════════" >> $GITHUB_STEP_SUMMARY
          if [ "$ALL_GREEN" = true ]; then
            echo "FINAL: 🟢 GREEN" >> $GITHUB_STEP_SUMMARY
          else
            echo "FINAL: 🔴 RED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "══════════════════════════════════════" >> $GITHUB_STEP_SUMMARY