# Issue Ops — issue-domain automation console (epic #1850 Phase A / W6, issue #2071)
# ============================================================================================
# FLIPPED LIVE (epic #1850 Phase F / #1858): this file now owns the issue-event hot
# path (issues + 6h drift sweep + dispatch console) — the retired priority-queue.yml
# and issue-labeler.yml are deleted in this same change, so a single revert restores
# everything. Ledger invariants (find-by-marker, oldest-wins, promotion comment,
# case-insensitive state) live in scripts/agents/priority_queue_ledger.py — unchanged.
#
# Fidelity contract (verified against priority-queue.yml + issue-labeler.yml, 2026-09-27):
#   - `refresh-ledger` job = verbatim steps of priority-queue.yml's `refresh-ledger`
#     (re-rank + dry-run smoke that guards the body/marker contract);
#   - ledger invariants preserved by the script itself: find-by-marker
#     `<!-- SUPREMEAI_PRIORITY_QUEUE_LEDGER v1 -->`, oldest-wins, promotion comment
#     only when the previous #1 closed, case-insensitive state compare;
#   - `labeler` job = verbatim github-script of issue-labeler.yml (label | comment |
#     close | reopen), inputs namespaced `labeler_*` to avoid colliding with the
#     top-level `action` selector;
#   - concurrency: separate group names from the live legacy workflows so a shadow
#     dispatch can never cancel a live event-driven re-rank (the flip PR will unify
#     them).
#
# STORM FIX (#2425, 2026-09-28): ২টি ইস্যু তৈরিতে ৪ মিনিটে ১৩টি রান — কারণ প্রতিটি
# labeled/unlabeled ইভেন্ট (groq, cerebras, error-1010, platform-sweep...) পুরো
# re-rank স্পন করত এবং cancel-in-progress আগের রানকে ১-২ সেকেন্ডে বাতিল করত।
# দুই স্তরের প্রতিকার:
#   (১) Event filter — শুধু queue-প্রাসঙ্গিক ইভেন্টে re-rank: opened/closed/reopened +
#       priority লেবেল (P0-critical/P1-high/P2-medium/P3-low — RANK ladder,
#       priority_queue_ledger.py) + claim-state লেবেল (status:unclaimed/
#       status:in-progress/status:planned — fetch_unclaimed() exclusion সেট)।
#       বাকি সব লেবেল (area:*, handoff:*, group:*, platform tag) রানই স্পন করবে না।
#   (২) cancel-in-progress: false — বাকি রানগুলো serial কিউ করে, কোনো ক্যানসেলেশন
#       থ্র্যাশিং নেই; প্রতিটি রান fresh state থেকে re-rank করে তাই সর্বশেষ রানের
#       আউটপুটই সঠিক (founder directive #1997 অক্ষত)। 6h drift sweep নেট-সেফটি।

name: Issue Ops (Queue Ledger & Labeler)

on:
  issues:
    # Founder directive #1997: "1st close howar por 2nd auto 1st hoa jabe" — every
    # queue-relevant issue event re-ranks the live ledger (FLIP: absorbed from
    # priority-queue.yml, epic #1850 Phase F / #1858).
    # বাংলা মন্তব্য (#2425): এখানে সব টাইপ রাখা হয় (গঠনগতভাবে filter করা যায় না),
    # আসল ফিল্টার refresh-ledger job-এর if: কন্ডিশনে — নিচে দেখো।
    types: [opened, closed, reopened, labeled, unlabeled, edited]
  schedule:
    # 6-hourly drift sweep (verbatim from priority-queue.yml)
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: 'refresh-ledger | labeler'
        required: true
        default: 'refresh-ledger'
        type: string
      # ── labeler passthrough (action=labeler) ──
      labeler_issue_number:
        description: '[labeler] issue number to act on'
        required: false
        type: string
      labeler_operation:
        description: '[labeler] one of: label | comment | close | reopen'
        required: false
        type: string
      labeler_value:
        description: '[labeler] labels (comma-separated) for label op, or comment body for comment/close'
        required: false
        type: string

permissions:
  issues: write
  contents: read
  actions: read  # FIXED-WINDOW GATE (#2557): read workflow runs to enforce cooldown

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Fixed-Window Rate Limiter (#2557)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Issue #2557: event-driven triage workflows flooded main check-runs (~100 rec/h).
  # The #2425 storm fix reduced volume + stopped cancel-thrashing, but there was still
  # NO min-interval / debounce / cooldown between consecutive event-driven runs.
  # Under burst issue activity this gate keeps the queue to AT MOST one successful
  # refresh-ledger run per COOLDOWN_MINUTES window — later events within the window
  # are short-circuited (the next 6h drift sweep, or the next event after the
  # window, picks them up). This is the explicit "fixed-window rate limiting" the
  # issue asks for — implemented as a pre-flight gate job that both event-driven
  # arms (`auto-route`, `refresh-ledger`) depend on.
  rate-limit-gate:
    name: "⏱️ Fixed-window gate (≥5 min between runs)"
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      allow: ${{ steps.gate.outputs.allow }}
      last_run_ago: ${{ steps.gate.outputs.last_run_ago }}
    steps:
      - name: Check last successful run within cooldown window
        id: gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COOLDOWN_MINUTES: '5'
        with:
          script: |
            const cooldownMin = parseInt(process.env.COOLDOWN_MINUTES, 10);
            const cooldownMs = cooldownMin * 60 * 1000;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // Find the most recent successful run of THIS workflow on the default branch
            // within the cooldown window. If one exists, short-circuit this run.
            const now = Date.now();
            let allow = 'true';
            let lastRunAgo = 'never';
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'issue-ops.yml',
                status: 'completed',
                per_page: 20,
              });
              for (const r of runs.data.workflow_runs) {
                if (r.conclusion !== 'success') continue;
                if (r.event === 'schedule') continue;   // drift sweep doesn't count
                if (r.event === 'workflow_dispatch') continue;  // manual runs don't count
                const completedAt = new Date(r.updated_at).getTime();
                const ageMs = now - completedAt;
                if (ageMs < cooldownMs) {
                  allow = 'false';
                  lastRunAgo = `${Math.round(ageMs / 1000)}s`;
                  core.info(`⛔ Fixed-window gate: last successful event-driven run was ${Math.round(ageMs/1000)}s ago < ${cooldownMin}min cooldown — short-circuiting.`);
                  break;
                }
              }
            } catch (err) {
              // Fail-OPEN: if the API call fails (transient), let the run proceed.
              // The cooldown is an optimization, not a correctness gate.
              core.warning(`Gate lookup failed (fail-open): ${err.message}`);
              allow = 'true';
            }
            if (allow === 'true') {
              core.info(`✅ Fixed-window gate: no recent run within ${cooldownMin}min cooldown — proceeding.`);
            }
            core.setOutput('allow', allow);
            core.setOutput('last_run_ago', lastRunAgo);

  validate-action:
    name: Validate action input (fail-closed)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on unknown action
        run: |
          case "${{ inputs.action }}" in
            refresh-ledger|labeler)
              echo "✅ action='${{ inputs.action }}' is valid" ;;
            *)
              echo "::error::Unknown action '${{ inputs.action }}'. Valid values: refresh-ledger | labeler"
              exit 1 ;;
          esac

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Arm 0 — Issue Auto-Router (Auto-label + auto-prioritize on open/edit)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  auto-route:
    name: "🤖 Issue Auto-Router"
    # #2557 fixed-window gate: skip if a successful event-driven run completed
    # within the cooldown window (output `allow` == 'false').
    needs: rate-limit-gate
    if: github.event_name == 'issues' && contains(fromJSON('["opened", "reopened", "edited"]'), github.event.action) && needs.rate-limit-gate.outputs.allow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Route issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/ci/issue_router.py --issue ${{ github.event.issue.number }}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Arm 1 — Priority queue re-rank (source: priority-queue.yml `refresh-ledger`)
  # Founder directive #1997: "1st close howar por 2nd auto 1st hoa jabe".
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  refresh-ledger:
    name: Re-rank live priority queue
    # #2557 fixed-window gate: for event-driven runs, depend on the gate and
    # skip if a successful run completed within the cooldown window. Scheduled
    # drift sweeps and manual dispatch bypass the gate (they're the safety net).
    needs: rate-limit-gate
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'refresh-ledger') ||
      (github.event_name == 'issues' && needs.rate-limit-gate.outputs.allow == 'true' && (
        github.event.action == 'opened' ||
        github.event.action == 'closed' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && contains(fromJSON('["P0-critical","P1-high","P2-medium","P3-low","status:unclaimed","status:in-progress","status:planned"]'), github.event.label.name)) ||
        (github.event.action == 'unlabeled' && contains(fromJSON('["P0-critical","P1-high","P2-medium","P3-low","status:unclaimed","status:in-progress","status:planned"]'), github.event.label.name))
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Unified with the retired priority-queue.yml group (flip) — one ledger
      # re-rank at a time. বাংলা মন্তব্য (#2425): cancel-in-progress: false —
      # থ্র্যাশিং বন্ধ; burst হলে রানগুলো serial চলবে (প্রতিটি ~২০-৩০s), শেষ রানেই
      # সর্বশেষ state-এর re-rank। কোনো রান ১-২ সেকেন্ডে বাতিল হয়ে যাবে না।
      group: priority-queue-ledger
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Refresh the ledger
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LEDGER_TRIGGER: ${{ github.event_name }}${{ github.event.action && format(' ({0})', github.event.action) || '' }}
        run: |
          set -euo pipefail
          python scripts/agents/priority_queue_ledger.py --limit 10

      - name: Dry-run smoke (queue shape sanity)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Verifies the renderer end-to-end without writing (guards against
          # silent breakage of the body/marker contract the promotion logic reads).
          python scripts/agents/priority_queue_ledger.py --dry-run --limit 3 | head -40

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Arm 2 — Issue labeler (source: issue-labeler.yml `apply`, verbatim script)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  labeler:
    name: Apply issue action
    if: ${{ inputs.action == 'labeler' }}
    needs: validate-action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      contents: read
    concurrency:
      # Issue-scoped, matching the legacy issue-labeler semantics.
      group: issue-ops-labeler-${{ inputs.labeler_issue_number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Apply issue action
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.labeler_issue_number }}
          ACTION: ${{ inputs.labeler_operation }}
          VALUE: ${{ inputs.labeler_value }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const num = parseInt(process.env.ISSUE_NUMBER, 10);
            const action = process.env.ACTION;
            const value = process.env.VALUE || '';

            if (!Number.isInteger(num) || num <= 0) {
              core.setFailed(`Invalid issue_number: ${process.env.ISSUE_NUMBER}`);
              return;
            }

            switch (action) {
              case 'label': {
                const labels = value.split(',').map(s => s.trim()).filter(Boolean);
                if (labels.length === 0) { core.setFailed('No labels provided'); return; }
                await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels });
                console.log(`Added labels [${labels.join(', ')}] to issue #${num}`);
                break;
              }
              case 'comment': {
                if (!value) { core.setFailed('Empty comment'); return; }
                await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                console.log(`Posted comment to issue #${num}`);
                break;
              }
              case 'close': {
                if (value) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                }
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: 'completed' });
                console.log(`Closed issue #${num}`);
                break;
              }
              case 'reopen': {
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'open', state_reason: 'reopened' });
                console.log(`Reopened issue #${num}`);
                break;
              }
              default:
                core.setFailed(`Unknown action: ${action}`);
            }
