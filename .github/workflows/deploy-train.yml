# ============================================================================
# Deploy Train — Production Rollout Train with Automated Rollback (#2421 seq:3)
# ============================================================================
# Canonical Architecture (Pipeline 3 / Deploy Station):
#   Station 1: Production Preflight (gated by vars.STAGING_ENABLED == 'true')
#   Station 2: Production Deploy (Migration Gate -> DB Schema -> Render / Cloudflare)
#   Station 3: Post-Deploy Smoke Canary (Playwright + Health Probes)
#   Station 4: Automated Rollback (on canary failure)
#   Station 5: Release Tag (on green canary)
# ============================================================================

name: Deploy Train

on:
  workflow_call:
    inputs:
      deploy-scraper:
        description: 'Scraper সার্ভিসও deploy হবে (scraper পরিবর্তিত হলে)'
        required: false
        type: boolean
        default: false
      deploy-mcp:
        description: 'MCP Control Towerও deploy হবে (infra পরিবর্তিত হলে)'
        required: false
        type: boolean
        default: false
      deploy-cloudflare:
        description: 'Cloudflare Worker-ও deploy হবে (infra পরিবর্তিত হলে)'
        required: false
        type: boolean
        default: false
      rollback_on_canary_fail:
        description: 'ক্যানারি ব্যর্থ হলে স্বয়ংক্রিয় রোলব্যাক?'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      deploy-scraper:
        description: 'Scraper সার্ভিসও deploy হবে (scraper পরিবর্তিত হলে)'
        required: false
        type: boolean
        default: false
      deploy-mcp:
        description: 'MCP Control Towerও deploy হবে (infra পরিবর্তিত হলে)'
        required: false
        type: boolean
        default: false
      deploy-cloudflare:
        description: 'Cloudflare Worker-ও deploy হবে (infra পরিবর্তিত হলে)'
        required: false
        type: boolean
        default: false
      rollback_on_canary_fail:
        description: 'ক্যানারি ব্যর্থ হলে স্বয়ংক্রিয় রোলব্যাক? (অফ করলে শুধু লাল — অ্যাডমিন হাতে)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: supremeai-deploy-train
  cancel-in-progress: false

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ডায়াগনস্টিক (#2661): dispatch-এ inputs কনটেক্সটে কী পৌঁছায় — গ্রাউন্ড ট্রুথ
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  dispatch-inputs-resolve:
    name: "🔬 Resolve Dispatch Inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # বাংলা (#2661 তৃতীয় দফা): job-level `if`-এ inputs/github.event.inputs-এর
    # প্রাপ্যতা ইঞ্জিনে অনির্ভরযোগ্য (রান 36728063196: step-এ true দৃশ্যমান, তবু
    # গার্ডে skip)। তাই এই জবের STEP-এ একবার রেজলভ করে outputs-এ প্রচার —
    # needs-ভিত্তিক গেটিং context-নিরপেক্ষ ও দুই ট্রিগারেই নির্ধারিত।
    outputs:
      deploy-scraper: ${{ steps.resolve.outputs.scraper }}
      deploy-mcp: ${{ steps.resolve.outputs.mcp }}
      deploy-cloudflare: ${{ steps.resolve.outputs.cloudflare }}
      rollback: ${{ steps.resolve.outputs.rollback }}
    steps:
      - name: Resolve raw input visibility → normalized flags
        id: resolve
        run: |
          pick() {
            local v="${1}"
            if [ -z "$v" ]; then v="${2}"; fi
            if [ "$v" = "true" ]; then echo true; else echo false; fi
          }
          echo "typed inputs = $(cat <<'EOJ'
          ${{ toJson(inputs) }}
          EOJ
          )"
          echo "event inputs = $(cat <<'EOJ'
          ${{ toJson(github.event.inputs) }}
          EOJ
          )"
          echo "scraper=$(pick "${{ inputs.deploy-scraper }}" "${{ github.event.inputs.deploy-scraper }}")" >> "$GITHUB_OUTPUT"
          echo "mcp=$(pick "${{ inputs.deploy-mcp }}" "${{ github.event.inputs.deploy-mcp }}")" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$(pick "${{ inputs.deploy-cloudflare }}" "${{ github.event.inputs.deploy-cloudflare }}")" >> "$GITHUB_OUTPUT"
          # rollback flag: disable-semantics — স্পষ্ট false হলেই বন্ধ, ডিফল্ট চালু
          rv="${{ inputs.rollback_on_canary_fail }}"
          if [ -z "$rv" ]; then rv="${{ github.event.inputs.rollback_on_canary_fail }}"; fi
          if [ "$rv" = "false" ]; then echo "rollback=false" >> "$GITHUB_OUTPUT"; else echo "rollback=true" >> "$GITHUB_OUTPUT"; fi
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # চেঞ্জ-ডিটেকশন (#2901): push-ইভেন্টে বদলানো পাথ দেখে ঠিক কোন সার্ভিস deploy
  # দরকার তা সিদ্ধান্ত — ডক/টেস্ট/CI-অনলি পরিবর্তনে শূন্য Render deploy (কোটা
  # সাশ্রয়), infrastructure পরিবর্তনে cloudflare অটো-ডিপ্লয়। manual dispatch-এ
  # মানুষের স্পষ্ট input-ই সিদ্ধান্ত (pass-through)। চুক্তি-টেস্ট:
  # tests/test_detect_deploy_targets_2901.py (PyYAML job-graph অখণ্ডতা সহ)।
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  detect-changes:
    name: "🔬 Detect Deploy Targets"
    needs: [dispatch-inputs-resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy-core: ${{ steps.detect.outputs.deploy-core }}
      deploy-worker: ${{ steps.detect.outputs.deploy-worker }}
      deploy-scraper: ${{ steps.detect.outputs.deploy-scraper }}
      deploy-mcp: ${{ steps.detect.outputs.deploy-mcp }}
      deploy-cloudflare: ${{ steps.detect.outputs.deploy-cloudflare }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve changed-path deploy targets
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/ci/detect_deploy_targets.py --mode manual \
              --scraper "${{ needs.dispatch-inputs-resolve.outputs.deploy-scraper }}" \
              --mcp "${{ needs.dispatch-inputs-resolve.outputs.deploy-mcp }}" \
              --cloudflare "${{ needs.dispatch-inputs-resolve.outputs.deploy-cloudflare }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              python3 scripts/ci/detect_deploy_targets.py
            else
              python3 scripts/ci/detect_deploy_targets.py --base "$BASE" --head "${{ github.sha }}"
            fi
          fi
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Station 1: Production Preflight (Inlined from 08-production-preflight.yml)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  preflight-verify:
    name: "🚉 Station 1: Preflight Build & Health"
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
          working-directory: ./frontend
      - name: Build Frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || secrets.USER_BACKEND_URL || vars.USER_BACKEND_URL }}
        run: pnpm --filter supremeai-studio-client build
      - name: Typecheck
        run: pnpm --filter supremeai-studio-client typecheck
      - name: Lint
        run: pnpm --filter supremeai-studio-client lint
      - name: Check Backend Health
        env:
          PROD_BACKEND: ${{ secrets.PROD_BACKEND || vars.PRODUCTION_URL }}
        run: |
          if [ -n "$PROD_BACKEND" ]; then
            echo "Probing backend health at $PROD_BACKEND"
            curl -fsS --max-time 15 "$PROD_BACKEND/health" || curl -fsS --max-time 15 "$PROD_BACKEND/api/v1/health" || echo "Health probe completed"
          fi

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Station 2: Production Deploy (Inlined from ci-deploy-production.yml)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  migration-gate:
    name: "🛡️ Migration Gate (alembic, fail-fast)"
    needs: [preflight-verify]
    if: always() && (needs.preflight-verify.result == 'success' || needs.preflight-verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      live_migration: ${{ steps.decide.outputs.live }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import SUPABASE_DATABASE_URL_WRITER from Infisical (gate)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "SUPABASE_DATABASE_URL_WRITER"
          export-type: "env"

      - name: Import SUPABASE_DB_CA_CERT from Infisical (verify-full TLS)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "SUPABASE_DB_CA_CERT"
          export-type: "env"

      - name: Decide gate mode
        id: decide
        env:
          SUPABASE_DATABASE_URL_WRITER: ${{ env.SUPABASE_DATABASE_URL_WRITER || secrets.SUPABASE_DATABASE_URL_WRITER }}
        run: |
          if [ -n "$SUPABASE_DATABASE_URL_WRITER" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "Writer endpoint configured — live alembic upgrade will run."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "Writer endpoint NOT configured — offline chain verification only."
          fi

      - name: Prepare backend environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'
          install-browser-deps: 'false'
          mode: prepare

      - name: Offline migration-chain verification (always)
        working-directory: ./backend
        env:
          SUPABASE_DATABASE_URL_WRITER: postgresql://offline-placeholder:offline@localhost:5432/offline
          TESTING: '1'
        run: poetry run alembic upgrade head --sql > /tmp/migration_plan.sql && echo "### 🛡️ Migration Gate — offline chain OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Live alembic upgrade head (writer endpoint)
        if: steps.decide.outputs.live == 'true'
        working-directory: ./backend
        env:
          SUPABASE_DATABASE_URL_WRITER: ${{ env.SUPABASE_DATABASE_URL_WRITER || secrets.SUPABASE_DATABASE_URL_WRITER }}
          SUPABASE_DB_CA_CERT: ${{ env.SUPABASE_DB_CA_CERT }}
          TESTING: '1'
        run: poetry run alembic upgrade head

      - name: Report unconfigured writer
        if: steps.decide.outputs.live != 'true'
        run: |
          ENFORCE="${{ vars.MIGRATION_GATE_ENFORCE || 'false' }}"
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::Migration gate: SUPABASE_DATABASE_URL_WRITER is not configured."
            exit 1
          else
            echo "::warning::Migration gate: SUPABASE_DATABASE_URL_WRITER not configured — live alembic upgrade skipped."
          fi

  mission-control-migration:
    # ROOT-CAUSE FIX (#2914): Mission Control Prisma migration was missing
    # from CI. Backend Alembic migrations run in migration-gate above, but
    # Mission Control (apps/mission-control) uses Prisma — its schema changes
    # were never applied in CI. Now: prisma db push runs after alembic.
    name: "🗄️ Mission Control Prisma Migration"
    needs: [migration-gate]
    if: always() && needs.migration-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e77994a6a51a7e4 # v4
        with:
          version: 10.15.0
      - name: Install Mission Control deps
        working-directory: apps/mission-control
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/mission-control
        run: pnpm exec prisma generate
      - name: Push schema to database
        working-directory: apps/mission-control
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Mission Control: DATABASE_URL not configured — prisma db push skipped"
            exit 0
          fi
          pnpm exec prisma db push --accept-data-loss
          echo "✅ Mission Control Prisma schema pushed"

  db-schema-check:
    name: "🗄️ DB Schema Contract Check"
    needs: [migration-gate]
    # বাংলা মন্তব্য: implicit success() যথেষ্ট নয় — Station 1 (preflight-verify)
    # vars.STAGING_ENABLED বন্ধ থাকলে skip হয়, আর GitHub needs-graph-এ সেই skip
    # downstream-এর implicit success()-কেও false করে দেয় → পুরো deploy চেইন
    # dead-green ভাবে skip হয়ে যায় (প্রমাণ: রান #5/#6, issue #2621)। তাই এই
    # রিপোর প্রমাণিত প্যাটার্ন (পুরনো ci.yml + নিজের Station 4/5): explicit
    # result-check — শুধু আসল নির্ভরতার ফলাফল দেখে, fail-closed বহাল থাকে।
    if: always() && needs.migration-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install checker dependencies
        run: pip install --no-cache-dir --disable-pip-version-check psycopg2-binary pyyaml

      - name: Check live production database against schema contract
        env:
          DB_SCHEMA_CHECK_URL: ${{ secrets.DB_SCHEMA_CHECK_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL_POOLER || secrets.DATABASE_URL }}
        run: python scripts/ci/check_database_schema.py

  deploy-core:
    name: "🚀 Deploy Core"
    needs: [migration-gate, db-schema-check, detect-changes]
    # বাংলা মন্তব্য: #2621 — schema-check ও gate দুটোই success হলেই deploy;
    # যেকোনো একটা fail/skip হলে এখানেও skip (fail-closed, পুরনো ci.yml প্যাটার্ন)।
    # বাংলা মন্তব্য (#2901): detect-changes-আউটপুটের গেট — ব্যাকএন্ড-অসংশ্লিষ্ট
    # push-এ core deploy স্কিপ (skipped ≠ success → canary-টেলও নিজে থেকেই স্কিপ)।
    if: always() && needs.migration-gate.result == 'success' && needs.db-schema-check.result == 'success' && needs.detect-changes.outputs.deploy-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    concurrency:
      group: render-core
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import RENDER_API_KEY from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY"
          export-type: "env"

      - name: Import RENDER_PRIMARY_SVC_ID from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_PRIMARY_SVC_ID"
          export-type: "env"

      - name: Import RENDER_CORE_URL from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_CORE_URL"
          export-type: "env"

      # বাংলা মন্তব্য (#2624): পুরনো pipeline-এর ফ্রি-কোটা pre-light চেক পুনঃ-ওয়্যারিং —
      # পুরনো মনোলিথ ci.yml প্রুন হওয়ার পর এটি অনাথ হয়ে গিয়েছিল। unconfigured
      # হলে self-skip (exit 0), configured হলে কোটা-অনুমান ≥ cap হলে fail-fast।
      - name: Render free-tier quota preflight (pre-light check, self-skips when unconfigured)
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_PRIMARY_SVC_ID: ${{ env.RENDER_PRIMARY_SVC_ID || secrets.RENDER_PRIMARY_SVC_ID }}
        run: python3 scripts/ci/render_deploy_preflight.py

      # বাংলা মন্তব্য (#2624): সাসপেন্ডেড সার্ভিসে deploy ট্রিগার অর্থহীন —
      # ট্রিগারের আগেই fail-fast (প্রমাণ: run 36695632388)।
      - name: Render suspension guard (fail-fast before trigger)
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ env.RENDER_PRIMARY_SVC_ID || secrets.RENDER_PRIMARY_SVC_ID }}
        run: python3 scripts/deploy/render_suspension_guard.py

      - name: Deploy Core to Render
        uses: ./.github/actions/render-deploy-status
        with:
          service-name: "Core"
          api-key: ${{ env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          service-id: ${{ env.RENDER_PRIMARY_SVC_ID || secrets.RENDER_PRIMARY_SVC_ID }}
          service-url: ${{ env.RENDER_CORE_URL || secrets.RENDER_CORE_URL }}

  deploy-worker:
    name: "🚀 Deploy Worker"
    needs: [migration-gate, db-schema-check, detect-changes]
    # বাংলা মন্তব্য: #2621 — deploy-core-এর মতোই explicit result-check।
    # বাংলা মন্তব্য (#2901): worker-ও detection-গেটেড (core-এর মতোই)।
    if: always() && needs.migration-gate.result == 'success' && needs.db-schema-check.result == 'success' && needs.detect-changes.outputs.deploy-worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    concurrency:
      group: render-worker
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import RENDER_API_KEY from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY"
          export-type: "env"

      - name: Import RENDER_WORKER_SVC_ID from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_WORKER_SVC_ID"
          export-type: "env"

      - name: Import RENDER_WORKER_URL from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_WORKER_URL"
          export-type: "env"

      # বাংলা মন্তব্য (#2624): core-এর মতোই কোটা pre-light + সাসপেনশন গার্ড (worker role)।
      - name: Render free-tier quota preflight (pre-light check, self-skips when unconfigured)
        env:
          RENDER_API_KEY_2: ${{ env.RENDER_API_KEY_2 || secrets.RENDER_API_KEY_2 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_WORKER_SVC_ID: ${{ env.RENDER_WORKER_SVC_ID || secrets.RENDER_WORKER_SVC_ID }}
        run: python3 scripts/ci/render_deploy_preflight.py

      - name: Render suspension guard (fail-fast before trigger)
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY_2 || secrets.RENDER_API_KEY_2 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ env.RENDER_WORKER_SVC_ID || secrets.RENDER_WORKER_SVC_ID }}
        run: python3 scripts/deploy/render_suspension_guard.py

      - name: Deploy Worker to Render
        uses: ./.github/actions/render-deploy-status
        with:
          service-name: "Worker"
          api-key: ${{ env.RENDER_API_KEY_2 || secrets.RENDER_API_KEY_2 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          service-id: ${{ env.RENDER_WORKER_SVC_ID || secrets.RENDER_WORKER_SVC_ID }}
          service-url: ${{ env.RENDER_WORKER_URL || secrets.RENDER_WORKER_URL }}

  deploy-scraper:
    name: "🚀 Deploy Scraper"
    needs: [migration-gate, db-schema-check, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # বাংলা (#2661): workflow_dispatch-এ `inputs` কনটেক্সট অনির্ভরযোগ্য —
    # স্ট্রিং-টাইপ `github.event.inputs` fallback সহ dual-context guard।
    # বাংলা (#2661 দ্বিতীয় দফা): GHA লুজ-ইকুয়ালিটি — `true == 'true'` মিথ্যা (সংখ্যায় কোয়ার্স:
    # 1 vs NaN)। তাই বুলিয়ান+স্ট্রিং দুই রূপই উভয় কনটেক্সটে যাচাই — ৪-মুখী টাইপ-প্রুফ গার্ড।
    # বাংলা (#2901): সিদ্ধান্ত-উৎস এখন detect-changes (manual মোডে pass-through)।
    if: always() && needs.migration-gate.result == 'success' && needs.db-schema-check.result == 'success'
      && needs.detect-changes.outputs.deploy-scraper == 'true'
    environment:
      name: production
    concurrency:
      group: render-scraper
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # বাংলা মন্তব্য (#2901): scraper অ্যাকাউন্টেও কোটা প্রিফ্লাইট (আগে শুধু সাসপেনশন গার্ড ছিল)।
      - name: Render free-tier quota preflight (pre-light check, self-skips when unconfigured)
        env:
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 || secrets.RENDER_API_KEY }}
          RENDER_SCRAPER_SVC_ID: ${{ secrets.RENDER_SCRAPER_SVC_ID }}
        run: python3 scripts/ci/render_deploy_preflight.py
      # বাংলা মন্তব্য (#2624): ট্রিগারের আগে সাসপেনশন গার্ড — কোটা-শেষ অন্ধ deploy নয়।
      - name: Render suspension guard (fail-fast before trigger)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_3 || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ secrets.RENDER_SCRAPER_SVC_ID }}
        run: python3 scripts/deploy/render_suspension_guard.py
      - name: Deploy Scraper to Render
        uses: ./.github/actions/render-deploy-status
        with:
          service-name: "Scraper"
          api-key: ${{ secrets.RENDER_API_KEY_3 || secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_SCRAPER_SVC_ID }}
          service-url: ${{ secrets.RENDER_SCRAPER_URL }}

  deploy-mcp:
    name: "🚀 Deploy MCP Control Tower"
    needs: [migration-gate, db-schema-check, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # বাংলা (#2661): workflow_dispatch-এ `inputs` কনটেক্সট অনির্ভরযোগ্য —
    # স্ট্রিং-টাইপ `github.event.inputs` fallback সহ dual-context guard।
    # বাংলা (#2661 দ্বিতীয় দফা): GHA লুজ-ইকুয়ালিটি — `true == 'true'` মিথ্যা (সংখ্যায় কোয়ার্স:
    # 1 vs NaN)। তাই বুলিয়ান+স্ট্রিং দুই রূপই উভয় কনটেক্সটে যাচাই — ৪-মুখী টাইপ-প্রুফ গার্ড।
    # বাংলা (#2901): সিদ্ধান্ত-উৎস এখন detect-changes (manual মোডে pass-through)।
    if: always() && needs.migration-gate.result == 'success' && needs.db-schema-check.result == 'success'
      && needs.detect-changes.outputs.deploy-mcp == 'true'
    environment:
      name: production
    concurrency:
      group: render-mcp
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # বাংলা মন্তব্য (#2901): mcp অ্যাকাউন্টেও কোটা প্রিফ্লাইট (আগে শুধু সাসপেনশন গার্ড ছিল)।
      - name: Render free-tier quota preflight (pre-light check, self-skips when unconfigured)
        env:
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 || secrets.RENDER_API_KEY }}
          RENDER_MCP_SVC_ID: ${{ secrets.RENDER_MCP_SVC_ID }}
        run: python3 scripts/ci/render_deploy_preflight.py
      # বাংলা মন্তব্য (#2624): ট্রিগারের আগে সাসপেনশন গার্ড — কোটা-শেষ অন্ধ deploy নয়।
      - name: Render suspension guard (fail-fast before trigger)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_4 || secrets.RENDER_API_KEY }}
          RENDER_SVC_ID: ${{ secrets.RENDER_MCP_SVC_ID }}
        run: python3 scripts/deploy/render_suspension_guard.py
      - name: Deploy MCP to Render
        uses: ./.github/actions/render-deploy-status
        with:
          service-name: "MCP Control Tower"
          api-key: ${{ secrets.RENDER_API_KEY_4 || secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_MCP_SVC_ID }}
          service-url: ${{ secrets.RENDER_MCP_URL }}

  deploy-cloudflare-worker:
    name: "⚡ Deploy Cloudflare Worker"
    needs: [migration-gate, db-schema-check, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # বাংলা (#2661): workflow_dispatch-এ `inputs` কনটেক্সট অনির্ভরযোগ্য —
    # স্ট্রিং-টাইপ `github.event.inputs` fallback সহ dual-context guard।
    # বাংলা (#2661 দ্বিতীয় দফা): GHA লুজ-ইকুয়ালিটি — `true == 'true'` মিথ্যা (সংখ্যায় কোয়ার্স:
    # 1 vs NaN)। তাই বুলিয়ান+স্ট্রিং দুই রূপই উভয় কনটেক্সটে যাচাই — ৪-মুখী টাইপ-প্রুফ গার্ড।
    # বাংলা (#2901): সিদ্ধান্ত-উৎস এখন detect-changes — infrastructure পরিবর্তনে
    # cloudflare প্রথমবারের মতো অটো-ডিপ্লয় হবে (আগে কখনোই হতো না)।
    if: always() && needs.migration-gate.result == 'success' && needs.db-schema-check.result == 'success'
      && needs.detect-changes.outputs.deploy-cloudflare == 'true'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Wrangler
        run: npm install -g wrangler@4.135.0
      - name: Deploy Worker
        working-directory: infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -f "package.json" ]; then npm ci; fi
            wrangler deploy
          fi

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Station 3: Post-Deploy Smoke Canary (Inlined from 09-post-deploy-smoke.yml)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  canary-check:
    name: "🚉 Station 3: Post-Deploy Smoke Canary"
    needs: [deploy-core, deploy-worker]
    # বাংলা মন্তব্য: #2621 — core+worker সত্যিকারের deploy হলেই ক্যানারি;
    # scraper/mcp/cloudflare-এর input-গেট skip ক্যানারিকে আটকাবে না
    # (ওরা canary-র needs-এ নেই)।
    if: always() && needs.deploy-core.result == 'success' && needs.deploy-worker.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import RENDER_CORE_URL from Infisical (best-effort)
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Resolve production targets (canonical resolver, #1132)
        id: resolve
        env:
          EXPLICIT_URL: ${{ vars.PRODUCTION_URL || secrets.PRODUCTION_URL }}
          FRONTEND_EXPLICIT_URL: ${{ secrets.FRONTEND_PRODUCTION_URL }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          RENDER_CORE: ${{ env.RENDER_CORE_URL }}
        run: python3 scripts/ci/resolve_production_targets.py --env-file "$GITHUB_ENV"

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Fail closed when no live production target configured
        if: ${{ env.QA_BASE_URL == '' && env.BACKEND_HEALTH_URL == '' }}
        run: |
          echo "::error::Neither FRONTEND_PRODUCTION_URL nor BACKEND_HEALTH_URL is configured — post-deploy canary CANNOT verify live deployment."
          exit 1

      # বাংলা মন্তব্য (#2624): single-shot curl-এ deploy-ইন-ফ্লাইট উইন্ডোতে মিথ্যা
      # লাল হতো (issue-র প্রস্তাব: warm-up/retry)। এখন ৫ বার × ৩০s retry; তবে
      # Render-এর "Service Suspended" পেজ দেখলে দ্রুত-স্পষ্ট ব্যর্থতা — অর্থহীন
      # retry নয়, অ্যাকশনেবল বার্তা (কোটা/unsuspend) সহ।
      - name: Backend live health probe (canonical API origin, retried)
        if: ${{ env.BACKEND_HEALTH_URL != '' }}
        run: |
          echo "Probing backend health at $BACKEND_HEALTH_URL/api/v1/health (5 tries x 30s)"
          body=""
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 30 -o /tmp/health_body.json -w '%{http_code}' "$BACKEND_HEALTH_URL/api/v1/health" 2>/tmp/health_err.txt || true)
            if [ "$code" = "200" ]; then
              body=$(cat /tmp/health_body.json)
              echo "try $i/5: HTTP 200"
              break
            fi
            echo "try $i/5: HTTP ${code:-none} — $(cat /tmp/health_err.txt | head -1)"
            # সাসপেন্ডেড সার্ভিস retry-তে সুস্থ হয় না — সুনির্দিষ্ট নির্দেশনা দিয়ে বন্ধ
            if grep -qi "Service Suspended" /tmp/health_body.json 2>/dev/null; then
              echo "::error::Render সার্ভিস SUSPENDED (ফ্রি-টিয়ার কোটা শেষ / অ্যাডমিন-সাসপেন্ড) — unsuspend/কোটা রিসেট ছাড়া canary পাস অসম্ভব; অ্যাডমিন সিদ্ধান্ত প্রয়োজন।"
              exit 1
            fi
            [ "$i" = "5" ] || sleep 30
          done
          if [ -z "$body" ]; then
            echo "::error::Backend health probe failed after 5 tries (last HTTP ${code:-none}) — অ্যাডমিন যাচাই প্রয়োজন।"
            exit 1
          fi
          echo "$body"
          echo "$body" | grep -q '"status":"healthy"' || {
            echo "::error::Backend health probe did not report healthy."
            exit 1
          }

      - name: Secondary-service runtime evidence probes (#1100)
        if: always()
        env:
          WORKER_PRODUCTION_URL: ${{ secrets.WORKER_PRODUCTION_URL }}
          MCP_PRODUCTION_URL: ${{ secrets.MCP_PRODUCTION_URL }}
          EDGE_WORKER_PRODUCTION_URL: ${{ secrets.EDGE_WORKER_PRODUCTION_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL_WRITER || secrets.DATABASE_URL }}
        run: python3 scripts/ci/secondary_service_probes.py

      - name: Setup Playwright (Chromium)
        if: ${{ env.QA_BASE_URL != '' }}
        uses: ./.github/actions/setup-playwright
        with:
          browser: chromium

      - name: Wait for deployment to stabilize
        if: ${{ env.QA_BASE_URL != '' }}
        run: sleep 45

      - name: Run production guest canary (@smoke)
        if: ${{ env.QA_BASE_URL != '' }}
        run: pnpm exec playwright test -c qa/playwright.config.qa.ts --project=guest --grep=@smoke

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Station 4: Instant Rollback (if Canary Fails)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  station-4-rollback:
    name: "🚨 Station 4: Automated Rollback"
    needs: [deploy-core, canary-check, dispatch-inputs-resolve]
    if: >-
      always() &&
      needs.deploy-core.result == 'success' &&
      needs.canary-check.result == 'failure' &&
      needs.dispatch-inputs-resolve.outputs.rollback != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Rollback to previous stable deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
        run: |
          set -euo pipefail
          python scripts/deploy/render_rollback.py --poll-timeout 900

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Station 5: Release Tag (if Canary Succeeds)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  station-5-release:
    name: "🏷️ Station 5: Release Tag"
    needs: [deploy-core, canary-check]
    if: >-
      always() &&
      needs.deploy-core.result == 'success' &&
      needs.canary-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag release version
        env:
          GH_PUSH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' backend/pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "ℹ️ ট্যাগ ${TAG} আগেই আছে — পুনরায় ট্যাগ নয়; সংস্করণ বাড়িয়ে নতুন ট্রেন চালান।"
            exit 0
          fi
          # বাংলা মন্তব্য (#2627): GitHub runner-এ ডিফল্ট committer identity থাকে না —
          # annotated tag (-a) তৈরির আগে identity সেট না করলে "empty ident name"
          # fatal (exit 128)। GITHUB_ACTOR-ভিত্তিক identity, কোনো হার্ডকোড নয়।
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "${TAG}" -m "Deploy Train release ${TAG} (${GITHUB_SHA})"
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
          echo "✅ Release tagged: ${TAG}"
