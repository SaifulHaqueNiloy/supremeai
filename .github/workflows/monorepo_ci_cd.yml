    "html": "<html><head><meta name=\"color-scheme\" content=\"light dark\"></head><body><pre style=\"word-wrap: break-word; white-space: pre-wrap;\">name: Monorepo CI/CD - Type Sync\n\non:\n  push:\n    branches: [main, master]\n    paths:\n      - 'backend/schemas/**'\n      - 'scripts/generate_types.py'\n      - 'backend/core/type_sync_bus.py'\n  pull_request:\n    branches: [main, master]\n    paths:\n      - 'backend/schemas/**'\n      - 'scripts/generate_types.py'\n      - 'backend/core/type_sync_bus.py'\n\nconcurrency:\n  group: ${{ github.workflow }}-${{ github.ref_name }}\n  cancel-in-progress: true\n\njobs:\n  type-sync-check:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4\n        with:\n          fetch-depth: 0\n\n      - name: Setup Backend\n        uses: ./.github/actions/setup-backend\n        with:\n          python-version: '3.11'\n\n      - name: 🔐 Iron Curtain SecretHunter Scan\n        working-directory: backend\n        # বাংলা মন্তব্য: পয়েট্রি রুটে pyproject.toml খুঁজে পাওয়ার জন্য backend ডিরেক্টরি থেকে স্ক্রিপ্ট রান করানো হচ্ছে\n        run: |\n          poetry run python ../scripts/devops/secret_scan_ci.py --path ../backend/ --json\n\n      - name: Run type generation\n        working-directory: backend\n        run: |\n          poetry run python ../scripts/generate_types.py\n\n      - name: Check for drift\n        working-directory: backend\n        run: |\n          poetry run python ../scripts/generate_types.py --validate\n\n      - name: Verify generated files exist\n        run: |\n          if [ ! -d \"packages/shared-types/src/typescript\" ]; then\n            echo \"TypeScript types not generated!\"\n            exit 1\n          fi\n\n          if [ ! -d \"packages/shared-types/src/dart\" ]; then\n            echo \"Dart types not generated!\"\n            exit 1\n          fi\n\n          echo \"Generated TypeScript files:\"\n          ls -la packages/shared-types/src/typescript/\n\n          echo \"Generated Dart files:\"\n          ls -la packages/shared-types/src/dart/\n\n      - name: Commit and push if changed\n        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5\n        with:\n          commit_message: \"chore: auto-generate TypeScript/Dart types from Pydantic schemas\"\n          branch: ${{ github.head_ref }}\n          file_pattern: 'packages/shared-types/**'\n\n  type-sync-integration-test:\n    runs-on: ubuntu-latest\n    needs: type-sync-check\n    timeout-minutes: 10\n\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4\n\n      - name: Set up Python\n        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5\n        with:\n          python-version: '3.11'\n\n      - name: Install dependencies\n        run: |\n          python -m pip install --upgrade pip\n          pip install pydantic loguru pytest\n\n      - name: Test type sync bus\n        run: |\n          # Test that the type sync bus can be imported without errors\n          python -c \"\n          from backend.core.type_sync_bus import TypeSyncBus\n          print('TypeSyncBus imported successfully')\n          \"\n\n          # Run basic functionality test\n          python -c \"\n          import asyncio\n          from backend.core.type_sync_bus import get_type_sync_bus\n\n          # Test singleton creation\n          bus = get_type_sync_bus()\n          print('TypeSyncBus singleton created successfully')\n          \"\n\n  smart-summary:\n    name: \"🧠 Smart Pipeline Summary\"\n    runs-on: ubuntu-latest\n    if: always()\n    needs:\n      - type-sync-check\n      - type-sync-integration-test\n    permissions:\n      actions: read\n      contents: read\n      pull-requests: write\n    steps:\n      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4\n      - uses: ./.github/actions/setup-backend\n        with:\n          python-version: '3.11'\n      - name: 🧠 Generate Smart Pipeline Summary (API Key Free)\n        if: always()\n        working-directory: backend\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          GITHUB_RUN_ID: ${{ github.run_id }}\n        run: poetry run python ../.github/scripts/ci_smart_summary.py\n      - name: 🚨 Generate Detailed Error Report (Bangla Diagnosis)\n        if: always()\n        working-directory: backend\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          GITHUB_RUN_ID: ${{ github.run_id }}\n        run: poetry run python ../.github/scripts/ci_error_report.py\n</pre></body></html>",
