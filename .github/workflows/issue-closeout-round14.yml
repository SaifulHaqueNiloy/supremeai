# Round 14 Issue Closeout (2026-09-18)
#
# বাংলা: Round 14 ফিক্স (commits 7feb0700, 7f0dfa82, dd40ed9e, c204db97) ল্যান্ড
# করার পর সংশ্লিষ্ট issue-গুলোতে বাংলা+ইংরেজি প্রমাণ-কমেন্ট পোস্ট করে ফিক্স হওয়া
# গুলো বন্ধ করে। এজেন্ট-টোকেনে Issues:write নেই (403), তাই built-in GITHUB_TOKEN
# ব্যবহার করা হচ্ছে — repo-র nightly auto-close ওয়ার্কফ্লোর মতোই প্যাটার্ন।
#
# English: Posts per-issue bilingual evidence comments from
# docs/audit_reports/round14_comments/ and closes the issues fixed in Round 14.
# Idempotent: closing an already-closed issue fails harmlessly (|| true);
# posting a duplicate comment is acceptable but the close-guard makes re-runs
# cheap. Trigger: workflow_dispatch or push touching the fix log.

name: Round 14 Issue Closeout

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/audit_reports/FIX_LOG_2026-09-18_round14.md"
      - "docs/audit_reports/round14_comments/**"

permissions:
  issues: write
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post evidence comments and close fixed issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Issues fixed in Round 14 — post evidence, then close.
          CLOSE_LIST="437 438 444 445 448 454"
          # Issues with status updates only — comment, keep open.
          COMMENT_ONLY="430 431 432 433 434 442 446"

          for issue in $CLOSE_LIST $COMMENT_ONLY; do
            body_file="docs/audit_reports/round14_comments/${issue}.md"
            if [ -f "$body_file" ]; then
              gh issue comment "$issue" --body-file "$body_file" || \
                echo "::warning::comment on #$issue failed"
            else
              echo "::warning::missing comment body for #$issue"
            fi
          done

          for issue in $CLOSE_LIST; do
            state="$(gh issue view "$issue" --json state --jq .state || echo unknown)"
            if [ "$state" = "OPEN" ]; then
              gh issue close "$issue" --reason completed || \
                echo "::warning::close of #$issue failed"
              echo "closed #$issue"
            else
              echo "#$issue already $state — skipped"
            fi
          done

      - name: Summary
        run: |
          {
            echo "## Round 14 closeout"
            echo ""
            echo "Closed (fixed): #437 #438 #444 #445 #448 #454"
            echo "Commented (updated): #430 #431 #432 #433 #434 #442 #446"
            echo ""
            echo "Fix commits: 7feb0700 (#437), 7f0dfa82 (#438), dd40ed9e (#444/#445/#446/#448), c204db97 (#442)"
            echo "Full bilingual log: docs/audit_reports/FIX_LOG_2026-09-18_round14.md"
          } >> "$GITHUB_STEP_SUMMARY"
