version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # AUD/0.5 fix: the backend image listens on 8080 (PORT default in
    # backend/Dockerfile + main.py) — the previous 8000:8000 mapping made
    # local docker runs unreachable.
    ports:
      - "8080:8080"
    environment:
      # Uvicorn inside the container binds to this port.
      - PORT=8080
      - CHROMA_PERSIST_DIR=/app/data/chromadb_store
      - QDRANT_PERSIST_DIR=/app/data/qdrant_storage
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - supremeai_data:/app/data
    profiles:
      - default
      - full

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - local
      - full

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=supremeai
    ports:
      - "5432:5432"
    profiles:
      - local
      - full

volumes:
  supremeai_data:

