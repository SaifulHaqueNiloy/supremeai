services:
  - type: web
    name: supremeai-mcp-tower
    env: node
    # INF-03/INF-04 (issues #506/#507): without rootDir, Render ran every
    # command from the repo root: 'npm run start' hit the root package.json
    # (no 'start' script -> instant crash) and 'npm run build' invoked turbo,
    # which never compiled mcp-control-plane/src -> dist (node dist/index.js
    # ENOENT). With rootDir set, npm install (uses this package's own
    # package-lock.json), tsc build and 'npm run start' all resolve here.
    # The Infisical bootstrap is vendored under scripts/runtime/ inside this
    # package so the start command works without repo-root files.
    rootDir: infrastructure/mcp-control-plane
    buildCommand: pip install uv && npm install && npm run build
    startCommand: python scripts/runtime/infisical_bootstrap.py npm run start
    envVars:
      - key: MCP_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_SECRET_PATH
        value: /
      - key: INFISICAL_TOKEN
        sync: false
      - key: SUPREMEAI_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Task 4 fix: explicit backend path so MemorySubAdapter can find mcp_server.py
      # without relying on __dirname traversal (fragile when Render changes rootDir).
      # Render checks out the full repo; this points to backend/ from service root.
      - key: SUPREMEAI_BACKEND_DIR
        value: ../../backend

