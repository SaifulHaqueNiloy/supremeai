validation_rules:
- 'slot MUST match pattern: agent-[0-9]+'
- tool MUST be a non-empty string
- maintainer MUST be a GitHub username (starts with @)
- expires_on MUST be <= 7 days from assigned_on
- Only one active assignment per slot at a time
- 'Concurrency model (v2.1, replaces the old global cap): one agent per ISSUE (atomic claim)
  and one agent per BRANCH (15-min CAS acquisition, see acquisition_rules). No global active-slot
  cap — capacity is dynamic per pool, bounded by acquisition_rules.numeric_bound (=100).
  Resolves #1800 (Option D: dynamic pools).'
- 'Auto-expiry: assignments past expires_on are auto-deactivated'
usage:
- Maintainer edits this file directly via PR (protected scope per SECURITY_GUARDIAN.md)
- 'PR title: ''chore(agents): assign agent-N to <tool>'''
- Previous slot holder MUST be notified via @mention in PR description
- If slot is being transferred, old assignment's expires_on MUST be set to today

local_operators:
  local_ide:
    client_id: local_ide
    role: omni-role (admin)
    scopes: ['*']
    protocol: stdio
    notes: >-
      Local IDE (Cline, Antigravity IDE, Cursor). Unlike cloud-based autonomous slots
      with single fixed roles, Local IDE represents the primary developer environment.
      It has no single fixed role; it operates with omni-role capability across all slots and tools.
      MANDATORY: Local IDE is strictly bound by the 'No Claim, No Code' policy. Code must
      NEVER be modified or committed without a dedicated, claimed GitHub Issue.

