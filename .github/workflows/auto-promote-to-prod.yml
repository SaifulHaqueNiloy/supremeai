# এই ফাইলটা SECOND REPO-তে (SaifulHaqueNiloy/supremeai) বসবে:
#   path: .github/workflows/auto-promote-to-prod.yml
#
# লজিক:
# ১. supreme-core-ci.yml সম্পূর্ণ সফলভাবে শেষ হলেই (সব job pass) এটা ট্রিগার হয় — direct push-এ না।
# ২. main repo-তে সরাসরি push না করে একটা PR তৈরি করে (create-pull-request action / gh CLI)।
# ৩. যদি main repo-র branch protection-এ "Allow auto-merge" চালু থাকে এবং সেখানকার
#    required checks pass করে, তাহলে auto-merge enable করে দেয়।
#
# ==============================================================================
# বর্তমান আর্কিটেকচার (Current — One-Way):
#   SaifulHaqueNiloy  ──(CI Pass)──→  paykaribazaronline  →  Render
#
# ভবিষ্যতে Bidirectional Sync (Upgrade Path):
#   যদি ভবিষ্যতে paykaribazaronline থেকে SaifulHaqueNiloy-এ code পাঠাতে চান,
#   তাহলে paykaribazaronline-এ `sync-back-to-staging.yml` যোগ করুন।
#   সেক্ষেত্রে এই ফাইলে infinite loop এড়াতে নিচের diff check-এ
#   `sync-back-to-staging.yml` ও exclude করতে হবে:
#     ':(exclude).github/workflows/sync-back-to-staging.yml'
#   রেফারেন্স: implementation_plan.md (Bidirectional Sync Plan)
# ==============================================================================

name: 🚀 Promote Staging to Production (PR-based)

on:
  workflow_run:
    workflows: ["🧠 SupremeAI Core CI"]
    branches: [main]
    types:
      - completed

concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote:
    name: 🚀 Open PR → paykaribazaronline/supremeai
    runs-on: ubuntu-latest
    # শুধু staging/second repo-তে चलेगा, এবং শুধুই তখন যখন উপরের CI workflow সফল হয়েছে
    if: >
      github.repository == 'SaifulHaqueNiloy/supremeai' &&
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[NO-SYNC]')

    steps:
      - name: Checkout staging code (the exact commit that passed CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard — fail loudly if the promote token is missing
        env:
          TARGET_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo "❌ MAIN_REPO_TOKEN secret is not set in this (staging) repo's secrets."
            echo "   Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Push commit to a promotion branch on the main repo
        env:
          TARGET_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          # বাংলা মন্তব্য: checkout action-এর ডিফল্ট GITHUB_TOKEN সরাতে অতিরিক্ত হেডার আনসেট করা হচ্ছে, যাতে MAIN_REPO_TOKEN সঠিকভাবে কাজ করে।
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global user.name "SupremeAI Continuous Sync Bot"
          git config --global user.email "sync-bot@supremeai.dev"
          BRANCH="promote/staging-${{ github.event.workflow_run.head_sha }}"
          git remote add target "https://x-access-token:${TARGET_TOKEN}@github.com/paykaribazaronline/supremeai.git"
          # Git diff গার্ড — শুধু তখনই push করবে যখন target/main-এর সাথে আসল পার্থক্য থাকবে।
          # না থাকলে push/PR তৈরি করবে না, ফলে continuous loop বন্ধ হবে।
          echo "🔍 Checking for diff against target/main before pushing..."
          git fetch target main
          # শুধু এই promote workflow ফাইলটাকেই exclude করা হচ্ছে (নিজেকে নিজে ট্রিগার করা ঠেকাতে) —
          # বাকি সব .github/workflows/*.yml পরিবর্তন (CI fixes, new gates ইত্যাদি) এখন সঠিকভাবে promote হবে।
          if git diff --quiet target/main HEAD -- . ':(exclude).github/workflows/auto-promote-to-prod.yml'; then
            echo "✅ No code difference vs target/main — skipping push/PR to prevent infinite loop."
            echo "PROMOTE_BRANCH=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "⚠️ Difference detected — pushing promotion branch to target."
          git push target "HEAD:refs/heads/${BRANCH}" --force-with-lease -o ci.skip
          echo "PROMOTE_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Open (or update) the PR on the main repo
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ -z "${PROMOTE_BRANCH}" ]; then
            echo "✅ No promotion branch (no diff) — skipping PR creation."
            exit 0
          fi
          gh pr create \
            --repo paykaribazaronline/supremeai \
            --base main \
            --head "${PROMOTE_BRANCH}" \
            --title "🚀 Promote staging → production (CI-verified: ${{ github.event.workflow_run.head_sha }})" \
            --body "সব CI job (supreme-core-ci.yml) staging repo-তে pass করার পরে এই PR স্বয়ংক্রিয়ভাবে তৈরি হয়েছে। Commit: ${{ github.event.workflow_run.head_sha }}" \
            || echo "PR already exists for this branch — skipping create."

      - name: Enable auto-merge on the main repo (requires branch protection 'Allow auto-merge')
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          gh pr merge "${PROMOTE_BRANCH}" \
            --repo paykaribazaronline/supremeai \
            --squash \
            --auto \
            || echo "⚠️ Could not enable auto-merge — check that 'Allow auto-merge' is ON in the main repo's settings, and that this token has permission."
