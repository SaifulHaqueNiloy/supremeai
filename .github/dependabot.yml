# বাংলা মন্তব্য: Dependabot গ্রুপ আপডেট কনফিগারেশন — বিচ্ছিন্ন ১০টি PR-এর বদলে
# Flexible Group Branching ও 1 Group = 1 PR নীতি অনুযায়ী প্রতি ইকোসিস্টেমে ১টি একক গ্রুপ PR তৈরি হবে।
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      backend-dependencies:
        patterns:
          - "*"
    reviewers:
      - "SaifulHaqueNiloy"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    reviewers:
      - "SaifulHaqueNiloy"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"

