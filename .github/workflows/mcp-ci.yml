name: MCP Control Tower CI

on:
  push:
    branches:
      - main
      - feature/*
    paths:
      - "infrastructure/mcp-control-plane/**"
  pull_request:
    paths:
      - "infrastructure/mcp-control-plane/**"

jobs:
  build-and-test:
    name: Build & Verify MCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/mcp-control-plane

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infrastructure/mcp-control-plane/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Security Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --debug --only-verified
