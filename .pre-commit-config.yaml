# SupremeAI 2.0 — Git Pre-commit Hooks (Iron Curtain Local Defense)
# ================================================================
# বাংলা মন্তব্য: এই ফাইলটি git commit করার আগে স্বয়ংক্রিয়ভাবে
# ভাঙা JSON/TOML, মার্জ মার্কার, এবং debug statements লোকালি ব্লক করে।

repos:
  # ══════════════════════════════════════════════════════════════
  # ১. বেসিক ফাইল হেলথ চেক (File Integrity Gate & Gatekeepers)
  # ══════════════════════════════════════════════════════════════
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: 📄 YAML Syntactical Validator
        args: [--allow-multiple-documents]
        exclude: ^docs/.*\.yml$
      - id: check-json
        name: 🧱 JSON Gatekeeper (Validates Structural JSON)
        description: ভাঙা বা ম্যালফর্মড JSON ফাইলের কমিট ব্লক করে।
      - id: check-toml
        name: ⚙️ TOML Gatekeeper (Validates Structural TOML)
        description: pyproject.toml বা কনফিগ TOML ফাইলের সিনট্যাক্স লক করে।
      - id: check-merge-conflict
        name: ⚔️ Merge Conflict Shield
        description: কোডের ভেতর ভুল করে '<<<<<<< HEAD' মার্কার থাকলে কমিট ড্রপ করায়।
      - id: debug-statements
        name: 🕵️‍♂️ Debug Tracer Blocker
        description: পাইথন কোডে pdb.set_trace(), breakpoint() কল লোকালি আটকায়।
      - id: end-of-file-fixer
        name: 🏁 End of File Enforcer
      - id: trailing-whitespace
        name: 🧹 Trailing Whitespace Remover
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
        name: 🔑 SSH/SSL Private Key Blocker
        exclude: ^backend/tests/(byoc/test_cloud_connector\.py|test_byoc_endpoints\.py)$
      - id: check-ast
        name: 🐍 Python Syntax Gatekeeper (Check AST)
        description: পাইথন কোডে কোনো সিনট্যাক্স এরর (Syntax Error) থাকলে কমিট ব্লক করে।

  - repo: local
    hooks:
      - id: secret-hunter
        name: 🔍 SecretHunter (AI & Pattern Secret Scanner)
        entry: python scripts/devops/secret_scan_ci.py --staged
        language: system
        pass_filenames: false
        always_run: true

  # ══════════════════════════════════════════════════════════════
  # ৩. Python কোড কোয়ালিটি এবং আনসেফ ফিক্স (Ruff Engine + Unsafe-fixes)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: ruff
        name: ⚡ Ruff Linter (Matching CI Iron Curtain Gate)
        entry: python -m ruff check backend --config=backend/pyproject.toml --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: ruff-format
        name: 🎨 Ruff Formatter (PEP 8 Enforcer)
        entry: python -m ruff format backend --config=backend/pyproject.toml
        language: system
        pass_filenames: false

  # ══════════════════════════════════════════════════════════════
  # ৪. Python টাইপ চেকিং (Mypy Static Analyzer)
  # ══════════════════════════════════════════════════════════════
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-requests, types-PyYAML]
        exclude: |
          (?x)^(
            backend/tests/|
            backend/scripts/|
            backend/src/|
            backend/agents/devops/auto_healer\.py|
            scripts/health_check/auto_health_check\.py|
            scripts/testing/|
            scripts/security/|
            scripts/monitoring/|
            scripts/billing/|
            scripts/deploy/|
            scripts/ai/|
            scripts/i18n/|
            tests/scripts/
          )
        args: [--ignore-missing-imports, --no-strict-optional]

  # ══════════════════════════════════════════════════════════════
  # ৫. TypeScript / Frontend কোয়ালিটি (Strict ESLint Import Gate)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: eslint-frontend
        name: "🔍 ESLint Frontend Check (Strict Import Guard)"
        description: "TypeScript/TSX ফাইলে ESLint রান করে import order ও type error ধরে।"
        entry: pnpm -C apps/studio-client exec eslint --max-warnings=9999 src/ --ext .ts,.tsx
        language: system
        files: ^apps/studio-client/src/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-commit]

  # ══════════════════════════════════════════════════════════════
  # ৬. SupremeAI Security Guard & Router Smoke-Test (Local Defense)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      # বাংলা মন্তব্য: SupremeAI-এর নিজস্ব security scanner — commit করার আগে
      # hardcoded secrets, SQL injection, .env committed চেক করে।
      # Critical পেলে commit block হবে।
      - id: supremeai-blindspot-scan
        name: "🔐 SupremeAI Blind Spot Security Scanner"
        # বাংলা মন্তব্য: auto_find_blindspots.py নিজেই sys.stdout.reconfigure(utf-8) করে
        # তাই Windows-এ আলাদা encoding wrapper দরকার নেই
        entry: python scripts/security/auto_find_blindspots.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: stub-data-check
        name: "🚫 Gate 1 — Stub & Placeholder Data Blocker"
        entry: python scripts/find_stub_data.py --path . --fail-on HIGH
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: router-smoke-test
        name: "🔌 Router Import Smoke-Test (Gate 0 Local)"
        entry: python scripts/ci/validate_router_imports.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ══════════════════════════════════════════════════════════════
  # ৭. Free-Tier Size Guard (Render / GitHub / Vercel / Firebase)
  # ══════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      # বাংলা মন্তব্য: প্রতিটি commit-এর আগে free-tier পরিবেশের সাইজ লিমিট চেক করে।
      # 80% → warning, 95% → commit block
      # Covered: Render(500MB), GitHub Actions(8GB), Vercel(100MB), Firebase(1GB)
      - id: free-tier-size-guard
        name: "📏 Free-Tier Size Guard (Render/GitHub/Vercel/Firebase)"
        entry: python scripts/ci/check_free_tier_limits.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
