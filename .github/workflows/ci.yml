# SupremeAI CI/CD Pipeline — Hardened with SHA Pinning
# 🔒 v4.0: All actions pinned to full SHA (Supply Chain Security)
# 📊 Code coverage gates enabled (fail-under thresholds)

name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  # Coverage thresholds — fail build if below these values
  MIN_BACKEND_COVERAGE: 45
  MIN_FRONTEND_COVERAGE: 10

jobs:
  # -----------------------------------------------------------------
  # Job 1: Security Scan (Dependency Audit + Secret Detection)
  # -----------------------------------------------------------------
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master  # Use master for latest signatures
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@2d2ca4d3d6cc3b3fa13bb11574bdb7761763165b # v3.68.2
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: "--only-verified"

  # -----------------------------------------------------------------
  # Job 2: Backend Tests (pytest + coverage gate)
  # -----------------------------------------------------------------
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run linting
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/supremeai_test
          ENV: test
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          ALLOW_TEST_AUTH_BYPASS: "true"
        run: |
          poetry run pytest tests/ \
            --cov=core \
            --cov=api \
            --cov=services \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.MIN_BACKEND_COVERAGE }} \
            -v \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # -----------------------------------------------------------------
  # Job 3: Frontend Tests (vitest + coverage gate)
  # -----------------------------------------------------------------
  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit --strict

      - name: Lint check
        run: pnpm exec eslint src/ --ext .ts,.tsx --max-warnings=200

      - name: Run unit tests with coverage
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.thresholds.lines=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.functions=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.branches=${{ env.MIN_FRONTEND_COVERAGE }} \
            --coverage.thresholds.statements=${{ env.MIN_FRONTEND_COVERAGE }} \
            --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      # -----------------------------------------------------------------
      # Dead Code Detection (Knip)
      # -----------------------------------------------------------------
      - name: Check for dead code/files
        run: |
          pnpm exec knip --debug

  # -----------------------------------------------------------------
  # Job 4: Build Verification
  # -----------------------------------------------------------------
  build:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4  # SHA-pinned

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend
        working-directory: ./frontend
        env:
          NODE_ENV: production
          VITE_PORTAL_TYPE: user
          VITE_USER_BACKEND: https://ci-backend.example.com
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:user
          
      - name: Verify build output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "::error::Build output directory missing!"
            exit 1
          fi
          echo "Build size:"
          du -sh frontend/dist/*

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # -----------------------------------------------------------------
  # Deploy to Firebase (Frontend)
  # -----------------------------------------------------------------
  deploy-frontend:
    name: 🚀 Deploy Frontend
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://supremeai-a.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Download Frontend Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@5b73b1274a2229c7598af09e6e95addfb75f897b # master
        with:
          args: deploy --only hosting:user
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  # -----------------------------------------------------------------
  # Deploy Backend to GHCR (GitHub Container Registry)
  # -----------------------------------------------------------------
  deploy-backend-ghcr:
    name: 🐳 Push to GHCR
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-core

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6dea928373d6e5a4 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SVC_ID: ${{ secrets.RENDER_BACKEND_SVC_ID }}
        run: |
          python -c "
          import urllib.request, json, os
          svc_id = os.environ.get('RENDER_BACKEND_SVC_ID', '')
          if not svc_id:
              print('Skipping Render deploy - service ID not set')
          else:
              req = urllib.request.Request(
                  f'https://api.render.com/v1/services/{svc_id}/deploys',
                  headers={'Authorization': f'Bearer {os.environ[\"RENDER_API_KEY\"]}'},
                  method='POST'
              )
              with urllib.request.urlopen(req) as r:
                  print('Deploy triggered:', r.read().decode())
          "

  # -----------------------------------------------------------------
  # Deploy Cloudflare Worker (supremeai-edge)
  # -----------------------------------------------------------------
  deploy-cloudflare-worker:
    name: ⚡ Deploy Cloudflare Worker
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: 'infrastructure'
          command: deploy

  # -----------------------------------------------------------------
  # Notify on failure
  # -----------------------------------------------------------------
  notify-failure:
    name: 🚨 Notify on Failure
    needs: [deploy-frontend, deploy-backend-ghcr, deploy-cloudflare-worker]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.25.0
        with:
          payload: |
            {
              "text": "🚨 Deployment Failed",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Deployment Failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # -----------------------------------------------------------------
  # Smart Pipeline Summary
  # -----------------------------------------------------------------
  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security
      - backend-tests
      - frontend-tests
      - build
      - deploy-frontend
      - deploy-backend-ghcr
      - deploy-cloudflare-worker
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🧠 Generate Enhanced Pipeline Summary (v2)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_summary_v2.py
