# ============================================================
# SupremeAI - Prometheus Configuration
# Production-Ready Monitoring Setup
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'supremeai-monitor'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Rule files for alerting rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations for all services
scrape_configs:
  # ----------------------------------------------------------
  # SupremeAI FastAPI Backend
  # ----------------------------------------------------------
  - job_name: 'supremeai-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'supremeai-backend'
          environment: 'production'
          team: 'ai-platform'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'supremeai-backend'
    metric_relabel_configs:
      # Drop high-cardinality labels to prevent metric explosion
      - source_labels: [__name__]
        regex: 'http_request_duration_seconds_bucket|(request_|response_)size_bytes_bucket'
        action: labeldrop
        labels: ['endpoint']

  # ----------------------------------------------------------
  # PostgreSQL Database Metrics (postgres_exporter)
  # ----------------------------------------------------------
  - job_name: 'postgresql'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          environment: 'production'
    metric_relabel_configs:
      # Keep only essential database metrics
      - source_labels: [__name__]
        regex: 'pg_.*'
        action: keep

  # ----------------------------------------------------------
  # Redis Metrics (redis_exporter)
  # ----------------------------------------------------------
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          environment: 'production'

  # ----------------------------------------------------------
  # Node Exporter - System Metrics
  # ----------------------------------------------------------
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system-metrics'
          environment: 'production'

  # ----------------------------------------------------------
  # Docker Container Metrics (cAdvisor)
  # ----------------------------------------------------------
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'docker-containers'
          environment: 'production'

  # ----------------------------------------------------------
  # AI Agent System Metrics
  # ----------------------------------------------------------
  - job_name: 'ai-agents'
    scrape_interval: 10s
    metrics_path: '/api/v1/agents/metrics'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'ai-agent-system'
          environment: 'production'

  # ----------------------------------------------------------
  # HITL Engine Metrics
  # ----------------------------------------------------------
  - job_name: 'hitl-engine'
    scrape_interval: 5s
    metrics_path: '/api/v1/hitl/metrics'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'hitl-engine'
          environment: 'production'

  # ----------------------------------------------------------
  # Memory Service Metrics (pgvector)
  # ----------------------------------------------------------
  - job_name: 'memory-service'
    scrape_interval: 15s
    metrics_path: '/api/v1/memory/metrics'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'memory-service'
          environment: 'production'

  # ----------------------------------------------------------
  # LLM Provider External API Monitoring
  # ----------------------------------------------------------
  - job_name: 'llm-providers'
    scrape_interval: 30s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'llm-gateway'
          environment: 'production'
    metrics_path: '/api/v1/llm/metrics'

  # ----------------------------------------------------------
  # OpenTelemetry Collector (if using OTel instead of direct)
  # ----------------------------------------------------------
  - job_name: 'opentelemetry-collector'
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
          environment: 'production'
