# render.yaml - SupremeAI 2.0 Master Blueprint (Zero Cost Edition)
services:
  # 1. Backend (GHCR Image - Zero Render Build Minutes)
  - type: web
    name: supremeai-backend
    env: image
    image:
      url: ghcr.io/paykaribazaronline/supremeai/supremeai-backend:latest
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      # বাকি সিক্রেটগুলো ড্যাশবোর্ড থেকে সিঙ্ক হবে (Upstash & Supabase)
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL_POOLER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: SUPREMEAI_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPREMEAI_ENCRYPTION_KEY
        sync: false
      - key: SUPREMEAI_DOCS_PASSWORD
        sync: false
      - key: SUPREMEAI_API_TOKEN
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CI_WEBHOOK_SECRET
        sync: false
      - key: INFISICAL_TOKEN
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["https://supremeai-studio-client.onrender.com","https://supremeai-lac.vercel.app","https://supremeai-studio.vercel.app","https://supremeai-a.web.app"]'
      - key: USER_CORS_ORIGINS
        value: '["https://supremeai-studio-client.onrender.com","https://supremeai-lac.vercel.app","https://supremeai-studio.vercel.app","https://supremeai-a.web.app"]'
      # বাংলা মন্তব্য: ইউজার সার্ভিসের জন্যও ALLOWED_HOSTS স্পষ্ট সেট করা হলো (admin/worker-এর মতো)।
      # না থাকলেও config.py auto-populate করে, কিন্তু স্পষ্ট সেট থাকলে zero-trust Host
      # ভ্যালিডেশন নির্ভরযোগ্য ও স্বচ্ছ থাকে।
      - key: ALLOWED_HOSTS
        value: 'supremeai-backend.onrender.com'
      # বাংলা মন্তব্য: CI_WEBHOOK_SECRET production fail-fast (config.py line 924-935) প্রয়োজন।
      # admin service-এ এটি declared ছিল না, user-এ sync:false ছিল — সুসংগত করা হলো।
      - key: CI_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_CORS_ORIGINS
        value: '[]'
      # বাংলা মন্তব্য: core/app_user.py এই User-role instance-এ CORS_ORIGINS নয়, USER_CORS_ORIGINS
      # পড়ে এবং production-এ খালি থাকলে বুট-টাইমে crash করে (Fail-Fast) — তাই আলাদাভাবে সেট করা হলো।
      # https://supremeai-admin.web.app ইচ্ছাকৃতভাবে বাদ — User API অ্যাডমিন কনসোলকে ট্রাস্ট করে না
      # (সম্পূর্ণ আর্কিটেকচারাল আইসোলেশন; app_user.py-তেও denylist guard আছে)।
      # বাংলা মন্তব্য: SERVICE_ROLE explicit রাখা জরুরি — ডিফল্ট পরিবর্তন হলে admin routes user instance-এ leak হতে পারে।
      - key: SERVICE_ROLE
        value: user

  # 1.5. Admin Backend (Isolated Render instance — core/app_admin.py)
  # Note: Previously missing from render.yaml, now deployed as separate service for true isolation.
  # Separate domains/secrets mean user instance crash does not affect admin panel and vice versa.
  - type: web
    name: supremeai-admin
    env: image
    image:
      url: ghcr.io/paykaribazaronline/supremeai-backend:latest
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL_POOLER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: SUPREMEAI_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPREMEAI_ENCRYPTION_KEY
        sync: false
      - key: SUPREMEAI_DOCS_PASSWORD
        sync: false
      - key: SUPREMEAI_API_TOKEN
        sync: false
      - key: DISCORD_OTP_WEBHOOK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: INFISICAL_TOKEN
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      # বাংলা মন্তব্য: শুধমাত্র অ্যাডমিন কনসোল origin — Vercel/Netlify user client নয়
      - key: ADMIN_CORS_ORIGINS
        value: '["https://supremeai-admin.web.app"]'
      - key: SERVICE_ROLE
        value: admin
      # বাংলা মন্তব্ত: অ্যাডমিন সার্ভিসের জন্য প্রয়োজনীয় মিনিমাম রুট চেক ৫ সেট করা হলো
      - key: MIN_EXPECTED_ROUTES
        value: 5
      - key: ALLOWED_HOSTS
        value: 'supremeai-admin.onrender.com'

  # 2. Background Worker (Maintenance Pipeline, Sentinel, AutoHealer)
  # Runs cron-like background tasks without serving HTTP.
  # The web service also starts these in lifespan, but this worker provides
  # redundancy — if the web service restarts, the worker keeps monitoring.
  - type: worker
    name: supremeai-background-worker
    env: image
    image:
      url: ghcr.io/paykaribazaronline/supremeai-backend:latest
    region: singapore
    plan: free
    autoDeploy: true
    startCommand: "python -m core.worker_main"
    envVars:
      - key: ENV
        value: production
      - key: SERVICE_ROLE
        value: user
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_DATABASE_URL_POOLER
        sync: false
      - key: SUPREMEAI_JWT_SECRET
        sync: false
      - key: INFISICAL_TOKEN
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: ALLOWED_HOSTS
        value: 'supremeai-backend.onrender.com'

  # 3. Frontend (Render Free Static Hosting)
  # Build command and env vars explicitly set for correct backend URL.
  - type: web
    name: supremeai-studio-client
    env: static
    buildCommand: "cd apps/studio-client && pnpm install && pnpm run build:user"
    staticPublishPath: "./apps/studio-client/dist-user"
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://supremeai-backend.onrender.com
      - key: VITE_API_BASE
        value: https://supremeai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
