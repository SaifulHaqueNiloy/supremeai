# PR Gate — the ONE PR-side pipeline (epic #1850 Phase E / W1, issue #1857)
# ==============================================================================================
# Rename-by-addition from pr-pipeline.yml (kept whole, verbatim gate logic; the old file is a
# dispatch-only husk pending Tier-3 deletion). REQUIRED-CHECK STABILITY (branch protection):
#   - job `branch-naming-guard` name: "Branch Naming Guard"            (byte-identical)
#   - job `pr-gate` name: "🚦 Unified PR Gate (Security, Scope & Policy Orchestrator)"  (byte-identical)
# Absorbed (each body verbatim from its source file, trigger domain preserved):
#   branch-naming-guard.yml   -> job `branch-naming-guard` (Stage 0, ~10s, check-run emitter)
#   cross-pr-collision-guard.yml -> job `check-collisions` (strict mode #2002)
#   e2e-suites.yml            -> `pr-changes` filter + `e2e-guest` (PR arm, paths self-skip)
#                                + `e2e-customer`/`e2e-admin` (dispatch arms, legacy 06/07 semantics)
#   merge-learning-recorder.yml -> job `record-on-merge` (PR closed+merged / dispatch backfill)
#   constitution-governance.yml -> job `constitution` (PR paths arm; weekly arm already in
#                                  nightly-ops since Phase B)
# SG-11 lockstep: self-mod + constitution regexes inside `pr-gate` now track pr-gate.yml.
name: PR Gate (Unified Orchestrator)
on:
  pull_request:
    # epic #1850 Phase E / #1857: labeled/unlabeled re-evaluate the gate after label
    # transitions (queue/pr-gate labels — the gate's own label writes are idempotent,
    # so the re-run stabilizes after one pass); closed drives record-on-merge only
    # (every other job is closed-guarded).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - closed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to analyze (manual test)
        required: true
        type: string
      # ── on-demand E2E arms (absorbed from e2e-suites.yml dispatch semantics) ──
      run_e2e_guest:
        description: 'Run the guest suite (local preview build)'
        required: false
        default: false
        type: boolean
      run_e2e_customer:
        description: 'Run the customer suite (staging)'
        required: false
        default: false
        type: boolean
      run_e2e_admin:
        description: 'Run the admin suite'
        required: false
        default: false
        type: boolean
      use_staging:
        description: 'Guest/admin suites run against STAGING_URL instead of a local preview build'
        required: false
        default: false
        type: boolean
      e2e_base_url:
        description: 'App under test for the admin suite (defaults to QA_BASE_URL env or local vite preview)'
        required: false
        default: ''
        type: string

concurrency:
  # workflow_dispatch has no PR number — use run_id (#1852 P1): github.ref made
  # concurrent manual dispatches cancel each other; branch-naming-guard already uses run_id.
  group: pr-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Workflow-level permissions: contents: write is required for the reusable
# workflow (pr-helper.yml) which performs branch patch pushes and auto-merge.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Job 1: Unified PR Gate (Security, Scope & Policy Orchestrator)
  # Consolidates branch naming, scope detection, diff-based Guardian-Lite & Deep,
  # PR agent helper, and Security Decision Contract synthesis into 1 fast runner.
  # ============================================================================
  pr-gate:
    name: 🚦 Unified PR Gate (Security, Scope & Policy Orchestrator)
    # closed-guard (epic #1850 Phase E): on PR-close only record-on-merge runs
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions: explicitly limit write scope so security scanning
    # steps do not execute with broader write access than necessary.
    # contents:write is required only for git checkout with fetch-depth:0.
    permissions:
      contents: write   # git fetch --unshallow (fetch-depth: 0)
      pull-requests: write
      issues: write
      actions: read
      checks: write
    outputs:
      status: ${{ steps.contract.outputs.status }}
      risk_class: ${{ steps.contract.outputs.risk_class }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      evidence_summary: ${{ steps.contract.outputs.evidence_summary }}
      enqueued: ${{ steps.contract.outputs.enqueued }}
    steps:
      - name: Checkout (full history for merge-base and diff)
        # v7.0.1 — এই pin টি pr-helper.yml-এও ব্যবহৃত ও পরিচিত-ভালো (live-verified):
        # পুরনো 11d5960a pin-এ hosted runner-এর checkout নতুন base-side ফাইল
        # materialize করতে ব্যর্থ হচ্ছিল (dependabot PR-গুলোতে deterministic)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            PR="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            BRANCH="${{ github.event.pull_request.head.ref }}"
          else
            PR="${INPUT_PR_NUMBER}"
            HEAD_SHA="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
            BASE_REF="$(gh pr view "$PR" --json baseRefName -q .baseRefName)"
            BRANCH="$(gh pr view "$PR" --json headRefName -q .headRefName)"
          fi
          BASE_SHA="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA" 2>/dev/null || git merge-base "${BASE_REF}" "$HEAD_SHA" 2>/dev/null || git rev-parse "origin/${BASE_REF}" 2>/dev/null || git rev-parse "${BASE_REF}")"
          
          # Sync working directory to HEAD commit
          git checkout -q "$HEAD_SHA" 2>/dev/null || true

          {
            echo "pr_number=$PR"
            echo "head_sha=$HEAD_SHA"
            echo "base_sha=$BASE_SHA"
            echo "base_ref=$BASE_REF"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "PR=$PR head=$HEAD_SHA base=$BASE_SHA base_ref=$BASE_REF branch=$BRANCH"

      - name: Validate branch name against OPS-06 regex
        id: validate_branch
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail
          BRANCH="${BRANCH_NAME:-}"
          echo "Branch: $BRANCH"

          # OPS-06 Safeguard 4 regex — kept in sync with branch-naming-guard.yml.
          # Bot prefixes (dependabot/github-actions/renovate/pr-helper) EXEMPT:
          # naming gate block করলে dependency PR auto-merge অসম্ভব হয়ে যায়।
          VALID_PATTERN='^((planner|coder|pr-helper|ci|platform|browser|super)-[0-9]+(-[a-zA-Z0-9_-]+)?|agent-[a-zA-Z0-9_-]+/issue-[0-9]+-.+|agent-[0-9]+(-[a-zA-Z0-9_-]+)?|feat/.+|fix/.+|hotfix/.+|perf/.+|chore/.+|test/.+|docs/.+|refactor/.+|ci/.+|dependabot/.+|github-actions/.+|renovate/.+|pr-helper/.+|develop|main)$'

          if [[ "$BRANCH" =~ $VALID_PATTERN ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ Branch name '$BRANCH' matches OPS-06 pattern"
            gh pr edit "$PR_NUMBER" --remove-label "branch:invalid" 2>/dev/null || true
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "❌ Branch name '$BRANCH' does NOT match OPS-06 pattern"
            echo "Expected one of: agent-N (persistent slot per AGENTS.md Sec 4), agent-N/issue-N-slug, feat/, fix/, hotfix/, perf/, chore/, test/, docs/, refactor/, ci/"

            gh label create "branch:invalid" --color "D93F0B" \
              --description "Branch name does not match OPS-06 regex" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "branch:invalid" 2>/dev/null || true

            cat > /tmp/branch-error.md << 'MD'
          ## ❌ Branch Naming Violation (GAP-05 / OPS-06 Safeguard 4)

          এই PR-এর branch name OPS-06 স্ট্যান্ডার্ড প্যাটার্নে মেলে না।

          **Valid patterns:**
          - `agent-N` (persistent agent slot per AGENTS.md Sec 4, e.g., `agent-2`) or `agent-N/issue-N-<slug>` (legacy, e.g., `agent-1/issue-900-fix-login`)
          - `feat/<slug>` (feature work)
          - `fix/<slug>` (bug fixes)
          - `hotfix/<slug>` (urgent production fixes)
          - `perf/<slug>` (performance improvements)
          - `chore/<slug>` (maintenance)
          - `test/<slug>` (test branches)
          - `docs/<slug>` (documentation)
          - `refactor/<slug>` (refactoring)
          - `ci/<slug>` (CI/CD changes)
          - Bot prefixes (exempt): `dependabot/`, `github-actions/`, `renovate/`, `pr-helper/`

          **Action required:** branch rename করুন অথবা maintainer-এর অনুমতি নিন।
          MD
            gh pr comment "$PR_NUMBER" --body-file /tmp/branch-error.md 2>/dev/null || true
            echo "::error::Branch name '$BRANCH' violates OPS-06 naming convention"
            exit 1
          fi

      - name: Classify scope & risk (reads security/policies/protected-scopes.yml)
        id: classify
        env:
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import yaml

          base_sha = os.environ.get('BASE_SHA', '')
          head_sha = os.environ.get('HEAD_SHA', '')
          if not base_sha or not head_sha:
              print('::error::BASE_SHA/HEAD_SHA missing — cannot classify scope')
              sys.exit(2)

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base_sha}...{head_sha}'],
              text=True,
          ).strip().split('\n')
          changed = [c for c in changed if c]

          with open('security/policies/protected-scopes.yml', encoding='utf-8') as f:
              policy = yaml.safe_load(f)
          protected_entries = policy.get('protected_scopes', []) or []
          protected_patterns = [p['path'] for p in protected_entries]

          def matches_pattern(path: str, pattern: str) -> bool:
              if pattern.endswith('/**'):
                  prefix = pattern[:-3]
                  return path == prefix or path.startswith(prefix + '/')
              if pattern.endswith('**'):
                  return path.startswith(pattern[:-2])
              return path == pattern

          touched_patterns = []
          for pattern in protected_patterns:
              if any(matches_pattern(p, pattern) for p in changed):
                  touched_patterns.append(pattern)

          protected_touched = len(touched_patterns) > 0

          def any_match(regex: str) -> bool:
              pat = re.compile(regex)
              return any(pat.search(p) for p in changed)

          security_changed     = any_match(r'^(backend/core/security/|security/|docs/security/)')
          auth_changed         = any_match(r'^(backend/api/routes/.*auth.*\.py|backend/core/firebase_auth\.py)$')
          hitl_changed         = any_match(r'^backend/services/hitl/')
          workflows_changed    = any_match(r'^\.github/workflows/')
          code_changed         = any_match(r'^(backend/|services/|scripts/)')
          frontend_changed     = any_match(r'^frontend/')
          constitution_changed = any_match(
              r'^(docs/security/SECURITY_GUARDIAN\.md|security/policies/|'
              r'\.github/workflows/pr-gate\.yml|\.github/workflows/pr-helper\.yml|'
              r'\.github/scripts/pr_helper/)'
          )

          self_mod_patterns = [
              r'^\.github/workflows/pr-helper\.yml$',
              r'^\.github/workflows/pr-gate\.yml$',
              r'^\.github/scripts/pr_helper/',
              r'^docs/security/SECURITY_GUARDIAN\.md$',
              r'^security/policies/',
          ]
          self_mod = any(any_match(p) for p in self_mod_patterns)

          if protected_touched:
              risk_class = 'CRITICAL'
          elif auth_changed or hitl_changed or workflows_changed:
              risk_class = 'HIGH'
          elif security_changed:
              risk_class = 'HIGH'
          elif code_changed:
              risk_class = 'MEDIUM'
          else:
              risk_class = 'LOW'

          out = os.environ.get('GITHUB_OUTPUT', '')
          with open(out, 'a', encoding='utf-8') as f:
              f.write(f'risk_class={risk_class}\n')
              f.write(f'security_changed={"true" if security_changed else "false"}\n')
              f.write(f'auth_changed={"true" if auth_changed else "false"}\n')
              f.write(f'hitl_changed={"true" if hitl_changed else "false"}\n')
              f.write(f'workflows_changed={"true" if workflows_changed else "false"}\n')
              f.write(f'code_changed={"true" if code_changed else "false"}\n')
              f.write(f'frontend_changed={"true" if frontend_changed else "false"}\n')
              f.write(f'constitution_changed={"true" if constitution_changed else "false"}\n')
              f.write(f'protected_scope_touched={"true" if protected_touched else "false"}\n')
              f.write(f'self_modification_detected={"true" if self_mod else "false"}\n')
              f.write(f'protected_scope_paths={json.dumps(touched_patterns)}\n')
              f.write(f'changed_files_count={len(changed)}\n')

          print(f'risk_class={risk_class}')
          print(f'protected_scope_touched={protected_touched} paths={touched_patterns}')
          print(f'self_modification_detected={self_mod}')
          print(f'changed_files_count={len(changed)}')
          if protected_touched:
              print('::warning::Protected scope touched — Guardian-Deep + mandatory human review will be required (SG-11/SG-12)')
          if self_mod:
              print('::warning::Self-modification of Guardian/PR-Helper logic detected (SG-11) — status will be REVIEW, auto-merge disabled')
          PY

      # ── Dependency-bump classification (semver-aware merge policy) ───────────
      # dependabot PR কিনা চেনে এবং bump class নির্ণয় করে:
      #   patch/minor → auto-merge eligible (dependency_delta REVIEW downgrade)
      #   major/unknown → human review mandatory (fail-closed)
      # Policy single source of truth: .github/scripts/pr_helper/dependabot_classify.py
      - name: Classify dependency bump (dependabot semver policy)
        id: deps_classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          # বাংলা: event payload প্রাথমিক উৎস — GraphQL eventual-consistency
          # window-এ (reopen/push-এর ঠিক পরে) gh pr view ফেল করতে পারে; event
          # ডেটা ১০০% reliable। (injection-safe: env var mapping)
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          TITLE="${EVENT_TITLE:-}"
          AUTHOR="${EVENT_AUTHOR:-}"
          # workflow_dispatch-এ event payload নেই — retry সহ API fallback
          if [[ -z "$TITLE" || -z "$AUTHOR" ]]; then
            for i in 1 2 3; do
              TITLE="$(gh pr view "$PR_NUMBER" --json title -q .title 2>/dev/null || true)"
              AUTHOR="$(gh pr view "$PR_NUMBER" --json author -q .author.login 2>/dev/null || true)"
              [[ -n "$TITLE" && -n "$AUTHOR" ]] && break
              sleep 10
            done
          fi
          # SG-08 fail-safe: classifier INLINE — dependabot branch-গুলোর পুরনো tree-তে
          # নতুন base-side script ফাইল থাকে না এবং hosted runner-এর merge-ref
          # worktree-তেও সেগুলো materialize হয় না (deterministic anomaly)।
          # Canonical copy: .github/scripts/pr_helper/dependabot_classify.py
          python3 - "$TITLE" "$AUTHOR" <<'PY' > /tmp/deps_classify.json
          import json, re, sys
          title, author = sys.argv[1], sys.argv[2]
          BUMP_RE = re.compile(
              r"^chore\(deps(?:-dev)?\): bump\s+(?P<pkg>.+?)\s+from\s+"
              r"(?P<frm>\S+)\s+to\s+(?P<to>\S+)(?:\s+in\s+.+)?$"
          )
          DEPENDABOT_AUTHORS = {"dependabot[bot]", "dependabot-preview[bot]"}
          is_dep = (author or "").strip() in DEPENDABOT_AUTHORS
          pkg = frm = to = ""
          bump_class = "none"
          if is_dep:
              m = BUMP_RE.match((title or "").strip())
              if m:
                  pkg, frm, to = m.group("pkg"), m.group("frm"), m.group("to")
                  def segs(v):
                      return v.lstrip("v").split(".")
                  try:
                      a, b = segs(frm), segs(to)
                      n = max(len(a), len(b))
                      a += ["0"] * (n - len(a))
                      b += ["0"] * (n - len(b))
                      ai, bi = [int(x) for x in a], [int(x) for x in b]
                      if ai[0] != bi[0]:
                          bump_class = "major"
                      elif len(ai) > 1 and ai[1] != bi[1]:
                          bump_class = "minor"
                      elif ai != bi:
                          bump_class = "patch"
                      else:
                          bump_class = "unknown"
                  except (ValueError, AttributeError):
                      bump_class = "unknown"
              else:
                  bump_class = "unknown"
          print(json.dumps({
              "is_dependabot": is_dep,
              "bump_class": bump_class,
              "package": pkg,
              "from_version": frm,
              "to_version": to,
              "auto_merge_eligible": is_dep and bump_class in ("patch", "minor"),
          }))
          PY
          {
            echo "is_dependabot=$(python3 -c "import json;print(str(json.load(open('/tmp/deps_classify.json'))['is_dependabot']).lower())")"
            echo "bump_class=$(python3 -c "import json;print(json.load(open('/tmp/deps_classify.json'))['bump_class'])")"
            echo "dep_package=$(python3 -c "import json;print(json.load(open('/tmp/deps_classify.json'))['package'])")"
            echo "auto_merge_eligible=$(python3 -c "import json;print(str(json.load(open('/tmp/deps_classify.json'))['auto_merge_eligible']).lower())")"
          } >> "$GITHUB_OUTPUT"

      # ── Guardian-Lite Scanning Scope (Policy Note) ─────────────────────────────
      # This step scans ONLY lines added in the PR diff (`git diff -U0` additions).
      # This is a deliberate policy trade-off (SG-10: No Evidence → No Verdict):
      #   BENEFIT: eliminates false-positive BLOCKs from pre-existing documentation
      #            or legacy code that was not changed by this PR.
      #   BOUNDARY: pre-existing secrets in untouched lines of modified files are
      #             NOT detected here. They are caught by the scheduled deep audit
      #             workflow (scheduled-deep-audit.yml) and release preflight scans.
      # PR Gate ≠ Repository-Wide Security Audit — both are necessary.
      - name: Guardian-Lite scan (diff-based secret leaks + dangerous shell + workflow perms)
        id: guardian_lite
        env:
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          base_sha = os.environ.get('BASE_SHA', '')
          head_sha = os.environ.get('HEAD_SHA', '')
          violations_file = '/tmp/guardian-lite-violations.jsonl'
          output_file = os.environ.get('GITHUB_OUTPUT', '')

          if not base_sha or not head_sha:
              print('::error::BASE_SHA or HEAD_SHA missing for Guardian-Lite scan')
              sys.exit(1)

          try:
              diff_output = subprocess.check_output(
                  ['git', 'diff', '-U0', '--no-color', f'{base_sha}...{head_sha}'],
                  text=True,
                  errors='replace',
              )
          except subprocess.CalledProcessError as e:
              print(f'::error::git diff failed with exit code {e.returncode}')
              sys.exit(1)

          diff_header_re = re.compile(r'^diff --git a/(.*?) b/(.*)$')
          hunk_header_re = re.compile(r'^@@\s+-[0-9]+(?:,[0-9]+)?\s+\+([0-9]+)(?:,[0-9]+)?\s+@@')

          current_file = None
          new_line_idx = 0
          added_lines = []

          for raw_line in diff_output.splitlines():
              m_diff = diff_header_re.match(raw_line)
              if m_diff:
                  current_file = m_diff.group(2)
                  continue
              if raw_line.startswith('+++ /dev/null'):
                  current_file = None
                  continue
              if raw_line.startswith('+++ ') or raw_line.startswith('--- '):
                  continue
              m_hunk = hunk_header_re.match(raw_line)
              if m_hunk:
                  new_line_idx = int(m_hunk.group(1))
                  continue
              if raw_line.startswith('+'):
                  if current_file:
                      added_lines.append((current_file, new_line_idx, raw_line[1:]))
                      new_line_idx += 1
              elif not raw_line.startswith('-'):
                  new_line_idx += 1

          PATTERNS = [
              # Secret leak patterns (BLOCK)
              ('aws_access_key_id', r'AKIA[0-9A-Z]{16}', 'BLOCK', 'secret'),
              ('aws_secret_access_key', r'(?i)aws.{0,20}(?:secret|priv).{0,5}[\x27"]?[A-Za-z0-9/+=]{40}', 'BLOCK', 'secret'),
              ('github_token', r'gh[pousr]_[A-Za-z0-9]{36}', 'BLOCK', 'secret'),
              ('github_pat', r'github_pat_[A-Za-z0-9_]{22,}', 'BLOCK', 'secret'),
              ('slack_token', r'xox[baprs]-[A-Za-z0-9-]{10,}', 'BLOCK', 'secret'),
              ('stripe_secret_key', r'sk_live_[A-Za-z0-9]{24,}', 'BLOCK', 'secret'),
              ('private_key_block', r'-----BEGIN [A-Z ]*PRIVATE KEY-----', 'BLOCK', 'secret'),
              ('google_api_key', r'AIza[0-9A-Za-z_-]{35}', 'BLOCK', 'secret'),
              ('jwt_secret_hardcoded', r'(?i)(jwt[_-]?secret|jwt[_-]?key).{0,5}[\x27"][A-Za-z0-9]{16,}[\x27"]', 'BLOCK', 'secret'),
              ('generic_password_assign', r'(?i)(password|passwd|pwd).{0,3}[=:].{0,5}[\x27"][^\x27"]{8,}[\x27"]', 'REVIEW', 'secret'),

              # Dangerous shell patterns
              ('eval_dollar', r'eval\s+\$', 'BLOCK', 'shell'),
              ('curl_pipe_shell', r'curl\s.*\|\s*(sh|bash|zsh)', 'BLOCK', 'shell'),
              ('wget_pipe_shell', r'wget\s.*\|\s*(sh|bash|zsh)', 'BLOCK', 'shell'),
              ('sudo_curl_pipe_sh', r'sudo\s.*curl.*\|.*(sh|bash)', 'BLOCK', 'shell'),
              ('chmod_777', r'chmod\s+777', 'REVIEW', 'shell'),
              ('disable_set_e', r'set\s+\+e', 'REVIEW', 'shell'),

              # Workflow permission audit (restricted to workflow files)
              ('workflow_perm_write', r'permissions:.*:.*write', 'REVIEW', 'workflow'),
              ('pull_request_target', r'pull_request_target:', 'REVIEW', 'workflow'),
          ]

          compiled = [(name, re.compile(reg), sev, cat) for name, reg, sev, cat in PATTERNS]

          violations = []
          secret_leaks = 0
          dangerous_shell = 0
          workflow_perms = 0

          for file_path, line_no, content in added_lines:
              for name, pat, sev, cat in compiled:
                  if cat == 'workflow' and not file_path.startswith('.github/workflows/'):
                      continue
                  if pat.search(content):
                      snippet = content[:200].replace('"', "'")
                      record = {
                          'category': name,
                          'severity': sev,
                          'type': cat,
                          'file': file_path,
                          'line': line_no,
                          'snippet': snippet,
                      }
                      violations.append(record)
                      if cat == 'secret':
                          secret_leaks += 1
                      elif cat == 'shell':
                          dangerous_shell += 1
                      elif cat == 'workflow':
                          workflow_perms += 1

          total = len(violations)
          with open(violations_file, 'w', encoding='utf-8') as f:
              for v in violations:
                  f.write(json.dumps(v) + '\n')

          if output_file:
              with open(output_file, 'a', encoding='utf-8') as f:
                  f.write(f'violations_count={total}\n')
                  f.write(f'secret_leaks_count={secret_leaks}\n')
                  f.write(f'dangerous_shell_count={dangerous_shell}\n')
                  f.write(f'workflow_perms_count={workflow_perms}\n')
                  f.write(f'violations_found={"true" if total > 0 else "false"}\n')

          print(f'Guardian-Lite: {total} findings (secrets={secret_leaks} shell={dangerous_shell} perms={workflow_perms})')
          if total > 0:
              print(f'::warning::Guardian-Lite found {total} findings in PR diff additions')
              for v in violations[:20]:
                  print(f"  [{v['severity']}] {v['category']} in {v['file']}:{v['line']} -> {v['snippet']}")
          else:
              print('::notice::Guardian-Lite: no findings in PR diff additions')
          PY

      - name: Guardian-Deep security analysis
        id: deep
        if: steps.classify.outputs.risk_class == 'HIGH' || steps.classify.outputs.risk_class == 'CRITICAL' || steps.classify.outputs.protected_scope_touched == 'true'
        env:
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          IS_DEPENDABOT: ${{ steps.deps_classify.outputs.is_dependabot }}
          BUMP_CLASS: ${{ steps.deps_classify.outputs.bump_class }}
        run: |
          set -uo pipefail
          BASE="$BASE_SHA"
          HEAD="$HEAD_SHA"

          DEEP_FILE=/tmp/guardian-deep-findings.jsonl
          : > "$DEEP_FILE"
          AUTH_BOUNDARY="false"
          HITL_BYPASS="false"
          DEP_DELTA="false"
          WORKFLOW_TARGET_MISSING="false"

          # ---- Check 1: Auth boundary regression (BLOCK) ----
          AUTH_REMOVED=$(git diff "${BASE}...${HEAD}" -- 'backend/api/routes/auth.py' 'backend/api/routes/admin_auth.py' 'backend/core/firebase_auth.py' 'backend/api/dependencies.py' 'backend/core/security/' 2>/dev/null \
            | grep -E '^-' | grep -v '^---' \
            | grep -E '(@requires_auth|@require_auth|@admin_only|require_admin|get_current_user|verify_jwt|check_permission|tenant_id|verify_tenant)' \
            || true)
          if [[ -n "$AUTH_REMOVED" ]]; then
            printf '{"category":"auth_boundary_regression","severity":"BLOCK","evidence":"authentication/authorization protections removed in diff"}\n' >> "$DEEP_FILE"
            AUTH_BOUNDARY="true"
            echo "::error::Auth boundary regression detected — protections removed (SG-07)"
          fi

          # ---- Check 2: HITL bypass (BLOCK) ----
          HITL_DIFF=$(git diff "${BASE}...${HEAD}" -- 'backend/services/hitl/' 2>/dev/null \
            | grep -E '^[+-]' | grep -v '^+++' | grep -v '^---' \
            | grep -iE '(auto.?approve|skip.?review|bypass|disable.?review|always.?allow|force.?approve|review_required.{0,5}=.{0,5}false)' \
            || true)
          if [[ -n "$HITL_DIFF" ]]; then
            printf '{"category":"hitl_bypass","severity":"BLOCK","evidence":"HITL enforcement weakening pattern detected"}\n' >> "$DEEP_FILE"
            HITL_BYPASS="true"
            echo "::error::HITL bypass pattern detected (SG-09/SG-12)"
          fi

          # ---- Check 3: Dependency delta (REVIEW) ----
          # বাংলা: dependabot-এর patch/minor bump হলে supply-chain delta আলাদা করে
          # review চাওয়া হয় না — Helper-এর BASE/HEAD diagnostic + CI-ই আসল গেট;
          # major/unknown bump সবসময় human review-তে যাবে (fail-closed)।
          DEP_FILES=$(git diff --name-only "${BASE}...${HEAD}" 2>/dev/null \
            | grep -E '(poetry\.lock|package-lock\.json|pnpm-lock\.yaml|requirements.*\.txt|pyproject\.toml|package\.json)$' \
            || true)
          DEP_TRIVIAL_BUMP="false"
          if [[ "$IS_DEPENDABOT" == "true" && ("$BUMP_CLASS" == "patch" || "$BUMP_CLASS" == "minor") ]]; then
            DEP_TRIVIAL_BUMP="true"
          fi
          if [[ -n "$DEP_FILES" ]]; then
            if [[ "$DEP_TRIVIAL_BUMP" == "true" ]]; then
              echo "::notice::Dependency delta (dependabot ${BUMP_CLASS} bump) — auto-merge eligible, Helper diagnostic gate applies"
            else
              printf '{"category":"dependency_delta","severity":"REVIEW","evidence":"Dependency manifest changed — review for supply-chain risk"}\n' >> "$DEEP_FILE"
              DEP_DELTA="true"
              echo "::notice::Dependency delta detected: $DEP_FILES"
            fi
          fi

          # ---- Check 4: workflow_call target integrity (REVIEW/BLOCK) ----
          WORKFLOW_DIFF=$(git diff --name-only "${BASE}...${HEAD}" 2>/dev/null \
            | grep -E '^\.github/workflows/.*\.ya?ml$' || true)
          if [[ -n "$WORKFLOW_DIFF" ]]; then
            while IFS= read -r wf; do
              [[ -z "$wf" ]] && continue
              [[ -f "$wf" ]] || continue
              while IFS=: read -r ln content; do
                [[ -z "$content" ]] && continue
                target=$(echo "$content" | sed -E 's/.*uses:[[:space:]]*(\S+).*/\1/' | sed 's|@.*||')
                if [[ "$target" == ./.github/workflows/* ]]; then
                  full_path="${target#./}"
                  if [[ ! -f "$full_path" ]]; then
                    printf '{"category":"workflow_call_target_missing","severity":"BLOCK","file":"%s","line":%s,"target":"%s","evidence":"workflow_call target does not exist"}\n' "$wf" "$ln" "$target" >> "$DEEP_FILE"
                    WORKFLOW_TARGET_MISSING="true"
                    echo "::error::workflow_call target missing: $wf → $target"
                  else
                    if ! grep -qE '^[[:space:]]*workflow_call:' "$full_path" 2>/dev/null; then
                      printf '{"category":"workflow_call_no_trigger","severity":"REVIEW","file":"%s","line":%s,"target":"%s","evidence":"target lacks workflow_call: trigger"}\n' "$wf" "$ln" "$target" >> "$DEEP_FILE"
                      WORKFLOW_TARGET_MISSING="true"
                      echo "::warning::workflow_call target lacks trigger: $wf → $target"
                    fi
                  fi
                fi
              done < <(grep -nE '^[[:space:]]*uses:[[:space:]]*\./\.github/workflows/' "$wf" 2>/dev/null || true)
            done <<< "$WORKFLOW_DIFF"
          fi

          DEEP_COUNT=$(wc -l < "$DEEP_FILE" 2>/dev/null || echo 0)
          DEEP_COUNT=${DEEP_COUNT// /}

          {
            echo "deep_violations_count=$DEEP_COUNT"
            echo "auth_boundary_regression=$AUTH_BOUNDARY"
            echo "hitl_bypass=$HITL_BYPASS"
            echo "dependency_delta=$DEP_DELTA"
            echo "workflow_call_target_missing=$WORKFLOW_TARGET_MISSING"
            if [[ $DEEP_COUNT -gt 0 ]]; then
              echo "deep_violations=true"
            else
              echo "deep_violations=false"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "Guardian-Deep: $DEEP_COUNT findings"
          if [[ -s "$DEEP_FILE" ]]; then
            cat "$DEEP_FILE"
          else
            echo "::notice::Guardian-Deep: no findings"
          fi

      - name: PR Agent Helper (Issue Link + Preservation Guard)
        id: agent_helper
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr_number }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          # This step is intentionally non-fatal: it emits advisory signals.
          # Internal errors (e.g. python3 failure in deletion check) are captured
          # via HELPER_INTERNAL_ERROR and surfaced to the contract step as WARN.
          HELPER_INTERNAL_ERROR=0
          set +o errexit  # non-fatal: helper signals advisory info only
          PR_BODY="$(gh pr view "$PR" --json body -q .body 2>/dev/null || echo '')"
          PR_TITLE="$(gh pr view "$PR" --json title -q .title 2>/dev/null || echo '')"

          ISSUE_REFS=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -ioE '(close[sd]?|fix(es|ed)?|resolve[sd]?|refs?|see)[[:space:]]+#[0-9]+' \
            | grep -oE '#[0-9]+' | sort -u | tr '\n' ' ' | sed 's/ $//')

          if [[ -n "$ISSUE_REFS" ]]; then
            echo "issue_linked=true" >> "$GITHUB_OUTPUT"
            echo "issue_refs=$ISSUE_REFS" >> "$GITHUB_OUTPUT"
            # AUDIT-FIX (#2006 via PR #2016, folded with credit): count issue refs —
            # Rule #4 "1 ISSUE = 1 PR" is enforced in the contract step's BLOCK_COUNT.
            ISSUE_COUNT=$(printf '%s' "$ISSUE_REFS" | tr ' ' '\n' | grep -c '#' || true)
            echo "issue_count=$ISSUE_COUNT" >> "$GITHUB_OUTPUT"
            echo "::notice::PR linked to issue(s): $ISSUE_REFS (count=$ISSUE_COUNT)"
          else
            echo "issue_linked=false" >> "$GITHUB_OUTPUT"
            echo "issue_refs=" >> "$GITHUB_OUTPUT"
            echo "::warning::No issue reference found in PR title/body — recommend 'Closes #N' or 'Refs #N'"
          fi

          DELETED_FILES=$(git diff --name-only --diff-filter=D "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null || echo "")
          DELETED_PROTECTED_COUNT=0
          PRESERVATION_OK=true

          if [[ -n "$DELETED_FILES" ]] && [[ -f security/policies/protected-scopes.yml ]]; then
            DELETED_PROTECTED_COUNT=$(printf '%s\n' "$DELETED_FILES" | python3 -c "
          import sys, yaml
          deleted = [l.strip() for l in sys.stdin if l.strip()]
          with open('security/policies/protected-scopes.yml') as f:
              policy = yaml.safe_load(f)
          patterns = [p['path'] for p in (policy.get('protected_scopes') or [])]
          hits = 0
          for path in deleted:
              for pat in patterns:
                  if pat.endswith('/**'):
                      if path.startswith(pat[:-3]):
                          hits += 1; break
                  elif path == pat:
                      hits += 1; break
          print(hits)
          " 2>/dev/null || { HELPER_INTERNAL_ERROR=1; echo 0; })

            if [[ "$DELETED_PROTECTED_COUNT" -gt 0 ]]; then
              PRESERVATION_OK=false
              echo "::warning::Protected file deletion detected ($DELETED_PROTECTED_COUNT files) — pr-gate will BLOCK"
            fi
          fi

          echo "preservation_guard_ok=$PRESERVATION_OK" >> "$GITHUB_OUTPUT"
          echo "deleted_protected_count=$DELETED_PROTECTED_COUNT" >> "$GITHUB_OUTPUT"

          if [[ "$PRESERVATION_OK" == "true" ]]; then
            echo "::notice::Preservation guard passed — no protected files deleted"
          fi
          echo "helper_internal_error=$HELPER_INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Synthesize Security Decision Contract
        id: contract
        if: always() && steps.meta.conclusion == 'success' && steps.validate_branch.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr_number }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          RISK_CLASS: ${{ steps.classify.outputs.risk_class }}
          PROTECTED_SCOPE: ${{ steps.classify.outputs.protected_scope_touched }}
          SELF_MOD: ${{ steps.classify.outputs.self_modification_detected }}
          PROTECTED_PATHS: ${{ steps.classify.outputs.protected_scope_paths }}
          CHANGED_FILES_COUNT: ${{ steps.classify.outputs.changed_files_count }}
          LITE_VIOLATIONS: ${{ steps.guardian_lite.outputs.violations_found }}
          LITE_COUNT: ${{ steps.guardian_lite.outputs.violations_count }}
          SECRET_LEAKS: ${{ steps.guardian_lite.outputs.secret_leaks_count }}
          SHELL_VIOLATIONS: ${{ steps.guardian_lite.outputs.dangerous_shell_count }}
          PERMS_VIOLATIONS: ${{ steps.guardian_lite.outputs.workflow_perms_count }}
          CLASSIFY_RESULT: ${{ steps.classify.conclusion }}
          LITE_RESULT: ${{ steps.guardian_lite.conclusion }}
          DEEP_CONCLUSION: ${{ steps.deep.conclusion }}
          DEEP_RESULT: ${{ steps.deep.outcome }}
          DEEP_VIOLATIONS: ${{ steps.deep.outputs.deep_violations }}
          DEEP_COUNT: ${{ steps.deep.outputs.deep_violations_count }}
          AUTH_BOUNDARY: ${{ steps.deep.outputs.auth_boundary_regression }}
          HITL_BYPASS: ${{ steps.deep.outputs.hitl_bypass }}
          HELPER_RESULT: ${{ steps.agent_helper.conclusion }}
          HELPER_INTERNAL_ERROR: ${{ steps.agent_helper.outputs.helper_internal_error }}
          IS_DEPENDABOT: ${{ steps.deps_classify.outputs.is_dependabot }}
          BUMP_CLASS: ${{ steps.deps_classify.outputs.bump_class }}
          DEP_PACKAGE: ${{ steps.deps_classify.outputs.dep_package }}
          AUTO_MERGE_ELIGIBLE: ${{ steps.deps_classify.outputs.auto_merge_eligible }}
          ISSUE_LINKED: ${{ steps.agent_helper.outputs.issue_linked }}
          ISSUE_REFS: ${{ steps.agent_helper.outputs.issue_refs }}
          PRESERVATION_OK: ${{ steps.agent_helper.outputs.preservation_guard_ok }}
          DELETED_PROTECTED_COUNT: ${{ steps.agent_helper.outputs.deleted_protected_count }}
        run: |
          set -uo pipefail

          to_bool() {
            local v="$1"
            [[ -z "$v" || "$v" == "null" ]] && echo "false" || echo "$v"
          }
          to_int() {
            local v="$1"
            [[ -z "$v" || "$v" == "null" || "$v" == "false" ]] && echo 0 || echo "$v"
          }

          LITE_COUNT_INT=$(to_int "$LITE_COUNT")
          DEEP_COUNT_INT=$(to_int "$DEEP_COUNT")
          SECRET_LEAKS_INT=$(to_int "$SECRET_LEAKS")
          SHELL_VIOLATIONS_INT=$(to_int "$SHELL_VIOLATIONS")
          PERMS_VIOLATIONS_INT=$(to_int "$PERMS_VIOLATIONS")
          DELETED_PROTECTED_INT=$(to_int "$DELETED_PROTECTED_COUNT")
          AUTH_BOUNDARY_B=$(to_bool "$AUTH_BOUNDARY")
          HITL_BYPASS_B=$(to_bool "$HITL_BYPASS")
          PRESERVATION_OK_B=$(to_bool "$PRESERVATION_OK")
          SELF_MOD_B=$(to_bool "$SELF_MOD")
          PROTECTED_SCOPE_B=$(to_bool "$PROTECTED_SCOPE")
          LITE_VIOLATIONS_B=$(to_bool "$LITE_VIOLATIONS")
          DEEP_VIOLATIONS_B=$(to_bool "$DEEP_VIOLATIONS")
          ISSUE_LINKED_B=$(to_bool "$ISSUE_LINKED")

          # ── Fail-Closed Guard (SG-08) ────────────────────────────────────────────
          # Invariant: required step != 'success'  →  BLOCK
          # Using != 'success' (not == 'failure') to also catch:
          #   cancelled  — runner killed mid-execution
          #   timed_out  — step exceeded timeout
          #   skipped    — unexpected (required steps must not be skipped)
          # Guardian-Deep is intentionally conditional (if: risk_class==HIGH etc.)
          # so its skipped outcome is expected and treated separately below.
          STEP_CRASH=""
          [[ "$CLASSIFY_RESULT" != "success" ]] && STEP_CRASH="classify($CLASSIFY_RESULT)"
          [[ "$LITE_RESULT" != "success" ]] && STEP_CRASH="${STEP_CRASH:+$STEP_CRASH, }guardian_lite($LITE_RESULT)"
          # Deep is conditional: skipped is expected when risk < HIGH. Only flag non-success non-skipped.
          if [[ -n "$DEEP_CONCLUSION" && "$DEEP_CONCLUSION" != "success" && "$DEEP_CONCLUSION" != "skipped" ]]; then
            STEP_CRASH="${STEP_CRASH:+$STEP_CRASH, }guardian_deep($DEEP_CONCLUSION)"
          fi
          # agent_helper uses set+e internally; catch via helper_internal_error signal
          if [[ "$HELPER_RESULT" != "success" ]] || [[ "${HELPER_INTERNAL_ERROR:-0}" == "1" ]]; then
            STEP_CRASH="${STEP_CRASH:+$STEP_CRASH, }agent_helper($HELPER_RESULT/internal_error=${HELPER_INTERNAL_ERROR:-0})"
          fi

          STATUS="PASS"
          REASON="No new findings introduced"
          BLOCK_COUNT=0

          if [[ -n "$STEP_CRASH" ]]; then
            STATUS="BLOCK"
            REASON="Internal security check failure in step(s): $STEP_CRASH (SG-08: Unknown security state must never be treated as confirmed-safe)"
          else
            BLOCK_COUNT=$((BLOCK_COUNT + SECRET_LEAKS_INT))
            BLOCK_COUNT=$((BLOCK_COUNT + SHELL_VIOLATIONS_INT))
            [[ "$AUTH_BOUNDARY_B" == "true" ]] && BLOCK_COUNT=$((BLOCK_COUNT + 1))
            [[ "$HITL_BYPASS_B" == "true" ]] && BLOCK_COUNT=$((BLOCK_COUNT + 1))
            [[ "$PRESERVATION_OK_B" != "true" ]] && BLOCK_COUNT=$((BLOCK_COUNT + DELETED_PROTECTED_INT))
            # AUDIT-FIX (#1991 via PR #2014, folded here with credit — Phase E rename
            # superseded that PR): "NO CLAIM, NO CODE" (Rule #2) — a PR without an
            # issue reference is BLOCKED (ISSUE_LINKED_B was advisory-only before).
            [[ "$ISSUE_LINKED_B" != "true" ]] && BLOCK_COUNT=$((BLOCK_COUNT + 1))
            # AUDIT-FIX (#2006 via PR #2016, folded here with credit): Rule #4
            # "1 ISSUE = 1 PR" — multiple issue references in one PR are BLOCKED.
            ISSUE_COUNT_NUM="${ISSUE_COUNT:-0}"
            [[ "$ISSUE_COUNT_NUM" -gt 1 ]] && BLOCK_COUNT=$((BLOCK_COUNT + 1))

            if [[ $BLOCK_COUNT -gt 0 ]]; then
              STATUS="BLOCK"
              REASON="New evidence-backed violations: secrets=$SECRET_LEAKS_INT, dangerous_shell=$SHELL_VIOLATIONS_INT, auth_boundary_regression=$AUTH_BOUNDARY_B, hitl_bypass=$HITL_BYPASS_B, protected_deletions=$DELETED_PROTECTED_INT, issue_linked=$ISSUE_LINKED_B, issue_count=${ISSUE_COUNT:-0} (SG-01/SG-04/SG-07/SG-09 + Rule #2 NO CLAIM NO CODE #1991 + Rule #4 1-ISSUE-1-PR #2006)"
            elif [[ "$SELF_MOD_B" == "true" ]]; then
              STATUS="REVIEW"
              REASON="Self-modification of Guardian/PR-Helper logic detected (SG-11 Bootstrap Trust) — mandatory human review, auto-merge disabled"
            elif [[ "$IS_DEPENDABOT" == "true" && "${BUMP_CLASS:-none}" != "none" && "${AUTO_MERGE_ELIGIBLE:-false}" != "true" ]]; then
              # বাংলা: major/unknown dependabot bump — supply-chain risk বেশি,
              # breaking change থাকতে পারে। Auto-merge কখনোই নয় — human review।
              STATUS="REVIEW"
              REASON="Dependabot ${BUMP_CLASS} dependency bump (${DEP_PACKAGE:-unknown}) — breaking-change risk, human review mandatory (semver policy)"
            elif [[ "$DEEP_COUNT_INT" -gt 0 ]]; then
              STATUS="REVIEW"
              REASON="Guardian-Deep findings require human review (dependency_delta / workflow_call target integrity)"
            elif [[ "$PERMS_VIOLATIONS_INT" -gt 0 ]]; then
              STATUS="WARN"
              REASON="Info-only findings: workflow permissions review / pull_request_target usage"
            elif [[ "$LITE_COUNT_INT" -gt 0 ]]; then
              STATUS="WARN"
              REASON="Info-only findings (REVIEW-severity patterns)"
            fi
          fi

          export STATUS REASON RISK_CLASS PROTECTED_SCOPE_B SELF_MOD_B PROTECTED_PATHS
          export LITE_VIOLATIONS_B LITE_COUNT_INT SECRET_LEAKS_INT SHELL_VIOLATIONS_INT PERMS_VIOLATIONS_INT
          DEEP_RESULT="${DEEP_RESULT:-skipped}"
          export DEEP_RESULT DEEP_VIOLATIONS_B DEEP_COUNT_INT AUTH_BOUNDARY_B HITL_BYPASS_B
          export ISSUE_LINKED_B ISSUE_REFS PRESERVATION_OK_B DELETED_PROTECTED_INT
          export CHANGED_FILES_COUNT BLOCK_COUNT PR
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export TIMESTAMP
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_RUN_ID="${{ github.run_id }}"

          CONTRACT_FILE=/tmp/security-decision-contract.yaml
          python3 - <<'PY'
          import json
          import os

          def esc(s):
              if s is None:
                  return '""'
              s = str(s).replace('"', "'")
              return f'"{s}"'

          protected_paths_raw = os.environ.get('PROTECTED_PATHS', '[]')
          try:
              protected_paths = json.loads(protected_paths_raw) if protected_paths_raw else []
          except Exception:
              protected_paths = []

          lines = [
              f"# Security Decision Contract — synthesized by pr-gate.yml (pr-gate job)",
              f"# Generated: {os.environ.get('TIMESTAMP', '')}",
              f"# PR: #{os.environ.get('PR', '')}",
              f"# Repository: {os.environ.get('GITHUB_REPOSITORY', '')}",
              f"# Run: {os.environ.get('GITHUB_RUN_ID', '')}",
              "",
              "guardian_decision:",
              f"  status: {esc(os.environ.get('STATUS', 'PASS'))}",
              f"  risk_class: {esc(os.environ.get('RISK_CLASS', 'LOW'))}",
              f"  protected_scope_touched: {os.environ.get('PROTECTED_SCOPE_B', 'false')}",
              f"  self_modification_detected: {os.environ.get('SELF_MOD_B', 'false')}",
              f"  protected_scope_paths: {json.dumps(protected_paths)}",
              f"  dependency_bump: {{class: {esc(os.environ.get('BUMP_CLASS', 'none'))}, package: {esc(os.environ.get('DEP_PACKAGE', ''))}, auto_merge_eligible: {os.environ.get('AUTO_MERGE_ELIGIBLE', 'false')}}}",
              "",
              "  evidence_summary:",
              f"    decision_reason: {esc(os.environ.get('REASON', ''))}",
              "",
              "    guardian_lite:",
              "      ran: true",
              f"      violations_found: {os.environ.get('LITE_VIOLATIONS_B', 'false')}",
              f"      violations_count: {os.environ.get('LITE_COUNT_INT', 0)}",
              f"      secret_leaks: {os.environ.get('SECRET_LEAKS_INT', 0)}",
              f"      dangerous_shell: {os.environ.get('SHELL_VIOLATIONS_INT', 0)}",
              f"      workflow_perms_review: {os.environ.get('PERMS_VIOLATIONS_INT', 0)}",
              "",
              "    guardian_deep:",
              f"      ran: {str(os.environ.get('DEEP_RESULT') == 'success').lower()}",
              f"      result: {esc(os.environ.get('DEEP_RESULT', 'skipped'))}",
              f"      deep_violations: {os.environ.get('DEEP_VIOLATIONS_B', 'false')}",
              f"      deep_violations_count: {os.environ.get('DEEP_COUNT_INT', 0)}",
              f"      auth_boundary_regression: {os.environ.get('AUTH_BOUNDARY_B', 'false')}",
              f"      hitl_bypass: {os.environ.get('HITL_BYPASS_B', 'false')}",
              "",
              "    pr_agent_helper:",
              "      ran: true",
              f"      issue_linked: {os.environ.get('ISSUE_LINKED_B', 'false')}",
              f"      issue_refs: {esc(os.environ.get('ISSUE_REFS', ''))}",
              f"      preservation_guard_ok: {os.environ.get('PRESERVATION_OK_B', 'false')}",
              f"      deleted_protected_count: {os.environ.get('DELETED_PROTECTED_INT', 0)}",
              "",
              "    pr_lifecycle:",
              f"      status: {'blocked' if os.environ.get('STATUS') == 'BLOCK' else 'queued'}",
              "",
              f"  block_count: {os.environ.get('BLOCK_COUNT', 0)}",
              f"  changed_files_count: {os.environ.get('CHANGED_FILES_COUNT', 0)}",
              "",
          ]

          contract_text = "\n".join(lines)
          contract_path = "/tmp/security-decision-contract.yaml"
          with open(contract_path, "w", encoding="utf-8") as f:
              f.write(contract_text)
          print(contract_text)
          PY

          echo "----- Security Decision Contract (above) -----"

          COMMENT_FILE=/tmp/pr-gate-comment.md
          LIFECYCLE_STATUS="$([[ "$STATUS" == "BLOCK" ]] && echo 'blocked' || echo 'queued')"
          {
            printf '%s\n' "## 🚦 Unified PR Gate — Security Decision Contract" ''
            printf '%s\n' "| Field | Value |" "|---|---|"
            printf '| **Status** | **`%s`** |\n' "$STATUS"
            printf '| Risk class | `%s` |\n' "$RISK_CLASS"
            printf '| Dependency bump | `%s` (%s%s) |\n' "${BUMP_CLASS:-none}" "${DEP_PACKAGE:-}" "${DEP_PACKAGE:+ — auto-merge ${AUTO_MERGE_ELIGIBLE:-false}}"
            printf '| Protected scope touched | `%s` |\n' "$PROTECTED_SCOPE_B"
            printf '| Self-modification detected | `%s` |\n' "$SELF_MOD_B"
            printf '| Issue link | `%s` %s |\n' "$ISSUE_LINKED_B" "${ISSUE_REFS:+($ISSUE_REFS)}"
            printf '| Preservation guard | `%s` (deleted protected: %s) |\n' "$PRESERVATION_OK_B" "$DELETED_PROTECTED_INT"
            printf '| Guardian-Lite findings | `%s` (secrets=%s, shell=%s, perms=%s) |\n' "$LITE_COUNT_INT" "$SECRET_LEAKS_INT" "$SHELL_VIOLATIONS_INT" "$PERMS_VIOLATIONS_INT"
            printf '| Guardian-Deep findings | `%s` (auth=%s, hitl=%s) |\n' "$DEEP_COUNT_INT" "$AUTH_BOUNDARY_B" "$HITL_BYPASS_B"
            printf '| Guardian-Deep ran | `%s` (%s) |\n' "$([[ "$DEEP_RESULT" == "success" ]] && echo true || echo false)" "${DEEP_RESULT:-skipped}"
            printf '| PR Lifecycle | `%s` |\n' "$LIFECYCLE_STATUS"
            printf '| Changed files | `%s` |\n' "${CHANGED_FILES_COUNT:-0}"
            printf '\n**Decision:** %s\n' "$REASON"
            printf '\n<details><summary>📄 Full Security Decision Contract (YAML)</summary>\n\n```yaml\n'
            cat "$CONTRACT_FILE"
            printf '\n```\n\n</details>\n'
            printf '\n---\n_Auto-generated by `pr-gate.yml`. Edit this comment and it will be overwritten on the next run._\n'
          } > "$COMMENT_FILE"

          EXISTING_COMMENT_ID=$(gh pr view "$PR" --json comments \
            -q '[.comments[] | select(.body | contains("🚦 Unified PR Gate — Security Decision Contract"))][0].databaseId' \
            2>/dev/null || true)
          if [[ -n "$EXISTING_COMMENT_ID" && "$EXISTING_COMMENT_ID" != "null" ]]; then
            gh pr comment "$PR" --edit-comment "$EXISTING_COMMENT_ID" --body-file "$COMMENT_FILE" \
              || gh pr comment "$PR" --body-file "$COMMENT_FILE"
          else
            gh pr comment "$PR" --body-file "$COMMENT_FILE"
          fi

          {
            echo "status=$STATUS"
            echo "risk_class=$RISK_CLASS"
            echo "evidence_summary<<PR_GATE_CONTRACT_EOF"
            cat "$CONTRACT_FILE"
            echo "PR_GATE_CONTRACT_EOF"
          } >> "$GITHUB_OUTPUT"

          ENQUEUED="false"
          case "$STATUS" in
            BLOCK)
              gh label create "pr-gate:blocked" --color B60205 \
                --description "PR Gate: BLOCKED by Security Guardian (new violations)" --force 2>/dev/null || true
              gh pr edit "$PR" --add-label "pr-gate:blocked" 2>/dev/null || true
              ;;
            REVIEW)
              gh label create "pr-gate:needs-review" --color FBCA04 \
                --description "PR Gate: mandatory human review (self-mod / deep findings)" --force 2>/dev/null || true
              gh pr edit "$PR" --add-label "pr-gate:needs-review" 2>/dev/null || true
              ;;
            WARN)
              gh label create "pr-gate:warning" --color FBCA04 \
                --description "PR Gate: info-only findings" --force 2>/dev/null || true
              gh pr edit "$PR" --add-label "pr-gate:warning" 2>/dev/null || true
              ;;
            PASS)
              gh label create "pr-gate:passed" --color 0E8A16 \
                --description "PR Gate: passed Security Guardian" --force 2>/dev/null || true
              gh pr edit "$PR" --add-label "pr-gate:passed" 2>/dev/null || true

              # Auto-enqueue ready member PRs into the merge-train queue so they are batched
              if [[ ! "$BRANCH" =~ ^(pr-helper|agent-2) ]] && [[ ! "$BRANCH" =~ ^main$ ]]; then
                gh label create "queue:pending-rollup" --color 1D76DB \
                  --description "Merge train: pending single-flight rollup" --force 2>/dev/null || true
                gh pr edit "$PR" --add-label "queue:pending-rollup" 2>/dev/null || true
                ENQUEUED="true"
                echo "🚂 Auto-enqueued PR #$PR into merge train (queue:pending-rollup)"
              fi
              ;;
          esac

          echo "enqueued=$ENQUEUED" >> "$GITHUB_OUTPUT"

          if [[ "$STATUS" == "BLOCK" ]]; then
            echo "::error::PR Gate decision: BLOCK — $REASON"
            exit 1
          elif [[ "$STATUS" == "REVIEW" ]]; then
            echo "::warning::PR Gate decision: REVIEW — $REASON (auto-merge disabled; human review required)"
            exit 0
          else
            echo "::notice::PR Gate decision: $STATUS — $REASON"
            exit 0
          fi

      - name: Upload Security Decision Contract
        if: always() && steps.contract.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-decision-contract
          path: /tmp/security-decision-contract.yaml
          retention-days: 14

      - name: Upload Guardian-Lite Violations
        if: always() && steps.guardian_lite.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardian-lite-violations
          path: /tmp/guardian-lite-violations.jsonl
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Guardian-Deep Findings
        if: always() && steps.deep.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardian-deep-findings
          path: /tmp/guardian-deep-findings.jsonl
          retention-days: 14
          if-no-files-found: ignore

      # ── Major-bump human review enforcement (semver policy) ──────────────────
      # dependabot major/unknown bump → auto-merge NEVER. Breaking-change risk
      # assessment comment + reviewer request + label. (patch/minor skip করে।)
      - name: Major-bump review enforcement
        if: >-
          always() &&
          steps.deps_classify.conclusion == 'success' &&
          steps.deps_classify.outputs.is_dependabot == 'true' &&
          steps.deps_classify.outputs.auto_merge_eligible == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr_number }}
          BUMP_CLASS: ${{ steps.deps_classify.outputs.bump_class }}
          DEP_PACKAGE: ${{ steps.deps_classify.outputs.dep_package }}
          FROM_V: ${{ steps.deps_classify.outputs.from_version }}
          TO_V: ${{ steps.deps_classify.outputs.to_version }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "## 🛑 Major Dependency Bump — Human Review Required" ''
            printf '%s\n' "| Field | Value |" "|---|---|"
            printf '| Package | **`%s`** |\n' "${DEP_PACKAGE:-unknown}"
            printf '| Version | `%s` → `%s` |\n' "${FROM_V:-?}" "${TO_V:-?}"
            printf '| Bump class | **`%s`** |\n' "${BUMP_CLASS:-unknown}"
            printf '\n%s\n' '**সিদ্ধান্ত:** major/unknown bump-এ breaking change থাকতে পারে — merge policy অনুযায়ী এটি **কখনোই auto-merge হয় না**।'
            printf '\n%s\n' '**Review checklist:**'
            printf '%s\n' '- [ ] Major-version migration guide পড়ুন (release notes)'
            printf '%s\n' '- [ ] Backend bump হলে: helper diagnostic tests সবুজ কিনা দেখুন (Step 1)'
            printf '%s\n' '- [ ] Frontend bump হলে: build + type-check + e2e সবুজ কিনা নিশ্চিত করুন'
            printf '%s\n' '- [ ] Breaking changes প্রজেক্টের usage-এ প্রভাব ফেলে কিনা যাচাই করুন'
            printf '\n%s\n' '⚠️ যদি এই bump-এ CI/test regression ধরা পড়ে, PR Helper নিজে থেকেই block করবে — তখন AI Auto-Fix চেষ্টা করবে (conf<80% হলে escalate)।'
          } > /tmp/deps-major-review.md
          gh pr comment "$PR" --body-file /tmp/deps-major-review.md
          gh label create "deps:major-review" --color B60205 \
            --description "Dependabot major/unknown bump — human review mandatory" --force 2>/dev/null || true
          gh pr edit "$PR" --add-label "deps:major-review" 2>/dev/null || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🚦 Unified PR Gate"
            echo ""
            echo "Final status: **${{ steps.contract.outputs.status || 'FAILED' }}**"
            echo "Risk class: ${{ steps.contract.outputs.risk_class || 'UNKNOWN' }}"
            echo ""
            echo "Security Decision Contract posted as PR comment."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Job 2: PR Lifecycle (PR Helper)
  # Invokes the diagnostic-only helper lifecycle if PR Gate did not BLOCK.
  # OWNER DECISION (2026-09-24): auto-merge machinery removed — the helper
  # only reports diagnostics; merging is a human decision.
  #
  # PERF (#1776): Skip heavy redundant per-PR test suite if PR is already queued
  # in the merge train rollup (queue:pending-rollup or queue:in-batch). The
  # single-flight merge train will test the consolidated batch once, saving CI minutes.
  # ============================================================================
  pr-lifecycle:
    name: 🤖 PR Lifecycle (PR Helper)
    needs: pr-gate
    if: >-
      needs.pr-gate.result == 'success' &&
      needs.pr-gate.outputs.status != 'BLOCK' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (contains(github.event.pull_request.labels.*.name, 'merge-train:batch') ||
       (needs.pr-gate.outputs.enqueued != 'true' &&
        !contains(github.event.pull_request.labels.*.name, 'queue:pending-rollup') &&
        !contains(github.event.pull_request.labels.*.name, 'queue:in-batch')))
    uses: ./.github/workflows/pr-helper.yml
    with:
      pr_number: ${{ needs.pr-gate.outputs.pr_number }}
    secrets: inherit

  # ============================================================================
  # Stage 0 — Branch Naming Guard (absorbed from branch-naming-guard.yml, #1857).
  # REQUIRED CHECK: job name byte-identical to branch protection. Emits the explicit
  # check-run (PASS/FAIL) on the head SHA exactly like the standalone workflow did.
  # ============================================================================
  branch-naming-guard:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Branch Naming Guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve PR + branch metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)"
            BRANCH_NAME="$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)"
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "branch_name=$BRANCH_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "PR=$PR_NUMBER branch=$BRANCH_NAME sha=$HEAD_SHA"

      - name: Validate branch name + emit check-run (PASS or FAIL)
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch_name }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
        run: |
          set -euo pipefail

          # OPS-06 Safeguard 4 regex (kept in sync with pr-pipeline.yml).
          # AGENTS.md Sec 4 (persistent agent branch model, 90841db) defines bare
          # slots agent-1..agent-9 as the workspaces - PRs originate from the
          # assigned slot, so bare agent-N must pass. The legacy agent-X/issue-N-slug
          # form stays for back-compat (cannot coexist as git refs with bare slots).
          # Bot prefixes (dependabot/github-actions/renovate/pr-helper) are EXEMPT:
          # এরা human developer নয়, নিজেদের convention-মানা branch বানায় — naming
          # gate এদের block করলে dependency PR কখনোই auto-merge হতে পারে না।
          VALID_PATTERN='^((planner|coder|pr-helper|ci|platform|browser|super)-[0-9]+(-[a-zA-Z0-9_-]+)?|agent-[a-zA-Z0-9_-]+/issue-[0-9]+-.+|agent-[0-9]+(-[a-zA-Z0-9_-]+)?|feat/.+|fix/.+|hotfix/.+|perf/.+|chore/.+|test/.+|docs/.+|refactor/.+|ci/.+|dependabot/.+|github-actions/.+|renovate/.+|pr-helper/.+|develop|main)$'

          if [[ "$BRANCH_NAME" =~ $VALID_PATTERN ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ Branch name '$BRANCH_NAME' matches OPS-06 pattern"

            # Create a PASSING check-run so required_status_checks sees green
            gh api "repos/$GH_REPO/check-runs" \
              --method POST \
              -f name="Branch Naming Guard" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="success" \
              -f "output[title]=Branch name matches OPS-06 convention" \
              -f "output[summary]=Branch \`$BRANCH_NAME\` matches required pattern ✅" \
              -f "details_url=https://github.com/$GH_REPO/actions/runs/${{ github.run_id }}"

          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "❌ Branch name '$BRANCH_NAME' does NOT match OPS-06 pattern"

            # Create a FAILING check-run so required_status_checks blocks the merge
            gh api "repos/$GH_REPO/check-runs" \
              --method POST \
              -f name="Branch Naming Guard" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="failure" \
              -f "output[title]=Branch name violates OPS-06 convention" \
              -f "output[summary]=Branch '$BRANCH_NAME' doesn't match required pattern. Valid: agent-N (persistent slot, AGENTS.md Sec 4), agent-N/issue-N-<slug>, feat/, fix/, hotfix/, perf/, chore/, test/, docs/, refactor/, ci/ + bot prefixes (dependabot/, github-actions/, renovate/, pr-helper/)" \
              -f "details_url=https://github.com/$GH_REPO/actions/runs/${{ github.run_id }}"

            # Optional: ensure branch:invalid label exists (idempotent, non-fatal)
            gh label create "branch:invalid" --color "D93F0B" \
              --description "Branch name does not match OPS-06 regex" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "branch:invalid" 2>/dev/null || true

            echo "::error::Branch name '$BRANCH_NAME' violates OPS-06 naming convention"
            exit 1
          fi

  # ============================================================================
  # Stage 1 (parallel) — Cross-PR file collisions (absorbed from
  # cross-pr-collision-guard.yml; strict mode #2002 — direct collisions BLOCK).
  # ============================================================================
  check-collisions:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Check Cross-PR File Collisions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run Collision Detector
        id: collision_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          echo "🔍 Evaluating Cross-PR file collisions for PR #$PR_NUM (branch: $HEAD_REF)..."

          if [[ "$HEAD_REF" =~ ^(pr-helper-[0-9]+|agent-2(-pr-helper)?)$ ]]; then
            echo "🚂 Merge-train rollup batch on PR-Helper slot detected — intra-batch members are intentionally merged."
            echo '{"has_collision": false, "collisions": []}' > collision_output.json
            echo "### ✅ Merge-Train Batch PR — intra-batch member merges are expected and verified." > collision_report.md
            echo "has_collision=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # AUDIT-FIX (#2002): pass --strict flag so direct file collisions BLOCK the PR.
          python scripts/git/cross_pr_collision_detector.py --pr "$PR_NUM" --format json --strict > collision_output.json 2>&1 || true
          python scripts/git/cross_pr_collision_detector.py --pr "$PR_NUM" --format markdown > collision_report.md 2>/dev/null || true

          # AUDIT-FIX (#2002): check for has_direct_collision (strict mode exit code)
          HAS_DIRECT=$(python -c "import json; d=json.load(open('collision_output.json')); print('true' if d.get('has_direct_collision') or d.get('has_collision') else 'false')" 2>/dev/null || echo "false")
          HAS_COLLISION=$(python -c "import json; d=json.load(open('collision_output.json')); print('true' if d.get('has_collision') else 'false')" 2>/dev/null || echo "false")
          
          echo "has_collision=$HAS_COLLISION" >> "$GITHUB_OUTPUT"
          echo "has_direct_collision=$HAS_DIRECT" >> "$GITHUB_OUTPUT"
          
          echo "================ Collision Summary ================"
          cat collision_report.md
          echo "==================================================="
          
          # AUDIT-FIX (#2002): strict mode — direct collisions exit 1 (block PR)
          if [ "$HAS_DIRECT" = "true" ]; then
            echo "::error::Direct file collision detected with another open PR. PR is BLOCKED (Rule: cross-pr-collision strict mode, #2002)."
            echo "has_collision=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Update PR Status and Comments
        if: always() && steps.collision_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HAS_COLLISION: ${{ steps.collision_check.outputs.has_collision }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMENT_TAG="<!-- SUPREMEAI_COLLISION_GUARD -->"
          REPORT_BODY=$(cat collision_report.md)
          COMMENT_CONTENT="${COMMENT_TAG}\n${REPORT_BODY}"

          # Find existing collision guard comment if present
          EXISTING_COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUM/comments" --jq ".[] | select(.body | contains(\"$COMMENT_TAG\")) | .id" | head -n 1 || true)

          if [ "$HAS_COLLISION" = "true" ]; then
            echo "⚠️ Collision detected! Adding 'collision:warning' label..."
            gh pr edit "$PR_NUM" --add-label "collision:warning" || true
            gh pr edit "$PR_NUM" --add-label "collision:blocked" 2>/dev/null || true

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              echo "Updating existing comment $EXISTING_COMMENT_ID..."
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$EXISTING_COMMENT_ID" -f body="$COMMENT_CONTENT" || true
            else
              echo "Posting new collision warning comment..."
              gh pr comment "$PR_NUM" --body "$COMMENT_CONTENT" || true
            fi
          else
            echo "✅ No collision detected. Removing 'collision:warning' label if present..."
            gh pr edit "$PR_NUM" --remove-label "collision:warning" 2>/dev/null || true

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              echo "Updating existing comment to clean status..."
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$EXISTING_COMMENT_ID" -f body="$COMMENT_CONTENT" || true
            fi
          fi

  # ============================================================================
  # Path relevance for the self-skipping arms (dorny/paths-filter on the PR's
  # changed files — no checkout needed for pull_request events).
  # ============================================================================
  pr-changes:
    name: 🎭 Path relevance (e2e + constitution)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      constitution: ${{ steps.filter.outputs.constitution }}
    steps:
      - name: Detect e2e / constitution path relevance
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            e2e:
              - 'frontend/**'
              - 'qa/**'
              - '.github/workflows/reusable-e2e-runner.yml'
            constitution:
              - '.github/constitution/**'
              - '.github/scripts/constitution/**'
              - 'scripts/ci/validate_constitution_governance.py'

  # e2e guest — PR arm with paths self-skip (frontend/qa only, old e2e-suites PR
  # trigger semantics) + on-demand dispatch arm.
  e2e-guest:
    name: 🎭 Guest Suite
    needs: [pr-changes]
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.run_e2e_guest == true) ||
        (github.event_name == 'pull_request' && github.event.action != 'closed' &&
         needs.pr-changes.result == 'success' && needs.pr-changes.outputs.e2e == 'true'))
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e-runner.yml
    with:
      project: guest
      use_staging: ${{ github.event_name == 'workflow_dispatch' && inputs.use_staging == true }}
      base_url: ''
    secrets: inherit

  # e2e customer / admin — on-demand arms only (legacy 06/07 dispatch semantics;
  # the scheduled customer run lives in nightly-ops.yml since Phase B).
  e2e-customer:
    name: 🎭 Customer Suite
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_customer == true
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e-runner.yml
    with:
      project: customer
      use_staging: true
      base_url: ''
    secrets: inherit

  e2e-admin:
    name: 🎭 Admin Suite
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_admin == true
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e-runner.yml
    with:
      project: admin
      use_staging: ${{ github.event_name == 'workflow_dispatch' && inputs.use_staging == true }}
      base_url: ${{ (github.event_name == 'workflow_dispatch' && inputs.e2e_base_url) || '' }}
    secrets: inherit

  # ============================================================================
  # Constitution governance — PR paths arm (absorbed from
  # constitution-governance.yml; weekly arm lives in nightly-ops since Phase B).
  # ============================================================================
  constitution:
    needs: [pr-changes]
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      needs.pr-changes.result == 'success' && needs.pr-changes.outputs.constitution == 'true'
    name: Validate constitution governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate exceptions and expiry
        run: python scripts/ci/validate_constitution_governance.py
      - name: Run constitution unit tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts/constitution/tests -v

  # ============================================================================
  # record-on-merge — every merged PR becomes a DB learning report (absorbed from
  # merge-learning-recorder.yml, founder directive #1929). Idempotent upsert on
  # pr_number; the dispatch arm (pr_number) doubles as the backfill/recovery lever
  # if a run is cancelled by a fast-follow label event on the just-closed PR.
  # ============================================================================
  record-on-merge:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    name: Record merge learning report
    # Fork PRs get no secrets — skip (same guard as merge-train).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Record the merged PR as a learning report
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          python scripts/ci/record_merge_learning.py --pr "$PR_NUMBER"

