[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    ".venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
# বাংলা মন্তব্ব্য: টেস্ট কভারেজ থ্রেশহোল্ড 75% এ বাড়ানো হয়েছে সিকিউরিটি এবং কোয়ালিটি বাড়াতে
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=75"
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests"
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = [
    "pydantic.mypy"
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pylint]
max-line-length = 120
disable = [
    "C0301",  # Line too long
    "W0613",  # Unused argument
    "R0903",  # Too few public methods
    "R0902",  # Too many instance attributes
    "R0913",  # Too many arguments
    "C0415",  # Import outside toplevel
    "W0212",  # Access to protected member
    "W0622",  # Redefining built-in
    "R0914",  # Too many local variables
    "R0801",  # Similar lines in files
    "C0103",  # Invalid variable name
    "W0703",  # Catching too general exception
    "R0912",  # Too many branches
    "R0915",  # Too many statements
    "R0911",  # Too many return statements
    "R1702",  # Too many nested blocks
    "W0621",  # Redefining name from outer scope
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "W0237",  # Arguments renamed in subclass
    "W0221",  # Arguments differ from overridden method
    "W0236",  # Removed incompatibility in class hierarchy
    "R1705",  # Unnecessary "else" after "return"
    "C0209",  # Formatting a string with % or .format
    "W0102",  # Dangerous default value as argument
    "W0107",  # Unnecessary pass statement
    "C0411",  # Wrong import order
    "W0612",  # Unused variable
    "R1725",  # Consider using Python 3 style super() call
    "W0404",  # Reimported
    "R0205",  # Class inherits from object
    "C0104",  # Disallowed name
    "W0719",  # Raising arbitrary exception
    "W0707",  # Consider explicitly re-raising using 'raise ... from ...'
    "W0718",  # Catching too general exception
    "R1710",  # Either all return statements in a function should return an expression, or none of them should
    "R1711",  # Useless return at end of function or method
