# Round 17 Issue Closeout (2026-09-19)
#
# বাংলা: Round 17 ফিক্স — Infisical vault-এ ওনারের 40+ নতুন key-র পুনঃপরীক্ষা,
# #460 Upstash কোটা-বার্ন ফিক্স (atomic single-op Lua + IP-eval dedup + 5-account
# federation failover; commits 6c39df6f..f8e56470), ডুপ্লিকেট #459 বন্ধ, #434
# vendor-স্ট্যাটাস আপডেট। এজেন্ট-টোকেনে Issues:write নেই (403) — তাই built-in
# GITHUB_TOKEN, Round 14/16 closeout-এর প্রমাণিত প্যাটার্ন।
#
# English: Posts per-issue bilingual evidence comments from
# docs/audit_reports/round17_comments/, closes #460 (completed) and #459
# (not planned), status-updates #434. Idempotent.
# Trigger: workflow_dispatch or push touching the fix log / comments dir.

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/audit_reports/FIX_LOG_2026-09-19_round17.md"
      - "docs/audit_reports/round17_comments/**"

concurrency:
  group: issue-closeout-round17-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post evidence comments and close fixed issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Issues fixed in Round 17 — post evidence, then close (completed).
          CLOSE_LIST="460"
          # Duplicate/test issue — close as not planned.
          NOT_PLANNED="459"
          # Issues with status updates only — comment, keep open.
          COMMENT_ONLY="434"

          for issue in $CLOSE_LIST $NOT_PLANNED $COMMENT_ONLY; do
            body_file="docs/audit_reports/round17_comments/${issue}.md"
            if [ -f "$body_file" ]; then
              gh issue comment "$issue" --body-file "$body_file" || \
                echo "::warning::comment on #$issue failed"
            else
              echo "::warning::missing comment body for #$issue"
            fi
          done

          for issue in $CLOSE_LIST; do
            state="$(gh issue view "$issue" --json state --jq .state || echo unknown)"
            if [ "${state,,}" = "open" ]; then
              gh issue close "$issue" --reason completed \
                --comment "✅ Fixed in Round 17 (commits 6c39df6f..f8e56470) — see evidence comment above. ফিক্স সম্পন্ন — প্রমাণ উপরের কমেন্টে।" || \
                echo "::warning::close #$issue failed"
            else
              echo "#$issue already $state — skip"
            fi
          done

          for issue in $NOT_PLANNED; do
            state="$(gh issue view "$issue" --json state --jq .state || echo unknown)"
            if [ "${state,,}" = "open" ]; then
              gh issue close "$issue" --reason "not planned" \
                --comment "🗑️ Duplicate of #460 — closing as not planned. ডুপ্লিকেট — not planned হিসেবে বন্ধ।" || \
                echo "::warning::close #$issue failed"
            else
              echo "#$issue already $state — skip"
            fi
          done

          echo "Round 17 closeout complete."
