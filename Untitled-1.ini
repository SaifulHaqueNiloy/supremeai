### 🛡️ প্রস্তাব ২: Just-In-Time (JIT) Admin OTP ডিফেন্স গার্ড
* **ফাইল:** `backend/core/security.py`
* **উদ্দেশ্য:** অ্যাডমিন প্যানেলে যেকোনো হাই-প্রিভিলেজ অ্যাকশনের আগে জাস্ট-ইন-টাইম ওটিপি ভেরিফিকেশন করা (ম্যালওয়্যার ইমিউনিটি নিশ্চিত করার জন্য)।

```python backend/core/security.py
# ... existing code ...
import secrets
import time
from fastapi import HTTPException, status

class JITDefenseManager:
    """
    On-spot Just-In-Time (JIT) OTP ভেরিফিকেশন সিস্টেম।
    অ্যাডমিন ডিভাইসে ম্যালওয়্যার থাকলেও অন-স্পট ট্র্যাকিং ছাড়া ক্রিটিক্যাল অপারেশন রিজেক্ট করা হবে।
    """
    def __init__(self):
        self.active_otps: dict[str, dict] = {}  # admin_id -> {otp, expires_at}

    def generate_jit_otp(self, admin_id: str) -> str:
        """সেনসিটিভ কাজের আগে একটি ওয়ান-টাইম পাসওয়ার্ড তৈরি করে"""
        otp = "".join(secrets.choice("0123456789") for _ in range(6))
        self.active_otps[admin_id] = {
            "otp": otp,
            "expires_at": time.time() + 300  # ৫ মিনিট ভ্যালিডিটি
        }
        # বাস্তব ইমপ্লিমেন্টেশনে এটি ফ্রি-টিয়ার ইমেইল বা মেসেজিং এপিআই দিয়ে পাঠানো হবে
        return otp

    def verify_jit_otp(self, admin_id: str, submitted_otp: str) -> bool:
        """ব্যবহারকারীর সাবমিট করা ওটিপি যাচাই করে"""
        record = self.active_otps.get(admin_id)
        if not record:
            raise HTTPException(status_code=status.HTTP_403_FORBIDDEN, detail="JIT OTP সেশন খুঁজে পাওয়া যায়নি।")
        
        if time.time() > record["expires_at"]:
            self.active_otps.pop(admin_id, None)
            raise HTTPException(status_code=status.HTTP_403_FORBIDDEN, detail="OTP-এর মেয়াদ শেষ হয়েছে।")
            
        if record["otp"] != submitted_otp:
            raise HTTPException(status_code=status.HTTP_401_UNAUTHORIZED, detail="ভুল OTP প্রদান করা হয়েছে।")
            
        # সফল ভেরিফিকেশনে ওটিপি মুছে ফেলা হবে যেন পুনরায় ব্যবহার না করা যায়
        self.active_otps.pop(admin_id, None)
        return True
# ... rest of code ...
```

