

name: 🧠 SupremeAI Core CI

on:
  workflow_dispatch:
    inputs:
      run_pre_merge_gate:
        description: 'Run Pre-Merge Gate'
        type: boolean
        default: true
      run_backend_core:
        description: 'Run Backend Core'
        type: boolean
        default: true
      run_frontend_core:
        description: 'Run Frontend Core'
        type: boolean
        default: true
      run_performance_e2e:
        description: 'Run Performance E2E'
        type: boolean
        default: true
      run_deploy_render:
        description: 'Run Deploy to Render'
        type: boolean
        default: true
      ignore_dependencies:
        description: 'Force run selected job even if upstream jobs are skipped? (Not for deploy)'
        type: boolean
        default: false
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore', 'logs/**']
  pull_request:
    branches: [main, develop]

  schedule:
    - cron: '0 0 * * *'

# ==============================================================================
# [IMMUTABLE CONFIGURATION - MANUAL CONTROL ONLY]
# ------------------------------------------------------------------------------
# DO NOT ALLOW AI AGENTS TO MODIFY THIS CONCURRENCY LOGIC.
# Purpose: Ensures new pushes cancel pending/running jobs in this pipeline.
# ==============================================================================
# বাংলা মন্তব্য: যেকোনো ব্রাঞ্চেই নতুন পুশ আসলে পুরানো রানিং জবগুলো যেন বাতিল হয়ে যায়, সেজন্য ref-এর পরিবর্তে শুধু workflow-ভিত্তিক concurrency group সেট করা হলো।
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'
  SUPREMEAI_API_URL: ${{ vars.SUPREMEAI_API_URL }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      docker_build: ${{ steps.filter.outputs.docker_build == 'true' || steps.detect.outputs.force_docker_build == 'true' || github.run_attempt > 1 }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      admin_needed: ${{ steps.filter.outputs.admin == 'true' || steps.filter.outputs.shared == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      user_needed: ${{ steps.filter.outputs.user == 'true' || steps.filter.outputs.shared == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      dependencies: ${{ steps.filter.outputs.dependencies == 'true' || steps.detect.outputs.force_dependencies == 'true' || github.run_attempt > 1 }}
      docs_only: ${{ steps.filter.outputs.docs_only == 'true' }}
      admin_backend_changed: ${{ steps.filter.outputs.admin_backend == 'true' || steps.filter.outputs.shared_backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      customer_backend_changed: ${{ steps.filter.outputs.customer_backend == 'true' || steps.filter.outputs.shared_backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect previous failures
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/detect-previous-failures.py

          # Parse the base64 output
          B64_JSON=$(grep "force_flags_b64=" $GITHUB_OUTPUT | sed 's/^force_flags_b64=//')
          if [ ! -z "$B64_JSON" ]; then
            JSON_STR=$(echo "$B64_JSON" | base64 --decode)
            echo "force_backend=$(echo $JSON_STR | jq -r '.backend')" >> $GITHUB_OUTPUT
            echo "force_frontend=$(echo $JSON_STR | jq -r '.frontend')" >> $GITHUB_OUTPUT
            echo "force_docker_build=$(echo $JSON_STR | jq -r '.docker_build')" >> $GITHUB_OUTPUT
            echo "force_dependencies=$(echo $JSON_STR | jq -r '.dependencies')" >> $GITHUB_OUTPUT
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker_build:
              - 'backend/Dockerfile.ci'
              - 'backend/poetry.lock'
            backend:
              - 'backend/**'
              - 'api/**'
              - 'core/**'
              - '.github/workflows/**'
            admin_backend:
              - 'backend/api/routes/admin.py'
              - 'backend/api/routes/admin_dashboard.py'
              - 'backend/api/routes/admin_librarian.py'
              - 'backend/api/routes/simulator_admin.py'
              - 'backend/api/routes/tenant_admin.py'
              - 'admin/**'
            customer_backend:
              - 'backend/**'
              - '!backend/api/routes/admin.py'
              - '!backend/api/routes/admin_dashboard.py'
              - '!backend/api/routes/admin_librarian.py'
              - '!backend/api/routes/simulator_admin.py'
              - '!backend/api/routes/tenant_admin.py'
            shared_backend:
              - 'backend/core/**'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - 'backend/Dockerfile'
              - '.github/workflows/**'
              - '.github/actions/**'
            frontend:
              - 'apps/studio-client/**'
              - 'apps/web-chat/**'
              - 'admin/**'
              - 'firebase.json'
              - '.github/workflows/**'
            admin:
              - 'apps/studio-client/src/pages/admin/**'
            user:
              - 'apps/studio-client/src/pages/user/**'
              - 'apps/studio-client/src/pages/auth/**'
            shared:
              - 'apps/studio-client/src/components/**'
              - 'apps/studio-client/src/store/**'
              - 'apps/studio-client/package.json'
            dependencies:
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
            docs_only:
              - '**.md'
              - 'docs/**'

  # ==============================================================================
  # PRE-MERGE GATE: Iron Curtain — যেকোনো কোড মার্জের আগে বাধ্যতামূলক চেক
  # এই job fail হলে অন্য কোনো job চলবে না।
  # ==============================================================================
  pre-merge-gate:
    name: 🚧 Pre-Merge Gate (Iron Curtain)
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      trivial_change: ${{ steps.gate-logic.outputs.trivial_change }}
    steps:
      - name: Set Trivial Change Output
        id: gate-logic
        run: |
          if [[ "${{ needs.changes.outputs.backend }}" == 'false' && "${{ needs.changes.outputs.frontend }}" == 'false' && "${{ needs.changes.outputs.dependencies }}" == 'false' && "${{ needs.changes.outputs.docs_only }}" == 'true' ]]; then
            echo "trivial_change=true" >> $GITHUB_OUTPUT
          else
            echo "trivial_change=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
      - name: Set up Python
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install gate and backend dependencies
        run: |
          pip install ruff poetry
          cd backend
          poetry config virtualenvs.in-project true
          poetry install --only main --no-root

      - name: 🚫 Gate 1 — Zero-Gap Stub/Placeholder Data Check
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: Stub ডেটা পেলে সাথে সাথে পাইপলাইন বন্ধ হয়ে যাবে
        run: |
          echo "=== Zero-Gap স্টাব ডেটা গেট ===" >> $GITHUB_STEP_SUMMARY
          python scripts/find_stub_data.py --path . --fail-on HIGH
          echo "✅ পাস: কোনো স্টাব/প্লেসহোল্ডার প্যাটার্ন পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY

      - name: 🛡️ Gate 1.5 — Security Blind Spot Scan
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: continue-on-error: true সরানো হয়েছে কারণ Critical security risk চুপচাপ পাস হয়ে যাচ্ছিল
        run: |
          echo "=== Security Blind Spot Scan ===" >> $GITHUB_STEP_SUMMARY
          python scripts/security/auto_find_blindspots.py
          echo "✅ পাস: কোনো ক্রিটিকাল সিকিউরিটি রিস্ক নেই" >> $GITHUB_STEP_SUMMARY

      - name: 🔬 Gate 2 — Ruff Linting (No Silent Bugs)
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: BLE001 (পেডান্টিক এক্সেপশন) রিমুভ করা হয়েছে কারণ আমাদের কাস্টম অডিট স্ক্রিপ্ট আছে।
        # F401 (আনইউজড ইম্পোর্ট) ইগনোর করা হয়েছে, কারণ maintenance pipeline এটি অটো-ফিক্স করবে।
        run: |
          echo "=== Ruff স্ট্যাটিক অ্যানালাইসিস গেট ===" >> $GITHUB_STEP_SUMMARY
          # বাংলা মন্তব্য: স্থায়ী সমাধান — প্রথমে --fix রান করে auto-fixable এরর ঠিক করা হয়।
          # এতে I001/UP042/UP022 ইত্যাদি fixable এরর কখনো gate block করবে না।
          # তারপর --no-fix দিয়ে verify করা হয় যে কোনো non-fixable এরর নেই।
          cd backend
          ruff check . --config pyproject.toml --fix --unsafe-fixes --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
          ruff check . --config pyproject.toml --no-fix --extend-ignore=S101,S110,S603,S607,S104,S105,S107,S108,S306,S310,S311,S314,S608,E501,E402
          echo "✅ পাস: Ruff লিন্টিং গেট ক্লিয়ার" >> $GITHUB_STEP_SUMMARY

      - name: 🤖 Bot Commit Detection
        id: bot-check
        # বাংলা মন্তব্য: SupremeAI CI Bot-এর commit detect করা হচ্ছে।
        # Bot commit এলে router import smoke-test mandatory strict mode-এ চলবে।
        run: |
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          echo "Commit author: $COMMIT_AUTHOR"
          if [[ "$COMMIT_AUTHOR" == *"CI Bot"* || "$COMMIT_AUTHOR" == *"SupremeAI Bot"* || "$COMMIT_AUTHOR" == *"[bot]"* ]]; then
            echo "is_bot_commit=true" >> $GITHUB_OUTPUT
            echo "::warning::🤖 BOT COMMIT DETECTED — Router import smoke-test will run in STRICT mode. All routers (including optional) must import cleanly."
          else
            echo "is_bot_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔌 Gate 0 — Router Import Smoke-Test
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: CRITICAL GATE — Full test suite চালানোর আগে প্রতিটি registered router
        # individually import করে চেক করা হয়। এই gate-এর লক্ষ্য:
        # 1. Hallucinated imports (যেমন `from core.auth import ...`) 10 সেকেন্ডে ধরা
        # 2. CI Bot commit-এ strict mode — optional routers-ও pass করতে হবে
        # 3. একটি bad route file পুরো test suite cascade crash করার আগেই block করা
        run: |
          echo "=== Router Import Smoke-Test ===" >> $GITHUB_STEP_SUMMARY

          cd backend
          # Bot commit হলে strict mode চালানো হবে
          if [[ "${{ steps.bot-check.outputs.is_bot_commit }}" == "true" ]]; then
            echo "🤖 Bot commit: running in STRICT mode (all routers must import cleanly)" >> $GITHUB_STEP_SUMMARY
            poetry run python ../scripts/ci/validate_router_imports.py --strict
          else
            poetry run python ../scripts/ci/validate_router_imports.py
          fi

          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ পাস: সব core router imports সঠিক" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ FAIL: Router import error detected — fix imports before test suite runs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 🛡️ Gate 3.5 — Admin Router Auth Lint Guard
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: অ্যাডমিন রাউটার বা乞丐-level `Depends(get_current_admin)` enforcement
        run: |
          echo "=== Admin Auth Lint Guard ===" >> $GITHUB_STEP_SUMMARY
          cd backend
          poetry run python ../.github/scripts/verify_admin_auth.py
          echo "✅ All admin prefixed routers verified structurally." >> $GITHUB_STEP_SUMMARY


      - name: 📋 Gate 3 — Observability Check (No httpx without timeout)
        if: needs.changes.outputs.docs_only != 'true'
        # বাংলা মন্তব্য: timeout ছাড়া httpx.AsyncClient() ব্যবহার করলে fail
        run: |
          echo "=== HTTP টাইমআউট অডিট গেট ===" >> $GITHUB_STEP_SUMMARY
          # grep for httpx.AsyncClient() without timeout parameter
          VIOLATIONS=$(grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv" | wc -l)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ FAIL: Found $VIOLATIONS httpx.AsyncClient() call(s) without explicit timeout!" >> $GITHUB_STEP_SUMMARY
            grep -rn "httpx\.AsyncClient()" backend/ --include="*.py" | grep -v "test_" | grep -v ".venv"
            exit 1
          fi
          echo "✅ পাস: সব httpx ক্লায়েন্টে নির্দিষ্ট টাইমআউট আছে" >> $GITHUB_STEP_SUMMARY

  ai-scribe-docs:
    name: "📚 AI Scribe — Auto-Documentation Generation"
    needs: [changes, pre-merge-gate]
    if: >
      needs.pre-merge-gate.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 📚 Run AI Scribe Historian
        # বাংলা মন্তব্য: এই ধাপটি স্বয়ংক্রিয়ভাবে পাইথন ফাইলগুলির ডকস্ট্রিং এবং ডিরেক্টরি README-গুলো তৈরি/আপডেট করে।
        # docs/autogen/codebase/ ফাঁকা স্টब들也被 AI Scribe দ্বারা পূরণ করা হবে।
        run: |
          cd backend
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --only main --no-root
          poetry run pip install litellm python-dotenv
          poetry run python ../scripts/devops/ai_scribe_historian.py --files $(find ../backend/core ../backend/tools -name "*.py" -not -name "__init__.py" 2>/dev/null | head -20)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 📤 Upload Generated Docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-scribe-generated-docs
          path: |
            backend/**/*.py
          retention-days: 1

  observability-audit:
    name: "🔬 Observability Audit (No Silent Errors)"
    needs: [pre-merge-gate]
    if: needs.pre-merge-gate.outputs.trivial_change != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔬 Run Observability Audit Script
        id: audit
        run: |
          # এই স্ক্রিপ্টটি সাইলেন্ট exception (`except:`, `except Exception:`) খুঁজে বের করে।
          # কোনো সমস্যা পেলে এটি non-zero exit code দিয়ে ফেইল করবে।
          python scripts/audit_observability.py

      - name: Audit Summary
        if: always()
        run: |
          echo "## 🔬 Observability Audit" >> $GITHUB_STEP_SUMMARY
          echo "Outcome: **${{ steps.audit.outcome }}**" >> $GITHUB_STEP_SUMMARY
          echo "✅ কোনো সাইলেন্ট বা ব্রড exception হ্যান্ডলার পাওয়া যায়নি।" >> $GITHUB_STEP_SUMMARY

  production-readiness:
    name: 🚀 Production Readiness (Safety Guard, Multi-Model Validator, Codegraph)
    needs: [changes, pre-merge-gate]
    if: >
      (needs.pre-merge-gate.outputs.trivial_change != 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.dependencies == 'true' || github.run_attempt > 1)) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🛡️ Safety Guard - File Protection Validation
        id: safety_guard
        working-directory: backend
        run: |
          echo "## 🛡️ সেফটি গার্ড ভ্যালিডেশন" >> $GITHUB_STEP_SUMMARY
          # বাংলা মন্তব্য: poetry পরিবেশ ব্যবহার করে safety_guard.py রান করা হচ্ছে
          poetry run python ../scripts/safety_guard.py --check-only --report-json > safety-report.json 2>&1 || true

          # Parse and summarize
          if [ -f safety-report.json ]; then
            echo "✅ সেফটি গার্ড সম্পন্ন হয়েছে - রিপোর্ট দেখুন" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ সেফটি গার্ড ভ্যালিডেশন সম্পন্ন হয়েছে" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Multi-Model Validator - Security & Logic Check
        id: validator
        working-directory: backend
        run: |
          echo "## 🔍 মাল্টি-মডেল কোড ভ্যালিডেশন" >> $GITHUB_STEP_SUMMARY
          poetry run python ../scripts/multi_model_validator.py core/ --json-output validator-report.json 2>&1

          # Check for critical issues
          if [ -f validator-report.json ]; then
            CRITICAL=$(grep -c "risk_level.*CRITICAL" validator-report.json || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Found $CRITICAL CRITICAL security issues — blocking merge/deploy!" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ কোনো ক্রিটিকাল সিকিউরিটি ইস্যু পাওয়া যায়নি" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 📊 Codegraph - Knowledge Base Generation
        id: codegraph
        working-directory: backend
        run: |
          echo "## 📊 নলেজ গ্রাফ জেনারেশন" >> $GITHUB_STEP_SUMMARY
          python ../scripts/codegraph_integration.py --full --output-dir ../docs/codebase/knowledge_graph 2>&1 || true
          echo "✅ নলেজ গ্রাফ আপডেট করা হয়েছে" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Production Readiness Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-reports
          path: |
            backend/safety-report.json
            backend/validator-report.json
            docs/codebase/knowledge_graph/

      - name: 🚨 Production Readiness Summary
        if: always()
        run: |
          echo "## ✅ প্রোডাকশন রেডিনেস চেক সম্পন্ন" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### সিস্টেম স্ট্যাটাস:" >> $GITHUB_STEP_SUMMARY
          echo "- Safety Guard: ${{ steps.safety_guard.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-Model Validator: ${{ steps.validator.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Codegraph: ${{ steps.codegraph.outcome }}" >> $GITHUB_STEP_SUMMARY

  docker-build:
    name: 🐳 Build Base Image
    needs: [changes, pre-merge-gate]
    if: needs.pre-merge-gate.result == 'success' && needs.changes.outputs.docker_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ github.repository }}/backend-ci-base:latest
          # বাংলা মন্তব্য: GHCR registry cache ব্যবহার করা হচ্ছে কারণ GHA cache (10GB limit) Poetry/pnpm cache evict করে দিচ্ছিল
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/backend-ci-base:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/backend-ci-base:buildcache,mode=max

  backend-core:
    name: 🐍 Backend (Test)
    timeout-minutes: 10
    needs: [changes, pre-merge-gate, docker-build]
    if: >
      always() &&
      (needs.pre-merge-gate.result == 'success') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker_build == 'true' || github.event_name == 'workflow_dispatch' || github.run_attempt > 1)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/backend-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supreme_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      SETUPTOOLS_USE_DISTUTILS: stdlib
      SUPREMEAI_ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
      PYTHONPATH: ${{ github.workspace }}/backend
      GITHUB_TOKEN: "mock_dummy_token"
      RENDER_API_KEY: "mock_render_key"
      SUPABASE_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@postgres:5432/supreme_test_db"
      SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://test_user:test_password@postgres:5432/supreme_test_db"
      REDIS_URL: "redis://redis:6379/0"
      SUPREMEAI_JWT_SECRET: "supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad"
      ADMIN_AUTHORIZED: "true"
      DOCS_PASSWORD: "mock_docs_password"
      SUPREMEAI_ADMIN_PASSWORD_HASH: "$2b$12$mockhashmockhashmockhashmockhashmockhash"
      STRIPE_API_KEY: "mock_stripe_api_key"
      STRIPE_WEBHOOK_SECRET: "mock_stripe_webhook_secret"
      SUPABASE_URL: "https://mock.supabase.co"
      SUPABASE_KEY: "mock_supabase_key"
      GEMINI_API_KEY: "mock_gemini_api_key"
      OPENROUTER_API_KEY: "mock_openrouter_api_key"
      OPENAI_API_KEY: "mock_openai_api_key"
      ANTHROPIC_API_KEY: "mock_anthropic_api_key"
      # বাংলা মন্তব্য: টেস্ট এনভায়রনমেন্টে AuthMiddleware যেন JWT ভেরিফিকেশন এড়িয়ে যায়
      # এবং টোকেন হেডার গ্রহণ করে, সেজন্য এই দুটি ফ্ল্যাগ সেট করা হলো।
      # Production-এ এই ভ্যালু কখনো "true" হওয়া উচিত নয়।
      ALLOW_TEST_AUTH_BYPASS: "true"
      ALLOW_TEST_ORIGIN_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup Poetry Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-v3-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-v3-

      - name: 📦 Install Dependencies (Smart Sync)
        run: |
          mkdir -p backend
          cd backend
          poetry install --with dev
          poetry run python -m playwright install --with-deps chromium || poetry run python -m playwright install chromium || true

      - name: 🧪 Run Tests
        id: backend_tests
        working-directory: backend
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = 'true' ] || [ "${{ needs.changes.outputs.shared }}" = 'true' ]; then
            poetry run pytest -n auto --dist=loadfile --timeout=120 --md pytest-report.md --cov=core --cov-report=json:coverage.json --cov-report=term-missing --cov-fail-under=38 -q
          else
            echo "Skipping full backend tests, only running smoke tests."
            poetry run pytest -n auto tests/test_health.py -q
          fi

      - name: Add Backend Test Results to GitHub Summary
        if: always()
        run: |
          mkdir -p backend
          cd backend
          python ../.github/scripts/supreme_ci.py generate-report \
            --pytest-json pytest-report.md \
            --coverage-json coverage.json \
            --label Backend
      - name: GCP Auth for Artifact Registry
        # বাংলা মন্তব্য: রেন্ডার-এ স্থানান্তরের কারণে জিসিপি বিল্ড ও পুশ নিষ্ক্রিয় করা হলো।
        if: false
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Login to GAR
        if: false
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        if: false
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image to GAR
        if: false
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/supremeai-repo/supremeai-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Echo Image Digest
        if: false
        run: |
          echo "Pushed image with digest: ${{ steps.build-and-push.outputs.digest }}"

  security-audit:
    name: 🛡️ CodeQL & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [changes, pre-merge-gate]
    if: >
      (needs.pre-merge-gate.outputs.trivial_change != 'true' && (github.event_name == 'schedule' || needs.changes.outputs.dependencies == 'true' || github.run_attempt > 1)) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_backend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'python, javascript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript"

      - name: 🔍 Parallel Security Scan
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.48.3/trivy_0.48.3_Linux-64bit.deb
          sudo dpkg -i trivy_0.48.3_Linux-64bit.deb
          trivy fs --format sarif --output trivy-python.sarif --severity CRITICAL,HIGH backend &
          trivy fs --format sarif --output trivy-nodejs.sarif --severity CRITICAL,HIGH . &
          wait

      - name: Upload Trivy Python SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-python.sarif') != '' }}
        with:
          sarif_file: 'trivy-python.sarif'
          category: 'trivy-python'

      - name: Upload Trivy Node.js SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-nodejs.sarif') != '' }}
        with:
          sarif_file: 'trivy-nodejs.sarif'
          category: 'trivy-nodejs'

      - name: 📊 Add Security Audit Results to GitHub Summary
        if: always()
        run: |
          echo "## 🛡️ Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          echo "✅ CodeQL SARIF report uploaded to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trivy Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python dependencies scanned (backend/)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js dependencies scanned (apps/, tools/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View full results in the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)**" >> $GITHUB_STEP_SUMMARY

  frontend-core:
    name: 🌐 Frontend Monorepo (Turbo)
    runs-on: ubuntu-latest
    needs: [changes, pre-merge-gate]
    if: >
      !failure() && !cancelled() &&
      (
        (needs.pre-merge-gate.outputs.trivial_change != 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true' || github.run_attempt > 1)) ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_frontend_core == 'true' || github.event.inputs.ignore_dependencies == 'true'))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ⚙️ Setup Pnpm Cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 📦 Install Pnpm Dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm install --frozen-lockfile
          pnpm store prune

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build & Lint Frontend Packages
        env:
          VITE_PORTAL_TYPE: 'admin'
          VITE_API_URL: ${{ env.SUPREMEAI_API_URL }}
          VITE_API_BASE: ${{ env.SUPREMEAI_API_URL }}
        # বাংলা মন্তব্য: ওয়ার্কস্পেস থেকে web-chat রিমুভ করা হয়েছে, তাই টার্বোরেপো ফিল্টার থেকে এটি বাদ দেওয়া হল।
        run: pnpm turbo run build lint --filter=supremeai-studio-client --filter=supremeai-vscode --cache-dir=.turbo


      - name: Run Studio Client Vitest with JSON Report
        run: pnpm --dir apps/studio-client exec vitest run --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Add Studio Client Test Results to GitHub Summary
        if: always()
        run: python .github/scripts/supreme_ci.py generate-report --vitest-json apps/studio-client/vitest-report.json --label "Studio Client"

      - name: Run Web Chat Vitest with JSON Report
        if: always()
        run: |
          if [ -d "apps/web-chat" ]; then
            SUPREMEAI_API_URL="https://mock-api.supremeai.local" pnpm --dir apps/web-chat exec vitest run --reporter=json --outputFile=vitest-report.json
          else
            echo "web-chat app not found, skipping tests."
          fi

      - name: Add Web Chat Test Results to GitHub Summary
        if: always()
        run: |
          if [ -f "apps/web-chat/vitest-report.json" ]; then
            python .github/scripts/supreme_ci.py generate-report --vitest-json apps/web-chat/vitest-report.json --label "Web Chat"
          else
            echo "No web-chat test results to report."
          fi

      - name: Run VS Code Extension Tests
        run: pnpm turbo run test --filter=supremeai-vscode --cache-dir=.turbo


      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/studio-client/dist-admin
          retention-days: 1

  check-render-quota:
    name: 📊 Check Render Build Quota
    needs: [changes]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.admin_backend_changed == 'true' ||
        needs.changes.outputs.customer_backend_changed == 'true'
      )
    outputs:
      use_github_build: ${{ steps.quota.outputs.use_github_build }}
      minutes_used: ${{ steps.quota.outputs.minutes_used }}
      pct_used: ${{ steps.quota.outputs.pct_used }}
      remaining_min: ${{ steps.quota.outputs.remaining_min }}
      checked_at: ${{ steps.quota.outputs.checked_at }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore minutes cache
        uses: actions/cache@v4
        with:
          path: render_minutes_cache.json
          key: render-quota-${{ github.run_number }}
          restore-keys: |
            render-quota-

      - name: Check Render quota
        id: quota
        run: python .github/scripts/check-render-quota.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          PRIMARY_SVC_ID: srv-d9d3n58js32c738n79k0
          BACKUP_SVC_ID: srv-d9fg48bh523c73f63bb0
          RENDER_BILLING_DAY: ${{ vars.RENDER_BILLING_DAY }}
          RENDER_BILLING_DAY_BACKUP: ${{ vars.RENDER_BILLING_DAY_BACKUP }}

      - name: Save minutes cache
        uses: actions/cache@v4
        with:
          path: render_minutes_cache.json
          key: render-quota-${{ github.run_number }}

      - name: Report quota status
        run: |
          echo "### 📊 Render Build Minutes Report" >> $GITHUB_STEP_SUMMARY
          echo "**Checked at:** ${{ steps.quota.outputs.checked_at }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Minutes Used | ${{ steps.quota.outputs.minutes_used }} / 500 |" >> $GITHUB_STEP_SUMMARY
          echo "| Remaining | ${{ steps.quota.outputs.remaining_min }} min |" >> $GITHUB_STEP_SUMMARY
          echo "| Usage % | ${{ steps.quota.outputs.pct_used }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Build Mode | ${{ steps.quota.outputs.use_github_build }} |" >> $GITHUB_STEP_SUMMARY

  build-backend-image:
    name: 🐳 Build & Push Backend Image
    needs: [backend-core, pre-merge-gate, changes]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.backend-core.result != 'failure' && needs.backend-core.result != 'cancelled' && needs.backend-core.result != 'skipped' &&
      (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deploy_render == 'true') ||
        github.run_attempt > 1
      )
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/supremeai-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # বাংলা মন্তব্য: GHCR registry cache ব্যবহার করা হচ্ছে — আলাদা storage quota তাই 10GB GHA limit স্পর্শ করে না
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/supremeai-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/supremeai-backend:buildcache,mode=max

  deploy-user-backend:
    name: 🚀 Deploy User Backend (Render)
    needs: [build-backend-image, production-readiness, changes, check-render-quota]
    runs-on: ubuntu-latest
    environment: production
    if: |
      always() &&
      needs.build-backend-image.result == 'success' &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped') &&
      needs.changes.outputs.customer_backend_changed == 'true' &&
      needs.changes.outputs.admin_backend_changed == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger User Render Deploy (Prebuilt Image)
        if: needs.check-render-quota.outputs.use_github_build == 'true'
        run: |
          IMAGE_URL="ghcr.io/${{ github.repository }}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          PRIMARY_SVC_ID="srv-d9d3n58js32c738n79k0"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Primary Render deploy triggered via API with prebuilt image (status: $STATUS)!"
          else
            echo "❌ Primary API deploy with prebuilt image returned status: $STATUS"
            exit 1
          fi

      - name: Trigger User Render Deploy (Source Code)
        if: needs.check-render-quota.outputs.use_github_build != 'true'
        run: |
          PRIMARY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          PRIMARY_SUCCESS=false

          if [ -n "$PRIMARY_HOOK" ]; then
            echo "Triggering primary Render account (Customer backend)..."
            if curl -f -s "$PRIMARY_HOOK" > /dev/null; then
              echo "✅ Primary Render deploy triggered successfully!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary hook failed."
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ] && [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "🔄 Using Render API to trigger primary deploy..."
            PRIMARY_SVC_ID="srv-d9d3n58js32c738n79k0"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Primary Render deploy triggered via API (status: $STATUS)!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary API deploy returned status: $STATUS"
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy hooks or API triggers succeeded for User backend! Failing build."
            exit 1
          fi

      - name: Verify User Backend Deploy Status
        run: |
          # বাংলা মন্তব্য (জরুরি): এই পদে শুধু User Backend (srv-d9d3n58js32c738n79k0) আইসোলেটেডভাবে ভেরিফাই হবে.
          # অন্য কোনো ব্যাকএন্ডের হেলথ চেক এখানে মেপে মিথ্যা Success দেওয়া সম্পূর্ণ নিষিদ্ধ।
          python .github/scripts/verify-render-deploy.py --service-id srv-d9d3n58js32c738n79k0 --name "User Backend"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}

  deploy-admin-backend:
    name: 🚀 Deploy Admin Backend (Render)
    needs: [build-backend-image, production-readiness, changes, check-render-quota]
    runs-on: ubuntu-latest
    environment: production
    if: |
      always() &&
      needs.build-backend-image.result == 'success' &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped') &&
      needs.changes.outputs.admin_backend_changed == 'true' &&
      needs.changes.outputs.customer_backend_changed == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Admin Render Deploy (Prebuilt Image)
        if: needs.check-render-quota.outputs.use_github_build == 'true'
        run: |
          IMAGE_URL="ghcr.io/${{ github.repository }}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          BACKUP_SVC_ID="srv-d9fg48bh523c73f63bb0"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_BACKUP }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Admin Render deploy triggered via API with prebuilt image (status: $STATUS)!"
          else
            echo "❌ Admin API deploy with prebuilt image returned status: $STATUS"
            exit 1
          fi

      - name: Trigger Admin Render Deploy (Source Code)
        if: needs.check-render-quota.outputs.use_github_build != 'true'
        run: |
          BACKUP_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}"
          BACKUP_API_KEY="${{ secrets.RENDER_API_KEY_BACKUP }}"
          BACKUP_SVC_ID="srv-d9fg48bh523c73f63bb0"
          BACKUP_SUCCESS=false

          if [ -n "$BACKUP_HOOK" ]; then
            echo "🔄 Triggering admin backend via deploy webhook..."
            if curl -f -s "$BACKUP_HOOK" > /dev/null; then
              echo "✅ Admin backup hook triggered!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin backup webhook failed."
            fi
          elif [ -n "$BACKUP_API_KEY" ]; then
            echo "🔄 Using Render API to trigger admin backend deploy..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
              -H "Authorization: Bearer $BACKUP_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            # বাংলা মন্তব্য: ৪০৪ মানে API key-টি এই service-এর মালিক নয়।
            # ভুল service-এ fallback deploy করা সম্পূর্ণ নিষিদ্ধ — সরাসরি fail করতে হবে।
            if [ "$STATUS" = "404" ]; then
              echo "❌ Admin service $BACKUP_SVC_ID returned 404. RENDER_API_KEY_BACKUP does not own this service."
              echo "❌ ACTION REQUIRED: Set RENDER_DEPLOY_HOOK_URL_BACKUP webhook for Admin backend in GitHub Secrets."
              exit 1
            fi
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Admin Render deploy triggered via API (status: $STATUS)!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin API deploy returned status: $STATUS"
            fi
          fi

          if [ "$BACKUP_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy hooks or API triggers succeeded for Admin backend!"
            echo "❌ Set RENDER_DEPLOY_HOOK_URL_BACKUP in GitHub Secrets from Render Dashboard > supremeai-admin > Settings > Deploy Hook."
            exit 1
          fi

      - name: Verify Admin Backend Deploy Status
        run: |
          # বাংলা মন্তব্য (জরুরি): এই পদে শুধু Admin Backend (srv-d9fg48bh523c73f63bb0) আইসোলেটেডভাবে ভেরিফাই হবে।
          python .github/scripts/verify-render-deploy.py --service-id srv-d9fg48bh523c73f63bb0 --name "Admin Backend"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}

  deploy-combined-backend:
    name: 🚀 Deploy Combined Backend (Render)
    needs: [build-backend-image, production-readiness, changes, check-render-quota]
    runs-on: ubuntu-latest
    environment: production
    if: |
      always() &&
      needs.build-backend-image.result == 'success' &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped') &&
      needs.changes.outputs.admin_backend_changed == 'true' &&
      needs.changes.outputs.customer_backend_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Combined Render Deploy (Prebuilt Image)
        if: needs.check-render-quota.outputs.use_github_build == 'true'
        run: |
          # বাংলা মন্তব্য: GitHub Build মোড সক্রিয় থাকলে একই প্রি-বিল্ট ডকার ইমেজ Primary এবং Backup উভয় ব্যাকএন্ড সার্ভিসে ডেপ্লয় করা হচ্ছে।
          IMAGE_URL="ghcr.io/${{ github.repository }}/supremeai-backend:sha-${{ github.sha }}"
          echo "🐳 GitHub build mode ACTIVE! Deploying pre-built image: $IMAGE_URL"
          PRIMARY_SVC_ID="srv-d9d3n58js32c738n79k0"
          BACKUP_SVC_ID="srv-d9fg48bh523c73f63bb0"

          # Deploy Primary
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Primary Render deploy triggered with prebuilt image (status: $STATUS)!"
          else
            echo "⚠️ Primary API deploy returned status: $STATUS"
          fi

          # Deploy Backup
          if [ -n "${{ secrets.RENDER_API_KEY_BACKUP }}" ]; then
            STATUS_B=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_BACKUP }}" \
              -H "Content-Type: application/json" \
              -d "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_URL\"}")
            if [ "$STATUS_B" = "201" ] || [ "$STATUS_B" = "202" ]; then
              echo "✅ Backup Render deploy triggered with prebuilt image (status: $STATUS_B)!"
            else
              echo "⚠️ Backup API deploy returned status: $STATUS_B"
            fi
          fi

          # বাংলা মন্তব্য (জরুরি): এই কন্ডিশন ও exit 1 কোডটি অপরিবর্তনীয়!
          # Primary এবং Backup উভয় ডেপ্লয়মেন্ট ট্রিগারই যদি ব্যর্থ হয় (401/403/404 Status), তবে জবটিকে মিথ্যা Success হতে দেওয়া যাবে না।
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "202" ] && [ "$STATUS_B" != "201" ] && [ "$STATUS_B" != "202" ]; then
            echo "❌ CRITICAL: Both primary and backup prebuilt-image deploys failed to trigger! Failing build."
            exit 1
          fi

      - name: Trigger Combined Render Deploy (Source Code)
        if: needs.check-render-quota.outputs.use_github_build != 'true'
        run: |
          PRIMARY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          BACKUP_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}"
          BACKUP_API_KEY="${{ secrets.RENDER_API_KEY_BACKUP }}"
          BACKUP_SVC_ID="srv-d9fg48bh523c73f63bb0"

          PRIMARY_SUCCESS=false
          BACKUP_SUCCESS=false

          if [ -n "$PRIMARY_HOOK" ]; then
            echo "Trying primary Render account..."
            if curl -f -s "$PRIMARY_HOOK" > /dev/null; then
              echo "✅ Primary Render deploy triggered successfully!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary hook failed."
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ] && [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "🔄 Using Render API to trigger primary deploy..."
            PRIMARY_SVC_ID="srv-d9d3n58js32c738n79k0"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$PRIMARY_SVC_ID/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Primary Render deploy triggered via API (status: $STATUS)!"
              PRIMARY_SUCCESS=true
            else
              echo "⚠️ Primary API deploy returned status: $STATUS"
            fi
          fi

          if [ -n "$BACKUP_HOOK" ]; then
            echo "🔄 Triggering admin backend via deploy webhook..."
            if curl -f -s "$BACKUP_HOOK" > /dev/null; then
              echo "✅ Admin backup hook triggered!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin backup webhook failed."
            fi
          elif [ -n "$BACKUP_API_KEY" ]; then
            echo "🔄 Using Render API to trigger admin backend deploy..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/$BACKUP_SVC_ID/deploys" \
              -H "Authorization: Bearer $BACKUP_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            # বাংলা মন্তব্য: ৪০৪ মানে API key-টি এই admin service-এর মালিক নয়।
            # primary service-এ চুপচাপ deploy করা সম্পূর্ণ নিষিদ্ধ — এটা false-positive তৈরি করে।
            if [ "$STATUS" = "404" ]; then
              echo "⚠️ Admin service $BACKUP_SVC_ID returned 404. RENDER_API_KEY_BACKUP does not own this service."
              echo "⚠️ Admin backend deploy skipped — set RENDER_DEPLOY_HOOK_URL_BACKUP to fix this."
            elif [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "✅ Admin Render deploy triggered via API (status: $STATUS)!"
              BACKUP_SUCCESS=true
            else
              echo "⚠️ Admin API deploy returned status: $STATUS"
            fi
          fi

          if [ "$PRIMARY_SUCCESS" = "false" ] && [ "$BACKUP_SUCCESS" = "false" ]; then
            echo "❌ CRITICAL: No Render deploy hooks or API triggers succeeded! Failing build."
            exit 1
          fi

      - name: Verify Render Deploy Health
        run: python .github/scripts/verify-render-deploy.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}



  deploy-backend:
    name: 🚀 Deploy Backend (Cloud Run)
    needs: [backend-core, security-audit]
    # TEMPORARILY DISABLED: Remove `false` and restore conditions to reactivate Cloud Run deployment
    if: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: GCP Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate Docker to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/supremeai-repo/supremeai-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 🚀 Deploy API to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python .github/scripts/supreme_ci.py deploy



  flutter-integration-tests:
    name: 📱 Flutter Integration Test
    needs: frontend-core
    if: github.event_name == 'pull_request' # শুধুমাত্র PR-এর জন্য চালানো যেতে পারে
    runs-on: macos-latest # iOS সিমুলেটরের জন্য macOS প্রয়োজন
    strategy:
      matrix:
        api-level: [30] # Android API level
        target: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter pub get
      - name: Run Flutter Integration Tests (Android)
        if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          script: cd apps/mobile && flutter test integration_test
      - name: Run Flutter Integration Tests (iOS)
        if: matrix.target == 'ios'
        run: |
          cd apps/mobile
          flutter test integration_test

  build-and-release-desktop:
    name: 🖥️ Build & Release Desktop App
    needs: [backend-core, frontend-core]
    # শুধুমাত্র main ব্রাঞ্চে নতুন ট্যাগ (vX.X.X) পুশ করা হলে এই জবটি চলবে
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        # বাংলা মন্তব্য: তিনটি প্রধান অপারেটিং সিস্টেমের জন্য বিল্ড ম্যাট্রিক্স তৈরি করা হলো।
        include:
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            pnpm_arch_filter: '--filter=supremeai-desktop'
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            pnpm_arch_filter: '--filter=supremeai-desktop'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            pnpm_arch_filter: '--filter=supremeai-desktop'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 🦀 Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - name: 📦 Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: ⬇️ Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      # বাংলা মন্তব্য: লিনাক্সের জন্য প্রয়োজনীয় সিস্টেম লাইব্রেরি ইনস্টল করা হচ্ছে।
      - name: 🐧 Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 🔨 Build Tauri App
        # tauri.conf.json থেকে beforeBuildCommand (npm run build:ui) স্বয়ংক্রিয়ভাবে চলবে
        run: pnpm ${{ matrix.pnpm_arch_filter }} tauri build --target ${{ matrix.target }}

      - name: 📦 Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          # বিল্ড হওয়া অ্যাসেটগুলোর পাথ খুঁজে বের করে আপলোড করা হচ্ছে
          asset_path: ./apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          asset_name: supremeai-desktop_${{ github.ref_name }}_${{ matrix.target }}.msi
          asset_content_type: application/x-msi
        if: matrix.platform == 'windows-latest'
      # macOS এবং Linux-এর জন্য একই রকম 'upload-release-asset' ধাপ যোগ করতে হবে।
      # উদাহরণস্বরূপ, macOS-এর জন্য:
      # asset_path: ./apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
      # asset_name: supremeai-desktop_${{ github.ref_name }}_${{ matrix.target }}.dmg
      # asset_content_type: application/x-apple-diskimage

      # Linux-এর জন্য:
      # asset_path: ./apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
      # asset_name: supremeai-desktop_${{ github.ref_name }}_${{ matrix.target }}.AppImage
      # asset_content_type: application/octet-stream



  deploy-admin-firebase:
    name: 🚀 Deploy Admin Portal (Firebase)
    needs: [pre-merge-gate, changes]
    # Trigger if frontend files changed
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.pre-merge-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Build Admin
        env:
          # বাংলা মন্তব্য: আগে এই build step-এ কোনো VITE_API_URL সেট করা হতো না, তাই Vite build-time bake করে
          # ফেলা admin bundle backend URL না পেয়ে utils/api.ts-এর ডিফল্ট fallback (RENDER_BACKENDS[0] = user-role
          # সার্ভিস) ব্যবহার করত — যেটাতে ADMIN_CORS_ORIGINS সেট নেই, ফলে সব admin API call CORS-এ ব্লক হতো।
          # এখন explicit ভাবে admin-role সার্ভিসের URL পাস করা হচ্ছে (repo variable দিয়ে override করা যায়,
          # ডিফল্ট মান render.yaml-এর supremeai-admin সার্ভিসের ALLOWED_HOSTS থেকে নেওয়া, হার্ডকোড নয়)।
          VITE_API_URL: ${{ vars.SUPREMEAI_ADMIN_API_URL || 'https://supremeai-admin.onrender.com' }}
          VITE_API_BASE: ${{ vars.SUPREMEAI_ADMIN_API_URL || 'https://supremeai-admin.onrender.com' }}
        run: VITE_PORTAL_TYPE=admin pnpm --dir apps/studio-client run build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        # বাংলা মন্তব্য (জরুরি): FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A অথবা FIREBASE_SERVICE_ACCOUNT সিক্রেট না থাকলে
        # বা রিমোট সিক্রেট মিসিং হলে এই হোস্ট ডেপ্লয়মেন্ট ব্যর্থ হলেও পুরো CI বিল্ড ফেল করবে না।
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: supremeai-a
          channelId: live
          target: admin

  deploy-user-vercel:
    name: 🚀 Deploy User Portal (Vercel)
    needs: [pre-merge-gate, changes]
    # Trigger if frontend files changed
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.pre-merge-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI & pnpm
        run: |
          npm install -g pnpm
          npm install --global vercel@latest
      - name: Install Dependencies
        run: pnpm install
      - name: Build User Portal
        env:
          # বাংলা মন্তব্য: user-role ব্যাকএন্ডের URL এখন এখানেও explicit করা হলো (আগে অনুপস্থিত ছিল)।
          # ডিফল্ট মান render.yaml-এর supremeai-backend সার্ভিসের ALLOWED_HOSTS থেকে নেওয়া।
          VITE_API_URL: ${{ vars.SUPREMEAI_USER_API_URL || 'https://supremeai-backend.onrender.com' }}
          VITE_API_BASE: ${{ vars.SUPREMEAI_USER_API_URL || 'https://supremeai-backend.onrender.com' }}
        run: VITE_PORTAL_TYPE=user pnpm --dir apps/studio-client run build
      - name: Deploy to Vercel
        run: |
          pnpm exec vercel deploy --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  sync-mirror:
    name: 📤 Sync to Secondary Repo
    needs: [deploy-backend, deploy-admin-firebase, deploy-user-vercel, security-audit]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-backend.result != 'failure' && needs.deploy-backend.result != 'cancelled' &&
      needs.deploy-admin-firebase.result != 'failure' && needs.deploy-admin-firebase.result != 'cancelled' &&
      needs.deploy-user-vercel.result != 'failure' && needs.deploy-user-vercel.result != 'cancelled' &&
      needs.security-audit.result != 'failure' && needs.security-audit.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true

      - name: 📤 Sync to Secondary Repo (Staging Dispatch)
        if: env.MIRROR_REPO_TOKEN != ''
        env:
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          git config lfs.allowincompletepush true
          git remote add mirror https://${MIRROR_REPO_TOKEN}@github.com/SaifulHaqueNiloy/supremeai.git
          git push --force mirror main:refs/heads/main

  canary-deploy:
    name: "🚀 Canary Deploy Backend (Cloud Run)"
    runs-on: ubuntu-latest
    # TEMPORARILY DISABLED: রেন্ডার-এ স্থানান্তরের কারণে জিসিপি ক্যানারি ডিপ্লয়মেন্ট নিষ্ক্রিয় করা হলো।
    if: false
    needs: [backend-core, security-audit]
    # backend-core এবং security-audit সফল হলে তবেই এটি চলবে
    # deploy-backend এর পরিবর্তে এই জবটি ব্যবহার করা হবে
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: GCP Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🐤 Run Canary Deployment Script
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          # CANDIDATE_REVISION: Cloud Build থেকে পাওয়া নতুন রিভিশন এখানে পাস করতে হবে
          # আপাতত, সর্বশেষ রিভিশন স্বয়ংক্রিয়ভাবে পাওয়ার লজিক canary-deploy.py-তে থাকবে
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ERROR_RATE_THRESHOLD: "0.01" # 1%
          LATENCY_P99_THRESHOLD_MS: "2000" # 2000ms
        run: |
          python .github/scripts/canary-deploy.py

  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - pre-merge-gate
      - ai-scribe-docs
      - observability-audit
      - production-readiness
      - docker-build
      - backend-core
      - security-audit
      - frontend-core
      - check-render-quota
      - build-backend-image
      - deploy-user-backend
      - deploy-admin-backend
      - deploy-combined-backend
      - deploy-backend
      - flutter-integration-tests
      - build-and-release-desktop
      - deploy-admin-firebase
      - deploy-user-vercel
      - sync-mirror
      - canary-deploy
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: 🧠 Generate Smart Pipeline Summary (Zero-Dependency)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/ci_smart_summary.py
