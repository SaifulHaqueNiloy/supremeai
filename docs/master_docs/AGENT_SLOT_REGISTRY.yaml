# Agent Slot Registry (GAP-08 fix)
# ================================
# পলিমরফিক এজেন্ট স্লট রেজিস্ট্রি — কে কোন স্লট, কতদিনের জন্য, কোন maintainer
# অ্যাসাইন করেছেন তার living record।
#
# Problem (ARCH-GAP-01 GAP-08):
#   OPS-06 বলছে agent-1=Antigravity, agent-2=Claude, agent-10=SupremeAI —
#   কিন্তু এই ম্যাপিং কোথাও formally রেকর্ড করা হয়নি। একই সময়ে দুজন ভিন্ন
#   maintainer দুটি ভিন্ন টুলকে agent-1 হিসেবে অ্যাসাইন করতে পারেন — কোনো
#   conflict prevention নেই।
#
# Solution:
#   এই YAML ফাইলটি single source of truth। প্রতিটি স্লট অ্যাসাইনমেন্টের জন্য:
#     - slot: agent-N
#     - tool: <tool name>
#     - maintainer: <github username>
#     - assigned_on: <date>
#     - expires_on: <date>  (max 7 days, then auto-release)
#     - active: true/false

version: "1.0"

# Real-time liveness: assigned slots show 🟢 online on the /api/agents
# dashboard when their tool pings the shared heartbeat store. Integration
# guide per tool: docs/agents/heartbeat-integration.md (issue #1402).

# Agent slot assignments — per OPS-06 §5 (Polymorphic Agent Assignment)
# 10 slots defined; maintainer activates/deactivates as needed.
# Note: OPS-06 Safeguard 5 (Max Concurrent Agent Policy) currently caps active
# slots at 5 for rate-budget reasons. If >5 slots are activated simultaneously,
# update Safeguard 5's policy threshold accordingly.
slots:
