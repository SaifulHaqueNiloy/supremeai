
# ==============================================================================
# supreme-core-ci.yml — SupremeAI Core CI Orchestrator (Refactored)
# ==============================================================================
# বাংলা মন্তব্য: এই ফাইলটি পূর্বের ২০৬২ লাইনের মনোলিথিক CI ফাইলকে প্রতিস্থাপন করেছে।
# এখন সব কাজ ৯টি আলাদা reusable workflow (_*.yml) ফাইলে বিভক্ত।
# এই orchestrator শুধু সেগুলোকে সঠিক ক্রমে এবং শর্ত অনুযায়ী কল করে।
# ==============================================================================

name: 🧠 SupremeAI Core CI

on:
  workflow_dispatch:
    inputs:
      run_pre_merge_gate:
        description: 'Run Pre-Merge Gate'
        type: boolean
        default: true
      run_backend_core:
        description: 'Run Backend Core'
        type: boolean
        default: true
      run_frontend_core:
        description: 'Run Frontend Core'
        type: boolean
        default: true
      run_performance_e2e:
        description: 'Run Performance E2E'
        type: boolean
        default: true
      run_deploy_render:
        description: 'Run Deploy to Render'
        type: boolean
        default: true
      ignore_dependencies:
        description: 'Force run selected job even if upstream jobs are skipped? (Not for deploy)'
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  schedule:
    - cron: '0 0 * * *'

# ==============================================================================
# [IMMUTABLE CONFIGURATION - MANUAL CONTROL ONLY]
# ------------------------------------------------------------------------------
# DO NOT ALLOW AI AGENTS TO MODIFY THIS CONCURRENCY LOGIC.
# Purpose: Ensures new pushes cancel pending/running jobs in this pipeline.
# ==============================================================================
# বাংলা মন্তব্য: যেকোনো ব্রাঞ্চেই নতুন পুশ আসলে পুরানো রানিং জবগুলো যেন বাতিল হয়ে যায়,
# সেজন্য ref-এর পরিবর্তে শুধু workflow-ভিত্তিক concurrency group সেট করা হলো।
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'
  SUPREMEAI_API_URL: ${{ vars.SUPREMEAI_API_URL }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================================
  # STAGE 0: CHANGE DETECTION
  # বাংলা মন্তব্য: কোন ফাইল পরিবর্তন হয়েছে সেটি detect করে পরবর্তী stage-গুলো
  # conditional ভাবে চালানো হয়। এটি CI মিনিট বাঁচায়।
  # ============================================================================
  changes:
    runs-on: ubuntu-latest
    # promotion/staging-* branch থেকে আসা PR-এর কোড second repo-তে ইতিমধ্যে পুরো
    # supreme-core-ci pipeline দিয়ে verified — তাই এই pull_request-triggered রান স্কিপ করা হচ্ছে।
    # merge-এর পরে main-এ push হওয়ার সময় এই একই workflow স্বাভাবিকভাবে আবার চলবে।
    if: "!startsWith(github.head_ref, 'promotion/staging')"
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      docker_build: ${{ steps.filter.outputs.docker_build == 'true' || steps.detect.outputs.force_docker_build == 'true' || github.run_attempt > 1 }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      admin_needed: ${{ steps.filter.outputs.admin == 'true' || steps.filter.outputs.shared == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      user_needed: ${{ steps.filter.outputs.user == 'true' || steps.filter.outputs.shared == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}
      dependencies: ${{ steps.filter.outputs.dependencies == 'true' || steps.detect.outputs.force_dependencies == 'true' || github.run_attempt > 1 }}
      docs_only: ${{ steps.filter.outputs.docs_only == 'true' }}
      admin_backend_changed: ${{ steps.filter.outputs.admin_backend == 'true' || steps.filter.outputs.shared_backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      customer_backend_changed: ${{ steps.filter.outputs.customer_backend == 'true' || steps.filter.outputs.shared_backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}
      trivial_change: ${{ steps.gate-logic.outputs.trivial_change }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect previous failures
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/detect-previous-failures.py

          # Parse the base64 output
          B64_JSON=$(grep "force_flags_b64=" $GITHUB_OUTPUT | sed 's/^force_flags_b64=//')
          if [ ! -z "$B64_JSON" ]; then
            JSON_STR=$(echo "$B64_JSON" | base64 --decode)
            echo "force_backend=$(echo $JSON_STR | jq -r '.backend')" >> $GITHUB_OUTPUT
            echo "force_frontend=$(echo $JSON_STR | jq -r '.frontend')" >> $GITHUB_OUTPUT
            echo "force_docker_build=$(echo $JSON_STR | jq -r '.docker_build')" >> $GITHUB_OUTPUT
            echo "force_dependencies=$(echo $JSON_STR | jq -r '.dependencies')" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            docker_build:
              - 'backend/Dockerfile.ci'
              - 'backend/poetry.lock'
            backend:
              - 'backend/**'
              - 'api/**'
              - 'core/**'
              - '.github/workflows/**'
            admin_backend:
              - 'backend/api/routes/admin.py'
              - 'backend/api/routes/admin_dashboard.py'
              - 'backend/api/routes/admin_librarian.py'
              - 'backend/api/routes/simulator_admin.py'
              - 'backend/api/routes/tenant_admin.py'
              - 'backend/api/routers.py'
              - 'backend/api/__init__.py'
              - 'backend/api/routes/public_config.py'
              - 'backend/api/routes/preferences.py'
              - 'backend/core/app_admin.py'
              - 'backend/core/app_builder.py'
              - 'admin/**'
            customer_backend:
              - 'backend/**'
              - '!backend/api/routes/admin.py'
              - '!backend/api/routes/admin_dashboard.py'
              - '!backend/api/routes/admin_librarian.py'
              - '!backend/api/routes/simulator_admin.py'
              - '!backend/api/routes/tenant_admin.py'
              - '!backend/api/routers.py'
              - '!backend/api/__init__.py'
              - '!backend/api/routes/public_config.py'
              - '!backend/api/routes/preferences.py'
              - '!backend/core/app_admin.py'
              - '!backend/core/app_builder.py'
            shared_backend:
              - 'backend/core/**'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - 'backend/Dockerfile'
              - '.github/workflows/**'
              - '.github/actions/**'
            frontend:
              - 'apps/studio-client/**'
              - 'apps/web-chat/**'
              - 'admin/**'
              - 'firebase.json'
              - '.github/workflows/**'
            admin:
              - 'apps/studio-client/src/pages/admin/**'
            user:
              - 'apps/studio-client/src/pages/user/**'
              - 'apps/studio-client/src/pages/auth/**'
            shared:
              - 'apps/studio-client/src/components/**'
              - 'apps/studio-client/src/store/**'
              - 'apps/studio-client/src/package.json'
            dependencies:
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
            docs_only:
              - '**.md'
              - 'docs/**'

      - name: Compute Trivial Change
        id: gate-logic
        run: |
          BACKEND="${{ steps.filter.outputs.backend == 'true' || steps.detect.outputs.force_backend == 'true' || github.run_attempt > 1 }}"
          FRONTEND="${{ steps.filter.outputs.frontend == 'true' || steps.detect.outputs.force_frontend == 'true' || github.run_attempt > 1 }}"
          DEPS="${{ steps.filter.outputs.dependencies == 'true' || steps.detect.outputs.force_dependencies == 'true' || github.run_attempt > 1 }}"
          DOCS_ONLY="${{ steps.filter.outputs.docs_only == 'true' }}"
          if [[ "$BACKEND" == 'false' && "$FRONTEND" == 'false' && "$DEPS" == 'false' && "$DOCS_ONLY" == 'true' ]]; then
            echo "trivial_change=true" >> $GITHUB_OUTPUT
          else
            echo "trivial_change=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # STAGE 1: PREFLIGHT — সার্ভিস কানেক্টিভিটি, Env Drift, Infisical ভেরিফিকেশন
  # বাংলা মন্তব্য: changes job-এর সাথে parallel-এ চলে। Fail হলে পুরো workflow বাতিল।
  # ============================================================================
  preflight:
    name: 🔌 Preflight
    needs: [changes]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_pre_merge_gate == true)
    uses: ./.github/workflows/_preflight.yml
    secrets: inherit
    with:
      python_version: '3.11'

  # ============================================================================
  # STAGE 2: SECURITY — CodeQL + Trivy স্ক্যান
  # বাংলা মন্তব্য: preflight pass হওয়ার পর চলে।
  # ============================================================================
  security:
    name: 🛡️ Security
    needs: [changes, preflight]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_pre_merge_gate == true)
    uses: ./.github/workflows/_security.yml
    secrets: inherit
    with:
      python_version: '3.11'

  # ============================================================================
  # STAGE 3: BACKEND TESTS — Pre-Merge Gate + Backend Core Tests
  # বাংলা মন্তব্য: preflight pass হলে চলে। backend বা docs পরিবর্তন হলে full test run।
  # ============================================================================
  backend-tests:
    name: 🐍 Backend Tests
    needs: [changes, preflight]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' && inputs.ignore_dependencies == true || (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled'))) &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_backend_core == true)
    uses: ./.github/workflows/_backend-test.yml
    secrets: inherit
    with:
      python_version: '3.11'
      node_version: '24'
      backend_changed: ${{ needs.changes.outputs.backend == 'true' }}
      docker_build_changed: ${{ needs.changes.outputs.docker_build == 'true' }}
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
      trivial_change: ${{ needs.changes.outputs.trivial_change == 'true' }}
      run_attempt: ${{ github.run_attempt }}

  # ============================================================================
  # STAGE 3 (PARALLEL): FRONTEND TESTS — Turbo Build, Vitest, Bundle Check
  # বাংলা মন্তব্য: backend-tests-এর সাথে parallel-এ চলে, সময় বাঁচায়।
  # ============================================================================
  frontend-tests:
    name: 🌐 Frontend Tests
    needs: [changes, preflight]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' && inputs.ignore_dependencies == true || (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled'))) &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_frontend_core == true)
    uses: ./.github/workflows/_frontend-test.yml
    secrets: inherit
    with:
      node_version: '24'
      frontend_changed: ${{ needs.changes.outputs.frontend == 'true' }}
      dependencies_changed: ${{ needs.changes.outputs.dependencies == 'true' }}
      run_attempt: ${{ github.run_attempt }}

  # ============================================================================
  # STAGE 4: PRODUCTION READINESS — Safety Guard, Multi-Model Validator
  # বাংলা মন্তব্য: backend ও frontend দুটো pass হওয়ার পরে চলে।
  # ============================================================================
  production-readiness:
    name: 🚀 Production Readiness
    needs: [changes, backend-tests, frontend-tests]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' && inputs.ignore_dependencies == true || (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled'))) &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')
    uses: ./.github/workflows/_production-readiness.yml
    secrets: inherit
    with:
      python_version: '3.11'

  # ============================================================================
  # STAGE 5: BUILD BACKEND — Docker Build ও GHCR Push
  # বাংলা মন্তব্য: শুধু main branch push-এ বা docker build ফাইল পরিবর্তন হলে চলে।
  # ============================================================================
  build-backend:
    name: 🐳 Build Backend
    needs: [changes, backend-tests]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' && inputs.ignore_dependencies == true || (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled'))) &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.docker_build == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped')
    uses: ./.github/workflows/_build-backend.yml
    secrets: inherit
    with:
      docker_build_changed: ${{ needs.changes.outputs.docker_build == 'true' }}

  # ============================================================================
  # STAGE 6: DEPLOY TO RENDER — Backend (User + Admin)
  # বাংলা মন্তব্য: শুধু main branch push-এ চলে। backend test ও production readiness pass হওয়া আবশ্যক।
  # ============================================================================
  deploy-render:
    name: 🚀 Deploy Render
    needs: [changes, backend-tests, production-readiness, build-backend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_deploy_render == true)) &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped')
    uses: ./.github/workflows/_deploy-render.yml
    secrets: inherit
    with:
      admin_backend_changed: ${{ needs.changes.outputs.admin_backend_changed == 'true' }}
      customer_backend_changed: ${{ needs.changes.outputs.customer_backend_changed == 'true' }}

  # ============================================================================
  # STAGE 6 (PARALLEL): DEPLOY FRONTEND — Firebase Admin + Vercel User
  # বাংলা মন্তব্য: deploy-render-এর সাথে parallel-এ চলে।
  # ============================================================================
  deploy-frontend:
    name: 🚀 Deploy Frontend
    needs: [changes, frontend-tests, production-readiness]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_deploy_render == true)) &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped') &&
      (needs.changes.outputs.admin_needed == 'true' || needs.changes.outputs.user_needed == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-frontend.yml
    secrets: inherit

  # STAGE 6 (PARALLEL): SYNC MIRROR — Secondary repo-তে main push
  # বাংলা মন্তব্য: deploy-render ও deploy-frontend-এর সাথে parallel চলবে।
  # paykaribazaronline/supremeai রিপোজিটরির ক্ষেত্রে এই জবটি skip করা হবে (লুপ এড়াতে)।
  # MIRROR_REPO_TOKEN না থাকলে gracefully skip করবে — CI fail করবে না।
  # ============================================================================
  sync-mirror:
    name: 🔄 Sync Mirror Repo
    needs: [backend-tests, frontend-tests, production-readiness]
    if: |
      always() &&
      github.repository != 'paykaribazaronline/supremeai' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !startsWith(github.head_ref, 'promotion/staging') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_deploy_render == true)) &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.production-readiness.result == 'success' || needs.production-readiness.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔄 Push to Production Mirror (paykaribazaronline)
        # বাংলা মন্তব্য: SaifulHaqueNiloy/supremeai (origin) থেকে paykaribazaronline/supremeai (production target)-এ push।
        # MIRROR_REPO_TOKEN না থাকলে warning দিয়ে gracefully skip — CI fail করবে না।
        env:
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          if [ -z "$MIRROR_REPO_TOKEN" ]; then
            echo "::warning::MIRROR_REPO_TOKEN not set — mirror sync to paykaribazaronline skipped"
            echo "⚠️ Mirror sync skipped (token absent)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git remote add target \
            https://${MIRROR_REPO_TOKEN}@github.com/paykaribazaronline/supremeai.git
          git push target main:refs/heads/main --force-with-lease || \
            git push target main:refs/heads/main
          echo "✅ Mirror sync to paykaribazaronline/supremeai completed" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 7: POST-DEPLOY VERIFICATION — Production endpoint health check
  # বাংলা মন্তব্য: deploy সম্পন্ন হওয়ার পর production URL গুলো যাচাই করে।
  # ============================================================================
  post-deploy-verify:
    name: ✅ Post-Deploy Verify
    needs: [deploy-render, deploy-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_performance_e2e == true)) &&
      (needs.deploy-render.result == 'success' || needs.deploy-frontend.result == 'success' || needs.deploy-render.result == 'skipped' || needs.deploy-frontend.result == 'skipped')
    uses: ./.github/workflows/_post-deploy-verify.yml
    secrets: inherit
    with:
      python_version: '3.11'

  # ============================================================================
  # STAGE 8: FINAL SUMMARY — সব stage-এর ফলাফল একটি summary-তে দেখায়
  # বাংলা মন্তব্য: সর্বশেষ job — সব কিছু শেষ হওয়ার পরে চলে। GitHub Step Summary আপডেট করে।
  # sync-mirror ও deploy-frontend এখন needs-এ যোগ করা হয়েছে।
  # ============================================================================
  final-summary:
    name: 📋 Final Summary
    needs:
      - preflight
      - security
      - backend-tests
      - frontend-tests
      - production-readiness
      - build-backend
      - deploy-render
      - deploy-frontend
      - sync-mirror
      - post-deploy-verify
    if: always()
    uses: ./.github/workflows/_final-summary.yml
    secrets: inherit
    with:
      preflight_status: ${{ needs.preflight.result }}
      security_status: ${{ needs.security.result }}
      backend_test_status: ${{ needs.backend-tests.result }}
      frontend_test_status: ${{ needs.frontend-tests.result }}
      production_readiness_status: ${{ needs.production-readiness.result }}
      build_status: ${{ needs.build-backend.result }}
      deploy_status: ${{ needs.deploy-render.result }}
      frontend_deploy_status: ${{ needs.deploy-frontend.result }}
      mirror_status: ${{ needs.sync-mirror.result }}
      verify_status: ${{ needs.post-deploy-verify.result }}
