# ==============================================================================
# _preflight.yml — Service Preflight Checks
# ==============================================================================
# Extracted from supreme-core-ci.yml (lines 183-362)
# This file is called via workflow_call from the orchestrator.
# ==============================================================================

name: 🔌 Preflight Checks

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        type: string
        required: false
        default: '3.11'

jobs:
  service-preflight:
    name: 🔌 Service Preflight Connectivity Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔌 Ping all external services
        run: python .github/scripts/service_preflight_check.py
        env:
          RENDER_API_KEY:           ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP:    ${{ secrets.RENDER_API_KEY_BACKUP }}
          PRIMARY_SVC_ID:           ${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-d9d3n58js32c738n79k0' }}
          BACKUP_SVC_ID:            ${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}
          VERCEL_TOKEN:             ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}
          MIRROR_REPO_TOKEN:        ${{ secrets.MIRROR_REPO_TOKEN }}

      - name: 🚨 Force Cancel Workflow on Preflight Failure
        if: failure()
        run: |
          echo "❌ Service Preflight FAILED — force canceling entire workflow to save CI minutes..." >> $GITHUB_STEP_SUMMARY
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-drift-check:
    name: 🔑 Env/Secret Drift Check (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        env: [github-actions, vercel-frontend, firebase-gcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install PyYAML
        run: pip install pyyaml
      - name: 🔍 Audit env usage vs registry [${{ matrix.env }}]
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK_URL_BACKUP: ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKUP }}
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
          RENDER_BACKUP_SVC_ID: ${{ secrets.RENDER_BACKUP_SVC_ID }}
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
          SUPREMEAI_GITHUB_TOKEN: ${{ secrets.SUPREMEAI_GITHUB_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SUPREMEAI_ADMIN_PASSWORD_HASH: ${{ secrets.SUPREMEAI_ADMIN_PASSWORD_HASH }}
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUPREMEAI_API_KEY: ${{ secrets.SUPREMEAI_API_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/audit_env_usage.py --env ${{ matrix.env }}

  render-env-live-check:
    name: 🔌 Render Runtime Env Check (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        env: [render-backend, render-admin, render-worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install PyYAML
        run: pip install pyyaml
      - name: 🔍 Verify Render runtime env [${{ matrix.env }}]
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_BACKUP: ${{ secrets.RENDER_API_KEY_BACKUP }}
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID || vars.RENDER_PRIMARY_SVC_ID || 'srv-d9d3n58js32c738n79k0' }}
          RENDER_BACKUP_SVC_ID: ${{ secrets.RENDER_BACKUP_SVC_ID || vars.RENDER_BACKUP_SVC_ID || 'srv-d9fg48bh523c73f63bb0' }}
          RENDER_WORKER_SVC_ID: ${{ secrets.RENDER_WORKER_SVC_ID || vars.RENDER_WORKER_SVC_ID || '' }}
        run: |
          if [ "${{ matrix.env }}" = "render-backend" ]; then SVC="$RENDER_PRIMARY_SVC_ID"
          elif [ "${{ matrix.env }}" = "render-admin" ]; then SVC="$RENDER_BACKUP_SVC_ID"
          else SVC="$RENDER_WORKER_SVC_ID"; fi
          if [ -z "$SVC" ]; then
            echo "::warning::[${{ matrix.env }}] RENDER_WORKER_SVC_ID not set — worker runtime check skipped"
            exit 0
          fi
          python scripts/verify_render_env.py --env ${{ matrix.env }} --service-id "$SVC"

  infisical-vault-health-check:
    name: 🔐 Infisical Vault Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify Infisical Secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: python scripts/verify_infisical_env.py

  check-admin-bridge:
    name: 🔌 Admin Bridge Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install & Run Backend
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          SUPABASE_DATABASE_URL: "sqlite+aiosqlite:///./preflight.db"
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
          SUPREMEAI_JWT_SECRET: "supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad"
        run: |
          cd backend
          pip install poetry
          poetry install --no-root
          poetry run alembic upgrade head || echo "Alembic migrations failed or skipped"
          poetry run python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 10
      - name: Probe Admin API & CORS Headers
        run: |
          curl -f --max-time 3 http://127.0.0.1:8000/api/v1/health || exit 1
          curl -f --max-time 3 http://127.0.0.1:8000/api/v1/telemetry || exit 1
          curl -i -X OPTIONS http://127.0.0.1:8000/api/v1/health -H "Origin: http://localhost:5173" -H "Access-Control-Request-Method: GET" | grep -i "access-control-allow-origin" || exit 1

  check-user-bridge:
    name: 🔌 User Bridge Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install & Run User Services
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          SUPABASE_DATABASE_URL: "sqlite+aiosqlite:///./preflight.db"
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
          SUPREMEAI_JWT_SECRET: "supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad"
        run: |
          cd backend
          pip install poetry
          poetry install --no-root
          poetry run alembic upgrade head || echo "Alembic migrations failed or skipped"
          poetry run python -m uvicorn main:app --host 127.0.0.1 --port 8001 &
          sleep 10
      - name: Verify User App Core Handshake
        run: |
          curl -f --max-time 3 http://127.0.0.1:8001/api/v1/mobile-bff/health || exit 1