# GitHub Actions — SecretHunter CI Pipeline
# বাংলা: সিক্রেট স্ক্যানিং সিআই পাইপলাইন — কোডবেসে হার্ডকোডেড সিক্রেট ডিটেক্ট করে।
#
# কাজের ধরন:
#   1. PR-তে — শুধু পরিবর্তিত ফাইল স্ক্যান (দ্রুত)
#   2. main/staging-এ push — পুরো কোডবেস স্ক্যান (গভীর)
#   3. Scheduled — সাপ্তাহিক ফুল কোডবেস অডিট
#
# Security Note: যদি কোনো সিক্রেট (CRITICAL/HIGH) ডিটেক্ট হয় — CI FAIL করবে।

name: SecretHunter CI Scan

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'configs/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'scripts/**'
  schedule:
    # সাপ্তাহিক ফুল অডিট — প্রতি সোমবার রাত ২টা UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Manual trigger for ad-hoc scans
    inputs:
      scan_path:
        description: 'Path to scan (default: backend/)'
        required: false
        default: 'backend'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt 2>/dev/null || echo '⚠️ Some dependencies missing — using built-in patterns'

      - name: 🔍 Run SecretHunter Scan
        id: scan
        env:
          # AI analysis requires LLM key (optional for CI)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Skip AI analysis if no key available
          SECRET_HUNTER_AI: ${{ secrets.GEMINI_API_KEY && 'true' || 'false' }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "🔍 PR mode: scanning changed files..."
            python scripts/devops/secret_scan_ci.py --staged --json
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "🔍 Push mode: scanning full codebase..."
            python scripts/devops/secret_scan_ci.py --path backend/ --json
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "🔍 Scheduled mode: full codebase audit..."
            python scripts/devops/secret_scan_ci.py --full --json
          else
            echo "🔍 Manual mode: scanning ${{ github.event.inputs.scan_path || 'backend/' }}..."
            python scripts/devops/secret_scan_ci.py --path "${{ github.event.inputs.scan_path || 'backend/' }}" --json
          fi

      - name: 📊 Generate SARIF Report
        if: always()
        run: |
          # Convert scan results to SARIF format (if findings detected)
          python -c "
          import json
          import os

          findings_path = 'secret_scan_results.json'
          if not os.path.exists(findings_path):
              print('No scan results file found')
              exit(0)

          with open(findings_path) as f:
              data = json.load(f)

          findings = data.get('findings', [])
          if not findings:
              print('No findings to report')
              exit(0)

          sarif = {
              'version': '2.1.0',
              'runs': [{
                  'tool': {
                      'driver': {
                          'name': 'SecretHunter',
                          'informationUri': 'https://github.com/supremeai/backend',
                          'rules': []
                      }
                  },
                  'results': []
              }]
          }

          rule_ids = set()
          for f in findings:
              rule_id = f.get('rule_id', 'generic-secret')
              if rule_id not in rule_ids:
                  rule_ids.add(rule_id)
                  sarif['runs'][0]['tool']['driver']['rules'].append({
                      'id': rule_id,
                      'name': f.get('secret_type', 'Unknown'),
                      'shortDescription': {'text': f.get('secret_type', 'Secret detected')},
                      'defaultConfiguration': {'level': 'error' if f.get('severity') in ('critical', 'high') else 'warning'}
                  })

              sarif['runs'][0]['results'].append({
                  'ruleId': rule_id,
                  'message': {'text': f'Secret detected: {f.get(\"secret_type\", \"Unknown\")} ({f.get(\"severity\", \"medium\")})'},
                  'locations': [{
                      'physicalLocation': {
                          'artifactLocation': {'uri': f.get('file_path', 'unknown')},
                          'region': {
                              'startLine': f.get('line_number', 0),
                              'startColumn': f.get('column_start', 0),
                              'endColumn': f.get('column_end', 0)
                          }
                      }
                  }],
                  'properties': {
                      'severity': f.get('severity', 'medium'),
                      'remediation': f.get('remediation', ''),
                  }
              })

          with open('secret_scan_results.sarif', 'w') as sf:
              json.dump(sarif, sf)
          print(f'SARIF report generated with {len(findings)} findings')
          " || echo '⚠️ SARIF generation failed (non-critical)'

      - name: 📤 Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secret_scan_results.sarif
          category: secret-hunter
        continue-on-error: true

      - name: 🚨 Check Scan Results
        if: always()
        run: |
          if [ ${{ steps.scan.outcome }} == 'failure' ]; then
            echo "❌ Secret scan FAILED — critical or high severity secrets detected!"
            echo "Review the findings above and fix them before merging."
            exit 1
          else
            echo "✅ Secret scan PASSED — no critical/high secrets detected."
          fi

      - name: 📧 Notify on Critical Findings (Scheduled only)
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 *SecretHunter Weekly Audit* — Critical secrets detected!\nRepository: ${{ github.repository }}\nScan ID: ${{ github.run_id }}\nView details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
