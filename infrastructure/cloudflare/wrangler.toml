name = "supremeai-edge"
main = "enhanced-worker.js"  # ← FIX: Reverted to functional worker file
compatibility_date = "2026-06-17"
compatibility_flags = ["nodejs_compat"]

[vars]
# Primary Backend URLs
RENDER_URL = "https://supremeai-backend-v2.onrender.com"

# Feature 4 (old plan): Multi-node failover chain (priority order)
# BACKUP_RENDER_URL/TERTIARY_RENDER_URL খালি থাকলে ওই node বাদ যায় —
# worker শুধু configured node-গুলোর মধ্যে failover করে।
BACKUP_RENDER_URL = "https://supremeai-worker-node.onrender.com"
TERTIARY_RENDER_URL = ""

# Microservices
SCRAPER_SERVICE_URL = "https://supremeai-scraper-6nwi.onrender.com"
MEDIA_SERVICE_URL = ""  # Set if using GCP Cloud Run

# Alerting (optional)
HEALTH_ALERT_WEBHOOK = ""  # Discord/Slack webhook URL

[triggers]
# CRITICAL: Every 8 minutes keeps Render free tier awake
# Render spins down after ~15 min of inactivity
crons = ["*/8 * * * *"]

# ── KV namespaces ─────────────────────────────────────────────────────────────
# INF-09 (#532): placeholder IDs ("REPLACE_WITH_*", "your_preview_kv_id") made
# `wrangler deploy` ALWAYS fail — wrangler validates every KV namespace ID as a
# 32-char hex ID against the Cloudflare API, so a placeholder is a deploy
# blocker, not a TODO. Provision each namespace, then paste the returned ID:
#
#   wrangler kv namespace create SUPREME_KV
#   wrangler kv namespace create DUPLICATE_DB
#   wrangler kv namespace create CACHE_METADATA
#
# Issue #703: HEALTH_KV's real ID is no longer committed — the binding
# ships commented out below (see the block for re-enable instructions).
# Its invalid "your_preview_kv_id" preview_id is removed (preview_id is
# validated too; without it wrangler falls back to `id` for previews).

# Issue #703 (public-repo topology scrub): real namespace IDs must not be
# committed — same policy as the account_id rule in infrastructure/wrangler.toml.
# HEALTH_KV previously carried the only real ID on record; enhanced-worker.js
# does not read env.HEALTH_KV, so commenting the binding out keeps
# `wrangler deploy` valid with no runtime change. To re-enable, uncomment the
# block and paste the real ID returned by:
#
#   wrangler kv namespace create HEALTH_KV
#
# (provision the ID locally or via CI secret — never commit it).

# [[kv_namespaces]]
# binding = "HEALTH_KV"
# id = "<paste output of: wrangler kv namespace create HEALTH_KV>"

# Feature 4 (old plan): Circuit-breaker/failover state (node_health_v1)
# তৈরি করার কমান্ড: wrangler kv namespace create SUPREME_KV
#
# BUGFIX context: enhanced-worker.js uses SUPREME_KV / DUPLICATE_DB /
# CACHE_METADATA — earlier these shipped as INVALID placeholder IDs, so the
# deploy never succeeded. They are commented out (instead of shipping fake IDs)
# so `wrangler deploy` passes; enhanced-worker.js guards every access
# (`if (!env.SUPREME_KV)`, `if (!env.DUPLICATE_DB)`, `if (!env.CACHE_METADATA)`)
# and degrades gracefully until each namespace is provisioned above and its
# 32-hex ID pasted in. DO NOT re-add placeholder IDs — wrangler rejects them.
#
# [[kv_namespaces]]
# binding = "SUPREME_KV"
# id = "<paste output of: wrangler kv namespace create SUPREME_KV>"
#
# [[kv_namespaces]]
# binding = "DUPLICATE_DB"
# id = "<paste output of: wrangler kv namespace create DUPLICATE_DB>"
#
# [[kv_namespaces]]
# binding = "CACHE_METADATA"
# id = "<paste output of: wrangler kv namespace create CACHE_METADATA>"

# R2 Bucket for static assets (if used)
[[r2_buckets]]
binding = "STATIC_ASSETS"
bucket_name = "supremeai-static-assets"

# Rate limiting (optional, for API protection)
[[unsafe.bindings]]
name = "API_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Environment-specific overrides
[env.production]
name = "supremeai-edge-prod"

[env.staging]
name = "supremeai-edge-staging"