# Deploy Doctor — Autonomous Render Deploy Failure Detective
# ==========================================================
# প্রতি 5 মিনিটে Render API poll করে failed deploy খুঁজে বের করে,
# root cause analyze করে, এবং স্বয়ংক্রিয়ভাবে GitHub issue খোলে।
#
# বৈশিষ্ট্য:
#   - শুধু গত 15 মিনিটের failed deploys দেখে (duplicate issue প্রতিরোধ)
#   - একই commit SHA-তে আগের issue থাকলে শুধু comment করে
#   - 4টি Render service সমান্তরালে check করে (primary/worker/scraper/mcp)
#   - failure category অনুযায়ী human-readable advice দেয়
#   - gh CLI দিয়ে issue খোলে + "deploy-doctor" label যোগ করে
#
# Trigger:
#   - schedule: প্রতি 5 মিনিটে (cron: "*/5 * * * *")
#   - workflow_dispatch: ম্যানুয়ালি চালানো যায় (testing এর জন্য)

name: Deploy Doctor

on:
  schedule:
    # প্রতি 5 মিনিটে চলবে — Render free-tier deploy সাধারণত 2-6 মিনিট নেয়,
    # তাই 5 মিনিট interval-এ দ্রুত detect হয়।
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (issue খুলবে না, শুধু দেখাবে)"
        type: boolean
        default: false
      window_minutes:
        description: "গত N মিনিটের failed deploys দেখবে"
        type: string
        default: "15"

# একই সময়ে একাধিক run হলে পুরনোটা cancel করে নতুনটা চলবে
concurrency:
  group: deploy-doctor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # issue খোলার জন্য দরকার
  actions: read

jobs:
  scan-render-deploys:
    name: 🔍 Scan Render Deploys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PYTHON_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Issue #909: "Import Render API keys from Infisical" step removed — dead code.
      # The ubuntu-latest runner never has the infisical CLI installed, so the
      # step always early-exited with `exit 0` (success) on the very first
      # `if ! command -v infisical` check. Even if it HAD run, its writes to
      # $GITHUB_ENV were never consumed — the next "Run Deploy Doctor" step
      # reads RENDER_API_KEY_* / RENDER_*_SVC_ID directly from ${{ secrets.* }}.
      # The dead step only added ~1.5 KB of YAML + the runtime cost of one
      # shell-startup + env evaluation per run, multiplied by 288 runs/day
      # (cron: */5 * * * *). Removing it cleans the workflow without
      # changing any externally observable behavior.

      - name: Run Deploy Doctor
        env:
          # Render API keys (GitHub secrets থেকে, Infisical import না হলে fallback)
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          # Service IDs
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
          RENDER_WORKER_SVC_ID: ${{ secrets.RENDER_WORKER_SVC_ID }}
          RENDER_SCRAPER_SVC_ID: ${{ secrets.RENDER_SCRAPER_SVC_ID }}
          RENDER_MCP_SVC_ID: ${{ secrets.RENDER_MCP_SVC_ID }}
        run: |
          python scripts/ci/deploy_doctor.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.window_minutes && format('--window-minutes {0}', github.event.inputs.window_minutes) || '' }}

      - name: Summary
        if: always()
        run: |
          echo "## 🔍 Deploy Doctor Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run completed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for any detected failures." >> $GITHUB_STEP_SUMMARY
          echo "Open issues: [deploy-doctor label](https://github.com/${{ github.repository }}/issues?q=label%3Adeploy-doctor)" >> $GITHUB_STEP_SUMMARY
