## 🚀 ২. Strategic Improvement Plan (The Real Boost)

সিস্টেমকে আরো শক্তিশালী ও স্বয়ংক্রিয় করতে আমরা ৫টি নির্দিষ্ট ফিচার যুক্ত বা অপ্টিমাইজ করতে পারি:

### 🛠️ প্রস্তাব ১: অটোনোমাস সেলফ-হিলিং প্রোভাইডার রাউটার (Self-Healing Provider Router)
* **ফাইল:** `backend/core/router.py` (নতুন বা পরিমার্জিত)
* **উদ্দেশ্য:** `PSI-001~005` রুলস অনুযায়ী প্রোভাইডার কোটা ৮০% পার হলে বা ডাউন হলে কোনো ইউজার ইন্টারাপশন ছাড়াই স্বয়ংক্রিয়ভাবে সেকেন্ডারি প্রোভাইডারে রুট করা।
* **প্রোডাকশন-রেডি ব্লুপ্রিন্ট কোড:**

```python backend/core/router.py
# ... existing code ...
import logging
from typing import Dict, Any
from backend.core.config import settings

logger = logging.getLogger(__name__)

class AutonomousProviderRouter:
    """
    এআই প্রোভাইডারদের কোটা এবং হেলথ মনিটর করে রিয়েল-টাইমে রুট পরিবর্তন করার সেন্ট্রাল ম্যানেজার।
    (ZCO-001 এবং PSI-001~005 নিয়ম কঠোরভাবে মেনে চলে)
    """
    def __init__(self):
        # প্রতিটি প্রোভাইডারের টোকেন ব্যবহার ট্র্যাকিং (ফ্রি-টিয়ার অপ্টিমাইজেশন)
        self.provider_token_usage: Dict[str, float] = {
            "moonshot": 0.0,
            "deepseek": 0.0,
            "together": 0.0,
            "ollama": 0.0
        }
        self.quota_limit = 0.80  # ৮০% ডেইলি কোটা লিমিট এলার্ট

    def get_optimal_provider(self, task_type: str, fallback_active: bool = False) -> str:
        """
        টাস্ক ক্লাসিফিকেশন (TCL-001) অনুযায়ী সবচেয়ে উপযুক্ত প্রোভাইডার নির্বাচন করে।
        """
        # বাংলা ভাষা বা জটিল লজিকের জন্য Moonshot Kimi K2.5
        if task_type == "BANGLA_SPECIFIC" and self.provider_token_usage["moonshot"] < self.quota_limit:
            return "moonshot"
            
        # কোডিং বা টেকনিক্যাল কাজের জন্য DeepSeek V3
        if task_type in ["TECHNICAL", "ANALYTICAL"] and not fallback_active:
            if self.provider_token_usage["deepseek"] < self.quota_limit:
                return "deepseek"
            else:
                # অটো-ফলব্যাক Together AI-তে (PSI-003)
                logger.warning("DeepSeek quota exceeded 80%, falling back to Together AI.")
                return "together"

        # অফলাইন বা লোকাল ডেটার সুরক্ষায় Ollama (PSI-004)
        if task_type == "PRIVACY_SENSITIVE":
            return "ollama"

        # ডিফল্ট ফলব্যাক
        return "together"

    def record_usage(self, provider: str, tokens_used: int):
        """
        প্রতিটি এপিআই কলের পর টোকেন কাউন্ট আপডেট করে কোটা এক্সিড হওয়া রোধ করার জন্য।
        """
        # ব্যবহার ট্র্যাকিং এবং লগিং (বাংলায় রিমাইন্ডার সহ)
        self.provider_token_usage[provider] += tokens_used / 100000.0  # আনুমানিক হিসেব
        logger.info(f"প্রোভাইডার {provider}-এর বর্তমান কোটা ব্যবহার: {self.provider_token_usage[provider]:.2%}")
# ... rest of code ...
