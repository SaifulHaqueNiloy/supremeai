name: 🔀 Staging PR Promotion Dispatcher

on:
  workflow_run:
    workflows: ["🧠 SupremeAI Core CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-promotion-pr:
    name: 🟢 Auto Create Promotion PR to Main Repo
    # 1. Secondary repo-তে চলবে
    # 2. workflow_run সম্পন্ন ও successful (GREEN 🟢) হতে হবে
    if: |
      github.repository == 'SaifulHaqueNiloy/supremeai' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Staging Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🤖 Create or Update PR to Main Repository
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          STAGING_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          # বাংলা মন্তব্য: MAIN_REPO_TOKEN খালি/অনুপস্থিত থাকলে এখানেই স্পষ্ট error দেখিয়ে থামানো হচ্ছে,
          # যাতে এটি চুপচাপ github-actions[bot] এর ambient credential-এ fallback করে বিভ্রান্তিকর 403 না দেয়।
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ MAIN_REPO_TOKEN secret is missing or empty in this repo's settings."
            echo "   Add a PAT with write access to paykaribazaronline/supremeai under:"
            echo "   Settings → Secrets and variables → Actions → MAIN_REPO_TOKEN"
            exit 1
          fi

          echo "✅ Secondary CI Pipeline passed (GREEN 🟢)!"
          echo "🔄 Checking for existing PR from SaifulHaqueNiloy:main to paykaribazaronline:main..."

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --repo paykaribazaronline/supremeai --head SaifulHaqueNiloy:main --base main --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "ℹ️ Existing promotion PR #$EXISTING_PR found. Updated automatically."
          else
            echo "🔍 Configuring remote to check differences and push..."
            
            # বাংলা মন্তব্য: আলাদা রেপোজিটরি হওয়ায় সরাসরি গিটহাবে পুশ করে PR ওপেন করতে হবে
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git remote add target https://x-access-token:${GH_TOKEN}@github.com/paykaribazaronline/supremeai.git
            git fetch target main
            
            if git diff --quiet HEAD target/main; then
              echo "ℹ️ No new commits to promote. Branches are identical. Skipping PR creation."
            else
              echo "🚀 Pushing staging branch to target repository..."
              PR_BRANCH="promotion/staging-${STAGING_HEAD:0:7}"
              git checkout -b $PR_BRANCH
              git push target $PR_BRANCH --force
              
              echo "🚀 Opening new automated Staging Promotion PR..."
              gh pr create \
                --repo paykaribazaronline/supremeai \
                --head $PR_BRANCH \
                --base main \
                --title "🟢 [Staging Promotion] Verified CI Green Build (${STAGING_HEAD:0:7})" \
                --body "## 🛡️ Secondary Staging CI Pass Report

              All quality gates passed on \`SaifulHaqueNiloy/supremeai\`:
              - 🟢 Pytest & Backend Unit Tests
              - 🟢 Vitest & Web Client Tests
              - 🟢 Preflight & Security Audit
              - 🟢 Zero Production Deploys Executed on Staging

              **Admin Action Required:** Please review and merge to trigger live production deployments across Render, Vercel, and Firebase."
            fi
          fi
