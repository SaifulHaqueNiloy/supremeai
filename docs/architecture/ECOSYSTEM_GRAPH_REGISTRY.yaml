      verification: "MCP Build & Verify job, tool smoke (system_summary)।"
      blast_radius: "সব এজেন্টের সংযোগ ও নিরাপত্তা।"
      ultimate_value: "এক টাওয়ার, সব নাটাই — স্বাধীন ঘুড়ি, নিয়ন্ত্রিত আকাশ।"

  - id: node.service-topology
    domain: infrastructure-center
    type: data
    path: docs/architecture/service_topology.yml
    summary: "Service topology manifest — কোন frontend কোন backend-এ যাবে (CI-enforced)।"
    eight_questions:
      identity: "ট্রাফিক-মানচিত্র — portal↔backend জোড়ার একমাত্র সত্য।"
      responsibility: "Admin/user portal routing rule declare, checker-কে খাওয়ানো।"
      upstream: ["deployment topology decisions"]
      downstream: ["check_service_topology.py (CI gate)"]
      side_effects: "দুই portal এক backend-এ গেলে checker fail (ঐতিহাসিক বাগের প্রতিষেধক)।"
      verification: "Topology checker CI job।"
      blast_radius: "Deploy config, portal routing।"
      ultimate_value: "ভুল রুটিং অসম্ভব — মানচিত্র না মিললে ট্রেন ছাড়ে না।"

  - id: node.service-registry
    domain: infrastructure-center
    type: data
    path: docs/architecture/service_registry.yaml
    summary: "3rd-party service registry — কেন কোন সার্ভিস, খরচ কে টানবে (Service Sprawl প্রতিরোধ)।"
    eight_questions:
      identity: "বাইরের নির্ভরতার হিসাবখাতা।"
      responsibility: "প্রতিটি 3rd-party সার্ভিসের reason, tier, maintainer ট্র্যাক।"
      upstream: ["adoption decisions"]
      downstream: ["free-tier budget guard", "cost audit"]
      side_effects: "অনুমোদনহীন সার্ভিস ঢুকলে খরচ ও vendor lock নিঃশব্দে বাড়ে।"
      verification: "Free tier limit checker, cost auditor review।"
      blast_radius: "খরচ, নিরাপত্তা, vendor dependency।"
      ultimate_value: "জিরো-কস্ট blueprint সুরক্ষিত — প্রতিটি পয়সার হিসাব।"

