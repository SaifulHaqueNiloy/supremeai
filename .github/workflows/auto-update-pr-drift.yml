# ⚠️ DEPRECATED HUSK (epic #1850 Phase D / #1856, D3)
# Push-main drift sync runs as the RATE-LIMITED pr-drift-update job inside ci.yml
# (queued or >6h-stale PRs only — kills the update->synchronize->gate amplifier).
# This manual dispatch arm remains as the deliberate FULL-sync lever (no rate
# limit — dispatch is an intentional human action); its duplicated inline approve
# loop was removed (the integration-gate watchdog owns approvals, #1855). Deletion
# batches into the final cleanup phase (protected scope — founder Tier-3 sign-off).
name: Auto-Update PR Drift (Keep PRs Synced With Main)

on:
  # husk: only manual dispatch remains (see header). Push-main sync runs as the
  # rate-limited pr-drift-update job inside ci.yml.
  workflow_dispatch:

concurrency:
  group: auto-update-pr-drift
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-open-prs:
    name: Auto-Sync Open PRs with Main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Update Open PR Branches
        env:
          # Use SELF_HEAL_PAT so API update-branch is treated as authorized maintainer
          # instead of github-actions[bot], preventing 'action_required' approval lockouts
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "🔍 Fetching open PRs to sync with newly pushed main..."
          
          PRS=$(gh pr list --state open --json number,headRefName,isDraft,headRepositoryOwner -q '.[] | select(.isDraft == false and .headRepositoryOwner.login == "'"$GITHUB_REPOSITORY_OWNER"'") | "\(.number):\(.headRefName)"')
          
          if [ -z "$PRS" ]; then
            echo "✅ No open PRs require synchronization."
            exit 0
          fi

          echo "Found open PRs to evaluate:"
          echo "$PRS"

          UPDATED=0
          SKIPPED=0
          CONFLICTS=0

          for item in $PRS; do
            PR_NUM="${item%%:*}"
            BRANCH="${item#*:}"
            
            # Avoid self-referential or protected/independent branches
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "chore/artifact-regen-latest" ]; then
              continue
            fi

            echo "----------------------------------------------------"
            echo "🔄 Checking PR #$PR_NUM ($BRANCH)..."

            # Check if PR head is behind main
            BEHIND_COUNT=$(git rev-list --count "origin/$BRANCH..origin/main" 2>/dev/null || echo "0")
            if [ "$BEHIND_COUNT" -eq 0 ]; then
              echo "  PR #$PR_NUM ($BRANCH) is already up-to-date with main."
              # LIFECYCLE FIX (#1997): a branch that is already clean must not keep
              # open conflict-blocker issues alive — auto-close them with a reason.
              for B in $(gh issue list --search "\"PR #$PR_NUM\" in:title state:open type:issue label:type:blocker" --json number -q '.[].number' 2>/dev/null || true); do
                echo "  ✅ Auto-closing stale conflict tracker #$B (PR #$PR_NUM is clean)."
                gh issue close "$B" --comment "✅ Auto-closed: PR #$PR_NUM is up-to-date with \`main\` — conflict resolved. (lifecycle guard, #1997)" || true
              done
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "  PR #$PR_NUM is behind main by $BEHIND_COUNT commit(s). Triggering update-branch API..."
            
            HTTP_CODE=$(curl -s -o /tmp/update_response.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/pulls/$PR_NUM/update-branch")

            if [ "$HTTP_CODE" = "202" ]; then
              echo "  ✅ PR #$PR_NUM ($BRANCH) successfully updated with latest main!"
              gh pr edit "$PR_NUM" --remove-label "status:merge-conflict" 2>/dev/null || true
              # LIFECYCLE FIX (#1997): branch synced → its conflict blocker(s) are
              # resolved. Close them so the coder queue never carries stale blockers.
              for B in $(gh issue list --search "\"PR #$PR_NUM\" in:title state:open type:issue label:type:blocker" --json number -q '.[].number' 2>/dev/null || true); do
                echo "  ✅ Auto-closing resolved conflict tracker #$B (PR #$PR_NUM updated)."
                gh issue close "$B" --comment "✅ Auto-closed: PR #$PR_NUM branch auto-updated with \`main\` — conflict resolved. (lifecycle guard, #1997)" || true
              done
              UPDATED=$((UPDATED + 1))
            elif [ "$HTTP_CODE" = "422" ]; then
              echo "  ⚠️ PR #$PR_NUM has merge conflicts that cannot be auto-merged. Adding status:merge-conflict label..."
              cat /tmp/update_response.json
              gh pr edit "$PR_NUM" --add-label "status:merge-conflict" || true

              COMMENT_TAG="<!-- SUPREMEAI_DRIFT_CONFLICT -->"
              EXISTING_COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUM/comments" --jq ".[] | select(.body | contains(\"$COMMENT_TAG\")) | .id" | head -n 1 || true)
              
              if [ -z "$EXISTING_COMMENT_ID" ]; then
                CONFLICT_BODY="${COMMENT_TAG}\n### ⚠️ Automatic Sync Blocked: Merge Conflict Detected\n\nThis pull request cannot be automatically rebased/merged with the latest \`main\` due to conflicting changes.\n\n**Action Required by Branch Owner**:\n1. Check out your branch locally: \`git checkout $BRANCH\`\n2. Sync with main: \`git pull --rebase origin main\` (or \`python scripts/git/auto_sync_main.py\`)\n3. Resolve conflicting files, verify tests, and push: \`git push\`"
                gh pr comment "$PR_NUM" --body "$CONFLICT_BODY" || true
              fi

              # AUTONOMOUS BLOCKER ISSUE CREATION (AGENTS.md Invariant 9)
              # Do not leave the PR hanging on passive markdown. Spawn a real GitHub issue
              # so the Coder Pool loop claims and resolves the conflict!
              #
              # DEDUP FIX (#1997, 2026-09-27): the old search phrase
              #   'conflict on PR #N in:title'  NEVER matched the created title
              #   'fix(conflict): PR #N (branch) has merge conflict with main'
              # → every drift run spawned a NEW duplicate tracker (~80 duplicates
              #   closed in the 2026-09-27 triage). Search the REAL title phrase,
              # scoped to open issues. create_blocker_issue.py now ALSO carries
              # its own in-script dedup guard (defense in depth).
              EXISTING_BLOCKER=$(gh issue list --search "\"PR #$PR_NUM\" in:title state:open type:issue label:type:blocker" --json number -q '.[0].number' 2>/dev/null || echo "")
              if [ -z "$EXISTING_BLOCKER" ]; then
                echo "  🚨 Spawning autonomous blocker issue for PR #$PR_NUM conflict..."
                PARENT_ISSUE=$(gh pr view "$PR_NUM" --json body -q '.body' 2>/dev/null | grep -oEi '(fixes|closes|resolves|#)[[:space:]]*#?([0-9]+)' | grep -oE '[0-9]+' | head -n 1 || echo "$PR_NUM")
                # Batch PRs (merge-train rollups) are pr-helper property; member/
                # feature PR conflicts belong to the coder lane that owns the branch.
                BLOCKER_ROLE=coder
                if gh pr view "$PR_NUM" --json labels -q '[.labels[].name] | contains(["merge-train:batch"])' 2>/dev/null | grep -q true; then
                  BLOCKER_ROLE=pr-helper
                fi
                python scripts/agents/create_blocker_issue.py \
                  --parent-issue "$PARENT_ISSUE" \
                  --title "fix(conflict): PR #$PR_NUM ($BRANCH) has merge conflict with main" \
                  --body "PR #$PR_NUM on branch \`$BRANCH\` has conflicting changes with latest \`main\` after upstream integration. Requires rebase, conflict resolution, and verification." \
                  --role "$BLOCKER_ROLE" || true
              else
                echo "  ♻️  Blocker for PR #$PR_NUM already tracked as #$EXISTING_BLOCKER — no duplicate created."
              fi

              CONFLICTS=$((CONFLICTS + 1))
            else
              echo "  ℹ️ Response HTTP $HTTP_CODE: $(cat /tmp/update_response.json 2>/dev/null || true)"
              SKIPPED=$((SKIPPED + 1))
            fi
          done

          echo "===================================================="
          echo "Sync Summary: Updated=$UPDATED | Up-to-date/Skipped=$SKIPPED | Conflicts=$CONFLICTS"

