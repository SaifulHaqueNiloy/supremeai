name: Weekly Disaster Recovery Drill & Chaos Engineering Pipeline

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  workflow_dispatch:     # Manual trigger support

jobs:
  chaos-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pytest requests

      - name: Execute Chaos Experiment Drill
        env:
          ENV: staging
          CHAOS_TEST_MODE: 'true'
        run: |
          python backend/scripts/verify_ledger.py
          python scripts/type_gen_pipeline.py --check-only
          echo "Disaster Recovery Drill Completed Successfully!"
