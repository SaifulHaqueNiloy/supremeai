# SupremeAI — Unified Instance Keep-Alive (Cold-Start Elimination)
# বাংলা মন্তব্য: Render.com ফ্রি-টিয়ারে ১৫ মিনিট নিষ্ক্রিয় থাকলে instance sleep-এ যায়।
# এই unified workflow প্রতি ১৪ মিনিটে User ও Admin — উভয় API health endpoint-এ
# parallel-এ পিং করে cold-start প্রতিরোধ করে। সম্পূর্ণ Zero-Cost (GitHub Actions free tier)।
#
# পূর্বে দুটো আলাদা workflow ছিল (user-keepalive.yml + admin-keepalive.yml) —
# এটি সেগুলোকে একটিতে merge করে Actions tab পরিষ্কার রাখে।
#
# Setup: repo → Settings → Secrets and variables → Actions → New repository secrets:
#   USER_HEALTH_URL  = https://<your-user-render-service>.onrender.com/api/v1/health
#   ADMIN_HEALTH_URL = https://<your-admin-render-service>.onrender.com/api/v1/health

name: "🫀 Instance Keep-Alive"

on:
  schedule:
    # প্রতি ১৪ মিনিটে — Render free tier ~15 min idle timeout-এর আগেই ping করে।
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping-user:
    name: "User Instance"
    runs-on: ubuntu-latest
    steps:
      - name: Ping User API health endpoint
        env:
          USER_HEALTH_URL: ${{ secrets.USER_HEALTH_URL }}
        run: |
          if [ -z "$USER_HEALTH_URL" ]; then
            echo "⚠️ USER_HEALTH_URL secret not set — skipping. See workflow header for setup."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$USER_HEALTH_URL" || echo "000")
          echo "User health → HTTP $status"
          if [ "$status" != "200" ]; then
            echo "🔴 User instance not 200 — may be cold-starting (best-effort, not failing job)."
          else
            echo "🟢 User instance is warm."
          fi

  ping-admin:
    name: "Admin Instance"
    runs-on: ubuntu-latest
    steps:
      - name: Ping Admin API health endpoint
        env:
          ADMIN_HEALTH_URL: ${{ secrets.ADMIN_HEALTH_URL }}
        run: |
          if [ -z "$ADMIN_HEALTH_URL" ]; then
            echo "⚠️ ADMIN_HEALTH_URL secret not set — skipping. See workflow header for setup."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$ADMIN_HEALTH_URL" || echo "000")
          echo "Admin health → HTTP $status"
          if [ "$status" != "200" ]; then
            echo "🔴 Admin instance not 200 — may be cold-starting (best-effort, not failing job)."
          else
            echo "🟢 Admin instance is warm."
          fi
