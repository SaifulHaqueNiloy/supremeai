name: 'Build and Sign Container Image'
description: 'Builds, tags, pushes to GHCR, signs with Cosign, and generates SBOM'
inputs:
  image-name:
    description: 'Name of the image (e.g. supremeai-core or supremeai-scraper)'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: true
  context:
    description: 'Docker build context'
    required: false
    default: './backend'
  cache-scope:
    description: 'GHA cache scope identifier'
    required: true
  github-token:
    description: 'GITHUB_TOKEN for authentication and signing'
    required: true
outputs:
  digest:
    description: 'Docker image digest'
    value: ${{ steps.build.outputs.digest }}
  tags:
    description: 'Docker image tags'
    value: ${{ steps.meta.outputs.tags }}
runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ github.ref_name }}
          type=sha,format=long,prefix=

    - name: Build and push image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

    - name: Sign image
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        images=""
        for tag in $TAGS; do
          images="$images $tag@$DIGEST"
        done
        cosign sign --yes $images

    - name: Generate SBOM
      uses: anchore/sbom-action@e8d2a6937ecead383dfe75190d104edd1f9c5751 # v0.16.0
      with:
        image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        registry-username: ${{ github.actor }}
        registry-password: ${{ inputs.github-token }}
