      SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
      SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET || 'supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad' }}

  cache-janitor:
    name: 🧹 Cache Janitor (Auto Cleanup)
    needs: gatekeeper
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && (github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event.inputs.run_cache_janitor == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Priority TTL Eviction (turbo=3d, playwright=7d, deps=14d)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "## 🧹 Cache Janitor Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "বর্তমান cache তালিকা লোড করা হচ্ছে..." >> $GITHUB_STEP_SUMMARY
          gh cache list --repo "$REPO" --limit 100 --json id,ref,key,createdAt,sizeInBytes \
            > caches.json 2>> $GITHUB_STEP_SUMMARY

          DELETED=0
          KEPT=0

          jq -c '.[]' caches.json | while read -r c; do
            key=$(echo "$c" | jq -r '.key')
            created=$(echo "$c" | jq -r '.createdAt')
            created_ts=$(date -d "$created" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$created" +%s 2>/dev/null || echo "0")
            id=$(echo "$c" | jq -r '.id')
            size_mb=$(echo "$c" | jq -r '.sizeInBytes // 0 | . / 1048576 | floor')

            if [[ "$key" == *"turbo"* ]]; then
              TTL_DAYS=3
              CATEGORY="build/turbo"
            elif [[ "$key" == *"playwright"* ]]; then
              TTL_DAYS=7
              CATEGORY="playwright"
            else
              TTL_DAYS=14
              CATEGORY="deps"
            fi

            CUTOFF=$(date -d "${TTL_DAYS} days ago" +%s)
            if [ "$created_ts" -lt "$CUTOFF" ]; then
              echo "🗑️ TTL expired (${TTL_DAYS}d) [$CATEGORY] ${size_mb}MB: $key" >> $GITHUB_STEP_SUMMARY
              gh cache delete "$id" --repo "$REPO" || true
              DELETED=$((DELETED + 1))
            else
              echo "✅ Keeping [$CATEGORY] ${size_mb}MB: $key" >> $GITHUB_STEP_SUMMARY
              KEPT=$((KEPT + 1))
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ TTL-based eviction সম্পন্ন: $DELETED deleted, $KEPT kept." >> $GITHUB_STEP_SUMMARY

      - name: Enforce 8GB soft cap (priority-ordered eviction)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          SOFT_CAP_BYTES=$((8 * 1024 * 1024 * 1024))

          gh cache list --repo "$REPO" --limit 100 --json id,key,createdAt,sizeInBytes \
            --jq 'sort_by(.createdAt)' > sorted_caches.json

          TOTAL=$(jq '[.[].sizeInBytes] | add // 0' sorted_caches.json)
          echo "বর্তমান মোট cache: $((TOTAL / 1048576)) MB" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -le "$SOFT_CAP_BYTES" ]; then
            echo "✅ 8GB soft cap-এর মধ্যে আছে — কোনো eviction দরকার নেই।" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "⚠️ 8GB soft cap ছাড়িয়েছে — priority-based eviction শুরু হচ্ছে..." >> $GITHUB_STEP_SUMMARY

          for PATTERN in "turbo" "playwright" "venv" "pycache" "pnpm"; do
            jq -c '.[]' sorted_caches.json | while read -r c; do
              if [ "$TOTAL" -le "$SOFT_CAP_BYTES" ]; then break; fi
              key=$(echo "$c" | jq -r '.key')
              id=$(echo "$c" | jq -r '.id')
              size=$(echo "$c" | jq -r '.sizeInBytes')
              if [[ "$key" == *"$PATTERN"* ]]; then
                echo "🗑️ Size cap [$PATTERN]: id=$id ($((size/1048576))MB) মুছে ফেলা হচ্ছে" >> $GITHUB_STEP_SUMMARY
                gh cache delete "$id" --repo "$REPO" || true
                TOTAL=$((TOTAL - size))
              fi
            done
          done

      - name: Report total cache usage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(gh cache list --repo "${{ github.repository }}" --json sizeInBytes --jq '[.[].sizeInBytes] | add // 0 | . / 1048576 | floor | tostring + " MB total"' 2>/dev/null || echo "N/A")
          echo "### 📊 Cache Usage After Cleanup: $RESULT" >> $GITHUB_STEP_SUMMARY

  workflow-janitor:
    name: 🧹 Workflow Janitor (clean old runs)
    needs: gatekeeper
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && (github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event.inputs.run_workflow_janitor == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete Old Completed Runs via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "🧹 Cleaning old PASSED workflow runs (keeping latest 200)..."
          PASSED_IDS=$(gh api "repos/$REPO/actions/runs?status=success&per_page=100" --paginate --jq '.workflow_runs[200:] | .[] | .id' 2>/dev/null || true)
          for id in $PASSED_IDS; do
            echo "Deleting passed run ID: $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" 2>/dev/null || true
          done

          echo "🧹 Cleaning old FAILED workflow runs (keeping latest 20)..."
          FAILED_IDS=$(gh api "repos/$REPO/actions/runs?status=failure&per_page=100" --paginate --jq '.workflow_runs[20:] | .[] | .id' 2>/dev/null || true)
          for id in $FAILED_IDS; do
            echo "Deleting failed run ID: $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" 2>/dev/null || true
          done

          echo "✅ Old workflow runs cleanup completed."

