# QA Engine — E2E Admin suite (Part 7.3 of the QA engine plan, adapted)
# Manual only: admin automation needs QA_ADMIN_* secrets (dedicated QA admin
# account — NEVER production) and the step-up OTP/TOTP data-testid from Part 9.
# A-04 (admin API 401/403) is runnable without credentials once the app under
# test proxies /api/**; the setup-admin project currently fails loudly (skeleton).
name: QA — E2E Admin Suite

on:
  workflow_call:
    inputs:
      base_url:
        description: 'App under test (defaults to QA_BASE_URL env or local vite preview)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      base_url:
        description: 'App under test (defaults to QA_BASE_URL env or local vite preview)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: supremeai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-admin-suite:
    name: 🎭 Admin Suite
    uses: ./.github/workflows/reusable-e2e-runner.yml
    with:
      project: admin
      base_url: ${{ inputs.base_url }}
    secrets: inherit
