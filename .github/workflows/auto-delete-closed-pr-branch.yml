name: Auto Delete PR Branch on Close

on:
  # Retired in favor of unified main.yml (Protocol 14, 3-pipeline architecture)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branch:
    name: Auto Delete Head Branch
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete branch if agent lane branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR #${{ github.event.pull_request.number }} closed. Head ref: $BRANCH"
          if [[ "$BRANCH" =~ ^(coder|ci|planner|pr-helper|platform)- ]]; then
            echo "Deleting remote ref for $BRANCH..."
            gh api -X DELETE "/repos/$REPO/git/refs/heads/$BRANCH" || echo "Branch already deleted."
          else
            echo "Branch $BRANCH is not an agent lane branch. Preserving."
          fi
