# =============================================================================
# SupremeAI Continuous Agent Loop — Simple Event-Driven Workflow
# =============================================================================
# Architectural guarantees (hard-coded, not rule-based):
#   1. Exponential backoff on claim failure — no infinite retry
#   2. Heartbeat-based orphan release — crashed agents auto-release after 30m
#   3. CI failure retry → queue:hold after 3 failures
#   4. Priority auto-escalation — P0/P1 queues never starve
#
# Flow:
#   1. Check if open issues exist
#   2. If not, run full audit → create issues
#   3. Auto-escalate priorities (P0/P1/P2)
#   4. Agent acquires next issue via acquire_role_slot.py
#   5. Agent claims via atomic_claim.sh with exponential backoff
#   6. Agent executes (fix, test, PR)
#   7. Loop
# =============================================================================

name: Continuous Agent Loop

on:
  issues:
    types: [opened, closed, reopened]
  # বাংলা মন্তব্য (#2778 CI-cascade fix): `pull_request` ট্রিগার সম্পূর্ণ বাদ —
  # কোনো job PR-context ব্যবহার করে না, আর PR-close → linked-issue-close →
  # `issues` ইভেন্ট তবুও আসে। আগে প্রতিটি PR open/close-এ এই workflow-এর
  # ৩টি ভারী job (checkout+setup-python) বৃথা স্পন হতো; এখন cron (*/10) +
  # issues ইভেন্টই টাস্ক-অর্জনের কভারেজ দেয় (রিঅ্যাকশন লেটেন্সি ≤ ১০ মিনিট)।
  workflow_run:
    # বাংলা মন্তব্য: GitHub schema অনুযায়ী workflow_run trigger-এ টার্গেট workflow-এর
    # নাম ঘোষণা বাধ্যতামূলক — না হলে পুরো file parse রিজেক্ট হয় (zero-job failure, #2582)।
    # স্কোপ: DRY 3-Pipeline Law-এর দুই CI gate — merge/train/deploy-এর নিজস্ব handling আছে।
    # রাখা হয়েছে শুধু ci-failure-handler-এর (গ্যারান্টি #৩) জন্য; নিচের ভারী job-গুলো
    # `event_name != 'workflow_run'` দিয়ে গেট করা — তাই CI পাসের রানে সব job
    # তৎক্ষণাৎ skip হয় (রানার-মিনিট শূন্য, কিউ-নয়েজ সীমিত)।
    workflows:
      - "PR Gate (Unified Pipeline)"
      - "Main CI/CD"
      # বাংলা মন্তব্য (#2928): Branch Creation Guard-ও এখন নজরদারিতে — আগে guard-violation
      # (যেমন fix/2925 @ PR #2926) কারো কাছেই পৌঁছাত না; এখন register-এ দৃশ্যমান হবে।
      - "🌿 Branch Creation Guard"
    types: [completed]
    # বাংলা মন্তব্য (#2806 conflict-resolution): main-এর আগের ভার্সন workflow_run
    # সম্পূর্ণ বাদ দিয়েছিল — কিন্তু ci-failure-handler-এর `if:` শর্ত
    # `event_name == 'workflow_run'` হওয়ায় সেই ট্রিগার বাদ গেলে job-টি
    # চিরতরে unreachable dead-code হয়ে যেত (গ্যারান্টি #৩ নীরবে ভাঙত)।
    # তাই PR #2801-এর নকশা জেতে: PR-ট্রিগার বাদ + স্কোপড workflow_run থাকে —
    # ক্যাসকেডও কমে, handler-ও বেঁচে থাকে।
  schedule:
    - cron: "*/10 * * * *"  # Every 10 minutes
  workflow_dispatch:
    inputs:
      role:
        description: "Agent role (coder, planner, ci, platform)"
        required: true
        default: "coder"
      agent_name:
        description: "Agent identifier (e.g. coder-1)"
        required: true
        default: "coder-1"

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Audit if no issues exist
  # ---------------------------------------------------------------------------
  audit-if-needed:
    name: "🔍 Audit if Needed"
    # বাংলা মন্তব্য (#2778): workflow_run-ইভেন্টে এই ভারী job চলে না —
    # সেই রান শুধু ci-failure-handler-এর জন্য।
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_issues: ${{ steps.check.outputs.has_issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Check for open issues
        id: check
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COUNT=$(gh issue list --state open --limit 1 --json number | jq 'length')
          echo "has_issues=$([ "$COUNT" -gt 0 ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          echo "Open issues: $COUNT"

      - name: Run full audit if no issues
        if: steps.check.outputs.has_issues == 'false'
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "🔍 No open issues. Running full audit..."
          python scripts/agents/priority_queue_ledger.py --limit 10 || true
          echo "✅ Audit complete."

  # ---------------------------------------------------------------------------
  # 2. Priority Auto-Escalation
  # ---------------------------------------------------------------------------
  auto-escalate:
    name: "🔼 Auto-Escalate Priorities"
    # বাংলা মন্তব্য (#2778): হেভি job সমূহ workflow_run-রান থেকে বাদ —
    # ক্যাসকেড রানে শুধু skip-জব থাকে, রানার-মিনিট শূন্য।
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run priority auto-escalation
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/ci/auto_escalate_priority.py

  # ---------------------------------------------------------------------------
  # 3. Pipeline Failure Register — সব ব্যর্থতা এক গ্রুপে + স্মার্ট রাউটিং (#2928)
  # ---------------------------------------------------------------------------
  # বাংলা মন্তব্য (#2928 root-cause): পুরনো inline-bash handler-এর ৩টি জন্মগত বাগ —
  #   ১) workflow_run-এ checkout হয় main → `git log -10` পড়ত main-এর কমিট →
  #      ভুল issue-linkage (PR #2926-এর ব্যর্থতা গিয়ে পড়ত আনসম্পর্কিক #2719-এ!)
  #   ২) `grep -c … || echo "0"` দ্বৈত-আউটপুট ("0\n0") → গাণিতিক ত্রুটি →
  #      কমেন্টও যেত না, issue-ও জন্মাত না, তবু step "success" — নীরব মৃত্যু
  #   ৩) ছড়ানো blocker-issue — কোনো এক-গ্রুপ নীতি ছিল না
  # প্রতিস্থাপন: নির্ধারক single-funnel `pipeline_failure_register.py` —
  # fingerprint-dedup + স্মার্ট রাউটিং (merge-first > duplicate new-fix)।
  ci-failure-handler:
    name: "📋 Pipeline Failure Register (one group + smart routing)"
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Register pipeline failure (grouped + smart-routed)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "📋 Pipeline failure detected: $FAILED_WORKFLOW on $FAILED_BRANCH (run $FAILED_RUN_ID)"
          # বাংলা মন্তব্য: বুককিপিং-সফলতা = exit 0 — ব্যর্থতা রেজিস্টার-হওয়াই এই জব-এর কাজ।
          python scripts/ci/pipeline_failure_register.py --event

  # ---------------------------------------------------------------------------
  # 4. Agent Loop — Acquire, Claim, Execute
  # ---------------------------------------------------------------------------
  agent-loop:
    name: "🔄 Agent Loop (${{ github.event.inputs.role || 'coder' }})"
    needs: [audit-if-needed, auto-escalate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run continuous agent loop
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ROLE="${{ github.event.inputs.role || 'coder' }}"
          AGENT="${{ github.event.inputs.agent_name || 'coder-1' }}"
          echo "🚀 Starting agent loop: role=$ROLE, agent=$AGENT"
          python scripts/agents/continuous_agent_loop.py --role "$ROLE" --agent-name "$AGENT" --iterations 1
