# SupremeAI 2.0 — Cloudflare Worker Configuration
# Edge proxy/failover worker in front of the Render backend (request routing,
# caching, rate limiting, health-aware failover).

name = "supremeai-worker"
main = "cloudflare_worker.js"
compatibility_date = "2026-07-01"
# CI-16 (#573): account_id is intentionally NOT hardcoded here (public repo).
# Wrangler reads CLOUDFLARE_ACCOUNT_ID from the environment; the only deploy
# path for this config (ci-deploy-production.yml) injects it from repo secrets
# and fail-fasts when unset. Set it locally before manual `wrangler deploy`:
#   export CLOUDFLARE_ACCOUNT_ID=<your-account-id>

# ── Scheduled triggers ────────────────────────────────────────────────────────
# REMOVED (issue #708): the previous `crons = ["*/8 * * * *"]` keep-alive ping
# (24/7 pings across 4 Render free-tier accounts, each with 750h free, to
# defeat the ~15-min idle spin-down) was ToS arbitrage. Policy is set in
# .github/workflows/keepalive.yml: "scheduled pings must not be used to bypass
# free-tier sleeping limits." No [triggers] section on purpose: the worker's
# `scheduled` handler simply never fires (request routing/failover are
# unaffected). Re-enable ONLY with owner sign-off, via a provider-supported
# paid maintenance job — not free-tier circumvention.

# ── KV namespace ──────────────────────────────────────────────────────────────
# INF-10 (#533): cloudflare_worker.js reads env.SUPREMEAI_KV (getKV(): edge rate
# limiting, circuit-breaker state sharing, healthy-backend cache). This file
# previously declared ZERO [[kv_namespaces]], so getKV() always returned null
# and every `if (kv)` guard silently no-opped — the edge worker shipped without
# rate limiting while looking protected. Declare the binding the code expects.
#
# The namespace ID can only be minted by the Cloudflare account owner:
#   wrangler kv namespace create SUPREMEAI_KV
# then paste the returned 32-hex ID below. Until a REAL ID is in place,
# `wrangler deploy` fails fast (invalid IDs are rejected at config validation)
# instead of shipping a silently-unprotected worker — do not weaken this.
[[kv_namespaces]]
binding = "SUPREMEAI_KV"
id = "b22aebebee9d4f1082fd77558e73c052"

[vars]
# 4 backend roles — each on a separate Render account (750h free/month each)
PRIMARY_URL = "https://supremeai-primary-node.onrender.com"
WORKER_URL  = "https://supremeai-worker-node.onrender.com"
SCRAPER_URL = "https://supremeai-scraper-node.onrender.com"
MCP_URL     = "https://supremeai-mcp-tower.onrender.com"
# Legacy aliases kept for backward compat
USER_BACKEND_URL  = "https://supremeai-primary-node.onrender.com"
GCP_CLOUD_RUN_URL = "https://supremeai-primary-node.onrender.com"
GCP_REGION = "us-central1"
GCP_WEIGHT = "25"

# ── Origin Shield secret (#781) ───────────────────────────────────────────────
# ORIGIN_VERIFY_KEY is a pre-shared secret injected by this worker on every
# proxied request (withOriginShield → X-Origin-Verify-Key header). The FastAPI
# backend's OriginShieldMiddleware (backend/core/middleware/origin_shield.py)
# rejects any non-health request lacking this header, so direct .onrender.com
# hits are blocked even though the Render ipAllowList stays 0.0.0.0/0 (required
# for Render health probes on free tier).
#
# MUST be a Cloudflare SECRET (not a [vars] entry) so it's encrypted at rest.
# Set it via: `wrangler secret put ORIGIN_VERIFY_KEY` (will prompt for value).
# The same value MUST be set as `ORIGIN_VERIFY_KEY` in the Infisical vault so
# the backend reads it via os.getenv("ORIGIN_VERIFY_KEY").
# Both sides must match exactly — rotation requires updating BOTH locations.
