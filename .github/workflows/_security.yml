# ==============================================================================
# _security.yml — Security Analysis (CodeQL + Trivy)
# ==============================================================================
# Extracted from supreme-core-ci.yml (lines 561-631)
# Called via workflow_call from the orchestrator.
# ==============================================================================

name: 🛡️ Security Analysis

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        type: string
        required: false
        default: '3.11'

jobs:
  codeql-analysis:
    name: 🛡️ CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        timeout-minutes: 10
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        timeout-minutes: 25
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: 📊 Add CodeQL Results to GitHub Summary
        if: always()
        run: |
          echo "## 🛡️ CodeQL Analysis (${{ matrix.language }})" >> $GITHUB_STEP_SUMMARY
          echo "✅ SARIF report uploaded to GitHub Security tab" >> $GITHUB_STEP_SUMMARY

  trivy-analysis:
    name: 🔍 Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Parallel Security Scan (Trivy)
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./bin
          TRIVY_VERSION=$(curl -sL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          if [ -z "$TRIVY_VERSION" ]; then
            TRIVY_VERSION="0.55.0"
          fi
          echo "Downloading Trivy version: $TRIVY_VERSION"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          tar -xzf trivy.tar.gz -C ./bin trivy
          rm trivy.tar.gz
          ./bin/trivy fs --format sarif --output trivy-python.sarif --severity CRITICAL,HIGH backend &
          ./bin/trivy fs --format sarif --output trivy-nodejs.sarif --severity CRITICAL,HIGH . &
          wait

      - name: Upload Trivy Python SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-python.sarif') != ''
        with:
          sarif_file: 'trivy-python.sarif'
          category: 'trivy-python'

      - name: Upload Trivy Node.js SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-nodejs.sarif') != ''
        with:
          sarif_file: 'trivy-nodejs.sarif'
          category: 'trivy-nodejs'

      - name: 📊 Add Trivy Results to GitHub Summary
        if: always()
        run: |
          echo "## 🛡️ Trivy Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python dependencies scanned (backend/)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Node.js dependencies scanned" >> $GITHUB_STEP_SUMMARY