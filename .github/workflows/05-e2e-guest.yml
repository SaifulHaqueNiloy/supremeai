# QA Engine — E2E Guest smoke (Part 7.1 of the QA engine plan)
# Deprecated: consolidated into e2e-suites.yml (Wave 3.5).
# Retained as a delegation wrapper for Preservation Guard compliance.
name: QA — E2E Guest Smoke (Deprecated Shim)

on:
  workflow_call:
    inputs:
      use_staging:
        description: 'Run guest suite against STAGING_URL instead of a local preview build'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      use_staging:
        description: 'Run guest suite against STAGING_URL instead of a local preview build'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supremeai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-guest-suite:
    name: 🎭 Guest Suite
    uses: ./.github/workflows/reusable-e2e-runner.yml
    with:
      project: guest
      use_staging: ${{ inputs.use_staging == true }}
    secrets: inherit
