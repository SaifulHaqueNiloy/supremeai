# QA — Live Production Smoke (scheduled continuous live-verification)
# বাংলা: এটি প্রজেক্টের প্রথম কন্টিনিউয়াস "লাইভ" প্রমাণ চেইন — দৈনিক নির্ধারিত +
# চাহিদামতো (workflow_dispatch) প্রোব। False-Assurance doctrine:
#   - কোনো localhost/placeholder fallback নেই — zero-hardcoded doctrine।
#   - দুই-স্তরের প্রোব (2026-09-18 incident-এর পর):
#       স্তর A — কাস্টমার চেইন: UI origin থেকে `/` (SPA) + ব্রাউজারের মতোই API
#                origin-এ DIRECT CORS কল (Origin: <UI origin> হেডারসহ →
#                access-control-allow-origin যাচাই)। Firebase Hosting external
#                rewrite proxy সমর্থন করে না (docs: rewrite destination = "a local
#                file that must exist") — তাই SPA সরাসরি API origin কল করে
#                (frontend/src/utils/api.ts)। পুরোনো same-origin rewrite প্রোব ছিল
#                ভুতুড়ে পাথ — সেটাই প্রথম প্রোবে ধরা পড়েছিল।
#       স্তর B — API সরাসরি: RENDER_CORE_URL (Infisical থেকে) দিয়ে health live/ready
#                + billing plans চুক্তি — কোন স্তর ভাঙা তা টেবিলেই আলাদা হয়ে যায়।
#   - প্রতিটি origin-এর provenance টেবিলে ছাপা হয় — কোন কনফিগ সোর্স থেকে URL
#     এলো তা অজানা থাকলে প্রমাণ অর্থহীন।
#   - PRODUCTION_URL (var/secret) সেট থাকলে সেটিই same-origin entry (owner override);
#     না থাকলে FIREBASE_PROJECT_ID থেকে https://{project}.web.app ডেরাইভ হয় (zero-hardcode:
#     URL কোথাও hardcode করা হয় না — owner-configured সিক্রেট থেকেই আসে)।
#   - কোনো টার্গেটই ডেরাইভ করা না গেলে লাল (UNVERIFIED) — কখনো ভুয়া পাস নয়।
#   - প্রমাণ $GITHUB_STEP_SUMMARY-তে (কমিট করা হয় না — ভোলাটাইল ডেটা diff-gate ভাঙে)।
name: QA — Live Production Smoke

on:
  workflow_call:
  schedule:
    # 03:15 UTC দৈনিক — maintenance-এর 02:00/02:30 collision-zone-এর বাইরে ইচ্ছাকৃত।
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    name: 🌐 Live Production Smoke (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Import RENDER_CORE_URL from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          export-type: "env"

      - name: Checkout (canonical resolver lives in-repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # বাংলা (#1132): resolution চেইন এখন scripts/ci/resolve_production_targets.py —
      # একটাই canonical চুক্তি, qa-live-smoke + 09-post-deploy-smoke + release
      # certification সবাই একই UI/API target + provenance দেখায়। ইনলাইন পাইথন
      # ডুপ্লিকেট মুছে ফেলা হয়েছে (drift = আলাদা আলাদা সত্য — আর সম্ভব নয়)।
      - name: Resolve live targets (canonical resolver, zero-hardcode, with provenance)
        id: resolve
        env:
          EXPLICIT_URL: ${{ vars.PRODUCTION_URL || secrets.PRODUCTION_URL }}
          FRONTEND_EXPLICIT_URL: ${{ secrets.FRONTEND_PRODUCTION_URL }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          RENDER_CORE: ${{ env.RENDER_CORE_URL }}
        run: python3 scripts/ci/resolve_production_targets.py --env-file "$GITHUB_ENV"

      - name: Require live target (fail-closed)
        if: ${{ env.UI_ORIGIN == '' && env.API_ORIGIN == '' }}
        run: |
          echo "### 🌡️ Live Production Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "**UNVERIFIED** — no live target could be resolved. This job is fail-closed by design; it will not fabricate a pass." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Owner action: set repo **variable** \`vars.PRODUCTION_URL\` (or secret \`PRODUCTION_URL\`) to the deployed base URL that serves both UI and API, or ensure \`FIREBASE_PROJECT_ID\` / Infisical \`RENDER_CORE_URL\` are configured." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::PRODUCTION_URL is not configured (and no FIREBASE_PROJECT_ID / RENDER_CORE_URL fallback resolvable) — live production path cannot be verified. Honest state: production liveness is UNVERIFIED."
          exit 1

      - name: Probe live chain (customer chain + API direct, fail-closed)
        env:
          UI_ORIGIN: ${{ env.UI_ORIGIN }}
          UI_ORIGIN_SOURCE: ${{ env.UI_ORIGIN_SOURCE }}
          API_ORIGIN: ${{ env.API_ORIGIN }}
          API_ORIGIN_SOURCE: ${{ env.API_ORIGIN_SOURCE }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          # বাংলা: প্রতিটি প্রোবের ব্যর্থতা প্রমাণসহ রেকর্ড হবে — কোনো ব্যতিক্রম চুপচাপ
          # গিলে ফেলা হবে না; একটিও FAIL হলে পুরো job লাল (fail-closed)।
          # Render free-tier cold-start (~50s) সত্য — তাই ২টি attempt + বড় timeout;
          # retry ব্যবহার হলে টেবিলে স্বচ্ছভাবে নোট হয় (নীরব নয়)।
          ui = os.environ.get("UI_ORIGIN", "").rstrip("/")
          ui_src = os.environ.get("UI_ORIGIN_SOURCE", "")
          api = os.environ.get("API_ORIGIN", "").rstrip("/")
          api_src = os.environ.get("API_ORIGIN_SOURCE", "")

          def probe(label, url, timeout, judge):
              # judge(status, body_bytes) -> note string; "FAIL:..." মানে ব্যর্থতা।
              last = None
              for attempt in (1, 2):
                  t0 = time.monotonic()
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "supremeai-live-smoke"})
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          code, body = resp.status, resp.read()
                      ms = int((time.monotonic() - t0) * 1000)
                      note = judge(code, body)
                      retry_note = " (attempt 2, cold-start retry)" if attempt == 2 else ""
                      return code, f"{ms} ms", note + retry_note
                  except urllib.error.HTTPError as exc:
                      # HTTPError-ও একটি সার্ভার রেসপন্স — judge এর সাথেই বিচার হোক।
                      code, body = exc.code, exc.read()
                      ms = int((time.monotonic() - t0) * 1000)
                      note = judge(code, body)
                      retry_note = " (attempt 2, cold-start retry)" if attempt == 2 else ""
                      return code, f"{ms} ms", note + retry_note
                  except Exception as exc:  # noqa: BLE001 — ব্যর্থতা প্রমাণসহ রেকর্ড হবে
                      last = (type(exc).__name__, str(exc))
                      if attempt == 1:
                          time.sleep(15)
              return "FAIL", "—", f"{last[0]}: {last[1]}"

          def j200(code, body, expect_keys=()):
              if code != 200:
                  return f"FAIL: expected 200, got {code}"
              try:
                  data = json.loads(body)
              except Exception:  # noqa: BLE001 — শরীরে অ-JSON = চুক্তি ভাঙা
                  return "FAIL: non-JSON body"
              missing = [k for k in expect_keys if k not in data]
              if missing:
                  return f"FAIL: missing key(s) {','.join(missing)}"
              return "json ok ✓"

          rows, failed = [], False

          def record(layer, label, url, code, latency, note):
              # বাংলা: heredoc স্ক্রিপ্ট মডিউল-লেভেল — তাই nonlocal নয়, global।
              global failed
              if note.startswith("FAIL"):
                  failed = True
              rows.append((layer, label, url, str(code), latency, note))

          # ---- স্তর A: কাস্টমার চেইন (SPA + CORS-verified direct API call) ----
          # বাংলা: ব্রাউজার ঠিক এভাবেই কল করে — SPA লোড হয় UI origin থেকে, তারপর
          # JS API origin-এ direct কল পাঠায় Origin হেডারসহ; সার্ভারকে অবশ্যই
          # access-control-allow-origin দিয়ে সাড়া দিতে হবে (নইলে ব্রাউজার
          # রেসপন্স ব্লক করে)। এটিই প্রকৃত প্রোডাকশন পাথ — same-origin rewrite নয়।
          if ui and api:
              print(f"Layer A origin (UI): {ui}  (source: {ui_src})")
              c, l, n = probe("frontend /", ui + "/", 45,
                              lambda c, b: "SPA served ✓" if c == 200 and b[:15] == b"<!doctype html>" else f"FAIL: expected 200 SPA html, got {c}")
              record("A chain", "frontend / (SPA)", ui + "/", c, l, n)

              def cors_judge(code, body):
                  # বাংলা: CORS চুক্তি — Origin: UI origin পাঠালে সার্ভারের
                  # allow-origin হেডার অবশ্যই সাড়া দেবে; 200 JSON-ও লাগবে।
                  if code != 200:
                      return f"FAIL: expected 200, got {code}"
                  try:
                      data = json.loads(body)
                  except Exception:  # noqa: BLE001 — অ-JSON = চুক্তি ভাঙা
                      return "FAIL: non-JSON body"
                  if "status" not in data:
                      return "FAIL: missing key(s) status"
                  return "CORS ✓ + json ok ✓"

              req_headers = {"User-Agent": "supremeai-live-smoke", "Origin": ui}
              last = None
              got = None
              for attempt in (1, 2):
                  t0 = time.monotonic()
                  try:
                      req = urllib.request.Request(api + "/api/v1/health/live", headers=req_headers)
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          code, body = resp.status, resp.read()
                          # বাংলা: resp.headers (HTTPMessage) case-insensitive — dict() নয়,
                          # নইলে HTTP/2-এর lowercase হেডার মিস হয়।
                          allow = resp.headers.get("Access-Control-Allow-Origin", "")
                      ms = int((time.monotonic() - t0) * 1000)
                      note = cors_judge(code, body)
                      if allow and (allow == ui or allow == "*"):
                          note = note.replace("CORS ✓", f"CORS allow-origin={allow} ✓")
                      elif code == 200:
                          note = "FAIL: 200 but no access-control-allow-origin for UI origin (browser would block)"
                      retry_note = " (attempt 2, cold-start retry)" if attempt == 2 else ""
                      got = (code, f"{ms} ms", note + retry_note)
                      break
                  except Exception as exc:  # noqa: BLE001 — ব্যর্থতা প্রমাণসহ রেকর্ড হবে
                      last = (type(exc).__name__, str(exc))
                      if attempt == 1:
                          time.sleep(15)
              if got is None:
                  got = ("FAIL", "—", f"{last[0]}: {last[1]}")
              record("A chain", "API direct call w/ Origin (browser path)", api + "/api/v1/health/live", got[0], got[1], got[2])
          elif ui:
              # বাংলা: UI origin আছে কিন্তু API origin নেই — SPA প্রোব হবে, API চেইন UNVERIFIED।
              print(f"Layer A origin (UI): {ui}  (source: {ui_src})")
              c, l, n = probe("frontend /", ui + "/", 45,
                              lambda c, b: "SPA served ✓" if c == 200 and b[:15] == b"<!doctype html>" else f"FAIL: expected 200 SPA html, got {c}")
              record("A chain", "frontend / (SPA)", ui + "/", c, l, n)
              rows.append(("A chain", "API direct call w/ Origin (browser path)", "(no API origin resolvable)", "SKIP", "—", "UNVERIFIED — no API origin (configure RENDER_CORE_URL in Infisical or PRODUCTION_URL)"))
          else:
              # বাংলা: UI origin ডেরাইভ করা যায়নি — নীরব পাস নয়; স্পষ্ট UNVERIFIED সারি।
              rows.append(("A chain", "frontend /", "(no UI origin resolvable)", "SKIP", "—", "UNVERIFIED — no UI origin (configure PRODUCTION_URL or FIREBASE_PROJECT_ID)"))

          # ---- স্তর B: API সরাসরি ----
          if api:
              print(f"Layer B origin: {api}  (source: {api_src})")
              c, l, n = probe("health live (direct)", api + "/api/v1/health/live", 90,
                              lambda c, b: j200(c, b, ("status",)))
              record("B api-direct", "/api/v1/health/live", api + "/api/v1/health/live", c, l, n)
              c, l, n = probe("health ready (direct)", api + "/api/v1/health/ready", 90,
                              lambda c, b: j200(c, b, ("status",)))
              record("B api-direct", "/api/v1/health/ready", api + "/api/v1/health/ready", c, l, n)

              def plans_judge(code, body):
                  # বাংলা: চুক্তি — plans dict-shaped হবে। আনঅথেনটিকেটেড প্রোবে সচল
                  # মিডলওয়্যার 401 দেয় (রুট উপস্থিত + সৎ guard) — উভয়ই সৎ অবস্থা;
                  # 404/5xx/অ-JSON = ভাঙা।
                  if code == 200:
                      try:
                          data = json.loads(body)
                      except Exception:  # noqa: BLE001
                          return "FAIL: non-JSON body on 200"
                      if isinstance(data, dict) and "plans" in data:
                          return "plans-key ✓ (dict contract)"
                      return "FAIL: plans-key missing (contract drift!)"
                  if code == 401:
                      return "auth-gated ✓ (route present, middleware honest)"
                  return f"FAIL: expected 200/401, got {code}"

              c, l, n = probe("billing plans contract", api + "/api/billing/plans", 90, plans_judge)
              record("B api-direct", "/api/billing/plans", api + "/api/billing/plans", c, l, n)
          else:
              rows.append(("B api-direct", "API probes", "(no API origin resolvable)", "SKIP", "—", "UNVERIFIED — no API origin (configure RENDER_CORE_URL in Infisical or PRODUCTION_URL)"))

          verdict = ("✅ PASS — live production path verified (customer chain + API)"
                     if not failed else "❌ FAIL — live production path broken")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          content = [
              "### 🌡️ Live Production Smoke",
              f"**{verdict}**",
              "",
              f"- Layer A origin: `{ui or '(none)'}` — source: {ui_src or '-'}",
              f"- Layer B origin: `{api or '(none)'}` — source: {api_src or '-'}",
              "",
              "| layer | probe | url | status | latency | note |",
              "|---|---|---|---|---|---|",
              *(("| " + " | ".join(r) + " |") for r in rows),
              "",
              "Root-cause hint: Layer A SPA FAIL = hosting/CDN issue. Layer A CORS call FAIL + Layer B PASS = the backend is alive but rejects/blocks the UI origin — check the API CORS config (USER_CORS_ORIGINS / CORS_ORIGINS) and the VITE_* backend URL baked into the SPA build. Layer B FAIL = API service itself down.",
              "",
          ]
          text = "\n".join(content) + "\n"
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          sys.exit(1 if failed else 0)
          PY
