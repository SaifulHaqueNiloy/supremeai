# PyJWT = "2.10+" # added below when migration complete
python-dotenv = "^1.0.1"
requests = "^2.32.3"
uuid6 = "^2025.0.1"
boto3 = "^1.41.5"
defusedxml = "^0.7.1"
beautifulsoup4 = "^4.15.0"
posthog = "^7.29.0"
mcp = "^1.28.1"
stripe = "^15.3.1"
neo4j = "^6.2.0"
aiohttp = "^3.10.10"
websockets = "^13.1"
pygithub = "^2.5.0"
pydantic-extra-types = "^2.11.1"
supabase = "^2.11.0"
firebase-admin = "^6.5.0"
qdrant-client = "^1.12.1"
numpy = "^1.26.4"
opencv-python-headless = "^4.10.0"  # headless: no GTK/GUI libs needed in CI containers
pandas = "^2.2.3"
pyarrow = "^18.1.0"
gcsfs = "^2024.10.0"
s3fs = "^2024.10.0"
pyotp = "^2.9.0"
qrcode = "^8.0"
pillow = "^11.0.0"
cryptography = "^43.0.1"
pybreaker = "^1.4.1"
python-socketio = "^5.11.4"
bidict = "^0.23.1"
webcolors = "^24.11.1"
pytz = "^2024.2"
python-dateutil = "^2.9.0.post0"
croniter = "^5.0.1"
phonenumbers = "^8.13.54"
email-validator = "^2.2.0"
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
pymongo = "^4.10.0"
elasticsearch = "^8.16.0"
google-cloud-firestore = "^2.19.0"
google-cloud-storage = "^2.18.2"
google-auth = "^2.36.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.1"
openai = "^1.54.0"
anthropic = "^0.120.0"
litellm = "^1.50.0"
langchain = "^0.3.7"
langchain-community = "^0.3.7"
langchain-core = "^0.3.15"
langchain-google-genai = "^2.0.6"
langgraph = "^0.2.39"
sse-starlette = "^2.1.3"
plotly = "^5.24.1"
