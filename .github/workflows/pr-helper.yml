# ==============================================================================
# PR Helper — State-based Locking Lifecycle (5-Step)
# ==============================================================================
# বাংলা মন্তব্য: এই workflow টি PR-কে একটি state machine-এর মতো চালায়:
#
#   Step 1  Diagnostic & Base-Comparison   → BASE ও HEAD দুটোতেই focused pytest
#   Step 2  Conflict & Quality Audit       → merge conflict + ruff
#   Step 3  Test Failure & Delta Analysis  → new / pre-existing / fixed আলাদা
#   Branch A (pure improvement) → Step 5: approve + auto-merge
#   Branch B (new regression)   → Step 4: hunk-level isolation
#         ├─ isolatable → clean patch branch পুশ + বাদ দেওয়া diff comment
#         └─ fatal      → auto GitHub Issue (লগ সহ) + request-changes + block
#
# ডকুমেন্টেশন: docs/master_docs/OPS-05-PR-HELPER-LIFECYCLE.md
#
# খরচ নোট: diag জবগুলো coverage ছাড়া (no-cov) `critical or important` মার্কার
# subset চালায় — full matrix CI (ci.yml) merge gate হিসেবেই authoritative।
# Helper শুধু decision নেওয়ার জন্য BASE-বনাম-HEAD signal বানায়।
#
# SAFETY (fail-closed): HEAD diagnostic-এর JUnit না পেলে approval হয় না —
# classification অজানা থাকলে helper কখনোই auto-approve করবে না।
# ==============================================================================

name: PR Helper (5-Step Lifecycle)

concurrency:
  group: pr-helper-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: string
  # Invoked as reusable workflow by the unified pr-pipeline.yml
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to analyze (from caller)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'
  # বাংলা মন্তব্য: helper-এর focused diagnostic marker set — CI-এর full matrix
  # আলাদা গেট; এখানে দ্রুত BASE/HEAD signal দরকার। দরকারে এখানে বাড়ানো যাবে।
  PR_HELPER_MARKERS: 'critical or important'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # ---------------------------------------------------------------------------
  # Guard — event normalize + changed-file filter (runner বাঁচায়)
  # ---------------------------------------------------------------------------
  guard:
    name: 🧭 Guard & Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.meta.outputs.proceed }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
    steps:
      - name: Checkout (full history for merge-base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            PR="${{ inputs.pr_number }}"
            HEAD_SHA="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
            BASE_REF="$(gh pr view "$PR" --json baseRefName -q .baseRefName)"
          fi
          BASE_SHA="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")"
          DRAFT="$(gh pr view "$PR" --json isDraft -q .isDraft || echo false)"
          SAME_REPO="${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"

          PROCEED=true
          [[ "$DRAFT" == "true" ]] && PROCEED=false
          [[ "$SAME_REPO" != "true" ]] && PROCEED=false

          {
            echo "pr_number=$PR"
            echo "head_sha=$HEAD_SHA"
            echo "base_sha=$BASE_SHA"
            echo "proceed=$PROCEED"
          } >> "$GITHUB_OUTPUT"

          echo "PR=$PR head=$HEAD_SHA base=$BASE_SHA proceed=$PROCEED"

      - name: Scope filter (backend touched? + self-modification detection)
        id: scope
        run: |
          # Python classifies changed files, bash writes to GITHUB_OUTPUT (reliable)
          RESULTS=$(python3 -c "
          import subprocess, re, json
          base = '${{ steps.meta.outputs.base_sha }}'
          head = '${{ steps.meta.outputs.head_sha }}'
          result = subprocess.run(['git', 'diff', '--name-only', f'{base}...{head}'], capture_output=True, text=True)
          changed = result.stdout.strip().split('\n') if result.stdout.strip() else []
          backend_re = re.compile(r'^(backend/|scripts/ci/plan_backend_test_groups\.py)')
          self_mod_re = re.compile(r'^(\.github/workflows/pr-helper\.yml|\.github/scripts/pr_helper/|docs/security/SECURITY_GUARDIAN\.md|security/policies/)')
          print(json.dumps({'backend': any(backend_re.match(f) for f in changed), 'self_mod': any(self_mod_re.match(f) for f in changed), 'files': changed[:30]}))
          ")
          BACKEND=$(echo "$RESULTS" | python3 -c "import json,sys; print(str(json.load(sys.stdin)['backend']).lower())")
          SELF_MOD=$(echo "$RESULTS" | python3 -c "import json,sys; print(str(json.load(sys.stdin)['self_mod']).lower())")
          echo "backend_changed=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "self_modification_detected=$SELF_MOD" >> "$GITHUB_OUTPUT"
          echo "backend_changed=$BACKEND"
          echo "self_modification_detected=$SELF_MOD"
          if [[ "$SELF_MOD" == "true" ]]; then
            echo "::warning::Self-modification detected (GAP-06/SG-11) — auto-merge DISABLED"
          fi
          echo "--- changed files ---"
          echo "$RESULTS" | python3 -c "import json,sys; [print(f) for f in json.load(sys.stdin)['files']]" || true

  # ---------------------------------------------------------------------------
  # STEP 1 — Diagnostic & Base-Comparison (BASE ও HEAD পাশাপাশি চলে)
  # ---------------------------------------------------------------------------
  step1-diagnostic:
    name: 🔬 Step 1 — Diagnostic (${{ matrix.side }})
    needs: guard
    if: needs.guard.outputs.proceed == 'true' && needs.guard.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supremeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout ${{ matrix.side }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # বাংলা মন্তব্য: side==base হলে merge-base checkout — HEAD-এর সাথে
          # ঠিক তুলনীয় স্ন্যাপশট।
          ref: ${{ matrix.side == 'base' && needs.guard.outputs.base_sha || needs.guard.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-browser-deps: 'false'
          mode: prepare

      - name: Run focused diagnostic tests (${{ matrix.side }})
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/supremeai_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars-padding-for-length
          SUPREMEAI_JWT_SECRET: test-supremeai-jwt-secret-key-for-ci-minimum-64-chars-padding-1234
          ALLOW_TEST_AUTH_BYPASS: 'true'
          USER_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
          ADMIN_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
        # বাংলা মন্তব্য: pytest-এর exit code গিলে ফেলা হচ্ছে — এই জবের কাজ
        # সব তথ্য (junit + log) সংগ্রহ করা; পাস/ফেল সিদ্ধান্ত Step 3 নেবে।
        run: |
          mkdir -p ../pr-helper
          set +o errexit
          poetry run pytest tests/ \
            -o 'addopts=-ra --tb=short --strict-markers --strict-config --import-mode=importlib' \
            -m "${{ env.PR_HELPER_MARKERS }}" \
            --junitxml=../pr-helper/junit-${{ matrix.side }}.xml \
            -o junit_family=xunit2 \
            > ../pr-helper/pytest-${{ matrix.side }}.log 2>&1
          RC=$?
          set -o errexit
          echo "$RC" > ../pr-helper/rc-${{ matrix.side }}.txt
          echo "pytest (${{ matrix.side }}) exit code: $RC"
          tail -30 ../pr-helper/pytest-${{ matrix.side }}.log || true
          exit 0

      - name: Upload diagnostic artifact (${{ matrix.side }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-helper-diag-${{ matrix.side }}
          path: pr-helper/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # STEP 1.5 — Learning Guards (governance + frontend type-gate)
  # ---------------------------------------------------------------------------
  # বাংলা মন্তব্য (LEARNING-GUARDS): এই জবটি অতীতের বাস্তব regression শ্রেণিগুলোকে
  # machine-checkable নিয়মে এনকোড করে — যেগুলো আগের lifecycle ধরতে পারেনি:
  #   L1 frontend type-gate → #1028: GlobalHeader-এ undefined `isLoading`
  #      (TS2304) — vite build type-check করে না, তাই broken bundle main-এ
  #      গিয়ে ১৫+ consecutive commit ধরে ৩টি auth-smoke E2E ভাঙছিল।
  #   L2 test-file deletion → #1038 ৮টি test file (১,৭৫৮ লাইন) ডিলিট করেছিল
  #      → #1042 governance regression।
  #   L3 honest-CI skip guard → #1011 (৮২ skip debt); c6a0856b আবার skip
  #      যোগ করেছিল — fake-green।
  #   L4 plans/docs deletion → AGENTS.md no-deletion clause।
  #   L5 CI suppression → `continue-on-error: true` abuse (warning)।
  # Guard FAIL হলে Branch A (auto-approve) ও Branch B (auto-fix) দুটোই
  # fail-closed ব্লক হয় — শুধু মানুষ merge করতে পারে।
  # ---------------------------------------------------------------------------
  step1_5-learning-guards:
    name: 🛡️ Step 1.5 — Learning Guards
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      guard_status: ${{ steps.guards.outputs.guard_status }}
      frontend_changed: ${{ steps.guards.outputs.frontend_changed }}
      blocks: ${{ steps.guards.outputs.blocks }}
    steps:
      - name: Checkout HEAD (full history for base...head diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read governance override markers from PR body
        id: overrides
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.guard.outputs.pr_number }}
        run: |
          set -euo pipefail
          BODY="$(gh pr view "$PR" --json body -q .body || echo '')"
          TEST_DEL="$(printf '%s' "$BODY" | grep -oP 'ALLOW-TEST-DELETION:\s*#\d+' | head -1 | grep -oP '#\d+' || true)"
          DOCS_DEL="$(printf '%s' "$BODY" | grep -oP 'ALLOW-DOCS-DELETION:\s*#\d+' | head -1 | grep -oP '#\d+' || true)"
          {
            echo "allow_test_deletion=${TEST_DEL}"
            echo "allow_docs_deletion=${DOCS_DEL}"
          } >> "$GITHUB_OUTPUT"
          echo "override markers: test=${TEST_DEL:-none} docs=${DOCS_DEL:-none}"

      - name: Scope check (frontend touched?)
        id: scope
        run: |
          set -euo pipefail
          python3 .github/scripts/pr_helper/learning_guards.py \
            --base "${{ needs.guard.outputs.base_sha }}" \
            --head "${{ needs.guard.outputs.head_sha }}" \
            --scope-only
          python3 .github/scripts/pr_helper/learning_guards.py \
            --base "${{ needs.guard.outputs.base_sha }}" \
            --head "${{ needs.guard.outputs.head_sha }}" \
            --scope-only | python3 -c "import json,sys; d=json.load(sys.stdin); print('frontend_changed='+str(d['frontend_changed']).lower())" >> "$GITHUB_OUTPUT"

      - name: Setup Frontend Environment (only when frontend changed)
        if: steps.scope.outputs.frontend_changed == 'true'
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 24
          working-directory: ./frontend
          install-deps: 'true'

      - name: Run learning guards
        id: guards
        run: |
          set -euo pipefail
          mkdir -p pr-helper
          set +e
          python3 .github/scripts/pr_helper/learning_guards.py \
            --base "${{ needs.guard.outputs.base_sha }}" \
            --head "${{ needs.guard.outputs.head_sha }}" \
            --allow-test-deletion "${{ steps.overrides.outputs.allow_test_deletion }}" \
            --allow-docs-deletion "${{ steps.overrides.outputs.allow_docs_deletion }}" \
            --output-json pr-helper/learning_guards.json \
            --summary pr-helper/learning_guards_summary.md
          RC=$?
          set -e
          echo "guard exit code: $RC (0=pass, 1=violations)"
          STATUS="pass"; [[ "$RC" -ne 0 ]] && STATUS="fail"
          BLOCKS="$(python3 -c "import json;print(json.load(open('pr-helper/learning_guards.json'))['counts']['blocks'])")"
          FRONTEND="$(python3 -c "import json;print(str(json.load(open('pr-helper/learning_guards.json'))['frontend_changed']).lower())")"
          {
            echo "guard_status=$STATUS"
            echo "frontend_changed=$FRONTEND"
            echo "blocks=$BLOCKS"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload guard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-helper-learning-guards
          path: pr-helper/
          retention-days: 14
          if-no-files-found: warn

      - name: Comment guard verdict on PR (violations only)
        if: steps.guards.outputs.guard_status == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.guard.outputs.pr_number }}
        run: |
          gh pr comment "$PR" --body-file pr-helper/learning_guards_summary.md
          gh pr edit "$PR" --add-label "governance-violation" || true

      - name: Label pass (visibility)
        if: steps.guards.outputs.guard_status == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.guard.outputs.pr_number }}
        run: gh pr edit "$PR" --add-label "pr-helper:learning-guards-pass" || true

  # ---------------------------------------------------------------------------
  # STEP 2 — Conflict & Quality Audit
  # ---------------------------------------------------------------------------
  step2-audit:
    name: 🧪 Step 2 — Conflict & Quality Audit
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      conflicts: ${{ steps.conflict.outputs.conflicts }}
      lint: ${{ steps.lint.outputs.verdict }}
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Merge conflict check
        id: conflict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MERGEABLE="$(gh pr view '${{ needs.guard.outputs.pr_number }}' --json mergeable -q .mergeable || echo UNKNOWN)"
          if [[ "$MERGEABLE" == "CONFLICTING" ]]; then
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            echo "::error::PR has merge conflicts with the base branch"
          else
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "Mergeable state: $MERGEABLE"
          fi

      - name: Ruff quality audit (poetry.lock-pinned version)
        id: lint
        run: |
          set -euo pipefail
          RUFF_VERSION="$(awk '/name = "ruff"/{found=1} found && /^version = /{gsub(/"/, "", $3); print $3; exit}' backend/poetry.lock)"
          echo "Ruff version from lock: ${RUFF_VERSION:-latest}"
          pip install --quiet "ruff${RUFF_VERSION:+==$RUFF_VERSION}"
          # ci.yml-এর early-lint-এর হুবহু rule-set — একই পলিসি, দ্রুত ফিডব্যাক
          if ruff check backend \
            --select E,W,F,I,N,UP,B,SIM \
            --ignore E501,E402,B008,B904,N803,N806,N815,N818,SIM102,SIM105,SIM108,SIM117,SIM112,SIM116,E741,B017,B007,N802,N811,N812,N813,N817,F811,F401,W291,W293,SIM103,SIM109,SIM110,SIM222,SIM401,B028; then
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # STEP 3 — Test Failure & Delta Analysis
  # ---------------------------------------------------------------------------
  step3-delta:
    name: 📊 Step 3 — Failure Delta Analysis
    needs: [guard, step1-diagnostic]
    # বাংলা মন্তব্য: step1 skipped হলেও (docs-only PR) delta চলবে — সেক্ষেত্রে
    # ট্রিভিয়াল pure-improvement। step1 infra-fail হলে artifacts নেই →
    # head_incomplete=true → step5 fail-closed ব্লক করবে। তাই এখানে result
    # চেক নেই — শুধু guard-gate আর cancellation।
    if: ${{ !cancelled() && needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.delta.outputs.classification }}
      new_count: ${{ steps.delta.outputs.new_count }}
      pre_existing_count: ${{ steps.delta.outputs.pre_existing_count }}
      fixed_count: ${{ steps.delta.outputs.fixed_count }}
      head_incomplete: ${{ steps.delta.outputs.head_incomplete }}
    steps:
      - name: Checkout main (scripts live here, not necessarily on the PR branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download diagnostic artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pr-helper-diag-*
          merge-multiple: true
          path: pr-helper/

      - name: Run delta analysis
        id: delta
        run: |
          set -euo pipefail
          mkdir -p pr-helper
          if [[ "${{ needs.guard.outputs.backend_changed }}" != "true" ]]; then
            # বাংলা মন্তব্য: backend touch হয়নি (docs/frontend-only PR) — টেস্ট
            # surface নেই, তাই fail-closed হিসেবে incomplete চিহ্ন ছাড়াই clean।
            echo '{"classification": "pure-improvement", "new_failures": [], "pre_existing": [], "fixed": [], "head_tests": 0, "base_tests": 0, "head_incomplete": false, "base_incomplete": false, "note": "no backend changes"}' > pr-helper/delta.json
            {
              echo "classification=pure-improvement"
              echo "new_count=0"
              echo "pre_existing_count=0"
              echo "fixed_count=0"
              echo "head_incomplete=false"
            } >> "$GITHUB_OUTPUT"
            echo "Backend untouched — trivial pure-improvement classification."
            exit 0
          fi
          python .github/scripts/pr_helper/delta_analysis.py \
            --base-junit pr-helper/junit-base.xml \
            --head-junit pr-helper/junit-head.xml \
            --output-json pr-helper/delta.json \
            --summary-out pr-helper/summary.md

      - name: Upload delta artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-helper-delta
          path: pr-helper/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # BRANCH A → STEP 5 — Pure Improvement Decision (approve + auto-merge)
  # ---------------------------------------------------------------------------
  step5-pure-improvement:
    name: ✅ Step 5 — Pure Improvement Decision
    needs: [guard, step1_5-learning-guards, step2-audit, step3-delta]
    # NOTE: self_modification_detected check moved to pr-pipeline.yml's pr-gate
    # (the guard scope step's bash echo to GITHUB_OUTPUT was unreliable)
    if: >-
      ${{
        !cancelled() &&
        needs.step3-delta.result == 'success' &&
        needs.step3-delta.outputs.classification == 'pure-improvement' &&
        needs.step3-delta.outputs.head_incomplete == 'false' &&
        needs.step1_5-learning-guards.outputs.guard_status == 'pass' &&
        needs.step2-audit.outputs.conflicts == 'false' &&
        needs.step2-audit.outputs.lint == 'pass'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.guard.outputs.pr_number }}
    steps:
      - name: Comment classification summary
        run: |
          set -euo pipefail
          cat > /tmp/pr-helper-comment.md <<'MD'
          ## ✅ PR Helper — PURE IMPROVEMENT

          State-based Locking Lifecycle classification:

          | Signal | Result |
          |---|---|
          | 🛑 New failures (regression) | **COUNT_PLACEHOLDER** |
          | 🟡 Pre-existing (tolerated) | **PRE_PLACEHOLDER** |
          | 🟢 Fixed by this PR | **FIXED_PLACEHOLDER** |
          | 🔀 Merge conflicts | none |
          | 🧹 Quality audit (ruff) | pass |

          কোনো নতুন regression নেই — এই PR শুধু improvement আনে। Auto-merge queue-তে যোগ করা হয়েছে (যদি রিপো-তে auto-merge চালু থাকে)।
          MD
          sed -i "s/COUNT_PLACEHOLDER/${{ needs.step3-delta.outputs.new_count }}/; s/PRE_PLACEHOLDER/${{ needs.step3-delta.outputs.pre_existing_count }}/; s/FIXED_PLACEHOLDER/${{ needs.step3-delta.outputs.fixed_count }}/" /tmp/pr-helper-comment.md
          gh pr comment "$PR" --body-file /tmp/pr-helper-comment.md

      - name: Approve PR (non-fatal when author == token owner)
        run: |
          gh pr review "$PR" --approve \
            && echo "approved" \
            || echo "::notice::Auto-approve skipped (own PR বা branch protection policy) — শুধু classification comment যথেষ্ট।"

      - name: Enable auto-merge (squash) — skip own PRs (Option C hang-guard, GAP-02)
        run: |
          AUTHOR="$(gh pr view "$PR" --repo "$GH_REPO" --json author -q .author.login)"
          OWNER="$(gh repo view "$GH_REPO" --json owner -q .owner.login)"
          if [[ "$AUTHOR" == "$OWNER" ]]; then
            echo "::notice::Own PR (author == repo owner) — auto-merge SKIPPED (SELF_APPROVAL_POLICY Option B + Option C hang-guard, GAP-02). Maintainer review + manual merge required."
            gh label create "needs-human-review" --color D93F0B --description "Self-approval policy: maintainer review required" --force
            gh pr edit "$PR" --add-label "needs-human-review" || true
            exit 0
          fi
          gh pr merge "$PR" --auto --squash \
            && echo "auto-merge enabled" \
            || echo "::notice::Auto-merge চালু হয়নি (repo setting বা required checks) — branch protection-ই চূড়ান্ত গেট।"

      - name: Label PR
        run: |
          gh label create "pr-helper:auto-approved" --color 0e8a16 --description "PR Helper: no new regressions" --force
          gh pr edit "$PR" --add-label "pr-helper:auto-approved" || true

  # ---------------------------------------------------------------------------
  # STEP 5.5 — AI Auto-Fix (issue #1034)
  # শুধু তখনই চলে যখন Step 5 (auto-merge) fail করে — CI লাল থাকলে AI দিয়ে
  # fix generate করে push করে আবার CI trigger করে।
  #
  # Safety (issue #1034):
  #   - LaunchDarkly kill switch (ai-auto-fix-enabled flag)
  #   - শুধু PR diff-এ থাকা ফাইলই fix হয় (scope limit)
  #   - Confidence < 80% → skip + escalate
  #   - Max 2 AI fix attempts per PR
  #   - Full test suite re-run করবে — নতুন test ভাঙলে revert
  # ---------------------------------------------------------------------------
  step5_5-ai-autofix:
    name: 🤖 Step 5.5 — AI Auto-Fix (Gemini/OpenAI)
    needs: [guard, step1_5-learning-guards, step5-pure-improvement]
    # শুধু তখনই যখন Step 5 সত্যিই fail করেছে (not cancelled, not skipped)
    # LEARNING-GUARDS: governance violation থাকলে AI auto-fix চলবে না —
    # fail-closed। AI-নির্মিত fix-ও governance guard পাস না করলে merge হবে না।
    if: >-
      ${{
        !cancelled() &&
        needs.step5-pure-improvement.result == 'failure' &&
        needs.step1_5-learning-guards.outputs.guard_status == 'pass' &&
        needs.guard.outputs.proceed == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read        # CI logs fetch করার জন্য
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.guard.outputs.pr_number }}
      HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
      BASE_SHA: ${{ needs.guard.outputs.base_sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      LAUNCHDARKLY_SDK_KEY: ${{ secrets.LAUNCHDARKLY_SDK_KEY }}
    outputs:
      ai_fix_applied: ${{ steps.apply_fix.outputs.ai_fix_applied }}
      ai_fix_attempts: ${{ steps.collect.outputs.attempts }}
      ai_fix_summary: ${{ steps.apply_fix.outputs.summary }}

    steps:
      - name: Checkout HEAD (full history for commit + push)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4e1f4b8c3c9e0 # v5.0.0
        with:
          python-version: '3.11'

      - name: Resolve AI Auto-Fix config (LaunchDarkly)
        id: ld_config
        run: |
          set -euo pipefail
          python .github/scripts/pr_helper/ai_autofix_flags.py --output-json pr-helper/ai_autofix_flags.json
          # Read outputs back
          ENABLED=$(python3 -c "import json; d=json.load(open('pr-helper/ai_autofix_flags.json')); print(str(d['enabled']).lower())")
          if [[ "$ENABLED" != "true" ]]; then
            echo "::notice::AI Auto-Fix disabled by LaunchDarkly (kill switch) — escalating to human review"
            echo "ai_fix_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=$ENABLED"

      - name: Collect CI failures (Phase 1)
        id: collect
        if: steps.ld_config.outputs.enabled != 'false'
        env:
          PR_HELPER_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -uo pipefail
          # Try fine-grained write token if available, else fall back to GITHUB_TOKEN (actions:read is enough for log fetch)
          TOKEN="${PR_HELPER_TOKEN:-$GH_TOKEN}"
          python .github/scripts/pr_helper/ci_failure_collector.py \
            --repo "$GH_REPO" \
            --pr "$PR" \
            --token "$TOKEN" \
            --output-json pr-helper/ci_failures.json
          ATTEMPTS=$(python3 -c "import json; d=json.load(open('pr-helper/ci_failures.json')); print(d['summary']['total_failures'])")
          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"
          if [[ "$ATTEMPTS" == "0" ]]; then
            echo "::notice::No CI failures collected — possibly workflow_run check conclusion differs. Skipping AI fix."
            echo "ai_fix_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AI fixes (Phase 2 — Gemini primary, OpenAI fallback)
        id: generate
        if: steps.collect.outputs.attempts != '0' && steps.ld_config.outputs.enabled != 'false'
        run: |
          set -uo pipefail
          # শুধু PR diff-এ থাকা ফাইলই fix হবে — ai_fix_generator.py ভেতরে check করে
          python .github/scripts/pr_helper/ai_fix_generator.py \
            --failures pr-helper/ci_failures.json \
            --repo . \
            --model auto \
            --max-attempts 2 \
            --confidence-threshold 0.8 \
            --output-json pr-helper/ai_fixes.json

      - name: Apply fix + push to auto-fix branch (Phase 4)
        id: apply_fix
        if: steps.generate.outputs.any_applied == 'true' && steps.ld_config.outputs.enabled != 'false'
        run: |
          set -euo pipefail
          AUTHOR="$(gh pr view "$PR" --json author -q .author.login)"
          OWNER="$(gh repo view "$GH_REPO" --json owner -q .owner.login)"
          if [[ "$AUTHOR" == "$OWNER" ]]; then
            echo "::notice::Own PR (author == owner) — AI auto-fix push skipped (SELF_APPROVAL_POLICY, GAP-02). Manual merge required."
            echo "ai_fix_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "pr-helper-ai[bot]"
          git config user.email "pr-helper-ai[bot]@users.noreply.github.com"

          # AI-modified files ইতিমধ্যে working tree-এ লেখা আছে (Phase 2)
          AI_SUMMARY=$(python3 -c "
          import json
          d=json.load(open('pr-helper/ai_fixes.json'))
          s=d['summary']
          print(f\"{s['applied']} applied, {s['skipped_low_confidence']} low-conf, {s['skipped_out_of_scope']} oos, {s['errors']} err\")
          ")
          echo "summary=$AI_SUMMARY" >> "$GITHUB_OUTPUT"

          CHANGED=$(git diff --name-only)
          if [[ -z "$CHANGED" ]]; then
            echo "::notice::AI fix did not modify any file — skipping push"
            echo "ai_fix_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # AI-পরিবর্তিত ফাইলগুলো commit + push (force-with-lease — overwrite remote branch)
          BRANCH="pr-helper/ai-autofix-pr$PR"
          git checkout -q -B "$BRANCH" "$HEAD_SHA"
          git add -A
          git commit -qm "fix(ai-auto): AI-generated fix for CI failures on PR #$PR

          Generated by SupremeAI PR Helper Step 5.5 (issue #1034).
          $AI_SUMMARY

          Closes #1034 (partial — auto-fix path)"
          git push --force-with-lease -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ai_fix_applied=true" >> "$GITHUB_OUTPUT"

          # PR comment with AI fix summary
          {
            printf '%s\n' '## 🤖 PR Helper Step 5.5 — AI Auto-Fix Applied' ''
            printf '%s\n' 'CI failure detect করে AI দিয়ে patch generate করা হয়েছে।' ''
            printf '%s\n' '| Field | Value |' '|---|---|'
            printf '| PR | #%s |\n' "$PR"
            printf '| Branch | `%s` |\n' "$BRANCH"
            printf '| Summary | %s |\n' "$AI_SUMMARY"
            printf '| Model | Gemini (primary) → OpenAI (fallback) → Mistral (tertiary) |\n'
            printf '%s\n' '' 'CI আবার চলবে — green হলে অটো-merge হবে। আরও ভাঙলে human review-এ যাবে।' ''
          } > /tmp/ai-autofix-comment.md
          gh pr comment "$PR" --body-file /tmp/ai-autofix-comment.md

      - name: Wait for CI re-run (poll for 5 min)
        id: wait_ci
        if: steps.apply_fix.outputs.ai_fix_applied == 'true' && steps.ld_config.outputs.enabled != 'false'
        run: |
          set -uo pipefail
          BRANCH="${{ steps.apply_fix.outputs.branch }}"
          echo "Polling CI status for $BRANCH ..."
          for i in $(seq 1 30); do  # 30 × 10s = 5 min
            sleep 10
            STATUS=$(gh api "repos/$GH_REPO/commits/$BRANCH/check-runs" --jq '.check_runs | length' 2>/dev/null || echo 0)
            if [[ "$STATUS" -gt 0 ]]; then
              COMPLETED=$(gh api "repos/$GH_REPO/commits/$BRANCH/check-runs" --jq '[.check_runs[] | select(.status == "completed")] | length' 2>/dev/null || echo 0)
              if [[ "$COMPLETED" -gt 0 ]]; then
                CONCLUSION=$(gh api "repos/$GH_REPO/commits/$BRANCH/check-runs" --jq '[.check_runs[] | select(.status == "completed")][0].conclusion' 2>/dev/null || echo "")
                echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
                echo "::notice::CI completed with conclusion: $CONCLUSION"
                exit 0
              fi
            fi
            echo "  poll $i: $STATUS runs, $COMPLETED completed..."
          done
          echo "::notice::CI did not complete within 5 minutes — human review needed"
          echo "conclusion=timeout" >> "$GITHUB_OUTPUT"

      - name: Merge if green, else escalate
        if: steps.apply_fix.outputs.ai_fix_applied == 'true' && steps.ld_config.outputs.enabled != 'false'
        run: |
          set -uo pipefail
          CONCLUSION="${{ steps.wait_ci.outputs.conclusion }}"
          if [[ "$CONCLUSION" == "success" ]]; then
            echo "::notice::CI green after AI fix — merging PR #$PR"
            gh pr merge "$PR" --squash --delete-branch || echo "::notice::Merge blocked — branch protection policy"
            gh pr comment "$PR" --body "## ✅ AI Auto-Fix SUCCESSFUL — merged

          CI green হওয়ার পর AI-generated fix সহ merge করা হয়েছে।" || true
          else
            echo "::notice::AI fix did not produce green CI ($CONCLUSION) — escalating to human"
            gh pr comment "$PR" --body "## ⚠️ AI Auto-Fix INCONCLUSIVE — Human Review Needed

          PR Helper Step 5.5 AI fix apply করেছে কিন্তু CI এখনো লাল ($CONCLUSION)।
          দয়া করে manual review করুন। বিস্তারিত artifact: \`pr-helper-ai-autofix\`।" || true
            gh label create "needs-human-review" --color D93F0B --description "AI auto-fix inconclusive — manual review needed" --force || true
            gh pr edit "$PR" --add-label "needs-human-review" || true
          fi

      - name: Upload AI auto-fix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: pr-helper-ai-autofix
          path: pr-helper/
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # BRANCH B → STEP 4 — Hunk-Level Isolation (cherry-pick বা auto-issue)
  # ---------------------------------------------------------------------------
  step3_5-intelligent-decision:
    name: 🧠 Step 3.5 — Intelligent Decision
    needs: [guard, step1_5-learning-guards, step3-delta]
    # LEARNING-GUARDS: governance violation থাকলে auto-fix চলবে না —
    # fail-closed; test deletion/skip re-add কখনোই cherry-pick দিয়ে "ঠিক"
    # হয় না। মানুষকে দেখে merge করতে হবে।
    if: ${{ !cancelled() && needs.step3-delta.result == 'success' && needs.step3-delta.outputs.classification == 'regression' && needs.step1_5-learning-guards.outputs.guard_status == 'pass' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all_fixable: ${{ steps.fixability.outputs.all_fixable }}
      fixable_count: ${{ steps.fixability.outputs.fixable_count }}
      genuine_regression_count: ${{ steps.fixability.outputs.genuine_regression_count }}
      intelligent_classification: ${{ steps.classify.outputs.classification }}
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.guard.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download delta artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-helper-delta
          path: pr-helper/
      - name: Extract PR intention
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          BASE_SHA: ${{ needs.guard.outputs.base_sha }}
          HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
        run: |
          set -uo pipefail
          PR_TITLE=$(gh pr view "$PR" --json title -q .title 2>/dev/null || echo '')
          PR_BODY=$(gh pr view "$PR" --json body -q .body 2>/dev/null || echo '')
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | paste -sd ',' -)
          python .github/scripts/pr_helper/intent_extractor.py --pr-title "$PR_TITLE" --pr-body "$PR_BODY" --changed-files "$CHANGED" --output-json pr-helper/intention.json
      - name: Score fixability
        id: fixability
        env:
          BASE_SHA: ${{ needs.guard.outputs.base_sha }}
          HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
          PR: ${{ needs.guard.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | paste -sd ',' -)
          PR_TITLE=$(gh pr view "$PR" --json title -q .title 2>/dev/null || echo '')
          python .github/scripts/pr_helper/fixability_scorer.py --delta pr-helper/delta.json --intention pr-helper/intention.json --changed-files "$CHANGED" --pr-title "$PR_TITLE" --output-json pr-helper/recommendations.json
      - name: Generate auto-fixes
        id: autofix
        env:
          BASE_SHA: ${{ needs.guard.outputs.base_sha }}
          HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
        run: |
          set -uo pipefail
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | paste -sd ',' -)
          python .github/scripts/pr_helper/auto_fix_engine.py --recommendations pr-helper/recommendations.json --delta pr-helper/delta.json --repo . --head-sha "$HEAD_SHA" --changed-files "$CHANGED" --output-json pr-helper/auto_fix.json
      - name: Classify final
        id: classify
        run: |
          set -uo pipefail
          ALL_FIXABLE="${{ steps.fixability.outputs.all_fixable }}"
          GENUINE="${{ steps.fixability.outputs.genuine_regression_count }}"
          if [[ "$ALL_FIXABLE" == "true" ]]; then
            echo "classification=pure-improvement-with-autofix" >> "$GITHUB_OUTPUT"
            echo "::notice::All failures auto-fixable — reclassified as pure-improvement"
          elif [[ "$GENUINE" -gt 0 ]]; then
            echo "classification=regression" >> "$GITHUB_OUTPUT"
            echo "::notice::$GENUINE genuine regression(s) — Step 4 isolation"
          else
            echo "classification=needs-human-review" >> "$GITHUB_OUTPUT"
            echo "::notice::Ambiguous failures — human review needed"
          fi
      - name: Upload intelligent decision artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-helper-intelligent-decision
          path: pr-helper/
          retention-days: 14
          if-no-files-found: warn

  step4-isolation:
    name: 🔪 Step 4 — Hunk-Level Isolation
    needs: [guard, step3-delta]
    if: >-
      ${{
        !cancelled() &&
        needs.step3-delta.result == 'success' &&
        needs.step3-delta.outputs.classification == 'regression'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.guard.outputs.pr_number }}
      HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
      BASE_SHA: ${{ needs.guard.outputs.base_sha }}
    steps:
      - name: Checkout base (scripts + full history for patch construction)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download delta artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-helper-delta
          path: pr-helper/

      - name: Run hunk-level isolation
        id: iso
        run: |
          set -euo pipefail
          python .github/scripts/pr_helper/hunk_isolation.py \
            --delta pr-helper/delta.json \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --repo-root . \
            --patch-out pr-helper/clean.patch \
            --output-json pr-helper/isolation.json

      # ----- Branch B1: isolatable → Cherry-pick Improvements -----
      - name: B1 — Push clean-patch branch + comment excluded diff
        id: cherry
        if: steps.iso.outputs.isolatable == 'true'
        run: |
          set -euo pipefail
          BRANCH="pr-helper/clean-pr$PR"
          BROKEN="${{ steps.iso.outputs.broken_files }}"
          CLEAN="${{ steps.iso.outputs.clean_files }}"
          NEW_COUNT="${{ needs.step3-delta.outputs.new_count }}"

          git config user.name "pr-helper[bot]"
          git config user.email "pr-helper[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH" "$BASE_SHA"
          git apply --whitespace=nowarn pr-helper/clean.patch
          git add -A
          git commit -qm "pr-helper: clean cherry-pick of PR #$PR (regression hunks excluded)

          Isolated (excluded) files: $BROKEN
          বাংলা: ভাঙা হাংকগুলো বাদ দিয়ে শুধু ভালো পরিবর্তনগুলো রাখা হয়েছে।"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # বাদ দেওয়া (ভাঙা) ফাইলগুলোর diff — comment-এ দেখানো হবে
          BROKEN_PATHS="$(echo "$BROKEN" | tr ',' ' ')"
          git diff "$BASE_SHA...$HEAD_SHA" -- $BROKEN_PATHS > pr-helper/excluded.diff || true

          # printf-নির্মিত body — heredoc/backtick shell-expansion বিপদমুক্ত
          {
            printf '%s\n' '## 🔪 PR Helper — Step 4: Hunk-Level Isolation' ''
            printf '%s\n' 'নতুন regression ধরা পড়েছে, কিন্তু এটি নির্দিষ্ট ফাইলে **isolate** করা গেছে।' ''
            printf '%s\n' '| Signal | Result |' '|---|---|'
            printf '| 🛑 New failures | **%s** |\n' "$NEW_COUNT"
            printf '| 🚫 Isolated (breaking) files | `%s` |\n' "$BROKEN"
            printf '| 🟢 Salvageable (clean) files | `%s` |\n' "$CLEAN"
            printf '| 🌿 Clean patch branch | **`%s`** |\n' "$BRANCH"
            if [[ -s pr-helper/excluded.diff ]]; then
              printf '%s\n' '' '### 🚫 Excluded (breaking) diff' '' '```diff'
              head -c 6000 pr-helper/excluded.diff
              printf '%s\n' '' '```' ''
            fi
            printf '%s\n' 'ক্লিন প্যাচে শুধু ভাঙা হাংক বাদ দিয়ে বাকি ইমপ্রুভমেন্ট আছে — চাইলে PR branch rewrite করে নিতে পারেন, নয়তো এই ব্রাঞ্চটাই রিভিউ করুন। পূর্ণ লগ: artifact "pr-helper-diag-head"।' ''
          } > /tmp/pr-helper-b1.md
          gh pr comment "$PR" --body-file /tmp/pr-helper-b1.md

          gh label create "pr-helper:isolated" --color fbca04 --description "PR Helper: regression isolated, clean patch available" --force
          gh pr edit "$PR" --add-label "pr-helper:isolated" || true

      # ----- Branch B2: fatal → Auto Issue + Block -----
      - name: B2 — Create blocking issue with logs
        id: b2issue
        if: steps.iso.outputs.isolatable != 'true'
        run: |
          set -euo pipefail
          PR_TITLE="$(gh pr view "$PR" --json title -q .title)"
          AUTHOR="${{ github.event.pull_request.user.login || 'author' }}"
          RUN_ID="${{ github.run_id }}"

          # delta.json থেকে failure snippet — প্রথম ৩টা (python ফাইল লেখে, shell-safe)
          python - <<'PY'
          import json
          delta = json.load(open("pr-helper/delta.json", encoding="utf-8"))
          failures = delta.get("new_failures", [])[:3]
          blocks = []
          for f in failures:
              snippet = (f.get("snippet") or f.get("message") or "no snippet")[-1200:]
              blocks.append(f"### `{f['id']}` ({f.get('kind','failure')})\n```\n{snippet}\n```")
          open("/tmp/pr-helper-failures.md", "w", encoding="utf-8").write("\n\n".join(blocks) or "_(no snippet data)_")
          PY

          {
            printf '%s\n' 'State-based Locking Lifecycle-এর Branch B (fatal) ট্রিগার হয়েছে — নতুন regression **isolate করা যায়নি**, তাই PR merge ব্লক করা হয়েছে।' ''
            printf '%s\n' '| Field | Value |' '|---|---|'
            printf '| PR | #%s — %s |\n' "$PR" "$PR_TITLE"
            printf '| Author | @%s |\n' "$AUTHOR"
            printf '| 🛑 New failures | %s |\n' '${{ needs.step3-delta.outputs.new_count }}'
            printf '| 🟡 Pre-existing (tolerated) | %s |\n' '${{ needs.step3-delta.outputs.pre_existing_count }}'
            printf '| Isolation reason | %s |\n' '${{ steps.iso.outputs.reason }}'
            printf '\n%s\n' '---'
            cat /tmp/pr-helper-failures.md
            printf '\n%s\n%s\n' '---' 'পূর্ণ ডায়াগনস্টিক লগ: Actions run '"$RUN_ID"' → artifact "pr-helper-diag-head", "pr-helper-delta", "pr-helper-isolation"।'
            printf '\n%s\n' '@'"$AUTHOR"' — দয়া করে regression ঠিক করুন। ঠিক হলে PR-এর পরবর্তী helper রান pure-improvement দিলে এই issue বন্ধ করে দেবে।'
          } > /tmp/pr-helper-issue.md

          ISSUE_URL="$(gh issue create \
            --title "🛑 PR Helper: regression blocking PR #$PR — $PR_TITLE" \
            --body-file /tmp/pr-helper-issue.md)"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - name: B2 — Request changes + tag author + label (block)
        if: steps.iso.outputs.isolatable != 'true'
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          ISSUE_URL="${{ steps.b2issue.outputs.issue_url }}"
          {
            printf '%s\n' '🛑 **PR Helper: নতুন regression পাওয়া গেছে এবং isolate করা যায়নি** — merge ব্লক করা হয়েছে।' ''
            printf '%s\n' '- 🛑 New failures: **'"${{ needs.step3-delta.outputs.new_count }}"'**'
            printf '%s\n' '- Reason: '"${{ steps.iso.outputs.reason }}"
            printf '%s\n' '- বিস্তারিত issue: '"$ISSUE_URL"
            printf '%s\n' '- পূর্ণ লগ: run '"$RUN_ID"' artifacts'
          } > /tmp/pr-helper-review.md
          gh pr review "$PR" --request-changes --body-file /tmp/pr-helper-review.md \
            || echo "::notice::Request-changes skipped (own PR) — issue + label ই ব্লক সিগনাল।"
          gh label create "pr-helper:blocked" --color d93f0b --description "PR Helper: un-isolatable regression" --force
          gh pr edit "$PR" --add-label "pr-helper:blocked" || true

      - name: Upload isolation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-helper-isolation
          path: pr-helper/
          retention-days: 14
          if-no-files-found: warn
