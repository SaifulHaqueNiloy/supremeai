.github/workflows/supreme-core-ci.yml-এ ৩টা real fix:

deploy-admin-firebase বিল্ডে এখন VITE_API_URL/VITE_API_BASE = admin backend URL — আগে এটা না থাকায় admin panel ভুল করে user-role ব্যাকএন্ডে fallback করত, যেখানে admin-এর CORS origin allow করা নেই। এটাই ছিল আপনার "hosting connect হচ্ছে না" সমস্যার আসল কারণ।
