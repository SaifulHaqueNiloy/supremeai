# Reusable workflow: Production Deploy (Render + Cloudflare + DB Schema Check + Notify)
# Called by ci.yml after Docker images are published.
name: Production Deploy

on:
  workflow_call:
    inputs:
      deploy-scraper:
        description: 'Whether to deploy the scraper service (scraper changed)'
        required: true
        type: boolean
      deploy-mcp:
        description: 'Whether to deploy MCP Control Tower (infra changed)'
        required: true
        type: boolean
      deploy-cloudflare:
        description: 'Whether to deploy Cloudflare Worker (infra changed)'
        required: true
        type: boolean
    secrets:
      INFISICAL_CLIENT_ID:
        required: false
      INFISICAL_CLIENT_SECRET:
        required: false
      INFISICAL_PROJECT_SLUG:
        required: false
      RENDER_API_KEY:
        required: false
      RENDER_API_KEY_2:
        required: false
      RENDER_API_KEY_3:
        required: false
      RENDER_API_KEY_4:
        required: false
      RENDER_API_KEY_BACKUP:
        required: false
      RENDER_BACKUP_API_KEY_2:
        required: false
      RENDER_PRIMARY_SVC_ID:
        required: false
      RENDER_WORKER_SVC_ID:
        required: false
      RENDER_BACKUP_SVC_ID:
        required: false
      RENDER_SCRAPER_SVC_ID:
        required: false
      RENDER_MCP_SVC_ID:
        required: false
      RENDER_CORE_URL:
        required: false
      RENDER_WORKER_URL:
        required: false
      RENDER_SCRAPER_URL:
        required: false
      RENDER_MCP_URL:
        required: false
      DB_SCHEMA_CHECK_URL:
        required: false
      SUPABASE_DATABASE_URL_POOLER:
        required: false
      # Issue #517: writer endpoint for the live alembic migration gate.
      # Declared explicitly for contract visibility. Kept required:false for now
      # (the secret is NOT yet set in the repo — required:true would hard-block
      # the whole workflow_call at queue time, incl. PR CI, with no in-repo
      # opt-out). The gate below ENFORCES by default instead: missing writer
      # fails the migration-gate job (loud, ::error::) unless the owner
      # explicitly sets MIGRATION_GATE_ENFORCE=false. Flip this to
      # required:true once the owner sets the secret (MANUAL_STEPS 7.9).
      SUPABASE_DATABASE_URL_WRITER:
        required: false
      DATABASE_URL:
        required: false
      SUPABASE_URL:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_WORKER_URL:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  migration-gate:
    name: 🛡️ Migration Gate (alembic, fail-fast — issue #478)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    outputs:
      live_migration: ${{ steps.decide.outputs.live }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Issue #707 deploy-gate fix: the gate previously decided purely on the
      # SUPABASE_DATABASE_URL_WRITER *GitHub* secret, which is not set at repo
      # level — while the Infisical prod vault DOES provide it. The caller
      # (ci.yml) also never passed any secrets into this reusable workflow.
      # Fetch the single key (per-key injection, NOT the whole vault) BEFORE
      # the decision so the vault-provided value feeds the gate. This step is
      # intentionally NOT continue-on-error: it is the loud vault-health
      # monitor for the whole deploy pipeline (precise auth/404 error from the
      # action). If the key is genuinely absent everywhere, the decision step
      # falls back to the GitHub secret and the enforcing report step below
      # still fails the job loudly.
      - name: Import SUPABASE_DATABASE_URL_WRITER from Infisical (gate, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "SUPABASE_DATABASE_URL_WRITER"
          export-type: "env"

      - name: Decide gate mode
        id: decide
        # Issue #707: secret moved out of run: interpolation into a masked env
        # var (GitHub masks registered/exported secrets in logs).
        env:
          SUPABASE_DATABASE_URL_WRITER: ${{ env.SUPABASE_DATABASE_URL_WRITER || secrets.SUPABASE_DATABASE_URL_WRITER }}
        run: |
          if [ -n "$SUPABASE_DATABASE_URL_WRITER" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "Writer endpoint configured — live alembic upgrade will run."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "Writer endpoint NOT configured — offline chain verification only."
          fi

      - name: Prepare backend environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'
          install-browser-deps: 'false'
          mode: prepare

      - name: Offline migration-chain verification (always)
        # বাংলা: অফলাইন মোড কোনো DB-তে কানেক্ট করে না — পুরো মাইগ্রেশন
        # চেইন লোড/কম্পাইল হয় কিনা তা প্রমাণ করে (broken-chain = deploy ব্লক)।
        working-directory: ./backend
        env:
          SUPABASE_DATABASE_URL_WRITER: postgresql://offline-placeholder:offline@localhost:5432/offline
          TESTING: '1'
        run: poetry run alembic upgrade head --sql > /tmp/migration_plan.sql && echo "### 🛡️ Migration Gate — offline chain OK" >> "$GITHUB_STEP_SUMMARY" && grep -c "^" /tmp/migration_plan.sql | xargs -I{} echo "- {} SQL statements generated from the migration chain" >> "$GITHUB_STEP_SUMMARY"

      - name: Live alembic upgrade head (writer endpoint)
        if: steps.decide.outputs.live == 'true'
        working-directory: ./backend
        env:
          # Issue #707: prefer the Infisical-fetched value (exported to
          # GITHUB_ENV above), fall back to the GitHub secret.
          SUPABASE_DATABASE_URL_WRITER: ${{ env.SUPABASE_DATABASE_URL_WRITER || secrets.SUPABASE_DATABASE_URL_WRITER }}
          TESTING: '1'
        run: poetry run alembic upgrade head

      - name: Report unconfigured writer (enforcing by default — issue #517)
        if: steps.decide.outputs.live != 'true'
        run: |
          ENFORCE="${{ vars.MIGRATION_GATE_ENFORCE }}"
          # Issue #517: enforcement is ON by default; only an explicit
          # MIGRATION_GATE_ENFORCE=false opts out (loud, non-silent).
          ENFORCE="${ENFORCE:-true}"
          echo "### 🛡️ Migration Gate — SUPABASE_DATABASE_URL_WRITER not configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live migration execution is **skipped**; offline chain verification passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Owner action: set secret SUPABASE_DATABASE_URL_WRITER (MANUAL_STEPS 7.9) — the gate then upgrades the schema BEFORE any deploy ships traffic." >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENFORCE" != "true" ]; then
            echo "- Enforcement explicitly disabled (MIGRATION_GATE_ENFORCE=false) — deploy proceeds WITHOUT live schema migration." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Migration gate: SUPABASE_DATABASE_URL_WRITER not configured — live alembic upgrade skipped (explicit opt-out MIGRATION_GATE_ENFORCE=false, issue #517)."
            exit 0
          fi
          echo "- Enforcement: on (default). Set repo variable MIGRATION_GATE_ENFORCE=false to explicitly opt out." >> "$GITHUB_STEP_SUMMARY"
          echo "- MIGRATION_GATE_ENFORCE defaults to true and the writer secret is missing — failing per enforcement policy." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Migration gate: SUPABASE_DATABASE_URL_WRITER is not configured — live alembic upgrade cannot run (issue #517). Set the secret (MANUAL_STEPS 7.9) or explicitly set repo variable MIGRATION_GATE_ENFORCE=false to opt out."
          exit 1

  deploy-core:
    name: 🚀 Deploy Core
    needs: [migration-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    concurrency:
      group: render-core
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Issue #707 (secret scoping): this job consumes exactly three vault
      # keys — the render-deploy inputs below. Per-key `secret-name` fetches
      # replace the previous whole-vault `secret-path: "/"` injection, so the
      # job no longer receives the entire prod vault (~174 secrets).
      # `continue-on-error` preserves the old fall-through semantics: a key
      # absent from the vault keeps the `env.X || secrets.X` GitHub-secret
      # fallbacks below live (all are set at repo level). Vault/auth health is
      # enforced loudly by the migration-gate job's hard fetch above.
      - name: Import RENDER_API_KEY from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY"
          export-type: "env"

      - name: Import RENDER_PRIMARY_SVC_ID from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_PRIMARY_SVC_ID"
          export-type: "env"

      - name: Import RENDER_CORE_URL from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_CORE_URL"
          export-type: "env"

      - name: Deploy Core to Render
        uses: ./.github/actions/render-deploy
        with:
          service-name: "Core"
          api-key: ${{ env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          service-id: ${{ env.RENDER_PRIMARY_SVC_ID || secrets.RENDER_PRIMARY_SVC_ID }}
          service-url: ${{ env.RENDER_CORE_URL || secrets.RENDER_CORE_URL }}

  deploy-worker:
    name: 🚀 Deploy Worker
    needs: [migration-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    concurrency:
      group: render-worker
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Issue #707 (secret scoping): per-key fetches replace the whole-vault
      # injection. Consumed keys (render-deploy inputs): RENDER_API_KEY_2 →
      # RENDER_API_KEY_BACKUP → RENDER_API_KEY (api-key chain),
      # RENDER_WORKER_SVC_ID → RENDER_BACKUP_SVC_ID (service-id chain),
      # RENDER_WORKER_URL. All are optional in their fallback chains, so every
      # fetch is continue-on-error and absence keeps the GitHub-secret
      # fallbacks (and downstream skip logic in render_trigger_deploy.py)
      # intact — identical behavior to the old whole-vault fetch.
      - name: Import RENDER_API_KEY_2 from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY_2"
          export-type: "env"

      - name: Import RENDER_API_KEY_BACKUP from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY_BACKUP"
          export-type: "env"

      - name: Import RENDER_API_KEY from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY"
          export-type: "env"

      - name: Import RENDER_WORKER_SVC_ID from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_WORKER_SVC_ID"
          export-type: "env"

      - name: Import RENDER_BACKUP_SVC_ID from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_BACKUP_SVC_ID"
          export-type: "env"

      - name: Import RENDER_WORKER_URL from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_WORKER_URL"
          export-type: "env"

      - name: Deploy Worker to Render
        uses: ./.github/actions/render-deploy
        with:
          service-name: "Worker"
          api-key: ${{ env.RENDER_API_KEY_2 || secrets.RENDER_API_KEY_2 || env.RENDER_API_KEY_BACKUP || secrets.RENDER_API_KEY_BACKUP || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          service-id: ${{ env.RENDER_WORKER_SVC_ID || secrets.RENDER_WORKER_SVC_ID || env.RENDER_BACKUP_SVC_ID || secrets.RENDER_BACKUP_SVC_ID }}
          service-url: ${{ env.RENDER_WORKER_URL || secrets.RENDER_WORKER_URL }}

  deploy-scraper:
    name: 🚀 Deploy Scraper
    needs: [migration-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && inputs.deploy-scraper
    environment:
      name: production
    concurrency:
      group: render-scraper
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Issue #707 (secret scoping): per-key fetches replace the whole-vault
      # injection. Consumed keys (render-deploy inputs): RENDER_API_KEY_3 →
      # RENDER_BACKUP_API_KEY_2 → RENDER_API_KEY (api-key chain),
      # RENDER_SCRAPER_SVC_ID, RENDER_SCRAPER_URL. Chain keys are
      # continue-on-error (absence → GitHub-secret fallback / downstream skip
      # logic) — identical behavior to the old whole-vault fetch.
      - name: Import RENDER_API_KEY_3 from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY_3"
          export-type: "env"

      - name: Import RENDER_BACKUP_API_KEY_2 from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_BACKUP_API_KEY_2"
          export-type: "env"

      - name: Import RENDER_API_KEY from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY"
          export-type: "env"

      - name: Import RENDER_SCRAPER_SVC_ID from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_SCRAPER_SVC_ID"
          export-type: "env"

      - name: Import RENDER_SCRAPER_URL from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_SCRAPER_URL"
          export-type: "env"

      - name: Deploy Scraper to Render
        uses: ./.github/actions/render-deploy
        with:
          service-name: "Scraper"
          api-key: ${{ env.RENDER_API_KEY_3 || secrets.RENDER_API_KEY_3 || env.RENDER_BACKUP_API_KEY_2 || secrets.RENDER_BACKUP_API_KEY_2 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          service-id: ${{ env.RENDER_SCRAPER_SVC_ID || secrets.RENDER_SCRAPER_SVC_ID }}
          service-url: ${{ env.RENDER_SCRAPER_URL || secrets.RENDER_SCRAPER_URL }}

  deploy-mcp:
    name: 🚀 Deploy MCP Control Tower
    needs: [migration-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && inputs.deploy-mcp
    environment:
      name: production
    concurrency:
      group: render-mcp
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Issue #707 (secret scoping): per-key fetches replace the whole-vault
      # injection. Consumed keys (render-deploy inputs): RENDER_API_KEY_4 →
      # RENDER_API_KEY (api-key chain), RENDER_MCP_SVC_ID, RENDER_MCP_URL.
      # All continue-on-error: absence keeps the GitHub-secret fallbacks live
      # — identical behavior to the old whole-vault fetch.
      - name: Import RENDER_API_KEY_4 from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY_4"
          export-type: "env"

      - name: Import RENDER_API_KEY from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_API_KEY"
          export-type: "env"

      - name: Import RENDER_MCP_SVC_ID from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_MCP_SVC_ID"
          export-type: "env"

      - name: Import RENDER_MCP_URL from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "RENDER_MCP_URL"
          export-type: "env"

      - name: Deploy MCP to Render
        uses: ./.github/actions/render-deploy
        with:
          service-name: "MCP Control Tower"
          api-key: ${{ env.RENDER_API_KEY_4 || secrets.RENDER_API_KEY_4 || env.RENDER_API_KEY || secrets.RENDER_API_KEY }}
          service-id: ${{ env.RENDER_MCP_SVC_ID || secrets.RENDER_MCP_SVC_ID }}
          service-url: ${{ env.RENDER_MCP_URL || secrets.RENDER_MCP_URL }}

  db-schema-check:
    name: 🗄️ DB Schema Contract Check
    needs: [deploy-core]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install checker dependencies
        run: pip install --no-cache-dir --disable-pip-version-check psycopg2-binary pyyaml

      - name: Check live production database against schema contract
        env:
          DB_SCHEMA_CHECK_URL: ${{ secrets.DB_SCHEMA_CHECK_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL_POOLER || secrets.DATABASE_URL }}
        run: python scripts/ci/check_database_schema.py

      - name: Add Supabase Studio link to summary
        if: success()
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "### 🗄️ Database Schema Verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Contract matches production" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SUPABASE_PROJECT_URL" ]; then
            PROJECT_REF=$(echo "$SUPABASE_PROJECT_URL" | sed -E 's#https://([a-zA-Z0-9-]+)\.supabase\.co.*#\1#')
            echo "- Supabase Studio: [Open Dashboard](https://supabase.com/dashboard/project/${PROJECT_REF})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Supabase Studio: SUPABASE_URL secret not set — cannot build dashboard link." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Surface failure clearly
        if: failure()
        run: echo "::error::Production database does not match schema_contract.yaml — see step summary for exact diff. Fix via an Alembic migration, then update the contract file."

  deploy-cloudflare-worker:
    name: ⚡ Deploy Cloudflare Worker
    needs: [migration-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && inputs.deploy-cloudflare
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Wrangler
        # Issue #707: pin the global tool install (unpinned = supply-chain
        # risk). No repo-internal wrangler pin existed; pinned to the current
        # stable v4 line.
        run: npm install -g wrangler@4.135.0

      # Issue #707 (secret scoping): per-key fetches replace the whole-vault
      # injection. Consumed keys: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
      # (loud emptiness gate in the Deploy Worker step below),
      # CLOUDFLARE_WORKER_URL. All continue-on-error: absence keeps the
      # GitHub-secret fallbacks and the explicit ::error:: gate intact.
      - name: Import CLOUDFLARE_API_TOKEN from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "CLOUDFLARE_API_TOKEN"
          export-type: "env"

      - name: Import CLOUDFLARE_ACCOUNT_ID from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "CLOUDFLARE_ACCOUNT_ID"
          export-type: "env"

      - name: Import CLOUDFLARE_WORKER_URL from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "CLOUDFLARE_WORKER_URL"
          export-type: "env"

      - name: Import CLOUDFLARE_WORKERS_SUBDOMAIN from Infisical (scoped, issue #794)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "CLOUDFLARE_WORKERS_SUBDOMAIN"
          export-type: "env"

      - name: Verify Cloudflare Secrets Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/ci/check_required_secrets.py post_check_cloudflare

      - name: Deploy Worker
        working-directory: infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_URL: ${{ env.CLOUDFLARE_WORKER_URL || secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ env.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Worker deploy blocked: required production credentials are missing"
            exit 1
          fi
          if [ -f "package.json" ]; then
            echo "Found package.json, installing dependencies from lockfile..."
            npm ci
          fi
          wrangler deploy > wrangler_output.txt 2>&1
          cat wrangler_output.txt
          CF_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler_output.txt | head -n 1 || echo "")
          if [ -z "$CF_URL" ] && [ -n "$CLOUDFLARE_WORKER_URL" ]; then
            CF_URL="$CLOUDFLARE_WORKER_URL"
          fi
          if [ -z "$CF_URL" ] && [ -n "$CLOUDFLARE_WORKERS_SUBDOMAIN" ]; then
            CF_URL="https://supremeai-worker.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev"
          fi
          echo "### ⚡ Cloudflare Worker Deployed" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CF_URL" ]; then
            echo "Worker URL: [$CF_URL]($CF_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Worker deployed, check logs for exact URL (set CLOUDFLARE_WORKER_URL secret for custom domains)." >> $GITHUB_STEP_SUMMARY
          fi

  notify-failure:
    name: 🚨 Notify on Failure
    needs: [deploy-core, deploy-worker, deploy-scraper, deploy-mcp, deploy-cloudflare-worker]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Issue #707 (secret scoping): only SLACK_WEBHOOK_URL is consumed in
      # this job — fetch that single key instead of the whole vault.
      # continue-on-error is kept: absence keeps the skip-notification path
      # below working exactly as before.
      - name: Import SLACK_WEBHOOK_URL from Infisical (scoped, issue #707)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/"
          secret-name: "SLACK_WEBHOOK_URL"
          export-type: "env"

      - name: Check Slack webhook configured
        id: slack_check
        # Issue #707: secret moved out of run: interpolation into a masked
        # env var (GitHub masks registered/exported secrets in logs).
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Slack notification - SLACK_WEBHOOK_URL not set"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: steps.slack_check.outputs.configured == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v1.25.0
        continue-on-error: true
        with:
          payload: |
            {
              "text": "🚨 Deployment Failed",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Deployment Failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
