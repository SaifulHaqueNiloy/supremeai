name: Constitution Governance

on:
  workflow_call:
  pull_request:
    paths:
      - '.github/constitution/**'
      - '.github/scripts/constitution/**'
      - 'scripts/ci/validate_constitution_governance.py'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: supremeai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate constitution governance
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate exceptions and expiry
        run: python scripts/ci/validate_constitution_governance.py
      - name: Run constitution unit tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts/constitution/tests -v
