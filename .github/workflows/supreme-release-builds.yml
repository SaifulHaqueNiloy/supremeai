name: 📦 SupremeAI Release Builder

on:
  push:
    tags: ['v*'] # শুধুমাত্র v1.0.0, v2.1.0 ইত্যাদি ট্যাগ পুশ করলে
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FLUTTER_VERSION: '3.29.0'

jobs:
  build-artifacts:
    name: 🏗️ Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'APK'
            os: ubuntu-latest
          - target: 'VSIX'
            os: ubuntu-latest
          - target: 'EXE'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # ----------------------------------------------------
      # 📱 1. FLUTTER APK BUILD (Android Arm64)
      # ----------------------------------------------------
      - name: Setup Flutter
        if: matrix.target == 'APK'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle & Pub Packages
        if: matrix.target == 'APK'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Build APK (Arm64 for Latest Devices)
        if: matrix.target == 'APK'
        working-directory: apps/mobile
        run: |
          flutter pub get
          # বাংলা মন্তব্য: এএবি ফাইলের বদলে সরাসরি এপিকে ফাইল বিল্ড করা হচ্ছে যা লেটেস্ট আর্কিটেকচার (arm64-v8a) সাপোর্ট করবে এবং সাইজও অপটিমাইজড থাকবে।
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        if: matrix.target == 'APK'
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-mobile-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      # ----------------------------------------------------
      # 🧩 2. VS CODE EXTENSION BUILD (VSIX)
      # ----------------------------------------------------
      - name: Setup Node & PNPM
        if: matrix.target == 'VSIX' || matrix.target == 'EXE'
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - name: Setup Node caching
        if: matrix.target == 'VSIX' || matrix.target == 'EXE'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Build VSIX
        if: matrix.target == 'VSIX'
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=supremeai-vscode
          cd tools/vscode-extension
          npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX Artifact
        if: matrix.target == 'VSIX'
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-vscode-vsix
          path: tools/vscode-extension/*.vsix
          retention-days: 7

      # ----------------------------------------------------
      # 🪟 3. WINDOWS EXE BUILD (Electron)
      # ----------------------------------------------------
      - name: Build Windows EXE
        if: matrix.target == 'EXE'
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm turbo run build --filter=supremeai-studio-client
          cd apps/studio-client
          pnpm exec electron-builder --publish=never --config.compression=store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE Artifact
        if: matrix.target == 'EXE'
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-studio-windows-exe
          path: apps/studio-client/release/*.exe
          compression-level: 0
          retention-days: 7

  # ----------------------------------------------------
  # 🚀 CREATE GITHUB RELEASE
  # ----------------------------------------------------
  create-release:
    name: 🎉 Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v-manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          files: release-artifacts/**/*
          generate_release_notes: true

  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-artifacts
      - create-release
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'
      - name: 🧠 Generate Smart Pipeline Summary (API Key Free)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_smart_summary.py
      - name: 🚨 Generate Detailed Error Report (Bangla Diagnosis)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_error_report.py
