# SupremeAI - Manual Maintenance & Auto-Fixing Pipeline
# বাংলা মন্তব্য: এই পাইপলাইনটি ম্যানুয়ালি ট্রিগার করা যাবে এবং বিভিন্ন রক্ষণাবেক্ষণ কাজ চালানো যাবে। (সংস্করণ ৩.০)

name: "🤖 Manual Maintenance & Auto-Fix"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # বাংলা মন্তব্য: প্রতিদিন রাত ১টায় (UTC) স্বয়ংক্রিয়ভাবে Smart Summary চালাবে (auto-fix 01:30-এর সাথে collide এড়ানো)
  # PR trigger যোগ করা হয়েছে — auto-fix.yml-এর মতো auto-lint-fix স্বয়ংক্রিয়ভাবে PR-এ চালু হবে।
  schedule:
    - cron: '0 1 * * *'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_ci_failure_summary:
        description: '🧠 Smart CI Failure Summary (Core CI-এর ব্যর্থতা বিশ্লেষণ)'
        type: boolean
        default: true
      run_health_check:
        description: '🩺 Run Health Check'
        type: boolean
        default: false
      run_auto_lint_fix:
        description: '🔧 Run Auto Lint Fix (PR তৈরি করবে)'
        type: boolean
        default: false
      run_auto_dependency_upgrade:
        description: '📦 Run Auto Dependency Upgrade (PR তৈরি করবে)'
        type: boolean
        default: false
      run_dependency_scan:
        description: '🔍 Run Dependency Vulnerability Scan'
        type: boolean
        default: false
      run_outdated_report:
        description: '📦 Run Outdated Dependency Report'
        type: boolean
        default: false
      run_changelog_generator:
        description: '📝 Generate Changelog (PR তৈরি করবে)'
        type: boolean
        default: false
      run_cache_purge:
        description: '🗑️ Purge Redis Cache (Upstash)'
        type: boolean
        default: false
      run_generate_docs:
        description: '📚 Generate & Deploy Docs'
        type: boolean
        default: false
      run_mlops_nightly_eval:
        description: '🧠 Run MLOps Nightly Evolution & Governance (Drift, Bias, Injection)'
        type: boolean
        default: true
      run_generate_modular_audits:
        description: '📝 Generate 6 Modular Audit Markdowns (PR)'
        type: boolean
        default: false
      run_performance_e2e:
        description: '🧪 Run Performance E2E (Playwright)'
        type: boolean
        default: false
      run_clean_old_runs:
        description: '🧹 Clean Old Workflow Runs (Keep 20 Failed, 200 Passed)'
        type: boolean
        default: true
      run_performance_check:
        description: '📊 Run Performance Check (PerformanceGuardian)'
        type: boolean
        default: false
      run_churn_analysis:
        description: '📈 Run Churn Analysis (ChurnProphet)'
        type: boolean
        default: false
      run_vulnerability_scan:
        description: '🔍 Run Vulnerability Prophet Scan'
        type: boolean
        default: false
      run_safety_scan:
        description: '🛡️ Run Safety Vulnerability Scan'
        type: boolean
        default: false
      run_cache_janitor:
        description: '🧹 Run Cache Janitor (TTL + 8GB cap eviction)'
        type: boolean
        default: false
      run_workflow_janitor:
        description: '🧹 Run Workflow Janitor (clean old runs)'
        type: boolean
        default: false
      run_self_audit:
        description: '🔍 Run Self-Audit Scan (offline code quality)'
        type: boolean
        default: false
      run_security_audit:
        description: '🔒 Run Security Audit (dep scan + gitleaks)'
        type: boolean
        default: false
      run_dast_scan:
        description: '🔐 Run OWASP ZAP DAST Scan'
        type: boolean
        default: false

# বাংলা মন্তব্য: প্রতিটি টাস্ককে আলাদা জব-এ ভাগ করা হয়েছে স্বচ্ছতা এবং নির্ভরযোগ্যতার জন্য.

# বাংলা মন্তব্য: NODE_VERSION এবং PYTHON_VERSION এখানে define করা হয়েছে কারণ এটি
# maintenance pipeline-এর নিজস্ব env scope। supreme-core-ci থেকে inherit হয় না।
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'

jobs:
  # বাংলা মন্তব্য: gatekeeper জব সবার আগে রান হয়।
  # ২৪ ঘণ্টার মধ্যে আগে রান হলে should_run=false সেট করে বাকি সব জব গ্রেসফুলি স্কিপ করায়।
  gatekeeper:
    name: "🚦 Check 24h Gap"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_gap.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Gap Check
        id: check_gap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/enforce_24h_gap.py

  # বাংলা মন্তব্য: সাসপেন্ডেড ডেড অ্যাডমিন URL (supremeai-admin.onrender.com) কোনো অ্যাক্টিভ কোড/কনফিগে আছে কি না তা স্ক্যান করে।
  env-drift-check:
    name: "🔍 Env Drift Check (dead admin URL scan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan for dead admin URL references
        run: |
          echo "Scanning for lingering supremeai-admin.onrender.com references in active code/config..."
          matches=$(grep -rln \
            --exclude-dir=_archive --exclude-dir=docs --exclude-dir=node_modules --exclude-dir=.git \
            --exclude=CHECKPOINT.md --exclude=LESSONS_LEARNED.md --exclude=REAL_TESTING_LOG.md --exclude=FEATURE_TRACKING_LOG.md \
            -e 'supremeai-admin\.onrender\.com' . 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Found lingering dead admin URL references in active files:"
            echo "$matches"
            exit 1
          fi
          echo "✅ No dead admin URL references found in active code/config."

  # এই জবটি শুধুমাত্র একবার রান হবে এবং সব downstream জব এটি ব্যবহার করবে।
  setup:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      requirements-cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "🔑 Generate Cache Key"
        id: cache-key
        run: echo "key=py-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}" >> $GITHUB_OUTPUT

      - name: Setup Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          plugins: poetry-plugin-export

      - name: "♻️ Cache pip dependencies"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: "⚙️ Install Dependencies"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          poetry export --with dev --without ml --format requirements.txt --output requirements.txt
          pip install --no-cache-dir --disable-pip-version-check -r requirements.txt
          pip install black isort pip-audit ruff

  health-check:
    needs: setup
    if: github.event.inputs.run_health_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "🩺 Run Health Check"
        working-directory: backend
        run: |
          poetry run python -m tools.health_checker

  auto-lint-fix:
    needs: setup
    # বাংলা মন্তব্ট: PR-এ auto-lint-fix স্বয়ংক্রিয়ভাবে চালু হবে (auto-fix.yml থেকে অনুমোদিত)।
    # promotion/staging-* PR-এ চালানো যাবে না — সেগুলো ইতিমধ্যে second repo-তে verified।
    if: (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'promotion/staging')) || github.event.inputs.run_auto_lint_fix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.requirements-cache-key }}
      - name: "⚙️ Install Formatters"
        run: pip install black isort ruff "setuptools>=77.0.3"
      - name: "💅 Run Auto-Lint & Format Fix"
        run: |
          ruff check --fix . || true
          black .
          isort .
      - name: "🤖 Create Pull Request"
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        env:
          ACTIONS_ALLOW_UNSECURE_NODE_VERSION: 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-lint and format with ruff, black, isort"
          title: "🤖 Auto-Lint & Format Fix (Ruff)"
          body: |
            এই PR টি 'auto-lint-fix' মেইনটেন্যান্স টাস্ক দ্বারা স্বয়ংক্রিয়ভাবে তৈরি হয়েছে।
            এতে স্বয়ংক্রিয় কোড ফরম্যাটিং এর পরিবর্তন রয়েছে।
          branch: "chore/auto-lint-fix-${{ github.run_id }}"
          labels: "maintenance, automated"

  dependency-vulnerability-scan:
    needs: setup
    if: (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'promotion/staging')) || github.event.inputs.run_dependency_scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.requirements-cache-key }}
      - name: "⚙️ Install Scanners"
        run: |
          pip install pip-audit safety
      - name: "📦 Run Vulnerability Scan (Fast Requirements Audit)"
        working-directory: backend
        run: |
          poetry export --format requirements.txt --output reqs.txt --without ml
          pip-audit -r reqs.txt --format json > vulnerability-report.json || true
      - name: "🛡️ Run Safety Scan"
        working-directory: backend
        run: |
          poetry export --format requirements.txt --output safety-reqs.txt --without ml
          python -m safety scan --file safety-reqs.txt --output json > safety-report.json || true
      - name: "📤 Upload Vulnerability Report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulnerability-report
          path: |
            backend/vulnerability-report.json
            backend/safety-report.json

  generate-codebase-docs:
    name: 📝 Auto-Generate & Deploy Docs
    runs-on: ubuntu-latest
    if: github.event.inputs.run_generate_docs == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📄 Generate API Documentation (OpenAPI)
        env:
          PYTHONPATH: backend
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET || 'supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad' }}
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
        run: |
          VENV_PYTHON=$(cd backend && poetry env info --path)/bin/python
          $VENV_PYTHON scripts/generate_openapi.py

      - name: 📦 Commit and Push OpenAPI Spec
        id: push_docs
        run: |
          git config --global user.name "SupremeAI-DocBot"
          git config --global user.email "docbot@supremeai.dev"
          git add -f backend/API-swagger.yaml || true
          git diff-index --quiet HEAD || (git commit -m "docs: auto-update API-swagger.yaml [skip ci]" && git push) || echo "No changes to commit"

      - name: 📦 Setup Node.js and pnpm for Docusaurus
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 🌐 Install Docusaurus Dependencies
        run: pnpm install --frozen-lockfile

      - name: 📚 Build Docusaurus Site
        working-directory: apps/docs
        run: pnpm build

      - name: 🚀 Upload Docusaurus Build Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/docs/build

      - name: Setup GitHub Pages Environment
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Prepare Pages Content (exclude large files)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/autogen
          find docs/autogen -name "codebase_full.md"

  worker-test:
    name: ⚡ Cloudflare Worker (Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run Cloudflare Worker Tests
        id: worker_tests
        run: pnpm exec vitest run scripts/cloudflare_worker.test.mjs --reporter=json > infrastructure/vitest-report.json

      - name: Add Worker Test Results to GitHub Summary
        if: always()
        run: |
          python .github/scripts/supreme_ci.py generate-report \
            --vitest-json infrastructure/vitest-report.json \
            --label "Cloudflare Worker"

  generate-db-schema:
    name: 📊 Generate DB Schema Diagram
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Graphviz + erdantic
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          poetry run pip install erdantic || pip install erdantic || true

      - name: 📊 Generate ERD from Pydantic Models
        working-directory: backend
        # বাংলা মন্তব্য: PYTHONPATH=. সেট করা হলো যাতে erdantic সহজেই backend/models ইমপোর্ট করতে পারে
        env:
          PYTHONPATH: .
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET || 'supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad' }}
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
        run: |
          mkdir -p ../docs/autogen
          poetry run erdantic models -o ../docs/autogen/db_schema.png || poetry run python -m erdantic models -o ../docs/autogen/db_schema.png || true
          echo "✅ Database schema diagram step completed" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Schema Diagram Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: db-schema-diagram
          path: docs/autogen/db_schema.png

  performance-e2e-test:
    name: 🧪 Human Simulation & Load Tests
    runs-on: ubuntu-latest
    needs: gatekeeper
    # জব হ্যাং হওয়া প্রতিরোধে ২০ মিনিটের টাইমআউট প্রদান করা হয়েছে
    timeout-minutes: 20
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_performance_e2e == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Frontend Build (from latest supreme-core-ci run)
        id: download-dist
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: supreme-core-ci.yml
          branch: main
          name: frontend-dist
          path: apps/studio-client/dist
        continue-on-error: true

      - name: 🩹 Fallback — Build Frontend Locally (if artifact unavailable)
        if: steps.download-dist.outcome == 'failure'
        run: pnpm --dir apps/studio-client run build

      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Start Backend Server
        working-directory: backend
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'CwE60g_bA67m-mock-encryption-key-padded-len=' }}
          SUPREMEAI_API_URL: http://127.0.0.1:8000
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET || 'supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad' }}
        # ইউভিকর্ন সার্ভার লগে রিডাইরেক্ট করে ৬০ সেকেন্ডের টাইমআউট ফেইলসাফ যোগ করা হয়েছে
        run: |
          poetry run uvicorn main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
          echo $! > ../uvicorn.pid
          pnpm exec wait-on http://127.0.0.1:8000/health --timeout 60000 || {
            echo "❌ Backend did not become healthy within 60s — uvicorn log:"
            cat ../uvicorn.log
            exit 1
          }
      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps
      - name: 🩹 Ensure Frontend Build Exists
        # বাংলা মন্তব্য: ফ্রন্টএন্ড বিল্ড ফোল্ডার না থাকলে বিল্ড তৈরি করা এবং প্লেরাইট সার্ভার চালু করার সময় wait-on এর সাথে টাইমআউট ৩০ সেকেন্ড সেট করা হয়েছে।
        run: |
          if [ ! -d "apps/studio-client/dist-user" ] && [ ! -d "apps/studio-client/dist-admin" ] && [ ! -d "apps/studio-client/dist" ]; then
            pnpm --dir apps/studio-client run build
          fi

      - name: Start Frontend Preview Server
        run: |
          cd apps/studio-client && pnpm exec vite preview --port 5173 &
          pnpm exec wait-on http://127.0.0.1:5173 --timeout 30000
        env:
          CI: true
      - name: Create Report Directory & Execute Playwright Simulation
        run: |
          mkdir -p playwright-report
          pnpm exec playwright test tests/e2e/accessibility.spec.ts tests/e2e/chat.spec.ts
        env:
          CI: true
          SUPREMEAI_API_URL: http://127.0.0.1:8000
          SUPABASE_URL: "https://mock-health-check.supabase.co"
          SUPABASE_KEY: "mock_key"
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://mock:mock@localhost:5432/mock_db"
          SUPREMEAI_JWT_SECRET: ${{ secrets.SUPREMEAI_JWT_SECRET || 'supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad' }}
      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supremeai-human-test-report
          path: playwright-report/
          retention-days: 7

  ci-failure-smart-summary:
    name: 🧠 Smart CI Failure Summary
    runs-on: ubuntu-latest
    needs: gatekeeper
    if: >
      (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') &&
      (github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event.inputs.run_ci_failure_summary == 'true')
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 🧠 Run Smart CI Failure Detector
        if: always()
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poetry run python ../.github/scripts/ci_smart_summary.py
      - name: 🚨 Generate Detailed Error Report (Bangla Diagnosis)
        if: always()
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_error_report.py

  outdated-dependency-report:
    name: 📦 Outdated Dependency Report
    runs-on: ubuntu-latest
    needs: gatekeeper
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_outdated_report == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 📦 Check Outdated Python Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          poetry export --without ml --format requirements.txt --output requirements.txt
          pip install -r requirements.txt
          echo "## 📦 Outdated Python Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pip list --outdated --format=columns 2>/dev/null | tail -n +3 | \
            awk '{printf "| %s | %s | %s |\n", $1, $2, $3}' >> $GITHUB_STEP_SUMMARY || \
            echo "✅ সব Python প্যাকেজ আপ-টু-ডেট!" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Check Outdated Node.js Dependencies
        run: |
          pnpm install --frozen-lockfile
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Outdated Node.js Dependencies" >> $GITHUB_STEP_SUMMARY
          if ! pnpm outdated --recursive >> $GITHUB_STEP_SUMMARY 2>&1; then
            if [ ! -s $GITHUB_STEP_SUMMARY ] || ! grep -q "│" $GITHUB_STEP_SUMMARY; then
              echo "✅ সব Node প্যাকেজ আপ-টু-ডেট!" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  auto-dependency-upgrade:
    name: "📦 Auto Dependency Upgrade (PR)"
    runs-on: ubuntu-latest
    needs: [gatekeeper, outdated-dependency-report]
    if: (needs.gatekeeper.outputs.should_run == 'true' || github.event_name != 'schedule') && github.event.inputs.run_auto_dependency_upgrade == 'true'
