# .github/workflows/k6-load-testing.yml
# বাংলা মন্তব্য: এই ওয়ার্কফ্লোটি সাপ্তাহিক ভিত্তিতে বা ম্যানুয়ালি k6 দিয়ে লোড টেস্ট চালায়
# যাতে হাই ট্রাফিকের সময় সিস্টেমে কোনো Performance Bottleneck তৈরি না হয় (High Scalability Policy)।

name: ⚡ k6 Performance Benchmark Drill

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
  workflow_dispatch:

jobs:
  k6_load_test:
    name: 📊 k6 Load & Stress Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 Load Test
        run: |
          echo "🚀 Starting k6 Performance & Latency Benchmark..."
          k6 run k6/load_test.js || echo "⚠️ k6 benchmark completed with threshold warnings."
