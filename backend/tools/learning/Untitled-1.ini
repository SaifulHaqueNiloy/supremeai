### Phase 5: Security & Reliability (Priority: MEDIUM)

#### ৫.১ Enhanced Input Sanitization
**কী করবেন**: `input_sanitizer.py` এ Bangla-specific XSS protection যোগ করুন।

**বাস্তবায়ন**:
```python
# backend/core/security/input_sanitizer.py
import re

class BanglaInputSanitizer:
    # Bangla Unicode range: \u0980-\u09FF
    BANGLA_PATTERN = re.compile(r'[\u0980-\u09FF]+')

    @staticmethod
    def sanitize(text: str) -> str:
        # Allow Bangla, English, numbers, and basic punctuation
        cleaned = re.sub(r'[^\u0980-\u09FFa-zA-Z0-9\s.,!?-]', '', text)
        return cleaned.strip()
```

#### ৫.২ Backup & Recovery Automation
**কী করবেন**: Firebase Firestore-এর free tier backup limit (daily export) ব্যবহার করে automated backup script লিখুন।

**বাস্তবায়ন**:
```python
# backend/scripts/daily_backup.py
from firebase_admin import firestore
from google.cloud import firestore_v1

async def export_daily_backup():
    client = firestore_v1.FirestoreAdminClient()
    project_id = settings.gcp_project_id

    # Export to Cloud Storage (free tier: 5GB)
    output_uri_prefix = f"gs://{project_id}-backups/{datetime.now().strftime('%Y-%m-%d')}"

    await client.export_documents(
        name=f"projects/{project_id}/databases/(default)",
        collection_ids=["users", "tasks", "analytics"],
        output_uri_prefix=output_uri_prefix
    )
```

