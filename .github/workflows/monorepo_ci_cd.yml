name: Monorepo CI/CD - Type Sync

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/schemas/**'
      - 'scripts/generate_types.py'
      - 'backend/core/type_sync_bus.py'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/schemas/**'
      - 'scripts/generate_types.py'
      - 'backend/core/type_sync_bus.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  type-sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic loguru

      - name: 🔐 Iron Curtain SecretHunter Scan
        run: |
          python scripts/devops/secret_scan_ci.py --path backend/ --json

      - name: Run type generation
        run: |
          python scripts/generate_types.py

      - name: Check for drift
        run: |
          python scripts/generate_types.py --validate

      - name: Verify generated files exist
        run: |
          if [ ! -d "packages/shared-types/src/typescript" ]; then
            echo "TypeScript types not generated!"
            exit 1
          fi

          if [ ! -d "packages/shared-types/src/dart" ]; then
            echo "Dart types not generated!"
            exit 1
          fi

          echo "Generated TypeScript files:"
          ls -la packages/shared-types/src/typescript/

          echo "Generated Dart files:"
          ls -la packages/shared-types/src/dart/

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate TypeScript/Dart types from Pydantic schemas"
          branch: ${{ github.head_ref }}
          file_pattern: 'packages/shared-types/**'

  type-sync-integration-test:
    runs-on: ubuntu-latest
    needs: type-sync-check
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic loguru pytest

      - name: Test type sync bus
        run: |
          # Test that the type sync bus can be imported without errors
          python -c "
          from backend.core.type_sync_bus import TypeSyncBus
          print('TypeSyncBus imported successfully')
          "

          # Run basic functionality test
          python -c "
          import asyncio
          from backend.core.type_sync_bus import get_type_sync_bus

          # Test singleton creation
          bus = get_type_sync_bus()
          print('TypeSyncBus singleton created successfully')
          "

  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - type-sync-check
      - type-sync-integration-test
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'
      - name: 🧠 Generate Smart Pipeline Summary (API Key Free)
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: poetry run python ../.github/scripts/ci_smart_summary.py
