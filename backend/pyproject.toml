uvicorn = {extras = ["standard"], version = "^0.51.0"}
starlette-context = "^0.3"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.1"
loguru = "^0.7.3"
redis = {extras = ["hiredis"], version = "^5.2.0"}
python-multipart = "^0.0.20"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-dotenv = "^1.0.1"
requests = "^2.32.3"
uuid6 = "^2025.0.1"
boto3 = "^1.41.5"
defusedxml = "^0.7.1"
beautifulsoup4 = "^4.15.0"
posthog = "^7.29.0"
mcp = "^1.28.1"
stripe = "^15.3.1"
neo4j = "^6.2.0"
aiohttp = "^3.10.10"
websockets = "^13.1"
pygithub = "^2.5.0"
pydantic-extra-types = "^2.11.1"
supabase = "^2.11.0"
firebase-admin = "^6.5.0"
qdrant-client = "^1.12.1"
numpy = "^1.26.4"
opencv-python-headless = "^4.10.0"  # headless: no GTK/GUI libs needed in CI containers
pandas = "^2.2.3"
pyarrow = "^18.1.0"
gcsfs = "^2024.10.0"
s3fs = "^2024.10.0"
pyotp = "^2.9.0"
qrcode = "^8.0"
pillow = "^11.0.0"
cryptography = "^43.0.1"
pybreaker = "^1.4.1"
python-socketio = "^5.11.4"
bidict = "^0.23.1"
webcolors = "^24.11.1"
pytz = "^2024.2"
python-dateutil = "^2.9.0.post0"
croniter = "^5.0.1"
phonenumbers = "^8.13.54"
email-validator = "^2.2.0"
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
pymongo = "^4.10.0"
elasticsearch = "^8.16.0"
google-cloud-firestore = "^2.19.0"
google-cloud-storage = "^2.18.2"
google-auth = "^2.36.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.1"
openai = "^1.54.0"
anthropic = "^0.120.0"
litellm = "^1.50.0"
langchain = "^0.3.7"
langchain-community = "^0.3.7"
langchain-core = "^0.3.15"
langchain-google-genai = "^2.0.6"
langgraph = "^0.2.39"
sse-starlette = "^2.1.3"
plotly = "^5.24.1"
dash = "^2.18.1"
scipy = "^1.14.1"
scikit-learn = "^1.5.2"
statsmodels = "^0.14.6"
xgboost = "^2.1.3"
lightgbm = "^4.5.0"
catboost = "^1.2.7"
optuna = "^4.0.0"
mlflow = "^2.17.0"
wandb = "^0.18.5"
opentelemetry-sdk = "^1.28.2"
opentelemetry-api = "^1.28.2"
opentelemetry-instrumentation-fastapi = "^0.49b1"
opentelemetry-exporter-otlp-proto-grpc = "^1.28.2"

# বাংলা মন্তব্য: torch/sentence-transformers আগে মূল [tool.poetry.dependencies]-এ ছিল,
# ফলে CI-এর backend-core জব `poetry install --with dev` চালালেই torch-এর সাথে
# nvidia-nccl-cu12 *এবং* cu13 দুটো ভিন্ন CUDA স্ট্যাক ডাউনলোড হয়ে যেত -- CPU-only
# GitHub-hosted রানারে সম্পূর্ণ অপ্রয়োজনীয়, এবং এটাই ডিস্ক ফুরিয়ে দিয়ে
# `poetry install`/audit-sandbox ফেইল করাচ্ছিল (Zero-Operating-Cost নীতির বিপরীত)।
# grep দিয়ে যাচাই করা হয়েছে: torch-নির্ভর evolution/* মডিউলগুলো কোথাও import করা হয় না
# (dead/scaffold code, memory-note অনুযায়ী), আর sentence-transformers-এর ৪টা caller
# (experience_db.py, memory_service.py, knowledge_extractor.py, error_remediation.py)
# আগে থেকেই try/except ImportError দিয়ে গ্রেসফুলি ফলব্যাক করে -- তাই এই গ্রুপ বাদ
# দিলে backend-core-এর কোনো টেস্ট ভাঙে না।
# পরবর্তী ধাপ (এই sandbox-এ download.pytorch.org অ্যাক্সেস না থাকায় এখানে verify করা
# যায়নি বলে এখনই যোগ করা হয়নি): কেউ সত্যিকার এই গ্রুপ ইনস্টল করলে যেন GPU wheel না
# নামে, তার জন্য torch-কে explicit `https://download.pytorch.org/whl/cpu` source-এ
# পিন করে `poetry lock` রিজেনারেট করা।
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = "^2.5.0"
sentence-transformers = "^3.3.0"

[tool.poetry.group.dev.dependencies]
# বাংলা মন্তব্য: সিআই পাইপলাইনে ফরম্যাটিং ও লিন্টিংয়ের জন্য dev গ্রুপে black, isort এবং ruff যোগ করা হলো
black = "^24.4.2"
isort = "^5.13.2"
ruff = "^0.4.8"
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.3.0"
pytest-xdist = "^3.6.1"
respx = "^0.21.1"
pytest-md = "^0.2.0"
typeguard = "^4.2"
playwright = "^1.49.0"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    ".venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
# বাংলা মন্তব্ব্য: টেস্ট কভারেজ থ্রেশহোল্ড 75% এ বাড়ানো হয়েছে সিকিউরিটি এবং কোয়ালিটি বাড়াতে
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=75"
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests"
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = [
    "pydantic.mypy"
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pylint]
max-line-length = 120
disable = [
    "C0301",  # Line too long
    "W0613",  # Unused argument
    "R0903",  # Too few public methods
    "R0902",  # Too many instance attributes
    "R0913",  # Too many arguments
    "C0415",  # Import outside toplevel
    "W0212",  # Access to protected member
    "W0622",  # Redefining built-in
    "R0914",  # Too many local variables
    "R0801",  # Similar lines in files
    "C0103",  # Invalid variable name
    "W0703",  # Catching too general exception
    "R0912",  # Too many branches
    "R0915",  # Too many statements
    "R0911",  # Too many return statements
    "R1702",  # Too many nested blocks
    "W0621",  # Redefining name from outer scope
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "W0237",  # Arguments renamed in subclass
    "W0221",  # Arguments differ from overridden method
    "W0236",  # Removed incompatibility in class hierarchy
    "R1705",  # Unnecessary "else" after "return"
    "C0209",  # Formatting a string with % or .format
    "W0102",  # Dangerous default value as argument
    "W0107",  # Unnecessary pass statement
    "C0411",  # Wrong import order
    "W0612",  # Unused variable
    "R1725",  # Consider using Python 3 style super() call
    "W0404",  # Reimported
    "R0205",  # Class inherits from object
    "C0104",  # Disallowed name
    "W0719",  # Raising arbitrary exception
    "W0707",  # Consider explicitly re-raising using 'raise ... from ...'
    "W0718",  # Catching too general exception
    "R1710",  # Either all return statements in a function should return an expression, or none of them should
    "R1711",  # Useless return at end of function or method
    "C2801",  # Unnecessary dunder call
    "R0402",  # Use of from import is recommended
    "C0303",  # Trailing whitespace
    "C0304",  # Final newline missing
    "W0301",  # Useless semicolon
    "C0413",  # Wrong import position
    "R0916",  # Too many boolean expressions
    "W0631",  # Using possibly undefined loop variable
    "W0711",  # Exception to catch is the same as the raised exception
    "W0712",  # Implicitly catching BaseException
    "W0713",  # Catching a non-exception type
    "W0714",  # Non-exception caught
    "W0715",  # Exception arguments suggest string formatting might be intended
    "W0716",  # Unknown exception option
    "W0717",  # Bad exception context
    "W0718",  # Catching too general exception
    "W0719",  # Raising non-exception
    "W0720",  # Using bare except
    "W0721",  # Exception doesn't inherit from standard "Exception" class
    "W0722",  # Bare except clause
    "W0723",  # Use of deprecated argument to exec
    "W0724",  # Use of deprecated argument to exec
    "W0725",  # Use of deprecated argument to exec
    "W0726",  # Use of deprecated argument to exec
    "W0727",  # Use of deprecated argument to exec
    "W0728",  # Use of deprecated argument to exec
    "W0729",  # Use of deprecated argument to exec
    "W0730",  # Use of deprecated argument to exec
    "W0731",  # Use of deprecated argument to exec
    "W0732",  # Use of deprecated argument to exec
    "W0733",  # Use of deprecated argument to exec
    "W0734",  # Use of deprecated argument to exec
    "W0735",  # Use of deprecated argument to exec
    "W0736",  # Use of deprecated argument to exec
    "W0737",  # Use of deprecated argument to exec
    "W0738",  # Use of deprecated argument to exec
    "W0739",  # Use of deprecated argument to exec
    "W0740",  # Use of deprecated argument to exec
    "W0741",  # Use of deprecated argument to exec
    "W0742",  # Use of deprecated argument to exec
    "W0743",  # Use of deprecated argument to exec
    "W0744",  # Use of deprecated argument to exec
    "W0745",  # Use of deprecated argument to exec
    "W0746",  # Use of deprecated argument to exec
    "W0747",  # Use of deprecated argument to exec
    "W0748",  # Use of deprecated argument to exec
    "W0749",  # Use of deprecated argument to exec
    "W0750",  # Use of deprecated argument to exec
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "UP",    # pyupgrade
]
ignore = [
    "E501",     # Line too long
    "E402",     # Module level import not at top of file
    "BLE001",   # Blind exception catch
    "RUF012",   # ClassVar mutable attribute
    "RUF001",   # Ambiguous unicode strings
    "RUF002",   # Ambiguous unicode docstrings
    "RUF003",   # Ambiguous unicode comments
    "TRY002",   # Create own exception
    "TRY004",   # Prefer TypeError
    "DTZ005",   # Datetime tz
    "B008",     # Default args call
    "I001",     # Unsorted imports
]
