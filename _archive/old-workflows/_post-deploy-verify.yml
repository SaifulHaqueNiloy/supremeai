# ==============================================================================
# _post-deploy-verify.yml — Post-Deploy Verification
# ==============================================================================
# Extracted from supreme-core-ci.yml (embedded in deploy jobs)
# Called via workflow_call from the orchestrator.
# ==============================================================================

name: ✅ Post-Deploy Verification

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        type: string
        required: false
        default: '3.11'

jobs:
  post-deploy-verify:
    name: ✅ Post-Deploy Health Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🌐 Verify Production Endpoints
        run: |
          echo "## ✅ Post-Deploy Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

          # Check production API health
          if curl -sf --max-time 10 "https://supremeai-backend.onrender.com/health" > /dev/null 2>&1; then
            echo "| User Backend | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| User Backend | ⚠️ Unreachable (may be deploying) |" >> $GITHUB_STEP_SUMMARY
          fi

          if curl -sf --max-time 10 "https://supremeai-admin.onrender.com/health" > /dev/null 2>&1; then
            echo "| Admin Backend | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Admin Backend | ⚠️ Unreachable (may be deploying) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Deployment Summary
        run: |
          echo "## 📊 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ✅ Triggered |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify | ✅ Checked |" >> $GITHUB_STEP_SUMMARY