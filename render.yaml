services:
  - type: web
    name: supremeai-backend
    env: python
    buildCommand: "cd backend && pip install poetry && poetry config virtualenvs.create false && poetry install --only main"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production

  - type: web
    name: supremeai-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build:user"
    staticPublishPath: "./frontend/dist-user"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
