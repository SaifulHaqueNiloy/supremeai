name: Nightly Synthetic Benchmark & Performance Regression Gate

# বাংলা মন্তব্য: প্রতি রাতে স্বয়ংক্রিয়ভাবে সিন্থেটিক লোড বেঞ্চমার্ক রান করে (Swarm, Cost Guard, JIT OTP)
# এবং p95 ল্যাটেন্সি বা কস্ট ব্রিচ রেটে রিগ্রেশন ঘটলে তা অটোমেটিক ডিটেক্ট করে টিমকে সতর্ক করে।

on:
  schedule:
    - cron: '0 2 * * *'  # প্রতি রাত ২:০০ UTC (সকাল ৮:০০ BST)
  workflow_dispatch:
    inputs:
      requests:
        description: 'Number of requests per scenario'
        required: false
        default: '50'
      concurrency:
        description: 'Concurrency level'
        required: false
        default: '10'

jobs:
  synthetic-benchmark:
    name: Nightly Synthetic Benchmark & Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest pytest-asyncio pydantic pydantic-settings loguru fastapi redis starlette-context pybreaker

      - name: Run Synthetic Benchmark Scenarios
        env:
          PYTHONPATH: backend
        run: |
          REQUESTS="${{ github.event.inputs.requests || '50' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '10' }}"
          python scripts/benchmark/synthetic_m32_benchmark.py \
            --all \
            --requests "$REQUESTS" \
            --concurrency "$CONCURRENCY" \
            --output-json benchmark_results.json

      - name: Evaluate Benchmark Regression Gate
        run: |
          python scripts/ci/check_benchmark_regression.py \
            --current benchmark_results.json \
            --baseline backend/baselines/benchmark_baseline.json \
            --tolerance-pct 25.0 \
            --github-summary \
            --fail-on-regression

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: nightly-benchmark-report
          path: benchmark_results.json
          retention-days: 30
