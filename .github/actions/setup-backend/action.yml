name: 'Setup Backend'
description: 'Setup Python, Poetry, and cached virtualenv for backend'
inputs:
  python-version:
    description: 'Python version to setup'
    required: false
    default: '3.11'
  working-directory:
    description: 'Working directory for poetry'
    required: false
    default: 'backend'
  poetry-version:
    description: 'Poetry version'
    required: false
    default: 'latest'
  install-media-deps:
    description: 'Install ffmpeg for media processing'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: 📦 Install System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential
        if [ "${{ inputs.install-media-deps }}" = "true" ]; then
          sudo apt-get install -y ffmpeg
        fi

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - uses: snok/install-poetry@v1
      with:
        version: ${{ inputs.poetry-version }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        plugins: poetry-plugin-export
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: pycache-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory)) }}
        restore-keys: |
          pycache-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: ⚙️ Install Build Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        poetry run pip install --upgrade pip setuptools==68.0.0 wheel || true
        poetry run pip install openai-whisper==20240930 --no-build-isolation || true

    - name: 📥 Poetry Install (backend deps)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        poetry run pip install setuptools==68.0.0 wheel
        poetry install --no-root --with dev
