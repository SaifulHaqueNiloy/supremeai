  ecosystem_scout:
    description: "বিশ্বের শীর্ষস্থানীয় (World-Class) AI টুলস, আর্কিটেকচার ও ওপেন-সোর্স প্রজেক্ট পর্যবেক্ষণ করে সুপ্রিমএআই-কে টপ-অব-দ্য-ওয়ার্ল্ড পর্যায়ে উন্নীত করার প্ল্যান প্রণয়ন: (১) সরাসরি ব্যবহার (Direct Use / MCP / Zero-Cost Integration) অথবা (২) তার শ্রেষ্ঠ মেকানিজম থেকে শিক্ষা নিয়ে আত্মস্থ করা (Architectural Learning & Absorption)।"
    applicable_rules:
      - "architecture.rule_002"
      - "architecture.rule_003"
      - "free_tier_constraint"
      - "hard_rules.source_legitimacy_and_peer_veto"
      - "hard_rules.conciseness_and_zero_bloat"
      - "hard_rules.peer_autonomy_and_synthesis"
    legitimacy_mandate:
      rule: "উৎস প্রামাণ্যতা ও নিরাপত্তা যাচাই (Source Legitimacy First): যার কাছ থেকে শিক্ষা বা টুল নেওয়া হচ্ছে সে শতভাগ লেজিট (Legit) কি না তা আগে নিশ্চিত হতে হবে।"
      rubric:
        - "১. অর্গানাইজেশন ও লেখক প্রামাণ্যতা: প্রতিষ্ঠিত ও বিশ্বাসযোগ্য অর্গানাইজেশন (GitHub, Anthropic, Google, Microsoft ইত্যাদি) বা বিশ্বস্ত ওপেন-সোর্স মেইনটেইনার।"
        - "২. প্রোডাকশন ম্যাচিউরিটি ও সিআই: ফাঁপা হাইপ বা ভ্যানিটি নয় — টেস্ট গ্রিন, সক্রিয় মেইনটেন্যান্স ও বাস্তব কোড কোয়ালিটি থাকা আবশ্যক।"
        - "৩. লাইসেন্স ও নিরাপত্তা হাইজিন: পারমিসিভ লাইসেন্স (MIT, Apache-2.0) এবং কোনো ক্ষতিকর কোড বা ব্যাকডোর না থাকা।"
    prohibited_actions:
      - "কোনো কোড সরাসরি এডিট বা ডিলিট"
      - "র‍্যাম ব্লোটকারী ভারী ডিপেন্ডেন্সি সরাসরি ইনস্টল"
      - "কোনো PR তৈরি বা মার্জ"
      - "ক্লেইম লক নেওয়া (শুধুমাত্র অডিট, ব্লুপ্রিন্ট ও অ্যাকশনেবল প্ল্যান তৈরি)"
      - "অযাচাইকৃত, হাইপ-সর্বস্ব বা অবিশ্বস্ত (Non-Legit) রিপোজিটরি থেকে কোনো কিছু গ্রহণ বা প্রস্তাবনা"
    auto_inject: true

# Scope Gate policy (parsed by gates.py — do not rename keys).
scope_policy:
  declaration_marker: "Touching files:"
  undeclared_files: block        # block | warn
  missing_declaration: block     # claim ছাড়া code = Rule 2 লঙ্ঘন
  advisory_authors: [OWNER, MEMBER, COLLABORATOR]   # human maintainers get warn-only
  # Mechanical regen artifacts every PR may carry without declaration:
  allowlist:
    - "docs/generated/**"
    - "backend/openapi.json"
    - "**/package-lock.json"
    - "**/bun.lock"
    - "**/bun.lockb"
    - "**/uv.lock"
    - "**/*.sarif"
    - "ci-reports/**"

# Verification Gate policy.
verification_policy:
  min_evidence_chars: 40
  section_names: ["Test Evidence", "Tests", "পরীক্ষা", "টেস্ট এভিডেন্স"]
  output_markers:
    ["passed", "PASSED", "ok.", "OK (", " All tests passed", "✓", "✔", "pytest", "vitest", "unittest", "bun test"]

# Lease Gate policy.
lease_policy:
  bot_author_regex: '^supremeai-([a-z0-9]+)-([0-9]+)-bot(\[bot\])?$'
  bot_branch_regex: '^([a-z0-9]+)-([0-9]+)([-_.].+)?$'
  exempt_authors: ["dependabot[bot]", "app/dependabot", "github-actions[bot]", "renovate[bot]"]
  docs_branch_prefix: "docs/"
  # Flexible Group Branching (#2378): group/* branches lease by group claim
  # participation (claim comment on a group:<name> issue — active or completed),
  # not by slot pattern.
  group_branch_prefix: "group/"
  mesh_advisory_env: "SUPREME_MESH_URL"

# Governance archive (Phase 5 — prose rule systems absorbed into this registry).
archive:
  batch: "docs/archive/agent-rule-systems-2026-09"
  absorbed:
    - path: ".clinerules"
      reason: "Legacy IDE prompt system — speckit workflow copies duplicate .specify/; master_prompt prose superseded by this registry"
    - path: ".lingma"
      reason: "Legacy IDE rule dir — single agents.md duplicate of AGENTS.md"
    - path: ".agents/rules"
      reason: "Legacy agent rule prose — superseded by gates above + AGENTS.md v2"
