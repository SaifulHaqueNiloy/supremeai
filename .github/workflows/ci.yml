name: SupremeAI Simple CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
          cache-dependency-path: "backend/poetry.lock"

      - name: Install backend dependencies
        run: |
          cd backend
          poetry config virtualenvs.create false
          poetry install

      - name: Backend Pre-flight Checks (Lint & Typecheck)
        run: |
          cd backend
          poetry run ruff check .
          poetry run mypy .

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -q

      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/saifulhaqueniloy/supremeai-backend:latest

  frontend-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Frontend Pre-flight Checks (Lint & Typecheck)
        run: |
          cd frontend
          pnpm run lint
          pnpm run typecheck

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Deploy PR Preview to Firebase Hosting
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}'
          projectId: supremeai-a
          target: admin

      - name: Deploy Live to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPREMEAI_A }}'
          channelId: live
          projectId: supremeai-a
          target: admin

      - name: Auto-update Lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update pnpm-lock.yaml"
            git push
          fi

  security-scan:
    name: 🔍 Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Parallel Security Scan (Trivy)
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./bin
          TRIVY_VERSION=$(curl -sL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          if [ -z "$TRIVY_VERSION" ]; then
            TRIVY_VERSION="0.55.0"
          fi
          echo "Downloading Trivy version: $TRIVY_VERSION"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          tar -xzf trivy.tar.gz -C ./bin trivy
          rm trivy.tar.gz
          ./bin/trivy fs --severity CRITICAL,HIGH backend &
          ./bin/trivy fs --severity CRITICAL,HIGH frontend &
          wait

  bridge-boot-check:
    name: 🔌 Bridge Boot Check (Backend + DB)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supreme_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install & Run Backend
        env:
          REDIS_URL: "redis://127.0.0.1:6379/0"
          SUPABASE_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
          SUPABASE_DATABASE_URL_POOLER: "postgresql+asyncpg://test_user:test_password@127.0.0.1:5432/supreme_test_db"
          ENCRYPTION_KEY: "CwE60g_bA67m-mock-encryption-key-padded-len="
          SUPREMEAI_JWT_SECRET: "supremeai_secure_jwt_secret_value_at_least_64_bytes_long_test_string_pad_pad_pad_pad"
        run: |
          cd backend
          poetry config virtualenvs.create false
          poetry install
          poetry run alembic upgrade head || echo "Alembic migrations failed or skipped"
          poetry run python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 10
      - name: Probe Admin API
        run: |
          curl --retry 5 --retry-delay 2 --retry-connrefused -f --max-time 3 http://127.0.0.1:8000/api/v1/health || exit 1
          curl --retry 5 --retry-delay 2 --retry-connrefused -f --max-time 3 http://127.0.0.1:8000/api/v1/telemetry || exit 1
