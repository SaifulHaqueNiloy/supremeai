# Issue Ops — issue-domain automation console (epic #1850 Phase A / W6, issue #2071)
# ============================================================================================
# FLIPPED LIVE (epic #1850 Phase F / #1858): this file now owns the issue-event hot
# path (issues + 6h drift sweep + dispatch console) — the retired priority-queue.yml
# and issue-labeler.yml are deleted in this same change, so a single revert restores
# everything. Ledger invariants (find-by-marker, oldest-wins, promotion comment,
# case-insensitive state) live in scripts/agents/priority_queue_ledger.py — unchanged.
#
# Fidelity contract (verified against priority-queue.yml + issue-labeler.yml, 2026-09-27):
#   - `refresh-ledger` job = verbatim steps of priority-queue.yml's `refresh-ledger`
#     (re-rank + dry-run smoke that guards the body/marker contract);
#   - ledger invariants preserved by the script itself: find-by-marker
#     `<!-- SUPREMEAI_PRIORITY_QUEUE_LEDGER v1 -->`, oldest-wins, promotion comment
#     only when the previous #1 closed, case-insensitive state compare;
#   - `labeler` job = verbatim github-script of issue-labeler.yml (label | comment |
#     close | reopen), inputs namespaced `labeler_*` to avoid colliding with the
#     top-level `action` selector;
#   - concurrency: separate group names from the live legacy workflows so a shadow
#     dispatch can never cancel a live event-driven re-rank (the flip PR will unify
#     them).

name: Issue Ops (Queue Ledger & Labeler)

on:
  issues:
    # Founder directive #1997: "1st close howar por 2nd auto 1st hoa jabe" — every
    # issue event re-ranks the live ledger (FLIP: absorbed from priority-queue.yml,
    # epic #1850 Phase F / #1858).
    types: [opened, closed, reopened, labeled, unlabeled]
  schedule:
    # 6-hourly drift sweep (verbatim from priority-queue.yml)
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: 'refresh-ledger | labeler'
        required: true
        default: 'refresh-ledger'
        type: string
      # ── labeler passthrough (action=labeler) ──
      labeler_issue_number:
        description: '[labeler] issue number to act on'
        required: false
        type: string
      labeler_operation:
        description: '[labeler] one of: label | comment | close | reopen'
        required: false
        type: string
      labeler_value:
        description: '[labeler] labels (comma-separated) for label op, or comment body for comment/close'
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  validate-action:
    name: Validate action input (fail-closed)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on unknown action
        run: |
          case "${{ inputs.action }}" in
            refresh-ledger|labeler)
              echo "✅ action='${{ inputs.action }}' is valid" ;;
            *)
              echo "::error::Unknown action '${{ inputs.action }}'. Valid values: refresh-ledger | labeler"
              exit 1 ;;
          esac

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Arm 1 — Priority queue re-rank (source: priority-queue.yml `refresh-ledger`)
  # Founder directive #1997: "1st close howar por 2nd auto 1st hoa jabe".
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  refresh-ledger:
    name: Re-rank live priority queue
    # FLIP: event-driven re-rank on every issue event + 6h drift sweep + manual
    # dispatch (action=refresh-ledger) — verbatim trigger surface of the retired
    # priority-queue.yml (#1997 founder directive, ledger invariants unchanged).
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'issues' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'refresh-ledger')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Unified with the retired priority-queue.yml group (flip) — one ledger
      # re-rank at a time, newest wins; same semantics as the live legacy run.
      group: priority-queue-ledger
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Refresh the ledger
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LEDGER_TRIGGER: ${{ github.event_name }}${{ github.event.action && format(' ({0})', github.event.action) || '' }}
        run: |
          set -euo pipefail
          python scripts/agents/priority_queue_ledger.py --limit 10

      - name: Dry-run smoke (queue shape sanity)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Verifies the renderer end-to-end without writing (guards against
          # silent breakage of the body/marker contract the promotion logic reads).
          python scripts/agents/priority_queue_ledger.py --dry-run --limit 3 | head -40

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Arm 2 — Issue labeler (source: issue-labeler.yml `apply`, verbatim script)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  labeler:
    name: Apply issue action
    if: ${{ inputs.action == 'labeler' }}
    needs: validate-action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      contents: read
    concurrency:
      # Issue-scoped, matching the legacy issue-labeler semantics.
      group: issue-ops-labeler-${{ inputs.labeler_issue_number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Apply issue action
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.labeler_issue_number }}
          ACTION: ${{ inputs.labeler_operation }}
          VALUE: ${{ inputs.labeler_value }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const num = parseInt(process.env.ISSUE_NUMBER, 10);
            const action = process.env.ACTION;
            const value = process.env.VALUE || '';

            if (!Number.isInteger(num) || num <= 0) {
              core.setFailed(`Invalid issue_number: ${process.env.ISSUE_NUMBER}`);
              return;
            }

            switch (action) {
              case 'label': {
                const labels = value.split(',').map(s => s.trim()).filter(Boolean);
                if (labels.length === 0) { core.setFailed('No labels provided'); return; }
                await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels });
                console.log(`Added labels [${labels.join(', ')}] to issue #${num}`);
                break;
              }
              case 'comment': {
                if (!value) { core.setFailed('Empty comment'); return; }
                await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                console.log(`Posted comment to issue #${num}`);
                break;
              }
              case 'close': {
                if (value) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: num, body: value });
                }
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed', state_reason: 'completed' });
                console.log(`Closed issue #${num}`);
                break;
              }
              case 'reopen': {
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'open', state_reason: 'reopened' });
                console.log(`Reopened issue #${num}`);
                break;
              }
              default:
                core.setFailed(`Unknown action: ${action}`);
            }
