# ==============================================================================
# _frontend-test.yml — Frontend Tests (Turbo Build, Vitest, Bundle Check)
# ==============================================================================
# Extracted from supreme-core-ci.yml (lines 1012-1154)
# Called via workflow_call from the orchestrator.
# ==============================================================================

name: 🌐 Frontend Tests

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node version to use'
        type: string
        required: false
        default: '24'
      frontend_changed:
        description: 'Whether frontend files changed'
        type: boolean
        required: false
        default: false
      dependencies_changed:
        description: 'Whether dependency files changed'
        type: boolean
        required: false
        default: false
      run_attempt:
        description: 'Run attempt number'
        type: string
        required: false
        default: '1'

jobs:
  frontend-core:
    name: 🌐 Frontend Monorepo (Turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: ⚙️ Setup Pnpm Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: deps:${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            deps:${{ runner.os }}-pnpm-

      - name: 📦 Install Pnpm Dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm install --frozen-lockfile
          pnpm store prune

      - name: Cache Turborepo
        id: turbo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo:${{ runner.os }}-turbo-node${{ inputs.node_version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/**/package.json', 'tools/**/package.json') }}
          restore-keys: |
            turbo:${{ runner.os }}-turbo-node${{ inputs.node_version }}-
            turbo:${{ runner.os }}-turbo-

      - name: 📊 Turbo Cache Report
        run: |
          if [ "${{ steps.turbo-cache.outputs.cache-hit }}" == "true" ]; then
            echo "- Turbo cache: HIT — build artifacts restored from cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Turbo cache: MISS — fresh build running" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build & Lint Frontend Packages
        env:
          VITE_PORTAL_TYPE: 'admin'
          VITE_API_URL: ${{ vars.SUPREMEAI_API_URL }}
          VITE_API_BASE: ${{ vars.SUPREMEAI_API_URL }}
        run: pnpm turbo run build lint --filter=supremeai-studio-client --filter=supremeai-vscode --cache-dir=.turbo

      - name: Run Studio Client Vitest with JSON Report
        run: pnpm --dir apps/studio-client exec vitest run --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Add Studio Client Test Results to GitHub Summary
        if: always()
        run: python .github/scripts/supreme_ci.py generate-report --vitest-json apps/studio-client/vitest-report.json --label "Studio Client"

      - name: 🔍 Studio Client — Bundle Size Check
        run: bash apps/studio-client/scripts/bundle-check.sh apps/studio-client/dist-admin

      - name: 🔍 Studio Client — Hardcoded Values Grep
        run: |
          echo "Checking for hardcoded localhost, TODO_FIXME, or hardcoded secrets in commandcenter..."
          violations=0
          if grep -rn 'localhost' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found hardcoded 'localhost' references"
            violations=$((violations + 1))
          fi
          if grep -rn 'TODO_FIXME' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found TODO_FIXME markers"
            violations=$((violations + 1))
          fi
          if grep -rn -E '(api_key|apikey|secret|password|token)\s*[:=]\s*["'"'"'][^"'"'"']+["'"'"']' apps/studio-client/src/commandcenter/ --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "FAIL: Found potential hardcoded secrets"
            violations=$((violations + 1))
          fi
          if [ $violations -gt 0 ]; then
            echo "FAIL: $violations hardcoded value violation(s) found"
            exit 1
          fi
          echo "PASS: No hardcoded values found"

      - name: ♿ Studio Client — Accessibility Check (axe-core)
        continue-on-error: true
        env:
          VITE_PORTAL_TYPE: 'admin'
        run: |
          pnpm --dir apps/studio-client exec vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 30000
          npx --yes browser-driver-manager install chrome 2>/dev/null || true
          npx --yes @axe-core/cli http://localhost:4173 || true

      - name: Run Web Chat Vitest with JSON Report
        if: always()
        run: |
          if [ -d "apps/web-chat" ]; then
            SUPREMEAI_API_URL="https://mock-api.supremeai.local" pnpm --dir apps/web-chat exec vitest run --reporter=json --outputFile=vitest-report.json
          else
            echo "web-chat app not found, skipping tests."
          fi

      - name: Add Web Chat Test Results to GitHub Summary
        if: always()
        run: |
          if [ -f "apps/web-chat/vitest-report.json" ]; then
            python .github/scripts/supreme_ci.py generate-report --vitest-json apps/web-chat/vitest-report.json --label "Web Chat"
          else
            echo "No web-chat test results to report."
          fi

      - name: Run VS Code Extension Tests
        run: pnpm turbo run test --filter=supremeai-vscode --cache-dir=.turbo

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: apps/studio-client/dist-admin
          retention-days: 1