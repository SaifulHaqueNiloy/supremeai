# FB-09 fix (issue #590): Firebase Hosting deploys were manual-only
# (`pnpm deploy:frontend` run from a developer machine with a personal
# `firebase login` session) — no deploy gate, no audit trail, no deterministic
# way to redeploy/roll back, and deploys bypassed every CI quality gate.
#
# This workflow makes the deploy an auditable, CI-driven operation while
# staying deliberately conservative:
#   * workflow_dispatch ONLY — no push/PR triggers. A human still presses the
#     button; the build + config generation + deploy now run with CI
#     provenance and a permanent action log.
#   * fail-closed secret guard — the job exits BEFORE building if the
#     FIREBASE_TOKEN repository secret is not configured, so a missing secret
#     can never result in a half-deploy or a silent no-op.
#   * optional Firebase Hosting preview channels via the `preview_channel`
#     input (deployed per target with `hosting:channel:deploy --only TARGET`).
#
# One-time setup (repo owners) — see docs/deployment/FIREBASE_HOSTING_CI.md:
#   1. Mint a CI token (`firebase login:ci`) from an account whose Firebase
#      role is scoped to Hosting on project `supremeai-a` (least privilege —
#      not a personal project-owner account).
#   2. Repo → Settings → Secrets and variables → Actions → New repository
#      secret → name: FIREBASE_TOKEN.
#   3. (Optional) add repository *Variables* VITE_USER_BACKEND /
#      VITE_ADMIN_BACKEND / VITE_API_BASE / VITE_API_URL so the CI build bakes
#      the real backend origins instead of degraded-viewer mode.

name: Firebase Hosting Deploy

on:
  workflow_dispatch:
    inputs:
      preview_channel:
        description: 'Optional Hosting preview channel id (e.g. pr-1234). Empty = production targets (user + admin).'
        required: false
        default: ''
      channel_expires:
        description: 'Preview channel expiry (only used when preview_channel is set)'
        required: false
        default: '7d'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy-hosting:
    name: 🚀 Build & deploy frontend to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-frontend

      # FB-09 fail-closed guard (issue #590): FIREBASE_TOKEN does not exist in
      # the repo yet — until an owner adds it (see header comment + runbook),
      # every run must stop here, not build a bundle it cannot deploy.
      - name: Fail closed unless FIREBASE_TOKEN is configured
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not configured. Add it under Settings → Secrets and variables → Actions (see docs/deployment/FIREBASE_HOSTING_CI.md). Refusing to deploy."
            exit 1
          fi
          echo "FIREBASE_TOKEN present — proceeding."

      - name: Build frontend (single shared SPA artifact)
        env:
          # Optional repository Variables (blank when unset → the bundle
          # builds in degraded-viewer mode, frontend/src/utils/api.ts).
          VITE_USER_BACKEND: ${{ vars.VITE_USER_BACKEND }}
          VITE_ADMIN_BACKEND: ${{ vars.VITE_ADMIN_BACKEND }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm --filter supremeai-studio-client build

      - name: Generate firebase.json (deterministic config generator)
        env:
          # Optional passthrough for the generator's hosting-domain guard.
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: python3 scripts/deploy/generate_firebase_config.py --require-build

      - name: Deploy to Firebase Hosting (production or preview channel)
        env:
          # Token reaches the CLI through the environment — never interpolated
          # into the command line, so it cannot leak via shell tracing or logs.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PREVIEW_CHANNEL: ${{ inputs.preview_channel }}
          CHANNEL_EXPIRES: ${{ inputs.channel_expires }}
        run: |
          set -euo pipefail
          FB="npx --yes firebase-tools@15.30.2"
          if [ -n "$PREVIEW_CHANNEL" ]; then
            # Preview channels, per Firebase CLI docs:
            #   firebase hosting:channel:deploy CHANNEL_ID --only TARGET_NAME
            # Both targets ship the same SPA artifact (FB-06, issue #587).
            for target in user admin; do
              echo "Deploying target '$target' to preview channel '$PREVIEW_CHANNEL' (expires $CHANNEL_EXPIRES)"
              $FB hosting:channel:deploy "$PREVIEW_CHANNEL" --only "$target" --expires "$CHANNEL_EXPIRES" --token "$FIREBASE_TOKEN"
            done
          else
            # Production deploy — the exact command suggested by issue #590.
            # Deploys BOTH hosting targets (user + admin, same artifact).
            $FB deploy --only hosting --token "$FIREBASE_TOKEN"
          fi
