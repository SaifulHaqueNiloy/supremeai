# ⚠️ DEPRECATED HUSK (epic #1850 Phase B, issue #1854)
# This workflow's scheduled duties now live in nightly-ops.yml (day-guarded arms with
# per-job concurrency). The schedule trigger is REMOVED below; the remaining arms are
# inert fallbacks only. Physical deletion is batched into the final cleanup phase for
# founder Tier-3 sign-off — `.github/workflows/**` is a protected scope and deletion
# auto-BLOCKs the Unified PR Gate by design (SG-04/SG-09/SG-11, protected-scopes.yml).
name: Platform Agent — 3h third-party sweep

# agent-11 (platform-agent) scheduled sweep — charter:
# docs/agents/platform-agent-charter.md
#
# Every 3 hours: probe every connected 3rd-party platform with its real API
# keys (Infisical universal-auth pull at runtime), write a markdown matrix to
# the job summary, and open/update a deduped issue labelled `handoff:platform`
# when anything is DOWN/degraded. Cost: ~25-35 API calls per run (free tiers).

on:
  workflow_dispatch: {} # manual on-demand sweep

permissions:
  contents: read
  issues: write

concurrency:
  group: platform-agent-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run platform sweep
        env:
          INFISICAL_HOST: https://app.infisical.com
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          RENDER_API_KEY_3: ${{ secrets.RENDER_API_KEY_3 }}
          RENDER_API_KEY_4: ${{ secrets.RENDER_API_KEY_4 }}
          RENDER_MCP_SVC_ID: ${{ secrets.RENDER_MCP_SVC_ID }}
          RENDER_PRIMARY_SVC_ID: ${{ secrets.RENDER_PRIMARY_SVC_ID }}
          RENDER_WORKER_SVC_ID: ${{ secrets.RENDER_WORKER_SVC_ID }}
          RENDER_SCRAPER_SVC_ID: ${{ secrets.RENDER_SCRAPER_SVC_ID }}
          RENDER_MCP_URL: ${{ secrets.RENDER_MCP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SELF_HEAL_PAT || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/platform_agent_check.py
