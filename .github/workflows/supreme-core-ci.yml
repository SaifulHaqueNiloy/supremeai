  sync-mirror:
    name: 📤 Sync Main to Staging Repo (Direct Push)
    needs: [backend-core, frontend-core]
    if: |
      always() &&
      github.repository == 'paykaribazaronline/supremeai' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true

      - name: 📤 Direct Push to Staging Main Branch
        env:
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          if [ -z "$MIRROR_REPO_TOKEN" ]; then
            echo "⚠️ MIRROR_REPO_TOKEN secret is missing. Skipping direct push to staging repo."
            exit 0
          fi
          git config lfs.allowincompletepush true
          git remote add mirror https://${MIRROR_REPO_TOKEN}@github.com/SaifulHaqueNiloy/supremeai.git
          # বাংলা: Git diff গার্ড — শুধু তখনই push করবে যখন staging repo-র সাথে আসল পার্থক্য (difference) থাকবে।
          # না থাকলে push করবে না, ফলে অবাঞ্ছিত cross-repo push loop বন্ধ হবে।
          echo "🔍 Checking for diff against mirror/main before pushing..."
          git fetch mirror main
          # বাংলা: .github/workflows ফোল্ডার এখন diff-এ অন্তর্ভুক্ত — CI কনফিগ পরিবর্তন sync হওয়া দরকার
          if git diff --quiet mirror/main HEAD -- . ; then
            echo "✅ No code difference vs mirror/main — skipping push to prevent infinite loop."
            exit 0
          fi
          echo "⚠️ Difference detected — pushing to mirror main."
          git push --force mirror main:refs/heads/main

  # ==============================================================================
  # 🟢 STAGING → PRODUCTION PROMOTION JOB
  # ==============================================================================
  # বর্তমান আর্কিটেকচার (Current Flow):
  #   SaifulHaqueNiloy/supremeai  ──(CI Pass)──→  paykaribazaronline/supremeai  →  Render
  #
  # এই job-এর কাজ:
  #   সব critical CI job সফলভাবে পাস হলে, SaifulHaqueNiloy থেকে
  #   paykaribazaronline/supremeai-এ একটি PR তৈরি করে। auto-promote-to-prod.yml
  #   সেই PR দেখে Render-এ ডিপ্লয় করে।
  #
  # ভবিষ্যতে Bidirectional Sync (Upgrade Path):
  #   যদি ভবিষ্যতে পরিকল্পনা পরিবর্তন করতে চান এবং paykaribazaronline থেকে
  #   SaifulHaqueNiloy-এ code পাঠাতে চান (reverse flow), তাহলে:
  #   ১. paykaribazaronline-এ `sync-back-to-staging.yml` যোগ করুন।
  #   ২. এই staging-pr-promotion job-এর `if` condition এ
  #      `[CI-verified]` commit message check যোগ করুন যাতে
  #      শুধু SaifulHaqueNiloy-validated code-ই paykaribazaronline-এ যায়।
  #   ৩. Docker build step-এ `[CI-verified]` check যোগ করুন।
  #   রেফারেন্স: implementation_plan.md (Bidirectional Sync Plan)
  # ==============================================================================
  staging-pr-promotion:
    name: 🟢 Auto Create Promotion PR from Staging to Main Repo
    needs: [backend-core, frontend-core]
    # শুধু SaifulHaqueNiloy repo-র main branch push-এ চলবে
    if: |
      always() &&
      github.repository == 'SaifulHaqueNiloy/supremeai' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.backend-core.result, 'failure') &&
      !contains(needs.frontend-core.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Checkout Staging Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
          # disable persist-credentials so explicit remote PAT URL isn't overridden by default action credentials
          persist-credentials: false

      - name: 🔑 Fetch Promotion Token from Infisical
        id: fetch-token
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          TOKEN=$(python -c '
          import urllib.request, json, os
          try:
              project_id = os.environ.get("INFISICAL_PROJECT_ID")
              token = os.environ.get("INFISICAL_TOKEN")
              url = f"https://app.infisical.com/api/v3/secrets/raw/SUPREMEAI_GITHUB_TOKEN?workspaceId={project_id}&environment=prod"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as resp:
                  val = json.loads(resp.read().decode())["secret"]["secretValue"]
                  if val: print(val)
          except Exception:
              pass
          ')
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "token=$TOKEN" >> $GITHUB_OUTPUT
          fi

      - name: 🤖 Create or Update PR to Main Repository
        env:
          # Use Infisical Token, fallback to MIRROR_REPO_TOKEN, fallback to MAIN_REPO_TOKEN
          GITHUB_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.MIRROR_REPO_TOKEN || secrets.MAIN_REPO_TOKEN }}
          STAGING_HEAD: ${{ github.sha }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "❌ GITHUB_TOKEN / MIRROR_REPO_TOKEN secret is missing or empty."
            echo "   Settings → Secrets and variables → Actions → MIRROR_REPO_TOKEN"
            echo "   PAT scope প্রয়োজন: repo (full), workflow"
            exit 1
          fi

          echo "✅ Staging CI Pipeline passed (GREEN 🟢)!"
          PR_BRANCH="promotion/staging-latest"
          TARGET_REPO="paykaribazaronline/supremeai"

          git config --global user.name "SupremeAI Bot"
          git config --global user.email "bot@supremeai.com"
          git config --global lfs.allowincompletepush true

          # PAT দিয়ে target remote সেট করা
          git remote add target https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git || \
            git remote set-url target https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git
          # বাংলা মন্তব্য: Auto-Rebase Alignment — target/main-এর সাথে অটোগ্রাফ রিবাজ করে কনফ্লিক্ট প্রতিরোধ
          echo "🔄 Aligning staging branch with target/main via auto-rebase..."
          git fetch target main
          git rebase target/main || (git rebase --abort && git merge target/main -s recursive -X theirs -m "chore(ci): auto-resolve merge conflict against target/main")

          # বাংলা: Git diff গার্ড — rebase-এর পরেও যদি target/main-এর সাথে কোনো কোড পার্থক্য না থাকে,
          # তাহলে push করবে না (এতে অবাঞ্ছিত promotion loop বন্ধ হবে)।
          echo "🔍 Checking for diff against target/main after rebase..."
          # বাংলা: .github/workflows ফোল্ডার এখন diff-এ অন্তর্ভুক্ত — CI কনফিগ পরিবর্তন sync হওয়া দরকার
          if git diff --quiet target/main HEAD -- . ; then
            echo "✅ No code difference vs target/main — skipping promotion push."
            exit 0
          fi

          echo "🚀 Pushing clean branch to persistent staging branch ($PR_BRANCH)..."
          git checkout -B $PR_BRANCH
          git push target $PR_BRANCH --force -o ci.skip

          # gh CLI — GITHUB_TOKEN env auto-detected করে cross-repo কাজ করে
          EXISTING_PR=$(gh pr list \
            --repo "$TARGET_REPO" \
            --head "$PR_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          PR_BODY="## 🛡️ Staging CI Pass Report

          All quality gates passed on \`SaifulHaqueNiloy/supremeai\`:
          - 🟢 Pytest & Backend Unit Tests
          - 🟢 Vitest & Web Client Tests
          - 🟢 Flutter Unit & Widget Tests
          - 🟢 Preflight & Security Audit

          **Commit:** \`${STAGING_HEAD:0:7}\`
          **Status:** Automated Promotion & Auto-Merge Initiated."

          if [ -z "$EXISTING_PR" ]; then
            echo "🚀 Opening new automated Staging Promotion PR..."
            PR_URL=$(gh pr create \
              --repo "$TARGET_REPO" \
              --head "$PR_BRANCH" \
              --base main \
              --title "🟢 [Staging Promotion] Verified CI Green Build (${STAGING_HEAD:0:7})" \
              --body "$PR_BODY")
            echo "✅ Created PR: $PR_URL"
            EXISTING_PR=$(gh pr list --repo "$TARGET_REPO" --head "$PR_BRANCH" --base main --state open --json number --jq '.[0].number')
          else
            echo "ℹ️ Existing promotion PR #$EXISTING_PR found. Updating title/body..."
            gh pr edit "$EXISTING_PR" \
              --repo "$TARGET_REPO" \
              --title "🟢 [Staging Promotion] Verified CI Green Build (${STAGING_HEAD:0:7})" \
              --body "$PR_BODY"
          fi

          if [ -n "$EXISTING_PR" ]; then
            echo "⚡ Auto-merging PR #$EXISTING_PR directly to target main branch..."
            gh pr merge "$EXISTING_PR" --repo "$TARGET_REPO" --admin --squash --delete-branch=false || \
            gh pr merge "$EXISTING_PR" --repo "$TARGET_REPO" --squash --delete-branch=false
          fi

  canary-deploy:
    name: "🚀 Canary Deploy Backend (Cloud Run)"
    runs-on: ubuntu-latest
    # TEMPORARILY DISABLED: রেন্ডার-এ স্থানান্তরের কারণে জিসিপি ক্যানারি ডিপ্লয়মেন্ট নিষ্ক্রিয় করা হলো।
    if: false
    needs: [backend-core]
    # backend-core এবং security-audit সফল হলে তবেই এটি চলবে
    # deploy-backend এর পরিবর্তে এই জবটি ব্যবহার করা হবে
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: GCP Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🐤 Run Canary Deployment Script
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          # CANDIDATE_REVISION: Cloud Build থেকে পাওয়া নতুন রিভিশন এখানে পাস করতে হবে
          # আপাতত, সর্বশেষ রিভিশন স্বয়ংক্রিয়ভাবে পাওয়ার লজিক canary-deploy.py-তে থাকবে
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ERROR_RATE_THRESHOLD: "0.01" # 1%
          LATENCY_P99_THRESHOLD_MS: "2000" # 2000ms
        run: |
          python .github/scripts/canary-deploy.py

  # ==============================================================================
  # TYPE SYNC (ported from monorepo_ci_cd.yml -> merged here to avoid duplicate workflow)
  # backend/schemas বা generate_types.py বা type_sync_bus.py বদলালে Pydantic->TS/Dart
  # টাইপ রি-জেনারেট ও ড্রিফট চেক করে, পরিবর্তন হলে auto-commit করে।
  # ==============================================================================
  type-sync-check:
    name: 🔄 Type Sync Check (Pydantic → TS/Dart)
    needs: [changes, service-preflight]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Backend
        uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'

      - name: 🔐 Iron Curtain SecretHunter Scan
        working-directory: backend
        run: |
          poetry run python ../scripts/devops/secret_scan_ci.py --path ../backend/ --json

      - name: Run type generation
        working-directory: backend
        run: |
          poetry run python ../scripts/generate_types.py

      - name: Check for drift
        working-directory: backend
        run: |
          poetry run python ../scripts/generate_types.py --validate

      - name: Verify generated files exist
        run: |
          if [ ! -d "packages/shared-types/src/typescript" ]; then
            echo "TypeScript types not generated!"
            exit 1
          fi

          if [ ! -d "packages/shared-types/src/dart" ]; then
            echo "Dart types not generated!"
            exit 1
          fi

          echo "Generated TypeScript files:"
          ls -la packages/shared-types/src/typescript/

          echo "Generated Dart files:"
          ls -la packages/shared-types/src/dart/

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: auto-generate TypeScript/Dart types from Pydantic schemas"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: 'packages/shared-types/**'

  type-sync-integration-test:
    name: 🔗 Type Sync Integration Test
    needs: [type-sync-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic loguru pytest

      - name: Test type sync bus
        run: |
          python -c "
          from backend.core.type_sync_bus import TypeSyncBus
          print('TypeSyncBus imported successfully')
          "

          python -c "
          import asyncio
          from backend.core.type_sync_bus import get_type_sync_bus

          bus = get_type_sync_bus()
          print('TypeSyncBus singleton created successfully')
          "

  smart-summary:
    name: "🧠 Smart Pipeline Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - service-preflight
      - ai-scribe-docs
      - production-readiness
      - docker-build
      - backend-core
      - frontend-core
      - check-render-quota
      - build-backend-image
      - deploy-user-backend
      - deploy-admin-backend
      - deploy-combined-backend
      - deploy-backend
      - flutter-unit-widget-tests
      - build-and-release-desktop
      - deploy-admin-firebase
      - deploy-user-vercel
      - sync-mirror
      - staging-pr-promotion
      - canary-deploy
      - type-sync-check
      - type-sync-integration-test
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 🧠 Generate Smart Pipeline Summary (Zero-Dependency)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/ci_smart_summary.py
      - name: 🚨 Generate Detailed Error Report (Bangla Diagnosis)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/ci_error_report.py
